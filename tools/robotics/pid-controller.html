<body>

<h1 class="sr-only">PID 控制器输出计算器</h1>

<div class="container">
  <div class="card">
    <h2>u = Kp·e + Ki·∫e + Kd·ė</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">比例-积分-微分控制律输出。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">u = Kp·e + Ki·∫e + Kd·ė</div>
      <p class="formula-desc">比例-积分-微分控制律输出。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="kp">比例 Kp</label>
        <input type="number" id="kp" value="1.0" step="0.1">
      </div>
      <div>
        <label for="ki">积分 Ki</label>
        <input type="number" id="ki" value="0.1" step="0.01">
      </div>
      <div>
        <label for="kd">微分 Kd</label>
        <input type="number" id="kd" value="0.05" step="0.01">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="e">误差 e</label>
        <input type="number" id="e" value="2" step="0.1">
      </div>
      <div>
        <label for="ei">误差积分 ∫e</label>
        <input type="number" id="ei" value="1" step="0.1">
      </div>
      <div>
        <label for="ep">上次误差 eₚ</label>
        <input type="number" id="ep" value="0.5" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="dt">采样时间 dt (s)</label>
        <input type="number" id="dt" value="0.1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>u = Kp·e + Ki·∫e + Kd·ė。</li>
        <li>积分项消除稳态误差。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const kp = num('kp'), ki = num('ki'), kd = num('kd'),
                  e = num('e'), ei = num('ei'), ep = num('ep'), dt = num('dt');
            const u = kp * e + ki * ei + kd * (e - ep) / dt;
            ToolBox.setResult('result', dataGrid([
                [(kp * e).toFixed(4), '比例项 Kp·e'],
                [(ki * ei).toFixed(4), '积分项 Ki·∫e'],
                [(kd * (e - ep) / dt).toFixed(4), '微分项 Kd·ė'],
                [u.toFixed(4), '总输出 u']
            ]));
        }
function resetForm(){document.getElementById('kp').value = '1.0';
      document.getElementById('ki').value = '0.1';
      document.getElementById('kd').value = '0.05';
      document.getElementById('e').value = '2';
      document.getElementById('ei').value = '1';
      document.getElementById('ep').value = '0.5';
      document.getElementById('dt').value = '0.1';
      calcTool();}
calcTool();
</script>
