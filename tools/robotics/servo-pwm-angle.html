<h1 class="sr-only">舵机 PWM 角度计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 舵机 PWM 转角度</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">舵机 PWM 转角度</span>
</nav>
<div class="container">
  <div class="card">
    <h2>角度 = (脉宽 − 最小) / (最大 − 最小) × 180°</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由 PWM 脉冲宽度求舵机转角。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">角度 = (脉宽−最小)/(最大−最小)×180°</div>
      <p class="formula-desc">由 PWM 脉冲宽度求舵机转角。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="pwm">脉宽 (µs)</label>
        <input type="number" id="pwm" value="1500" step="10">
      </div>
      <div>
        <label for="pmin">最小脉宽 (µs)</label>
        <input type="number" id="pmin" value="500" step="10">
      </div>
      <div>
        <label for="pmax">最大脉宽 (µs)</label>
        <input type="number" id="pmax" value="2500" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1500µs（500–2500 范围）→ 90°。</li>
        <li>常见舵机 1000–2000µs。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const pwm = num('pwm'), pmin = num('pmin'), pmax = num('pmax');
            const ang = (pwm - pmin) / (pmax - pmin) * 180;
            ToolBox.setResult('result', dataGrid([
                [ang.toFixed(2), '转角 (°)']
            ]));
        }
function resetForm(){document.getElementById('pwm').value = '1500';
      document.getElementById('pmin').value = '500';
      document.getElementById('pmax').value = '2500';
      calcTool();}
calcTool();
</script>
