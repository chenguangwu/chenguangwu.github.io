</nav>
<div class="container">
  <div class="card">
    <h2>由连杆质量、长度与角度求重力扭矩</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入质量 m、臂长 L、角度 θ、g，求关节重力扭矩。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">τ = m·g·r·cosθ</div>
      <p class="formula-desc">输入质量 m、臂长 L、角度 θ、g，求关节重力扭矩。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="5" step="0.5">
      </div>
      <div>
        <label for="L">臂长 L (m)</label>
        <input type="number" id="L" value="0.3" step="0.05">
      </div>
      <div>
        <label for="th">角度 θ (°)</label>
        <input type="number" id="th" value="0" step="5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ = m·g·L·cosθ（水平时最大）。</li>
        <li>m=5,L=0.3,θ=0 → 14.7 N·m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m=num('m'),L=num('L'),th=num('th'),g=num('g');
            const tau=m*g*L*Math.cos(th*Math.PI/180);
            ToolBox.setResult('result', dataGrid([
                [tau.toFixed(3),'重力扭矩 τ (N·m)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '5';
      document.getElementById('L').value = '0.3';
      document.getElementById('th').value = '0';
      document.getElementById('g').value = '9.81';
      calcTool();}
calcTool();
</script>
