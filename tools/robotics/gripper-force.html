<div class="container">
  <div class="card">
    <h2>F = 2τ / L</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由驱动转矩与力臂估算两指总夹持力。">Gripper Force is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F = 2τ / L</div>
      <p class="formula-desc">由驱动转矩与力臂估算两指总夹持力。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="tau">驱动转矩 τ (N·m)</label>
        <input type="number" id="tau" value="5" step="0.5">
      </div>
      <div>
        <label for="L">力臂 L (m)</label>
        <input type="number" id="L" value="0.05" step="0.005">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>F = 2τ/L（双指）。</li>
        <li>τ=5、L=0.05 → 200 N。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const tau = num('tau'), L = num('L');
            const F = 2 * tau / L;
            ToolBox.setResult('result', dataGrid([
                [F.toFixed(2), '夹持力 F (N)'],
                [(F / 9.81).toFixed(3), 'F (kgf)']
            ]));
        }
function resetForm(){document.getElementById('tau').value = '5';
      document.getElementById('L').value = '0.05';
      calcTool();}
calcTool();
</script>
