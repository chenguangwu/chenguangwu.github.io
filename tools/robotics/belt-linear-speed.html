<div class="container">
  <div class="card">
    <h2>v = π · D · n / 60</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由带轮直径与转速求带速。">Belt Linear Speed is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = π</div>
      <p class="formula-desc">由带轮直径与转速求带速。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="D">带轮直径 D (m)</label>
        <input type="number" id="D" value="0.06" step="0.005">
      </div>
      <div>
        <label for="n">转速 n (rpm)</label>
        <input type="number" id="n" value="300" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = π·D·n/60。</li>
        <li>D=0.06、300rpm → 0.942 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const D = num('D'), n = num('n');
            const v = Math.PI * D * n / 60;
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(4), '带速 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('D').value = '0.06';
      document.getElementById('n').value = '300';
      calcTool();}
calcTool();
</script>
