<div class="container">
  <div class="card">
    <h2 data-zh="由输入扭矩与减速比求输出扭矩">Gear Ratio Torque</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入输入扭矩 τ_in、减速比 GR、效率 η，求输出扭矩。">Gear Ratio Torque is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">T_out = T_in · i</div>
      <p class="formula-desc">输入输入扭矩 τ_in、减速比 GR、效率 η，求输出扭矩。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ti">输入扭矩 τ_in (N·m)</label>
        <input type="number" id="ti" value="1" step="0.1">
      </div>
      <div>
        <label for="gr">减速比 GR</label>
        <input type="number" id="gr" value="10" step="0.5">
      </div>
      <div>
        <label for="eta">效率 η</label>
        <input type="number" id="eta" value="0.9" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ_out = τ_in·GR·η。</li>
        <li>τ_in=1,GR=10,η=0.9 → 9 N·m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ti=num('ti'),gr=num('gr'),eta=num('eta');
            const to=ti*gr*eta;
            ToolBox.setResult('result', dataGrid([
                [to.toFixed(2),'输出扭矩 τ_out (N·m)']
            ]));
        }
function resetForm(){document.getElementById('ti').value = '1';
      document.getElementById('gr').value = '10';
      document.getElementById('eta').value = '0.9';
      calcTool();}
calcTool();
</script>
