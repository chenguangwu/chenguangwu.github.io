<div class="container">
  <div class="card">
    <h2>由末端线速度与臂长求关节角速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入末端线速度 v 与臂长 L，求关节角速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ω = v / L</div>
      <p class="formula-desc">输入末端线速度 v 与臂长 L，求关节角速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v">末端线速度 v (m/s)</label>
        <input type="number" id="v" value="0.5" step="0.05">
      </div>
      <div>
        <label for="L">臂长 L (m)</label>
        <input type="number" id="L" value="0.3" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ω = v/L。</li>
        <li>v=0.5,L=0.3 → 1.667 rad/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v=num('v'),L=num('L');
            const w=v/L;
            ToolBox.setResult('result', dataGrid([
                [w.toFixed(3),'角速度 ω (rad/s)']
            ]));
        }
function resetForm(){document.getElementById('v').value = '0.5';
      document.getElementById('L').value = '0.3';
      calcTool();}
calcTool();
</script>
