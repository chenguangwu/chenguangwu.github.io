<div class="container">
  <div class="card">
    <h2 data-zh="由转动惯量与角加速度求所需扭矩">Rotational Inertia Torque</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入转动惯量 I 与角加速度 α，求所需扭矩。">Rotational Inertia Torque is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">τ = I·α</div>
      <p class="formula-desc">输入转动惯量 I 与角加速度 α，求所需扭矩。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="I">转动惯量 I (kg·m²)</label>
        <input type="number" id="I" value="0.5" step="0.1">
      </div>
      <div>
        <label for="a">角加速度 α (rad/s²)</label>
        <input type="number" id="a" value="4" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ = I·α。</li>
        <li>I=0.5,α=4 → 2 N·m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const I=num('I'),a=num('a');
            const tau=I*a;
            ToolBox.setResult('result', dataGrid([
                [tau.toFixed(2),'所需扭矩 τ (N·m)']
            ]));
        }
function resetForm(){document.getElementById('I').value = '0.5';
      document.getElementById('a').value = '4';
      calcTool();}
calcTool();
</script>
