<div class="container">
  <div class="card">
    <h2>x = L₁cosθ₁ + L₂cos(θ₁+θ₂)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由关节角求末端执行器坐标。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">x=L₁cosθ₁+L₂cos(θ₁+θ₂)</div>
      <p class="formula-desc">由关节角求末端执行器坐标。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="t1">关节角 θ₁ (°)</label>
        <input type="number" id="t1" value="30" step="1">
      </div>
      <div>
        <label for="t2">关节角 θ₂ (°)</label>
        <input type="number" id="t2" value="45" step="1">
      </div>
      <div>
        <label for="L1">杆长 L₁ (m)</label>
        <input type="number" id="L1" value="1" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="L2">杆长 L₂ (m)</label>
        <input type="number" id="L2" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>x = L₁cosθ₁ + L₂cos(θ₁+θ₂)。</li>
        <li>θ₁=30°、θ₂=45°、L=1 → 约 (1.297, 1.207)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const t1 = num('t1') * Math.PI / 180, t2 = num('t2') * Math.PI / 180,
                  L1 = num('L1'), L2 = num('L2');
            const x = L1 * Math.cos(t1) + L2 * Math.cos(t1 + t2);
            const y = L1 * Math.sin(t1) + L2 * Math.sin(t1 + t2);
            ToolBox.setResult('result', dataGrid([
                [x.toFixed(4), '末端 x (m)'],
                [y.toFixed(4), '末端 y (m)']
            ]));
        }
function resetForm(){document.getElementById('t1').value = '30';
      document.getElementById('t2').value = '45';
      document.getElementById('L1').value = '1';
      document.getElementById('L2').value = '1';
      calcTool();}
calcTool();
</script>
