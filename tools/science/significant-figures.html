<div class="container">
  <div class="card">
    <h2>🔢 有效数字计算器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按四舍五入规则处理，支持科学计数法与普通小数格式。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算基于标准数学定义与运算规则，结果按计算精度实时输出。 工具名称：有效数字计算器。</p>
</div>


    <div class="input-row">
      <div>
        <label>数值</label>
        <input id="num" type="number" step="any" value="1234.5678" oninput="calc()">
      </div>
      <div>
        <label>有效数字位数</label>
        <input id="digits" type="number" min="1" max="20" value="4" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="swapSign()">正负互换</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>

  <div class="card">
    <h2>📌 示例</h2>
    <ul>
      <li>1.2345，2位有效数字 → 1.2</li>
      <li>0.0012300，3位有效数字 → 0.00123</li>
      <li>12345，2位有效数字 → 1.2×10⁴</li>
    </ul>
  </div>
</div>

<script>
function roundToSig(num, sig) {
  if (!isFinite(num) || num === 0) return num;
  sig = Math.max(1, Math.min(20, Math.floor(sig)));
  const abs = Math.abs(num);
  const exp = Math.floor(Math.log10(abs));
  const factor = Math.pow(10, sig - 1 - exp);
  const rounded = Math.round(num * factor) / factor;
  return rounded;
}

function toScientific(v) {
  if (!isFinite(v) || v === 0) return String(v);
  const str = v.toExponential();
  const parts = str.split('e');
  const n = Number(parts[0]);
  const e = Number(parts[1]);
  const fixed = n.toFixed(4).replace(/\.?0+$/, '');
  return fixed + 'e' + (e >= 0 ? '+' : '') + e;
}

function calc() {
  const num = parseFloat(document.getElementById('num').value);
  const sig = parseInt(document.getElementById('digits').value, 10);
  const out = document.getElementById('result');

  if (!isFinite(num) || !isFinite(sig) || sig < 1) {
    out.innerHTML = '<p style="color:var(--danger)">请输入有效数值与位数</p>';
    return;
  }

  const r = roundToSig(num, sig);
  const scientific = toScientific(r);
  out.innerHTML =
    '<p>原始值：<strong>' + num + '</strong></p>' +
    '<p>保留 ' + sig + ' 位有效数字：<strong>' + r + '</strong></p>' +
    '<p>科学计数法：<strong>' + scientific + '</strong></p>';
}

function swapSign() {
  const input = document.getElementById('num');
  const val = Number(input.value);
  if (isFinite(val)) {
    input.value = String(-val);
    calc();
  }
}

calc();
</script>
