<h1 class="sr-only">恒力做功计算器</h1>

<div class="container">
  <div class="card">
    <h2>功 W = F·d·cosθ</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由力的大小、位移与夹角，按 W = F·d·cosθ 计算恒力所做的功。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">W = F·d·cosθ</div>
      <p class="formula-desc">由力的大小、位移与夹角，按 W = F·d·cosθ 计算恒力所做的功。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="F">力 F (N)</label>
        <input type="number" id="F" value="50" step="1" min="0">
      </div>
      <div>
        <label for="d">位移 d (m)</label>
        <input type="number" id="d" value="10" step="0.5" min="0">
      </div>
      <div>
        <label for="theta">夹角 θ (°)</label>
        <input type="number" id="theta" value="0" step="1" min="0" max="180">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>θ=90° 时力不做功；力与位移反向（θ=180°）时做功为负。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F'), d=num('d'), th=num('theta')*Math.PI/180;
            const W = F*d*Math.cos(th);
            ToolBox.setResult('result', dataGrid([ [W.toFixed(1)+' J', '功 W = F·d·cosθ'] ]));
        }
function resetForm(){document.getElementById('F').value = 50;
      document.getElementById('d').value = 10;
      document.getElementById('theta').value = 0;
      calcTool();}
calcTool();
</script>
