<div class="container">
  <div class="card">
    <h2>功率 P = F·v</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由力与速度（同向），按 P = F·v 计算机械功率。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = F</div>
      <p class="formula-desc">由力与速度（同向），按 P = F·v 计算机械功率。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="F">力 F (N)</label>
        <input type="number" id="F" value="100" step="5" min="0">
      </div>
      <div>
        <label for="v">速度 v (m/s)</label>
        <input type="number" id="v" value="5" step="0.5" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>亦可用 P = W/t；单位 W = J/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F'), v=num('v');
            const P = F*v;
            ToolBox.setResult('result', dataGrid([ [P.toFixed(0)+' W', '功率 P = F·v'] ]));
        }
function resetForm(){document.getElementById('F').value = 100;
      document.getElementById('v').value = 5;
      calcTool();}
calcTool();
</script>
