<body>

<div class="container">
  <div class="card">
    <h2 data-zh="🩹 烧伤面积九分法">🩹 Burn Area (Rule of Nines) Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按中国九分法估算成人体表烧伤面积（TBSA），并可按体重估算 24 小时补液量。">Estimate adult total body surface area (TBSA) burned by the Rule of Nines.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算基于标准数学定义与运算规则，结果按计算精度实时输出。 工具名称：烧伤面积九分法 - 按中国九分法估算成人体表烧伤面积（TBSA）。</p>
</div>


    <div class="input-row">
      <div>
        <label for="age">年龄（岁）</label>
        <input type="number" id="age" min="0" max="120" value="30" oninput="applyDefaults();calc()">
      </div>
      <div>
        <label for="weight">体重（kg，可选）</label>
        <input type="number" id="weight" min="1" max="200" placeholder="例如 60" oninput="calc()">
      </div>
    </div>

    <h3>各部位烧伤面积（%）</h3>
    <div class="part-grid">
      <div class="part-item"><label>头颈部</label><input type="number" id="head" value="9" min="0" oninput="calc()"></div>
      <div class="part-item"><label>右上肢</label><input type="number" id="armR" value="9" min="0" oninput="calc()"></div>
      <div class="part-item"><label>左上肢</label><input type="number" id="armL" value="9" min="0" oninput="calc()"></div>
      <div class="part-item"><label>躯干前面</label><input type="number" id="front" value="18" min="0" oninput="calc()"></div>
      <div class="part-item"><label>躯干后面</label><input type="number" id="back" value="18" min="0" oninput="calc()"></div>
      <div class="part-item"><label>右下肢</label><input type="number" id="legR" value="18" min="0" oninput="calc()"></div>
      <div class="part-item"><label>左下肢</label><input type="number" id="legL" value="18" min="0" oninput="calc()"></div>
      <div class="part-item"><label>会阴</label><input type="number" id="perineum" value="1" min="0" oninput="calc()"></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算面积</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_burn_rule9';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    ['age','weight','head','armR','armL','front','back','legR','legL','perineum'].forEach(id => {
      if(s[id] != null) document.getElementById(id).value = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {};
    ['age','weight','head','armR','armL','front','back','legR','legL','perineum'].forEach(id => {
      s[id] = document.getElementById(id).value;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function applyDefaults(){
  const age = parseInt(document.getElementById('age').value, 10);
  if(isNaN(age) || age >= 12){
    document.getElementById('head').value = 9;
    document.getElementById('legR').value = 18;
    document.getElementById('legL').value = 18;
  } else {
    // simplified pediatric adjustment
    const headVal = 9 + (12 - age);
    const legVal = 18 - (12 - age) / 2;
    document.getElementById('head').value = headVal;
    document.getElementById('legR').value = legVal;
    document.getElementById('legL').value = legVal;
  }
}

function calc(){
  const ids = ['head','armR','armL','front','back','legR','legL','perineum'];
  let total = 0;
  ids.forEach(id => {
    const v = parseFloat(document.getElementById(id).value);
    total += isNaN(v) ? 0 : v;
  });

  let cls = 'grade-excellent', level = '轻度烧伤';
  if(total >= 50){ cls = 'grade-fail'; level = '特重度烧伤'; }
  else if(total >= 30){ cls = 'grade-fail'; level = '重度烧伤'; }
  else if(total >= 10){ cls = 'grade-pass'; level = '中度烧伤'; }

  const weight = parseFloat(document.getElementById('weight').value);
  let fluid = '';
  if(!isNaN(weight) && weight > 0){
    const vol = 4 * weight * total;
    fluid = `<p style="margin-top:12px;">Parkland 公式 24h 补液量（估算）：<strong>${vol.toFixed(0)} mL</strong>，其中首 8 小时约 <strong>${(vol/2).toFixed(0)} mL</strong>。</p>`;
  }

  saveState();
  document.getElementById('result').innerHTML = `
    <p>烧伤总面积 TBSA：<strong style="font-size:20px;">${total.toFixed(1)}</strong>%</p>
    <p>严重程度：<span class="grade-tag ${cls}">${level}</span></p>
    ${fluid}
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：儿童头面、双下肢比例与成人不同，实际烧伤面积需结合烧伤图纸（Lund-Browder）精确评估；补液量需根据尿量、生命体征动态调整。
    </div>
  `;
}

function resetForm(){
  document.getElementById('age').value = '30';
  document.getElementById('weight').value = '';
  applyDefaults();
  document.getElementById('armR').value = '9';
  document.getElementById('armL').value = '9';
  document.getElementById('front').value = '18';
  document.getElementById('back').value = '18';
  document.getElementById('perineum').value = '1';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
</body>
