<div class="container">
  <div class="card">
    <h2>M = E − e·sinE（牛顿迭代求 E）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由平近点角 M 与偏心率 e 数值求解偏近点角 E。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">M = E − e·sinE；牛顿迭代收敛快。 e=0.1、M=90° 时 E≈95.7°。</div>
      <p class="formula-desc">由平近点角 M 与偏心率 e 数值求解偏近点角 E。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Mdeg">平近点角 M (°)</label>
        <input type="number" id="Mdeg" value="90" step="1">
      </div>
      <div>
        <label for="e">偏心率 e</label>
        <input type="number" id="e" value="0.1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>M = E − e·sinE；牛顿迭代收敛快。</li>
        <li>e=0.1、M=90° 时 E≈95.7°。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const M = num('Mdeg') * Math.PI / 180;
            const e = num('e');
            let E = M;
            for (let i = 0; i < 50; i++) {
                const f = E - e * Math.sin(E) - M;
                const fp = 1 - e * Math.cos(E);
                E = E - f / fp;
            }
            ToolBox.setResult('result', dataGrid([
                [(E * 180 / Math.PI).toFixed(3), '偏近点角 E (°)'],
                [(E).toFixed(5), 'E (rad)']
            ]));
        }
function resetForm(){document.getElementById('Mdeg').value = '90';
      document.getElementById('e').value = '0.1';
      calcTool();}
calcTool();
</script>
