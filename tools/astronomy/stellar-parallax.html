<div class="container">
  <div class="card">
    <h2 data-zh="视差距离（d = 1 / p pc）">Stellar Parallax</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="周年视差 p（角秒）与距离（秒差距）互为倒数。">Stellar Parallax is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = 1 / p pc</div>
      <p class="formula-desc">周年视差 p（角秒）与距离（秒差距）互为倒数。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="p">视差 p (″)</label>
        <input type="number" id="p" value="0.1" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>d(pc) = 1/p(″)；p=0.1″ 对应 10 pc。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p = num('p');
            const d = 1 / p;
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(3), '距离 d (pc)'],
                [(d * 3.262).toFixed(3), 'd (光年)']
            ]));
        }
function resetForm(){document.getElementById('p').value = '0.1';
      calcTool();}
calcTool();
</script>
