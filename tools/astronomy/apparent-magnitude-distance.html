<div class="container">
  <div class="card">
    <h2>距离模数（d = 10^(1 + (m−M)/5) pc）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由视星等与绝对星等差求天体距离。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = 10^(1 + (m</div>
      <p class="formula-desc">由视星等与绝对星等差求天体距离。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="m">视星等 m</label>
        <input type="number" id="m" value="1" step="0.1">
      </div>
      <div>
        <label for="M">绝对星等 M</label>
        <input type="number" id="M" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>m − M = 5·log₁₀(d) − 5；d 以秒差距计。</li>
        <li>m=M 时 d=10 pc。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m = num('m'), M = num('M');
            const d = Math.pow(10, 1 + (m - M) / 5);
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(3), '距离 d (pc)'],
                [(d * 3.262).toFixed(3), 'd (光年)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '1';
      document.getElementById('M').value = '1';
      calcTool();}
calcTool();
</script>
