<div class="container">
  <div class="card">
    <h2 data-zh="事件视界（r_s = 2·G·M / c²）">Schwarzschild Radius</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="质量 M 坍缩成黑洞的事件视界半径。">Schwarzschild Radius is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">r_s = 2·G·M / c²</div>
      <p class="formula-desc">质量 M 坍缩成黑洞的事件视界半径。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="M">质量 M (kg)</label>
        <input type="number" id="M" value="1.989e30" step="1e28">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>r_s = 2GM/c²；太阳质量约 2.95 km。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const M = num('M');
            const Gc = 6.674e-11, c = 299792458;
            const rs = 2 * Gc * M / (c * c);
            ToolBox.setResult('result', dataGrid([
                [(rs / 1000).toFixed(3), '史瓦西半径 r_s (km)'],
                [(rs).toFixed(1), 'r_s (m)']
            ]));
        }
function resetForm(){document.getElementById('M').value = '1.989e30';
      calcTool();}
calcTool();
</script>
