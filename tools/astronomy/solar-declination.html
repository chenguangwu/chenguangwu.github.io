<div class="container">
  <div class="card">
    <h2 data-zh="赤纬（δ ≈ 23.44°·sin(360°·(284+N)/365)）">Solar Declination</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由年内第 N 天估算太阳赤纬（Cooper 近似）。">Solar Declination is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">δ ≈ 23.44</div>
      <p class="formula-desc">由年内第 N 天估算太阳赤纬（Cooper 近似）。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="N">年积日 N</label>
        <input type="number" id="N" value="172" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>δ ≈ 23.44°·sin(360°(284+N)/365)；N=172(夏至)≈+23.44°。</li>
        <li>N=355(冬至)≈−23.44°。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const N = num('N');
            const d = 23.44 * Math.sin(360 * (284 + N) / 365 * Math.PI / 180);
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(3), '太阳赤纬 δ (°)'],
                [(d > 0 ? '北半球夏半年' : '冬半年'), '半球']
            ]));
        }
function resetForm(){document.getElementById('N').value = '172';
      calcTool();}
calcTool();
</script>
