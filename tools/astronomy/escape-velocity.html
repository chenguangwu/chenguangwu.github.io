<div class="container">
  <div class="card">
    <h2>逃逸速度（v = √(2·G·M / R)）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">摆脱天体引力束缚所需最小速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = √(2GM/R)；地球约 11.2 km/s。</div>
      <p class="formula-desc">摆脱天体引力束缚所需最小速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="M">天体质量 (kg)</label>
        <input type="number" id="M" value="5.97e24" step="1e23">
      </div>
      <div>
        <label for="R">天体半径 (m)</label>
        <input type="number" id="R" value="6.371e6" step="1e5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = √(2GM/R)；地球约 11.2 km/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const M = num('M'), R = num('R');
            const Gc = 6.674e-11;
            const v = Math.sqrt(2 * Gc * M / R);
            ToolBox.setResult('result', dataGrid([
                [(v / 1000).toFixed(3), '逃逸速度 v (km/s)'],
                [(v).toFixed(1), 'v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('M').value = '5.97e24';
      document.getElementById('R').value = '6.371e6';
      calcTool();}
calcTool();
</script>
