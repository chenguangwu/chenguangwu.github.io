<div class="container">
  <div class="card">
    <h2 data-zh="引力（F = G·m₁·m₂ / r²）">Gravitational Force</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="两质点间的万有引力。">Gravitational Force is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F = G·m₁·m₂/r²；地月引力约 1.98×10²⁰ N。</div>
      <p class="formula-desc">两质点间的万有引力。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m1">质量 m₁ (kg)</label>
        <input type="number" id="m1" value="5.97e24" step="1e23">
      </div>
      <div>
        <label for="m2">质量 m₂ (kg)</label>
        <input type="number" id="m2" value="7.35e22" step="1e21">
      </div>
      <div>
        <label for="r">距离 (m)</label>
        <input type="number" id="r" value="3.84e8" step="1e7">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>F = G·m₁·m₂/r²；地月引力约 1.98×10²⁰ N。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m1 = num('m1'), m2 = num('m2'), r = num('r');
            const Gc = 6.674e-11;
            const F = Gc * m1 * m2 / (r * r);
            ToolBox.setResult('result', dataGrid([
                [F.toExponential(3), '引力 F (N)'],
                [(F / 1e20).toFixed(3), 'F (×10²⁰ N)']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '5.97e24';
      document.getElementById('m2').value = '7.35e22';
      document.getElementById('r').value = '3.84e8';
      calcTool();}
calcTool();
</script>
