</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="近似距离（d = c·z / H₀）">Hubble Redshift Distance</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="低红移下，退行速度与距离成线性关系。">Hubble Redshift Distance is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = c·z / H₀</div>
      <p class="formula-desc">低红移下，退行速度与距离成线性关系。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="z">红移 z</label>
        <input type="number" id="z" value="0.01" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>d ≈ c·z/H₀（低红移近似）；H₀=70 km/s/Mpc。</li>
        <li>z=0.01 约 42.8 Mpc。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const z = num('z');
            const c = 299792.458; // km/s
            const H0 = 70; // km/s/Mpc
            const d = c * z / H0;
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(2), '距离 d (Mpc)'],
                [(d * 3.262).toFixed(2), 'd (百万光年)']
            ]));
        }
function resetForm(){document.getElementById('z').value = '0.01';
      calcTool();}
calcTool();
</script>
