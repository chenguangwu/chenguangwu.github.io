<div class="container">
  <div class="card">
    <h2 data-zh="轨道周期（T = 2π·√(a³ / (G·M))）">Kepler Third Period</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="圆轨道绕中心天体运行的周期由半长轴与中心质量决定。">Kepler Third Period is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">T = 2π</div>
      <p class="formula-desc">圆轨道绕中心天体运行的周期由半长轴与中心质量决定。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="a">半长轴 (m)</label>
        <input type="number" id="a" value="1.496e11" step="1e9">
      </div>
      <div>
        <label for="M">中心质量 (kg)</label>
        <input type="number" id="M" value="1.989e30" step="1e28">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>T = 2π√(a³/GM)；地球绕日约 365.2 天。</li>
        <li>a 取 1 AU、M 取太阳质量即得一年。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a = num('a'), M = num('M');
            const Gc = 6.674e-11;
            const T = 2 * Math.PI * Math.sqrt(a * a * a / (Gc * M));
            ToolBox.setResult('result', dataGrid([
                [(T / 86400).toFixed(2), '轨道周期 T (天)'],
                [(T).toExponential(3), 'T (s)']
            ]));
        }
function resetForm(){document.getElementById('a').value = '1.496e11';
      document.getElementById('M').value = '1.989e30';
      calcTool();}
calcTool();
</script>
