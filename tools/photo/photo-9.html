<div class="container">
  <div class="card">
    <h2>🔮 衍射极限光圈</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算传感器像素密度下的衍射极限光圈。</p>
    <div class="input-row"><label>像素间距 µm</label><input type="number" id="pitch" value="5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>光波长 nm</label><input type="number" id="wavelength" value="550" step="any" oninput="calc()"></div>
    <div class="input-row"><label>容许模糊圈倍数</label><input type="number" id="coarse" value="2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="32" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">衍射模糊 ≈ 2.44 · λ · N<br>当模糊大于像素间距时光圈过小的影响可见</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">小像素传感器更早遇到衍射极限。</p>
  </div>
</div>

<script>
function calc(){
  const pitch = +document.getElementById('pitch').value || 0;
  const wavelength = +document.getElementById('wavelength').value || 0;
  const coarse = +document.getElementById('coarse').value || 0;
  let html = '';
  const __v0 = (2.44*wavelength/1000);
  html += `<p>艾里斑直径 µm：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> µm</p>`;
  const __v1 = (coarse*pitch/(2.44*wavelength/1000));
  html += `<p>建议最小光圈：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> f</p>`;
  const __v2 = (pitch/(2.44*wavelength/1000));
  html += `<p>像素级极限：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(1)}</strong> f</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
