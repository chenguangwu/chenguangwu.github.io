    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算 RAW/JPEG 图像文件大小。</p>
    <div class="input-row"><label>像素百万</label><input type="number" id="mp" value="24" step="any" oninput="calc()"></div>
    <div class="input-row"><label>位深</label><input type="number" id="depth" value="14" step="1" oninput="calc()"></div>
    <div class="input-row"><label>压缩比 1=无损 3=RAW 10=JPEG</label><input type="number" id="compression" value="3" step="any" oninput="calc()"></div>

    </div>

  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">未压缩大小 = 像素数 × 位深 / 8<br>压缩后 ≈ 未压缩 / 压缩比</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">实际大小因图像内容而异。</p>

<script>
function calc(){
  const mp = +document.getElementById('mp').value || 0;
  const depth = +document.getElementById('depth').value || 0;
  const compression = +document.getElementById('compression').value || 0;
  let html = '';
  const __v0 = (mp*1000000*depth/8/1024/1024);
  html += `<p>未压缩 MB：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> MB</p>`;
  const __v1 = (mp*1000000*depth/8/1024/1024/compression);
  html += `<p>压缩后估算：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> MB</p>`;
  const __v2 = (depth);
  html += `<p>每像素 bit：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> bit</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
