    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由闪光指数与距离求可用光圈。</p>
    <div class="input-row"><label>闪光指数</label><input type="number" id="gn" value="40" step="any" oninput="calc()"></div>
    <div class="input-row"><label>距离 m</label><input type="number" id="dist" value="5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>ISO</label><input type="number" id="iso" value="100" step="any" oninput="calc()"></div>
    <div class="toolbar">

  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">光圈 = GN / 距离（ISO100）</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">ISO 翻倍时有效距离约增 1.4 倍。</p>

<script>
function calc(){
  const gn = +document.getElementById('gn').value || 0;
  const dist = +document.getElementById('dist').value || 0;
  const iso = +document.getElementById('iso').value || 0;
  let html = '';
  const __v0 = (gn/dist);
  html += `<p>可用光圈(ISO100)：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> f</p>`;
  const __v1 = (gn/2.8);
  html += `<p>最远有效(2.8)：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> m</p>`;
  const __v2 = (Math.sqrt(iso/100));
  html += `<p>ISO修正系数：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> ×</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
