<div class="container">
  <div class="card">
    <h2>📸 包围曝光张数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算 HDR 包围曝光所需张数与步长。</p>
    <div class="input-row"><label>总 EV 范围</label><input type="number" id="ev_total" value="12" step="any" oninput="calc()"></div>
    <div class="input-row"><label>步长 EV</label><input type="number" id="step" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>基准 EV</label><input type="number" id="base" value="0" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="15" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">张数 = 2 × ceil(总范围 / 步长) + 1</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">确保相邻两张重叠至少 1 EV。</p>
  </div>
</div>

<script>
function calc(){
  const ev_total = +document.getElementById('ev_total').value || 0;
  const step = +document.getElementById('step').value || 0;
  const base = +document.getElementById('base').value || 0;
  let html = '';
  const __v0 = (Math.ceil(ev_total/step)*2+1);
  html += `<p>所需张数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 张</p>`;
  const __v1 = (Math.ceil(ev_total/step)*step*2);
  html += `<p>实际覆盖 EV：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> EV</p>`;
  const __v2 = (base+" ±"+Math.ceil(ev_total/step)*step+" EV");
  html += `<p>档位列表：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
