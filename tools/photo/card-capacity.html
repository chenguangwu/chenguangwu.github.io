    <h2>🗃️ 存储卡可拍张数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据容量与单张大小估算可拍张数。</p>
    <div class="input-row"><label>卡容量 GB</label><input type="number" id="card" value="64" step="any" oninput="calc()"></div>
    <div class="input-row"><label>单张 MB</label><input type="number" id="per" value="25" step="any" oninput="calc()"></div>
    <div class="input-row"><label>JPEG单张 MB</label><input type="number" id="jpeg" value="5" step="any" oninput="calc()"></div>
    <div class="toolbar">

    </div>

  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">张数 = 容量(GB)×1000 / 单张大小(MB)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">RAW 通常 20–50 MB，JPEG 较小。</p>

<script>
function calc(){
  const card = +document.getElementById('card').value || 0;
  const per = +document.getElementById('per').value || 0;
  const jpeg = +document.getElementById('jpeg').value || 0;
  let html = '';
  const __v0 = (card*1000/per);
  html += `<p>RAW 张数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 张</p>`;
  const __v1 = (card*1000/jpeg);
  html += `<p>JPEG 张数：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 张</p>`;
  const __v2 = (card*1000/per/10);
  html += `<p>可录分钟@10fps：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 分</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
