<div class="container">

    <h2>🌑 ND 滤镜快门换算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算加 ND 滤镜后的延长快门速度。</p>
    <div class="input-row"><label>基准快门 秒</label><input type="number" id="base" value="0.01" step="any" oninput="calc()"></div>
    <div class="input-row"><label>ND 档数</label><input type="number" id="stops" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标快门 秒</label><input type="number" id="target" value="10" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">新快门 = 基准 × 2^档数</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">ND1000 约 10 档，可将水流拍成丝绢。</p>
  </div>
</div>

<script>
function calc(){
  const base = +document.getElementById('base').value || 0;
  const stops = +document.getElementById('stops').value || 0;
  const target = +document.getElementById('target').value || 0;
  let html = '';
  const __v0 = (base*Math.pow(2,stops));
  html += `<p>新快门：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> s</p>`;
  const __v1 = (Math.pow(2,stops));
  html += `<p>延长倍数：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> ×</p>`;
  const __v2 = (Math.log2(target/base));
  html += `<p>达标档数：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(1)}</strong> 档</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
