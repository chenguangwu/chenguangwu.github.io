<div class="container">
  <div class="card">
    <h2>👁️ 视角计算器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算镜头水平与垂直视角。</p>
    <div class="input-row"><label>焦距 mm</label><input type="number" id="focal" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>传感器宽度 mm</label><input type="number" id="sensor_w" value="36" step="any" oninput="calc()"></div>
    <div class="input-row"><label>传感器高度 mm</label><input type="number" id="sensor_h" value="24" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="120" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">视角 = 2 · arctan(传感器边长 / (2 · 焦距))</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">全画幅默认 36×24 mm。</p>
  </div>
</div>

<script>
function calc(){
  const focal = +document.getElementById('focal').value || 0;
  const sensor_w = +document.getElementById('sensor_w').value || 0;
  const sensor_h = +document.getElementById('sensor_h').value || 0;
  let html = '';
  const __v0 = (2*Math.atan(sensor_w/(2*focal))*180/Math.PI);
  html += `<p>水平视角：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> °</p>`;
  const __v1 = (2*Math.atan(sensor_h/(2*focal))*180/Math.PI);
  html += `<p>垂直视角：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> °</p>`;
  const __v2 = (2*Math.atan(Math.sqrt(sensor_w*sensor_w+sensor_h*sensor_h)/(2*focal))*180/Math.PI);
  html += `<p>对角线视角：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> °</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
