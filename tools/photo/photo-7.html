    <div class="input-row"><label>传感器宽度 mm</label><input type="number" id="sensor_w" value="36" step="any" oninput="calc()"></div>
    <div class="input-row"><label>被摄物实际宽度 mm</label><input type="number" id="object_w" value="10" step="any" oninput="calc()"></div>

<script>
function calc(){
  const sensor_w = +document.getElementById('sensor_w').value || 0;
  const object_w = +document.getElementById('object_w').value || 0;
  const image_w = +document.getElementById('image_w').value || 0;
  let html = '';
  const __v0 = (image_w/object_w);
  html += `<p>放大倍率：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> x</p>`;
  const __v1 = (image_w/sensor_w*100);
  html += `<p>传感器占比：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> %</p>`;
  const __v2 = (sensor_w);
  html += `<p>可拍最大物体：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> mm</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
