<div class="container">
  <div class="card">
    <h2>🔬 微距放大率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据焦距与物距计算微距放大率。</p>
    <div class="input-row"><label>焦距 mm</label><input type="number" id="focal" value="100" step="any" oninput="calc()"></div>
    <div class="input-row"><label>物距 mm</label><input type="number" id="s" value="150" step="any" oninput="calc()"></div>
    <div class="input-row"><label>画幅高 mm</label><input type="number" id="frame" value="24" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">放大率 m = f/(S−f)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">m=1 为等倍微距，标本与像等大。</p>
  </div>
</div>

<script>
function calc(){
  const focal = +document.getElementById('focal').value || 0;
  const s = +document.getElementById('s').value || 0;
  const frame = +document.getElementById('frame').value || 0;
  let html = '';
  const __v0 = (focal/(s-focal));
  html += `<p>放大率：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> ×</p>`;
  const __v1 = (focal/(s-focal)*frame);
  html += `<p>像高 mm：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> mm</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
