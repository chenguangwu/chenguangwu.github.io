    <h2>🧭 curl 命令解析器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">从 curl 命令提取 URL、方法、Header 与 Body。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本开发工具在前端本地完成解析、转换与处理，代码不离开浏览器，遵循对应语法与格式规范。 工具名称：curl 命令解析器。</p>

    <div class="input-row">
      <label>curl 命令</label>
      <textarea id="cmd">curl -X POST 'https://example.com/api/v1/pay' -H 'Content-Type: application/json' -d '{"name":"test"}'</textarea>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="parse()">解析</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="out"></div>
  </div>
</div>

<script>
function parse() {
  const raw = document.getElementById('cmd').value || '';
  const tokens = raw.match(/(?:\"[^\"]*\"|'[^']*'|\S)+/g) || [];

  let method = 'GET';
  const headers = [];
  let data = '';
  let url = '';

  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === 'curl' || t === 'curl.exe') continue;
    if ((t === '-X' || t === '--request') && tokens[i+1]) {
      method = tokens[i+1].toUpperCase(); i += 1; continue;
    }
    if ((t === '-H' || t === '--header') && tokens[i+1]) {
      headers.push(trimQuote(tokens[i+1])); i += 1; continue;
    }
    if ((t === '-d' || t === '--data' || t === '--data-raw') && tokens[i+1]) {
      data = trimQuote(tokens[i+1]); i += 1; continue;
    }
    if (!t.startsWith('-') && !url) {
      url = trimQuote(t);
    }
  }

  document.getElementById('out').innerHTML =
    `<p>方法：<strong>${method}</strong></p>` +
    `<p>URL：<strong>${url || '未识别'}</strong></p>` +
    `<p>Headers：</p>` +
    `<div>${headers.length ? headers.map(h => `<p>${h}</p>`).join('') : '<p>无</p>'}</div>` +
    `<p>Body：</p>` +
    `<pre style="white-space:pre-wrap">${data || '无'}</pre>`;
}

function trimQuote(v) {
  return v.replace(/^['\"]|['\"]$/g, '');
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg668'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg346'));
}

parse();
</script>
