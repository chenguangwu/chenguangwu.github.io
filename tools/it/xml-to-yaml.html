    <h2>🧩 XML 转 YAML 转换器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">在配置迁移、接口联调时常需要把 XML 转成更易读的 YAML。粘贴 XML，立即得到结构等价的 YAML。</p>
    <div class="input-row">
      <div>
        <label for="source">XML 源文本</label>
        <textarea id="source" rows="8" style="width:100%;font-family:monospace;font-size:12.5px;"><note>&#10;  <to>Tony</to>&#10;  <from>Anna</from>&#10;  <heading>Reminder</heading>&#10;  <body>Don't forget me!</body>&#10;  <items id=&quot;1&quot;>&#10;    <item>Apple</item>&#10;    <item>Banana</item>&#10;  </items>&#10;</note></textarea>

<div class="tool-notes" style="--tool-accent:#3B82F6;">
  <div class="tool-notes-title">⚠️ 使用说明与注意事项</div>
  <ul>
        <li>XML 属性在 YAML 中表示为以 @ 开头的键（如 @id），元素文本表示为 #text。</li>
        <li>重复的同名子元素会转为 YAML 列表；多个同级元素按顺序保留。</li>
        <li>命名空间、CDATA、注释等会被忽略或归一化；极复杂 XML 建议人工核对。</li>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function escH(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return escXml(s).replace(/"/g,'&quot;');}
function xmlToJson(xml){
  xml=xml.replace(/<!--[\s\S]*?-->/g,'').replace(/<\?[\s\S]*?\?>/g,'').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,function(m,c){return c;});
  var pos=0;
  function skipws(){ while(pos<xml.length && /\s/.test(xml[pos])) pos++; }
  function parseEl(){
    var gt=xml.indexOf('>',pos); if(gt<0) return null;
    var head=xml.slice(pos+1,gt); pos=gt+1;
    var selfClose=false;
    if(head.slice(-1)==='/'){ selfClose=true; head=head.slice(0,-1); }
    var sp=head.search(/\s/);
    var name= sp<0? head : head.slice(0,sp);
    var attrStr= sp<0? '' : head.slice(sp+1);
    var attrs={};
    var re=/([\w:-]+)\s*=\s*"([^"]*)"/g, m;
    while((m=re.exec(attrStr))){ attrs[m[1]]=m[2]; }
    if(selfClose) return {name:name, val:nodeVal(name,attrs,null,'')};
    var children=[]; var text='';
    while(pos<xml.length){
      if(xml[pos]==='<'){
        if(xml.substr(pos,2)==='</'){ var cgt=xml.indexOf('>',pos); pos=cgt+1; break; }
        var ch=parseEl(); if(ch) children.push(ch);
      } else {
        var nxt=xml.indexOf('<',pos); if(nxt<0) nxt=xml.length;
        var tx=xml.slice(pos,nxt); pos=nxt;
        if(tx.trim()!=='') text+=tx;
      }
    }
    return {name:name, val:nodeVal(name,attrs,children,text)};
  }
  function nodeVal(name,attrs,children,text){
    if(children && children.length){
      var obj={};
      for(var a in attrs){ if(attrs.hasOwnProperty(a)) obj['@'+a]=attrs[a]; }
      var groups={};
      for(var k=0;k<children.length;k++){ var c=children[k]; (groups[c.name]=groups[c.name]||[]).push(c.val); }
      for(var g in groups){ obj[g]= groups[g].length===1? groups[g][0] : groups[g]; }
      if(text && text.trim()) obj['#text']=text.trim();
      return obj;
    }
    var v=text?text.trim():'';
    if(Object.keys(attrs).length){ var o={}; for(var a2 in attrs)o['@'+a2]=attrs[a2]; if(v)o['#text']=v; return o; }
    return v;
  }
  skipws();
  if(xml[pos]!=='<') return {__err:'输入不是合法的 XML（未找到根元素）'};
  var root=parseEl();
  if(!root) return {__err:'XML 解析失败'};
  var out={}; out[root.name]=root.val;
  return out;
}
function jsonToXml(obj){
  function ser(name,val){
    if(val && typeof val==='object' && !Array.isArray(val)){
      var attrs=''; var inner='';
      for(var k in val){
        if(k[0]==='@') attrs+=' '+k.slice(1)+'="'+escAttr(val[k])+'"';
        else if(k==='#text') inner+=val[k];
        else { var v=val[k]; if(Array.isArray(v)){ for(var i=0;i<v.length;i++) inner+=ser(k,v[i]); } else inner+=ser(k,v); }
      }
      return '<'+name+attrs+'>'+inner+'</'+name+'>';
    }
    if(Array.isArray(val)){ return val.map(function(x){return ser(name,x);}).join(''); }
    return '<'+name+'>'+escXml(val===null?'':val)+'</'+name+'>';
  }
  var keys=Object.keys(obj);
  if(keys.length!==1) return '<root>'+keys.map(function(k){return ser(k,obj[k]);}).join('')+'</root>';
  return ser(keys[0], obj[keys[0]]);
}

function yScalar(s){
  s=s.trim();
  if(s==='')return '';
  if((s[0]==='"'&&s.slice(-1)==='"')||(s[0]==="'"&&s.slice(-1)==="'")) return s.slice(1,-1);
  if(s==='true')return true; if(s==='false')return false;
  if(s==='null'||s==='~')return null;
  if(/^-?\d+$/.test(s))return parseInt(s,10);
  if(/^-?\d+\.\d+$/.test(s))return parseFloat(s);
  return s;
}
function yIsMapEntry(s){ var kv=s.match(/^([^:]+):\s?(.*)$/); return kv && /^[\u4e00-\u9fa5A-Za-z0-9_\-\s]/.test(kv[1]) && s.indexOf(':')>0; }
function parseYaml(text){
  var lines=text.replace(/\r/g,'').split('\n');
  var items=[];
  for(var i=0;i<lines.length;i++){ var raw=lines[i]; var s=raw.trim(); if(!s||s[0]==='#') continue; items.push({ind:raw.length-raw.trimStart().length, content:s}); }
  if(!items.length) return {};
  var p={i:0};
  return yBlock(items, items[0].ind, p);
}
function yBlock(items, indent, p){
  if(p.i>=items.length) return {};
  if(items[p.i].content[0]==='-'){
    var arr=[];
    while(p.i<items.length && items[p.i].ind===indent && items[p.i].content[0]==='-'){
      var item=items[p.i].content.slice(1).trim(); p.i++;
      if(item===''){ arr.push(yBlock(items, items[p.i].ind, p)); }
      else if(yIsMapEntry(item)){ arr.push(yMapFrom(items, indent+2, p, item)); }
      else { arr.push(yScalar(item)); }
    }
    return arr;
  }
  var obj={};
  while(p.i<items.length && items[p.i].ind===indent){
    var line=items[p.i].content;
    var kv=line.match(/^([^:]+):\s?(.*)$/);
    if(!kv){ p.i++; continue; }
    var key=kv[1].trim(); var val=kv[2].trim(); p.i++;
    if(val===''){ if(p.i<items.length && items[p.i].ind>indent) obj[key]=yBlock(items, items[p.i].ind, p); else obj[key]={}; }
    else obj[key]=yScalar(val);
  }
  return obj;
}
function yMapFrom(items, mapIndent, p, firstItem){
  var m={};
  var kv=firstItem.match(/^([^:]+):\s?(.*)$/);
  var key=kv[1].trim(); var val=kv[2].trim();
  if(val===''){ if(p.i<items.length && items[p.i].ind>mapIndent) m[key]=yBlock(items, items[p.i].ind, p); else m[key]={}; }
  else m[key]=yScalar(val);
  while(p.i<items.length && items[p.i].ind===mapIndent && items[p.i].content[0]!=='-'){
    var line=items[p.i].content; var kv2=line.match(/^([^:]+):\s?(.*)$/);
    if(!kv2) break;
    var k2=kv2[1].trim(); var v2=kv2[2].trim(); p.i++;
    if(v2===''){ if(p.i<items.length && items[p.i].ind>mapIndent) m[k2]=yBlock(items, items[p.i].ind, p); else m[k2]={}; }
    else m[k2]=yScalar(v2);
  }
  return m;
}
function yNeedQ(v){ return /[:#\-\[\]\{\},]/.test(v)||v.trim()!==v||v===''||/^\d/.test(v)||v==='true'||v==='false'||v==='null'; }
function yVal(v){
  if(v===null||v===undefined) return 'null';
  if(typeof v==='boolean') return v?'true':'false';
  if(typeof v==='number') return String(v);
  if(typeof v==='string'){ return yNeedQ(v)? ('"'+v.replace(/"/g,'\\"')+'"') : v; }
  return String(v);
}
function dumpYaml(node,pad,sort,isRoot){
  if(isRoot===undefined)isRoot=true;
  var out='';
  if(node instanceof Array){
    for(var i=0;i<node.length;i++){
      var it=node[i];
      if(it!==null && typeof it==='object' && !(it instanceof Array)){
        var ks=Object.keys(it); if(sort)ks=ks.slice().sort();
        for(var j=0;j<ks.length;j++){ var kk=ks[j]; out+=(j===0?pad+'- ':pad+'  ')+kk+': '+yVal(it[kk])+'\n'; }
      } else out+=pad+'- '+yVal(it)+'\n';
    }
    return out;
  }
  var keys=Object.keys(node); if(sort)keys=keys.slice().sort();
  for(var i=0;i<keys.length;i++){
    var k=keys[i]; var v=node[k];
    var p=isRoot?'':pad;
    if(v instanceof Array) out+=p+k+':\n'+dumpYaml(v,pad+'  ',sort,false);
    else if(v!==null && typeof v==='object') out+=p+k+':\n'+dumpYaml(v,pad+'  ',sort,false);
    else out+=p+k+': '+yVal(v)+'\n';
  }
  return out;
}

var src=document.getElementById('source').value||'';
if(!src.trim()){ document.getElementById('result').innerHTML='<p class="muted">请输入 XML 文本</p>'; return; }
var obj=xmlToJson(src);
if(obj && obj.__err){ document.getElementById('result').innerHTML='<p class="muted">解析失败：'+escH(obj.__err)+'</p>'; return; }
var pad = document.getElementById('indent').value==='tab' ? '\t' : (' ').repeat(parseInt(document.getElementById('indent').value||'2',10));
var sort=document.getElementById('top_1').checked;
var yaml=dumpYaml(obj,pad,sort);
document.getElementById('result').innerHTML='<div class="result-title">YAML 输出</div><pre class="code-block">'+escH(yaml)+'</pre>';}
function resetForm(){document.getElementById('source').value='<note>\n  <to>Tony</to>\n  <from>Anna</from>\n  <heading>Reminder</heading>\n  <body>Don\'t forget me!</body>\n  <items id="1">\n    <item>Apple</item>\n    <item>Banana</item>\n  </items>\n</note>';
      document.getElementById('indent').selectedIndex=0;
      document.getElementById('top_1').checked=false;
      calcTool();}
calcTool();
</script>
