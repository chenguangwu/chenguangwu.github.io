<body>
<h1 class="sr-only">文本空白清理工具</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 文本空白清理工具</span>

<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#3B82F6;">
    <h2>🧹 文本空白清理工具</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">从网页、PDF、表格复制来的文本常常带着多余空行和首尾空格。粘贴进来，勾选需要的清理项，立即得到整洁文本。</p>
    <div class="input-row">
      <div>
        <label for="source">待清理文本</label>
        <textarea id="source" rows="8" style="width:100%;font-family:monospace;font-size:12.5px;">  第一行   &#10;&#10;  第二行   有多余   空格&#10;&#10;&#10;  第三行&#10;</textarea>
      </div>
      <div>
        <label for="trim">去除每行首尾空白</label>
        <div style="display:flex;flex-wrap:wrap;gap:0 16px;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin:4px 0;"><input type="checkbox" id="top_trim" value="0" data-name="是">是</label></div>
      </div>
      <div>
        <label for="blank">删除空行</label>
        <div style="display:flex;flex-wrap:wrap;gap:0 16px;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin:4px 0;"><input type="checkbox" id="top_blank" value="0" data-name="是">是</label></div>
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="collapse">合并连续空格为单个</label>
        <div style="display:flex;flex-wrap:wrap;gap:0 16px;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin:4px 0;"><input type="checkbox" id="top_collapse" value="0" data-name="是">是</label></div>
      </div>
      <div>
        <label for="trail">确保末尾单个换行</label>
        <div style="display:flex;flex-wrap:wrap;gap:0 16px;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin:4px 0;"><input type="checkbox" id="top_trail" value="0" data-name="是">是</label></div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
<div class="tool-notes" style="--tool-accent:#3B82F6;">
  <div class="tool-notes-title">⚠️ 使用说明与注意事项</div>
  <ul>
        <li>清理为纯本地操作，文本不会上传；适合处理从网页/PDF/Excel 复制的乱序文本。</li>
        <li>各选项可单独勾选；默认全部开启即可应付大多数场景。</li>
        <li>合并空格仅针对空格与制表符，不影响换行。</li>
  </ul>
</div>

</div>
<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function escH(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){var text=document.getElementById('source').value||'';
var rawLines=text.split(/\n|\r\n|\r/);
var rawChars=text.length;
var blankBefore=rawLines.filter(function(l){return l.trim()==='';}).length;
var lines=rawLines;
if(document.getElementById('top_trim').checked) lines=lines.map(function(l){return l.replace(/^\s+|\s+$/g,'');});
if(document.getElementById('top_blank').checked) lines=lines.filter(function(l){return l.trim()!=='';});
if(document.getElementById('top_collapse').checked) lines=lines.map(function(l){return l.replace(/[ \t]+/g,' ');});
var out=lines.join('\n');
if(document.getElementById('top_trail').checked){ out=out.replace(/\n+$/,'')+'\n'; }
var blankAfter=lines.filter(function(l){return l.trim()==='';}).length;
// 空白字符明细
var tabCount=(text.match(/\t/g)||[]).length;
var spaceCount=(text.match(/ /g)||[]).length;
var crlfCount=(text.match(/\r\n/g)||[]).length;
var crCount=(text.match(/\r(?!\n)/g)||[]).length;
var lfAlone=(text.match(/(?<!\r)\n/g)||[]).length;
document.getElementById('result').innerHTML='<div class="result-title">清理结果（'+lines.length+' 行）</div><pre class="code-block">'+escH(out)+'</pre>'
  +'<div class="result-title">处理统计</div>'
  +'<table class="ref-table"><tr><th>原始行数</th><td>'+rawLines.length+'</td></tr>'
  +'<tr><th>处理后行数</th><td>'+lines.length+'</td></tr>'
  +'<tr><th>删除空行</th><td>'+(blankBefore-blankAfter)+'</td></tr>'
  +'<tr><th>原始字符数</th><td>'+rawChars+'</td></tr>'
  +'<tr><th>处理后字符数</th><td>'+out.length+'</td></tr></table>'
  +'<div class="result-title">空白字符明细</div>'
  +'<table class="ref-table"><tr><th>空格 (space)</th><td>'+spaceCount+'</td></tr>'
  +'<tr><th>制表符 (tab)</th><td>'+tabCount+'</td></tr>'
  +'<tr><th>Windows 换行 (CRLF)</th><td>'+crlfCount+'</td></tr>'
  +'<tr><th>旧 Mac 换行 (CR)</th><td>'+crCount+'</td></tr>'
  +'<tr><th>Unix 换行 (LF)</th><td>'+lfAlone+'</td></tr></table>';
// 逐行对照预览（前 5 行）
var prevN=Math.min(5, Math.max(rawLines.length, lines.length));
var preview='<div class="result-title">逐行对照预览（前 '+prevN+' 行）</div><table class="ref-table">'
  +'<tr><th>行</th><th>原始</th><th>处理后</th></tr>';
for(var pi=0; pi<prevN; pi++){
  var rv=pi<rawLines.length?rawLines[pi]:'';
  var cv=pi<lines.length?lines[pi]:'';
  preview+='<tr><td>'+(pi+1)+'</td><td><code>'+escH(rv)+'</code></td><td><code>'+escH(cv)+'</code></td></tr>';
}
preview+='</table>';
document.getElementById('result').innerHTML+=preview;}
function resetForm(){document.getElementById('source').value='  第一行   \n\n  第二行   有多余   空格\n\n\n  第三行\n';
      document.getElementById('top_trim').checked=false;
      document.getElementById('top_blank').checked=false;
      document.getElementById('top_collapse').checked=false;
      document.getElementById('top_trail').checked=false;
      calcTool();}
calcTool();
</script>
</body>
