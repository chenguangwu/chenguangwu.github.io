<div class="container">
  <div class="card">
    <h2>🧩 编码识别器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">本地静态识别常见乱码特征，提供可读性修复建议。</p>

    <div class="input-row">
      <label>粘贴异常文本</label>
      <textarea id="txt">Ã©Ã¤Ã¢Ã¢Ã«Ã¥Ã¨</textarea>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="detect()">识别并修复</button>
      <button class="btn" onclick="copyResult()">复制修复结果</button>
    </div>
    <div class="result-box" id="out"></div>
  </div>
</div>

<script>
const RULES = [
  {name:'UTF-8->GBK 误读', pattern: /Ã|â|�|Â/, replace: 'common'},
  {name:'Latin1 误读', pattern: /�|�/, replace: 'latin1'}
];

function detect() {
  const t = document.getElementById('txt').value || '';
  const hits = RULES.filter(r => r.pattern.test(t)).map(r => r.name);

  let fixed = t;
  fixed = fixed.replace(/Ã©/g, 'é');
  fixed = fixed.replace(/Ã¨/g, 'è');
  fixed = fixed.replace(/Ã¯/g, 'ï');
  fixed = fixed.replace(/Ã†/g, 'Æ');
  fixed = fixed.replace(/â\x80\x98/g, '‘');
  fixed = fixed.replace(/â\x80\x99/g, '’');

  let extra = '未检测到明显乱码特征。';
  if (hits.length) extra = '检测到：' + hits.join('，') + '，建议核对编码为 UTF-8/GBK 或按实际场景重新转码。';

  document.getElementById('out').innerHTML =
    `<p>${extra}</p>` +
    `<p>修复输出：</p><p>${fixed}</p>`;
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg678'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg352'));
}

detect();
</script>
