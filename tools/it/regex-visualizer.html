  <div class="card">
    <h2>📐 正则可视化</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入正则后，基于 token 展示简化状态转移文本图。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本开发工具在前端本地完成解析、转换与处理，代码不离开浏览器，遵循对应语法与格式规范。 工具名称：正则可视化。</p>
</div>


    <div class="input-row">
      <label>正则表达式</label>
      <input type="text" id="pattern" value="^a[0-9]+b$" oninput="render()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="render()">生成可视化</button>
      <button class="btn" onclick="copyResult()">复制节点</button>
    </div>
    <div class="result-box" id="preview"></div>
  </div>
</div>

<script>
function tokenize(p) {
  const tokens = [];
  for (let i = 0; i < p.length; i++) {
    const ch = p[i];
    if (ch === '\\') {
      tokens.push(p.slice(i, i + 2));
      i += 1;
    } else {
      tokens.push(ch);
    }
  }
  return tokens;
}

function buildStates(tokens) {
  const states = [{id:0,label:'start'}];
  let id = 1;
  for (const t of tokens) {
    states.push({id, label:`${t}`});
    id += 1;
  }
  states.push({id, label:'accept'});

  const edges = [];
  for (let i = 0; i < states.length - 1; i++) {
    const from = states[i].id;
    const to = states[i + 1].id;
    const lab = tokens[i] || 'ε';
    edges.push(`${from} --${lab}--> ${to}`);
  }
  return {states, edges};
}

function render() {
  const p = document.getElementById('pattern').value || '';
  try {
    new RegExp(p);
  } catch (e) {
    document.getElementById('preview').innerHTML = `<p>正则不合法：${e.message}</p>`;
    return;
  }

  const tokens = tokenize(p);
  const {states, edges} = buildStates(tokens);
  let html = '<div class="state">';
  html += `总状态：${states.length}（含 start + accept）`;
  html += '</div>';
  html += states.map(s => `<div class="state">S${s.id}: ${s.label}</div>`).join('');
  html += '<p style="margin-top:10px">转移：</p>';
  html += `<div class="state">${edges.join('<br>')}</div>`;
  document.getElementById('preview').innerHTML = html;
}

function copyResult() {
  const text = document.getElementById('preview').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg654'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg309'));
}

render();
</script>
