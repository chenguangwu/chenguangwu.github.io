<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本校验工具依据对应数据格式与语法规范进行合法性检查，实时给出校验结果与错误定位；纯前端运行，代码不离开浏览器。 工具名称：JSON Schema 校验。</p>

    <div class="split">
      <div>
        <label>Schema</label>
        <textarea id="schema">{"type":"object","required":["name"],"properties":{"name":{"type":"string"},"age":{"type":"number"}},"additionalProperties":false}</textarea>
      </div>
      <div>
        <label>JSON</label>
        <textarea id="data">{"name":"ToolBox","age":3}</textarea>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="validateJSON()">校验</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

  </div>

<script>
function parseSafely(id) {
  try {
    return JSON.parse(document.getElementById(id).value || 'null');
  } catch {
    return null;
  }
}

function typeOK(schemaType, val) {
  if (!schemaType) return true;
  if (schemaType === 'number') return typeof val === 'number';
  if (schemaType === 'integer') return Number.isInteger(val);
  if (schemaType === 'string') return typeof val === 'string';
  if (schemaType === 'boolean') return typeof val === 'boolean';
  if (schemaType === 'array') return Array.isArray(val);
  if (schemaType === 'object') return val && typeof val === 'object' && !Array.isArray(val);
  if (schemaType === 'null') return val === null;
  return true;
}

function walk(schema, val, path, out) {
  if (!schema || typeof schema !== 'object') return;
  if (!typeOK(schema.type, val)) {
    out.push(`类型不匹配 ${path}: 期望 ${schema.type}`);
    return;
  }

  if (schema.type === 'object') {
    if (!val || typeof val !== 'object' || Array.isArray(val)) {
      out.push(`${path} 不是对象`);
      return;
    }
    const req = schema.required || [];
    for (const k of req) {
      if (!(k in val)) out.push(`缺少必填字段: ${path}.${k}`);
    }

    const props = schema.properties || {};
    for (const [k, s] of Object.entries(props)) {
      if (k in val) {
        walk(s, val[k], path ? `${path}.${k}` : k, out);
      }
    }

    if (schema.additionalProperties === false) {
      for (const k of Object.keys(val)) {
        if (!(k in props)) out.push(`存在未允许字段: ${path ? path + '.' : ''}${k}`);
      }
    }
  }

  if (schema.type === 'array') {
    if (!Array.isArray(val)) {
      out.push(`${path} 不是数组`);
      return;
    }
    const itemSchema = schema.items || null;
    val.forEach((v, idx) => walk(itemSchema, v, `${path}[${idx}]`, out));
  }
}

function validateJSON() {
  const schema = parseSafely('schema');
  const data = parseSafely('data');
  if (!schema || data === null) {
    document.getElementById('result').innerHTML = '<p>JSON 格式错误</p>';
    return;
  }

  const out = [];
  walk(schema, data, 'root', out);
  if (!out.length) {
    document.getElementById('result').innerHTML = '<p>校验通过 ✅</p>';
  } else {
    document.getElementById('result').innerHTML = '<p>未通过：</p>' + out.map(x => `<p>${x}</p>`).join('');
  }
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg637'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg307'));
}

validateJSON();
</script>
