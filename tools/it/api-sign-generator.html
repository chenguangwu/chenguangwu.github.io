    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">参数按 key 排序 + secret 拼接，支持 MD5 与 HMAC-SHA256。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本开发工具在前端本地完成解析、转换与处理，代码不离开浏览器，遵循对应语法与格式规范。 工具名称：API 签名生成器。</p>

    <div class="input-row">
      <label>签名算法</label>
      <select id="algo">
        <option value="md5">MD5（兼容：SHA-256 取前 32 位）</option>
        <option value="sha256">HMAC-SHA256</option>
      </select>

      <label>密钥 secret</label>
      <input type="text" id="secret" value="test_secret">
    </div>

      <label>参数（每行 key=value）</label>
      <textarea id="params" style="width:100%;min-height:120px;">app_id=1001
method=order.create
amount=39.80</textarea>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="runSign()">生成签名</button>
      <button class="btn" onclick="copyResult()">复制签名</button>
    </div>
    <div class="result-box" id="out"></div>
  </div>

<script>
async function md5Hex(s) {
  if (!window.crypto || !window.crypto.subtle) return null;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)]
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('')
      .slice(0, 32);
  } catch (e) {
    return null;
  }
}

async function hmacHex(secret, s) {
  const key = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(secret),
    {name:'HMAC', hash:'SHA-256'},
    false,
    ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(s));
  return [...new Uint8Array(sig)]
    .map((b) => b.toString(16).padStart(2, '0'))
    .join('');
}

function parseParams() {
  const lines = (document.getElementById('params').value || '').split('\n');
  const obj = {};
  for (const line of lines) {
    const i = line.indexOf('=');
    if (i <= 0) continue;
    const k = line.slice(0, i).trim();
    const v = line.slice(i + 1).trim();
    if (k) obj[k] = v;
  }
  return obj;
}

async function runSign() {
  const algo = document.getElementById('algo').value;
  const secret = document.getElementById('secret').value || '';
  const params = parseParams();
  const base = Object.keys(params).sort().map((k) => `${k}=${params[k]}`).join('&');
  const signText = base + '&secret=' + secret;

  let sign;
  if (algo === 'sha256') {
    sign = await hmacHex(secret, base);
  } else {
    sign = await md5Hex(signText);
    if (!sign) {
      document.getElementById('out').innerHTML = '<p>当前环境不支持 MD5 近似计算，请改用 HMAC-SHA256。</p>';
      return;
    }
  }

  document.getElementById('out').innerHTML =
    `<p>待签名串：<strong>${signText}</strong></p>` +
    `<p>签名结果：<strong style="word-break:break-all">${sign}</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg661'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg326'));
}
</script>
