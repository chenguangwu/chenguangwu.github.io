<div class="container">
  <div class="card">
    <h2>🕒 时间格式转换</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">支持 ISO8601 / Unix / 自定义（YYYY-MM-DD HH:mm:ss）。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：时间格式转换。</p>
</div>


    <div class="input-row">
      <label>输入时间</label>
      <input type="text" id="inTime" value="1700000000" placeholder="ISO 或 Unix 秒/毫秒" oninput="convertTime()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="convertTime()">转换</button>
      <button class="btn" onclick="copyResult()">复制</button>
    </div>
    <div class="result-box" id="out"></div>
  </div>
</div>

<script>
function parseInput(v) {
  if (/^\d{10,13}$/.test(v)) {
    const ms = v.length === 10 ? Number(v) * 1000 : Number(v);
    return new Date(ms);
  }
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function fmt(date) {
  const z = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${z(date.getMonth()+1)}-${z(date.getDate())} ${z(date.getHours())}:${z(date.getMinutes())}:${z(date.getSeconds())}`;
}

function convertTime() {
  const v = (document.getElementById('inTime').value || '').trim();
  const d = parseInput(v);
  if (!d) {
    document.getElementById('out').innerHTML = '<p>无法解析时间，请输入合法值</p>';
    return;
  }

  const ts = Math.floor(d.getTime() / 1000);
  const ms = d.getTime();
  const out = [];
  out.push(`<p>本地时间：<strong>${fmt(d)}</strong></p>`);
  out.push(`<p>ISO8601：<strong>${d.toISOString()}</strong></p>`);
  out.push(`<p>Unix 秒：<strong>${ts}</strong></p>`);
  out.push(`<p>Unix 毫秒：<strong>${ms}</strong></p>`);
  out.push(`<p>相对北京时间（UTC+8）：<strong>${new Date(d.getTime() + 8*3600*1000).toISOString().replace('T',' ').replace('Z','')}</strong></p>`);
  document.getElementById('out').innerHTML = out.join('');
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg680'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg303'));
}

convertTime();
</script>
