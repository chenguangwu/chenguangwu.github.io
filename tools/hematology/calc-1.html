<div class="container">
  <div class="card">
    <h2>🩸 贫血 MCV/RDW 分类</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据红细胞平均体积（MCV）与红细胞分布宽度（RDW）对贫血进行初步形态学分类（Bessman 分类法）。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：贫血 MCV/RDW 分类 - 根据红细胞平均体积（MCV）与红细胞分布宽度（RDW）对。</p>
</div>


    <div class="input-row">
      <div>
        <label for="mcv">MCV（fL）</label>
        <input type="number" id="mcv" step="0.1" placeholder="例如 78" oninput="calc()">
      </div>
      <div>
        <label for="rdw">RDW（%）</label>
        <input type="number" id="rdw" step="0.1" placeholder="例如 16" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">分类</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_mcv_rdw';
const RDW_CUTOFF = 15;

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.mcv != null) document.getElementById('mcv').value = s.mcv;
    if(s.rdw != null) document.getElementById('rdw').value = s.rdw;
  } catch(e){}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      mcv: document.getElementById('mcv').value,
      rdw: document.getElementById('rdw').value
    }));
  } catch(e){}
}

function classify(mcv, rdw){
  const highRDW = rdw > RDW_CUTOFF;
  if(mcv < 80){
    return highRDW
      ? {cls:'grade-pass', type:'小细胞不均一性贫血', cause:'常见于缺铁性贫血、地中海贫血合并缺铁等'}
      : {cls:'grade-good', type:'小细胞均一性贫血', cause:'常见于慢性病性贫血、地中海贫血等'};
  }
  if(mcv <= 100){
    return highRDW
      ? {cls:'grade-pass', type:'正细胞不均一性贫血', cause:'常见于早期缺铁、混合性贫血（铁/B12/叶酸缺乏）、骨髓纤维化等'}
      : {cls:'grade-good', type:'正细胞均一性贫血', cause:'常见于急性失血、慢性病性贫血、轻中度溶血等'};
  }
  return highRDW
    ? {cls:'grade-pass', type:'大细胞不均一性贫血', cause:'常见于维生素 B12 或叶酸缺乏、骨髓增生异常综合征等'}
    : {cls:'grade-good', type:'大细胞均一性贫血', cause:'常见于肝病、酒精、再生障碍性贫血、甲状腺功能减退等'};
}

function calc(){
  const mcv = parseFloat(document.getElementById('mcv').value);
  const rdw = parseFloat(document.getElementById('rdw').value);
  const result = document.getElementById('result');

  if(isNaN(mcv) || isNaN(rdw)){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入 MCV 与 RDW。</p>';
    saveState();
    return;
  }

  let mcvText = '正细胞性';
  if(mcv < 80) mcvText = '小细胞性';
  else if(mcv > 100) mcvText = '大细胞性';

  const r = classify(mcv, rdw);
  saveState();
  result.innerHTML = `
    <p>MCV 形态：<strong>${mcvText}</strong>（${mcv.toFixed(1)} fL）</p>
    <p>RDW：<strong>${rdw.toFixed(1)}%</strong>（参考 ≤15%）</p>
    <p>分类结果：<span class="grade-tag ${r.cls}">${r.type}</span></p>
    <p style="font-size:13px;color:var(--text-light)">可能病因：${r.cause}</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：本分类仅为形态学筛查，确诊需结合铁代谢、维生素 B12/叶酸、网织红细胞计数及骨髓检查等。
    </div>
  `;
}

function resetForm(){
  document.getElementById('mcv').value = '';
  document.getElementById('rdw').value = '';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
</body>
