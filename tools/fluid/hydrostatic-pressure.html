<div class="container">
  <div class="card">
    <h2>P = ρ·g·h</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="液体内部由深度产生的压强。">Hydrostatic Pressure is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = ρgh。 10 m 水柱 ≈ 98 kPa。</div>
      <p class="formula-desc">液体内部由深度产生的压强。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="10">
      </div>
      <div>
        <label for="h">深度 h (m)</label>
        <input type="number" id="h" value="10" step="0.5">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.8" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P = ρgh。</li>
        <li>10 m 水柱 ≈ 98 kPa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho = num('rho'), h = num('h'), g = num('g');
            ToolBox.setResult('result', dataGrid([
                [(rho * g * h).toFixed(1), '压强 P (Pa)'],
                [(rho * g * h / 1000).toFixed(2), 'P (kPa)']
            ]));
        }
function resetForm(){document.getElementById('rho').value = '1000';
      document.getElementById('h').value = '10';
      document.getElementById('g').value = '9.8';
      calcTool();}
calcTool();
</script>
