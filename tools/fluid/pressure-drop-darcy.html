<div class="container">
  <div class="card">
    <h2 data-zh="由摩擦系数与流速求管道压降">Pressure Drop Darcy</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入摩擦系数 f、管长 L、管径 D、密度 ρ、流速 v，求压降。">Pressure Drop Darcy is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ΔP = f·(L/D)·(ρv²/2)</div>
      <p class="formula-desc">输入摩擦系数 f、管长 L、管径 D、密度 ρ、流速 v，求压降。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f">摩擦系数 f</label>
        <input type="number" id="f" value="0.02" step="0.005">
      </div>
      <div>
        <label for="L">管长 L (m)</label>
        <input type="number" id="L" value="10" step="0.5">
      </div>
      <div>
        <label for="D">管径 D (m)</label>
        <input type="number" id="D" value="0.1" step="0.01">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="10">
      </div>
      <div>
        <label for="v">流速 v (m/s)</label>
        <input type="number" id="v" value="2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>达西-魏斯巴赫公式。</li>
        <li>示例 → 400 Pa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f=num('f'),L=num('L'),D=num('D'),rho=num('rho'),v=num('v');
            const dP=f*(L/D)*(rho*v*v/2);
            ToolBox.setResult('result', dataGrid([
                [dP.toFixed(1),'压降 ΔP (Pa)']
            ]));
        }
function resetForm(){document.getElementById('f').value = '0.02';
      document.getElementById('L').value = '10';
      document.getElementById('D').value = '0.1';
      document.getElementById('rho').value = '1000';
      document.getElementById('v').value = '2';
      calcTool();}
calcTool();
</script>
