<div class="container">
  <div class="card">
    <h2>h = 2γ·cosθ / (ρ·g·r)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">液体在细管中因表面张力上升。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">h = 2γcosθ/(ρgr)。 水在细玻管中明显上升。</div>
      <p class="formula-desc">液体在细管中因表面张力上升。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="gamma">表面张力 γ (N/m)</label>
        <input type="number" id="gamma" value="0.0728" step="0.001">
      </div>
      <div>
        <label for="th">接触角 θ (°)</label>
        <input type="number" id="th" value="0" step="5">
      </div>
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="r">管半径 r (m)</label>
        <input type="number" id="r" value="0.0005" step="0.0001">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.8" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>h = 2γcosθ/(ρgr)。</li>
        <li>水在细玻管中明显上升。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const gamma = num('gamma'), th = num('th') * Math.PI / 180,
                  rho = num('rho'), r = num('r'), g = num('g');
            const h = 2 * gamma * Math.cos(th) / (rho * g * r);
            ToolBox.setResult('result', dataGrid([
                [(h * 1000).toFixed(2), '上升高度 h (mm)']
            ]));
        }
function resetForm(){document.getElementById('gamma').value = '0.0728';
      document.getElementById('th').value = '0';
      document.getElementById('rho').value = '1000';
      document.getElementById('r').value = '0.0005';
      document.getElementById('g').value = '9.8';
      calcTool();}
calcTool();
</script>
