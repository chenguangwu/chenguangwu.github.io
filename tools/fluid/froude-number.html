<body>

<h1 class="sr-only">Fr = v / √(gL)</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>由流速与特征长度求弗劳德数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入流速 v、特征长度 L、g，求弗劳德数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v=3,L=1 → 0.958。</div>
      <p class="formula-desc">输入流速 v、特征长度 L、g，求弗劳德数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v">流速 v (m/s)</label>
        <input type="number" id="v" value="3" step="0.1">
      </div>
      <div>
        <label for="L">特征长度 L (m)</label>
        <input type="number" id="L" value="1" step="0.1">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Fr>1 为急流，Fr<1 为缓流。</li>
        <li>v=3,L=1 → 0.958。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v=num('v'),L=num('L'),g=num('g');
            const Fr=v/Math.sqrt(g*L);
            ToolBox.setResult('result', dataGrid([
                [Fr.toFixed(3),'弗劳德数 Fr']
            ]));
        }
function resetForm(){document.getElementById('v').value = '3';
      document.getElementById('L').value = '1';
      document.getElementById('g').value = '9.81';
      calcTool();}
calcTool();
</script>
