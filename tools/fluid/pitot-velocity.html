<div class="container">
  <div class="card">
    <h2 data-zh="由动压差求流速">Pitot Velocity</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入动压差 ΔP 与密度 ρ，求流速。">Pitot Velocity is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = √(2ΔP/ρ)。 ΔP=500,ρ=1.2 → 28.9 m/s。</div>
      <p class="formula-desc">输入动压差 ΔP 与密度 ρ，求流速。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dP">动压差 ΔP (Pa)</label>
        <input type="number" id="dP" value="500" step="10">
      </div>
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1.2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = √(2ΔP/ρ)。</li>
        <li>ΔP=500,ρ=1.2 → 28.9 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dP=num('dP'),rho=num('rho');
            const v=Math.sqrt(2*dP/rho);
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(2),'流速 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('dP').value = '500';
      document.getElementById('rho').value = '1.2';
      calcTool();}
calcTool();
</script>
