<h1 class="sr-only">Q = A₂√(2ΔP / [ρ(1−(A₂/A₁)²)])</h1>

<div class="container">
  <div class="card">
    <h2>由压差与截面积求体积流量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入入口/喉部面积 A1、A2 与压差 ΔP、密度 ρ，求流量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = A₂√(2ΔP / [ρ(1−(A₂/A₁)²)])</div>
      <p class="formula-desc">输入入口/喉部面积 A1、A2 与压差 ΔP、密度 ρ，求流量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="A1">入口面积 A₁ (m²)</label>
        <input type="number" id="A1" value="0.01" step="0.001">
      </div>
      <div>
        <label for="A2">喉部面积 A₂ (m²)</label>
        <input type="number" id="A2" value="0.002" step="0.0005">
      </div>
      <div>
        <label for="dP">压差 ΔP (Pa)</label>
        <input type="number" id="dP" value="500" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>由伯努利+连续性推导。</li>
        <li>示例 → 约 0.00204 m³/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const A1=num('A1'),A2=num('A2'),dP=num('dP'),rho=num('rho');
            const Q=A2*Math.sqrt(2*dP/(rho*(1-Math.pow(A2/A1,2))));
            ToolBox.setResult('result', dataGrid([
                [Q.toFixed(5),'体积流量 Q (m³/s)']
            ]));
        }
function resetForm(){document.getElementById('A1').value = '0.01';
      document.getElementById('A2').value = '0.002';
      document.getElementById('dP').value = '500';
      document.getElementById('rho').value = '1000';
      calcTool();}
calcTool();
</script>
