<body>

<h1 class="sr-only">σ = (p − p_v) / (½ρv²)</h1>

<div class="nav">

  <span class="bc-sep">‹</span>

</nav>
<div class="container">
  <div class="card">
    <h2>由压力与流速求空化数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入当地压力 p、饱和蒸气压 p_v、密度 ρ、流速 v，求空化数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v=10 → 约 1.98。</div>
      <p class="formula-desc">输入当地压力 p、饱和蒸气压 p_v、密度 ρ、流速 v，求空化数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">当地压力 p (Pa)</label>
        <input type="number" id="p" value="101325" step="100">
      </div>
      <div>
        <label for="pv">蒸气压 p_v (Pa)</label>
        <input type="number" id="pv" value="2339" step="50">
      </div>
      <div>
        <label for="rho">密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v">流速 v (m/s)</label>
        <input type="number" id="v" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>σ 越小越易空化（σ<1 危险）。</li>
        <li>水 20°C,v=10 → 约 1.98。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p=num('p'),pv=num('pv'),rho=num('rho'),v=num('v');
            const sig=(p-pv)/(0.5*rho*v*v);
            ToolBox.setResult('result', dataGrid([
                [sig.toFixed(3),'空化数 σ']
            ]));
        }
function resetForm(){document.getElementById('p').value = '101325';
      document.getElementById('pv').value = '2339';
      document.getElementById('rho').value = '1000';
      document.getElementById('v').value = '10';
      calcTool();}
calcTool();
</script>
