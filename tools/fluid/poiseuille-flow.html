<div class="container">
  <div class="card">
    <h2>Q = π·ΔP·r⁴ / (8·μ·L)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">圆管层流体积流量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = πΔP r⁴/(8μL)。 流量对半径极敏感（四次方）。</div>
      <p class="formula-desc">圆管层流体积流量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dp">压差 ΔP (Pa)</label>
        <input type="number" id="dp" value="1000" step="50">
      </div>
      <div>
        <label for="r">管半径 r (m)</label>
        <input type="number" id="r" value="0.01" step="0.001">
      </div>
      <div>
        <label for="mu">黏度 μ (Pa·s)</label>
        <input type="number" id="mu" value="0.001" step="0.0001">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="L">管长 L (m)</label>
        <input type="number" id="L" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Q = πΔP r⁴/(8μL)。</li>
        <li>流量对半径极敏感（四次方）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dp = num('dp'), r = num('r'), mu = num('mu'), L = num('L');
            const Q = Math.PI * dp * Math.pow(r, 4) / (8 * mu * L);
            ToolBox.setResult('result', dataGrid([
                [Q.toExponential(3), '流量 Q (m³/s)'],
                [(Q * 1e6).toFixed(3), 'Q (mL/s)']
            ]));
        }
function resetForm(){document.getElementById('dp').value = '1000';
      document.getElementById('r').value = '0.01';
      document.getElementById('mu').value = '0.001';
      document.getElementById('L').value = '1';
      calcTool();}
calcTool();
</script>
