<div class="container">
  <div class="card">
    <h2>v = 2r²(ρ_p−ρ_f)g / (9μ)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">小颗粒在低雷诺数下的匀速沉降速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = 2r²(ρ_p−ρ_f)g/(9μ)。 适用低雷诺数小球。</div>
      <p class="formula-desc">小颗粒在低雷诺数下的匀速沉降速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="r">颗粒半径 r (m)</label>
        <input type="number" id="r" value="1e-4" step="1e-5">
      </div>
      <div>
        <label for="rhop">颗粒密度 ρ_p (kg/m³)</label>
        <input type="number" id="rhop" value="2500" step="50">
      </div>
      <div>
        <label for="rhof">流体密度 ρ_f (kg/m³)</label>
        <input type="number" id="rhof" value="1000" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="mu">黏度 μ (Pa·s)</label>
        <input type="number" id="mu" value="0.001" step="0.0001">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.8" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = 2r²(ρ_p−ρ_f)g/(9μ)。</li>
        <li>适用低雷诺数小球。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const r = num('r'), rhop = num('rhop'), rhof = num('rhof'),
                  mu = num('mu'), g = num('g');
            const v = 2 * r * r * (rhop - rhof) * g / (9 * mu);
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(6), '沉降速度 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('r').value = '1e-4';
      document.getElementById('rhop').value = '2500';
      document.getElementById('rhof').value = '1000';
      document.getElementById('mu').value = '0.001';
      document.getElementById('g').value = '9.8';
      calcTool();}
calcTool();
</script>
