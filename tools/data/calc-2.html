<div class="container">
  <div class="card">
    <h2>📋 JSON格式化</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">验证、格式化与压缩 JSON 数据，所有操作在本地完成。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本开发工具在前端本地完成解析、转换与处理，代码不离开浏览器，遵循对应语法与格式规范。 工具名称：JSON格式化 - 验证、格式化与压缩 JSON 数据，所有操作在本地完成。</p>
</div>


    <label for="jsonInput">JSON 数据</label>
    <textarea id="jsonInput" placeholder='{"name":"ToolBox","version":1}' oninput="formatJson()" style="min-height:160px;"></textarea>

    <div class="toolbar">
      <button class="btn primary" onclick="formatJson()">格式化</button>
      <button class="btn" onclick="minifyJson()">压缩</button>
      <button class="btn" onclick="copyJsonResult()">复制结果</button>
      <button class="btn" onclick="clearJson()">清空</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>

  <div class="tool-notes">
    <div class="tool-notes-title">📌 使用说明</div>
    <ul>
      <li>格式化：自动校验 JSON 并以 2 空格缩进展示。</li>
      <li>压缩：去除多余空白，生成单行 JSON。</li>
      <li>若 JSON 不合法，将高亮显示错误位置与原因。</li>
    </ul>
  </div>
</div>

<script>
function getIndent() {
  return typeof localStorage !== 'undefined' ? (parseInt(localStorage.getItem('tb_json_indent')) || 2) : 2;
}

function formatJson() {
  const text = document.getElementById('jsonInput').value;
  const result = document.getElementById('result');

  if (!text.trim()) {
    result.innerHTML = '<p style="color:var(--text-muted)">请输入 JSON 数据。</p>';
    return;
  }

  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    const msg = ToolBox.escHtml(e.message);
    const match = msg.match(/position\s+(\d+)/);
    let extra = '';
    if (match) {
      const pos = parseInt(match[1]);
      const snippet = text.substring(Math.max(0, pos - 20), Math.min(text.length, pos + 20));
      extra = '<p style="margin-top:8px;">位置上下文：<code>' + ToolBox.escHtml(snippet) + '</code></p>';
    }
    result.innerHTML = '<p style="color:var(--danger)">JSON 格式错误：' + msg + '</p>' + extra;
    return;
  }

  const formatted = JSON.stringify(data, null, getIndent());
  result.innerHTML = '<p>状态：<span class="grade-tag grade-excellent">有效 JSON</span></p>'
    + '<pre style="margin-top:12px;background:var(--card-bg);padding:12px;border-radius:8px;overflow:auto;">' + ToolBox.escHtml(formatted) + '</pre>';
}

function minifyJson() {
  const text = document.getElementById('jsonInput').value;
  const result = document.getElementById('result');

  if (!text.trim()) {
    result.innerHTML = '<p style="color:var(--text-muted)">请输入 JSON 数据。</p>';
    return;
  }

  try {
    const minified = JSON.stringify(JSON.parse(text));
    document.getElementById('jsonInput').value = minified;
    result.innerHTML = '<p>状态：<span class="grade-tag grade-excellent">已压缩</span></p>'
      + '<pre style="margin-top:12px;background:var(--card-bg);padding:12px;border-radius:8px;overflow:auto;">' + ToolBox.escHtml(minified) + '</pre>';
  } catch (e) {
    result.innerHTML = '<p style="color:var(--danger)">JSON 格式错误：' + ToolBox.escHtml(e.message) + '</p>';
  }
}

function copyJsonResult() {
  const result = document.getElementById('result').querySelector('pre');
  if (result) ToolBox.copyText(result.textContent);
}

function clearJson() {
  document.getElementById('jsonInput').value = '';
  document.getElementById('result').innerHTML = '<p style="color:var(--text-muted)">请输入 JSON 数据。</p>';
}

formatJson();
</script>
