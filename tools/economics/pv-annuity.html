<h1 class="sr-only">年金现值计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 年金现值</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>PV = PMT·[1 − (1+i)^−N]/i</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">每期期末等额收款 PMT、共 N 期、每期利率 i 的年金现值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">i=0 时退化为 PMT×N。</div>
      <p class="formula-desc">每期期末等额收款 PMT、共 N 期、每期利率 i 的年金现值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="pmt">每期金额 PMT</label>
        <input type="number" id="pmt" value="1000" step="50">
      </div>
      <div>
        <label for="i">每期利率 i (%)</label>
        <input type="number" id="i" value="1" step="0.1">
      </div>
      <div>
        <label for="n">期数 N</label>
        <input type="number" id="n" value="12" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>每期 1000、1%、12 期 → 现值约 11255.08。</li>
        <li>i=0 时退化为 PMT×N。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const pmt = num('pmt'), i = num('i') / 100, n = num('n');
            const pv = i === 0 ? pmt * n : pmt * (1 - Math.pow(1 + i, -n)) / i;
            ToolBox.setResult('result', dataGrid([
                [pv.toFixed(2), '年金现值 PV'],
                [(pmt * n - pv).toFixed(2), '贴现总额']
            ]));
        }
function resetForm(){document.getElementById('pmt').value = '1000';
      document.getElementById('i').value = '1';
      document.getElementById('n').value = '12';
      calcTool();}
calcTool();
</script>
