<div class="container">
  <div class="card">
    <h2>由就业与失业人数求劳动力</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入就业人数 E 与失业人数 U，求劳动力规模。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">LF = E + U</div>
      <p class="formula-desc">输入就业人数 E 与失业人数 U，求劳动力规模。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="E">就业 E (万人)</label>
        <input type="number" id="E" value="140" step="5">
      </div>
      <div>
        <label for="U">失业 U (万人)</label>
        <input type="number" id="U" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>LF = 就业 + 失业。</li>
        <li>140+10 → 150 万人。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const E=num('E'),U=num('U');
            const LF=E+U;
            ToolBox.setResult('result', dataGrid([
                [LF.toFixed(0),'劳动力 LF']
            ]));
        }
function resetForm(){document.getElementById('E').value = '140';
      document.getElementById('U').value = '10';
      calcTool();}
calcTool();
</script>
