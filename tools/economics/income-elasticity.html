<div class="container">
  <div class="card">
    <h2 data-zh="收入弹性计算器">Income Elasticity</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E_i = (%ΔQ) / (%ΔI)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="收入变动对需求量的影响。正常品为正，劣等品为负。">Income Elasticity is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="q1">原数量 Q₁</label>
        <input type="number" id="q1" value="100" step="1">
      </div>
      <div>
        <label for="q2">新数量 Q₂</label>
        <input type="number" id="q2" value="115" step="1">
      </div>
      <div>
        <label for="i1">原收入 I₁</label>
        <input type="number" id="i1" value="1000" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="i2">新收入 I₂</label>
        <input type="number" id="i2" value="1100" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>收入上升需求上升 → 正常品（正）。</li>
        <li>负值为劣等品。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const q1 = num('q1'), q2 = num('q2'), i1 = num('i1'), i2 = num('i2');
            const dQ = (q2 - q1) / ((q1 + q2) / 2);
            const dI = (i2 - i1) / ((i1 + i2) / 2);
            const e = dQ / dI;
            const type = e > 0 ? '正常品' : '劣等品';
            ToolBox.setResult('result', dataGrid([
                [e.toFixed(3), '收入弹性 E_i'],
                [type, '商品类型']
            ]));
        }
function resetForm(){document.getElementById('q1').value = '100';
      document.getElementById('q2').value = '115';
      document.getElementById('i1').value = '1000';
      document.getElementById('i2').value = '1100';
      calcTool();}
calcTool();
</script>
