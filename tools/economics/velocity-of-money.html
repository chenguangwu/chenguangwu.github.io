<h1 class="sr-only">V = P·Y / M</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>由价格水平、产出与货币量求流通速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入价格水平 P、实际产出 Y、货币量 M，求货币流通速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">MV = PY（交易方程）。 P=1,Y=2000,M=500 → 4。</div>
      <p class="formula-desc">输入价格水平 P、实际产出 Y、货币量 M，求货币流通速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P">价格水平 P</label>
        <input type="number" id="P" value="1" step="0.05">
      </div>
      <div>
        <label for="Y">实际产出 Y (亿元)</label>
        <input type="number" id="Y" value="2000" step="50">
      </div>
      <div>
        <label for="M">货币量 M (亿元)</label>
        <input type="number" id="M" value="500" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>MV = PY（交易方程）。</li>
        <li>P=1,Y=2000,M=500 → 4。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P'),Y=num('Y'),M=num('M');
            const V=P*Y/M;
            ToolBox.setResult('result', dataGrid([
                [V.toFixed(2),'流通速度 V']
            ]));
        }
function resetForm(){document.getElementById('P').value = '1';
      document.getElementById('Y').value = '2000';
      document.getElementById('M').value = '500';
      calcTool();}
calcTool();
</script>
