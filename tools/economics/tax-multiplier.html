<h1 class="sr-only">k_t = −MPC / (1−MPC)</h1>

<div class="container">
  <div class="card">
    <h2 data-zh="由边际消费倾向求税收乘数">Tax Multiplier</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入边际消费倾向 MPC，求税收乘数。">Tax Multiplier is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">k_t = −MPC/(1−MPC)</div>
      <p class="formula-desc">输入边际消费倾向 MPC，求税收乘数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="mpc">边际消费倾向 MPC</label>
        <input type="number" id="mpc" value="0.8" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>k_t = −MPC/(1−MPC)，负号表示反向。</li>
        <li>MPC=0.8 → −4。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const mpc=num('mpc');
            const kt=-mpc/(1-mpc);
            ToolBox.setResult('result', dataGrid([
                [kt.toFixed(2),'税收乘数 k_t']
            ]));
        }
function resetForm(){document.getElementById('mpc').value = '0.8';
      calcTool();}
calcTool();
</script>
