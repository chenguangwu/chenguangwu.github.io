<h1 class="sr-only">复利终值计算器</h1>

<div class="nav">

  <span>/ 复利终值</span>

</nav>
<div class="container">
  <div class="card">
    <h2>F = P(1 + r/n)^(nt)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">本金按年利率 r、每年 n 次复利、t 年后的终值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">n=12 为月复利。</div>
      <p class="formula-desc">本金按年利率 r、每年 n 次复利、t 年后的终值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">本金 P</label>
        <input type="number" id="p" value="10000" step="100">
      </div>
      <div>
        <label for="r">年利率 r (%)</label>
        <input type="number" id="r" value="5" step="0.1">
      </div>
      <div>
        <label for="t">年数 t</label>
        <input type="number" id="t" value="10" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="n">每年复利次数 n</label>
        <input type="number" id="n" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>10000 元、5%、10 年、年复利 → 16288.95。</li>
        <li>n=12 为月复利。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P = num('p'), r = num('r'), t = num('t'), n = num('n');
            const f = P * Math.pow(1 + r / 100 / n, n * t);
            ToolBox.setResult('result', dataGrid([
                [f.toFixed(2), '复利终值 F'],
                [(f - P).toFixed(2), '利息总额']
            ]));
        }
function resetForm(){document.getElementById('p').value = '10000';
      document.getElementById('r').value = '5';
      document.getElementById('t').value = '10';
      document.getElementById('n').value = '1';
      calcTool();}
calcTool();
</script>
