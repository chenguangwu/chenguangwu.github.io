<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>由产量与劳动增量求边际产量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入产量增量 ΔQ 与劳动增量 ΔL，求劳动边际产量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">MPL = ΔQ/ΔL</div>
      <p class="formula-desc">输入产量增量 ΔQ 与劳动增量 ΔL，求劳动边际产量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dq">产量增量 ΔQ</label>
        <input type="number" id="dq" value="50" step="5">
      </div>
      <div>
        <label for="dl">劳动增量 ΔL</label>
        <input type="number" id="dl" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>MPL = ΔQ/ΔL。</li>
        <li>50/10 → 5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dq=num('dq'),dl=num('dl');
            const mpl=dq/dl;
            ToolBox.setResult('result', dataGrid([
                [mpl.toFixed(2),'劳动边际产量 MPL']
            ]));
        }
function resetForm(){document.getElementById('dq').value = '50';
      document.getElementById('dl').value = '10';
      calcTool();}
calcTool();
</script>
