<div class="container">
  <div class="card">
    <h2>交叉价格弹性计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E_xy = (%ΔQ_x) / (%ΔP_y)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">商品 y 价格变动对商品 x 需求量的影响。正为替代品，负为互补品。</p>

    <div class="input-row">
      <div>
        <label for="qx1">商品 x 原数量</label>
        <input type="number" id="qx1" value="100" step="1">
      </div>
      <div>
        <label for="qx2">商品 x 新数量</label>
        <input type="number" id="qx2" value="110" step="1">
      </div>
      <div>
        <label for="py1">商品 y 原价格</label>
        <input type="number" id="py1" value="10" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="py2">商品 y 新价格</label>
        <input type="number" id="py2" value="12" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>y 涨价、x 需求上升 → 替代品（正）。</li>
        <li>负则为互补品。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const q1 = num('qx1'), q2 = num('qx2'), p1 = num('py1'), p2 = num('py2');
            const dQ = (q2 - q1) / ((q1 + q2) / 2);
            const dP = (p2 - p1) / ((p1 + p2) / 2);
            const e = dQ / dP;
            const type = e > 0 ? '替代品' : (e < 0 ? '互补品' : '无关');
            ToolBox.setResult('result', dataGrid([
                [e.toFixed(3), '交叉价格弹性 E_xy'],
                [type, '关系']
            ]));
        }
function resetForm(){document.getElementById('qx1').value = '100';
      document.getElementById('qx2').value = '110';
      document.getElementById('py1').value = '10';
      document.getElementById('py2').value = '12';
      calcTool();}
calcTool();
</script>
