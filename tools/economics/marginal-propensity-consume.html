<h1 class="sr-only">MPC = ΔC / ΔY</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>由消费与收入增量求边际消费倾向</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入消费增量 ΔC 与收入增量 ΔY，求 MPC。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">MPC = ΔC/ΔY</div>
      <p class="formula-desc">输入消费增量 ΔC 与收入增量 ΔY，求 MPC。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dc">消费增量 ΔC</label>
        <input type="number" id="dc" value="80" step="5">
      </div>
      <div>
        <label for="dy">收入增量 ΔY</label>
        <input type="number" id="dy" value="100" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>MPC = ΔC/ΔY，0<MPC<1。</li>
        <li>80/100 → 0.8。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dc=num('dc'),dy=num('dy');
            const mpc=dc/dy;
            ToolBox.setResult('result', dataGrid([
                [mpc.toFixed(3),'边际消费倾向 MPC']
            ]));
        }
function resetForm(){document.getElementById('dc').value = '80';
      document.getElementById('dy').value = '100';
      calcTool();}
calcTool();
</script>
