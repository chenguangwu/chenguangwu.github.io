<div class="container">
  <div class="card">
    <h2>E_d = (%ΔQ) / (%ΔP)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用中点法计算需求对价格的弹性，避免端点依赖。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E_d ≈ −1.22（富有弹性）。 绝对值>1 为富有弹性。</div>
      <p class="formula-desc">用中点法计算需求对价格的弹性，避免端点依赖。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="q1">原数量 Q₁</label>
        <input type="number" id="q1" value="100" step="1">
      </div>
      <div>
        <label for="q2">新数量 Q₂</label>
        <input type="number" id="q2" value="80" step="1">
      </div>
      <div>
        <label for="p1">原价格 P₁</label>
        <input type="number" id="p1" value="10" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="p2">新价格 P₂</label>
        <input type="number" id="p2" value="12" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>价格 10→12、数量 100→80 → E_d ≈ −1.22（富有弹性）。</li>
        <li>绝对值>1 为富有弹性。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const q1 = num('q1'), q2 = num('q2'), p1 = num('p1'), p2 = num('p2');
            const dQ = (q2 - q1) / ((q1 + q2) / 2);
            const dP = (p2 - p1) / ((p1 + p2) / 2);
            const e = dQ / dP;
            const type = Math.abs(e) > 1 ? '富有弹性' : (Math.abs(e) < 1 ? '缺乏弹性' : '单位弹性');
            ToolBox.setResult('result', dataGrid([
                [e.toFixed(3), '需求价格弹性 E_d'],
                [type, '弹性类型']
            ]));
        }
function resetForm(){document.getElementById('q1').value = '100';
      document.getElementById('q2').value = '80';
      document.getElementById('p1').value = '10';
      document.getElementById('p2').value = '12';
      calcTool();}
calcTool();
</script>
