<div class="container">
  <div class="card">
    <h2>π = (CPI₁ − CPI₀) / CPI₀ × 100%</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于消费者价格指数的时期通货膨胀率。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">π = (CPI₁</div>
      <p class="formula-desc">基于消费者价格指数的时期通货膨胀率。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="cpi0">基期 CPI</label>
        <input type="number" id="cpi0" value="100" step="0.1">
      </div>
      <div>
        <label for="cpi1">报告期 CPI</label>
        <input type="number" id="cpi1" value="105" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CPI 100→105 对应通胀 5%。</li>
        <li>分母为基期 CPI。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c0 = num('cpi0'), c1 = num('cpi1');
            const p = (c1 - c0) / c0 * 100;
            ToolBox.setResult('result', dataGrid([
                [p.toFixed(2), '通货膨胀率 (%)'],
                [((c1 - c0)).toFixed(2), 'CPI 变化']
            ]));
        }
function resetForm(){document.getElementById('cpi0').value = '100';
      document.getElementById('cpi1').value = '105';
      calcTool();}
calcTool();
</script>
