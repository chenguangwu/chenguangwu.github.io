<div class="container">
  <div class="card">
    <h2>Δu ≈ −½(实际增长 − 潜在增长)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">实际 GDP 增长率与潜在增长率之差对失业率变化的影响。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Δu ≈ −½(g − g*)</div>
      <p class="formula-desc">实际 GDP 增长率与潜在增长率之差对失业率变化的影响。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="g">实际 GDP 增长率 (%)</label>
        <input type="number" id="g" value="4" step="0.1">
      </div>
      <div>
        <label for="gp">潜在增长率 (%)</label>
        <input type="number" id="gp" value="3" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>实际 4%、潜在 3% → 失业率下降约 0.5 点。</li>
        <li>系数为 −½（常用近似）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const g = num('g'), gp = num('gp');
            const du = -0.5 * (g - gp);
            ToolBox.setResult('result', dataGrid([
                [du.toFixed(2), '失业率变化 Δu (百分点)'],
                [(g - gp).toFixed(2), '增长缺口']
            ]));
        }
function resetForm(){document.getElementById('g').value = '4';
      document.getElementById('gp').value = '3';
      calcTool();}
calcTool();
</script>
