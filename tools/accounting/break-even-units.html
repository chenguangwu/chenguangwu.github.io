<div class="tool-guide-link" data-guide-link="1">
  <a href="../../guides/break-even-units-guide.html">📖 查看「盈亏平衡产量使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>FC / (P − VC)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">BEP = 固定成本 / (单价 − 单位变动成本)。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">盈亏平衡量 = FC/(P−VC)</div>
      <p class="formula-desc">BEP = 固定成本 / (单价 − 单位变动成本)。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="fc">固定成本 (元)</label>
        <input type="number" id="fc" value="200000" step="10000">
      </div>
      <div>
        <label for="p">单价 P (元)</label>
        <input type="number" id="p" value="100" step="5">
      </div>
      <div>
        <label for="vc">单位变动成本 (元)</label>
        <input type="number" id="vc" value="60" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>销量超此点开始盈利。</li>
        <li>边际贡献=单价−单位变动。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const fc=num('fc'),p=num('p'),vc=num('vc');
            const q=fc/(p-vc);
            ToolBox.setResult('result', dataGrid([
                [q.toFixed(1),'平衡产量 (件)'],
                [(q*p).toFixed(0),'平衡销售额 (元)'],
                [(p-vc).toFixed(2),'单位边际贡献 (元)']
            ]));
        }
function resetForm(){document.getElementById('fc').value = '200000';
      document.getElementById('p').value = '100';
      document.getElementById('vc').value = '60';
      calcTool();}
calcTool();
</script>
