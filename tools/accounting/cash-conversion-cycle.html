<div class="container">
  <div class="card">
    <h2 data-zh="由应收、存货与应付天数求现金周期">Cash Conversion Cycle</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入应收账款天数、存货天数与应付账款天数，求现金转换周期。">Cash Conversion Cycle is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">CCC = DSO + DIO − DPO</div>
      <p class="formula-desc">输入应收账款天数、存货天数与应付账款天数，求现金转换周期。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="DSO">应收天数 DSO (天)</label>
        <input type="number" id="DSO" value="36.5" step="2">
      </div>
      <div>
        <label for="DIO">存货天数 DIO (天)</label>
        <input type="number" id="DIO" value="91.25" step="2">
      </div>
      <div>
        <label for="DPO">应付天数 DPO (天)</label>
        <input type="number" id="DPO" value="48.67" step="2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CCC 越短资金效率越高。</li>
        <li>36.5+91.25−48.67 → 79.08 天。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const DSO=num('DSO'),DIO=num('DIO'),DPO=num('DPO');
            const CCC=DSO+DIO-DPO;
            ToolBox.setResult('result', dataGrid([
                [CCC.toFixed(2),'现金转换周期 CCC (天)']
            ]));
        }
function resetForm(){document.getElementById('DSO').value = '36.5';
      document.getElementById('DIO').value = '91.25';
      document.getElementById('DPO').value = '48.67';
      calcTool();}
calcTool();
</script>
