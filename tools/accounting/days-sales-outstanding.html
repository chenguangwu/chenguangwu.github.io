<h1 class="sr-only">DSO = 应收账款 / 营收 × 365</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 应收账款周转天数计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 会计审计</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">应收账款周转天数计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由应收账款与营收求收款天数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入应收账款与年营业收入，求 DSO。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">DSO = 应收账款/营收 × 365</div>
      <p class="formula-desc">输入应收账款与年营业收入，求 DSO。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="AR">应收账款 (万元)</label>
        <input type="number" id="AR" value="100" step="10">
      </div>
      <div>
        <label for="rev">营业收入 (万元)</label>
        <input type="number" id="rev" value="1000" step="50">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>DSO 越短回款越快。</li>
        <li>100/1000×365 → 36.5 天。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const AR=num('AR'),rev=num('rev');
            const DSO=AR/rev*365;
            ToolBox.setResult('result', dataGrid([
                [DSO.toFixed(1),'应收账款天数 DSO (天)']
            ]));
        }
function resetForm(){document.getElementById('AR').value = '100';
      document.getElementById('rev').value = '1000';
      calcTool();}
calcTool();
</script>
