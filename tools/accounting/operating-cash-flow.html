<h1 class="sr-only">OCF = 净利润 + 折旧摊销 − 营运资本变动</h1>

<div class="container">
  <div class="card">
    <h2 data-zh="由净利润、折旧摊销与营运资本变动求 OCF">Operating Cash Flow</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入净利润、折旧摊销与营运资本增加额，求经营现金流。">Operating Cash Flow is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">OCF = 净利润 + 折旧摊销 − 营运资本变动</div>
      <p class="formula-desc">输入净利润、折旧摊销与营运资本增加额，求经营现金流。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="NI">净利润 (万元)</label>
        <input type="number" id="NI" value="120" step="10">
      </div>
      <div>
        <label for="DA">折旧摊销 (万元)</label>
        <input type="number" id="DA" value="50" step="5">
      </div>
      <div>
        <label for="dWC">营运资本增加 (万元)</label>
        <input type="number" id="dWC" value="20" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>间接法起点为净利润。</li>
        <li>120+50−20 → 150 万。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const NI=num('NI'),DA=num('DA'),dWC=num('dWC');
            const OCF=NI+DA-dWC;
            ToolBox.setResult('result', dataGrid([
                [OCF.toFixed(2),'经营现金流 OCF (万元)']
            ]));
        }
function resetForm(){document.getElementById('NI').value = '120';
      document.getElementById('DA').value = '50';
      document.getElementById('dWC').value = '20';
      calcTool();}
calcTool();
</script>
