<div class="container">
  <div class="card">
    <h2>双倍余额递减法（加速折旧）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">年折旧 = 期初账面值 × 2/n（末年调至残值）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">年折旧 = 账面净值 × 2/年限</div>
      <p class="formula-desc">年折旧 = 期初账面值 × 2/n（末年调至残值）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c">原值 C (元)</label>
        <input type="number" id="c" value="100000" step="5000">
      </div>
      <div>
        <label for="s">残值 S (元)</label>
        <input type="number" id="s" value="10000" step="1000">
      </div>
      <div>
        <label for="n">使用年限 (年)</label>
        <input type="number" id="n" value="10" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="yr">计算第几年 (年)</label>
        <input type="number" id="yr" value="3" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>前期折旧多、后期少。</li>
        <li>最后两年通常改为直线调至残值。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c=num('c'),s=num('s'),n=num('n'),yr=num('yr');
            const rate=2/n;
            let bv=c, accum=0, depYr=0;
            for(let k=1;k<=yr;k++){
                let d=bv*rate;
                if(k===n){ d=bv-s; }
                if(bv-d < s) d=bv-s;
                if(k===yr) depYr=d;
                accum+=d; bv-=d;
            }
            ToolBox.setResult('result', dataGrid([
                [depYr.toFixed(2),('第'+yr+'年折旧额 (元)')],
                [bv.toFixed(2),'期末账面值 (元)'],
                [(accum).toFixed(2),'累计折旧 (元)']
            ]));
        }
function resetForm(){document.getElementById('c').value = '100000';
      document.getElementById('s').value = '10000';
      document.getElementById('n').value = '10';
      document.getElementById('yr').value = '3';
      calcTool();}
calcTool();
</script>
