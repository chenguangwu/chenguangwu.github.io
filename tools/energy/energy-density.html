<div class="container">
  <div class="card">
    <h2 data-zh="能量 / 质量">Energy Density - Input Energy and Quality , Calculate Quality Energy Density</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">ρ_E = E / m。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">能量密度 = E/m</div>
      <p class="formula-desc">ρ_E = E / m。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="e">能量 E (J)</label>
        <input type="number" id="e" value="3600000" step="100000">
      </div>
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>锂电约 0.1–0.3 kWh/kg。</li>
        <li>汽油约 12 kWh/kg。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const e=num('e'),m=num('m');
            ToolBox.setResult('result', dataGrid([
                [(e/m/1000).toFixed(1),'能量密度 (kJ/kg)'],
                [(e/m/3.6e6).toFixed(4),'能量密度 (kWh/kg)']
            ]));
        }
function resetForm(){document.getElementById('e').value = '3600000';
      document.getElementById('m').value = '10';
      calcTool();}
calcTool();
</script>
