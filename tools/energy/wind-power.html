<h1 class="sr-only">风功率</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 风力发电功率</span>

</nav>
<div class="container">
  <div class="card">
    <h2>P = ½ρA v³ Cp</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">P = ½·ρ·A·v³·Cp。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = ½·ρ·A·v³·Cp</div>
      <p class="formula-desc">P = ½·ρ·A·v³·Cp。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rho">空气密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1.225" step="0.01">
      </div>
      <div>
        <label for="r">风轮半径 (m)</label>
        <input type="number" id="r" value="40" step="5">
      </div>
      <div>
        <label for="v">风速 v (m/s)</label>
        <input type="number" id="v" value="10" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="cp">功率系数 Cp</label>
        <input type="number" id="cp" value="0.4" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>贝兹极限 Cp≤0.593。</li>
        <li>功率与风速立方成正比。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho=num('rho'),r=num('r'),v=num('v'),cp=num('cp');
            const A=Math.PI*r*r;
            const P=0.5*rho*A*Math.pow(v,3)*cp;
            ToolBox.setResult('result', dataGrid([
                [(P/1000).toFixed(2),'捕获功率 (kW)'],
                [A.toFixed(1),'扫风面积 (m²)']
            ]));
        }
function resetForm(){document.getElementById('rho').value = '1.225';
      document.getElementById('r').value = '40';
      document.getElementById('v').value = '10';
      document.getElementById('cp').value = '0.4';
      calcTool();}
calcTool();
</script>
