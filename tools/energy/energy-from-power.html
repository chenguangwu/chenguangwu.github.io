<h1 class="sr-only">E = P·t</h1>

<div class="nav">

  <span class="bc-sep">‹</span>
  <span class="bc-current">电能(电量)计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由功率与用电时长求电能</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入功率 P（瓦）与用电时长 t（小时），求电能（千瓦时）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E = P × t</div>
      <p class="formula-desc">输入功率 P（瓦）与用电时长 t（小时），求电能（千瓦时）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P">功率 P (瓦)</label>
        <input type="number" id="P" value="1000" step="50">
      </div>
      <div>
        <label for="t">时长 t (小时)</label>
        <input type="number" id="t" value="2" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1 kWh = 3.6×10⁶ J。</li>
        <li>1000W×2h → 2 kWh。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P'),t=num('t');
            const E=P/1000*t;
            ToolBox.setResult('result', dataGrid([
                [E.toFixed(3),'电能 E (kWh)']
            ]));
        }
function resetForm(){document.getElementById('P').value = '1000';
      document.getElementById('t').value = '2';
      calcTool();}
calcTool();
</script>
