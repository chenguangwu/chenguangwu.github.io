<body>

<h1 class="sr-only">LCOE</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 平准化度电成本 (LCOE)</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">平准化度电成本 (LCOE)</span>
</nav>
<div class="container">
  <div class="card">
    <h2>生命周期成本 / 发电量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">LCOE = (CAPEX·CRF + O&M) / 年发电量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">LCOE = 生命周期成本 / 总发电量</div>
      <p class="formula-desc">LCOE = (CAPEX·CRF + O&amp;M) / 年发电量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="capex">初投资 (元)</label>
        <input type="number" id="capex" value="5000000" step="500000">
      </div>
      <div>
        <label for="n">年限 (年)</label>
        <input type="number" id="n" value="20" step="1">
      </div>
      <div>
        <label for="r">折现率 r</label>
        <input type="number" id="r" value="0.06" step="0.005">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="om">年运维 (元)</label>
        <input type="number" id="om" value="100000" step="10000">
      </div>
      <div>
        <label for="e">年发电量 (kWh)</label>
        <input type="number" id="e" value="1200000" step="100000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CRF = r(1+r)^n/((1+r)^n−1)。</li>
        <li>LCOE 越低竞争力越强。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const C=num('capex'),n=num('n'),r=num('r'),om=num('om'),E=num('e');
            const crf=r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
            const lcoe=(C*crf+om)/E;
            ToolBox.setResult('result', dataGrid([
                [lcoe.toFixed(3),'LCOE (元/kWh)'],
                [crf.toFixed(4),'资本回收因子 CRF']
            ]));
        }
function resetForm(){document.getElementById('capex').value = '5000000';
      document.getElementById('n').value = '20';
      document.getElementById('r').value = '0.06';
      document.getElementById('om').value = '100000';
      document.getElementById('e').value = '1200000';
      calcTool();}
calcTool();
</script>
