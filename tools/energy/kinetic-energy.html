<div class="container">
  <div class="card">
    <h2>由质量与速度求动能</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入质量 m 与速度 v，求动能。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">KE = ½·m·v²</div>
      <p class="formula-desc">输入质量 m 与速度 v，求动能。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m">质量 m (千克)</label>
        <input type="number" id="m" value="1000" step="50">
      </div>
      <div>
        <label for="v">速度 v (米/秒)</label>
        <input type="number" id="v" value="20" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>动能与速度平方成正比。</li>
        <li>1000×20²/2 → 200000 J。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m=num('m'),v=num('v');
            const Ek=0.5*m*v*v;
            ToolBox.setResult('result', dataGrid([
                [Ek.toFixed(2),'动能 E_k (J)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '1000';
      document.getElementById('v').value = '20';
      calcTool();}
calcTool();
</script>
