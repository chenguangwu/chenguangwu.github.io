<h1 class="sr-only">R = d / k</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由厚度与导热系数求热阻">R Value Insulation</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入材料厚度 d 与导热系数 k，求热阻 R。">R Value Insulation is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = d/k</div>
      <p class="formula-desc">输入材料厚度 d 与导热系数 k，求热阻 R。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="d">厚度 d (米)</label>
        <input type="number" id="d" value="0.2" step="0.01">
      </div>
      <div>
        <label for="k">导热系数 k (W/(m·K))</label>
        <input type="number" id="k" value="0.04" step="0.005">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R 越大保温越好。</li>
        <li>0.2/0.04 → 5.0。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const d=num('d'),k=num('k');
            const R=d/k;
            ToolBox.setResult('result', dataGrid([
                [R.toFixed(3),'热阻 R (m²·K/W)']
            ]));
        }
function resetForm(){document.getElementById('d').value = '0.2';
      document.getElementById('k').value = '0.04';
      calcTool();}
calcTool();
</script>
