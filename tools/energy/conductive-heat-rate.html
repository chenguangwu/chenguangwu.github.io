<h1 class="sr-only">Q̇ = k·A·ΔT / d</h1>

<div class="nav">

  <span class="bc-current">导热热流率计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由导热系数、面积、温差与厚度求热流率">Conductive Heat Rate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入导热系数 k、面积 A、温差 ΔT 与厚度 d，求热流率。">Conductive Heat Rate is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = k·A·ΔT/d</div>
      <p class="formula-desc">输入导热系数 k、面积 A、温差 ΔT 与厚度 d，求热流率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="k">导热系数 k (W/(m·K))</label>
        <input type="number" id="k" value="0.04" step="0.005">
      </div>
      <div>
        <label for="A">面积 A (米²)</label>
        <input type="number" id="A" value="10" step="1">
      </div>
      <div>
        <label for="dT">温差 ΔT (K)</label>
        <input type="number" id="dT" value="20" step="2">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="d">厚度 d (米)</label>
        <input type="number" id="d" value="0.2" step="0.02">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>傅里叶导热定律。</li>
        <li>0.04×10×20/0.2 → 40 W。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const k=num('k'),A=num('A'),dT=num('dT'),d=num('d');
            const Qdot=k*A*dT/d;
            ToolBox.setResult('result', dataGrid([
                [Qdot.toFixed(2),'热流率 Q̇ (W)']
            ]));
        }
function resetForm(){document.getElementById('k').value = '0.04';
      document.getElementById('A').value = '10';
      document.getElementById('dT').value = '20';
      document.getElementById('d').value = '0.2';
      calcTool();}
calcTool();
</script>
