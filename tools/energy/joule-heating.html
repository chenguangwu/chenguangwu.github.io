  <span class="bc-current">焦耳热功率计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由电流与电阻求热功率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入电流 I 与电阻 R，求焦耳热功率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = I²·R</div>
      <p class="formula-desc">输入电流 I 与电阻 R，求焦耳热功率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="I">电流 I (安)</label>
        <input type="number" id="I" value="2" step="0.2">
      </div>
      <div>
        <label for="R">电阻 R (欧)</label>
        <input type="number" id="R" value="5" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>电流热效应损耗。</li>
        <li>2²×5 → 20 W。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const I=num('I'),R=num('R');
            const P=I*I*R;
            ToolBox.setResult('result', dataGrid([
                [P.toFixed(2),'热功率 P (W)']
            ]));
        }
function resetForm(){document.getElementById('I').value = '2';
      document.getElementById('R').value = '5';
      calcTool();}
calcTool();
</script>
