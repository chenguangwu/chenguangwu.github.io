<div class="container">
  <div class="card">
    <h2>由电流与材料参数求漂移速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入电流 I、载流子密度 n、截面积 A，求漂移速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v_d = I/(n·A·e)，铜 n≈8.5×10²⁸。 铜导线中 v_d 极小（10⁻⁴ m/s 量级）。</div>
      <p class="formula-desc">输入电流 I、载流子密度 n、截面积 A，求漂移速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="I">电流 I (A)</label>
        <input type="number" id="I" value="1" step="0.1">
      </div>
      <div>
        <label for="n">载流子密度 n (m⁻³)</label>
        <input type="number" id="n" value="8.5e28" step="1e27">
      </div>
      <div>
        <label for="A">截面积 A (m²)</label>
        <input type="number" id="A" value="1e-6" step="1e-7">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v_d = I/(n·A·e)，铜 n≈8.5×10²⁸。</li>
        <li>铜导线中 v_d 极小（10⁻⁴ m/s 量级）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const e=1.602176634e-19;
            const I=num('I'),n=num('n'),A=num('A');
            const vd=I/(n*A*e);
            ToolBox.setResult('result', dataGrid([
                [vd.toExponential(3),'漂移速度 v_d (m/s)']
            ]));
        }
function resetForm(){document.getElementById('I').value = '1';
      document.getElementById('n').value = '8.5e28';
      document.getElementById('A').value = '1e-6';
      calcTool();}
calcTool();
</script>
