<div class="container">
  <div class="card">
    <h2>磁通（Φ = B·A）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">匀强磁场垂直穿过面积的磁通量。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Φ = B·A</div>
      <p class="formula-desc">匀强磁场垂直穿过面积的磁通量。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="B">磁感应强度 (T)</label>
        <input type="number" id="B" value="0.001" step="0.0001">
      </div>
      <div>
        <label for="A">面积 (m²)</label>
        <input type="number" id="A" value="0.01" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Φ = B·A（B 垂直 A）。</li>
        <li>1 mT、0.01 m² 得 1×10⁻⁵ Wb。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const B = num('B'), A = num('A');
            const Phi = B * A;
            ToolBox.setResult('result', dataGrid([
                [Phi.toExponential(3), '磁通 Φ (Wb)'],
                [(Phi * 1e6).toFixed(2), 'Φ (µWb)']
            ]));
        }
function resetForm(){document.getElementById('B').value = '0.001';
      document.getElementById('A').value = '0.01';
      calcTool();}
calcTool();
</script>
