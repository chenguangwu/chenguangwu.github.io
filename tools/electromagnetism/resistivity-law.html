<div class="container">
  <div class="card">
    <h2>由电阻率、长度与截面积求电阻</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入电阻率 ρ、长度 L、截面积 A，求导体电阻。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = ρL/A。 铜(ρ=1.68e-8),L=1m,A=1mm² → 0.0168 Ω。</div>
      <p class="formula-desc">输入电阻率 ρ、长度 L、截面积 A，求导体电阻。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rho">电阻率 ρ (Ω·m)</label>
        <input type="number" id="rho" value="1.68e-8" step="1e-9">
      </div>
      <div>
        <label for="L">长度 L (m)</label>
        <input type="number" id="L" value="1" step="0.1">
      </div>
      <div>
        <label for="A">截面积 A (m²)</label>
        <input type="number" id="A" value="1e-6" step="1e-7">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R = ρL/A。</li>
        <li>铜(ρ=1.68e-8),L=1m,A=1mm² → 0.0168 Ω。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho=num('rho'),L=num('L'),A=num('A');
            const R=rho*L/A;
            ToolBox.setResult('result', dataGrid([
                [R.toFixed(5),'电阻 R (Ω)']
            ]));
        }
function resetForm(){document.getElementById('rho').value = '1.68e-8';
      document.getElementById('L').value = '1';
      document.getElementById('A').value = '1e-6';
      calcTool();}
calcTool();
</script>
