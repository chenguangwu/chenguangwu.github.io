<h1 class="sr-only">τ = N I A B·sinθ</h1>

<div class="nav">

  <span>/ 线圈磁力矩计算器</span>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>由匝数、电流、面积与磁场求磁力矩</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入匝数 N、电流 I、面积 A、磁感应 B 与夹角 θ，求磁力矩。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">τ = N I A B·sinθ</div>
      <p class="formula-desc">输入匝数 N、电流 I、面积 A、磁感应 B 与夹角 θ，求磁力矩。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="N">匝数 N</label>
        <input type="number" id="N" value="200" step="1">
      </div>
      <div>
        <label for="I">电流 I (A)</label>
        <input type="number" id="I" value="0.5" step="0.1">
      </div>
      <div>
        <label for="A">面积 A (m²)</label>
        <input type="number" id="A" value="0.01" step="0.001">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="B">磁感应 B (T)</label>
        <input type="number" id="B" value="0.1" step="0.01">
      </div>
      <div>
        <label for="th">夹角 θ (°)</label>
        <input type="number" id="th" value="90" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ = N I A B·sinθ。</li>
        <li>N=200,I=0.5A,A=0.01,B=0.1T,θ=90° → 0.1 N·m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const N=num('N'),I=num('I'),A=num('A'),B=num('B'),th=num('th');
            const tau=N*I*A*B*Math.sin(th*Math.PI/180);
            ToolBox.setResult('result', dataGrid([
                [tau.toFixed(4),'磁力矩 τ (N·m)']
            ]));
        }
function resetForm(){document.getElementById('N').value = '200';
      document.getElementById('I').value = '0.5';
      document.getElementById('A').value = '0.01';
      document.getElementById('B').value = '0.1';
      document.getElementById('th').value = '90';
      calcTool();}
calcTool();
</script>
