<h1 class="sr-only">长直导线磁场计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>安培定律（B = μ₀·I / (2π·r)）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">无限长直导线周围的环向磁感应强度。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">B = μ₀</div>
      <p class="formula-desc">无限长直导线周围的环向磁感应强度。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="I">电流 (A)</label>
        <input type="number" id="I" value="10" step="0.1">
      </div>
      <div>
        <label for="r">距离 (m)</label>
        <input type="number" id="r" value="0.01" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>B = μ₀I/(2πr)，μ₀ = 4π×10⁻⁷ H/m。</li>
        <li>10 A、1 cm 处约 2×10⁻⁴ T。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const I = num('I'), r = num('r');
            const mu0 = 4 * Math.PI * 1e-7;
            const B = mu0 * I / (2 * Math.PI * r);
            ToolBox.setResult('result', dataGrid([
                [B.toExponential(3), '磁感应强度 B (T)'],
                [(B * 1e6).toFixed(2), 'B (µT)']
            ]));
        }
function resetForm(){document.getElementById('I').value = '10';
      document.getElementById('r').value = '0.01';
      calcTool();}
calcTool();
</script>
