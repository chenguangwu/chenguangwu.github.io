<div class="container">
  <div class="card">
    <h2>感应电动势（ε = N·|ΔΦ| / Δt）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">线圈磁通变化率产生感应电动势。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ε = N·|ΔΦ|/Δt（法拉第定律）。 100 匝、0.001 Wb/0.1 s 得 1 V。</div>
      <p class="formula-desc">线圈磁通变化率产生感应电动势。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="N">匝数</label>
        <input type="number" id="N" value="100" step="1">
      </div>
      <div>
        <label for="dPhi">磁通变化 (Wb)</label>
        <input type="number" id="dPhi" value="0.001" step="0.0001">
      </div>
      <div>
        <label for="dt">时间间隔 (s)</label>
        <input type="number" id="dt" value="0.1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ε = N·|ΔΦ|/Δt（法拉第定律）。</li>
        <li>100 匝、0.001 Wb/0.1 s 得 1 V。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const N = num('N'), dPhi = num('dPhi'), dt = num('dt');
            const eps = N * Math.abs(dPhi) / dt;
            ToolBox.setResult('result', dataGrid([
                [eps.toFixed(4), '感应电动势 ε (V)'],
                [(eps / N).toFixed(6), '每匝 (V)']
            ]));
        }
function resetForm(){document.getElementById('N').value = '100';
      document.getElementById('dPhi').value = '0.001';
      document.getElementById('dt').value = '0.1';
      calcTool();}
calcTool();
</script>
