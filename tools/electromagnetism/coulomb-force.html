<div class="container">
  <div class="card">
    <h2>由两点电荷与距离求静电力</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两电荷 q1、q2（库仑）与距离 r（米），求库仑力大小。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F = k·|q1·q2|/r²，k≈8.99×10⁹。 q=1µC,r=1m → F≈8.99 N。</div>
      <p class="formula-desc">输入两电荷 q1、q2（库仑）与距离 r（米），求库仑力大小。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="q1">电荷 q₁ (C)</label>
        <input type="number" id="q1" value="1e-6" step="1e-7">
      </div>
      <div>
        <label for="q2">电荷 q₂ (C)</label>
        <input type="number" id="q2" value="1e-6" step="1e-7">
      </div>
      <div>
        <label for="r">距离 r (m)</label>
        <input type="number" id="r" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>F = k·|q1·q2|/r²，k≈8.99×10⁹。</li>
        <li>q=1µC,r=1m → F≈8.99 N。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const k=8.987551787e9;
            const q1=num('q1'),q2=num('q2'),r=num('r');
            const F=k*Math.abs(q1*q2)/(r*r);
            ToolBox.setResult('result', dataGrid([
                [F.toFixed(4),'库仑力 F (N)']
            ]));
        }
function resetForm(){document.getElementById('q1').value = '1e-6';
      document.getElementById('q2').value = '1e-6';
      document.getElementById('r').value = '1';
      calcTool();}
calcTool();
</script>
