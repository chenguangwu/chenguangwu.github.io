<div class="container">
  <div class="card">
    <h2>串联等效（1/C = 1/C₁ + 1/C₂）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">串联电容总电容减小。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">1/C = 1/C₁ + 1/C₂</div>
      <p class="formula-desc">串联电容总电容减小。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="C1">电容 C₁ (µF)</label>
        <input type="number" id="C1" value="2" step="0.1">
      </div>
      <div>
        <label for="C2">电容 C₂ (µF)</label>
        <input type="number" id="C2" value="2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1/C_eq = 1/C₁ + 1/C₂。</li>
        <li>两个 2 µF 串联 = 1 µF。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const C1 = num('C1'), C2 = num('C2');
            const C = 1 / (1 / C1 + 1 / C2);
            ToolBox.setResult('result', dataGrid([
                [C.toFixed(4), '等效电容 C (µF)'],
                [(C1 + C2).toFixed(4), '并联等效 (µF)']
            ]));
        }
function resetForm(){document.getElementById('C1').value = '2';
      document.getElementById('C2').value = '2';
      calcTool();}
calcTool();
</script>
