<h1 class="sr-only">V = k·q / r</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>由点电荷与距离求电势</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入点电荷 q 与距离 r，求电势。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">V = k·q/r（取无穷远为0）。 q=1µC,r=1m → 8.99×10³ V。</div>
      <p class="formula-desc">输入点电荷 q 与距离 r，求电势。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="q">电荷 q (C)</label>
        <input type="number" id="q" value="1e-6" step="1e-7">
      </div>
      <div>
        <label for="r">距离 r (m)</label>
        <input type="number" id="r" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>V = k·q/r（取无穷远为0）。</li>
        <li>q=1µC,r=1m → 8.99×10³ V。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const k=8.987551787e9;
            const q=num('q'),r=num('r');
            const V=k*q/r;
            ToolBox.setResult('result', dataGrid([
                [V.toFixed(3),'电势 V (V)']
            ]));
        }
function resetForm(){document.getElementById('q').value = '1e-6';
      document.getElementById('r').value = '1';
      calcTool();}
calcTool();
</script>
