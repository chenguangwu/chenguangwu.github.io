<div class="container">
  <div class="card">
    <h2>串联等效（L = L₁ + L₂）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">串联电感总和即为等效电感（忽略互感）。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">L = L₁ + L₂</div>
      <p class="formula-desc">串联电感总和即为等效电感（忽略互感）。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="L1">电感 L₁ (mH)</label>
        <input type="number" id="L1" value="1" step="0.1">
      </div>
      <div>
        <label for="L2">电感 L₂ (mH)</label>
        <input type="number" id="L2" value="2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>L_eq = L₁ + L₂（无互感）。</li>
        <li>1+2 = 3 mH。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const L1 = num('L1'), L2 = num('L2');
            const L = L1 + L2;
            ToolBox.setResult('result', dataGrid([
                [L.toFixed(4), '等效电感 L (mH)'],
                [(1 / (1/L1 + 1/L2)).toFixed(4), '并联等效 (mH)']
            ]));
        }
function resetForm(){document.getElementById('L1').value = '1';
      document.getElementById('L2').value = '2';
      calcTool();}
calcTool();
</script>
