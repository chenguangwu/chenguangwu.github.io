<div class="container">
  <div class="card">
    <h2>d·sinθ = m·λ</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由光栅常数与波长求第 m 级衍射角。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">sinθ = mλ。 1000 线/mm 的 d=1µm。</div>
      <p class="formula-desc">由光栅常数与波长求第 m 级衍射角。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="d">光栅常数 d (m)</label>
        <input type="number" id="d" value="1e-6" step="1e-7">
      </div>
      <div>
        <label for="lam">波长 λ (m)</label>
        <input type="number" id="lam" value="500e-9" step="10e-9">
      </div>
      <div>
        <label for="m">级次 m</label>
        <input type="number" id="m" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>d·sinθ = mλ。</li>
        <li>1000 线/mm 的 d=1µm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const d = num('d'), lam = num('lam'), m = Math.round(num('m'));
            const s = m * lam / d;
            if (s > 1) {
                ToolBox.setResult('result', dataGrid([['该级次不存在（|sinθ|>1）', '']]));
            } else {
                const th = Math.asin(s) * 180 / Math.PI;
                ToolBox.setResult('result', dataGrid([
                    [th.toFixed(3), '衍射角 θ (°)']
                ]));
            }
        }
function resetForm(){document.getElementById('d').value = '1e-6';
      document.getElementById('lam').value = '500e-9';
      document.getElementById('m').value = '1';
      calcTool();}
calcTool();
</script>
