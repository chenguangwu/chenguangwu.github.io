<div class="container">
  <div class="card">
    <h2>d_min = 0.61·λ / NA</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">显微镜由数值孔径决定的最小分辨距离。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d_min = 0.61</div>
      <p class="formula-desc">显微镜由数值孔径决定的最小分辨距离。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="lam">波长 λ (m)</label>
        <input type="number" id="lam" value="550e-9" step="10e-9">
      </div>
      <div>
        <label for="na">数值孔径 NA</label>
        <input type="number" id="na" value="1.3" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>d_min = 0.61λ/NA。</li>
        <li>油镜 NA≈1.4 可分辨 ~240 nm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const lam = num('lam'), na = num('na');
            const d = 0.61 * lam / na;
            ToolBox.setResult('result', dataGrid([
                [(d * 1e9).toFixed(3), '最小分辨距离 (nm)']
            ]));
        }
function resetForm(){document.getElementById('lam').value = '550e-9';
      document.getElementById('na').value = '1.3';
      calcTool();}
calcTool();
</script>
