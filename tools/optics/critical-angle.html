<div class="container">
  <div class="card">
    <h2>θ_c = arcsin(n₂ / n₁)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="光从光密到光疏介质发生全反射的最小角。">Critical Angle is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">θ_c = arcsin(n₂/n₁)。 玻璃→空气 ≈ 41.8°。</div>
      <p class="formula-desc">光从光密到光疏介质发生全反射的最小角。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n1">折射率 n₁（密）</label>
        <input type="number" id="n1" value="1.5" step="0.01">
      </div>
      <div>
        <label for="n2">折射率 n₂（疏）</label>
        <input type="number" id="n2" value="1.0" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>θ_c = arcsin(n₂/n₁)。</li>
        <li>玻璃→空气 ≈ 41.8°。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n1 = num('n1'), n2 = num('n2');
            const s = n2 / n1;
            if (s > 1) {
                ToolBox.setResult('result', dataGrid([['无全反射（n₁ 须 > n₂）', '']]));
            } else {
                const tc = Math.asin(s) * 180 / Math.PI;
                ToolBox.setResult('result', dataGrid([
                    [tc.toFixed(3), '临界角 θ_c (°)']
                ]));
            }
        }
function resetForm(){document.getElementById('n1').value = '1.5';
      document.getElementById('n2').value = '1.0';
      calcTool();}
calcTool();
</script>
