<div class="container">
  <div class="card">
    <h2>1/f = (n−1)·(1/R₁ − 1/R₂)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由曲率半径与折射率求薄透镜焦距。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f = (n−1)(1/R₁−1/R₂)。 双凸 n=1.5、R=±0.2 → f=0.2 m。</div>
      <p class="formula-desc">由曲率半径与折射率求薄透镜焦距。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">折射率 n</label>
        <input type="number" id="n" value="1.5" step="0.01">
      </div>
      <div>
        <label for="r1">曲率半径 R₁ (m)</label>
        <input type="number" id="r1" value="0.2" step="0.01">
      </div>
      <div>
        <label for="r2">曲率半径 R₂ (m)</label>
        <input type="number" id="r2" value="-0.2" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1/f = (n−1)(1/R₁−1/R₂)。</li>
        <li>双凸 n=1.5、R=±0.2 → f=0.2 m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n = num('n'), r1 = num('r1'), r2 = num('r2');
            const f = 1 / ((n - 1) * (1 / r1 - 1 / r2));
            ToolBox.setResult('result', dataGrid([
                [f.toFixed(4), '焦距 f (m)'],
                [(f * 100).toFixed(2), 'f (cm)']
            ]));
        }
function resetForm(){document.getElementById('n').value = '1.5';
      document.getElementById('r1').value = '0.2';
      document.getElementById('r2').value = '-0.2';
      calcTool();}
calcTool();
</script>
