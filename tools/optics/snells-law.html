<div class="container">
  <div class="card">
    <h2>斯涅尔定律折射计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">n₁·sinθ₁ = n₂·sinθ₂</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由入射角与折射率求折射角。</p>

    <div class="input-row">
      <div>
        <label for="n1">折射率 n₁</label>
        <input type="number" id="n1" value="1.0" step="0.01">
      </div>
      <div>
        <label for="n2">折射率 n₂</label>
        <input type="number" id="n2" value="1.5" step="0.01">
      </div>
      <div>
        <label for="t1">入射角 θ₁ (°)</label>
        <input type="number" id="t1" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>n₁sinθ₁ = n₂sinθ₂。</li>
        <li>光从空气入玻璃会向法线偏折。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n1 = num('n1'), n2 = num('n2'), t1 = num('t1') * Math.PI / 180;
            const s = n1 * Math.sin(t1) / n2;
            if (s > 1) {
                ToolBox.setResult('result', dataGrid([['发生全反射（无折射）', '']]));
            } else {
                const t2 = Math.asin(s) * 180 / Math.PI;
                ToolBox.setResult('result', dataGrid([
                    [t2.toFixed(3), '折射角 θ₂ (°)']
                ]));
            }
        }
function resetForm(){document.getElementById('n1').value = '1.0';
      document.getElementById('n2').value = '1.5';
      document.getElementById('t1').value = '30';
      calcTool();}
calcTool();
</script>
