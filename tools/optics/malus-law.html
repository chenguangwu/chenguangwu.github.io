<div class="container">
  <div class="card">
    <h2>由起偏光强与偏振片夹角求透射光强</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入入射光强 I₀ 与偏振片夹角 θ（度），求透射光强。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">I = I₀·cos²θ</div>
      <p class="formula-desc">输入入射光强 I₀ 与偏振片夹角 θ（度），求透射光强。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="I0">入射光强 I₀</label>
        <input type="number" id="I0" value="100" step="5">
      </div>
      <div>
        <label for="th">夹角 θ (度)</label>
        <input type="number" id="th" value="60" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>θ=90° 时完全消光。</li>
        <li>100,60° → 25.0。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const I0=num('I0'),th=num('th')*Math.PI/180;
            const I=I0*Math.pow(Math.cos(th),2);
            ToolBox.setResult('result', dataGrid([
                [I.toFixed(2),'透射光强 I']
            ]));
        }
function resetForm(){document.getElementById('I0').value = '100';
      document.getElementById('th').value = '60';
      calcTool();}
calcTool();
</script>
