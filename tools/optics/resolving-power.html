<h1 class="sr-only">R = D / (1.22·λ)</h1>

<div class="container">
  <div class="card">
    <h2>由孔径与波长求圆形孔径分辨本领</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入孔径直径 D 与波长 λ（纳米），求分辨本领。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = D/(1.22·λ)</div>
      <p class="formula-desc">输入孔径直径 D 与波长 λ（纳米），求分辨本领。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="D">孔径 D (米)</label>
        <input type="number" id="D" value="0.1" step="0.01">
      </div>
      <div>
        <label for="lam">波长 λ (纳米)</label>
        <input type="number" id="lam" value="550" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R 越大分辨越细。</li>
        <li>0.1 m,550 nm → 约 1.49×10⁵。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const D=num('D'),lam=num('lam')*1e-9;
            const R=D/(1.22*lam);
            ToolBox.setResult('result', dataGrid([
                [R.toFixed(0),'分辨本领 R (1/m)']
            ]));
        }
function resetForm(){document.getElementById('D').value = '0.1';
      document.getElementById('lam').value = '550';
      calcTool();}
calcTool();
</script>
