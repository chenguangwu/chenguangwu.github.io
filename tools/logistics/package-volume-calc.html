<div class="container">
  <div class="card">
    <h2 data-zh="📐 包装材积计算器">📐 Package Volume Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="支持体积和材积重估算，适用于物流报价。">Calculate package volume and estimated packing occupancy.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：包装材积计算器。</p>
</div>


    <div class="input-row">
      <label>长度（cm）</label>
      <input type="number" id="l" value="40" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>宽度（cm）</label>
      <input type="number" id="w" value="30" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>高度（cm）</label>
      <input type="number" id="h" value="20" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>抛比（如 5000）</label>
      <input type="number" id="factor" value="5000" min="1" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const l = parseFloat(document.getElementById('l').value) || 0;
  const w = parseFloat(document.getElementById('w').value) || 0;
  const h = parseFloat(document.getElementById('h').value) || 0;
  const factor = parseFloat(document.getElementById('factor').value) || 1;

  const volumeCm3 = l * w * h;
  const volumeM3 = volumeCm3 / 1_000_000;
  const vWeight = volumeCm3 / factor;

  document.getElementById('result').innerHTML =
    `<p>尺寸体积：<strong>${volumeCm3.toFixed(1)} cm³</strong></p>` +
    `<p>体积（m³）：<strong>${volumeM3.toFixed(4)}</strong></p>` +
    `<p>材积重：<strong style="color:var(--primary)">${vWeight.toFixed(2)} kg</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg306'));
}

calc();
</script>
