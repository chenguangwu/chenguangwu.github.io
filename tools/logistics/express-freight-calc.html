<div class="container">
  <div class="card">
    <h2 data-zh="📦 快递运费计算器">📦 Express Freight Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按首重、续重和体积重估算运费。">Estimate shipping freight by weight, dimensions, and zone.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：快递运费计算器。</p>
</div>


    <div class="input-row">
      <label>首重（kg）</label>
      <input type="number" id="firstWeight" value="1" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>首重运费（元）</label>
      <input type="number" id="firstFee" value="8" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>续重单价（元/kg）</label>
      <input type="number" id="stepFee" value="4" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>实重（kg）</label>
      <input type="number" id="actualWeight" value="3" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>体积重（kg）</label>
      <input type="number" id="volumeWeight" value="2" min="0" step="0.1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算运费</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const firstWeight = parseFloat(document.getElementById('firstWeight').value) || 0;
  const firstFee = parseFloat(document.getElementById('firstFee').value) || 0;
  const stepFee = parseFloat(document.getElementById('stepFee').value) || 0;
  const actualWeight = parseFloat(document.getElementById('actualWeight').value) || 0;
  const volumeWeight = parseFloat(document.getElementById('volumeWeight').value) || 0;

  const chargeable = Math.max(actualWeight, volumeWeight);
  const extra = Math.max(0, chargeable - firstWeight);
  const fee = firstFee + extra * stepFee;

  document.getElementById('result').innerHTML =
    `<p>计费重量：<strong>${chargeable.toFixed(2)} kg</strong></p>` +
    `<p>超首重：<strong>${extra.toFixed(2)} kg</strong></p>` +
    `<p>预计运费：<strong style="color:var(--primary)">${fee.toFixed(2)} 元</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg358'));
}

calc();
</script>
