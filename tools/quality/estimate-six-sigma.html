<div class="container">
  <div class="card">
    <h2>🎯 六西格玛水平（σ）估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据 DPMO 或缺陷数据计算过程西格玛水平（含1.5σ漂移）、良率</p>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="dpmo" onclick="switchTab('dpmo')">直接输入 DPMO</button>
      <button class="tab-btn" data-tab="defect" onclick="switchTab('defect')">按缺陷数据计算</button>
    </div>

    <div class="tab-content active" id="tab-dpmo">
      <div class="input-row">
        <div>
          <label>DPMO（每百万机会缺陷数）</label>
          <input type="number" id="dpmo" value="6210" min="0" step="1" oninput="calc()">
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-defect">
      <div class="input-row">
        <div>
          <label>缺陷数</label>
          <input type="number" id="defects" value="62" min="0" step="1" oninput="calc()">
        </div>
        <div>
          <label>产品单位数</label>
          <input type="number" id="units" value="10000" min="1" step="1" oninput="calc()">
        </div>
        <div>
          <label>每单位机会数</label>
          <input type="number" id="opps" value="1" min="1" step="1" oninput="calc()">
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <h3 style="margin-top:18px;">DPMO — Sigma 水平对照表（含1.5σ漂移）</h3>
    <div id="refTable"></div>

    <div class="tip-box tip-info">📖 西格玛水平 = Z + 1.5（短期），其中 Z = normsinv(良率)，良率 = 1 − DPMO/1,000,000。六西格玛（6σ）对应 3.4 DPMO。1.5σ漂移为六西格玛标准假设。</div>
  </div>
</div>

<script>
function fmt(n, d){ if(isNaN(n) || !isFinite(n)) return '—'; return ToolBox.formatNumber(n, d != null ? d : 4); }

var currentTab = 'dpmo';
function switchTab(t){
  currentTab = t;
  document.querySelectorAll('#tabs .tab-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === t);
  });
  document.getElementById('tab-dpmo').classList.toggle('active', t === 'dpmo');
  document.getElementById('tab-defect').classList.toggle('active', t === 'defect');
  calc();
}

// 逆标准正态CDF (Peter Acklam 算法)
function normsInv(p){
  if(p <= 0) return -Infinity;
  if(p >= 1) return Infinity;
  var a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
  var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
  var plow = 0.02425, phigh = 1 - plow;
  var q, r;
  if(p < plow){
    q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else if(p <= phigh){
    q = p - 0.5; r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  } else {
    q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

function levelInfo(sigma){
  if(sigma >= 6) return { tag: '六西格玛 · 世界级', cls: 'grade-excellent' };
  if(sigma >= 5) return { tag: '五西格玛 · 优秀', cls: 'grade-excellent' };
  if(sigma >= 4) return { tag: '四西格玛 · 良好', cls: 'grade-good' };
  if(sigma >= 3) return { tag: '三西格玛 · 一般', cls: 'grade-pass' };
  if(sigma >= 2) return { tag: '二西格玛 · 较差', cls: 'grade-fail' };
  return { tag: '低于二西格玛 · 差', cls: 'grade-fail' };
}

function calc(){
  var res = document.getElementById('res');
  var dpmo;
  if(currentTab === 'dpmo'){
    dpmo = parseFloat(document.getElementById('dpmo').value) || 0;
  } else {
    var defects = parseFloat(document.getElementById('defects').value) || 0;
    var units = parseFloat(document.getElementById('units').value) || 0;
    var opps = parseFloat(document.getElementById('opps').value) || 0;
    if(units <= 0 || opps <= 0){ res.innerHTML = '<p style="color:var(--text-muted);">单位数与机会数须大于0</p>'; return; }
    dpmo = (defects * 1000000) / (units * opps);
  }

  if(dpmo < 0) dpmo = 0;
  if(dpmo > 1000000) dpmo = 1000000;

  var yieldPct = (1 - dpmo/1000000) * 100;
  var yieldP = 1 - dpmo/1000000;
  // 短期 sigma = Zlt + 1.5
  var zlt = yieldP > 0 && yieldP < 1 ? normsInv(yieldP) : (yieldP >= 1 ? 5.5 : -5);
  var sigmaST = zlt + 1.5;
  if(sigmaST < 0) sigmaST = 0;

  var info = levelInfo(sigmaST);
  var svg = buildBar(sigmaST);

  res.innerHTML =
    '<div class="data-grid">' +
      '<div class="sig-stat"><div class="sub">西格玛水平（短期）</div><div class="big">' + fmt(sigmaST,2) + 'σ</div><span class="level-badge ' + info.cls + '">' + info.tag + '</span></div>' +
      '<div class="sig-stat"><div class="sub">DPMO</div><div class="big">' + fmt(dpmo,0) + '</div></div>' +
      '<div class="sig-stat"><div class="sub">良率 Yield</div><div class="big">' + fmt(yieldPct,4) + '%</div></div>' +
    '</div>' +
    '<div class="step-line">良率 = 1 − ' + fmt(dpmo,0) + '/1,000,000 = <strong>' + fmt(yieldPct,4) + '%</strong></div>' +
    '<div class="step-line">Z(长期) = normsinv(' + fmt(yieldP,6) + ') = <strong>' + fmt(zlt,4) + '</strong></div>' +
    '<div class="step-line">西格玛水平 = Z + 1.5 = <strong>' + fmt(sigmaST,4) + 'σ</strong></div>' +
    '<div class="chart-wrap">' +
      '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">当前西格玛水平</div>' +
      svg +
    '</div>';
}

function buildBar(sigma){
  var W = 600, Hh = 120, padL = 20, padR = 20, padT = 30, padB = 30;
  var plotW = W - padL - padR;
  var maxSig = 6;
  var frac = Math.min(1, sigma / maxSig);
  var x = padL, w = plotW * frac;
  var barY = padT + 20, barH = 26;

  var ticks = '';
  for(var i = 0; i <= 6; i++){
    var tx = padL + plotW * i / 6;
    ticks += '<line x1="' + tx + '" y1="' + barY + '" x2="' + tx + '" y2="' + (barY + barH + 5) + '" stroke="var(--border)" stroke-width="1"/>';
    ticks += '<text x="' + tx + '" y="' + (barY + barH + 18) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + i + 'σ</text>';
  }

  return '<svg viewBox="0 0 ' + W + ' ' + Hh + '" preserveAspectRatio="xMidYMid meet">' +
    '<rect x="' + x + '" y="' + barY + '" width="' + plotW + '" height="' + barH + '" rx="6" fill="var(--border)"/>' +
    '<rect x="' + x + '" y="' + barY + '" width="' + w + '" height="' + barH + '" rx="6" fill="url(#siggrad)"/>' +
    '<defs><linearGradient id="siggrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#EF4444"/><stop offset="0.5" stop-color="#F59E0B"/><stop offset="1" stop-color="#10B981"/></linearGradient></defs>' +
    ticks +
    '<text x="' + (x + w) + '" y="' + (barY - 6) + '" text-anchor="middle" font-size="13" font-weight="700" fill="var(--primary)">' + fmt(sigma,2) + 'σ</text>' +
  '</svg>';
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText(), 'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('dpmo').value = 6210;
  document.getElementById('defects').value = 62;
  document.getElementById('units').value = 10000;
  document.getElementById('opps').value = 1;
  calc();
}

// 参考对照表
function buildRefTable(){
  var rows = [
    ['6σ', 3.4, 99.99966],
    ['5σ', 233, 99.977],
    ['4σ', 6210, 99.379],
    ['3σ', 66807, 93.32],
    ['2σ', 308537, 69.15],
    ['1σ', 690000, 30.85]
  ];
  document.getElementById('refTable').innerHTML = ToolBox.createTable(['西格玛水平','DPMO','良率(%)'], rows);
}

calc();
buildRefTable();
</script>
