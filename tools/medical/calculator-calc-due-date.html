<body>
<h1 class="sr-only">预产期计算器（末次月经）</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 预产期计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>

  <span class="bc-current">预产期计算器（医疗）</span>
</nav>
<div class="container">
  <div class="card">
    <h2>⚕️ 预产期计算器（医疗）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据末次月经（LMP）、受孕日或 IVF 胚胎移植日，按 Naegele 法则计算预产期、当前孕周及关键产检里程碑。</p>

    <div class="tabs">
      <button class="tab-btn active" type="button" onclick="switchTab('lmp')">末次月经</button>
      <button class="tab-btn" type="button" onclick="switchTab('conception')">受孕日</button>
      <button class="tab-btn" type="button" onclick="switchTab('ivf')">IVF 移植日</button>
    </div>

    <div class="tab-content active" id="tab-lmp">
      <div class="input-row">
        <div>
          <label>末次月经开始日</label>
          <input type="date" id="lmpDate" oninput="calc()">
        </div>
        <div>
          <label>月经周期 (天)</label>
          <input type="number" id="cycle" value="28" step="1" min="21" max="45" oninput="calc()" enterkeyhint="done">
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-conception">
      <div class="input-row">
        <div>
          <label>受孕日</label>
          <input type="date" id="conceptionDate" oninput="calc()">
        </div>
      </div>
      <div class="tip-box tip-info">受孕日约为末次月经后 14 天（排卵日）。预产期 = 受孕日 + 266 天。</div>
    </div>

    <div class="tab-content" id="tab-ivf">
      <div class="input-row">
        <div>
          <label>胚胎移植日</label>
          <input type="date" id="ivfDate" oninput="calc()">
        </div>
        <div>
          <label>胚胎天数</label>
          <select id="embryoAge" onchange="calc()">
            <option value="3">第3天卵裂期胚胎</option>
            <option value="5" selected>第5天囊胚</option>
            <option value="6">第6天囊胚</option>
          </select>
        </div>
      </div>
      <div class="tip-box tip-info">IVF 预产期 = 移植日 + 266 − 胚胎天数。即 LMP = 移植日 − (14 + 胚胎天数)。</div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算预产期</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-warn">
      ⚠️ 预产期仅为估算，实际分娩日期可能前后相差 1-2 周。月经周期不规则者建议以早期 B 超校正孕周。
    </div>
  </div>
</div>

<script>
var currentTab='lmp';
function switchTab(t){
  currentTab=t;
  ['lmp','conception','ivf'].forEach(function(x){
    var btn=document.querySelector('.tab-btn[onclick*="'+x+'"]');
    var ct=document.getElementById('tab-'+x);
    if(x===t){btn.classList.add('active');ct.classList.add('active');}else{btn.classList.remove('active');ct.classList.remove('active');}
  });
  calc();
}
function parseDate(s){if(!s)return null;var d=new Date(s);if(isNaN(d.getTime()))return null;return d;}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtCN(d){var w=['日','一','二','三','四','五','六'];return d.getMonth()+1+'月'+d.getDate()+'日 周'+w[d.getDay()];}
function addDays(d,n){var nd=new Date(d);nd.setDate(nd.getDate()+n);return nd;}
function getLMP(){
  if(currentTab==='lmp'){
    var d=parseDate(document.getElementById('lmpDate').value);return d;
  }
  if(currentTab==='conception'){
    var c=parseDate(document.getElementById('conceptionDate').value);
    if(!c)return null;return addDays(c,-14);
  }
  if(currentTab==='ivf'){
    var v=parseDate(document.getElementById('ivfDate').value);
    if(!v)return null;
    var emb=+document.getElementById('embryoAge').value;
    return addDays(v,-(14+emb));
  }
  return null;
}
function calc(){
  var lmp=getLMP();
  var res=document.getElementById('res');
  if(!lmp){res.innerHTML='<p style="color:var(--danger);">请选择有效日期</p>';return;}
  var cycle=parseInt(document.getElementById('cycle').value)||28;
  var adjust=cycle-28;
  var edd=addDays(lmp,280+adjust);
  var conception=addDays(lmp,14);
  var today=new Date();today.setHours(0,0,0,0);
  var daysPreg=Math.floor((today-lmp)/86400000);
  var weeks=Math.floor(daysPreg/7);
  var days=daysPreg%7;
  var trimester, triColor;
  if(daysPreg<0){trimester='尚未怀孕';triColor='var(--text-muted)';}
  else if(weeks<14){trimester='孕早期（第1孕程）';triColor='var(--danger)';}
  else if(weeks<28){trimester='孕中期（第2孕程）';triColor='var(--info)';}
  else if(weeks<=42){trimester='孕晚期（第3孕程）';triColor='var(--warning)';}
  else{trimester='已过期妊娠（>42周）';triColor='var(--danger)';}
  var status, statusColor;
  if(daysPreg<0){status='距末次月经还有 '+(-daysPreg)+' 天';statusColor='var(--text-muted)';}
  else if(weeks>=37&&weeks<=42){status='足月妊娠（37-42周），随时可能分娩';statusColor='var(--success)';}
  else if(weeks>=28){status='先兆临产期，注意待产';statusColor='var(--warning)';}
  else{status='妊娠中';statusColor='var(--info)';}
  var prog=Math.min(Math.max(daysPreg/280*100,0),100);
  var html='<div class="data-grid">';
  html+='<div class="data-card"><div class="num">'+fmtDate(edd)+'</div><div class="label">预产期（EDD）</div></div>';
  html+='<div class="data-card"><div class="num">'+weeks+'<span style="font-size:14px;">周+'+days+'天</span></div><div class="label">当前孕周</div></div>';
  html+='<div class="data-card"><div class="num" style="font-size:16px;color:'+triColor+'">'+trimester+'</div><div class="label">孕期阶段</div></div>';
  html+='</div>';
  html+='<p style="margin:8px 0 4px;font-size:14px;">末次月经（LMP）：<strong>'+fmtCN(lmp)+'</strong></p>';
  html+='<p style="margin:4px 0;font-size:14px;">预计受孕日（排卵）：<strong>'+fmtCN(conception)+'</strong></p>';
  html+='<p style="margin:4px 0;font-size:14px;">'+status+'</p>';
  html+='<div class="progress-bar"><div class="progress-fill" style="width:'+prog.toFixed(0)+'%;"></div></div>';
  html+='<p style="font-size:12px;color:var(--text-muted);">孕期进度约 '+prog.toFixed(1)+'%（共 280 天）</p>';
  if(currentTab==='lmp'&&cycle!==28){html+='<div class="tip-box tip-info">月经周期 '+cycle+' 天，已按周期差异调整 '+(adjust>0?'+':'')+adjust+' 天。</div>';}
  var ms=[
    {w:13,name:'NT 颈项透明层超声（11-13⁺⁶周）',range:'11-14周'},
    {w:20,name:'大排畸超声（18-22周）',range:'18-22周'},
    {w:18,name:'唐筛/无创DNA（15-20周）',range:'15-20周'},
    {w:26,name:'妊娠期糖尿病筛查 OGTT（24-28周）',range:'24-28周'},
    {w:36,name:'B族链球菌筛查 GBS（35-37周）',range:'35-37周'},
    {w:37,name:'足月（37周起）',range:'≥37周'},
    {w:40,name:'预产期（40周）',range:'40周'}
  ];
  html+='<h3 style="margin-top:16px;">📅 关键产检里程碑</h3><table><thead><tr><th>项目</th><th>推荐孕周</th><th>预计日期</th></tr></thead><tbody>';
  ms.forEach(function(m){
    var d=addDays(lmp,m.w*7);
    var past=daysPreg>=m.w*7;
    html+='<tr'+(past?' style="color:var(--text-muted);"':'')+'><td>'+m.name+'</td><td>'+m.range+'</td><td>'+fmtDate(d)+(past?' ✓':'')+'</td></tr>';
  });
  html+='</tbody></table>';
  res.innerHTML=html;
}
function copyRes(){var t=document.getElementById('res').innerText;if(!t||!t.trim()){ToolBox.showToast(i18nText(),'warning');return;}ToolBox.copyText(t);}
function resetAll(){
  var today=new Date();
  var lmp=addDays(today,-70);
  document.getElementById('lmpDate').value=fmtDate(lmp);
  document.getElementById('cycle').value=28;
  document.getElementById('conceptionDate').value=fmtDate(addDays(lmp,14));
  document.getElementById('ivfDate').value=fmtDate(today);
  document.getElementById('embryoAge').value=5;
  switchTab('lmp');calc();ToolBox.showToast(i18nText(),'info');
}
document.addEventListener('DOMContentLoaded',function(){
  var today=new Date();
  document.getElementById('lmpDate').value=fmtDate(addDays(today,-70));
  document.getElementById('conceptionDate').value=fmtDate(addDays(today,-56));
  document.getElementById('ivfDate').value=fmtDate(today);
  calc();
});
</script>
</body>
</html>
