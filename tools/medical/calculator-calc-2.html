<body>
<h1 class="sr-only">用药剂量计算器（按体重kg）</h1>

<div class="container">
  <div class="card">
    <h2>⚕️ 用药剂量计算器（按体重kg）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">选择药物并输入体重，自动按 mg/kg 计算单次剂量、每日总量及最大日剂量校验。</p>

    <div class="input-row">
      <div>
        <label>选择药物</label>
        <select id="drug" onchange="onDrugChange();calc()"></select>
      </div>
      <div>
        <label>体重 (kg)</label>
        <input type="number" id="weight" value="20" step="0.1" min="0.5" oninput="calc()" enterkeyhint="done" aria-label="体重 千克">
      </div>
      <div>
        <label>年龄 (岁，选填)</label>
        <input type="number" id="age" value="" step="1" min="0" oninput="calc()" enterkeyhint="done" aria-label="年龄 岁">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>给药频次</label>
        <select id="freq" onchange="calc()"></select>
      </div>
      <div>
        <label>剂量强度</label>
        <select id="tier" onchange="calc()">
          <option value="low">下限（低剂量）</option>
          <option value="mid" selected>中位（常规）</option>
          <option value="high">上限（高剂量）</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算剂量</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="ref-card" id="drugInfo"></div>

    <div class="tip-box tip-warn">
      ⚠️ 本工具仅供学习参考，剂量须结合患者肝肾功能、过敏史、合并用药由临床医生判断。<br>
      <strong>注意：</strong>儿童与成人最大日剂量不同，新生儿/早产儿需另行调整，请务必核对药品说明书。
    </div>

    <div style="margin-top:16px;">
      <div class="history-header"><h3>🕘 最近计算</h3><button class="btn" type="button" style="padding:6px 12px;font-size:12px;" onclick="clearHistory()">清空</button></div>
      <div class="history-list" id="historyBox"><div class="history-empty">暂无计算记录</div></div>
    </div>
  </div>
</div>

<script>
/* 常用药物数据库：doseMin/doseMax 单位 mg/kg/次，maxDaily mg/kg/d，interval 每 x 小时一次 */
var DRUGS=[
{n:'对乙酰氨基酚（扑热息痛）',cat:'解热镇痛',doseMin:10,doseMax:15,interval:6,maxDaily:60,adultMaxDaily:4000,note:'每4-6小时一次，儿童单次不超过 15mg/kg，日总量≤60mg/kg（成人≤4g/日）。'},
{n:'布洛芬',cat:'解热镇痛',doseMin:5,doseMax:10,interval:8,maxDaily:40,adultMaxDaily:2400,note:'每6-8小时一次，餐后服用。儿童日总量≤40mg/kg（成人≤2.4g/日）。'},
{n:'阿莫西林',cat:'抗生素',doseMin:20,doseMax:40,interval:8,maxDaily:90,adultMaxDaily:4000,note:'日剂量分 q8h 给药；中耳炎可至 90mg/kg/日。成人一般 250-500mg q8h。'},
{n:'阿莫西林克拉维酸',cat:'抗生素',doseMin:20,doseMax:40,interval:8,maxDaily:90,adultMaxDaily:4000,note:'按阿莫西林成分计算，q8h。新生儿及肝功能异常慎用。'},
{n:'头孢氨苄（先锋IV）',cat:'抗生素',doseMin:25,doseMax:50,interval:6,maxDaily:100,adultMaxDaily:4000,note:'日剂量分 q6h 给药，儿童日总量≤100mg/kg。'},
{n:'头孢呋辛酯',cat:'抗生素',doseMin:20,doseMax:30,interval:12,maxDaily:60,adultMaxDaily:1000,note:'q12h 给药，儿童一般 250mg bid。'},
{n:'头孢曲松',cat:'抗生素',doseMin:50,doseMax:75,interval:24,maxDaily:100,adultMaxDaily:4000,note:'每日一次（q24h），儿童≤2g/日，脑膜炎可至 100mg/kg/日（成人≤4g）。'},
{n:'阿奇霉素',cat:'抗生素',doseMin:10,doseMax:10,interval:24,maxDaily:10,adultMaxDaily:500,note:'首日 10mg/kg 顿服，第2-5日 5mg/kg/日；3日疗法为 10mg/kg/日×3天。成人 500mg qd。'},
{n:'克拉霉素',cat:'抗生素',doseMin:7.5,doseMax:15,interval:12,maxDaily:30,adultMaxDaily:1000,note:'q12h，儿童 7.5mg/kg bid，成人 250-500mg bid。'},
{n:'苯巴比妥（抗癫痫）',cat:'神经系统',doseMin:3,doseMax:5,interval:24,maxDaily:6,adultMaxDaily:300,note:'维持量 3-5mg/kg/日 qd，需监测血药浓度（治疗窗 15-40μg/mL）。'},
{n:'苯妥英钠（抗癫痫）',cat:'神经系统',doseMin:4,doseMax:8,interval:24,maxDaily:8,adultMaxDaily:500,note:'维持量 4-8mg/kg/日，需监测血药浓度（10-20μg/mL）。'},
{n:'地塞米松',cat:'激素',doseMin:0.1,doseMax:0.6,interval:6,maxDaily:2.4,adultMaxDaily:80,note:'抗炎 0.1-0.6mg/kg/日 分次，急性哮喘可 0.6mg/kg 单次。'},
{n:'泼尼松（强的松）',cat:'激素',doseMin:1,doseMax:2,interval:24,maxDaily:2,adultMaxDaily:100,note:'1-2mg/kg/日 qd，肾病综合征常用 2mg/kg/日。'},
{n:'万古霉素',cat:'抗生素',doseMin:10,doseMax:15,interval:8,maxDaily:60,adultMaxDaily:4000,note:'儿童 40-60mg/kg/日 分 q6-8h；成人 1-2g/日。需监测血药浓度（谷浓度 10-20μg/mL）。'},
{n:'氨茶碱',cat:'呼吸系统',doseMin:4,doseMax:6,interval:8,maxDaily:20,adultMaxDaily:900,note:'负荷量 5-6mg/kg；维持量口服 4-6mg/kg q8h。需监测血药浓度（10-20μg/mL）。'},
{n:'左乙拉西坦',cat:'神经系统',doseMin:10,doseMax:20,interval:12,maxDaily:60,adultMaxDaily:3000,note:'起始 10mg/kg bid，可加量至 30mg/kg bid。成人 500-1500mg bid。'}
];
var FREQS=[{l:'q4h（每4小时）',h:4},{l:'q6h（每6小时）',h:6},{l:'q8h（每8小时）',h:8},{l:'q12h（每12小时）',h:12},{l:'q24h（每日一次）',h:24}];
function fmt(mg){if(mg>=1000)return (mg/1000).toFixed(2)+' g';return mg.toFixed(1)+' mg';}
function initDrugs(){
  var sel=document.getElementById('drug'),html='';
  DRUGS.forEach(function(d,i){html+='<option value="'+i+'">'+d.n+'（'+d.cat+'）</option>';});
  sel.innerHTML=html;
}
function onDrugChange(){
  var d=DRUGS[+document.getElementById('drug').value];
  var fsel=document.getElementById('freq'),html='';
  FREQS.forEach(function(f){html+='<option value="'+f.h+'"'+(f.h===d.interval?' selected':'')+'>'+f.l+'</option>';});
  fsel.innerHTML=html;
  document.getElementById('drugInfo').innerHTML='<h4>'+ToolBox.escHtml(d.n)+'</h4><p>分类：'+ToolBox.escHtml(d.cat)+' | 推荐剂量：'+d.doseMin+'-'+d.doseMax+' mg/kg/次 | 常用间隔 q'+d.interval+'h</p><p>'+ToolBox.escHtml(d.note)+'</p>';
}
function calc(){
  var idx=+document.getElementById('drug').value;
  var d=DRUGS[idx]||DRUGS[0];
  var w=parseFloat(document.getElementById('weight').value);
  var ageStr=document.getElementById('age').value;
  var age=ageStr===''?null:parseFloat(ageStr);
  var hours=+document.getElementById('freq').value;
  var tier=document.getElementById('tier').value;
  var elW=document.getElementById('weight');
  if(isNaN(w)||w<=0){elW.classList.add('input-error');document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效体重（kg）</p>';return;}
  elW.classList.remove('input-error');
  var perKg;
  if(tier==='low')perKg=d.doseMin;
  else if(tier==='high')perKg=d.doseMax;
  else perKg=(d.doseMin+d.doseMax)/2;
  var timesPerDay=Math.round(24/hours);
  var singleDose=perKg*w;
  var dailyDose=singleDose*timesPerDay;
  var maxChild=d.maxDaily*w;
  var isAdult=age!==null&&age>=14;
  var maxDaily= isAdult?d.adultMaxDaily:maxChild;
  var overLimit=dailyDose>maxDaily;
  var cappedDaily=Math.min(dailyDose,maxDaily);
  var cappedSingle=cappedDaily/timesPerDay;
  var html='<div class="data-grid">';
  html+='<div class="data-card"><div class="num">'+fmt(singleDose)+'</div><div class="label">单次剂量</div></div>';
  html+='<div class="data-card"><div class="num">'+fmt(dailyDose)+'</div><div class="label">每日总量（'+timesPerDay+'次）</div></div>';
  html+='<div class="data-card"><div class="num">'+fmt(maxDaily)+'</div><div class="label">'+(isAdult?'成人最大日剂量':'儿童最大日剂量')+'</div></div>';
  html+='</div>';
  if(overLimit){
    html+='<div class="tip-box tip-error">⚠️ 计算日剂量 '+fmt(dailyDose)+' 已超过最大日剂量 '+fmt(maxDaily)+'，建议调整：<br>单次剂量 = '+fmt(cappedSingle)+'，按 q'+hours+'h 给药 '+timesPerDay+' 次 = '+fmt(cappedDaily)+'/日。</div>';
  }else{
    html+='<div class="tip-box tip-success">✓ 当前剂量在安全范围内。给药方案：'+fmt(singleDose)+' q'+hours+'h，每日 '+timesPerDay+' 次。</div>';
  }
  if(age!==null&&age<1){html+='<div class="tip-box tip-warn">👶 婴儿（<1岁）肝肾代谢未成熟，建议参照新生儿剂量并由专科医生核定。</div>';}
  if(age!==null&&age>=65){html+='<div class="tip-box tip-warn">👴 老年患者（≥65岁）多伴肾功能下降，建议按肌酐清除率调整剂量。</div>';}
  document.getElementById('res').innerHTML=html;
  saveHistory(d.n,w,age,tier,singleDose,dailyDose);
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t||!t.trim()){ToolBox.showToast(i18nText(),'warning');return;}
  ToolBox.copyText(t);
}
function resetAll(){
  document.getElementById('weight').value=20;
  document.getElementById('age').value='';
  document.getElementById('tier').value='mid';
  onDrugChange();calc();
  ToolBox.showToast(i18nText(),'info');
}
function hkey(){return 'tb_history_'+location.pathname;}
function saveHistory(name,w,age,tier,single,daily){
  try{
    var list=JSON.parse(localStorage.getItem(hkey())||'[]');
    var now=new Date();
    list.unshift({name:name,w:w,age:age,tier:tier,single:+single.toFixed(1),daily:+daily.toFixed(1),time:now.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
    if(list.length>5)list=list.slice(0,5);
    localStorage.setItem(hkey(),JSON.stringify(list));
    renderHistory();
  }catch(e){}
}
function renderHistory(){
  var box=document.getElementById('historyBox');if(!box)return;
  try{
    var list=JSON.parse(localStorage.getItem(hkey())||'[]');
    if(!list.length){box.innerHTML='<div class="history-empty">暂无计算记录</div>';return;}
    var html='';
    list.forEach(function(h){
      html+='<div class="history-item" onclick="restoreHistory(\''+ToolBox.escHtml(h.name).replace(/'/g,"\\'")+'\','+h.w+')">'+
        '<div><div class="time">'+ToolBox.escHtml(h.time)+'</div><div class="summary">'+ToolBox.escHtml(h.name)+' · '+h.w+'kg</div>'+
        '<div class="detail">单次 '+h.single+'mg / 日总量 '+h.daily+'mg</div></div></div>';
    });
    box.innerHTML=html;
  }catch(e){box.innerHTML='<div class="history-empty">读取记录失败</div>';}
}
function restoreHistory(name,w){
  var idx=0;
  DRUGS.forEach(function(d,i){if(d.n===name)idx=i;});
  document.getElementById('drug').value=idx;
  document.getElementById('weight').value=w;
  onDrugChange();calc();
  ToolBox.showToast(i18nText(),'info');
}
function clearHistory(){try{localStorage.removeItem(hkey());renderHistory();ToolBox.showToast(i18nText(),'info');}catch(e){}}
document.addEventListener('DOMContentLoaded',function(){
  initDrugs();onDrugChange();renderHistory();calc();
  document.getElementById('weight').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();calc();}});
});
</script>
</body>
