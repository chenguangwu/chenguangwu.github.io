<h1 class="sr-only">S_n = a(1 − rⁿ) / (1 − r)</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">等比数列求和计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由首项、公比与项数求等比级数和</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入首项 a、公比 r 与项数 n，求前 n 项和。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">S = a₁(1−rⁿ)/(1−r)</div>
      <p class="formula-desc">输入首项 a、公比 r 与项数 n，求前 n 项和。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a">首项 a</label>
        <input type="number" id="a" value="1" step="0.5">
      </div>
      <div>
        <label for="r">公比 r</label>
        <input type="number" id="r" value="0.5" step="0.05">
      </div>
      <div>
        <label for="n">项数 n</label>
        <input type="number" id="n" value="4" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>|r|<1 时数列收敛。</li>
        <li>1,0.5,4 → 1.875。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a=num('a'),r=num('r'),n=num('n');
            const Sn=a*(1-Math.pow(r,n))/(1-r);
            ToolBox.setResult('result', dataGrid([
                [Sn.toFixed(4),'前 n 项和 S_n']
            ]));
        }
function resetForm(){document.getElementById('a').value = '1';
      document.getElementById('r').value = '0.5';
      document.getElementById('n').value = '4';
      calcTool();}
calcTool();
</script>
