<h1 class="sr-only">平面两点距离计算器</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>d = √((x₂−x₁)² + (y₂−y₁)²)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算二维平面上两点的距离。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = √((x₂−x₁)²+(y₂−y₁)²)</div>
      <p class="formula-desc">计算二维平面上两点的距离。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="x1">x₁</label>
        <input type="number" id="x1" value="0" step="0.5">
      </div>
      <div>
        <label for="y1">y₁</label>
        <input type="number" id="y1" value="0" step="0.5">
      </div>
      <div>
        <label for="x2">x₂</label>
        <input type="number" id="x2" value="3" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="y2">y₂</label>
        <input type="number" id="y2" value="4" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>(0,0)→(3,4) 距离 5。</li>
        <li>勾股数 3-4-5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const x1 = num('x1'), y1 = num('y1'), x2 = num('x2'), y2 = num('y2');
            const d = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(4), '距离 d']
            ]));
        }
function resetForm(){document.getElementById('x1').value = '0';
      document.getElementById('y1').value = '0';
      document.getElementById('x2').value = '3';
      document.getElementById('y2').value = '4';
      calcTool();}
calcTool();
</script>
