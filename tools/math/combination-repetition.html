<div class="container">
  <div class="card">
    <h2>由类型数与选取数求可重复组合数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入类型数 n 与选取数 r，求可重复组合数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">可重复组合 C(n+k−1, k)</div>
      <p class="formula-desc">输入类型数 n 与选取数 r，求可重复组合数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">类型数 n</label>
        <input type="number" id="n" value="5" step="1">
      </div>
      <div>
        <label for="r">选取数 r</label>
        <input type="number" id="r" value="3" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>星棒法经典计数。</li>
        <li>n=5,r=3 → 35。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            function factN(k){let v=1;for(let i=2;i<=k;i++)v*=i;return v;}
            const n=num('n'),r=num('r');
            const C=factN(n+r-1)/(factN(r)*factN(n-1));
            ToolBox.setResult('result', dataGrid([
                [C.toFixed(0),'可重复组合数 C']
            ]));
        }
function resetForm(){document.getElementById('n').value = '5';
      document.getElementById('r').value = '3';
      calcTool();}
calcTool();
</script>
