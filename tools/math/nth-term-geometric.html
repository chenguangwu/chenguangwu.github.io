<div class="container">
  <div class="card">
    <h2>由首项、公比与项数求通项</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入首项 a₁、公比 r 与项数 n，求第 n 项。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">a_n = a₁·r^(n−1)</div>
      <p class="formula-desc">输入首项 a₁、公比 r 与项数 n，求第 n 项。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a1">首项 a₁</label>
        <input type="number" id="a1" value="2" step="0.5">
      </div>
      <div>
        <label for="r">公比 r</label>
        <input type="number" id="r" value="3" step="0.5">
      </div>
      <div>
        <label for="n">项数 n</label>
        <input type="number" id="n" value="4" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>指数增长基础公式。</li>
        <li>2·3³ → 54。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a1=num('a1'),r=num('r'),n=num('n');
            const an=a1*Math.pow(r,n-1);
            ToolBox.setResult('result', dataGrid([
                [an.toFixed(3),'第 n 项 aₙ']
            ]));
        }
function resetForm(){document.getElementById('a1').value = '2';
      document.getElementById('r').value = '3';
      document.getElementById('n').value = '4';
      calcTool();}
calcTool();
</script>
