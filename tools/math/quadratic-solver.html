<h1 class="sr-only">一元二次方程求根计算器</h1>

<div class="container">
  <div class="card">
    <h2>ax² + bx + c = 0</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用判别式求解一元二次方程的两个根。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">x = (−b±√Δ)/2a</div>
      <p class="formula-desc">用判别式求解一元二次方程的两个根。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a">系数 a</label>
        <input type="number" id="a" value="1" step="0.1">
      </div>
      <div>
        <label for="b">系数 b</label>
        <input type="number" id="b" value="-3" step="0.1">
      </div>
      <div>
        <label for="c">系数 c</label>
        <input type="number" id="c" value="2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Δ = b²−4ac。</li>
        <li>x²−3x+2=0 → 根 2、1。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a = num('a'), b = num('b'), c = num('c');
            const d = b * b - 4 * a * c;
            if (d < 0) {
                ToolBox.setResult('result', dataGrid([['无实根（Δ<0）', '判别式 Δ']]));
            } else {
                const x1 = (-b + Math.sqrt(d)) / (2 * a);
                const x2 = (-b - Math.sqrt(d)) / (2 * a);
                ToolBox.setResult('result', dataGrid([
                    [d.toFixed(4), '判别式 Δ'],
                    [x1.toFixed(4), '根 x₁'],
                    [x2.toFixed(4), '根 x₂']
                ]));
            }
        }
function resetForm(){document.getElementById('a').value = '1';
      document.getElementById('b').value = '-3';
      document.getElementById('c').value = '2';
      calcTool();}
calcTool();
</script>
