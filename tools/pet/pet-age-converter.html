<div class="container">
  <div class="card">
    <h2>🐕 宠物年龄换算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">狗狗猫咪年龄转换为人类等效年龄（仅近似参考）。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：宠物年龄换算。</p>
</div>


    <label>物种</label>
    <select id="species" onchange="calc()"><option value="dog">狗</option><option value="cat">猫</option></select>

    <div class="input-row">
      <div><label>宠物年龄（岁）</label><input id="petAge" type="number" min="0" max="30" step="0.1" value="3" oninput="calc()"></div>
      <div><label>犬种体型/猫龄类型</label>
        <select id="size" onchange="calc()">
          <option value="small">小型犬</option><option value="medium" selected>中型犬</option><option value="large">大型犬</option>
        </select>
      </div>
    </div>

    <div class="toolbar"><button class="btn primary" onclick="calc()">计算</button></div>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
function calcDog(age, size) {
  const coeff = {
    small: 16 * Math.log(Math.max(age, 1)) + 31,
    medium: 16 * Math.log(Math.max(age, 1)) + 31,
    large: 22 * Math.log(Math.max(age, 1)) + 15
  };
  let base;
  if (age <= 2) {
    base = size === 'large' ? age * 10.5 : 12.0;
  } else {
    base = coeff[size] + (size === 'large' ? 2 : 0);
  }
  return Math.min(100, Math.round(base));
}

function calcCat(age) {
  if (age < 1) return Math.round(age * 15);
  if (age < 2) return Math.round(24 + (age - 1) * 2);
  return Math.round(16 + Math.max(0, age - 2) * 4);
}

function calc() {
  const species = document.getElementById('species').value;
  const age = Number(document.getElementById('petAge').value) || 0;
  const size = document.getElementById('size').value;

  if (age < 0) {
    document.getElementById('result').innerHTML = '<p>请输入有效年龄。</p>';
    return;
  }

  const humanAge = species === 'dog' ? calcDog(age, size) : calcCat(age);
  const stage = age < 1 ? '幼年' : age < 7 ? '成年' : '老年';

  document.getElementById('result').innerHTML =
    '<p>对等人类年龄：<strong style="color:var(--primary);">' + humanAge + ' 岁</strong></p>' +
    '<p>宠物阶段：<strong>' + stage + '</strong></p>' +
    '<p>说明：上述为参考值，具体寿命受遗传、营养、医疗条件影响。</p>';
}

calc();
</script>
