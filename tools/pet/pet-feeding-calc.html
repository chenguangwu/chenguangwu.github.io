</nav>
<div class="container">
  <div class="card">
    <h2>🥗 宠物喂食量计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按体重、年龄与活动度估算日均热量需求与日喂粮量（g）。</p>

    <div class="input-row">
      <div><label>物种</label><select id="species" onchange="calc()"><option value="dog">狗</option><option value="cat">猫</option></select></div>
      <div><label>体重（kg）</label><input id="weight" type="number" min="0.5" max="150" step="0.1" value="5" oninput="calc()"></div>
      <div><label>年龄（岁）</label><input id="age" type="number" min="0" max="25" step="0.1" value="2" oninput="calc()"></div>
    </div>

    <div class="input-row">
      <div><label>活动等级</label><select id="activity" onchange="calc()"><option value="1.2">低活动</option><option value="1.4" selected>中等活动</option><option value="1.6">高活动</option><option value="2.0">非常活跃</option></select></div>
      <div><label>食物热量（kcal/100g）</label><input id="cal100" type="number" min="10" max="700" value="380" oninput="calc()"></div>
      <div><label>目标</label><select id="goal" onchange="calc()"><option value="maintain">维持</option><option value="gain">增重/增肌</option><option value="lose">减重</option></select></div>
    </div>

    <div class="toolbar"><button class="btn primary" onclick="calc()">计算</button></div>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
function calc() {
  const species = document.getElementById('species').value;
  const weight = Number(document.getElementById('weight').value) || 0;
  const age = Number(document.getElementById('age').value) || 0;
  const activity = Number(document.getElementById('activity').value) || 1;
  const cal100 = Number(document.getElementById('cal100').value) || 0;
  const goal = document.getElementById('goal').value;

  if (!weight || !cal100 || weight <= 0 || cal100 <= 0) {
    document.getElementById('result').innerHTML = '<p>请输入有效数值。</p>';
    return;
  }

  let rmr = species === 'dog' ? (130 * Math.pow(weight, 0.75)) : (70 * Math.pow(weight, 0.75));
  let ageFactor = age < 1 ? 2 : age < 7 ? 1 : 0.9;
  let need = rmr * activity * ageFactor;
  if (goal === 'gain') need *= 1.1;
  if (goal === 'lose') need *= 0.9;

  const grams = need / cal100 * 100;

  document.getElementById('result').innerHTML =
    '<p>估算日热量需求：<strong style="color:var(--primary);">' + need.toFixed(0) + '</strong> kcal/天</p>' +
    '<p>建议日喂食量：<strong>' + grams.toFixed(0) + 'g</strong>（按输入粮食 kcal/100g）</p>' +
    '<p>可分为 <strong>2~3</strong> 次喂食，按体重和食欲微调 5%-10%。</p>';
}

calc();
</script>
