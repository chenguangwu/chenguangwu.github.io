<div class="container">
  <div class="card">
    <h2 data-zh="🛡️ 敏感词检测器">🛡️ Sensitive Word Detector</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="支持自定义词表，高亮命中并一键替换。">Detect sensitive keywords in text and list matched items.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本文本工具基于标准字符编码与文本处理规则，纯前端运行，代码不离开浏览器。 工具名称：敏感词检测器。</p>
</div>


    <label>内容</label>
    <textarea id="content" rows="7" oninput="scan()" placeholder="粘贴文本"></textarea>

    <label>敏感词（逗号或换行分隔）</label>
    <textarea id="words" rows="3" oninput="scan()">违法,垃圾,诈骗,外挂</textarea>

    <label>替换字符</label>
    <input id="replaceWith" type="text" value="*" oninput="scan()">

    <div class="toolbar">
      <button class="btn primary" onclick="scan()">检测并替换</button>
      <button class="btn" onclick="copyResult()">复制清洗文本</button>
    </div>

    <div id="summary" class="result-box"></div>
    <div id="preview" class="result-box" style="white-space:pre-wrap"></div>
  </div>
</div>

<script>
function scan() {
  const raw = document.getElementById('content').value || '';
  const replaceWith = document.getElementById('replaceWith').value || '*';
  const words = (document.getElementById('words').value || '').split(/[\n,]/).map(w => w.trim()).filter(Boolean);

  if (!raw || words.length === 0) {
    document.getElementById('summary').innerHTML = '<p>未检测到词条。</p>';
    document.getElementById('preview').innerHTML = raw;
    return;
  }

  let clean = raw;
  let count = 0;

  words.forEach(w => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + esc + ')', 'gi');
    const matches = clean.match(re);
    if (matches) count += matches.length;
    clean = clean.replace(re, str => replaceWith.repeat(Math.max(1, Math.min(6, str.length))));
  });

  const html = raw
    .split('').map(ch => ch).join('')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  let marked = html;
  words.forEach(w => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + esc + ')', 'gi');
    marked = marked.replace(re, '<mark>$1</mark>');
  });

  document.getElementById('summary').innerHTML =
    '<p>检测到 <strong>' + count + '</strong> 处命中。</p>';
  document.getElementById('preview').innerHTML = marked;
  document.getElementById('preview').dataset.clean = clean;
}

function copyResult() {
  const clean = document.getElementById('preview').dataset.clean || '';
  ToolBox.copyText(clean, i18nText('msg486'));
}

scan();
</script>
