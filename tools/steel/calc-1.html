  <a href="../../guides/calc-1-guide.html">📖 查看「增值税计算使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>🔧 钢结构焊缝计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按 GB 50017 思路计算角焊缝强度，判断焊缝是否满足拉/剪/组合应力要求。</p>

    <div class="input-row">
      <div>
        <label for="weldType">焊缝类型</label>
        <select id="weldType" onchange="updateInputs()">
          <option value="fillet">角焊缝</option>
          <option value="butt">对接焊缝</option>
        </select>
      </div>
      <div>
        <label for="hf">焊脚尺寸 hf（mm）</label>
        <input type="number" id="hf" value="8" step="0.5" min="1">
      </div>
      <div>
        <label for="lw">焊缝计算长度 lw（mm）</label>
        <input type="number" id="lw" value="200" step="1" min="1">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="N">轴心力 N（kN）</label>
        <input type="number" id="N" value="120" step="0.1">
      </div>
      <div>
        <label for="V">剪力 V（kN）</label>
        <input type="number" id="V" value="50" step="0.1">
      </div>
      <div>
        <label for="M">弯矩 M（kN·m）</label>
        <input type="number" id="M" value="8" step="0.1">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="ffw">焊缝强度设计值 ffw（N/mm²）</label>
        <input type="number" id="ffw" value="160" step="1" min="1">
      </div>
      <div>
        <label for="betaF">正面角焊缝强度增大系数 βf</label>
        <input type="number" id="betaF" value="1.22" step="0.01" min="1">
      </div>
      <div>
        <label for="t">对接焊缝板厚 t（mm）</label>
        <input type="number" id="t" value="10" step="0.5" min="1" placeholder="对接焊缝用">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcWeld()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>角焊缝有效厚度 he = 0.7 hf</li>
        <li>角焊缝复合应力：√[(σf/βf)² + τf²] ≤ ffw</li>
        <li>对接焊缝正应力 σ = N/(t·lw) + M/W，剪应力 τ = V/(t·lw)</li>
        <li>计算长度已扣除起灭弧影响，请按实际有效长度输入</li>
      </ul>
    </div>
  </div>
</div>

<script>
function updateInputs() {
  const type = document.getElementById('weldType').value;
  document.getElementById('hf').disabled = type === 'butt';
  document.getElementById('betaF').disabled = type === 'butt';
  document.getElementById('t').disabled = type === 'fillet';
}

function calcWeld() {
  const type = document.getElementById('weldType').value;
  const hf = parseFloat(document.getElementById('hf').value) || 0;
  const lw = parseFloat(document.getElementById('lw').value) || 0;
  const N = (parseFloat(document.getElementById('N').value) || 0) * 1000;
  const V = (parseFloat(document.getElementById('V').value) || 0) * 1000;
  const M = (parseFloat(document.getElementById('M').value) || 0) * 1e6;
  const ffw = parseFloat(document.getElementById('ffw').value) || 0;
  const betaF = parseFloat(document.getElementById('betaF').value) || 1.22;
  const t = parseFloat(document.getElementById('t').value) || 0;

  if (lw <= 0 || ffw <= 0) {
    ToolBox.setResult('result', '<p class="tip-error">请输入有效的焊缝参数。</p>');
    return;
  }

  let html = '';
  if (type === 'fillet') {
    if (hf <= 0) { ToolBox.setResult('result', '<p class="tip-error">请输入焊脚尺寸。</p>'); return; }
    const he = 0.7 * hf;
    const A = he * lw;
    const sigmaF = N / A;
    const tauFV = V / A;
    const W = he * lw * lw / 6;
    const sigmaFM = M / W;
    const sigmaTotal = sigmaF + sigmaFM;
    const combined = Math.sqrt(Math.pow(sigmaTotal / betaF, 2) + Math.pow(tauFV, 2));
    const ratio = combined / ffw;
    const status = ratio <= 1
      ? '<span class="grade-tag grade-excellent">满足</span>'
      : '<span class="grade-tag grade-fail">不满足</span>';

    html = `
      <div class="data-grid">
        <div class="data-card"><div class="num">${he.toFixed(2)}</div><div class="label">有效厚度 he（mm）</div></div>
        <div class="data-card"><div class="num">${sigmaTotal.toFixed(2)}</div><div class="label">正应力 σf（N/mm²）</div></div>
        <div class="data-card"><div class="num">${tauFV.toFixed(2)}</div><div class="label">剪应力 τf（N/mm²）</div></div>
        <div class="data-card"><div class="num">${combined.toFixed(2)}</div><div class="label">复合应力（N/mm²）</div></div>
        <div class="data-card"><div class="num">${ffw.toFixed(0)}</div><div class="label">设计强度 ffw</div></div>
        <div class="data-card"><div class="num">${(ratio*100).toFixed(1)}%</div><div class="label">应力比</div></div>
      </div>
      <p style="margin-top:12px;font-size:14px;">验算结果：${status}</p>
    `;
  } else {
    if (t <= 0) { ToolBox.setResult('result', '<p class="tip-error">请输入对接焊缝板厚。</p>'); return; }
    const A = t * lw;
    const W = t * lw * lw / 6;
    const sigma = N / A + M / W;
    const tau = V / A;
    const equiv = Math.sqrt(sigma * sigma + 3 * tau * tau);
    const ratio = equiv / ffw;
    const status = ratio <= 1
      ? '<span class="grade-tag grade-excellent">满足</span>'
      : '<span class="grade-tag grade-fail">不满足</span>';

    html = `
      <div class="data-grid">
        <div class="data-card"><div class="num">${sigma.toFixed(2)}</div><div class="label">正应力 σ（N/mm²）</div></div>
        <div class="data-card"><div class="num">${tau.toFixed(2)}</div><div class="label">剪应力 τ（N/mm²）</div></div>
        <div class="data-card"><div class="num">${equiv.toFixed(2)}</div><div class="label">折算应力（N/mm²）</div></div>
        <div class="data-card"><div class="num">${ffw.toFixed(0)}</div><div class="label">设计强度</div></div>
        <div class="data-card"><div class="num">${(ratio*100).toFixed(1)}%</div><div class="label">应力比</div></div>
      </div>
      <p style="margin-top:12px;font-size:14px;">验算结果：${status}</p>
    `;
  }
  ToolBox.setResult('result', html);
}

function resetForm() {
  document.getElementById('weldType').value = 'fillet';
  document.getElementById('hf').value = 8;
  document.getElementById('lw').value = 200;
  document.getElementById('N').value = 120;
  document.getElementById('V').value = 50;
  document.getElementById('M').value = 8;
  document.getElementById('ffw').value = 160;
  document.getElementById('betaF').value = 1.22;
  document.getElementById('t').value = 10;
  updateInputs();
  calcWeld();
}

updateInputs();
calcWeld();
</script>
</body>
