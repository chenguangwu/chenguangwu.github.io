<div class="container">
  <div class="card">
    <h2>📊 Excel 公式速查表</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入关键字可快速检索常用公式与用法。</p>

    <input id="keyword" type="search" placeholder="搜索：VLOOKUP / IF / SUMIFS" oninput="render()">
    <div class="formula-list" id="list"></div>
  </div>
</div>

<script>
const DATA = [
  {name:'SUM', cat:'汇总', syntax:'=SUM(数字1,数字2,...)', hint:'求和。可跨行列引用。'},
  {name:'AVERAGE', cat:'统计', syntax:'=AVERAGE(数字1,数字2,...)', hint:'求平均值。'},
  {name:'IF', cat:'逻辑', syntax:'=IF(逻辑条件,值1,值2)', hint:'满足条件返回值1，否则值2。'},
  {name:'VLOOKUP', cat:'查找', syntax:'=VLOOKUP(查找值,表格,列序号,FALSE)', hint:'纵向查找，通常配合 FALSE 精确匹配。'},
  {name:'INDEX', cat:'查找', syntax:'=INDEX(区域,行号,列号)', hint:'按行列位置返回单元格。'},
  {name:'MATCH', cat:'查找', syntax:'=MATCH(查找值,查找范围,0)', hint:'返回匹配项的位置。'},
  {name:'SUMIFS', cat:'统计', syntax:'=SUMIFS(求和区域,条件区域1,条件1,[条件区域2,条件2,...])', hint:'多条件求和。'},
  {name:'COUNTIFS', cat:'统计', syntax:'=COUNTIFS(条件区域1,条件1,[条件区域2,条件2,...])', hint:'多条件计数。'},
  {name:'TEXT', cat:'文本', syntax:'=TEXT(数字,"0.00")', hint:'数字转文本与格式控制。'},
  {name:'TRIM', cat:'文本', syntax:'=TRIM(文本)', hint:'去掉多余空格。'},
  {name:'SUBSTITUTE', cat:'文本', syntax:'=SUBSTITUTE(文本,旧字符串,新字符串)', hint:'替换全部匹配子串。'},
  {name:'LEFT', cat:'文本', syntax:'=LEFT(文本,返回字符数)', hint:'截取左侧字符。'}
];

function render() {
  const key = (document.getElementById('keyword').value || '').toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';

  DATA.filter(item => {
    const k = (item.name + item.cat + item.syntax + item.hint).toLowerCase();
    return !key || k.includes(key);
  }).forEach(item => {
    const d = document.createElement('div');
    d.className = 'formula-item';
    d.innerHTML =
      '<h4>' + item.name + '</h4>' +
      '<div class="meta">分类：' + item.cat + '</div>' +
      '<code>' + item.syntax + '</code>' +
      '<p style="margin:8px 0 0 0;color:var(--text-muted);font-size:13px;">' + item.hint + '</p>';
    list.appendChild(d);
  });
}

render();
</script>
