<div class="container">
  <div class="card">
    <h2>📉 噪声衰减距离</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算点声源随距离的声压级衰减。</p>
    <div class="input-row"><label>声源处声压级 dB</label><input type="number" id="l0" value="100" step="any" oninput="calc()"></div>
    <div class="input-row"><label>参考距离 m</label><input type="number" id="r0" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标距离 m</label><input type="number" id="r" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>屏障衰减 dB</label><input type="number" id="barrier" value="0" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">点声源衰减 = 20·log₁₀(r/r₀)<br>L_p = L₀ − 20·log₁₀(r/r₀)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">未考虑空气吸收和地面效应。</p>
  </div>
</div>

<script>
function calc(){
  const l0 = +document.getElementById('l0').value || 0;
  const r0 = +document.getElementById('r0').value || 0;
  const r = +document.getElementById('r').value || 0;
  const barrier = +document.getElementById('barrier').value || 0;
  let html = '';
  const __v0 = (20*Math.log10(r/r0));
  html += `<p>自由场衰减：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> dB</p>`;
  const __v1 = (l0-20*Math.log10(r/r0)-barrier);
  html += `<p>预测声压级：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> dB</p>`;
  const __v2 = (l0-20*Math.log10(r/r0)-barrier-1.5);
  html += `<p>A 计权修正：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> dB(A)</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
