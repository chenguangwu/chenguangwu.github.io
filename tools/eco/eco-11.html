<div class="container">
  <div class="card">
    <h2>🚗 交通拥堵碳排</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算拥堵导致的额外燃油与碳排放。</p>
    <div class="input-row"><label>拥堵车辆数</label><input type="number" id="vehicles" value="1000" step="1" oninput="calc()"></div>
    <div class="input-row"><label>平均延误分钟</label><input type="number" id="extra_time" value="15" step="any" oninput="calc()"></div>
    <div class="input-row"><label>怠速油耗 L/h</label><input type="number" id="fuel_rate" value="0.8" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年拥堵天数</label><input type="number" id="days" value="100" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">额外燃油 = 车辆数 × 延误小时 × 怠速油耗<br>碳排 = 燃油 × 2.31 kg/L</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">用于评估拥堵治理的环境效益。</p>
  </div>
</div>

<script>
function calc(){
  const vehicles = +document.getElementById('vehicles').value || 0;
  const extra_time = +document.getElementById('extra_time').value || 0;
  const fuel_rate = +document.getElementById('fuel_rate').value || 0;
  const days = +document.getElementById('days').value || 0;
  let html = '';
  const __v0 = (vehicles*extra_time/60*fuel_rate);
  html += `<p>单次额外燃油：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> L</p>`;
  const __v1 = (vehicles*extra_time/60*fuel_rate*days);
  html += `<p>年额外燃油：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> L</p>`;
  const __v2 = (vehicles*extra_time/60*fuel_rate*days*2.31/1000);
  html += `<p>年额外碳排：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> 吨</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
