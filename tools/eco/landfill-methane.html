    <h2>🗑️ 垃圾填埋甲烷产量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算填埋场有机垃圾的甲烷产量与当量。</p>
    <div class="input-row"><label>有机垃圾 kg/年</label><input type="number" id="organic" value="500" step="any" oninput="calc()"></div>
    <div class="input-row"><label>可降解碳比</label><input type="number" id="doc" value="0.4" step="any" oninput="calc()"></div>
    <div class="input-row"><label>甲烷修正因子</label><input type="number" id="mcf" value="0.8" step="any" oninput="calc()"></div>
    <div class="input-row"><label>甲烷体积比</label><input type="number" id="frac" value="0.5" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>

    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">CH₄ = 有机物 × 可降解比 × MCF × 体积比 × 16/12</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">收集的甲烷可用于发电，减少排放。</p>

<script>
function calc(){
  const organic = +document.getElementById('organic').value || 0;
  const doc = +document.getElementById('doc').value || 0;
  const mcf = +document.getElementById('mcf').value || 0;
  const frac = +document.getElementById('frac').value || 0;
  let html = '';
  const __v0 = (organic*doc*mcf*frac*16/12);
  html += `<p>CH₄ 产量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> kg/年</p>`;
  const __v1 = (organic*doc*mcf*frac*16/12*28);
  html += `<p>CO₂ 当量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> kgCO₂e</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
