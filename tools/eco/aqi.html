<div class="container">
  <div class="card">
    <h2 data-zh="🌫️ AQI 健康等级">🌫️ AQI Health Level</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="根据 AQI 指数给出健康影响等级与建议。">AQI Health Level is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>AQI 指数</label><input type="number" id="aqi" value="85" step="1" oninput="calc()"></div>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="30" step="1" oninput="calc()"></div>
    <div class="input-row"><label>户外活动小时</label><input type="number" id="hours" value="2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="300" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">AQI 等级：优/良/轻度/中度/重度/严重污染</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">PM2.5 估算为经验公式，非官方换算。</p>
  </div>
</div>

<script>
function calc(){
  const aqi = +document.getElementById('aqi').value || 0;
  const age = +document.getElementById('age').value || 0;
  const hours = +document.getElementById('hours').value || 0;
  let html = '';
  const __v0 = (aqi<=50?1:(aqi<=100?2:(aqi<=150?3:(aqi<=200?4:(aqi<=300?5:6)))));
  html += `<p>健康等级：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 级</p>`;
  const __v1 = (Math.max(0, aqi<=50?hours:(aqi<=100?hours*0.8:(aqi<=150?hours*0.5:(aqi<=200?hours*0.2:0)))));
  html += `<p>建议活动时长：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> 小时</p>`;
  const __v2 = (aqi*0.6);
  html += `<p>PM2.5 估算：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(1)}</strong> µg/m³</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
