<div class="container">
  <div class="card">
    <h2>🌀 风力发电估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用风轮面积与风速估算风力机功率。</p>
    <div class="input-row"><label>风速 m/s</label><input type="number" id="v" value="8" step="any" oninput="calc()"></div>
    <div class="input-row"><label>风轮直径 m</label><input type="number" id="d" value="40" step="any" oninput="calc()"></div>
    <div class="input-row"><label>功率系数</label><input type="number" id="cp" value="0.4" step="any" oninput="calc()"></div>
    <div class="input-row"><label>空气密度</label><input type="number" id="rho" value="1.225" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">P = ½ · Cp · ρ · A · v³，A = π(d/2)²</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">实际受切入/切出风速与湍流限制。</p>
  </div>
</div>

<script>
function calc(){
  const v = +document.getElementById('v').value || 0;
  const d = +document.getElementById('d').value || 0;
  const cp = +document.getElementById('cp').value || 0;
  const rho = +document.getElementById('rho').value || 0;
  let html = '';
  const __v = (0.5*cp*rho*Math.PI*Math.pow(d/2,2)*Math.pow(v,3)/1000);
  html += `<p>功率：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(2)}</strong> kW</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
