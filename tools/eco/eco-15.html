<script>
function calc(){
  const power = +document.getElementById('power').value || 0;
  const flow = +document.getElementById('flow').value || 0;
  const lift = +document.getElementById('lift').value || 0;
  let html = '';
  const __v0 = (power*24/flow);
  html += `<p>单位能耗：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(3)}</strong> kWh/m³</p>`;
  const __v1 = (power*24/flow*0.6);
  html += `<p>吨水电费：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(3)}</strong> 元/m³</p>`;
  const __v2 = (0.004*lift*100);
  html += `<p>提升能耗占比估算：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> %</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
