<div class="container">
  <div class="card">
    <h2>👣 生态足迹估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用经验系数粗略估算人均生态足迹。</p>
    <div class="input-row"><label>周食肉 kg</label><input type="number" id="meat" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>周驾车 km</label><input type="number" id="car" value="100" step="any" oninput="calc()"></div>
    <div class="input-row"><label>月用电 kWh</label><input type="number" id="elec" value="200" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年飞行次</label><input type="number" id="flights" value="2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">gha ≈ 肉食×0.0018 + 驾车×0.00012 + 用电×0.0005 + 飞行×0.3（年）</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">全球人均生物承载力约 1.6 gha，仅供参考。</p>
  </div>
</div>

<script>
function calc(){
  const meat = +document.getElementById('meat').value || 0;
  const car = +document.getElementById('car').value || 0;
  const elec = +document.getElementById('elec').value || 0;
  const flights = +document.getElementById('flights').value || 0;
  let html = '';
  const __v = (meat*52*0.0018 + car*52*0.00012 + elec*12*0.0005 + flights*0.3);
  html += `<p>生态足迹：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(3)}</strong> gha</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
