    <h2>🗑️ 固废产生量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据人口和人均产生量估算生活垃圾总量。</p>
    <div class="input-row"><label>人口数</label><input type="number" id="pop" value="10000" step="1" oninput="calc()"></div>
    <div class="input-row"><label>人均垃圾 kg/d</label><input type="number" id="per_capita" value="1.2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>天数</label><input type="number" id="days" value="365" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="5000" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">总量 = 人口 × 人均量 × 天数</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">适用于城市垃圾量快速估算。</p>
  </div>

<script>
function calc(){
  const pop = +document.getElementById('pop').value || 0;
  const per_capita = +document.getElementById('per_capita').value || 0;
  const days = +document.getElementById('days').value || 0;
  let html = '';
  const __v0 = (pop*per_capita/1000);
  html += `<p>日产生量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> 吨/天</p>`;
  const __v1 = (pop*per_capita*days/1000);
  html += `<p>年产生量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> 吨/年</p>`;
  const __v2 = (pop*per_capita*days);
  html += `<p>累计吨天数：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> kg·天</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
