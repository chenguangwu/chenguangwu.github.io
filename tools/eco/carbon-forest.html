    <h2>🌳 碳中和林面积</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算抵消年排放所需的树木与林地。</p>
    <div class="input-row"><label>年排放 kgCO₂</label><input type="number" id="co2" value="2000" step="any" oninput="calc()"></div>
    <div class="input-row"><label>单株年吸收 kg</label><input type="number" id="absorb" value="18.3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>每公顷株数</label><input type="number" id="treesPerHa" value="1000" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">树木数 = 年排放 / 单株吸收；林地 = 树木数 / 密度</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">仅为粗略估算，未计森林碳汇衰减。</p>
  </div>

<script>
function calc(){
  const co2 = +document.getElementById('co2').value || 0;
  const absorb = +document.getElementById('absorb').value || 0;
  const treesPerHa = +document.getElementById('treesPerHa').value || 0;
  let html = '';
  const __v0 = (co2/absorb);
  html += `<p>需树木：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 株</p>`;
  const __v1 = (co2/absorb/treesPerHa);
  html += `<p>需林地：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(3)}</strong> 公顷</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
