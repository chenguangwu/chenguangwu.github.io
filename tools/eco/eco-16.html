    <h2>💨 风电减排量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算风力发电量带来的减排量。</p>
    <div class="input-row"><label>装机容量 MW</label><input type="number" id="capacity" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>容量因子 %</label><input type="number" id="cf" value="35" step="any" oninput="calc()"></div>
    <div class="input-row"><label>电网排放因子</label><input type="number" id="factor" value="0.5703" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100000" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">年发电量 = 装机 × 容量因子 × 8760 小时<br>减排 = 发电量 × 排放因子</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">等效汽车按年行驶 1.5 万 km、排放 4.6 吨计。</p>
  </div>

<script>
function calc(){
  const capacity = +document.getElementById('capacity').value || 0;
  const cf = +document.getElementById('cf').value || 0;
  const factor = +document.getElementById('factor').value || 0;
  let html = '';
  const __v0 = (capacity*cf/100*8760);
  html += `<p>年发电量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> 万 kWh</p>`;
  const __v1 = (capacity*cf/100*8760*1000*factor/1000);
  html += `<p>年减排量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> 吨 CO₂</p>`;
  const __v2 = (capacity*cf/100*8760*1000*factor/1000/4.6);
  html += `<p>等效减少汽车：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 辆</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
