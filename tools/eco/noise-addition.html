    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">多个声源叠加后的总声压级。</p>
    <div class="input-row"><label>声源1 dB</label><input type="number" id="L1" value="80" step="any" oninput="calc()"></div>

    <div class="formula-eq">L_total = 10·log₁₀(Σ 10^(Lᵢ/10))</div>

<script>
function calc(){
  const L1 = +document.getElementById('L1').value || 0;
  const L2 = +document.getElementById('L2').value || 0;
  const L3 = +document.getElementById('L3').value || 0;
  let html = '';
  const __v0 = (10*Math.log10(Math.pow(10,L1/10)+Math.pow(10,L2/10)+Math.pow(10,L3/10)));
  html += `<p>总声压级：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> dB</p>`;
  const __v1 = ((10*Math.log10(Math.pow(10,L1/10)+Math.pow(10,L2/10)+Math.pow(10,L3/10)))-Math.max(L1,L2,L3));
  html += `<p>比最强源增量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> dB</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
