<div class="container">
  <div class="card">
    <h2>☀️ 光伏减排估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算光伏发电量对应的减排效益。</p>
    <div class="input-row"><label>装机容量 kW</label><input type="number" id="capacity" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年等效满发小时</label><input type="number" id="hours" value="1200" step="any" oninput="calc()"></div>
    <div class="input-row"><label>电网排放因子 kgCO₂/kWh</label><input type="number" id="factor" value="0.5703" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="50" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">年发电量 = 装机 × 满发小时<br>减排 = 发电量 × 排放因子</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">等效植树按每棵年吸收 18kg CO₂ 估算。</p>
  </div>
</div>

<script>
function calc(){
  const capacity = +document.getElementById('capacity').value || 0;
  const hours = +document.getElementById('hours').value || 0;
  const factor = +document.getElementById('factor').value || 0;
  let html = '';
  const __v0 = (capacity*hours/1000);
  html += `<p>年发电量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> 万 kWh</p>`;
  const __v1 = (capacity*hours*factor/1000);
  html += `<p>年减排量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> 吨 CO₂</p>`;
  const __v2 = (capacity*hours*factor/1000/0.018);
  html += `<p>等效植树：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 棵</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
