<h1 class="sr-only">Cohen's d 效应量计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ Cohen's d（效应量）</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">Cohen's d（效应量）</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="Cohen&amp;#x27;s d 效应量计算器">Cohens D</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = (m₁−m₂) / s_p</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="两组均值差异的标准化效应量。">Cohens D is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="m1">组1均值</label>
        <input type="number" id="m1" value="30" step="0.1">
      </div>
      <div>
        <label for="m2">组2均值</label>
        <input type="number" id="m2" value="27" step="0.1">
      </div>
      <div>
        <label for="s1">组1标准差</label>
        <input type="number" id="s1" value="5" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="s2">组2标准差</label>
        <input type="number" id="s2" value="5" step="0.1">
      </div>
      <div>
        <label for="n1">组1样本量</label>
        <input type="number" id="n1" value="20" step="1">
      </div>
      <div>
        <label for="n2">组2样本量</label>
        <input type="number" id="n2" value="20" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>|d|≈0.2/0.5/0.8 为小/中/大。</li>
        <li>用合并标准差标准化。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a=num('m1'),b=num('m2'),s1=num('s1'),s2=num('s2'),n1=num('n1'),n2=num('n2');
            const sp=Math.sqrt(((n1-1)*s1*s1+(n2-1)*s2*s2)/(n1+n2-2));
            const d=(a-b)/sp;
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(4),'Cohen\'s d'],
                [Math.abs(d)<0.2?'极小':(Math.abs(d)<0.5?'小':(Math.abs(d)<0.8?'中':'大')),'效应强度']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '30';
      document.getElementById('m2').value = '27';
      document.getElementById('s1').value = '5';
      document.getElementById('s2').value = '5';
      document.getElementById('n1').value = '20';
      document.getElementById('n2').value = '20';
      calcTool();}
calcTool();
</script>
