<div class="container">
  <div class="card">
    <h2>📏 线性回归拟合</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用最小二乘法拟合 y = ax + b，输出斜率、截距与预测值。</p>
    <div class="input-row"><label>X1</label><input type="number" id="x1" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>X2</label><input type="number" id="x2" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>X3</label><input type="number" id="x3" value="3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>X4</label><input type="number" id="x4" value="4" step="any" oninput="calc()"></div>
    <div class="input-row"><label>X5</label><input type="number" id="x5" value="5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Y1</label><input type="number" id="y1" value="2.1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Y2</label><input type="number" id="y2" value="4.0" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Y3</label><input type="number" id="y3" value="6.2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Y4</label><input type="number" id="y4" value="7.8" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Y5</label><input type="number" id="y5" value="10.5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>预测 X</label><input type="number" id="xp" value="6" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">a = (nΣxy − ΣxΣy) / (nΣx² − (Σx)²)<br>b = (Σy − aΣx) / n</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">输入成对数据，可指定任意 x 预测 y。</p>
  </div>
</div>

<script>
function calc(){
  const x1 = +document.getElementById('x1').value || 0;
  const x2 = +document.getElementById('x2').value || 0;
  const x3 = +document.getElementById('x3').value || 0;
  const x4 = +document.getElementById('x4').value || 0;
  const x5 = +document.getElementById('x5').value || 0;
  const y1 = +document.getElementById('y1').value || 0;
  const y2 = +document.getElementById('y2').value || 0;
  const y3 = +document.getElementById('y3').value || 0;
  const y4 = +document.getElementById('y4').value || 0;
  const y5 = +document.getElementById('y5').value || 0;
  const xp = +document.getElementById('xp').value || 0;
  let html = '';
  const __v0 = ((()=>{const xs=[x1,x2,x3,x4,x5],ys=[y1,y2,y3,y4,y5],n=5,sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0),sxx=xs.reduce((a,b)=>a+b*b,0),sxy=xs.reduce((a,b,i)=>a+xs[i]*ys[i],0);const d=n*sxx-sx*sx;return d?(n*sxy-sx*sy)/d:0;})());
  html += `<p>斜率 a：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = ((()=>{const xs=[x1,x2,x3,x4,x5],ys=[y1,y2,y3,y4,y5],n=5,sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0),sxx=xs.reduce((a,b)=>a+b*b,0),sxy=xs.reduce((a,b,i)=>a+xs[i]*ys[i],0);const d=n*sxx-sx*sx;const a=d?(n*sxy-sx*sy)/d:0;return (sy-a*sx)/n;})());
  html += `<p>截距 b：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  const __v2 = ((()=>{const xs=[x1,x2,x3,x4,x5],ys=[y1,y2,y3,y4,y5],n=5,sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0),sxx=xs.reduce((a,b)=>a+b*b,0),sxy=xs.reduce((a,b,i)=>a+xs[i]*ys[i],0);const d=n*sxx-sx*sx;const a=d?(n*sxy-sx*sy)/d:0;const b=(sy-a*sx)/n;return a*xp+b;})());
  html += `<p>预测 y：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
