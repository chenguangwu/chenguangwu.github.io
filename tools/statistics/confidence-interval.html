<h1 class="sr-only">均值置信区间计算器</h1>

  <span>/ 置信区间</span>

</nav>
<div class="container">
  <div class="card">
    <h2>CI = x̄ ± z·σ/√n</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">已知总体标准差时均值的置信区间。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">CI = x̄ ± zσ/√n。 95% 置信常用 z=1.96。</div>
      <p class="formula-desc">已知总体标准差时均值的置信区间。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="xbar">样本均值 x̄</label>
        <input type="number" id="xbar" value="100" step="1">
      </div>
      <div>
        <label for="z">z 值</label>
        <input type="number" id="z" value="1.96" step="0.05">
      </div>
      <div>
        <label for="sigma">标准差 σ</label>
        <input type="number" id="sigma" value="15" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="n">样本量 n</label>
        <input type="number" id="n" value="36" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CI = x̄ ± zσ/√n。</li>
        <li>95% 置信常用 z=1.96。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const xbar = num('xbar'), z = num('z'), sigma = num('sigma'), n = num('n');
            const m = z * sigma / Math.sqrt(n);
            ToolBox.setResult('result', dataGrid([
                [(xbar - m).toFixed(3), '下限'],
                [(xbar + m).toFixed(3), '上限'],
                [(2 * m).toFixed(3), '区间宽度']
            ]));
        }
function resetForm(){document.getElementById('xbar').value = '100';
      document.getElementById('z').value = '1.96';
      document.getElementById('sigma').value = '15';
      document.getElementById('n').value = '36';
      calcTool();}
calcTool();
</script>
