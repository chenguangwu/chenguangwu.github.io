<h1 class="sr-only">CV = σ / μ × 100%</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">变异系数计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由均值与标准差求变异系数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入均值 μ 与标准差 σ，求变异系数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">CV = σ / μ × 100%</div>
      <p class="formula-desc">输入均值 μ 与标准差 σ，求变异系数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="mu">均值 μ</label>
        <input type="number" id="mu" value="5" step="0.5">
      </div>
      <div>
        <label for="sigma">标准差 σ</label>
        <input type="number" id="sigma" value="2" step="0.2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>无量纲，便于跨量纲比较离散度。</li>
        <li>2/5 → 40%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const mu=num('mu'),sigma=num('sigma');
            const CV=sigma/mu*100;
            ToolBox.setResult('result', dataGrid([
                [CV.toFixed(2),'变异系数 CV (%)']
            ]));
        }
function resetForm(){document.getElementById('mu').value = '5';
      document.getElementById('sigma').value = '2';
      calcTool();}
calcTool();
</script>
