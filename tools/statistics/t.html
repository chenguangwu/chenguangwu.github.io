<div class="container">
  <div class="card">
    <h2>🧪 t 检验统计量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算单样本 t 统计量，检验样本均值与假设均值的差异。</p>
    <div class="input-row"><label>样本均值</label><input type="number" id="xbar" value="52" step="any" oninput="calc()"></div>
    <div class="input-row"><label>假设总体均值</label><input type="number" id="mu0" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>样本标准差</label><input type="number" id="s" value="4" step="any" oninput="calc()"></div>
    <div class="input-row"><label>样本量</label><input type="number" id="n" value="25" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="5" data-viz-min="-5"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">t = (x̄ − μ₀) / (s / √n)<br>df = n − 1</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">|t| 越大，拒绝原假设的证据越强。</p>
  </div>
</div>

<script>
function calc(){
  const xbar = +document.getElementById('xbar').value || 0;
  const mu0 = +document.getElementById('mu0').value || 0;
  const s = +document.getElementById('s').value || 0;
  const n = +document.getElementById('n').value || 0;
  let html = '';
  const __v0 = ((xbar-mu0)/(s/Math.sqrt(n)));
  html += `<p>t 统计量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = (n-1);
  html += `<p>自由度 df：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> </p>`;
  const __v2 = (xbar-mu0);
  html += `<p>差值：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
