<h1 class="sr-only">比例置信区间计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 比例置信区间</span>

  <span class="bc-current">比例置信区间</span>
</nav>
<div class="container">
  <div class="card">
    <h2>p̂ ± z·√(p̂(1−p̂)/n)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">对总体比例的区间估计。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">1.96=95%)</div>
      <p class="formula-desc">对总体比例的区间估计。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="x">成功数 x</label>
        <input type="number" id="x" value="60" step="1">
      </div>
      <div>
        <label for="n">样本量 n</label>
        <input type="number" id="n" value="100" step="1">
      </div>
      <div>
        <label for="z">z 值 (1.96=95%)</label>
        <input type="number" id="z" value="1.96" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>60/100、95% → 区间约 [0.504,0.696]。</li>
        <li>np≥5 时近似较好。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const x=num('x'), n=num('n'), z=num('z');
            const p=x/n, se=Math.sqrt(p*(1-p)/n);
            const lo=p-z*se, hi=p+z*se;
            ToolBox.setResult('result', dataGrid([
                [p.toFixed(4),'样本比例 p̂'],
                [(lo).toFixed(4),'下限'],
                [(hi).toFixed(4),'上限']
            ]));
        }
function resetForm(){document.getElementById('x').value = '60';
      document.getElementById('n').value = '100';
      document.getElementById('z').value = '1.96';
      calcTool();}
calcTool();
</script>
