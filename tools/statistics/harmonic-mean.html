<div class="container">
  <div class="card">
    <h2>H = n / Σ(1/xᵢ)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">倒数的算术平均之倒数，适合速率。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">H = n / Σ(1/xᵢ)</div>
      <p class="formula-desc">倒数的算术平均之倒数，适合速率。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="data">数据（逗号分隔）</label>
        <input type="number" id="data" value="60,40,30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>H = n/Σ(1/xᵢ)。</li>
        <li>往返平均速度用调和平均。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const arr = document.getElementById('data').value.split(',').map(s=>parseFloat(s.trim())).filter(v=>v>0);
            const n = arr.length;
            const H = n / arr.reduce((a,b)=>a+1/b,0);
            ToolBox.setResult('result', dataGrid([
                [H.toFixed(4), '调和平均 H']
            ]));
        }
function resetForm(){document.getElementById('data').value = '60,40,30';
      calcTool();}
calcTool();
</script>
