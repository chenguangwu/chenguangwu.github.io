  <span class="bc-sep">‹</span>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="🏋️ 加权平均数">🏋️ Statistics 11</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="根据数值与权重计算加权平均。">Statistics 11 is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>数值 A</label><input type="number" id="v1" value="80" step="any" oninput="calc()"></div>
    <div class="input-row"><label>权重 A</label><input type="number" id="w1" value="0.5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数值 B</label><input type="number" id="v2" value="90" step="any" oninput="calc()"></div>
    <div class="input-row"><label>权重 B</label><input type="number" id="w2" value="0.3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数值 C</label><input type="number" id="v3" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>权重 C</label><input type="number" id="w3" value="0.2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">加权平均 = Σ(xᵢ · wᵢ) / Σwᵢ</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">权重和不必等于 1，会自动归一化。</p>
  </div>
</div>

<script>
function calc(){
  const v1 = +document.getElementById('v1').value || 0;
  const w1 = +document.getElementById('w1').value || 0;
  const v2 = +document.getElementById('v2').value || 0;
  const w2 = +document.getElementById('w2').value || 0;
  const v3 = +document.getElementById('v3').value || 0;
  const w3 = +document.getElementById('w3').value || 0;
  let html = '';
  const __v0 = ((v1*w1+v2*w2+v3*w3)/(w1+w2+w3));
  html += `<p>加权平均数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = (w1+w2+w3);
  html += `<p>权重和：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
