<div class="container">
  <div class="card">
    <h2>P(X=k) = C(n,k)·p^k·(1−p)^(n−k)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">n 次独立试验恰好 k 次成功的概率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">X=k)=C(n,k)p^k(1−p)^(n−k)。 10 投 3 中、p=0.5 → 0.1172。</div>
      <p class="formula-desc">n 次独立试验恰好 k 次成功的概率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">试验数 n</label>
        <input type="number" id="n" value="10" step="1">
      </div>
      <div>
        <label for="k">成功数 k</label>
        <input type="number" id="k" value="3" step="1">
      </div>
      <div>
        <label for="p">成功概率 p</label>
        <input type="number" id="p" value="0.5" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P(X=k)=C(n,k)p^k(1−p)^(n−k)。</li>
        <li>10 投 3 中、p=0.5 → 0.1172。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n = Math.round(num('n')), k = Math.round(num('k')), p = num('p');
            function fact(m){let f=1;for(let i=2;i<=m;i++)f*=i;return f;}
            const C = fact(n) / (fact(k) * fact(n - k));
            const P = C * Math.pow(p, k) * Math.pow(1 - p, n - k);
            ToolBox.setResult('result', dataGrid([
                [P.toFixed(5), 'P(X=' + k + ')'],
                [C.toFixed(0), '组合数 C(' + n + ',' + k + ')']
            ]));
        }
function resetForm(){document.getElementById('n').value = '10';
      document.getElementById('k').value = '3';
      document.getElementById('p').value = '0.5';
      calcTool();}
calcTool();
</script>
