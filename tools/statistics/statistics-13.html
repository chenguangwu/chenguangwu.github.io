<div class="container">
  <div class="card">
    <h2 data-zh="📉 标准差与方差">📉 Standard Deviation and Variance</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="计算样本/总体标准差、方差、变异系数（CV）。">Standard Deviation and Variance is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>数据1</label><input type="number" id="n1" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据2</label><input type="number" id="n2" value="12" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据3</label><input type="number" id="n3" value="14" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据4</label><input type="number" id="n4" value="16" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据5</label><input type="number" id="n5" value="18" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据6</label><input type="number" id="n6" value="20" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据7</label><input type="number" id="n7" value="22" step="any" oninput="calc()"></div>
    <div class="input-row"><label>类型 1=样本 2=总体</label><input type="number" id="type" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="50" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">方差 s² = Σ(x − x̄)² / (n − 1)（样本）或 n（总体）<br>标准差 = √方差</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">类型填 1 为样本标准差，填 2 为总体标准差。</p>
  </div>
</div>

<script>
function calc(){
  const n1 = +document.getElementById('n1').value || 0;
  const n2 = +document.getElementById('n2').value || 0;
  const n3 = +document.getElementById('n3').value || 0;
  const n4 = +document.getElementById('n4').value || 0;
  const n5 = +document.getElementById('n5').value || 0;
  const n6 = +document.getElementById('n6').value || 0;
  const n7 = +document.getElementById('n7').value || 0;
  const type = +document.getElementById('type').value || 0;
  let html = '';
  const __v0 = ((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7],n=7,mean=arr.reduce((a,b)=>a+b,0)/n;return arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(type===1?6:7);})());
  html += `<p>方差：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = (Math.sqrt((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7],n=7,mean=arr.reduce((a,b)=>a+b,0)/n;return arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(type===1?6:7);})()));
  html += `<p>标准差：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  const __v2 = ((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7],n=7,mean=arr.reduce((a,b)=>a+b,0)/n;const s=Math.sqrt(arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(type===1?6:7));return s/Math.abs(mean)*100;})());
  html += `<p>变异系数 CV：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> %</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
