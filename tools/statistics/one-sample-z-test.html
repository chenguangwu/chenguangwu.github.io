<div class="container">
  <div class="card">
    <h2>z = (x̄ − μ₀) / (σ/√n)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="已知总体标准差时，检验样本均值是否偏离假设值。">One Sample Z Test is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">z=2 时双侧 p≈0.091。 σ 已知时使用 Z 检验。</div>
      <p class="formula-desc">已知总体标准差时，检验样本均值是否偏离假设值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="xbar">样本均值 x̄</label>
        <input type="number" id="xbar" value="52" step="0.1">
      </div>
      <div>
        <label for="mu0">假设均值 μ₀</label>
        <input type="number" id="mu0" value="50" step="0.1">
      </div>
      <div>
        <label for="sigma">总体标准差 σ</label>
        <input type="number" id="sigma" value="10" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="n">样本量 n</label>
        <input type="number" id="n" value="100" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>z=2 时双侧 p≈0.091。</li>
        <li>σ 已知时使用 Z 检验。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x);
  return s*y;}
function lgamma(z){const g=7;
  const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);
  z-=1; let x=c[0]; for(let i=1;i<g+2;i++) x+=c[i]/(z+i);
  const t=z+g+0.5; return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
function betacf(a,b,x){const MAXIT=200,EPS=3e-12,FPMIN=1e-300;
  let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;}
  return h;}
function betai(a,b,x){if(x<=0)return 0; if(x>=1)return 1;
  const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  if(x<(a+1)/(a+b+2)) return bt*betacf(a,b,x)/a; return 1-bt*betacf(b,a,1-x)/b;}

            const xb=num('xbar'),m0=num('mu0'),s=num('sigma'),n=num('n');
            const z=(xb-m0)/(s/Math.sqrt(n));
            const p=2*(1-erf(Math.abs(z)/Math.SQRT2));
            ToolBox.setResult('result', dataGrid([
                [z.toFixed(4),'z 统计量'],
                [p.toFixed(4),'双侧 p 值']
            ]));
        }
function resetForm(){document.getElementById('xbar').value = '52';
      document.getElementById('mu0').value = '50';
      document.getElementById('sigma').value = '10';
      document.getElementById('n').value = '100';
      calcTool();}
calcTool();
</script>
