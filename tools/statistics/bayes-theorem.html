<h1 class="sr-only">贝叶斯定理计算器</h1>

<div class="container">
  <div class="card">
    <h2>贝叶斯定理计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P(A|B) = P(B|A)P(A) / P(B)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由先验与似然更新后验概率。</p>

    <div class="input-row">
      <div>
        <label for="pa">P(A) 先验</label>
        <input type="number" id="pa" value="0.01" step="0.001">
      </div>
      <div>
        <label for="pbga">P(B|A)</label>
        <input type="number" id="pbga" value="0.9" step="0.01">
      </div>
      <div>
        <label for="pbgna">P(B|¬A)</label>
        <input type="number" id="pbgna" value="0.05" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>先验低时新证据显著提升后验。</li>
        <li>疾病筛查是经典应用。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const pa=num('pa'), pbga=num('pbga'), pbgna=num('pbgna');
            const pb=pbga*pa + pbgna*(1-pa);
            const pab=pbga*pa/pb;
            ToolBox.setResult('result', dataGrid([
                [pab.toFixed(4),'后验 P(A|B)'],
                [pb.toFixed(4),'P(B) 全概率']
            ]));
        }
function resetForm(){document.getElementById('pa').value = '0.01';
      document.getElementById('pbga').value = '0.9';
      document.getElementById('pbgna').value = '0.05';
      calcTool();}
calcTool();
</script>
