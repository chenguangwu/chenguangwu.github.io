<div class="container">
  <div class="card">
    <h2>由两组样本量方差求合并方差</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两组样本量 n₁、n₂ 与方差 s₁²、s₂²，求合并方差。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">s_p² = [(n₁−1)s₁² + (n₂−1)s₂²] / (n₁+n₂−2)</div>
      <p class="formula-desc">输入两组样本量 n₁、n₂ 与方差 s₁²、s₂²，求合并方差。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n1">样本量 n₁</label>
        <input type="number" id="n1" value="10" step="1">
      </div>
      <div>
        <label for="s1">标准差 s₁</label>
        <input type="number" id="s1" value="2" step="0.2">
      </div>
      <div>
        <label for="n2">样本量 n₂</label>
        <input type="number" id="n2" value="12" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="s2">标准差 s₂</label>
        <input type="number" id="s2" value="3" step="0.2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>两样本 t 检验假定等方差时使用。</li>
        <li>(9·4+11·9)/20 → 6.75。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n1=num('n1'),s1=num('s1'),n2=num('n2'),s2=num('s2');
            const sp2=((n1-1)*s1*s1+(n2-1)*s2*s2)/(n1+n2-2);
            ToolBox.setResult('result', dataGrid([
                [sp2.toFixed(3),'合并方差 s_p²']
            ]));
        }
function resetForm(){document.getElementById('n1').value = '10';
      document.getElementById('s1').value = '2';
      document.getElementById('n2').value = '12';
      document.getElementById('s2').value = '3';
      calcTool();}
calcTool();
</script>
