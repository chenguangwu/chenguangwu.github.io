<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x);
  return s*y;}
function lgamma(z){const g=7;
  const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);
  z-=1; let x=c[0]; for(let i=1;i<g+2;i++) x+=c[i]/(z+i);
  const t=z+g+0.5; return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
function betacf(a,b,x){const MAXIT=200,EPS=3e-12,FPMIN=1e-300;
  let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;}
  return h;}
function betai(a,b,x){if(x<=0)return 0; if(x>=1)return 1;
  const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  if(x<(a+1)/(a+b+2)) return bt*betacf(a,b,x)/a; return 1-bt*betacf(b,a,1-x)/b;}

            const ms=[num('m1'),num('m2'),num('m3')];
            const ss=[num('s1'),num('s2'),num('s3')];
            const ns=[num('n1'),num('n2'),num('n3')];
            const k=3, N=ns[0]+ns[1]+ns[2];
            const gm=(ms[0]*ns[0]+ms[1]*ns[1]+ms[2]*ns[2])/N;
            let ssb=0, ssw=0;
            for(let i=0;i<k;i++){ssb+=ns[i]*(ms[i]-gm)*(ms[i]-gm); ssw+=(ns[i]-1)*ss[i]*ss[i];}
            const dfb=k-1, dfw=N-k;
            const F=(ssb/dfb)/(ssw/dfw);
            const p=betai(dfw/2,dfb/2, dfw/(dfw+dfb*F));
            ToolBox.setResult('result', dataGrid([
                [F.toFixed(4),'F 统计量'],
                [p.toFixed(4),'p 值'],
                [dfb.toFixed(0)+', '+dfw.toFixed(0),'自由度 (组间,组内)']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '10';
      document.getElementById('m2').value = '12';
      document.getElementById('m3').value = '14';
      document.getElementById('s1').value = '2';
      document.getElementById('s2').value = '2';
      document.getElementById('s3').value = '2';
      document.getElementById('n1').value = '10';
      document.getElementById('n2').value = '10';
      document.getElementById('n3').value = '10';
      calcTool();}
calcTool();
</script>
