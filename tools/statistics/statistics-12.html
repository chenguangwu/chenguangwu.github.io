<div class="container">
  <div class="card">
    <h2>📈 均值中位数众数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入一组数据，快速计算均值、中位数、众数、极差和总和。</p>
    <div class="input-row"><label>数据1</label><input type="number" id="n1" value="12" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据2</label><input type="number" id="n2" value="15" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据3</label><input type="number" id="n3" value="18" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据4</label><input type="number" id="n4" value="21" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据5</label><input type="number" id="n5" value="21" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据6</label><input type="number" id="n6" value="24" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据7</label><input type="number" id="n7" value="30" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">均值 = Σx / n<br>中位数：排序后中间值<br>极差 = 最大值 − 最小值</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">本版使用7个固定输入，便于快速计算。</p>
  </div>
</div>

<script>
function calc(){
  const n1 = +document.getElementById('n1').value || 0;
  const n2 = +document.getElementById('n2').value || 0;
  const n3 = +document.getElementById('n3').value || 0;
  const n4 = +document.getElementById('n4').value || 0;
  const n5 = +document.getElementById('n5').value || 0;
  const n6 = +document.getElementById('n6').value || 0;
  const n7 = +document.getElementById('n7').value || 0;
  let html = '';
  const __v0 = ((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7];return arr.reduce((a,b)=>a+b,0)/7;})());
  html += `<p>均值：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = ((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7].sort((a,b)=>a-b);return arr[3];})());
  html += `<p>中位数：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  const __v2 = ((()=>{const arr=[n1,n2,n3,n4,n5,n6,n7].sort((a,b)=>a-b);return arr[6]-arr[0];})());
  html += `<p>极差：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(4)}</strong> </p>`;
  const __v3 = (n1+n2+n3+n4+n5+n6+n7);
  html += `<p>总和：<strong style="font-size:18px;color:var(--primary);">${__v3.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
