<div class="container">
  <div class="card">
    <h2>📏 Z 分数计算器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">将原始分数转换为标准 Z 分数，并给出百分位。</p>
    <div class="input-row"><label>原始分数</label><input type="number" id="x" value="85" step="any" oninput="calc()"></div>
    <div class="input-row"><label>总体均值</label><input type="number" id="mu" value="75" step="any" oninput="calc()"></div>
    <div class="input-row"><label>总体标准差</label><input type="number" id="sigma" value="10" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="3" data-viz-min="-3"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Z = (X − μ) / σ<br>百分位 Φ(Z) 由正态分布累积函数近似</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">Z&gt;0 表示高于均值，Z&lt;0 表示低于均值。</p>
  </div>
</div>

<script>
function calc(){
  const x = +document.getElementById('x').value || 0;
  const mu = +document.getElementById('mu').value || 0;
  const sigma = +document.getElementById('sigma').value || 0;
  let html = '';
  const __v0 = ((x-mu)/sigma);
  html += `<p>Z 分数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = ((0.5*(1+Math.erf((x-mu)/(sigma*Math.sqrt(2)))))*100);
  html += `<p>百分位：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> %</p>`;
  const __v2 = (Math.abs((x-mu)/sigma));
  html += `<p>距均值：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> σ</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
