<div class="container">
  <div class="card">
    <h2>📦 四分位距 IQR</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算数据集的四分位数与四分位距，用于异常值检测。</p>
    <div class="input-row"><label>数据量 n</label><input type="number" id="data_count" value="10" step="1" oninput="calc()"></div>
    <div class="input-row"><label>最小值</label><input type="number" id="min_" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Q1</label><input type="number" id="q1" value="25" step="any" oninput="calc()"></div>
    <div class="input-row"><label>中位数</label><input type="number" id="median_" value="40" step="any" oninput="calc()"></div>
    <div class="input-row"><label>Q3</label><input type="number" id="q3" value="60" step="any" oninput="calc()"></div>
    <div class="input-row"><label>最大值</label><input type="number" id="max_" value="90" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">IQR = Q3 − Q1<br>异常值边界：[Q1 − 1.5·IQR, Q3 + 1.5·IQR]</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">超出边界的数据点可视为异常值。</p>
  </div>
</div>

<script>
function calc(){
  const data_count = +document.getElementById('data_count').value || 0;
  const min_ = +document.getElementById('min_').value || 0;
  const q1 = +document.getElementById('q1').value || 0;
  const median_ = +document.getElementById('median_').value || 0;
  const q3 = +document.getElementById('q3').value || 0;
  const max_ = +document.getElementById('max_').value || 0;
  let html = '';
  const __v0 = (q3-q1);
  html += `<p>IQR：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = (q1-1.5*(q3-q1));
  html += `<p>异常值下限：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  const __v2 = (q3+1.5*(q3-q1));
  html += `<p>异常值上限：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(4)}</strong> </p>`;
  const __v3 = (median_);
  html += `<p>中位数：<strong style="font-size:18px;color:var(--primary);">${__v3.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
