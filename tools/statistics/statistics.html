<div class="container">
  <div class="card">
    <h2 data-zh="🔔 正态分布概率">🔔 Statistics</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="给定均值、标准差和上下界，计算正态分布下的区间概率。">Statistics is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>均值</label><input type="number" id="mu" value="0" step="any" oninput="calc()"></div>
    <div class="input-row"><label>标准差</label><input type="number" id="sigma" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>下界</label><input type="number" id="a" value="-1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>上界</label><input type="number" id="b" value="1" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">P(a ≤ X ≤ b) = Φ((b−μ)/σ) − Φ((a−μ)/σ)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">下界可填很大的负数近似 -∞。</p>
  </div>
</div>

<script>
function calc(){
  const mu = +document.getElementById('mu').value || 0;
  const sigma = +document.getElementById('sigma').value || 0;
  const a = +document.getElementById('a').value || 0;
  const b = +document.getElementById('b').value || 0;
  let html = '';
  const __v0 = ((0.5*(1+Math.erf((b-mu)/(sigma*Math.sqrt(2)))) - 0.5*(1+Math.erf((a-mu)/(sigma*Math.sqrt(2)))))*100);
  html += `<p>区间概率：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(3)}</strong> %</p>`;
  const __v1 = ((1 - (0.5*(1+Math.erf((b-mu)/(sigma*Math.sqrt(2)))) - 0.5*(1+Math.erf((a-mu)/(sigma*Math.sqrt(2))))))*100);
  html += `<p>区间外概率：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(3)}</strong> %</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
