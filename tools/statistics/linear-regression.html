<div class="container">
  <div class="card">
    <h2>y = a + b·x（最小二乘）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由数据拟合最佳直线。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">b=Σ(x−x̄)(y−ȳ)/Σ(x−x̄)²。 a = ȳ − b x̄。</div>
      <p class="formula-desc">由数据拟合最佳直线。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="x">X 数据（逗号分隔）</label>
        <input type="number" id="x" value="1,2,3,4,5" step="1">
      </div>
      <div>
        <label for="y">Y 数据（逗号分隔）</label>
        <input type="number" id="y" value="2,4,5,4,5" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>最小二乘：b=Σ(x−x̄)(y−ȳ)/Σ(x−x̄)²。</li>
        <li>a = ȳ − b x̄。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const xa = document.getElementById('x').value.split(',').map(s=>parseFloat(s.trim()));
            const ya = document.getElementById('y').value.split(',').map(s=>parseFloat(s.trim()));
            const n = Math.min(xa.length, ya.length);
            const mx = xa.slice(0,n).reduce((a,b)=>a+b,0)/n, my = ya.slice(0,n).reduce((a,b)=>a+b,0)/n;
            let num_=0, den=0;
            for(let i=0;i<n;i++){num_+=(xa[i]-mx)*(ya[i]-my);den+=Math.pow(xa[i]-mx,2);}
            const b = num_/den, a = my - b*mx;
            ToolBox.setResult('result', dataGrid([
                [a.toFixed(4), '截距 a'],
                [b.toFixed(4), '斜率 b'],
                [(a + b*3).toFixed(3), 'x=3 预测 y']
            ]));
        }
function resetForm(){document.getElementById('x').value = '1,2,3,4,5';
      document.getElementById('y').value = '2,4,5,4,5';
      calcTool();}
calcTool();
</script>
