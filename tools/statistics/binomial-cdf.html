<h1 class="sr-only">P(X ≤ x) = Σ C(n,k)pᵏ(1−p)^{n−k}</h1>

<div class="container">
  <div class="card">
    <h2>由试验数、成功概率与上限求累积概率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入试验数 n、成功概率 p 与上限 x，求 P(X≤x)。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">n=5,p=0.5,x=2 → 0.5。</div>
      <p class="formula-desc">输入试验数 n、成功概率 p 与上限 x，求 P(X≤x)。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">试验数 n</label>
        <input type="number" id="n" value="5" step="1">
      </div>
      <div>
        <label for="p">成功概率 p</label>
        <input type="number" id="p" value="0.5" step="0.05">
      </div>
      <div>
        <label for="x">上限 x</label>
        <input type="number" id="x" value="2" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>二项分布的左尾概率。</li>
        <li>n=5,p=0.5,x=2 → 0.5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            function factN(k){let v=1;for(let i=2;i<=k;i++)v*=i;return v;}
            const n=num('n'),p=num('p'),xx=num('x');
            let cdf=0;
            for(let k=0;k<=xx;k++){
                const comb=factN(n)/(factN(k)*factN(n-k));
                cdf+=comb*Math.pow(p,k)*Math.pow(1-p,n-k);
            }
            ToolBox.setResult('result', dataGrid([
                [cdf.toFixed(4),'累积概率 P(X≤x)']
            ]));
        }
function resetForm(){document.getElementById('n').value = '5';
      document.getElementById('p').value = '0.5';
      document.getElementById('x').value = '2';
      calcTool();}
calcTool();
</script>
