<h1 class="sr-only">t = (x̄ − μ) / (s / √n)</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ t 统计量计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">📊 统计学</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">t 统计量计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由样本均值、假设均值与标准差求 t 值">T Score</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入样本均值 x̄、假设均值 μ、标准差 s 与样本量 n，求 t 统计量。">T Score is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t = (x̄ − μ) / (s / √n)</div>
      <p class="formula-desc">输入样本均值 x̄、假设均值 μ、标准差 s 与样本量 n，求 t 统计量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="xbar">样本均值 x̄</label>
        <input type="number" id="xbar" value="105" step="1">
      </div>
      <div>
        <label for="mu">假设均值 μ</label>
        <input type="number" id="mu" value="100" step="1">
      </div>
      <div>
        <label for="s">标准差 s</label>
        <input type="number" id="s" value="10" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="n">样本量 n</label>
        <input type="number" id="n" value="25" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>单样本 t 检验的核心量。</li>
        <li>(105−100)/(10/5) → 2.5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const xbar=num('xbar'),mu=num('mu'),s=num('s'),n=num('n');
            const t=(xbar-mu)/(s/Math.sqrt(n));
            ToolBox.setResult('result', dataGrid([
                [t.toFixed(3),'t 统计量']
            ]));
        }
function resetForm(){document.getElementById('xbar').value = '105';
      document.getElementById('mu').value = '100';
      document.getElementById('s').value = '10';
      document.getElementById('n').value = '25';
      calcTool();}
calcTool();
</script>
