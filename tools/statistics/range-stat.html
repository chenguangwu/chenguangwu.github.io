<h1 class="sr-only">R = max − min</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由数值序列求极差">Range Calculator</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = max − min</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入多个数值（逗号或空格分隔），求极差。">Range Calculator is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="xs">数值序列</label>
        <input type="number" id="xs" value="2, 4, 4, 4, 5, 5, 7, 9" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>极差最易算但易受极值影响。</li>
        <li>9−2 → 7。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const raw=document.getElementById('xs').value.split(/[ ,]+/).filter(Boolean).map(parseFloat);
            const R=Math.max.apply(null,raw)-Math.min.apply(null,raw);
            ToolBox.setResult('result', dataGrid([
                [R.toFixed(2),'极差 R']
            ]));
        }
function resetForm(){document.getElementById('xs').value = '2, 4, 4, 4, 5, 5, 7, 9';
      calcTool();}
calcTool();
</script>
