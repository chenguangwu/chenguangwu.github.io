<div class="container">
  <div class="card">
    <h2>🏔️ 偏度与峰度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算数据分布的偏度（Skewness）和峰度（Kurtosis）。</p>
    <div class="input-row"><label>数据1</label><input type="number" id="d1" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据2</label><input type="number" id="d2" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据3</label><input type="number" id="d3" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据4</label><input type="number" id="d4" value="3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据5</label><input type="number" id="d5" value="3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据6</label><input type="number" id="d6" value="3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据7</label><input type="number" id="d7" value="4" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据8</label><input type="number" id="d8" value="5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据9</label><input type="number" id="d9" value="6" step="any" oninput="calc()"></div>
    <div class="input-row"><label>数据10</label><input type="number" id="d10" value="10" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="3" data-viz-min="-3"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">偏度 = m₃ / m₂^(3/2)<br>超额峰度 = m₄ / m₂² − 3</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">偏度&gt;0 右偏，&lt;0 左偏；峰度&gt;0 比正态更尖。</p>
  </div>
</div>

<script>
function calc(){
  const d1 = +document.getElementById('d1').value || 0;
  const d2 = +document.getElementById('d2').value || 0;
  const d3 = +document.getElementById('d3').value || 0;
  const d4 = +document.getElementById('d4').value || 0;
  const d5 = +document.getElementById('d5').value || 0;
  const d6 = +document.getElementById('d6').value || 0;
  const d7 = +document.getElementById('d7').value || 0;
  const d8 = +document.getElementById('d8').value || 0;
  const d9 = +document.getElementById('d9').value || 0;
  const d10 = +document.getElementById('d10').value || 0;
  let html = '';
  const __v0 = ((()=>{const arr=[d1,d2,d3,d4,d5,d6,d7,d8,d9,d10],n=10,mean=arr.reduce((a,b)=>a+b,0)/n,m2=arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n,m3=arr.reduce((a,b)=>a+Math.pow(b-mean,3),0)/n;return m3/Math.pow(m2,1.5);})());
  html += `<p>偏度 Skewness：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(4)}</strong> </p>`;
  const __v1 = ((()=>{const arr=[d1,d2,d3,d4,d5,d6,d7,d8,d9,d10],n=10,mean=arr.reduce((a,b)=>a+b,0)/n,m2=arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n,m4=arr.reduce((a,b)=>a+Math.pow(b-mean,4),0)/n;return m4/(m2*m2)-3;})());
  html += `<p>峰度 Excess：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
