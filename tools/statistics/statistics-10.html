<div class="container">
  <div class="card">
    <h2 data-zh="📊 变异系数比较">📊 Statistics 10</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="比较两组数据的离散程度是否相近。">Statistics 10 is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>A 均值</label><input type="number" id="mean1" value="100" step="any" oninput="calc()"></div>
    <div class="input-row"><label>A 标准差</label><input type="number" id="sd1" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>B 均值</label><input type="number" id="mean2" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>B 标准差</label><input type="number" id="sd2" value="8" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="50" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">CV = (标准差 / |均值|) × 100%</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">CV 消除了量纲影响，可比较不同单位的数据。</p>
  </div>
</div>

<script>
function calc(){
  const mean1 = +document.getElementById('mean1').value || 0;
  const sd1 = +document.getElementById('sd1').value || 0;
  const mean2 = +document.getElementById('mean2').value || 0;
  const sd2 = +document.getElementById('sd2').value || 0;
  let html = '';
  const __v0 = (sd1/Math.abs(mean1)*100);
  html += `<p>A 变异系数 CV：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> %</p>`;
  const __v1 = (sd2/Math.abs(mean2)*100);
  html += `<p>B 变异系数 CV：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> %</p>`;
  const __v2 = (sd1/Math.abs(mean1) > sd2/Math.abs(mean2) ? 1 : 2);
  html += `<p>更离散：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 组</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
