<h1 class="sr-only">Cramér's V 计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>Cramér&#x27;s V 计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">V = √(χ² / (n·min(r−1,c−1)))</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">分类变量间关联强度的标准化效应量（2×2）。</p>

    <div class="input-row">
      <div>
        <label for="a">a</label>
        <input type="number" id="a" value="40" step="1">
      </div>
      <div>
        <label for="b">b</label>
        <input type="number" id="b" value="60" step="1">
      </div>
      <div>
        <label for="c">c</label>
        <input type="number" id="c" value="20" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="d">d</label>
        <input type="number" id="d" value="80" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>2×2 时 min(r−1,c−1)=1。</li>
        <li>V∈[0,1]，越大关联越强。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a=num('a'),b=num('b'),c=num('c'),d=num('d');
            const n=a+b+c+d;
            const e11=(a+b)*(a+c)/n, e12=(a+b)*(b+d)/n, e21=(c+d)*(a+c)/n, e22=(c+d)*(b+d)/n;
            const chi=(a-e11)*(a-e11)/e11+(b-e12)*(b-e12)/e12+(c-e21)*(c-e21)/e21+(d-e22)*(d-e22)/e22;
            const V=Math.sqrt(chi/(n*1));
            ToolBox.setResult('result', dataGrid([
                [chi.toFixed(4),'卡方 χ²'],
                [V.toFixed(4),'Cramér\'s V']
            ]));
        }
function resetForm(){document.getElementById('a').value = '40';
      document.getElementById('b').value = '60';
      document.getElementById('c').value = '20';
      document.getElementById('d').value = '80';
      calcTool();}
calcTool();
</script>
