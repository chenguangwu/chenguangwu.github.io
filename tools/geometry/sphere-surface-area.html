<div class="container">
  <div class="card">
    <h2 data-zh="由半径求球的表面积">Sphere Surface Area</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入球半径，求表面积。">Sphere Surface Area is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">S = 4·π·r²</div>
      <p class="formula-desc">输入球半径，求表面积。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="r">半径 r (m)</label>
        <input type="number" id="r" value="3" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A = 4πr²。</li>
        <li>r=3 → A≈113.1 m²。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const r=num('r');
            ToolBox.setResult('result', dataGrid([
                [(4*Math.PI*r*r).toFixed(3),'表面积 A (m²)']
            ]));
        }
function resetForm(){document.getElementById('r').value = '3';
      calcTool();}
calcTool();
</script>
