<div class="container">
  <div class="card">
    <h2 data-zh="梯形面积（A = (a + b)·h / 2）">Trapezoid Area</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由上下底与高求梯形面积。">Trapezoid Area is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A = (a+b)·h/2。 3/5 底、高 4 的梯形面积 16。</div>
      <p class="formula-desc">由上下底与高求梯形面积。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a">上底 (m)</label>
        <input type="number" id="a" value="3" step="0.1">
      </div>
      <div>
        <label for="b">下底 (m)</label>
        <input type="number" id="b" value="5" step="0.1">
      </div>
      <div>
        <label for="h">高 (m)</label>
        <input type="number" id="h" value="4" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A = (a+b)·h/2。</li>
        <li>3/5 底、高 4 的梯形面积 16。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a = num('a'), b = num('b'), h = num('h');
            const A = (a + b) * h / 2;
            ToolBox.setResult('result', dataGrid([
                [A.toFixed(4), '梯形面积 A (m²)'],
                [((a + b) * 2).toFixed(4), '中位线×2 (m)']
            ]));
        }
function resetForm(){document.getElementById('a').value = '3';
      document.getElementById('b').value = '5';
      document.getElementById('h').value = '4';
      calcTool();}
calcTool();
</script>
