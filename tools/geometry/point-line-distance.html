<div class="container">
  <div class="card">
    <h2>距离（d = |Ax₀+By₀+C| / √(A²+B²)）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">点 (x₀,y₀) 到直线 Ax+By+C=0 的最短距离。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">d = |Ax₀+By₀+C| / √(A²+B²)。 原点到 x+y−1=0 距离为 0.7071。</div>
      <p class="formula-desc">点 (x₀,y₀) 到直线 Ax+By+C=0 的最短距离。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="A">A</label>
        <input type="number" id="A" value="1" step="0.1">
      </div>
      <div>
        <label for="B">B</label>
        <input type="number" id="B" value="1" step="0.1">
      </div>
      <div>
        <label for="C">C</label>
        <input type="number" id="C" value="-1" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="x0">点 x₀</label>
        <input type="number" id="x0" value="0" step="0.1">
      </div>
      <div>
        <label for="y0">点 y₀</label>
        <input type="number" id="y0" value="0" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>d = |Ax₀+By₀+C| / √(A²+B²)。</li>
        <li>原点到 x+y−1=0 距离为 0.7071。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const A = num('A'), B = num('B'), C = num('C'), x0 = num('x0'), y0 = num('y0');
            const d = Math.abs(A * x0 + B * y0 + C) / Math.sqrt(A * A + B * B);
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(4), '距离 d (m)'],
                [(Math.sqrt(A*A+B*B)).toFixed(4), '法向量模 √A²+B²']
            ]));
        }
function resetForm(){document.getElementById('A').value = '1';
      document.getElementById('B').value = '1';
      document.getElementById('C').value = '-1';
      document.getElementById('x0').value = '0';
      document.getElementById('y0').value = '0';
      calcTool();}
calcTool();
</script>
