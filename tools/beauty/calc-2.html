<div class="container">
  <div class="card">
    <h2>💄 粉底色号匹配</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据肤色深浅与冷暖色调，推荐粉底色号与选色技巧。</p>

    <div class="input-row">
      <div>
        <label>肤色深浅</label>
        <select id="tone">
          <option value="fair">很白（Fair）</option>
          <option value="light" selected>白皙（Light）</option>
          <option value="medium">自然（Medium）</option>
          <option value="tan">小麦（Tan）</option>
          <option value="deep">深肤色（Deep）</option>
        </select>
      </div>
      <div>
        <label>血管颜色（判断冷暖调）</label>
        <select id="vein">
          <option value="cool">偏紫/蓝色 → 冷调</option>
          <option value="neutral" selected>紫绿都有 → 中性调</option>
          <option value="warm">偏绿/橄榄 → 暖调</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>金银饰测试</label>
        <select id="jewelry">
          <option value="cool">银色更显气色 → 冷调</option>
          <option value="neutral" selected>都不错 → 中性调</option>
          <option value="warm">金色更显气色 → 暖调</option>
        </select>
      </div>
      <div>
        <label>晒后反应</label>
        <select id="sun">
          <option value="cool">容易晒红/晒伤</option>
          <option value="neutral" selected>先红后黑</option>
          <option value="warm">容易晒黑</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">匹配色号</button>
      <button class="btn" onclick="saveInputs()">保存</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>选择肤色与色调后点击匹配。</p>
    </div>

    <div class="ref-card">
      <h4>选色小技巧</h4>
      <ul>
        <li>在下巴与脖子交界处试色，而非手背。</li>
        <li>等待 30 秒观察粉底与肤色融合后的效果。</li>
        <li>自然光下判断最准确。</li>
        <li>色号应“隐形”，与肤色过渡自然。</li>
      </ul>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_beauty_calc2';

const SHADE_MAP = {
  fair: { cool: 'C/NC10-NC15 粉一白', neutral: 'N10-N15 中性一白', warm: 'W10-W15 黄一白' },
  light: { cool: 'C/NC15-NC20 粉二白', neutral: 'N15-N20 中性二白', warm: 'W15-W20 黄二白' },
  medium: { cool: 'C/NC20-NC25 粉三白', neutral: 'N20-N25 中性三白', warm: 'W20-W25 黄三白' },
  tan: { cool: 'C/NC25-NC30 粉四白', neutral: 'N25-N30 中性四白', warm: 'W25-W30 黄四白' },
  deep: { cool: 'C/NC30-NC40 粉调深肤', neutral: 'N30-N40 中性深肤', warm: 'W30-W40 黄调深肤' }
};

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.tone) document.getElementById('tone').value = data.tone;
    if (data.vein) document.getElementById('vein').value = data.vein;
    if (data.jewelry) document.getElementById('jewelry').value = data.jewelry;
    if (data.sun) document.getElementById('sun').value = data.sun;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tone: document.getElementById('tone').value,
      vein: document.getElementById('vein').value,
      jewelry: document.getElementById('jewelry').value,
      sun: document.getElementById('sun').value
    }));
    ToolBox.showToast(i18nText('toast.saved'));
  } catch (e) {
    ToolBox.showToast(i18nText('toast.import_failed'), 'error');
  }
}

function determineUndertone() {
  const vein = document.getElementById('vein').value;
  const jewelry = document.getElementById('jewelry').value;
  const sun = document.getElementById('sun').value;
  const votes = { cool: 0, neutral: 0, warm: 0 };
  votes[vein]++;
  votes[jewelry]++;
  votes[sun]++;

  let max = 'neutral';
  if (votes.cool >= votes.neutral && votes.cool >= votes.warm) max = 'cool';
  else if (votes.warm >= votes.neutral && votes.warm >= votes.cool) max = 'warm';
  return max;
}

function calculate() {
  const tone = document.getElementById('tone').value;
  const undertone = determineUndertone();
  const shade = SHADE_MAP[tone][undertone];

  const undertoneText = {
    cool: '冷调（Cool / Pink）',
    neutral: '中性调（Neutral）',
    warm: '暖调（Warm / Yellow / Olive）'
  }[undertone];

  const toneText = {
    fair: '很白', light: '白皙', medium: '自然', tan: '小麦', deep: '深肤色'
  }[tone];

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:24px;font-weight:700;color:var(--primary);">${shade}</div>
    </div>
    <p>肤色深浅：<strong>${toneText}</strong> · 肤色调：<strong>${undertoneText}</strong></p>
    <p>选色建议：${undertone === 'cool' ? '选择粉调（C/Pink/Rose）底色，避免过黄。' : undertone === 'warm' ? '选择黄调/暖调（W/Yellow/Golden）底色，避免发灰。' : '选择中性底色（N/Neutral），兼容度最高。'}</p>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('选择肤色与色调')) {
    ToolBox.showToast(i18nText('toast.msg610'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('toast.copy_success'));
}

loadInputs();
calculate();
</script>
