<body>
<h1 class="sr-only">皮肤类型测试</h1>

<div class="tool-guide-link" data-guide-link="1">
  <a href="../../guides/calc-1-guide.html">📖 查看「增值税计算使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>🧴 皮肤类型测试</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">通过简单问卷判断你的皮肤类型，获取基础护肤建议。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本速查内容依据权威标准与公开资料整理，供快速查阅参考；具体数值以官方最新发布为准。 工具名称：皮肤类型测试 - 通过简单问卷判断你的皮肤类型，获取基础护肤建议。</p>
</div>


    <div class="input-row">
      <div>
        <label>洁面后 1 小时，脸部感觉如何？</label>
        <select id="q1">
          <option value="oily|2">整体偏油，T区明显</option>
          <option value="dry|2">紧绷、干燥，甚至有脱皮</option>
          <option value="combination|2">T区油，两颊干</option>
          <option value="normal|2" selected>舒适，不油不干</option>
        </select>
      </div>
      <div>
        <label>毛孔状态？</label>
        <select id="q2">
          <option value="oily|2">毛孔粗大，易出油</option>
          <option value="dry|2">细腻但干燥</option>
          <option value="combination|2">T区明显，两颊细腻</option>
          <option value="normal|2" selected>均匀细腻</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>是否容易敏感、泛红或刺痛？</label>
        <select id="q3">
          <option value="sensitive|2">经常</option>
          <option value="sensitive|1">偶尔</option>
          <option value="none|0" selected>很少</option>
        </select>
      </div>
      <div>
        <label>痘痘/黑头情况？</label>
        <select id="q4">
          <option value="oily|2">经常出油长痘、黑头</option>
          <option value="dry|1">偶尔因干燥起疹</option>
          <option value="combination|2">T区黑头多，两颊少</option>
          <option value="normal|0" selected>很少</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>上妆后状态？</label>
        <select id="q5">
          <option value="oily|2">易脱妆、出油</option>
          <option value="dry|2">易卡粉、起皮</option>
          <option value="combination|2">T区脱妆，两颊卡粉</option>
          <option value="normal|2" selected>服帖自然</option>
        </select>
      </div>
      <div>
        <label>皮肤光泽度？</label>
        <select id="q6">
          <option value="oily|2">整体油光明显</option>
          <option value="dry|2">暗沉、缺乏光泽</option>
          <option value="combination|2">T区油光，两颊哑光</option>
          <option value="normal|2" selected>自然光泽</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">测试皮肤类型</button>
      <button class="btn" onclick="saveInputs()">保存</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>回答全部问题后点击测试。</p>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_beauty_calc1';

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    ['q1','q2','q3','q4','q5','q6'].forEach(id => {
      if (data[id]) document.getElementById(id).value = data[id];
    });
  } catch (e) {}
}

function saveInputs() {
  try {
    const data = {};
    ['q1','q2','q3','q4','q5','q6'].forEach(id => data[id] = document.getElementById(id).value);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    ToolBox.showToast(i18nText('toast.saved'));
  } catch (e) {
    ToolBox.showToast(i18nText('toast.import_failed'), 'error');
  }
}

function calculate() {
  const scores = { oily: 0, dry: 0, combination: 0, normal: 0, sensitive: 0 };
  ['q1','q2','q3','q4','q5','q6'].forEach(id => {
    const val = document.getElementById(id).value;
    const [type, score] = val.split('|');
    scores[type] += parseInt(score);
  });

  let type, title, advice;
  const isSensitive = scores.sensitive >= 2;

  if (scores.oily > scores.dry && scores.oily > scores.combination && scores.oily > scores.normal) {
    type = '油性肌肤';
    title = '💧 油性肌肤';
    advice = '注重清洁与控油，选择清爽型水乳，定期去角质，避免过度清洁导致屏障受损。';
  } else if (scores.dry > scores.oily && scores.dry > scores.combination && scores.dry > scores.normal) {
    type = '干性肌肤';
    title = '🌵 干性肌肤';
    advice = '加强保湿与锁水，选择含神经酰胺、玻尿酸的产品，避免使用皂基洁面。';
  } else if (scores.combination > scores.normal) {
    type = '混合性肌肤';
    title = '⚖️ 混合性肌肤';
    advice = '分区护理：T区控油清爽，两颊保湿滋润，避免全脸使用过于油腻的产品。';
  } else {
    type = '中性肌肤';
    title = '✨ 中性肌肤';
    advice = '保持基础清洁、保湿与防晒即可，维持当前护肤节奏。';
  }

  const sensitivityText = isSensitive ? ' <span class="grade-tag grade-pass">敏感肌</span>' : '';

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:24px;font-weight:700;color:var(--primary);">${title}${sensitivityText}</div>
    </div>
    <p>${advice}</p>
    ${isSensitive ? '<p>敏感肌建议：精简护肤，避免高浓度酸类、酒精和香精，优先选择温和修护类产品。</p>' : ''}
    <p style="margin-top:8px;font-size:12px;color:var(--text-muted);">油 ${scores.oily} · 干 ${scores.dry} · 混合 ${scores.combination} · 中性 ${scores.normal} · 敏感 ${scores.sensitive}</p>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('回答全部问题')) {
    ToolBox.showToast(i18nText('toast.msg641'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('toast.copy_success'));
}

loadInputs();
calculate();
</script>
