<h1 class='sr-only'>制动减速度计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 制动减速度计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🛑 制动减速度计算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工程计算基于标准物理与材料公式，输入为标准工程单位，结果仅供参考。 工具名称：制动减速度计算 - 汽车交通在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>按匀减速模型，根据初速度和制动距离或制动时间，估算制动减速度与等效 g 值。</p>
  </div>
  <div class='card'>
    <div class='section-title'>按制动距离计算</div>
    <div class='input-row'>
      <div><label for='v1'>初速度（km/h）</label><input type='number' id='v1' value='100' min='1' step='1'></div>
      <div><label for='s1'>制动距离（m）</label><input type='number' id='s1' value='40' min='0.1' step='0.1'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calcByDistance()'>计算</button>
      <button class='btn' onclick="copyRes('res1')">复制结果</button>
    </div>
    <div class='result-box' id='res1'><p>结果将显示在这里。</p></div>
  </div>
  <div class='card'>
    <div class='section-title'>按制动时间计算</div>
    <div class='input-row'>
      <div><label for='v2'>初速度（km/h）</label><input type='number' id='v2' value='100' min='1' step='1'></div>
      <div><label for='t2'>制动时间（s）</label><input type='number' id='t2' value='3.5' min='0.1' step='0.1'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calcByTime()'>计算</button>
      <button class='btn' onclick="copyRes('res2')">复制结果</button>
    </div>
    <div class='result-box' id='res2'><p>结果将显示在这里。</p></div>
  </div>
</div>

</div>
<script>
(function(){
  const G = 9.80665;
  function fmt(n,d){ return ToolBox.formatNumber(n, d); }
  function speedMs(kmh){ return kmh / 3.6; }
  function calcByDistance(){
    const v = speedMs(parseFloat(ToolBox.$('v1').value) || 0);
    const s = parseFloat(ToolBox.$('s1').value) || 0;
    const el = ToolBox.$('res1');
    if(v <= 0 || s <= 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>'; return; }
    const a = (v * v) / (2 * s);
    const t = v / a;
    el.innerHTML =
      '<p>制动减速度：<strong>' + fmt(a, 2) + '</strong> m/s²（约 <strong>' + fmt(a / G, 2) + '</strong> g）</p>' +
      '<p>等效制动时间：<strong>' + fmt(t, 2) + '</strong> s</p>';
  }
  function calcByTime(){
    const v = speedMs(parseFloat(ToolBox.$('v2').value) || 0);
    const t = parseFloat(ToolBox.$('t2').value) || 0;
    const el = ToolBox.$('res2');
    if(v <= 0 || t <= 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>'; return; }
    const a = v / t;
    const s = 0.5 * a * t * t;
    el.innerHTML =
      '<p>制动减速度：<strong>' + fmt(a, 2) + '</strong> m/s²（约 <strong>' + fmt(a / G, 2) + '</strong> g）</p>' +
      '<p>等效制动距离：<strong>' + fmt(s, 2) + '</strong> m</p>';
  }
  function copyRes(id){
    const text = ToolBox.$(id).innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('结果将显示') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  document.addEventListener('DOMContentLoaded', function(){
    calcByDistance(); calcByTime();
  });
  window.calcByDistance = calcByDistance;
  window.calcByTime = calcByTime;
  window.copyRes = copyRes;
})();
</script>
