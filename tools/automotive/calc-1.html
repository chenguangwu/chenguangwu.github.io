<h1 class='sr-only'>汽车百公里加速时间估算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 汽车百公里加速时间估算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2 data-zh="🚗 汽车百公里加速时间估算">🚗 0-100 km/h Acceleration Estimator</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t ≈ ½·m·v² / (P·η)</div>
    </div>
    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;' data-zh="根据车辆质量、发动机功率与传动效率，快速估算从静止加速到目标车速所需的时间。">Estimate a vehicle 0-100 km/h acceleration time.</p>
    <div class='input-row'>
      <div>
        <label for='targetSpeed'>目标车速（km/h）</label>
        <input type='number' id='targetSpeed' value='100' min='1' step='1'>
      </div>
      <div>
        <label for='mass'>车辆整备质量（kg）</label>
        <input type='number' id='mass' value='1500' min='1' step='10'>
      </div>
    </div>
    <div class='input-row'>
      <div>
        <label for='power'>发动机最大功率（kW）</label>
        <input type='number' id='power' value='120' min='1' step='1'>
      </div>
      <div>
        <label for='efficiency'>传动效率（%）</label>
        <input type='number' id='efficiency' value='90' min='1' max='100' step='1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>估算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后点击“估算”。</p></div>
    <div class='formula'>
      估算公式：t ≈ ½·m·v² / (P·η)，其中 v = 车速 / 3.6（m/s），P = 功率 × 传动效率。未计入风阻、滚阻与轮胎打滑，结果仅供参考。
    </div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_auto_accel';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const target = get('targetSpeed');
    const mass = get('mass');
    const power = get('power');
    const eff = get('efficiency');
    const resultEl = ToolBox.$('result');
    if(target <= 0 || mass <= 0 || power <= 0 || eff <= 0 || eff > 100){
      resultEl.innerHTML = '<p style="color:var(--danger)">请输入有效的正数参数。</p>';
      return;
    }
    const v = target / 3.6;
    const pEff = power * (eff / 100);
    const t = (0.5 * mass * v * v) / (pEff * 1000);
    const a = v / t;
    const g = a / 9.80665;
    let level = '';
    if(t < 4) level = '超跑级';
    else if(t < 6) level = '运动型';
    else if(t < 9) level = '家用车水平';
    else level = '偏慢';
    resultEl.innerHTML =
      '<p>估算加速时间：<strong>' + ToolBox.formatNumber(t, 2) + '</strong> 秒</p>' +
      '<p>平均加速度：<strong>' + ToolBox.formatNumber(a, 2) + '</strong> m/s²（约 <strong>' + ToolBox.formatNumber(g, 2) + '</strong> g）</p>' +
      '<p>性能等级：<strong>' + level + '</strong></p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('msg260'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        target: ToolBox.$('targetSpeed').value,
        mass: ToolBox.$('mass').value,
        power: ToolBox.$('power').value,
        eff: ToolBox.$('efficiency').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.target) ToolBox.$('targetSpeed').value = data.target;
      if(data.mass) ToolBox.$('mass').value = data.mass;
      if(data.power) ToolBox.$('power').value = data.power;
      if(data.eff) ToolBox.$('efficiency').value = data.eff;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['targetSpeed','mass','power','efficiency'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
