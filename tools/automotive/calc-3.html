<h1 class='sr-only'>轮胎胎压换算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 轮胎胎压换算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🛞 轮胎胎压换算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：轮胎胎压换算 - 汽车交通在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>在 bar、psi、kPa、kg/cm² 之间换算轮胎气压，并查看常用参考值。</p>
    <div class='input-row'>
      <div>
        <label for='pressure'>胎压数值</label>
        <input type='number' id='pressure' value='2.5' min='0' step='0.01'>
      </div>
      <div>
        <label for='fromUnit'>当前单位</label>
        <select id='fromUnit'>
          <option value='bar' selected>bar</option>
          <option value='psi'>psi</option>
          <option value='kPa'>kPa</option>
          <option value='kgcm2'>kg/cm²</option>
        </select>
      </div>
      <div>
        <label for='toUnit'>目标单位</label>
        <select id='toUnit'>
          <option value='bar'>bar</option>
          <option value='psi' selected>psi</option>
          <option value='kPa'>kPa</option>
          <option value='kgcm2'>kg/cm²</option>
        </select>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='convert()'>换算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入胎压值并选择单位。</p></div>
    <table class='unit-table'>
      <thead><tr><th>单位</th><th>换算值</th></tr></thead>
      <tbody id='allUnits'><tr><td colspan='2'>点击换算后显示全部单位对照</td></tr></tbody>
    </table>
    <div class='info-box' style='margin-top:12px;'>轿车冷胎建议胎压一般为 2.2~2.5 bar（约 32~36 psi），具体以车辆 B 柱/油箱盖标注为准。</div>
  </div>
</div>

</div>
<script>
(function(){
  const toBar = {bar:1, psi:0.0689475729, kPa:0.01, kgcm2:0.980665};
  const fromBar = {bar:1, psi:14.5037738, kPa:100, kgcm2:1.01971621};
  const labels = {bar:'bar', psi:'psi', kPa:'kPa', kgcm2:'kg/cm²'};
  function convert(){
    const v = parseFloat(ToolBox.$('pressure').value) || 0;
    const from = ToolBox.$('fromUnit').value;
    const to = ToolBox.$('toUnit').value;
    const resultEl = ToolBox.$('result');
    if(v < 0){ resultEl.innerHTML = '<p style="color:var(--danger)">请输入有效数值。</p>'; return; }
    const bar = v * toBar[from];
    const out = bar * fromBar[to];
    resultEl.innerHTML = '<p>' + v + ' ' + labels[from] + ' = <strong>' + ToolBox.formatNumber(out, 3) + '</strong> ' + labels[to] + '</p>';
    let html = '';
    for(const u in labels){
      html += '<tr><td>' + labels[u] + '</td><td><strong>' + ToolBox.formatNumber(bar * fromBar[u], 3) + '</strong></td></tr>';
    }
    ToolBox.$('allUnits').innerHTML = html;
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('msg297'));
  }
  document.addEventListener('DOMContentLoaded', function(){
    convert();
    ['pressure','fromUnit','toUnit'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(convert, 200));
    });
  });
  window.convert = convert;
  window.copyResult = copyResult;
})();
</script>
