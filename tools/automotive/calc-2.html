<h1 class='sr-only'>发动机功率/扭矩换算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 发动机功率/扭矩换算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>⚙️ 发动机功率/扭矩换算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：发动机功率/扭矩换算。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据功率、扭矩与转速之间的物理关系进行换算，支持 kW 与 PS（公制马力）互转。</p>
  </div>
  <div class='card'>
    <div class='section-title'>已知功率和转速，求扭矩</div>
    <div class='input-row'>
      <div><label for='p1'>功率（kW）</label><input type='number' id='p1' value='120' min='0' step='0.1'></div>
      <div><label for='n1'>转速（rpm）</label><input type='number' id='n1' value='3000' min='1' step='100'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calcTorque()'>计算扭矩</button>
      <button class='btn' onclick="copyRes('res1')">复制结果</button>
    </div>
    <div class='result-box' id='res1'><p>结果将显示在这里。</p></div>
  </div>
  <div class='card'>
    <div class='section-title'>已知扭矩和转速，求功率</div>
    <div class='input-row'>
      <div><label for='t2'>扭矩（Nm）</label><input type='number' id='t2' value='350' min='0' step='1'></div>
      <div><label for='n2'>转速（rpm）</label><input type='number' id='n2' value='3000' min='1' step='100'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calcPower()'>计算功率</button>
      <button class='btn' onclick="copyRes('res2')">复制结果</button>
    </div>
    <div class='result-box' id='res2'><p>结果将显示在这里。</p></div>
  </div>
  <div class='card'>
    <div class='section-title'>功率单位换算</div>
    <div class='input-row'>
      <div><label for='kw'>功率（kW）</label><input type='number' id='kw' value='120' min='0' step='0.1'></div>
      <div><label for='ps'>公制马力（PS）</label><input type='number' id='ps' value='' min='0' step='0.1' placeholder='输入或计算'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='kwToPs()'>kW → PS</button>
      <button class='btn' onclick='psToKw()'>PS → kW</button>
    </div>
    <div class='result-box' id='res3'><p>结果将显示在这里。</p></div>
  </div>
</div>

</div>
<script>
(function(){
  const PS = 0.73549875;
  function fmt(n,d){ return ToolBox.formatNumber(n, d); }
  function calcTorque(){
    const p = parseFloat(ToolBox.$('p1').value) || 0;
    const n = parseFloat(ToolBox.$('n1').value) || 0;
    const el = ToolBox.$('res1');
    if(p <= 0 || n <= 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>'; return; }
    const t = p * 9549.3 / n;
    el.innerHTML = '<p>扭矩 ≈ <strong>' + fmt(t, 2) + '</strong> Nm</p><p style="font-size:12px;color:var(--text-muted)">公式：T = 9549.3 × P(kW) / n(rpm)</p>';
  }
  function calcPower(){
    const t = parseFloat(ToolBox.$('t2').value) || 0;
    const n = parseFloat(ToolBox.$('n2').value) || 0;
    const el = ToolBox.$('res2');
    if(t <= 0 || n <= 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>'; return; }
    const p = t * n / 9549.3;
    el.innerHTML = '<p>功率 ≈ <strong>' + fmt(p, 2) + '</strong> kW（<strong>' + fmt(p / PS, 2) + '</strong> PS）</p><p style="font-size:12px;color:var(--text-muted)">公式：P = T(Nm) × n(rpm) / 9549.3</p>';
  }
  function kwToPs(){
    const kw = parseFloat(ToolBox.$('kw').value) || 0;
    const el = ToolBox.$('res3');
    if(kw < 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效数值。</p>'; return; }
    const ps = kw / PS;
    ToolBox.$('ps').value = fmt(ps, 2);
    el.innerHTML = '<p>' + fmt(kw, 2) + ' kW ≈ <strong>' + fmt(ps, 2) + '</strong> PS</p>';
  }
  function psToKw(){
    const ps = parseFloat(ToolBox.$('ps').value) || 0;
    const el = ToolBox.$('res3');
    if(ps < 0){ el.innerHTML = '<p style="color:var(--danger)">请输入有效数值。</p>'; return; }
    const kw = ps * PS;
    ToolBox.$('kw').value = fmt(kw, 2);
    el.innerHTML = '<p>' + fmt(ps, 2) + ' PS ≈ <strong>' + fmt(kw, 2) + '</strong> kW</p>';
  }
  function copyRes(id){
    const text = ToolBox.$(id).innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('结果将显示') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  document.addEventListener('DOMContentLoaded', function(){
    calcTorque(); calcPower();
  });
  window.calcTorque = calcTorque;
  window.calcPower = calcPower;
  window.kwToPs = kwToPs;
  window.psToKw = psToKw;
  window.copyRes = copyRes;
})();
</script>
