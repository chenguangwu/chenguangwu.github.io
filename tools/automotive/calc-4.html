<h1 class='sr-only'>拖车球头载荷计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 拖车球头载荷计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🚙 拖车球头载荷计算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工程计算基于标准物理与材料公式，输入为标准工程单位，结果仅供参考。 工具名称：拖车球头载荷计算 - 汽车交通在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据拖车总质量和建议的球头载荷比例，估算拖车球头（Tongue Load）垂直载荷。</p>
    <div class='input-row'>
      <div>
        <label for='trailerMass'>拖车总质量（kg）</label>
        <input type='number' id='trailerMass' value='1500' min='1' step='10'>
      </div>
      <div>
        <label for='ratio'>球头载荷比例（%）</label>
        <input type='number' id='ratio' value='12' min='1' max='50' step='0.5'>
      </div>
    </div>
    <div class='input-row'>
      <div>
        <label for='maxLoad'>车辆最大允许球头载荷（kg，可选）</label>
        <input type='number' id='maxLoad' value='150' min='0' step='10' placeholder='未填写则不校验'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>一般建议球头载荷为拖车总质量的 10%~15%。载荷过轻易摆尾，过重则影响前车操控。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_tongue_load';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const mass = get('trailerMass');
    const ratio = get('ratio');
    const maxLoad = get('maxLoad');
    const el = ToolBox.$('result');
    if(mass <= 0 || ratio <= 0 || ratio > 100){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效的正数参数。</p>';
      return;
    }
    const loadKg = mass * (ratio / 100);
    const loadN = loadKg * 9.80665;
    let status = '';
    if(maxLoad > 0){
      if(loadKg > maxLoad) status = '<p style="color:var(--danger)">⚠️ 超出车辆最大允许球头载荷 ' + maxLoad + ' kg</p>';
      else status = '<p style="color:var(--success)">✅ 在车辆允许范围内</p>';
    }
    el.innerHTML =
      '<p>球头载荷：<strong>' + ToolBox.formatNumber(loadKg, 1) + '</strong> kg</p>' +
      '<p>约 <strong>' + ToolBox.formatNumber(loadN, 0) + '</strong> N</p>' + status;
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        mass: ToolBox.$('trailerMass').value,
        ratio: ToolBox.$('ratio').value,
        max: ToolBox.$('maxLoad').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.mass) ToolBox.$('trailerMass').value = data.mass;
      if(data.ratio) ToolBox.$('ratio').value = data.ratio;
      if(data.max !== undefined) ToolBox.$('maxLoad').value = data.max;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['trailerMass','ratio','maxLoad'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
