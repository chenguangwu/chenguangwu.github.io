<h1 class="sr-only">云底高度（抬升凝结高度）估算</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 云底高度估算计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 气象天气</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">云底高度估算计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>云底高度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由气温与露点差，按经验规则 H ≈ (T − Td) × 125（米/℃）估算云底高度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">h = (T−Td)/0.98 × 100 (m)</div>
      <p class="formula-desc">由气温与露点差，按经验规则 H ≈ (T − Td) × 125（米/℃）估算云底高度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">气温 T (°C)</label>
        <input type="number" id="T" value="25" step="0.5">
      </div>
      <div>
        <label for="Td">露点 Td (°C)</label>
        <input type="number" id="Td" value="15" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>经验规则（约 125 m/℃），与气压、抬升率有关，作近似。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), Td=num('Td');
            const H = (T - Td) * 125;
            ToolBox.setResult('result', dataGrid([ [H.toFixed(0)+' m', '估算云底高度 H=(T−Td)×125'] ]));
        }
function resetForm(){document.getElementById('T').value = 25;
      document.getElementById('Td').value = 15;
      calcTool();}
calcTool();
</script>
