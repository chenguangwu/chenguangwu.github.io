<h1 class="sr-only">国际标准大气（ISA）温度计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>ISA 温度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由海拔高度按 ISA 模型求气温：对流层（≤11km）每千米降 6.5℃，平流层底部恒温。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">T = 15 − 1.98·h (°C, h:km)</div>
      <p class="formula-desc">由海拔高度按 ISA 模型求气温：对流层（≤11km）每千米降 6.5℃，平流层底部恒温。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="h">海拔高度 h (km)</label>
        <input type="number" id="h" value="5" step="0.5" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>海平标准温 15℃，11km 处约 −56.5℃ 为对流层顶。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const h=num('h');
            let T;
            if (h<=11) T = 15 - 6.5*h;
            else T = -56.5;
            ToolBox.setResult('result', dataGrid([ [T.toFixed(1)+' °C', '标准气温 T（ISA）'] ]));
        }
function resetForm(){document.getElementById('h').value = 5;
      calcTool();}
calcTool();
</script>
