<div class="container">
  <div class="card">
    <h2>Humidex</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由气温与相对湿度，先求水汽压 e，再按 Humidex = T + 0.5555·(e − 10) 计算湿热体感指数。">Humidex is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Humidex = T + 0.5555·(e−10)</div>
      <p class="formula-desc">由气温与相对湿度，先求水汽压 e，再按 Humidex = T + 0.5555·(e − 10) 计算湿热体感指数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">气温 T (°C)</label>
        <input type="number" id="T" value="30" step="0.5">
      </div>
      <div>
        <label for="RH">相对湿度 RH (%)</label>
        <input type="number" id="RH" value="70" step="1" min="0" max="100">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>30–39 需注意，40+ 危险，45+ 极危险（加拿大标准）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), RH=num('RH');
            const e = (RH/100)*6.1094*Math.exp(17.625*T/(T+243.04)); // hPa
            const H = T + 0.5555*(e - 10);
            ToolBox.setResult('result', dataGrid([ [H.toFixed(1), '湿热指数 Humidex'] ]));
        }
function resetForm(){document.getElementById('T').value = 30;
      document.getElementById('RH').value = 70;
      calcTool();}
calcTool();
</script>
