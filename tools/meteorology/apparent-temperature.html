<h1 class="sr-only">体感温度（Steadman）计算器</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>体感温度 AT</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由气温、相对湿度与风速，按 Steadman 公式估算人体体感温度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">AT = 体感温度（温湿风综合）</div>
      <p class="formula-desc">由气温、相对湿度与风速，按 Steadman 公式估算人体体感温度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">气温 T (°C)</label>
        <input type="number" id="T" value="30" step="0.5">
      </div>
      <div>
        <label for="RH">相对湿度 RH (%)</label>
        <input type="number" id="RH" value="70" step="1" min="0" max="100">
      </div>
      <div>
        <label for="ws">风速 ws (m/s)</label>
        <input type="number" id="ws" value="2" step="0.5" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>湿度高、风速低时体感更热；风速大时体感更冷。</li>
        <li>简化式忽略太阳辐射项，作近似参考。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), RH=num('RH'), ws=num('ws');
            const e = (RH/100)*6.105*Math.exp(17.27*T/(237.7+T)); // hPa
            const AT = T + 0.33*e - 0.70*ws - 4.0;
            ToolBox.setResult('result', dataGrid([ [AT.toFixed(1)+' °C', '体感温度 AT（Steadman 简化）'] ]));
        }
function resetForm(){document.getElementById('T').value = 30;
      document.getElementById('RH').value = 70;
      document.getElementById('ws').value = 2;
      calcTool();}
calcTool();
</script>
