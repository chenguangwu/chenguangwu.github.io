<div class="container">
  <div class="card">
    <h2>露点（Magnus 公式）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由气温与相对湿度，按 Magnus 公式反算露点温度 Td。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">露点 Td = Magnus 公式反解</div>
      <p class="formula-desc">由气温与相对湿度，按 Magnus 公式反算露点温度 Td。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">气温 T (°C)</label>
        <input type="number" id="T" value="25" step="0.5">
      </div>
      <div>
        <label for="RH">相对湿度 RH (%)</label>
        <input type="number" id="RH" value="60" step="1" min="0" max="100">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Magnus 经验式，适用 0–50℃ 精度良好。</li>
        <li>露点越高，空气越潮湿。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), RH=num('RH');
            const a=17.625, b=243.04;
            const g = Math.log(Math.max(RH,1)/100) + a*T/(b+T);
            const Td = b*g/(a-g);
            ToolBox.setResult('result', dataGrid([ [Td.toFixed(2)+' °C', '露点温度 Td'] ]));
        }
function resetForm(){document.getElementById('T').value = 25;
      document.getElementById('RH').value = 60;
      calcTool();}
calcTool();
</script>
