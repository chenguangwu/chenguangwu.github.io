<div class="container">
  <div class="card">
    <h2>风向方位</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由风向角度（°）映射到 16 方位罗盘名称（如 N、NE、SSW）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">风向方位 = 角度 → 16 方位</div>
      <p class="formula-desc">由风向角度（°）映射到 16 方位罗盘名称（如 N、NE、SSW）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="deg">风向角（°） (°)</label>
        <input type="number" id="deg" value="225" step="1" min="0" max="360">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>气象风向指风的来向：225° 表示西南风（从西南吹来）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const deg=((num('deg')%360)+360)%360;
            const names=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
            const idx = Math.round(deg/22.5)%16;
            ToolBox.setResult('result', dataGrid([ [names[idx], '16 方位（'+deg.toFixed(0)+'°）'] ]));
        }
function resetForm(){document.getElementById('deg').value = 225;
      calcTool();}
calcTool();
</script>
