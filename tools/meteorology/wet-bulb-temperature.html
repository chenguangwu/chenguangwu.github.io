<div class="container">
  <div class="card">
    <h2 data-zh="湿球温度 T_w">Wet Bulb Temperature</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由气温与相对湿度，按 Stull(2011) 经验多项式估算湿球温度，适用 5–95%RH、-20–50℃。">Wet Bulb Temperature is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">湿球温度 T_w（迭代近似）</div>
      <p class="formula-desc">由气温与相对湿度，按 Stull(2011) 经验多项式估算湿球温度，适用 5–95%RH、-20–50℃。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">气温 T (°C)</label>
        <input type="number" id="T" value="25" step="0.5">
      </div>
      <div>
        <label for="RH">相对湿度 RH (%)</label>
        <input type="number" id="RH" value="60" step="1" min="0" max="100">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Stull 2011 单方程近似，免迭代，工程与气象科普常用。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), RH=num('RH');
            const Tw = T*Math.atan(0.151977*Math.sqrt(RH+8.313659))
                     + Math.atan(T+RH) - Math.atan(RH-1.676331)
                     + 0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH) - 4.686035;
            ToolBox.setResult('result', dataGrid([ [Tw.toFixed(2)+' °C', '湿球温度 T_w（Stull）'] ]));
        }
function resetForm(){document.getElementById('T').value = 25;
      document.getElementById('RH').value = 60;
      calcTool();}
calcTool();
</script>
