<div class="container">
  <div class="card">
    <h2 data-zh="👃 鼻炎症状评分（TNSS）">👃 Rhinitis Symptom Score (TNSS)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="总鼻部症状评分（Total Nasal Symptom Score）用于量化过敏性鼻炎或慢性鼻炎症状严重程度。">Total Nasal Symptom Score (TNSS) for rhinitis.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：鼻炎症状评分 - （TNSS） - 总鼻部症状评分（Total。</p>
</div>


    <div class="symptom-grid">
      <div class="symptom-item">
        <label for="rhinorrhea">流涕</label>
        <select id="rhinorrhea" onchange="calc()">
          <option value="0">0 无症状</option>
          <option value="1">1 轻微</option>
          <option value="2">2 中度</option>
          <option value="3">3 重度</option>
        </select>
      </div>
      <div class="symptom-item">
        <label for="sneeze">喷嚏</label>
        <select id="sneeze" onchange="calc()">
          <option value="0">0 无症状</option>
          <option value="1">1 轻微</option>
          <option value="2">2 中度</option>
          <option value="3">3 重度</option>
        </select>
      </div>
      <div class="symptom-item">
        <label for="itch">鼻痒</label>
        <select id="itch" onchange="calc()">
          <option value="0">0 无症状</option>
          <option value="1">1 轻微</option>
          <option value="2">2 中度</option>
          <option value="3">3 重度</option>
        </select>
      </div>
      <div class="symptom-item">
        <label for="congestion">鼻塞</label>
        <select id="congestion" onchange="calc()">
          <option value="0">0 无症状</option>
          <option value="1">1 轻微</option>
          <option value="2">2 中度</option>
          <option value="3">3 重度</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算评分</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_tnss';
const ids = ['rhinorrhea','sneeze','itch','congestion'];

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el && s[id] != null) el.value = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {};
    ids.forEach(id => { s[id] = document.getElementById(id).value; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function classify(score){
  if(score <= 3) return {level:'轻度', cls:'grade-excellent'};
  if(score <= 6) return {level:'中度', cls:'grade-pass'};
  if(score <= 9) return {level:'重度', cls:'grade-pass'};
  return {level:'极重度', cls:'grade-fail'};
}

function calc(){
  let score = 0;
  ids.forEach(id => {
    const v = parseInt(document.getElementById(id).value, 10);
    score += isNaN(v) ? 0 : v;
  });
  const c = classify(score);
  saveState();
  document.getElementById('result').innerHTML = `
    <p>TNSS 总分：<strong style="font-size:20px;">${score}</strong> 分（0-12 分）</p>
    <p>症状程度：<span class="grade-tag ${c.cls}">${c.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${score >= 7 ? '建议耳鼻喉科就诊，评估药物治疗方案。' : '症状相对可控，可继续观察并避免过敏原。'}</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：TNSS 为症状自评工具，诊断与治疗需结合专科检查。
    </div>
  `;
}

function resetForm(){
  ids.forEach(id => document.getElementById(id).value = '0');
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
