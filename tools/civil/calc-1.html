<div class="container">
  <div class="card">
    <h2>🏗️ 混凝土配合比计算（土木）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">c = m w  / (W/C)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按《普通混凝土配合比设计规程》JGJ 55 思路，根据设计强度、水灰比、用水量及砂率计算初步配合比。</p>

    <div class="input-row">
      <div>
        <label for="fcuk">设计强度 f<sub>cu,k</sub>（MPa）</label>
        <input type="number" id="fcuk" value="30" step="1" min="1">
      </div>
      <div>
        <label for="sigma">标准差 σ（MPa）</label>
        <input type="number" id="sigma" value="5.0" step="0.1" min="0">
      </div>
      <div>
        <label for="wc">水灰比 W/C</label>
        <input type="number" id="wc" value="0.50" step="0.01" min="0.2" max="0.9">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="mw">单位用水量 m<sub>w</sub>（kg/m³）</label>
        <input type="number" id="mw" value="190" step="1" min="50">
      </div>
      <div>
        <label for="beta">砂率 β<sub>s</sub>（%）</label>
        <input type="number" id="beta" value="38" step="0.1" min="10" max="60">
      </div>
      <div>
        <label for="rhoC">水泥密度 ρ<sub>c</sub>（kg/m³）</label>
        <input type="number" id="rhoC" value="3100" step="10" min="1000">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="rhoS">砂表观密度 ρ<sub>s</sub>（kg/m³）</label>
        <input type="number" id="rhoS" value="2650" step="10" min="1000">
      </div>
      <div>
        <label for="rhoG">石表观密度 ρ<sub>g</sub>（kg/m³）</label>
        <input type="number" id="rhoG" value="2700" step="10" min="1000">
      </div>
      <div>
        <label for="air">含气量 α（%）</label>
        <input type="number" id="air" value="1.0" step="0.1" min="0" max="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcMix()">计算配合比</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>配制强度：f<sub>cu,0</sub> = f<sub>cu,k</sub> + 1.645σ</li>
        <li>水泥用量：m<sub>c</sub> = m<sub>w</sub> / (W/C)</li>
        <li>采用绝对体积法计算砂、石用量</li>
        <li>配合比为初步理论配合比，实际施工应以试配调整为准</li>
      </ul>
    </div>
  </div>
</div>

<script>
function calcMix() {
  const fcuk = parseFloat(document.getElementById('fcuk').value) || 0;
  const sigma = parseFloat(document.getElementById('sigma').value) || 0;
  const wc = parseFloat(document.getElementById('wc').value) || 0;
  const mw = parseFloat(document.getElementById('mw').value) || 0;
  const beta = parseFloat(document.getElementById('beta').value) || 0;
  const rhoC = parseFloat(document.getElementById('rhoC').value) || 0;
  const rhoS = parseFloat(document.getElementById('rhoS').value) || 0;
  const rhoG = parseFloat(document.getElementById('rhoG').value) || 0;
  const air = parseFloat(document.getElementById('air').value) || 0;

  if (fcuk <= 0 || wc <= 0 || mw <= 0 || rhoC <= 0 || rhoS <= 0 || rhoG <= 0) {
    ToolBox.setResult('result', '<p class="tip-error">请输入有效的材料参数。</p>');
    return;
  }

  const fcu0 = fcuk + 1.645 * sigma;
  const mc = mw / wc;
  const betaFrac = beta / 100;
  const airFrac = air / 100;

  // 绝对体积法：V_total = 1000 L
  // mc/rhoC + mw/1000 + ms/rhoS + mg/rhoG + air = 1000
  // ms/(ms+mg) = betaFrac
  const V_left = 1000 * (1 - airFrac) - mc / rhoC * 1000 - mw;
  // V_left = ms/rhoS*1000 + mg/rhoG*1000
  // ms = betaFrac/(1-betaFrac) * mg
  // solve for mg
  const mg = V_left / (betaFrac / (1 - betaFrac) / rhoS * 1000 + 1 / rhoG * 1000);
  const ms = betaFrac / (1 - betaFrac) * mg;

  const totalMass = mc + mw + ms + mg;
  const ratioC = mc / mc;
  const ratioS = ms / mc;
  const ratioG = mg / mc;
  const ratioW = mw / mc;

  const html = `
    <div class="data-grid">
      <div class="data-card"><div class="num">${fcu0.toFixed(1)}</div><div class="label">配制强度（MPa）</div></div>
      <div class="data-card"><div class="num">${mc.toFixed(1)}</div><div class="label">水泥 m<sub>c</sub>（kg/m³）</div></div>
      <div class="data-card"><div class="num">${mw.toFixed(1)}</div><div class="label">水 m<sub>w</sub>（kg/m³）</div></div>
      <div class="data-card"><div class="num">${ms.toFixed(1)}</div><div class="label">砂 m<sub>s</sub>（kg/m³）</div></div>
      <div class="data-card"><div class="num">${mg.toFixed(1)}</div><div class="label">石 m<sub>g</sub>（kg/m³）</div></div>
      <div class="data-card"><div class="num">${totalMass.toFixed(1)}</div><div class="label">总质量（kg/m³）</div></div>
    </div>
    <p style="margin-top:12px;font-size:14px;">
      质量配合比（水泥:砂:石:水）=<strong>1 : ${ratioS.toFixed(2)} : ${ratioG.toFixed(2)} : ${ratioW.toFixed(2)}</strong>
    </p>
  `;
  ToolBox.setResult('result', html);
}

function resetForm() {
  document.getElementById('fcuk').value = 30;
  document.getElementById('sigma').value = 5.0;
  document.getElementById('wc').value = 0.50;
  document.getElementById('mw').value = 190;
  document.getElementById('beta').value = 38;
  document.getElementById('rhoC').value = 3100;
  document.getElementById('rhoS').value = 2650;
  document.getElementById('rhoG').value = 2700;
  document.getElementById('air').value = 1.0;
  calcMix();
}

calcMix();
</script>
