<div class="container">
  <div class="card">
    <h2>🏗️ 围岩分级评分 RMR 计算（土木）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按 Bieniawski 岩体质量评分法（RMR）计算围岩分级总分。</p>

    <div class="input-row">
      <div>
        <label for="s1">岩石强度评分 (0-15)</label>
        <input type="number" id="s1" value="12" step="1" min="0" max="15">
      </div>
      <div>
        <label for="s2">RQD 评分 (0-20)</label>
        <input type="number" id="s2" value="13" step="1" min="0" max="20">
      </div>
      <div>
        <label for="s3">节理间距评分 (0-20)</label>
        <input type="number" id="s3" value="10" step="1" min="0" max="20">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="s4">节理条件评分 (0-25)</label>
        <input type="number" id="s4" value="20" step="1" min="0" max="25">
      </div>
      <div>
        <label for="s5">地下水评分 (0-15)</label>
        <input type="number" id="s5" value="10" step="1" min="0" max="15">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>RMR = 5 项评分之和（满分 100）</li>
        <li>评分项：岩石强度(15)+RQD(20)+节理间距(20)+节理条件(25)+地下水(15)</li>
        <li>RMR≥81 为 I 级，逐级递减</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const s1=num('s1'),s2=num('s2'),s3=num('s3'),s4=num('s4'),s5=num('s5');
            const RMR=s1+s2+s3+s4+s5;
            let grade = RMR>=81?'I 级（极好）':RMR>=61?'II 级（好）':RMR>=41?'III 级（中等）':RMR>=21?'IV 级（差）':'V 级（极差）';
            ToolBox.setResult('result', dataGrid([
                [RMR.toFixed(0),'RMR 总分'],
                [grade,'围岩级别']
            ]));
        }
function resetForm(){document.getElementById('s1').value = '12';
      document.getElementById('s2').value = '13';
      document.getElementById('s3').value = '10';
      document.getElementById('s4').value = '20';
      document.getElementById('s5').value = '10';
      calcTool();}
calcTool();
</script>
