<div class="container">
  <div class="card">
    <h2>🏗️ 荷载基本组合计算（土木）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按承载能力极限状态基本组合计算组合效应设计值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">S = γ_G·S_Gk + γ_Q·S_Qk</div>
      <p class="formula-desc">按承载能力极限状态基本组合计算组合效应设计值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Sg">永久荷载效应 S_Gk</label>
        <input type="number" id="Sg" value="50" step="1" min="0">
      </div>
      <div>
        <label for="Sq">可变荷载效应 S_Qk</label>
        <input type="number" id="Sq" value="30" step="1" min="0">
      </div>
      <div>
        <label for="gG">永久荷载分项系数 γ_G</label>
        <input type="number" id="gG" value="1.3" step="0.05" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="gQ">可变荷载分项系数 γ_Q</label>
        <input type="number" id="gQ" value="1.5" step="0.05" min="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>S = γ_G·S_Gk + γ_Q·S_Qk（基本组合）</li>
        <li>γ_G 通常 1.2~1.3，γ_Q 通常 1.4~1.5</li>
        <li>有多个可变荷载时取效应最大的为主导</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Sg=num('Sg'), Sq=num('Sq'), gG=num('gG'), gQ=num('gQ');
            const S=gG*Sg+gQ*Sq;
            ToolBox.setResult('result', dataGrid([
                [(gG*Sg).toFixed(1),'γ_G·S_Gk'],
                [(gQ*Sq).toFixed(1),'γ_Q·S_Qk'],
                [S.toFixed(1),'组合效应 S (kN·m)']
            ]));
        }
function resetForm(){document.getElementById('Sg').value = '50';
      document.getElementById('Sq').value = '30';
      document.getElementById('gG').value = '1.3';
      document.getElementById('gQ').value = '1.5';
      calcTool();}
calcTool();
</script>
