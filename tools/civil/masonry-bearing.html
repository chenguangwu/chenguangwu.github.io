<div class="container">
  <div class="card">
    <h2>🏗️ 砌体墙抗压承载力计算（土木）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">N = φ·f·A</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按砌体抗压强度与截面面积估算轴心受压承载力（含高厚比稳定系数）。</p>

    <div class="input-row">
      <div>
        <label for="f">砌体抗压强度 f (MPa)</label>
        <input type="number" id="f" value="2.5" step="0.1" min="0.5">
      </div>
      <div>
        <label for="b">墙厚 b (mm)</label>
        <input type="number" id="b" value="240" step="10" min="50">
      </div>
      <div>
        <label for="L">墙长 L (mm)</label>
        <input type="number" id="L" value="3000" step="50" min="100">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="phi">稳定系数 φ</label>
        <input type="number" id="phi" value="1.0" step="0.05" min="0.1" max="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>N = φ·f·A（f 单位 N/mm²，A 单位 mm² → N）</li>
        <li>稳定系数 φ 由高厚比查表确定</li>
        <li>开洞墙应按净面积计算</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f=num('f'), b=num('b'), L=num('L'), phi=num('phi');
            if(f<=0||b<=0||L<=0||phi<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效参数。</p>');return;}
            const A=b*L;            // mm²
            const N=phi*f*A/1000;   // kN (f MPa=N/mm²)
            ToolBox.setResult('result', dataGrid([
                [(A/1e6).toFixed(3),'截面面积 A (m²)'],
                [N.toFixed(0),'承载力 N (kN)'],
                [(f*A/1000).toFixed(0),'材料抗力 (kN, φ=1)']
            ]));
        }
function resetForm(){document.getElementById('f').value = '2.5';
      document.getElementById('b').value = '240';
      document.getElementById('L').value = '3000';
      document.getElementById('phi').value = '1.0';
      calcTool();}
calcTool();
</script>
