<div class="container">
  <div class="card">
    <h2>🏗️ 混凝土碳化深度估算（土木）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按平方扩散规律估算给定使用年限下的混凝土碳化深度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">x = 2.56·K·√t（K 为碳化速度系数） K 受混凝土强度、养护、环境湿度影响 碳化达到保护层厚度时钢筋开始锈蚀</div>
      <p class="formula-desc">按平方扩散规律估算给定使用年限下的混凝土碳化深度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="K">碳化系数 K (mm/√a)</label>
        <input type="number" id="K" value="2.0" step="0.1" min="0.5">
      </div>
      <div>
        <label for="t">使用年限 t (年)</label>
        <input type="number" id="t" value="30" step="1" min="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>常用模型：x = 2.56·K·√t（K 为碳化速度系数）</li>
        <li>K 受混凝土强度、养护、环境湿度影响</li>
        <li>碳化达到保护层厚度时钢筋开始锈蚀</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const K=num('K'), t=num('t');
            if(K<=0||t<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效参数。</p>');return;}
            const x=2.56*K*Math.sqrt(t);
            ToolBox.setResult('result', dataGrid([
                [x.toFixed(1),'碳化深度 x (mm)'],
                [(x/10).toFixed(2),'碳化深度 (cm)']
            ]));
        }
function resetForm(){document.getElementById('K').value = '2.0';
      document.getElementById('t').value = '30';
      calcTool();}
calcTool();
</script>
