<body>
<h1 class="sr-only">PSQI 睡眠自评</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 睡眠质量自评</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">PSQI 睡眠自评</span>
</nav>
<div class="container">
  <div class="card">
    <h2>🛌 睡眠质量自评（PSQI）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">19 项评分（0~3），得分越高表示睡眠质量越差，0~21 量表。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：PSQI 睡眠自评。</p>
</div>


    <input id="n" type="number" min="1" max="30" value="7" oninput="initGrid()" placeholder="最近 N 天">
    <div id="rows" style="margin-top:10px;"></div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算 PSQI</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
function initGrid() {
  const n = Math.min(30, Math.max(1, Number(document.getElementById('n').value) || 7));
  const rows = document.getElementById('rows');
  rows.innerHTML = '';

  for (let i = 1; i <= n; i++) {
    const row = document.createElement('div');
    row.className = 'input-row';
    row.style.display = 'grid';
    row.style.gridTemplateColumns = '1.1fr repeat(4, 1fr)';
    row.style.gap = '8px';
    row.style.marginBottom = '10px';
    row.innerHTML =
      '<div><label>日 ' + i + ' 评分（0~3）</label><select data-item>' +
        '<option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>' +
      '</select></div>' +
      '<div><label></label></div><div><label></label></div><div><label></label></div><div><label></label></div>';
    rows.appendChild(row);
  }
}

function scoreRaw() {
  const sels = document.querySelectorAll('[data-item]');
  let s = 0;
  sels.forEach(el => { s += Number(el.value || 0); });
  return s;
}

function calc() {
  const n = Math.min(30, Math.max(1, Number(document.getElementById('n').value) || 7));
  const avg = scoreRaw() / n;
  let total;
  if (avg <= 0.75) total = 3;
  else if (avg <= 1.5) total = 8;
  else if (avg <= 2) total = 13;
  else total = 18;

  const level = total <= 5 ? '睡眠质量较好' : total <= 10 ? '轻中度问题' : '睡眠问题明显';
  document.getElementById('result').innerHTML =
    '<p>平均项分：<strong>' + avg.toFixed(2) + '</strong></p>' +
    '<p>PSQI 近似总分：<strong style="font-size:22px;color:' + (total <= 5 ? 'var(--success)' : total <= 10 ? 'var(--warning, #f59e0b)' : 'var(--danger)') + '">' + total + '</strong> / 21</p>' +
    '<p>结果：<strong>' + level + '</strong></p>' +
    '<p>提示：高于 5 分通常提示睡眠存在问题，建议配合睡眠卫生干预。</p>';
}

function copyResult() {
  ToolBox.copyText(document.getElementById('result').innerText, i18nText('toast.msg544'));
}

initGrid();
</script>
