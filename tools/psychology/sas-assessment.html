<h1 class="sr-only">SAS 焦虑自评</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="😟 SAS 焦虑自评">😟 SAS Anxiety Self-Assessment</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="20 项评分量表，含 1~4 分。仅作自测与提示，不构成医疗诊断。">Calculate SAS anxiety index from the selected questionnaire answers.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：SAS 焦虑自评。</p>
</div>


    <div id="rows"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calcSas()">提交</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
function rowTemplate(i) {
  return '<div class="input-row" style="display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:8px;margin-bottom:10px;">' +
    '<div><label>题目' + (i + 1) + '</label></div>' +
    '<div><label>1 从无</label><input type="radio" name="s' + i + '" value="1" checked></div>' +
    '<div><label>2 偶有</label><input type="radio" name="s' + i + '" value="2"></div>' +
    '<div><label>3 有时</label><input type="radio" name="s' + i + '" value="3"></div>' +
    '<div><label>4 频繁</label><input type="radio" name="s' + i + '" value="4"></div>' +
    '</div>';
}

function render() {
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  for (let i = 0; i < 20; i++) rows.insertAdjacentHTML('beforeend', rowTemplate(i));
}

function calcSas() {
  let raw = 0;
  for (let i = 0; i < 20; i++) {
    const sel = document.querySelector('input[name="s' + i + '"]:checked');
    raw += Number(sel ? sel.value : 1);
  }
  const index = Math.round(raw * 1.25); // 简化标准分

  let level = '轻度';
  let color = 'var(--success)';
  if (index >= 70) { level = '重度'; color = 'var(--danger)'; }
  else if (index >= 60) { level = '中度'; color = 'var(--warning, #f59e0b)'; }
  else if (index >= 50) { level = '轻中度'; color = 'var(--primary)'; }

  document.getElementById('result').innerHTML =
    '<p>原始分：<strong>' + raw + '</strong></p>' +
    '<p>标准分：<strong style="color:' + color + ';font-size:22px;">' + index + '</strong></p>' +
    '<p>分级：<strong>' + level + '</strong></p>' +
    '<p>说明：如持续焦虑影响睡眠、学习与工作，建议就医咨询。</p>';
}

function copyResult() {
  ToolBox.copyText(document.getElementById('result').innerText, i18nText('toast.msg544'));
}

render();
</script>
