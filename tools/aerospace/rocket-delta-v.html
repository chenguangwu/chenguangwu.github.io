<div class="container">
  <div class="card">
    <h2 data-zh="由比冲等效速度与质量比求 Δv">Rocket Delta V</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入有效排气速度 v_e、初始质量 m₀ 与末质量 m_f，求速度增量。">Rocket Delta V is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Δv = v_e·ln(m₀ / m_f)</div>
      <p class="formula-desc">输入有效排气速度 v_e、初始质量 m₀ 与末质量 m_f，求速度增量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ve">排气速度 v_e (米/秒)</label>
        <input type="number" id="ve" value="2500" step="100">
      </div>
      <div>
        <label for="m0">初始质量 m₀ (吨)</label>
        <input type="number" id="m0" value="100" step="5">
      </div>
      <div>
        <label for="mf">末质量 m_f (吨)</label>
        <input type="number" id="mf" value="50" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>齐奥尔科夫斯基火箭方程。</li>
        <li>2500×ln2 → 1733 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ve=num('ve'),m0=num('m0'),mf=num('mf');
            const dv=ve*Math.log(m0/mf);
            ToolBox.setResult('result', dataGrid([
                [dv.toFixed(1),'速度增量 Δv (m/s)']
            ]));
        }
function resetForm(){document.getElementById('ve').value = '2500';
      document.getElementById('m0').value = '100';
      document.getElementById('mf').value = '50';
      calcTool();}
calcTool();
</script>
