<div class="container">
  <div class="card">
    <h2>由引力常数与轨道半径求速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入引力参数 μ 与轨道半径 r，求圆轨道速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = √(μ/r)</div>
      <p class="formula-desc">输入引力参数 μ 与轨道半径 r，求圆轨道速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="mu">引力参数 μ (m³/s²)</label>
        <input type="number" id="mu" value="3.986e14" step="1e13">
      </div>
      <div>
        <label for="r">轨道半径 r (米)</label>
        <input type="number" id="r" value="6.771e6" step="1e5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>近地轨道约 7.7 km/s。</li>
        <li>√(3.986e14/6.771e6) → 7675 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const mu=num('mu'),r=num('r');
            const v=Math.sqrt(mu/r);
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(1),'轨道速度 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('mu').value = '3.986e14';
      document.getElementById('r').value = '6.771e6';
      calcTool();}
calcTool();
</script>
