<body>

<h1 class="sr-only">机翼升力</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 升力计算</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">升力计算</span>
</nav>
<div class="container">
  <div class="card">
    <h2>机翼升力</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">L = ½ρV²S·C_L</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">L = ½·ρ·V²·S·C_L。</p>

    <div class="input-row">
      <div>
        <label for="rho">空气密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1.225" step="0.01">
      </div>
      <div>
        <label for="v">空速 V (m/s)</label>
        <input type="number" id="v" value="80" step="5">
      </div>
      <div>
        <label for="s">机翼面积 S (m²)</label>
        <input type="number" id="s" value="16" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="cl">升力系数 C_L</label>
        <input type="number" id="cl" value="1.2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>低速近似不可压。</li>
        <li>C_L 随迎角变化。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho=num('rho'),v=num('v'),S=num('s'),cl=num('cl');
            const L=0.5*rho*v*v*S*cl;
            ToolBox.setResult('result', dataGrid([
                [(L/1000).toFixed(2),'升力 L (kN)'],
                [(L/9.81).toFixed(1),'升力 (kgf)']
            ]));
        }
function resetForm(){document.getElementById('rho').value = '1.225';
      document.getElementById('v').value = '80';
      document.getElementById('s').value = '16';
      document.getElementById('cl').value = '1.2';
      calcTool();}
calcTool();
</script>
