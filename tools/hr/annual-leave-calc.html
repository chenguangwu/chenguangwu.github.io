<div class="container">
  <div class="card">
    <h2 data-zh="🗓️ 年假计算器">🗓️ Annual Leave Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按工龄和全年劳动年限计算年度年休假天数（参考标准）。">Calculate annual leave entitlement based on year and leave policy.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：年假计算器。</p>
</div>


    <div class="input-row">
      <label>本年度连续工龄（年）</label>
      <input type="number" id="tenure" value="1" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>本年度工作月数（默认12）</label>
      <input type="number" id="months" value="12" min="0" max="12" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算年假</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function standardAnnualLeave(years) {
  if (years < 1) return 0;
  if (years <= 10) return 5;
  if (years <= 20) return 10;
  return 15;
}

function calc() {
  const tenure = Math.max(0, parseFloat(document.getElementById('tenure').value) || 0);
  const months = Math.min(12, Math.max(0, parseInt(document.getElementById('months').value) || 0));
  const total = standardAnnualLeave(tenure) * (months / 12);
  const formula = tenure <= 1 ? '工龄低于1年默认0天' : '1-10年：5天；10-20年：10天；20年以上：15天';

  document.getElementById('result').innerHTML =
    `<p>参考年假天数：<strong>${total.toFixed(1)} 天</strong></p>` +
    `<p>年休规则：${formula}</p>` +
    `<p>说明：结果按你当前月份比例折算（${months} / 12）</p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg291'));
}

calc();
</script>
