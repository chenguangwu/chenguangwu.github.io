<div class="container">
  <div class="card">
    <h2>🧾 个税反推器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入到手工资，估算税前工资与应税扣除。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：个税反推器。</p>
</div>


    <div class="input-row">
      <label>税后工资（元）</label>
      <input type="number" id="afterTax" value="8000" min="0" step="0.01" oninput="calc()">
    </div>
    <div class="input-row">
      <label>社会保险/公积金比例（如0.225）</label>
      <input type="number" id="rate" value="0.225" min="0" max="0.5" step="0.001" oninput="calc()">
    </div>
    <div class="input-row">
      <label>起征点（默认5000）</label>
      <input type="number" id="threshold" value="5000" min="0" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">反推出税前</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const brackets = [
  [3000, 0.03, 0],
  [12000, 0.10, 210],
  [25000, 0.20, 1410],
  [35000, 0.25, 2660],
  [55000, 0.30, 4410],
  [80000, 0.35, 7160],
  [Infinity, 0.45, 15160]
];

function taxByTaxable(taxable) {
  for (const [top, rate, quick] of brackets) {
    if (taxable <= top) return taxable * rate - quick;
  }
  return 0;
}

function afterTaxToGross(afterTax, rate, threshold) {
  let low = afterTax;
  let high = Math.max(afterTax * 2 + 10000, 100000);
  for (let i = 0; i < 100; i++) {
    const mid = (low + high) / 2;
    const taxable = Math.max(0, mid * (1 - rate) - threshold);
    const tax = taxByTaxable(taxable);
    const net = mid * (1 - rate) - tax;
    if (net < afterTax) {
      low = mid;
    } else {
      high = mid;
    }
  }
  return (low + high) / 2;
}

function calc() {
  const afterTax = parseFloat(document.getElementById('afterTax').value) || 0;
  const rate = parseFloat(document.getElementById('rate').value) || 0;
  const threshold = parseFloat(document.getElementById('threshold').value) || 5000;

  if (afterTax <= 0) {
    document.getElementById('result').innerHTML = '<p>请输入有效税后工资</p>';
    return;
  }

  const gross = afterTaxToGross(afterTax, rate, threshold);
  const social = gross * rate;
  const taxable = Math.max(0, gross - social - threshold);
  const tax = taxByTaxable(taxable);

  document.getElementById('result').innerHTML =
    `<p>预估税前工资：<strong>${gross.toFixed(2)} 元</strong></p>` +
    `<p>社保公积金：<strong>${social.toFixed(2)} 元</strong></p>` +
    `<p>计税工资：<strong>${taxable.toFixed(2)} 元</strong></p>` +
    `<p>预估个税：<strong style="color:var(--danger)">${tax.toFixed(2)} 元</strong></p>` +
    `<p>说明：反算采用当前税率档位的近似值，仅供谈薪参考。</p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg275'));
}

calc();
</script>
