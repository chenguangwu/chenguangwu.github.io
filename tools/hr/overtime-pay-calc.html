<div class="container">
  <div class="card">
    <h2 data-zh="🕒 加班费计算器">🕒 Overtime Pay Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按法定倍数估算加班工资，默认按日工作小时工资。">Compute overtime compensation based on base salary and working hours.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：加班费计算器。</p>
</div>


    <div class="input-row">
      <label>基本时薪（元）</label>
      <input type="number" id="hourly" value="25" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>工作日加班小时（1.5倍）</label>
      <input type="number" id="weekday" value="0" min="0" step="0.5" oninput="calc()">
    </div>
    <div class="input-row">
      <label>休息日加班小时（2倍）</label>
      <input type="number" id="weekend" value="0" min="0" step="0.5" oninput="calc()">
    </div>
    <div class="input-row">
      <label>法定节假日加班小时（3倍）</label>
      <input type="number" id="holiday" value="0" min="0" step="0.5" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算加班费</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const hourly = parseFloat(document.getElementById('hourly').value) || 0;
  const weekday = parseFloat(document.getElementById('weekday').value) || 0;
  const weekend = parseFloat(document.getElementById('weekend').value) || 0;
  const holiday = parseFloat(document.getElementById('holiday').value) || 0;

  const payWeekday = hourly * 1.5 * weekday;
  const payWeekend = hourly * 2.0 * weekend;
  const payHoliday = hourly * 3.0 * holiday;
  const total = payWeekday + payWeekend + payHoliday;

  document.getElementById('result').innerHTML =
    `<p>工作日加班费：<strong>${payWeekday.toFixed(2)} 元</strong></p>` +
    `<p>休息日加班费：<strong>${payWeekend.toFixed(2)} 元</strong></p>` +
    `<p>法定节假日加班费：<strong>${payHoliday.toFixed(2)} 元</strong></p>` +
    `<p>总加班费：<strong style="color:var(--primary)">${total.toFixed(2)} 元</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg272'));
}

calc();
</script>
