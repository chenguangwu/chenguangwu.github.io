<body>
<h1 class="sr-only">碳水化合物/蛋白质/脂肪比例</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="⚖️ 碳水化合物/蛋白质/脂肪比例">⚖️ Macronutrient Ratio Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入每日目标热量与三大营养素比例，自动计算各自克数与热量。">Compute grams and calories of carbs, protein and fat from target ratio.</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="applyPreset('balanced')" id="tab-balanced">均衡饮食</button>
      <button class="tab-btn" onclick="applyPreset('lowcarb')" id="tab-lowcarb">低碳水</button>
      <button class="tab-btn" onclick="applyPreset('highcarb')" id="tab-highcarb">高碳水</button>
      <button class="tab-btn" onclick="applyPreset('keto')" id="tab-keto">生酮饮食</button>
    </div>

    <div class="input-row">
      <div>
        <label>每日目标热量（kcal）</label>
        <input type="number" id="calories" value="2000" min="0">
      </div>
      <div>
        <label>碳水化合物（%）</label>
        <input type="number" id="carbPct" value="50" min="0" max="100">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>蛋白质（%）</label>
        <input type="number" id="proteinPct" value="20" min="0" max="100">
      </div>
      <div>
        <label>脂肪（%）</label>
        <input type="number" id="fatPct" value="30" min="0" max="100">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">计算比例</button>
      <button class="btn" onclick="saveInputs()">保存</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>输入热量与比例后点击计算。</p>
    </div>

    <div class="tip-box tip-info">
      常见参考：均衡饮食 50/20/30、低碳水 20/30/50、高碳水 60/20/20、生酮饮食 5/25/70（碳水/蛋白质/脂肪）。
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_nutrition_calc3';
const PRESETS = {
  balanced: { carb: 50, protein: 20, fat: 30 },
  lowcarb: { carb: 20, protein: 30, fat: 50 },
  highcarb: { carb: 60, protein: 20, fat: 20 },
  keto: { carb: 5, protein: 25, fat: 70 }
};

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.calories) document.getElementById('calories').value = data.calories;
    if (data.carbPct != null) document.getElementById('carbPct').value = data.carbPct;
    if (data.proteinPct != null) document.getElementById('proteinPct').value = data.proteinPct;
    if (data.fatPct != null) document.getElementById('fatPct').value = data.fatPct;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      calories: document.getElementById('calories').value,
      carbPct: document.getElementById('carbPct').value,
      proteinPct: document.getElementById('proteinPct').value,
      fatPct: document.getElementById('fatPct').value
    }));
    ToolBox.showToast(i18nText());
  } catch (e) {
    ToolBox.showToast(i18nText(), 'error');
  }
}

function applyPreset(name) {
  const p = PRESETS[name];
  document.getElementById('carbPct').value = p.carb;
  document.getElementById('proteinPct').value = p.protein;
  document.getElementById('fatPct').value = p.fat;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  calculate();
}

function calculate() {
  const calories = parseFloat(document.getElementById('calories').value) || 0;
  const carbPct = parseFloat(document.getElementById('carbPct').value) || 0;
  const proteinPct = parseFloat(document.getElementById('proteinPct').value) || 0;
  const fatPct = parseFloat(document.getElementById('fatPct').value) || 0;

  const sum = carbPct + proteinPct + fatPct;
  if (sum !== 100) {
    document.getElementById('result').innerHTML = `<p style="color:var(--danger);">三项比例之和必须等于 100%，当前为 ${sum}%。</p>`;
    return;
  }
  if (calories <= 0) {
    ToolBox.showToast(i18nText(), 'error');
    return;
  }

  const carbKcal = calories * carbPct / 100;
  const proteinKcal = calories * proteinPct / 100;
  const fatKcal = calories * fatPct / 100;

  const carbG = carbKcal / 4;
  const proteinG = proteinKcal / 4;
  const fatG = fatKcal / 9;

  document.getElementById('result').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${carbG.toFixed(1)}g</div><div class="lbl">碳水化合物</div></div>
      <div class="stat-card"><div class="val">${proteinG.toFixed(1)}g</div><div class="lbl">蛋白质</div></div>
      <div class="stat-card"><div class="val">${fatG.toFixed(1)}g</div><div class="lbl">脂肪</div></div>
    </div>
    <p>碳水化合物：${carbKcal.toFixed(0)} kcal · 蛋白质：${proteinKcal.toFixed(0)} kcal · 脂肪：${fatKcal.toFixed(0)} kcal</p>
    <div class="progress-bar"><div class="progress-fill" style="width:${carbPct}%"></div></div>
    <div class="bar-row">
      <span class="bar-lbl">碳水</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${carbPct}%">${carbPct}%</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">蛋白质</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${proteinPct}%">${proteinPct}%</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">脂肪</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${fatPct}%">${fatPct}%</div></div>
    </div>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('输入热量')) {
    ToolBox.showToast(i18nText(), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadInputs();
calculate();
</script>
</body>
