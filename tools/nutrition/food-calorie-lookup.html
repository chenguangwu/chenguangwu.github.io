<div class="container">
  <div class="card">
    <h2>🍚 常见食物热量速查</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">本地静态速查，支持中式常见食物 200g 基础克重参考。</p>

    <input id="kw" type="search" placeholder="输入食物名，如 鸡胸肉/米饭/牛奶" oninput="filterFood()">

    <div id="body" style="margin-top:12px;overflow:auto">
      <table class="table" id="table">
        <thead><tr><th>食物</th><th>每100g（千卡）</th><th>200g参考值（千卡）</th><th>分类</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const FOODS = [
  {name:'白米饭', v:116, c:'主食'},
  {name:'面条', v:138, c:'主食'},
  {name:'燕麦片', v:389, c:'主食'},
  {name:'荞麦面', v:338, c:'主食'},
  {name:'全麦面包', v:247, c:'主食'},
  {name:'鸡蛋', v:143, c:'蛋类'},
  {name:'鸡胸肉（去皮）', v:165, c:'蛋白质'},
  {name:'牛肉（瘦）', v:250, c:'蛋白质'},
  {name:'猪里脊', v:143, c:'蛋白质'},
  {name:'三文鱼', v:208, c:'蛋白质'},
  {name:'牛奶（脱脂）', v:34, c:'饮品'},
  {name:'牛奶（全脂）', v:61, c:'饮品'},
  {name:'豆浆（无糖）', v:33, c:'饮品'},
  {name:'豆腐', v:76, c:'蛋白质'},
  {name:'毛豆', v:122, c:'豆制品'},
  {name:'花生酱', v:588, c:'坚果'},
  {name:'坚果（混合）', v:586, c:'坚果'},
  {name:'苹果', v:52, c:'水果'},
  {name:'香蕉', v:89, c:'水果'},
  {name:'橙子', v:47, c:'水果'},
  {name:'西红柿', v:18, c:'蔬菜'},
  {name:'西兰花', v:34, c:'蔬菜'},
  {name:'胡萝卜', v:41, c:'蔬菜'},
  {name:'土豆', v:77, c:'蔬菜'},
  {name:'黄瓜', v:15, c:'蔬菜'},
  {name:'猪油', v:900, c:'脂肪'},
  {name:'黄油', v:717, c:'脂肪'},
  {name:'橄榄油', v:884, c:'脂肪'},
  {name:'花生', v:567, c:'零食'},
  {name:'巧克力', v:546, c:'零食'},
  {name:'可乐', v:42, c:'饮品'},
  {name:'白糖', v:387, c:'调味'},
  {name:'蜂蜜', v:304, c:'调味'},
  {name:'酱油', v:53, c:'调味'},
  {name:'酸奶（原味）', v:59, c:'奶制品'},
  {name:'酸奶（甜味）', v:97, c:'奶制品'},
  {name:'鸡肉火腿', v:145, c:'肉类'},
  {name:'培根', v:541, c:'肉类'},
  {name:'火鸡胸肉', v:135, c:'蛋白质'},
  {name:'鳕鱼', v:82, c:'蛋白质'},
  {name:'豆腐皮', v:130, c:'蛋白质'},
  {name:'青豆', v:81, c:'豆类'},
  {name:'黑米', v:336, c:'杂粮'},
  {name:'藜麦', v:368, c:'杂粮'},
  {name:'鹰嘴豆', v:164, c:'豆类'},
  {name:'扁豆', v:116, c:'豆类'},
  {name:'甜豆', v:42, c:'豆类'},
  {name:'玉米', v:86, c:'蔬菜'}
];

function render(items) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<tr><td colspan="4">未匹配到食物，请尝试关键词或更换表述。</td></tr>';
    return;
  }
  items.forEach(it => {
    const row = document.createElement('tr');
    row.innerHTML = '<td>' + it.name + '</td><td>' + it.v + '</td><td>' + (it.v * 2) + '</td><td>' + it.c + '</td>';
    list.appendChild(row);
  });
}

function filterFood() {
  const key = (document.getElementById('kw').value || '').trim().toLowerCase();
  if (!key) {
    render(FOODS);
    return;
  }
  render(FOODS.filter(item => item.name.toLowerCase().includes(key)));
}

render(FOODS);
</script>
