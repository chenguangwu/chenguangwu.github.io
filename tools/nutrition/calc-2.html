<body>
<h1 class="sr-only">食物热量计算器</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 食物热量计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="🍎 食物热量计算器">🍎 Food Calorie Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="通过常见食物数据库或手动输入宏量营养素，快速计算一餐热量。">Compute calories of a meal from common foods or macros.</p>

    <h3>方式一：选择常见食物</h3>
    <div class="input-row">
      <div>
        <label>食物</label>
        <select id="foodSelect">
          <option value="0|0|0">-- 请选择 --</option>
          <option value="116|2.6|0.3">米饭（100g）</option>
          <option value="265|9|3.2">全麦面包（100g）</option>
          <option value="155|13|11">鸡蛋（100g）</option>
          <option value="165|31|3.6">鸡胸肉（100g）</option>
          <option value="250|26|15">牛肉（100g）</option>
          <option value="206|22|12">猪肉（100g）</option>
          <option value="208|20|13">三文鱼（100g）</option>
          <option value="76|8|4.8">豆腐（100g）</option>
          <option value="52|0.3|0.2">苹果（100g）</option>
          <option value="89|1.1|0.3">香蕉（100g）</option>
          <option value="42|3.4|0.4">西兰花（100g）</option>
          <option value="41|0.9|0.2">胡萝卜（100g）</option>
          <option value="54|4.9|1.5">牛奶（100ml）</option>
          <option value="536|7|30">坚果混合（100g）</option>
          <option value="32|1.8|0.4">酸奶（100g）</option>
        </select>
      </div>
      <div>
        <label>重量（g）</label>
        <input type="number" id="foodWeight" value="100" min="0">
      </div>
      <div style="flex:0 0 auto;">
        <label>&nbsp;</label>
        <button class="btn primary" onclick="addFood()">加入列表</button>
      </div>
    </div>

    <div id="foodList"></div>

    <h3 style="margin-top:20px;">方式二：手动输入营养素</h3>
    <div class="input-row">
      <div>
        <label>碳水化合物（g）</label>
        <input type="number" id="manualCarb" value="0" min="0" step="0.1">
      </div>
      <div>
        <label>蛋白质（g）</label>
        <input type="number" id="manualProtein" value="0" min="0" step="0.1">
      </div>
      <div>
        <label>脂肪（g）</label>
        <input type="number" id="manualFat" value="0" min="0" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">计算热量</button>
      <button class="btn" onclick="clearAll()">清空</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>添加食物或输入营养素后点击计算。</p>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_nutrition_calc2';
let items = [];

function loadData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    items = data.items || [];
    if (data.manualCarb) document.getElementById('manualCarb').value = data.manualCarb;
    if (data.manualProtein) document.getElementById('manualProtein').value = data.manualProtein;
    if (data.manualFat) document.getElementById('manualFat').value = data.manualFat;
  } catch (e) {}
  renderList();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      items: items,
      manualCarb: document.getElementById('manualCarb').value,
      manualProtein: document.getElementById('manualProtein').value,
      manualFat: document.getElementById('manualFat').value
    }));
  } catch (e) {}
}

function addFood() {
  const select = document.getElementById('foodSelect');
  const weight = parseFloat(document.getElementById('foodWeight').value) || 0;
  if (!select.value || select.value === '0|0|0' || weight <= 0) {
    ToolBox.showToast(i18nText(), 'warning');
    return;
  }
  const [kcal, protein, fat] = select.value.split('|').map(Number);
  const ratio = weight / 100;
  items.push({
    name: select.options[select.selectedIndex].text,
    weight: weight,
    kcal: kcal * ratio,
    protein: protein * ratio,
    fat: fat * ratio,
    carb: (kcal - protein * 4 - fat * 9) / 4 * ratio
  });
  renderList();
  saveData();
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderList();
  saveData();
}

function renderList() {
  const el = document.getElementById('foodList');
  if (!items.length) {
    el.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">暂无已添加食物。</p>';
    return;
  }
  let html = '<table><thead><tr><th>食物</th><th>重量</th><th>热量</th><th>操作</th></tr></thead><tbody>';
  items.forEach((it, i) => {
    html += `<tr><td>${ToolBox.escHtml(it.name)}</td><td>${it.weight.toFixed(0)}g</td><td>${it.kcal.toFixed(0)} kcal</td><td><button class="btn" style="padding:4px 10px;font-size:12px;" onclick="removeItem(${i})">删除</button></td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function calculate() {
  let totalKcal = 0, totalCarb = 0, totalProtein = 0, totalFat = 0;
  items.forEach(it => {
    totalKcal += it.kcal;
    totalCarb += it.carb;
    totalProtein += it.protein;
    totalFat += it.fat;
  });

  const manualCarb = parseFloat(document.getElementById('manualCarb').value) || 0;
  const manualProtein = parseFloat(document.getElementById('manualProtein').value) || 0;
  const manualFat = parseFloat(document.getElementById('manualFat').value) || 0;

  totalCarb += manualCarb;
  totalProtein += manualProtein;
  totalFat += manualFat;
  totalKcal += manualCarb * 4 + manualProtein * 4 + manualFat * 9;

  document.getElementById('result').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${totalKcal.toFixed(0)}</div><div class="lbl">总热量 kcal</div></div>
      <div class="stat-card"><div class="val">${totalCarb.toFixed(1)}g</div><div class="lbl">碳水化合物</div></div>
      <div class="stat-card"><div class="val">${totalProtein.toFixed(1)}g</div><div class="lbl">蛋白质</div></div>
      <div class="stat-card"><div class="val">${totalFat.toFixed(1)}g</div><div class="lbl">脂肪</div></div>
    </div>
    <p>热量构成：碳水 ${(totalCarb * 4).toFixed(0)} kcal · 蛋白质 ${(totalProtein * 4).toFixed(0)} kcal · 脂肪 ${(totalFat * 9).toFixed(0)} kcal</p>
  `;
  saveData();
}

function clearAll() {
  items = [];
  document.getElementById('manualCarb').value = 0;
  document.getElementById('manualProtein').value = 0;
  document.getElementById('manualFat').value = 0;
  renderList();
  saveData();
  document.getElementById('result').innerHTML = '<p>添加食物或输入营养素后点击计算。</p>';
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('添加食物')) {
    ToolBox.showToast(i18nText(), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadData();
</script>
</body>
