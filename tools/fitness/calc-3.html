<body>
<h1 class="sr-only">体脂率计算（ Navy公式）</h1>
<div class="nav">

  <span>/ 体脂率计算（ Navy公式）</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">体脂率计算（ Navy公式）</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="📏 体脂率计算（Navy 公式）">📏 Body Fat Calculator (Navy Method)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="使用美国海军 circumference 公式，根据颈围、腰围、臀围估算体脂率。">Estimate body fat percentage by the US Navy formula.</p>

    <div class="input-row">
      <div>
        <label>性别</label>
        <select id="gender">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div>
        <label>身高（cm）</label>
        <input type="number" id="height" value="170" min="50" max="250" step="0.1">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>颈围（cm）</label>
        <input type="number" id="neck" value="38" min="10" max="80" step="0.1">
      </div>
      <div>
        <label>腰围（cm，肚脐处）</label>
        <input type="number" id="waist" value="80" min="10" max="200" step="0.1">
      </div>
    </div>

    <div class="input-row" id="hipRow">
      <div>
        <label>臀围（cm，女性必填）</label>
        <input type="number" id="hip" value="90" min="10" max="200" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">计算体脂率</button>
      <button class="btn" onclick="saveInputs()">保存数据</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>输入围度后点击计算。</p>
    </div>

    <div class="ref-card">
      <h4>参考范围（成人）</h4>
      <table>
        <thead><tr><th>等级</th><th>男性</th><th>女性</th></tr></thead>
        <tbody>
          <tr><td>必需脂肪</td><td>2-5%</td><td>10-13%</td></tr>
          <tr><td>运动员</td><td>6-13%</td><td>14-20%</td></tr>
          <tr><td>健康</td><td>14-17%</td><td>21-24%</td></tr>
          <tr><td>可接受</td><td>18-24%</td><td>25-31%</td></tr>
          <tr><td>肥胖</td><td>≥25%</td><td>≥32%</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_fitness_calc3';

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.gender) document.getElementById('gender').value = data.gender;
    if (data.height) document.getElementById('height').value = data.height;
    if (data.neck) document.getElementById('neck').value = data.neck;
    if (data.waist) document.getElementById('waist').value = data.waist;
    if (data.hip) document.getElementById('hip').value = data.hip;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      gender: document.getElementById('gender').value,
      height: document.getElementById('height').value,
      neck: document.getElementById('neck').value,
      waist: document.getElementById('waist').value,
      hip: document.getElementById('hip').value
    }));
    ToolBox.showToast(i18nText());
  } catch (e) {
    ToolBox.showToast(i18nText(), 'error');
  }
}

function calculate() {
  const gender = document.getElementById('gender').value;
  const height = parseFloat(document.getElementById('height').value) || 0;
  const neck = parseFloat(document.getElementById('neck').value) || 0;
  const waist = parseFloat(document.getElementById('waist').value) || 0;
  const hip = parseFloat(document.getElementById('hip').value) || 0;

  if (!height || !neck || !waist) {
    ToolBox.showToast(i18nText('toast.msg716'), 'error');
    return;
  }
  if (gender === 'female' && !hip) {
    ToolBox.showToast(i18nText('toast.msg128'), 'error');
    return;
  }

  let bodyFat;
  if (gender === 'male') {
    bodyFat = 86.010 * Math.log10(waist - neck) - 70.041 * Math.log10(height) + 36.76;
  } else {
    bodyFat = 163.205 * Math.log10(waist + hip - neck) - 97.684 * Math.log10(height) - 78.387;
  }

  bodyFat = Math.max(2, Math.min(60, bodyFat));

  let category, cls;
  if (gender === 'male') {
    if (bodyFat < 6) { category = '必需脂肪/运动员'; cls = 'grade-good'; }
    else if (bodyFat < 14) { category = '健康'; cls = 'grade-excellent'; }
    else if (bodyFat < 18) { category = '可接受'; cls = 'grade-pass'; }
    else if (bodyFat < 25) { category = '偏高'; cls = 'grade-pass'; }
    else { category = '肥胖'; cls = 'grade-fail'; }
  } else {
    if (bodyFat < 14) { category = '必需脂肪/运动员'; cls = 'grade-good'; }
    else if (bodyFat < 21) { category = '健康'; cls = 'grade-excellent'; }
    else if (bodyFat < 25) { category = '可接受'; cls = 'grade-pass'; }
    else if (bodyFat < 32) { category = '偏高'; cls = 'grade-pass'; }
    else { category = '肥胖'; cls = 'grade-fail'; }
  }

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:40px;font-weight:700;color:var(--primary);">${bodyFat.toFixed(1)}%</div>
      <span class="grade-tag ${cls}">${category}</span>
    </div>
    <p>性别：${gender === 'male' ? '男' : '女'} · 身高：${height}cm · 颈围：${neck}cm · 腰围：${waist}cm${gender === 'female' ? ' · 臀围：' + hip + 'cm' : ''}</p>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('输入围度后')) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadInputs();
calculate();
</script>
</body>
