<div class="container">
  <div class="card">
    <h2>摩尔浓度（c = n / V）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由物质的量与溶液体积计算物质的量浓度。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">c = n / V</div>
      <p class="formula-desc">由物质的量与溶液体积计算物质的量浓度。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="n">物质的量 (mol)</label>
        <input type="number" id="n" value="2" step="0.01">
      </div>
      <div>
        <label for="V">溶液体积 (L)</label>
        <input type="number" id="V" value="1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>c = n / V；V 为溶液体积(L)。</li>
        <li>2 mol 溶于 1 L 得 2 mol/L。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n = num('n'), V = num('V');
            const c = n / V;
            ToolBox.setResult('result', dataGrid([
                [c.toFixed(4), '摩尔浓度 c (mol/L)'],
                [(c * 1000).toFixed(2), '毫摩尔浓度 (mmol/L)']
            ]));
        }
function resetForm(){document.getElementById('n').value = '2';
      document.getElementById('V').value = '1';
      calcTool();}
calcTool();
</script>
