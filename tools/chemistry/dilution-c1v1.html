<div class="container">
  <div class="card">
    <h2 data-zh="已知三者求第四者（浓度或体积）">Dilution C1v1</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入初始浓度与体积、目标浓度，求所需体积；或求目标体积。">Dilution C1v1 is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">0=求此项） (mL)</div>
      <p class="formula-desc">输入初始浓度与体积、目标浓度，求所需体积；或求目标体积。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c1">初始浓度 C₁ (mol/L)</label>
        <input type="number" id="c1" value="1" step="0.01">
      </div>
      <div>
        <label for="v1">初始体积 V₁ (mL)</label>
        <input type="number" id="v1" value="100" step="1">
      </div>
      <div>
        <label for="c2">目标浓度 C₂ (mol/L)</label>
        <input type="number" id="c2" value="0.1" step="0.01">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v2">目标体积 V₂（0=求此项） (mL)</label>
        <input type="number" id="v2" value="0" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>C₁V₁ = C₂V₂ 为稀释前后溶质量守恒。</li>
        <li>1 mol/L×100mL 稀释至 0.1 mol/L → 需 1000 mL。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c1=num('c1'),v1=num('v1'),c2=num('c2'),v2=num('v2');
            let out;
            if(v2===0||v2===''){ const V=c1*v1/c2; out=[V.toFixed(2),'所需目标体积 V₂ (mL)']; }
            else { const V=c1*v1/c2; out=[V.toFixed(2),'由 C₁V₁=C₂V₂ 得 V₂ (mL)']; }
            ToolBox.setResult('result', dataGrid([
                out,
                [(c1*v1).toFixed(3),'溶质物质的量 (C·V)']
            ]));
        }
function resetForm(){document.getElementById('c1').value = '1';
      document.getElementById('v1').value = '100';
      document.getElementById('c2').value = '0.1';
      document.getElementById('v2').value = '0';
      calcTool();}
calcTool();
</script>
