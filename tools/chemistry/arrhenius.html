<div class="container">
  <div class="card">
    <h2>温度对反应速率常数的影响</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入指前因子 A、活化能 Ea 与温度，求速率常数 k。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">k = A·exp(−Ea/RT)。 Ea=50 kJ/mol、298K、A=1e13 → k≈5.2e-5 s⁻¹。</div>
      <p class="formula-desc">输入指前因子 A、活化能 Ea 与温度，求速率常数 k。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="A">指前因子 A (s⁻¹)</label>
        <input type="number" id="A" value="1e13" step="1e12">
      </div>
      <div>
        <label for="Ea">活化能 Ea (J/mol)</label>
        <input type="number" id="Ea" value="50000" step="1000">
      </div>
      <div>
        <label for="T">温度 T (K)</label>
        <input type="number" id="T" value="298" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>k = A·exp(−Ea/RT)。</li>
        <li>Ea=50 kJ/mol、298K、A=1e13 → k≈5.2e-5 s⁻¹。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const A=num('A'),Ea=num('Ea'),T=num('T');
            const k=A*Math.exp(-Ea/(8.314*T));
            ToolBox.setResult('result', dataGrid([
                [k.toExponential(3),'速率常数 k'],
                [(-Ea/(8.314*T)).toFixed(2),'指数项 (−Ea/RT)']
            ]));
        }
function resetForm(){document.getElementById('A').value = '1e13';
      document.getElementById('Ea').value = '50000';
      document.getElementById('T').value = '298';
      calcTool();}
calcTool();
</script>
