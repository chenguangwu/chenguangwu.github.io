<h1 class="sr-only">Q = Π(浓度^系数)</h1>

<div class="container">
  <div class="card">
    <h2>判断反应进行的方向</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入反应物与生成物的浓度及系数，求反应商 Q 并与 K 比较。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = [P]^ν_P / [R]^ν_R（气相用分压）。 QK 逆向。</div>
      <p class="formula-desc">输入反应物与生成物的浓度及系数，求反应商 Q 并与 K 比较。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rP">反应物浓度 [R] (mol/L)</label>
        <input type="number" id="rP" value="1.0" step="0.1">
      </div>
      <div>
        <label for="rN">反应物系数 ν_R</label>
        <input type="number" id="rN" value="1" step="1">
      </div>
      <div>
        <label for="pP">生成物浓度 [P] (mol/L)</label>
        <input type="number" id="pP" value="0.5" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="pN">生成物系数 ν_P</label>
        <input type="number" id="pN" value="1" step="1">
      </div>
      <div>
        <label for="K">平衡常数 K</label>
        <input type="number" id="K" value="2.0" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Q = [P]^ν_P / [R]^ν_R（气相用分压）。</li>
        <li>Q<K 正向；Q>K 逆向。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rP=num('rP'),rN=num('rN'),pP=num('pP'),pN=num('pN'),K=num('K');
            const Q=Math.pow(pP,pN)/Math.pow(rP,rN);
            let dir = Q<K ? '正向进行 (Q<K)' : (Q>K ? '逆向进行 (Q>K)' : '已达平衡');
            ToolBox.setResult('result', dataGrid([
                [Q.toFixed(4),'反应商 Q'],
                [dir,'反应方向']
            ]));
        }
function resetForm(){document.getElementById('rP').value = '1.0';
      document.getElementById('rN').value = '1';
      document.getElementById('pP').value = '0.5';
      document.getElementById('pN').value = '1';
      document.getElementById('K').value = '2.0';
      calcTool();}
calcTool();
</script>
