<div class="container">
  <div class="card">
    <h2>非标准状态下的电极电势</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入标准电势、电子数 n、反应商 Q 与温度，求实际电极电势。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E = E° − (RT/nF)lnQ。25℃ 时 2.303RT/F≈0.0592 V。 Q=1 时 E=E°。</div>
      <p class="formula-desc">输入标准电势、电子数 n、反应商 Q 与温度，求实际电极电势。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="E0">标准电极电势 E° (V)</label>
        <input type="number" id="E0" value="1.23" step="0.01">
      </div>
      <div>
        <label for="n">电子转移数 n</label>
        <input type="number" id="n" value="2" step="1">
      </div>
      <div>
        <label for="Q">反应商 Q</label>
        <input type="number" id="Q" value="1" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="T">温度 T (K)</label>
        <input type="number" id="T" value="298" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>E = E° − (RT/nF)lnQ。25℃ 时 2.303RT/F≈0.0592 V。</li>
        <li>Q=1 时 E=E°。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const E0=num('E0'),n=num('n'),Q=num('Q'),T=num('T');
            const E=E0 - (8.314*T/(n*96485))*Math.log(Q);
            ToolBox.setResult('result', dataGrid([
                [E.toFixed(4),'电极电势 E (V)'],
                [((8.314*T/(n*96485))*Math.log(10)).toFixed(5),'(RT/nF)ln10 (V)']
            ]));
        }
function resetForm(){document.getElementById('E0').value = '1.23';
      document.getElementById('n').value = '2';
      document.getElementById('Q').value = '1';
      document.getElementById('T').value = '298';
      calcTool();}
calcTool();
</script>
