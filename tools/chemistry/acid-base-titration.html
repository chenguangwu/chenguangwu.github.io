<div class="container">
  <div class="card">
    <h2>酸碱中和滴定计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">中和所需碱体积（V_b = C_a·V_a·n_a / (C_b·n_b)）</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据酸碱的当量关系计算达到中和所需的另一种溶液体积。</p>

    <div class="input-row">
      <div>
        <label for="Ca">酸浓度 (mol/L)</label>
        <input type="number" id="Ca" value="0.1" step="0.001">
      </div>
      <div>
        <label for="Va">酸体积 (mL)</label>
        <input type="number" id="Va" value="25" step="0.1">
      </div>
      <div>
        <label for="na">酸元数 n_a</label>
        <input type="number" id="na" value="1" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="Cb">碱浓度 (mol/L)</label>
        <input type="number" id="Cb" value="0.1" step="0.001">
      </div>
      <div>
        <label for="nb">碱元数 n_b</label>
        <input type="number" id="nb" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>V_b = C_a·V_a·n_a / (C_b·n_b)，n 为可电离 H⁺/OH⁻ 数。</li>
        <li>一元酸一元碱等浓度等体积中和。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Ca = num('Ca'), Va = num('Va'), na = num('na'), Cb = num('Cb'), nb = num('nb');
            const Vb = Ca * Va * na / (Cb * nb);
            ToolBox.setResult('result', dataGrid([
                [Vb.toFixed(2), '所需碱体积 V_b (mL)'],
                [(Cb * Vb * nb / (Va * na)).toFixed(4), '回算酸浓度 (mol/L)']
            ]));
        }
function resetForm(){document.getElementById('Ca').value = '0.1';
      document.getElementById('Va').value = '25';
      document.getElementById('na').value = '1';
      document.getElementById('Cb').value = '0.1';
      document.getElementById('nb').value = '1';
      calcTool();}
calcTool();
</script>
