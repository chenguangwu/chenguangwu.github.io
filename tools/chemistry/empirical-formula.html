<div class="container">
  <div class="card">
    <h2>将元素质量百分比换算为原子最简整数比</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入最多三种元素的质量百分比与原子量，自动求原子数之比并约简。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">n_i = w_i% / A_i，再除以最小值得到整数比。 示例 C40% H6.7% O53.3% → CH₂O。</div>
      <p class="formula-desc">输入最多三种元素的质量百分比与原子量，自动求原子数之比并约简。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p1">元素1 质量% (%)</label>
        <input type="number" id="p1" value="40.0" step="0.1">
      </div>
      <div>
        <label for="a1">元素1 原子量 (g/mol)</label>
        <input type="number" id="a1" value="12.01" step="0.01">
      </div>
      <div>
        <label for="p2">元素2 质量% (%)</label>
        <input type="number" id="p2" value="6.7" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="a2">元素2 原子量 (g/mol)</label>
        <input type="number" id="a2" value="1.008" step="0.01">
      </div>
      <div>
        <label for="p3">元素3 质量% (%)</label>
        <input type="number" id="p3" value="53.3" step="0.1">
      </div>
      <div>
        <label for="a3">元素3 原子量 (g/mol)</label>
        <input type="number" id="a3" value="16.00" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>n_i = w_i% / A_i，再除以最小值得到整数比。</li>
        <li>示例 C40% H6.7% O53.3% → CH₂O。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ps=[num('p1'),num('p2'),num('p3')];
            const as=[num('a1'),num('a2'),num('a3')];
            const moles=ps.map((p,i)=>p/as[i]);
            const min=Math.min(...moles.filter(v=>v>0));
            const ratios=moles.map(m=>(m/min));
            function near(x){return Math.round(x*100)/100;}
            const grid=ratios.map((r,i)=>[near(r).toFixed(2),'元素'+(i+1)+' 原子数比']);
            ToolBox.setResult('result', dataGrid(grid));
        }
function resetForm(){document.getElementById('p1').value = '40.0';
      document.getElementById('a1').value = '12.01';
      document.getElementById('p2').value = '6.7';
      document.getElementById('a2').value = '1.008';
      document.getElementById('p3').value = '53.3';
      document.getElementById('a3').value = '16.00';
      calcTool();}
calcTool();
</script>
