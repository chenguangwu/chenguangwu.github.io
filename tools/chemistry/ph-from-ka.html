<h1 class="sr-only">一元弱酸 pH ≈ ½(pKₐ − log C)</h1>

<div class="container">
  <div class="card">
    <h2>由酸解离常数与浓度估算 pH</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入弱酸浓度与 Ka，用近似公式求氢离子浓度与 pH。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Ka=1.8e-5) → pH≈2.87。</div>
      <p class="formula-desc">输入弱酸浓度与 Ka，用近似公式求氢离子浓度与 pH。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="C">弱酸浓度 (mol/L)</label>
        <input type="number" id="C" value="0.1" step="0.01">
      </div>
      <div>
        <label for="Ka">酸解离常数 Ka</label>
        <input type="number" id="Ka" value="1.8e-5" step="1e-6">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>近似 [H⁺]=√(Ka·C)，适用于 C/Ka>400。</li>
        <li>0.1 mol/L 醋酸(Ka=1.8e-5) → pH≈2.87。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const C=num('C'), Ka=num('Ka');
            const h=Math.sqrt(Ka*C);
            const ph=-Math.log10(h);
            ToolBox.setResult('result', dataGrid([
                [h.toExponential(3),'[H⁺] (mol/L)'],
                [ph.toFixed(3),'pH']
            ]));
        }
function resetForm(){document.getElementById('C').value = '0.1';
      document.getElementById('Ka').value = '1.8e-5';
      calcTool();}
calcTool();
</script>
