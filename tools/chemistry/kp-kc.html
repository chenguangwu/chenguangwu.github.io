<h1 class="sr-only">Kp = Kc(RT)^Δn</h1>

<div class="container">
  <div class="card">
    <h2>气体反应平衡常数换算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入 Kc、温度与气体摩尔数变化 Δn，求 Kp（R=8.314，T 为开尔文）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R=8.314。 Δn=0 时 Kp=Kc。</div>
      <p class="formula-desc">输入 Kc、温度与气体摩尔数变化 Δn，求 Kp（R=8.314，T 为开尔文）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Kc">浓度平衡常数 Kc</label>
        <input type="number" id="Kc" value="0.5" step="0.01">
      </div>
      <div>
        <label for="T">温度 T (K)</label>
        <input type="number" id="T" value="298" step="1">
      </div>
      <div>
        <label for="dn">气体摩尔数变化 Δn</label>
        <input type="number" id="dn" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Kp = Kc(RT)^Δn，R=8.314。</li>
        <li>Δn=0 时 Kp=Kc。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Kc=num('Kc'),T=num('T'),dn=num('dn');
            const Kp=Kc*Math.pow(8.314*T, dn);
            ToolBox.setResult('result', dataGrid([
                [Kp.toExponential(3),'压力平衡常数 Kp'],
                [(8.314*T).toFixed(1),'RT (L·kPa/mol·K 等效)']
            ]));
        }
function resetForm(){document.getElementById('Kc').value = '0.5';
      document.getElementById('T').value = '298';
      document.getElementById('dn').value = '1';
      calcTool();}
calcTool();
</script>
