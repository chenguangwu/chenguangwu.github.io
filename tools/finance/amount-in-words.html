  <div class="card">
    <h2>💰 数字大写转换器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">支持金额（最多两位小数），输出中文大写金额。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：数字大写转换器。</p>
</div>


    <div class="input-row">
      <label>金额</label>
      <input type="number" id="money" value="1234.56" min="0" step="0.01" oninput="convert()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="convert()">转换</button>
      <button class="btn" onclick="copyResult()">复制</button>
    </div>
    <div class="result-box" id="out"></div>
  </div>
</div>

<script>
const CN = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
const UNIT = ['', '拾', '佰', '仟'];
const BIG = ['', '万', '亿', '兆'];

function integerToCN(num) {
  const s = String(num);
  const blocks = [];
  for (let i = s.length; i > 0; i -= 4) {
    blocks.push(s.slice(Math.max(0, i - 4), i));
  }
  let out = '';
  for (let b = blocks.length - 1; b >= 0; b--) {
    const g = blocks[b];
    let part = '';
    let zero = false;
    for (let i = 0; i < g.length; i++) {
      const d = Number(g[i]);
      const p = g.length - i - 1;
      if (d === 0) {
        zero = true;
      } else {
        if (zero && part) part += '零';
        part += CN[d] + UNIT[p];
        zero = false;
      }
    }
    out += part + BIG[b];
  }
  return out || '零';
}

function convert() {
  const val = parseFloat(document.getElementById('money').value || 0);
  if (isNaN(val) || val < 0) {
    document.getElementById('out').innerHTML = '<p>请输入有效金额</p>';
    return;
  }
  const y = Math.floor(val + 1e-8);
  const f = Math.round((val - y) * 100);

  const yi = integerToCN(y);
  const jiao = Math.floor(f / 10);
  const fen = f % 10;

  let out = yi + '元';
  if (f === 0) {
    out += '整';
  } else {
    if (jiao) out += CN[jiao] + '角';
    if (fen) out += CN[fen] + '分';
    if (!jiao && fen) out = yi + '元零' + out.split('元')[1];
  }

  document.getElementById('out').innerHTML = `<p>中文大写：<strong>${out}</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg680'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg279'));
}

convert();
</script>
