<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;">
    <h2>🏦 贷款月供计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入贷款金额、年利率与期限，计算等额本息月供</p>

    <div class="input-row">
      <div><label>贷款金额（元）</label><input type="number" id="amount" value="1000000" step="any" oninput="calc()"></div>
      <div><label>年利率（%）</label><input type="number" id="rate" value="4.2" step="0.01" oninput="calc()"></div>
    </div>
    <div class="input-row">
      <div><label>贷款期限（年）</label><input type="number" id="years" value="30" step="1" min="1" oninput="calc()"></div>
      <div><label>还款方式</label>
        <select id="type" onchange="calc()">
          <option value="equal-interest">等额本息</option>
          <option value="equal-principal">等额本金</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button type="button" class="btn primary" onclick="calc()">🧮 计算</button>
      <button type="button" class="btn" onclick="copyRes()">📋 复制结果</button>
      <button type="button" class="btn" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="data-grid" id="summary" style="margin-top:16px;"></div>
    <div class="result-box" id="res"></div>
  </div>

  <div class="card">
    <h3>📅 还款计划表（前 12 期与最后 1 期）</h3>
    <div style="overflow-x:auto;">
      <table class="loan-table" id="schedule">
        <thead><tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="tool-notes" style="--tool-accent:#FF6B35;">
    <div class="tool-notes-title">⚠️ 使用说明与注意事项</div>
    <ul>
      <li>等额本息月供公式：M = P×[r(1+r)^n]/[(1+r)^n-1]，每月还款额固定</li>
      <li>等额本金首月还款最高，之后每月递减；每月本金 = 贷款总额 / 期数</li>
      <li>实际还款可能因银行计息方式、手续费、提前还款规则而略有差异</li>
      <li>本工具纯前端运行，数据不会上传到服务器</li>
    </ul>
  </div>

</div>
<script>
const STORE_KEY = 'tb_loan_payment';
function $(id){ return document.getElementById(id); }
function save(){ try{ const data={a:$('amount').value,r:$('rate').value,y:$('years').value,t:$('type').value}; localStorage.setItem(STORE_KEY,JSON.stringify(data)); }catch(e){} }
function load(){ try{ const data=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); if(data.a!=null) $('amount').value=data.a; if(data.r!=null) $('rate').value=data.r; if(data.y!=null) $('years').value=data.y; if(data.t!=null) $('type').value=data.t; }catch(e){} }
function fmt(n,d){ return ToolBox.formatNumber(n,d); }
function calc(){
  save();
  const P = parseFloat($('amount').value)||0;
  const rAnnual = (parseFloat($('rate').value)||0)/100;
  const years = parseInt($('years').value)||1;
  const monthlyRate = rAnnual / 12;
  const n = years * 12;
  const type = $('type').value;
  let totalPayment=0, totalInterest=0, firstMonth=0, lastMonth=0;
  let schedule=[];
  if(type==='equal-interest'){
    const M = monthlyRate===0 ? P/n : P * monthlyRate * Math.pow(1+monthlyRate,n) / (Math.pow(1+monthlyRate,n)-1);
    let balance = P;
    firstMonth = M; lastMonth = M;
    for(let i=1;i<=n;i++){
      const interest = balance * monthlyRate;
      const principal = M - interest;
      balance -= principal;
      if(balance<0) balance=0;
      totalPayment += M; totalInterest += interest;
      if(i<=12 || i===n) schedule.push({i,monthly:M,principal,interest,balance});
    }
  } else {
    const principalPerMonth = P / n;
    let balance = P;
    for(let i=1;i<=n;i++){
      const interest = balance * monthlyRate;
      const monthly = principalPerMonth + interest;
      balance -= principalPerMonth;
      if(balance<0) balance=0;
      totalPayment += monthly; totalInterest += interest;
      if(i===1) firstMonth=monthly;
      if(i===n) lastMonth=monthly;
      if(i<=12 || i===n) schedule.push({i,monthly,principal:principalPerMonth,interest,balance});
    }
  }
  const summary=[
    {num:fmt(type==='equal-interest'?firstMonth:firstMonth,2)+' 元',label:'首月还款'},
    {num:fmt(totalPayment,2),label:'还款总额（元）'},
    {num:fmt(totalInterest,2),label:'总利息（元）'},
    {num:years*12+' 期',label:'还款期数'}
  ];
  if(type==='equal-principal') summary[0].num = fmt(firstMonth,2)+' 元';
  $('summary').innerHTML=summary.map(s=>`<div class="data-card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('');
  $('res').innerHTML=`<p>首月还款：<strong>${fmt(firstMonth,2)} 元</strong>${type==='equal-principal'?`，末月还款 <strong>${fmt(lastMonth,2)} 元</strong>`:''}</p><p>还款总额：<strong>${fmt(totalPayment,2)} 元</strong>（利息 ${fmt(totalInterest,2)} 元）</p><p>贷款本金：<strong>${fmt(P,2)} 元</strong></p>`;
  const tbody = $('schedule').querySelector('tbody');
  tbody.innerHTML = schedule.map(r=>`<tr><td>第 ${r.i} 期</td><td>${fmt(r.monthly,2)}</td><td>${fmt(r.principal,2)}</td><td>${fmt(r.interest,2)}</td><td>${fmt(r.balance,2)}</td></tr>`).join('');
}
function copyRes(){ ToolBox.copyText($('res').innerText.replace(/\n+/g,'；'),'已复制结果'); }
function resetAll(){ $('amount').value=1000000; $('rate').value=4.2; $('years').value=30; $('type').value='equal-interest'; calc(); }
document.addEventListener('DOMContentLoaded',()=>{ load(); calc(); });
</script>
