<div class="container">
  <div class="card">
    <h2>🏠 提前还款计算器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">比较“缩短月数”和“降低月供”两种模式。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：提前还款计算器。</p>
</div>


    <div class="input-row">
      <div><label>贷款金额（元）</label><input id="principal" type="number" value="500000" oninput="calc()"></div>
      <div><label>年利率（%）</label><input id="rate" type="number" value="4.5" step="any" oninput="calc()"></div>
    </div>
    <div class="input-row">
      <div><label>剩余月数</label><input id="months" type="number" value="240" oninput="calc()"></div>
      <div><label>每月还款（元）</label><input id="monthly" type="number" value="3000" oninput="calc()"></div>
    </div>
    <div class="input-row">
      <div><label>提前还款金额（元）</label><input id="prepay" type="number" value="20000" oninput="calc()"></div>
      <div><label>还款后保留小数</label><input id="precision" type="number" min="0" value="2" oninput="calc()"></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
function monthlyPayment(p, r, n) {
  const m = r / 12;
  if (m === 0) return p / n;
  const pow = Math.pow(1 + m, n);
  return p * m * pow / (pow - 1);
}

function remainingMonths(p, r, pmt) {
  const m = r / 12;
  if (m === 0) return p / pmt;
  let n = 0;
  let bal = p;
  while (bal > 0 && n < 1200) {
    bal = bal * (1 + m) - pmt;
    n++;
    if (n > 1200) break;
  }
  return n;
}

function calc() {
  const p = parseFloat(document.getElementById('principal').value) || 0;
  const annual = (parseFloat(document.getElementById('rate').value) || 0) / 100;
  const months = Math.max(1, parseInt(document.getElementById('months').value, 10) || 1);
  const mp = parseFloat(document.getElementById('monthly').value) || 0;
  const prepay = Math.max(0, parseFloat(document.getElementById('prepay').value) || 0);
  const fixed = Math.max(0, parseInt(document.getElementById('precision').value, 10) || 2);

  if (!p || !annual || !months || !mp) {
    document.getElementById('result').innerHTML = '<p>请输入完整有效参数。</p>';
    return;
  }

  let bal = Math.max(0, p - prepay);
  if (bal <= 0) {
    document.getElementById('result').innerHTML = '<p>提前还款金额已覆盖本金</p>';
    return;
  }

  const m = annual / 12;
  const before = monthlyPayment(p, annual, months);
  const totalBefore = before * months;

  // 模式1：保留月供，缩短期限
  const shortMonths = remainingMonths(bal, annual, mp);
  const totalShort = mp * shortMonths;
  const saveMonths = months - shortMonths;

  // 模式2：保留期限，降低月供（从剩余月和剩余本金反推）
  let reduceMonthly = 0;
  if (m === 0) {
    reduceMonthly = bal / months;
  } else {
    const pow = Math.pow(1 + m, months);
    reduceMonthly = bal * m * pow / (pow - 1);
  }

  const totalReduce = reduceMonthly * months;
  const saveInterest1 = (totalBefore - totalShort).toFixed(fixed);
  const saveInterest2 = (totalBefore - totalReduce).toFixed(fixed);

  document.getElementById('result').innerHTML =
    '<p>原模型月供参考：<strong>' + before.toFixed(fixed) + '</strong> 元（总额约 <strong>' + totalBefore.toFixed(fixed) + '</strong> 元）</p>' +
    '<p>模式一（缩短期限）：月供仍为 <strong>' + mp.toFixed(fixed) + '</strong> 元，剩余期数约 <strong>' + shortMonths + '</strong> 个月，累计约 <strong>' + totalShort.toFixed(fixed) + '</strong> 元</p>' +
    '<p>节省（按原计划对比）：<strong style="color:var(--success);">' + saveInterest1 + '</strong> 元</p>' +
    '<p>模式二（降低月供）：月供调整为 <strong>' + reduceMonthly.toFixed(fixed) + ' 元</strong>，期限不变</p>' +
    '<p>节省（按原计划对比）：<strong style="color:var(--success);">' + saveInterest2 + '</strong> 元</p>';
}

function copyResult() {
  ToolBox.copyText(document.getElementById('result').innerText, i18nText('toast.msg544'));
}

calc();
</script>
