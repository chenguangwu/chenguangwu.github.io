<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#7C3AED;--tool-accent-dark:#7C3AED;">
    <h2>🌀 蜗杆传动效率/自锁校核</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">蜗杆传动效率计算与自锁条件校核</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">蜗杆效率 η = tanλ/tan(λ+ρ)</div>
      <p class="formula-desc">蜗杆传动效率计算与自锁条件校核</p>
    </div>

    <div class="input-row">
      <div><label>蜗杆头数 z₁</label><input type="number" id="z1" value="2" step="1" min="1" max="8" oninput="calc()" aria-label="蜗杆头数"></div>
      <div><label>蜗轮齿数 z₂</label><input type="number" id="z2" value="40" step="1" min="10" oninput="calc()" aria-label="蜗轮齿数"></div>
      <div><label>模数 m (mm)</label><input type="number" id="module" value="5" step="0.25" min="1" oninput="calc()" aria-label="模数"></div>
    </div>
    <div class="input-row">
      <div><label>蜗杆直径系数 q</label><input type="number" id="q" value="10" step="0.5" min="6" oninput="calc()" aria-label="直径系数"></div>
      <div>
        <label>材料配对</label>
        <select id="matPair" onchange="onMatChange()">
          <option value="bronze_oil" selected>锡青铜蜗轮+钢蜗杆（油润滑）</option>
          <option value="bronze_dry">青铜蜗轮+钢蜗杆（脂润滑）</option>
          <option value="iron">铸铁蜗轮+钢蜗杆</option>
          <option value="custom">自定义摩擦系数</option>
        </select>
      </div>
    </div>
    <div class="input-row" id="customMu" style="display:none;">
      <div><label>当量摩擦系数 μᵥ</label><input type="number" id="mu" value="0.05" step="0.01" min="0.01" oninput="calc()" aria-label="摩擦系数"></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
    </div>
    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">💡 效率 η=tanγ/tan(γ+ρ)，ρ=arctan(μᵥ) 为当量摩擦角。自锁条件：γ ≤ ρ（即 η ≤ 0.5）。</div>
  </div>
</div>

<script>
var MU_DATA = { 'bronze_oil': 0.04, 'bronze_dry': 0.08, 'iron': 0.12 };
var DEG = Math.PI / 180;
function val(id){ var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function setInvalid(el, bad){ if(!el) return; el.classList.toggle('input-error', bad); }

function onMatChange(){
  var m = document.getElementById('matPair').value;
  document.getElementById('customMu').style.display = m === 'custom' ? '' : 'none';
  if(m !== 'custom') document.getElementById('mu').value = MU_DATA[m];
  calc();
}

function calc(){
  var z1 = val('z1'), z2 = val('z2'), m = val('module'), q = val('q');
  var matPair = document.getElementById('matPair').value;
  var mu = matPair === 'custom' ? val('mu') : MU_DATA[matPair];

  setInvalid(document.getElementById('z1'), z1 < 1);
  setInvalid(document.getElementById('z2'), z2 < 10);
  setInvalid(document.getElementById('module'), m <= 0);
  setInvalid(document.getElementById('q'), q < 6);
  if(z1 < 1 || z2 < 10 || m <= 0 || q < 6){
    document.getElementById('res').innerHTML = '<p style="color:var(--danger);">参数无效</p>';
    return;
  }

  var fmt = function(n){ return n.toFixed(2); };

  // 传动比
  var i = z2 / z1;

  // 导程角 γ = arctan(z1/q)
  var gamma = Math.atan(z1 / q); // rad
  var gammaDeg = gamma * 180 / Math.PI;

  // 当量摩擦角 ρ = arctan(μv)
  var rho = Math.atan(mu);
  var rhoDeg = rho * 180 / Math.PI;

  // 传动效率 η = tan(γ) / tan(γ + ρ)
  var eta = Math.tan(gamma) / Math.tan(gamma + rho);

  // 蜗杆分度圆直径 d1 = q * m
  var d1 = q * m;
  // 蜗轮分度圆直径 d2 = m * z2
  var d2 = m * z2;
  // 中心距 a = (d1 + d2) / 2
  var a = (d1 + d2) / 2;
  // 导程 pz = π * m * z1
  var lead = Math.PI * m * z1;

  // 自锁判断
  var selfLocking = gamma <= rho;
  var selfLockMargin = rhoDeg - gammaDeg; // 正值表示能自锁，裕度

  // 反向效率（蜗轮主动时）
  var etaReverse = Math.tan(gamma - rho) / Math.tan(gamma);
  if(etaReverse < 0) etaReverse = 0;

  var html = '<h3 style="margin-bottom:10px;">传动参数</h3>';
  html += '<div class="data-grid">';
  html += '<div class="data-card"><div class="num">' + fmt(i) + '</div><div class="label">传动比 i</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(gammaDeg) + '°</div><div class="label">导程角 γ</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(rhoDeg) + '°</div><div class="label">当量摩擦角 ρ</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(eta * 100) + '%</div><div class="label">传动效率 η</div></div>';
  html += '</div>';

  html += '<h3 style="margin:16px 0 8px;">几何尺寸</h3>';
  html += '<div class="data-grid">';
  html += '<div class="data-card"><div class="num">' + fmt(d1) + '</div><div class="label">蜗杆分度圆 d₁ (mm)</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(d2) + '</div><div class="label">蜗轮分度圆 d₂ (mm)</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(a) + '</div><div class="label">中心距 a (mm)</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(lead) + '</div><div class="label">导程 pz (mm)</div></div>';
  html += '</div>';

  // 自锁校核
  html += '<h3 style="margin:16px 0 8px;">自锁校核</h3>';
  if(selfLocking){
    html += '<div style="text-align:center;margin-bottom:8px;"><span class="grade-tag grade-excellent" style="font-size:16px;padding:8px 24px;">可自锁</span></div>';
    html += '<div class="tip-box tip-success">✓ 导程角 γ=' + fmt(gammaDeg) + '° ≤ 摩擦角 ρ=' + fmt(rhoDeg) + '°，蜗杆传动可自锁。蜗轮无法反向驱动蜗杆，安全裕度 ' + fmt(selfLockMargin) + '°。</div>';
  } else {
    html += '<div style="text-align:center;margin-bottom:8px;"><span class="grade-tag grade-fail" style="font-size:16px;padding:8px 24px;">不可自锁</span></div>';
    html += '<div class="tip-box tip-error">⛔ 导程角 γ=' + fmt(gammaDeg) + '° > 摩擦角 ρ=' + fmt(rhoDeg) + '°，蜗杆传动不自锁！蜗轮可反向驱动蜗杆，如需自锁请减小导程角或增大摩擦系数。</div>';
  }

  // 效率评价
  html += '<div class="data-grid" style="margin-top:12px;">';
  html += '<div class="data-card"><div class="num">' + fmt(etaReverse * 100) + '%</div><div class="label">反向效率 η′</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(selfLockMargin) + '°</div><div class="label">自锁裕度 (ρ-γ)</div></div>';
  html += '</div>';

  if(eta < 0.5 && !selfLocking){
    html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 效率 ' + fmt(eta*100) + '% 偏低，发热量大，需注意散热。</div>';
  } else if(eta > 0.85){
    html += '<div class="tip-box tip-success" style="margin-top:8px;">✓ 效率 ' + fmt(eta*100) + '% 较高，适合动力传动。</div>';
  } else {
    html += '<div class="tip-box tip-info" style="margin-top:8px;">ℹ️ 效率 ' + fmt(eta*100) + '%，一般蜗杆传动效率范围 40%~85%。</div>';
  }

  // 导程角推荐
  if(gammaDeg < 3){
    html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 导程角 ' + fmt(gammaDeg) + '° 偏小，效率低但易自锁。动力传动建议 γ=15°~30°。</div>';
  } else if(gammaDeg > 30){
    html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 导程角 ' + fmt(gammaDeg) + '° 偏大，加工困难。</div>';
  }

  document.getElementById('res').innerHTML = html;
}

function copyRes(){
  var text = document.getElementById('res').innerText;
  if(!text.trim()){ ToolBox.showToast(i18nText(),'warning'); return; }
  ToolBox.copyText(text);
}
calc();
</script>
</body>
