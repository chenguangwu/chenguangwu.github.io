<h1 class="sr-only">弹簧参数计算</h1>

<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#00C9A7;--tool-accent-dark:#00C9A7;">
    <h2>🌀 弹簧参数计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">圆柱螺旋弹簧（压缩/拉伸/扭转）刚度与强度校核</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">弹簧刚度 k = G·d⁴/(8D³n)</div>
      <p class="formula-desc">圆柱螺旋弹簧（压缩/拉伸/扭转）刚度与强度校核</p>
    </div>

    <div class="checkbox-row">
      <label><input type="radio" name="springType" value="compression" checked onchange="calc()"> 压缩弹簧</label>
      <label><input type="radio" name="springType" value="tension" onchange="calc()"> 拉伸弹簧</label>
      <label><input type="radio" name="springType" value="torsion" onchange="calc()"> 扭转弹簧</label>
    </div>

    <div class="input-row">
      <div><label>簧丝直径 d (mm)</label><input type="number" id="wireDia" value="2" step="0.1" min="0.1" oninput="calc()" aria-label="簧丝直径"></div>
      <div><label>中径 D (mm)</label><input type="number" id="coilDia" value="12" step="0.5" min="0.5" oninput="calc()" aria-label="弹簧中径"></div>
      <div><label>有效圈数 n</label><input type="number" id="activeCoils" value="8" step="0.5" min="1" oninput="calc()" aria-label="有效圈数"></div>
    </div>
    <div class="input-row">
      <div><label>自由长度 L₀ (mm)</label><input type="number" id="freeLen" value="40" step="1" min="1" oninput="calc()" aria-label="自由长度"></div>
      <div>
        <label>材料</label>
        <select id="springMat" onchange="onMatChange()">
          <option value="carbon" selected>碳素弹簧钢 (G=79GPa, τ=560)</option>
          <option value="music">琴钢丝 (G=79GPa, τ=640)</option>
          <option value="65Mn">65Mn (G=78GPa, τ=570)</option>
          <option value="304">不锈钢304 (G=73GPa, τ=440)</option>
          <option value="bronze">锡青铜 (G=44GPa, τ=320)</option>
          <option value="custom">自定义</option>
        </select>
      </div>
    </div>
    <div class="input-row" id="customMat" style="display:none;">
      <div><label>剪切模量 G (GPa)</label><input type="number" id="G" value="79" step="1" oninput="calc()"></div>
      <div><label>许用剪应力 τ (MPa)</label><input type="number" id="tauAllow" value="560" step="10" oninput="calc()"></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
    </div>
    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">💡 刚度 k=Gd⁴/(8D³n)；弹簧指数 C=D/d；Wahl系数 Kw=(4C-1)/(4C-4)+0.615/C；最大载荷 Fmax=τ·πd³/(8Kw·C)。</div>
  </div>
</div>

<script>
var MATS = {
  'carbon':  { G: 79, tau: 560 },
  'music':   { G: 79, tau: 640 },
  '65Mn':    { G: 78, tau: 570 },
  '304':     { G: 73, tau: 440 },
  'bronze':  { G: 44, tau: 320 }
};
function val(id){ var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function setInvalid(el, bad){ if(!el) return; el.classList.toggle('input-error', bad); }

function onMatChange(){
  var m = document.getElementById('springMat').value;
  document.getElementById('customMat').style.display = m === 'custom' ? '' : 'none';
  if(m !== 'custom'){
    document.getElementById('G').value = MATS[m].G;
    document.getElementById('tauAllow').value = MATS[m].tau;
  }
  calc();
}

function calc(){
  var type = document.querySelector('input[name="springType"]:checked').value;
  var d = val('wireDia'), D = val('coilDia'), n = val('activeCoils');
  var L0 = val('freeLen');
  var mat = document.getElementById('springMat').value;
  var G = (mat === 'custom' ? val('G') : MATS[mat].G) * 1000; // MPa
  var tauAllow = mat === 'custom' ? val('tauAllow') : MATS[mat].tau;

  setInvalid(document.getElementById('wireDia'), d <= 0);
  setInvalid(document.getElementById('coilDia'), D <= 0 || D <= d);
  setInvalid(document.getElementById('activeCoils'), n <= 0);
  if(d <= 0 || D <= 0 || D <= d || n <= 0){
    document.getElementById('res').innerHTML = '<p style="color:var(--danger);">参数无效：需 d>0, D>d, n>0</p>';
    return;
  }

  var C = D / d;                          // 弹簧指数
  var Kw = (4*C - 1)/(4*C - 4) + 0.615/C; // Wahl系数
  var fmt = function(n){ return n.toFixed(3); };

  var html = '<h3 style="margin-bottom:10px;">弹簧基本参数</h3>';
  html += '<div class="data-grid">';
  html += '<div class="data-card"><div class="num">' + fmt(C) + '</div><div class="label">弹簧指数 C</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(Kw) + '</div><div class="label">Wahl系数 Kw</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(D + d) + '</div><div class="label">外径 D₂ (mm)</div></div>';
  html += '<div class="data-card"><div class="num">' + fmt(D - d) + '</div><div class="label">内径 D₁ (mm)</div></div>';
  html += '</div>';

  if(type === 'torsion'){
    // 扭转弹簧：E=2G(1+ν), ν≈0.3 -> E≈2.6G
    var E = 2.6 * G;
    var kT = E * Math.pow(d, 4) / (10.8 * D * n); // N·mm/° (经验公式)
    var Mmax = tauAllow * Math.PI * Math.pow(d, 3) / 32; // 最大扭矩 N·mm (简化)
    var maxAngle = Mmax / kT; // °
    html += '<h3 style="margin:16px 0 8px;">扭转弹簧参数</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(kT) + '</div><div class="label">扭转刚度 kT (N·mm/°)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(Mmax) + '</div><div class="label">最大扭矩 Mmax (N·mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(maxAngle) + '°</div><div class="label">最大扭转角 (°)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(E/1000) + '</div><div class="label">弹性模量 E (GPa)</div></div>';
    html += '</div>';
  } else {
    // 压缩/拉伸弹簧
    var k = G * Math.pow(d, 4) / (8 * Math.pow(D, 3) * n); // N/mm
    var Fmax = tauAllow * Math.PI * Math.pow(d, 3) / (8 * Kw * C); // N
    var deltaMax = Fmax / k; // mm
    var solidLen = (n + 2) * d; // 压并长度（近似，端部磨平）
    var pitch = (L0 - 2 * d) / n; // 节距

    html += '<h3 style="margin:16px 0 8px;">' + (type==='compression'?'压缩':'拉伸') + '弹簧参数</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(k) + '</div><div class="label">弹簧刚度 k (N/mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(Fmax) + '</div><div class="label">最大载荷 Fmax (N)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(deltaMax) + '</div><div class="label">最大变形 δmax (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(pitch) + '</div><div class="label">节距 t (mm)</div></div>';
    html += '</div>';

    if(type === 'compression'){
      html += '<div class="data-grid" style="margin-top:8px;">';
      html += '<div class="data-card"><div class="num">' + fmt(solidLen) + '</div><div class="label">压并长度 Lb (mm)</div></div>';
      html += '<div class="data-card"><div class="num">' + fmt(L0 / D) + '</div><div class="label">长径比 L₀/D</div></div>';
      html += '</div>';

      // 屈曲校核
      var slenderness = L0 / D;
      if(slenderness > 4){
        html += '<div class="tip-box tip-error" style="margin-top:12px;">⛔ 长径比 ' + fmt(slenderness) + ' > 4，压缩弹簧易发生屈曲失稳，建议加导向杆或减小自由长度。</div>';
      } else if(slenderness > 3.7){
        html += '<div class="tip-box tip-warn" style="margin-top:12px;">⚠️ 长径比 ' + fmt(slenderness) + ' 接近临界值（两端固定建议≤5.3，一端固定一端铰接≤3.7），注意防屈曲。</div>';
      } else {
        html += '<div class="tip-box tip-success" style="margin-top:12px;">✓ 长径比 ' + fmt(slenderness) + ' 在安全范围内，不易屈曲。</div>';
      }

      // 工作行程校核
      if(deltaMax > L0 - solidLen){
        html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 最大变形量超过可用行程（L₀-Lb=' + fmt(L0-solidLen) + 'mm），弹簧可能被压并。</div>';
      }
    } else {
      html += '<div class="tip-box tip-info" style="margin-top:12px;">ℹ️ 拉伸弹簧无需屈曲校核。初拉力通常为 F₀=(0.2~0.3)Fmax。</div>';
    }
  }

  // 弹簧指数评价
  if(C < 4){
    html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 弹簧指数 C=' + fmt(C) + ' 偏小（<4），卷制困难，内侧应力过大。</div>';
  } else if(C > 16){
    html += '<div class="tip-box tip-warn" style="margin-top:8px;">⚠️ 弹簧指数 C=' + fmt(C) + ' 偏大（>16），弹簧易松弛，稳定性差。</div>';
  } else {
    html += '<div class="tip-box tip-success" style="margin-top:8px;">✓ 弹簧指数 C=' + fmt(C) + ' 在推荐范围 4~16 内。</div>';
  }

  document.getElementById('res').innerHTML = html;
}

function copyRes(){
  var text = document.getElementById('res').innerText;
  if(!text.trim()){ ToolBox.showToast(i18nText(),'warning'); return; }
  ToolBox.copyText(text);
}
calc();
</script>
</body>
