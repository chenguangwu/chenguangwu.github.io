<body>
<h1 class="sr-only">焊接计算（角焊缝/坡口）</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 焊接计算（角焊缝/坡口）</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

  <span class="bc-sep">‹</span>
  <span class="bc-current">焊接计算（角焊缝/坡口）</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#FF6B35;">
    <h2 data-zh="🔥 焊接计算（角焊缝/坡口）">🔥 Welding Calculate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;" data-zh="角焊缝/对接焊缝/点焊强度与许用载荷计算">Welding Calculate is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">焊缝强度 = 焊脚×长度×强度</div>
      <p class="formula-desc">角焊缝/对接焊缝/点焊强度与许用载荷计算</p>
    </div>

    <div class="checkbox-row">
      <label><input type="radio" name="weldType" value="fillet" checked onchange="calc()"> 角焊缝</label>
      <label><input type="radio" name="weldType" value="butt" onchange="calc()"> 对接焊缝（坡口）</label>
      <label><input type="radio" name="weldType" value="spot" onchange="calc()"> 点焊</label>
    </div>

    <div class="input-row">
      <div><label>板厚 t (mm)</label><input type="number" id="plateThk" value="8" step="0.5" min="1" oninput="calc()" aria-label="板厚"></div>
      <div id="weldSizeWrap"><label>焊脚尺寸 K (mm)</label><input type="number" id="weldSize" value="6" step="0.5" min="1" oninput="calc()" aria-label="焊脚尺寸"></div>
      <div><label>焊缝长度 L (mm)</label><input type="number" id="weldLen" value="100" step="5" min="1" oninput="calc()" aria-label="焊缝长度"></div>
    </div>
    <div class="input-row">
      <div><label>施加载荷 F (kN)</label><input type="number" id="load" value="20" step="1" min="0" oninput="calc()" aria-label="施加载荷"></div>
      <div>
        <label>材料/焊条</label>
        <select id="weldMat" onchange="calc()">
          <option value="E43" selected>E43系列（σb=430, 匹配Q235）</option>
          <option value="E50">E50系列（σb=490, 匹配Q345）</option>
          <option value="E60">E60系列（σb=590, 匹配Q390）</option>
          <option value="custom">自定义</option>
        </select>
      </div>
    </div>
    <div class="input-row" id="customMat" style="display:none;">
      <div><label>焊缝抗拉强度 σb (MPa)</label><input type="number" id="sb" value="430" step="10" oninput="calc()"></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
    </div>
    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">💡 角焊缝喉厚 a=0.707K，有效面积 A=a·L；对接焊缝按板厚计算。许用剪应力 [τ]≈0.4σb（AWS D1.1）。</div>
  </div>
</div>

<script>
var MATS = { 'E43': 430, 'E50': 490, 'E60': 590 };
function val(id){ var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function setInvalid(el, bad){ if(!el) return; el.classList.toggle('input-error', bad); }

function calc(){
  var type = document.querySelector('input[name="weldType"]:checked').value;
  var t = val('plateThk'), K = val('weldSize'), L = val('weldLen'), F = val('load') * 1000; // N
  var mat = document.getElementById('weldMat').value;
  var sb = mat === 'custom' ? val('sb') : MATS[mat];

  document.getElementById('customMat').style.display = mat === 'custom' ? '' : 'none';
  document.getElementById('weldSizeWrap').style.display = type === 'spot' ? 'none' : '';

  setInvalid(document.getElementById('plateThk'), t <= 0);
  setInvalid(document.getElementById('weldLen'), L <= 0);
  if(t <= 0 || L <= 0){ document.getElementById('res').innerHTML = '<p style="color:var(--danger);">请输入有效参数</p>'; return; }

  var fmt = function(n){ return n.toFixed(2); };
  var tauAllow = 0.4 * sb; // 许用剪应力
  var sigAllow = 0.6 * sb; // 许用拉应力（对接）
  var html = '';

  if(type === 'fillet'){
    // 角焊缝
    var a = 0.707 * K;       // 喉厚
    var area = a * L;          // 有效面积 mm²
    var tau = F / area;        // 剪应力 MPa
    var Fallow = tauAllow * area; // 许用载荷 N

    html += '<h3 style="margin-bottom:10px;">角焊缝计算结果</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(a) + '</div><div class="label">喉厚 a (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(area) + '</div><div class="label">有效面积 A (mm²)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(tau) + '</div><div class="label">剪应力 τ (MPa)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(Fallow/1000) + '</div><div class="label">许用载荷 (kN)</div></div>';
    html += '</div>';

    // 焊脚尺寸校核
    if(K < 0.7 * t){
      html += '<div class="tip-box tip-warn" style="margin-top:12px;">⚠️ 焊脚 K=' + fmt(K) + 'mm 小于最小推荐值 0.7t=' + fmt(0.7*t) + 'mm，承载可能不足。</div>';
    } else if(K > 1.2 * t){
      html += '<div class="tip-box tip-warn" style="margin-top:12px;">⚠️ 焊脚 K=' + fmt(K) + 'mm 大于板厚 ' + fmt(1.2*t) + 'mm，过大易烧穿。</div>';
    } else {
      html += '<div class="tip-box tip-success" style="margin-top:12px;">✓ 焊脚尺寸在合理范围（0.7t ~ t）。</div>';
    }

  } else if(type === 'butt'){
    // 对接焊缝（全熔透）
    var area = t * L;
    var sigma = F / area; // 拉应力 MPa
    var Fallow = sigAllow * area;

    html += '<h3 style="margin-bottom:10px;">对接焊缝计算结果（全熔透）</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(t) + '</div><div class="label">喉厚 a=t (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(area) + '</div><div class="label">焊缝面积 A (mm²)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(sigma) + '</div><div class="label">拉应力 σ (MPa)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(Fallow/1000) + '</div><div class="label">许用载荷 (kN)</div></div>';
    html += '</div>';
    html += '<div class="tip-box tip-info" style="margin-top:12px;">ℹ️ 全熔透对接焊缝按母材等强计算，许用拉应力 [σ]≈0.6σb。</div>';

  } else {
    // 点焊
    var spotDia = 5 * Math.sqrt(t); // 推荐焊点直径 mm
    var spotsPerArea = L / (4 * spotDia); // 沿长度可布点数（间距4d）
    var nSpots = Math.floor(spotsPerArea);
    if(nSpots < 1) nSpots = 1;
    var spotArea = Math.PI * spotDia * spotDia / 4; // 单点面积
    var tauPerSpot = F / (nSpots * spotArea); // 每点剪应力
    var FallowSpot = tauAllow * nSpots * spotArea;

    html += '<h3 style="margin-bottom:10px;">点焊计算结果</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(spotDia) + '</div><div class="label">焊点直径 d (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + nSpots + '</div><div class="label">焊点数量</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(spotArea) + '</div><div class="label">单点面积 (mm²)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(tauPerSpot) + '</div><div class="label">单点剪应力 (MPa)</div></div>';
    html += '</div>';
    html += '<div class="data-grid" style="margin-top:8px;">';
    html += '<div class="data-card"><div class="num">' + fmt(FallowSpot/1000) + '</div><div class="label">许用载荷 (kN)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(4*spotDia) + '</div><div class="label">推荐点距 (mm)</div></div>';
    html += '</div>';
    html += '<div class="tip-box tip-info" style="margin-top:12px;">ℹ️ 推荐焊点直径 d=5√t，点距≈4d。适用于薄板搭接（t≤3mm）。</div>';
  }

  // 应力校核
  var stress = 0, allowStress = 0, stressName = '';
  if(type === 'fillet'){ stress = F / (0.707 * K * L); allowStress = tauAllow; stressName = '剪应力'; }
  else if(type === 'butt'){ stress = F / (t * L); allowStress = sigAllow; stressName = '拉应力'; }
  else { stress = F / (nSpots * Math.PI * 25 * t / 4); allowStress = tauAllow; stressName = '单点剪应力'; }

  if(stress > allowStress){
    html += '<div class="tip-box tip-error" style="margin-top:8px;">⛔ ' + stressName + ' ' + fmt(stress) + ' MPa 超过许用值 ' + fmt(allowStress) + ' MPa，焊缝强度不足！</div>';
  } else {
    var ratio = stress / allowStress * 100;
    html += '<div class="tip-box tip-success" style="margin-top:8px;">✓ ' + stressName + ' ' + fmt(stress) + ' MPa ≤ 许用值 ' + fmt(allowStress) + ' MPa（利用率 ' + fmt(ratio) + '%）。</div>';
  }

  document.getElementById('res').innerHTML = html;
}

function copyRes(){
  var text = document.getElementById('res').innerText;
  if(!text.trim()){ ToolBox.showToast(i18nText(),'warning'); return; }
  ToolBox.copyText(text);
}
calc();
</script>
</body>
</html>
