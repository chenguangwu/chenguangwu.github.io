<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#F59E0B;--tool-accent-dark:#F59E0B;">
    <h2>🔩 螺纹识别（公制/美制）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">输入外径与螺距（或TPI），自动匹配标准螺纹规格</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">螺纹识别 = 参数查表</div>
      <p class="formula-desc">输入外径与螺距（或TPI），自动匹配标准螺纹规格</p>
    </div>

    <div class="checkbox-row">
      <label><input type="radio" name="pitchMode" value="metric" checked onchange="onModeChange()"> 螺距 (mm)</label>
      <label><input type="radio" name="pitchMode" value="tpi" onchange="onModeChange()"> 每英寸牙数 (TPI)</label>
    </div>

    <div class="input-row">
      <div><label>外径/大径 (mm)</label><input type="number" id="diameter" value="10" step="0.01" min="0.5" oninput="calc()" aria-label="外径"></div>
      <div id="pitchWrap"><label>螺距 P (mm)</label><input type="number" id="pitch" value="1.5" step="0.05" min="0.1" oninput="calc()" aria-label="螺距"></div>
      <div id="tpiWrap" style="display:none;"><label>每英寸牙数 (TPI)</label><input type="number" id="tpi" value="14" step="1" min="1" oninput="calc()" aria-label="TPI"></div>
    </div>
    <div class="input-row">
      <div>
        <label>牙型角</label>
        <select id="threadAngle" onchange="calc()">
          <option value="0" selected>自动判断</option>
          <option value="60">60°（公制/美制）</option>
          <option value="55">55°（英制惠氏）</option>
          <option value="30">30°（梯形/管螺纹）</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🔍 识别</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
    </div>
    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">💡 公制螺纹牙型角60°，螺距用mm；英制惠氏螺纹牙型角55°，用TPI；美制UN螺纹牙型角60°，用TPI。</div>
  </div>

  <div class="card">
    <h3>常用公制粗牙螺纹规格</h3>
    <table style="font-size:12px;">
      <thead><tr><th>规格</th><th>M3</th><th>M4</th><th>M5</th><th>M6</th><th>M8</th><th>M10</th><th>M12</th><th>M14</th><th>M16</th><th>M20</th><th>M24</th><th>M30</th></tr></thead>
      <tbody><tr><td>螺距mm</td><td>0.5</td><td>0.7</td><td>0.8</td><td>1.0</td><td>1.25</td><td>1.5</td><td>1.75</td><td>2.0</td><td>2.0</td><td>2.5</td><td>3.0</td><td>3.5</td></tr></tbody>
    </table>
  </div>

<script>
// 螺纹数据库: [代号, 外径mm, 螺距mm, 牙型角, 类型]
var THREADS = [
  // 公制粗牙 M
  ['M1', 1.0, 0.25, 60, '公制粗牙'], ['M1.2', 1.2, 0.25, 60, '公制粗牙'],
  ['M1.6', 1.6, 0.35, 60, '公制粗牙'], ['M2', 2.0, 0.4, 60, '公制粗牙'],
  ['M2.5', 2.5, 0.45, 60, '公制粗牙'], ['M3', 3.0, 0.5, 60, '公制粗牙'],
  ['M3.5', 3.5, 0.6, 60, '公制粗牙'], ['M4', 4.0, 0.7, 60, '公制粗牙'],
  ['M5', 5.0, 0.8, 60, '公制粗牙'], ['M6', 6.0, 1.0, 60, '公制粗牙'],
  ['M8', 8.0, 1.25, 60, '公制粗牙'], ['M10', 10.0, 1.5, 60, '公制粗牙'],
  ['M12', 12.0, 1.75, 60, '公制粗牙'], ['M14', 14.0, 2.0, 60, '公制粗牙'],
  ['M16', 16.0, 2.0, 60, '公制粗牙'], ['M18', 18.0, 2.5, 60, '公制粗牙'],
  ['M20', 20.0, 2.5, 60, '公制粗牙'], ['M22', 22.0, 2.5, 60, '公制粗牙'],
  ['M24', 24.0, 3.0, 60, '公制粗牙'], ['M27', 27.0, 3.0, 60, '公制粗牙'],
  ['M30', 30.0, 3.5, 60, '公制粗牙'], ['M33', 33.0, 3.5, 60, '公制粗牙'],
  ['M36', 36.0, 4.0, 60, '公制粗牙'], ['M39', 39.0, 4.0, 60, '公制粗牙'],
  ['M42', 42.0, 4.5, 60, '公制粗牙'], ['M45', 45.0, 4.5, 60, '公制粗牙'],
  ['M48', 48.0, 5.0, 60, '公制粗牙'],
  // 公制细牙 MF (部分常用)
  ['M8×1', 8.0, 1.0, 60, '公制细牙'], ['M10×1.25', 10.0, 1.25, 60, '公制细牙'],
  ['M10×1', 10.0, 1.0, 60, '公制细牙'], ['M12×1.5', 12.0, 1.5, 60, '公制细牙'],
  ['M12×1.25', 12.0, 1.25, 60, '公制细牙'], ['M14×1.5', 14.0, 1.5, 60, '公制细牙'],
  ['M16×1.5', 16.0, 1.5, 60, '公制细牙'], ['M20×1.5', 20.0, 1.5, 60, '公制细牙'],
  ['M20×2', 20.0, 2.0, 60, '公制细牙'], ['M24×2', 24.0, 2.0, 60, '公制细牙'],
  ['M30×2', 30.0, 2.0, 60, '公制细牙'],
  // UNC (粗牙)
  ['#4-40 UNC', 2.845, 0.635, 60, '美制粗牙'], ['#6-32 UNC', 3.505, 0.794, 60, '美制粗牙'],
  ['#8-32 UNC', 4.166, 0.794, 60, '美制粗牙'], ['#10-24 UNC', 4.826, 1.058, 60, '美制粗牙'],
  ['1/4-20 UNC', 6.350, 1.270, 60, '美制粗牙'], ['5/16-18 UNC', 7.938, 1.411, 60, '美制粗牙'],
  ['3/8-16 UNC', 9.525, 1.588, 60, '美制粗牙'], ['7/16-14 UNC', 11.113, 1.814, 60, '美制粗牙'],
  ['1/2-13 UNC', 12.700, 1.954, 60, '美制粗牙'], ['9/16-12 UNC', 14.288, 2.117, 60, '美制粗牙'],
  ['5/8-11 UNC', 15.875, 2.309, 60, '美制粗牙'], ['3/4-10 UNC', 19.050, 2.540, 60, '美制粗牙'],
  ['7/8-9 UNC', 22.225, 2.822, 60, '美制粗牙'], ['1-8 UNC', 25.400, 3.175, 60, '美制粗牙'],
  // UNF (细牙)
  ['#4-48 UNF', 2.845, 0.529, 60, '美制细牙'], ['#6-40 UNF', 3.505, 0.635, 60, '美制细牙'],
  ['#8-36 UNF', 4.166, 0.706, 60, '美制细牙'], ['#10-32 UNF', 4.826, 0.794, 60, '美制细牙'],
  ['1/4-28 UNF', 6.350, 0.907, 60, '美制细牙'], ['5/16-24 UNF', 7.938, 1.058, 60, '美制细牙'],
  ['3/8-24 UNF', 9.525, 1.058, 60, '美制细牙'], ['7/16-20 UNF', 11.113, 1.270, 60, '美制细牙'],
  ['1/2-20 UNF', 12.700, 1.270, 60, '美制细牙'], ['9/16-18 UNF', 14.288, 1.411, 60, '美制细牙'],
  ['5/8-18 UNF', 15.875, 1.411, 60, '美制细牙'], ['3/4-16 UNF', 19.050, 1.588, 60, '美制细牙'],
  ['7/8-14 UNF', 22.225, 1.814, 60, '美制细牙'], ['1-12 UNF', 25.400, 2.117, 60, '美制细牙'],
  // BSW (惠氏粗牙, 55°)
  ['1/8-40 BSW', 3.175, 0.635, 55, '英制粗牙'], ['3/16-24 BSW', 4.763, 1.058, 55, '英制粗牙'],
  ['1/4-20 BSW', 6.350, 1.270, 55, '英制粗牙'], ['5/16-18 BSW', 7.938, 1.411, 55, '英制粗牙'],
  ['3/8-16 BSW', 9.525, 1.588, 55, '英制粗牙'], ['7/16-14 BSW', 11.113, 1.814, 55, '英制粗牙'],
  ['1/2-12 BSW', 12.700, 2.117, 55, '英制粗牙'], ['5/8-11 BSW', 15.875, 2.309, 55, '英制粗牙'],
  ['3/4-10 BSW', 19.050, 2.540, 55, '英制粗牙'], ['1-8 BSW', 25.400, 3.175, 55, '英制粗牙'],
  // BSF (惠氏细牙, 55°)
  ['3/16-32 BSF', 4.763, 0.794, 55, '英制细牙'], ['1/4-26 BSF', 6.350, 0.977, 55, '英制细牙'],
  ['5/16-22 BSF', 7.938, 1.154, 55, '英制细牙'], ['3/8-20 BSF', 9.525, 1.270, 55, '英制细牙'],
  ['7/16-18 BSF', 11.113, 1.411, 55, '英制细牙'], ['1/2-16 BSF', 12.700, 1.588, 55, '英制细牙'],
  ['5/8-14 BSF', 15.875, 1.814, 55, '英制细牙'], ['3/4-12 BSF', 19.050, 2.117, 55, '英制细牙']
];

function val(id){ var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function setInvalid(el, bad){ if(!el) return; el.classList.toggle('input-error', bad); }

function onModeChange(){
  var mode = document.querySelector('input[name="pitchMode"]:checked').value;
  document.getElementById('pitchWrap').style.display = mode === 'metric' ? '' : 'none';
  document.getElementById('tpiWrap').style.display = mode === 'tpi' ? '' : 'none';
  calc();
}

function calc(){
  var dia = val('diameter');
  var mode = document.querySelector('input[name="pitchMode"]:checked').value;
  var pitch = mode === 'metric' ? val('pitch') : 25.4 / val('tpi');
  var angleSel = parseInt(document.getElementById('threadAngle').value);
  var tpi = mode === 'tpi' ? val('tpi') : (pitch > 0 ? 25.4 / pitch : 0);

  setInvalid(document.getElementById('diameter'), dia <= 0);
  if(dia <= 0 || pitch <= 0){ document.getElementById('res').innerHTML = '<p style="color:var(--danger);">请输入有效参数</p>'; return; }

  // 匹配：外径差 ≤0.3mm, 螺距差 ≤0.05mm
  var matches = [];
  var tolDia = 0.35;
  var tolPitch = 0.06;

  for(var i = 0; i < THREADS.length; i++){
    var t = THREADS[i];
    var diaDiff = Math.abs(t[1] - dia);
    var pitchDiff = Math.abs(t[2] - pitch);
    if(diaDiff <= tolDia && pitchDiff <= tolPitch){
      // 牙型角过滤
      if(angleSel !== 0 && t[3] !== angleSel) continue;
      var score = diaDiff + pitchDiff * 3;
      matches.push({ code: t[0], dia: t[1], pitch: t[2], angle: t[3], type: t[4], score: score });
    }
  }

  // 按匹配度排序
  matches.sort(function(a, b){ return a.score - b.score; });

  var fmt = function(n){ return n.toFixed(3); };
  var html = '';

  if(matches.length === 0){
    html += '<div class="tip-box tip-warn">未找到完全匹配的标准螺纹，可能为非标螺纹。以下是相近规格：</div>';
    // 找最接近的
    var best = null, bestScore = Infinity;
    for(var i = 0; i < THREADS.length; i++){
      var t = THREADS[i];
      var score = Math.abs(t[1] - dia) + Math.abs(t[2] - pitch) * 2;
      if(angleSel !== 0 && t[3] !== angleSel) score += 100;
      if(score < bestScore){ bestScore = score; best = t; }
    }
    if(best){
      html += '<div class="data-grid" style="margin-top:8px;">';
      html += '<div class="data-card"><div class="num">' + best[0] + '</div><div class="label">最接近规格</div></div>';
      html += '<div class="data-card"><div class="num">' + fmt(best[1]) + '</div><div class="label">标准外径 (mm)</div></div>';
      html += '<div class="data-card"><div class="num">' + fmt(best[2]) + '</div><div class="label">标准螺距 (mm)</div></div>';
      html += '<div class="data-card"><div class="num">' + best[3] + '°</div><div class="label">牙型角</div></div>';
      html += '</div>';
    }
  } else {
    var best = matches[0];
    var gradeClass = best.score < 0.1 ? 'grade-excellent' : 'grade-good';
    var matchLabel = best.score < 0.1 ? '精确匹配' : '近似匹配';

    html += '<div style="text-align:center;margin-bottom:12px;"><span class="grade-tag ' + gradeClass + '" style="font-size:18px;padding:8px 24px;">' + best.code + '</span></div>';
    html += '<p style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:12px;">' + matchLabel + ' · ' + best.type + ' · 牙型角 ' + best.angle + '°</p>';

    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(best.dia) + '</div><div class="label">标准外径 (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(best.pitch) + '</div><div class="label">标准螺距 (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + (25.4 / best.pitch).toFixed(1) + '</div><div class="label">TPI</div></div>';
    html += '<div class="data-card"><div class="num">' + best.angle + '°</div><div class="label">牙型角</div></div>';
    html += '</div>';

    // 计算中径、小径
    var H = best.pitch / (2 * Math.tan(best.angle * Math.PI / 360)); // 牙型高度
    var d2 = best.dia - 0.75 * H * Math.cos(best.angle * Math.PI / 360); // 近似中径
    var d1 = best.dia - 1.0825 * best.pitch; // 小径(近似,60°)
    if(best.angle === 55){
      d1 = best.dia - 0.64 * best.pitch * 2; // 惠氏近似
    }

    html += '<h3 style="margin:16px 0 8px;">螺纹参数</h3>';
    html += '<div class="data-grid">';
    html += '<div class="data-card"><div class="num">' + fmt(d2) + '</div><div class="label">中径 d₂ (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(d1) + '</div><div class="label">小径 d₁ (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(H) + '</div><div class="label">牙型高度 H (mm)</div></div>';
    html += '<div class="data-card"><div class="num">' + fmt(dia - best.dia) + '</div><div class="label">外径偏差 (mm)</div></div>';
    html += '</div>';

    // 其他匹配
    if(matches.length > 1){
      html += '<h3 style="margin:16px 0 8px;">其他可能匹配</h3>';
      html += '<table><thead><tr><th>规格</th><th>类型</th><th>外径mm</th><th>螺距mm</th><th>牙型角</th></tr></thead><tbody>';
      for(var i = 1; i < Math.min(matches.length, 6); i++){
        var m = matches[i];
        html += '<tr><td>' + m.code + '</td><td>' + m.type + '</td><td>' + fmt(m.dia) + '</td><td>' + fmt(m.pitch) + '</td><td>' + m.angle + '°</td></tr>';
      }
      html += '</tbody></table>';
    }
  }

  document.getElementById('res').innerHTML = html;
}

function copyRes(){
  var text = document.getElementById('res').innerText;
  if(!text.trim()){ ToolBox.showToast(i18nText(),'warning'); return; }
  ToolBox.copyText(text);
}
calc();
</script>
</body>
