</nav>
<div class="container">
  <div class="card">
    <h2>🏠 租房回报率计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按购入价和月租金估算年化回报与回本周期。</p>

    <div class="input-row">
      <label>房产总价（元）</label>
      <input type="number" id="price" value="1200000" min="0" step="100" oninput="calc()">
    </div>
    <div class="input-row">
      <label>月租金（元）</label>
      <input type="number" id="rent" value="4500" min="0" step="1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>每年持有成本（税费/维修等，元）</label>
      <input type="number" id="cost" value="15000" min="0" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算回报</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const price = parseFloat(document.getElementById('price').value) || 0;
  const rent = parseFloat(document.getElementById('rent').value) || 0;
  const cost = parseFloat(document.getElementById('cost').value) || 0;

  if (price <= 0) {
    document.getElementById('result').innerHTML = '<p>请输入有效总价</p>';
    return;
  }

  const annualRent = rent * 12;
  const netIncome = annualRent - cost;
  const yrd = (netIncome / price) * 100;
  const payback = netIncome > 0 ? price / netIncome : Infinity;

  document.getElementById('result').innerHTML =
    `<p>年租金收入：<strong>${annualRent.toFixed(2)} 元</strong></p>` +
    `<p>年净收益：<strong>${netIncome.toFixed(2)} 元</strong></p>` +
    `<p>年化回报率（税前）：<strong style="color:var(--primary)">${yrd.toFixed(2)}%</strong></p>` +
    `<p>回本年限：<strong>${Number.isFinite(payback) ? payback.toFixed(1) + ' 年' : '无法收回（净收益<=0）'}</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText(), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

calc();
</script>
