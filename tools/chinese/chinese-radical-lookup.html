<div class="container">
  <div class="card">
    <h2 data-zh="🔤 偏旁部首查询">🔤 Chinese Radical Lookup</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入汉字，展示常见部首与结构参考（静态离线）。">Look up Chinese radicals for a given character quickly.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本速查内容依据权威标准与公开资料整理，供快速查阅参考；具体数值以官方最新发布为准。 工具名称：偏旁部首查询。</p>
</div>


    <div class="input-row">
      <label>汉字（支持单字）</label>
      <input type="text" id="char" maxlength="2" placeholder="例如：你" oninput="query()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="query()">查询</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const DATA = {
  '你': ['亻', '人字旁', 2, '表意:你', 'nǐ', '你'],
  '爱': ['爪', '毛', 4, '心字旁（传统作心/忄）', 'ài', '爱'],
  '国': ['囗', '围合', 8, '宝盖头', 'guó', '国'],
  '学': ['冖', '冠', 8, '子女', 'xué', '学'],
  '欢': ['欠', '心', 7, '单人头', 'huān', '欢'],
  '休': ['亻', '人', 6, '人立', 'xiū', '休'],
  '明': ['日', '月', 8, '日月', 'míng', '明'],
  '河': ['氵', '三点水', 8, '水流', 'hé', '河'],
  '飞': ['飞', '攴', 3, '点撇', 'fēi', '飞'],
  '树': ['木', '木', 9, '树', 'shù', '树'],
  '电': ['雨', '雷', 5, '雷电', 'diàn', '电'],
  '鱼': ['鱼', '食', 11, '鱼尾', 'yú', '鱼'],
  '笑': ['竹', '口', 10, '竹头口', 'xiào', '笑'],
  '海': ['氵', '三点水', 10, '水', 'hǎi', '海'],
  '想': ['心', '相想', 13, '心字头', 'xiǎng', '想'],
  '话': ['讠', '言', 8, '言语', 'huà', '话'],
  '听': ['讠', '言', 7, '言音', 'tīng', '听'],
  '快': ['忄', '心', 7, '心情', 'kuài', '快'],
  '红': ['纟', '糸', 6, '丝线', 'hóng', '红'],
  '谢': ['讠', '言', 12, '言谢', 'xiè', '谢'],
  '静': ['青', '青', 14, '青字头', 'jìng', '静']
};

function query() {
  const c = (document.getElementById('char').value || '').trim().slice(0, 1);
  if (!c) {
    document.getElementById('result').innerHTML = '<p>请输入一个汉字进行查询</p>';
    return;
  }

  const d = DATA[c];
  if (!d) {
    document.getElementById('result').innerHTML = `<p>未收录「${c}」，你可以提交 PR 补充更多常用字</p>`;
    return;
  }

  document.getElementById('result').innerHTML =
    `<p>字形：<strong>${d[4]}</strong>（${d[5]}）</p>` +
    `<p>部首：<strong>${d[0]}</strong> / ${d[1]}</p>` +
    `<p>总笔画：<strong>${d[2]}</strong></p>` +
    `<p>读音：<strong>${d[3]}</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg636'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('toast.copy_success'));
}

query();
</script>
