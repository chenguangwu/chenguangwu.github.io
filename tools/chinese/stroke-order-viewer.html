<div class="container">
  <div class="card">
    <h2>✍️ 笔画笔顺演示</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">本地静态示例版：支持常见常用字笔顺与结构提示。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本速查内容依据权威标准与公开资料整理，供快速查阅参考；具体数值以官方最新发布为准。 工具名称：笔画笔顺演示。</p>
</div>

    <div class="input-row">
      <label>输入单字</label>
      <input type="text" id="word" maxlength="1" value="永" oninput="render()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="render()">查看笔顺</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="stroke-box" id="out"></div>
  </div>
</div>

<script>
const STROKES = {
  永: ['点','横','撇','点','捺','折','点','捺','（8画）'],
  我: ['撇','点','横折钩','竖钩','点','（5画）'],
  好: ['点','横折','竖提','撇','点','捺','（6画）'],
  学: ['点','横','竖','横','撇','捺','横','点','点','捺','（11画）'],
  生: ['竖','点','横','撇','撇','横','（5画）'],
  中: ['一','丨','人字','丨','（4画）'],
  爱: ['横','弯钩','横折','点','横','点','横','横','点','（9画）'],
  想: ['点','横','横','撇','点','捺','（13画）']
};

function render() {
  const w = (document.getElementById('word').value || '').trim().slice(0,1);
  if (!w) {
    document.getElementById('out').innerHTML = '<p>请输入一个汉字</p>';
    return;
  }
  const arr = STROKES[w];
  if (!arr) {
    document.getElementById('out').innerHTML = `<p>${w} 未收录笔顺，可先按拼音/部首分解辅助书写。</p>`;
    return;
  }
  let html = `<p><strong>字：</strong>${w}</p>`;
  arr.forEach((s, i) => {
    html += `<div class="stroke">${i + 1}. ${s}</div>`;
  });
  html += '<p style="margin-top:8px;color:var(--text-muted);">提示：真实笔顺依字形字体可能存在差异，结果供学习参考。</p>';
  document.getElementById('out').innerHTML = html;
}

function copyResult() {
  const text = document.getElementById('out').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg651'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('toast.copy_success'));
}

render();
</script>
