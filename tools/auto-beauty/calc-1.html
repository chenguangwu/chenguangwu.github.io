<div class='container'>
  <div class='card'>
    <h2>✨ 镀晶/打蜡周期</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算基于标准数学定义与运算规则，结果按计算精度实时输出。 工具名称：镀晶/打蜡周期 - 汽车美容在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>选择汽车美容项目，输入上次护理日期，计算建议的下次护理时间与剩余天数。</p>
    <div class='input-row'>
      <div>
        <label for='project'>护理项目</label>
        <select id='project'>
          <option value='wax' data-months='3'>打蜡</option>
          <option value='seal' data-months='6'>封釉</option>
          <option value='coat' data-months='12' selected>镀晶</option>
          <option value='film' data-months='24'>隐形车衣护理</option>
          <option value='ceramic' data-months='12'>陶瓷镀膜</option>
        </select>
      </div>
      <div>
        <label for='lastDate'>上次护理日期</label>
        <input type='date' id='lastDate'>
      </div>
      <div>
        <label for='months'>建议周期（月）</label>
        <input type='number' id='months' value='12' min='1' step='1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请选择项目并输入日期。</p></div>
    <div class='info-box' style='margin-top:12px;'>周期仅供参考，实际应结合用车环境、停车条件与产品说明调整。长期户外停放建议适当缩短周期。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_beauty_cycle';
  function getMonthsFromProject(){
    const opt = ToolBox.$('project').selectedOptions[0];
    return parseInt(opt.getAttribute('data-months'), 10) || 12;
  }
  function setMonths(){
    ToolBox.$('months').value = getMonthsFromProject();
  }
  function addMonths(date, months){
    const d = new Date(date);
    d.setMonth(d.getMonth() + months);
    return d;
  }
  function formatDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function calculate(){
    const last = ToolBox.$('lastDate').value;
    const months = parseInt(ToolBox.$('months').value, 10) || 0;
    const el = ToolBox.$('result');
    if(!last || months <= 0){
      el.innerHTML = '<p style="color:var(--danger)">请选择日期并输入有效周期。</p>';
      return;
    }
    const lastDate = new Date(last);
    const nextDate = addMonths(lastDate, months);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((nextDate - today) / 86400000);
    let status = '';
    if(diffDays < 0) status = '<p style="color:var(--danger)">⚠️ 已逾期 ' + Math.abs(diffDays) + ' 天，建议尽快护理</p>';
    else if(diffDays <= 7) status = '<p style="color:var(--warning)">⏰ 即将到期，建议提前安排</p>';
    else status = '<p style="color:var(--success)">✅ 尚在使用周期内</p>';
    el.innerHTML =
      '<p>建议下次护理日期：<strong>' + formatDate(nextDate) + '</strong></p>' +
      '<p>距离下次护理：<strong>' + diffDays + '</strong> 天</p>' + status;
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请选择') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        project: ToolBox.$('project').value,
        last: ToolBox.$('lastDate').value,
        months: ToolBox.$('months').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.project) ToolBox.$('project').value = data.project;
      if(data.last) ToolBox.$('lastDate').value = data.last;
      else ToolBox.$('lastDate').value = formatDate(new Date());
      if(data.months) ToolBox.$('months').value = data.months;
      else setMonths();
    }catch(e){
      ToolBox.$('lastDate').value = formatDate(new Date());
      setMonths();
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    ToolBox.$('project').addEventListener('change', function(){ setMonths(); calculate(); });
    ['lastDate','months'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 200));
    });
    calculate();
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
