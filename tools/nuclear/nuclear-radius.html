<div class="container">
  <div class="card">
    <h2>由质量数求核半径</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入质量数 A，求原子核半径（r₀=1.2 fm）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = r₀·A^{1/3}, r₀≈1.2 fm</div>
      <p class="formula-desc">输入质量数 A，求原子核半径（r₀=1.2 fm）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="A">质量数 A</label>
        <input type="number" id="A" value="56" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R = r₀A^{1/3}，r₀≈1.2 fm。</li>
        <li>Fe-56 → 约 4.59 fm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const r0=1.2e-15;
            const A=num('A');
            const R=r0*Math.cbrt(A);
            ToolBox.setResult('result', dataGrid([
                [(R*1e15).toFixed(3),'核半径 R (fm)']
            ]));
        }
function resetForm(){document.getElementById('A').value = '56';
      calcTool();}
calcTool();
</script>
