<div class="container">
  <div class="card">
    <h2 data-zh="由初始与现存活度求年龄">Age from Activity</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入衰变常数 λ、初始核数 N₀ 与现存核数 N，求年龄。">Age from Activity is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t = (1/λ)·ln(N₀/N)。 C-14 减半 → 约 5730 年。</div>
      <p class="formula-desc">输入衰变常数 λ、初始核数 N₀ 与现存核数 N，求年龄。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="lam">衰变常数 λ (1/s)</label>
        <input type="number" id="lam" value="3.833e-12" step="1e-13">
      </div>
      <div>
        <label for="N0">初始核数 N₀</label>
        <input type="number" id="N0" value="1e20" step="1e19">
      </div>
      <div>
        <label for="N">现存核数 N</label>
        <input type="number" id="N" value="5e19" step="1e19">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>t = (1/λ)·ln(N₀/N)。</li>
        <li>C-14 减半 → 约 5730 年。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const lam=num('lam'),N0=num('N0'),N=num('N');
            const t=(1/lam)*Math.log(N0/N);
            ToolBox.setResult('result', dataGrid([
                [(t/3.156e7).toFixed(0),'年龄 t (年)']
            ]));
        }
function resetForm(){document.getElementById('lam').value = '3.833e-12';
      document.getElementById('N0').value = '1e20';
      document.getElementById('N').value = '5e19';
      calcTool();}
calcTool();
</script>
