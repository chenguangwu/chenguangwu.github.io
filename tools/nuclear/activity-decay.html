<div class="container">
  <div class="card">
    <h2>A = A₀·e^(−λt)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">初始活度随时间衰减。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A = A₀e^(−λt)。 活度衰减与核数同步。</div>
      <p class="formula-desc">初始活度随时间衰减。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a0">初始活度 A₀ (Bq)</label>
        <input type="number" id="a0" value="100" step="1">
      </div>
      <div>
        <label for="lam">衰变常数 λ (年⁻¹)</label>
        <input type="number" id="lam" value="0.001" step="0.0001">
      </div>
      <div>
        <label for="t">时间 t (年)</label>
        <input type="number" id="t" value="1000" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A = A₀e^(−λt)。</li>
        <li>活度衰减与核数同步。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const MP=1.6726219e-27,MN=1.6749275e-27,ME=9.10938356e-31,U=1.66053906660e-27,C=299792458,NA=6.02214076e23,EV=1.602176634e-19,LN2=0.69314718056;
            const a0 = num('a0'), lam = num('lam'), t = num('t');
            const A = a0 * Math.exp(-lam * t);
            ToolBox.setResult('result', dataGrid([
                [A.toFixed(3), '活度 A (Bq)']
            ]));
        }
function resetForm(){document.getElementById('a0').value = '100';
      document.getElementById('lam').value = '0.001';
      document.getElementById('t').value = '1000';
      calcTool();}
calcTool();
</script>
