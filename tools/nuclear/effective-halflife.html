<div class="container">
  <div class="card">
    <h2>由物理与生物半衰期求有效半衰期</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入物理半衰期 t_phys 与生物半衰期 t_bio，求有效半衰期。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">1/T_e = 1/T_p + 1/T_b</div>
      <p class="formula-desc">输入物理半衰期 t_phys 与生物半衰期 t_bio，求有效半衰期。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="tp">物理半衰期 t_phys (天)</label>
        <input type="number" id="tp" value="8" step="0.5">
      </div>
      <div>
        <label for="tb">生物半衰期 t_bio (天)</label>
        <input type="number" id="tb" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1/t_eff = 1/t_phys + 1/t_bio。</li>
        <li>8 天与 30 天 → 约 6.32 天。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const tp=num('tp'),tb=num('tb');
            const te=1/(1/tp+1/tb);
            ToolBox.setResult('result', dataGrid([
                [te.toFixed(2),'有效半衰期 t_eff (天)']
            ]));
        }
function resetForm(){document.getElementById('tp').value = '8';
      document.getElementById('tb').value = '30';
      calcTool();}
calcTool();
</script>
