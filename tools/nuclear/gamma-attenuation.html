<div class="container">
  <div class="card">
    <h2 data-zh="由线性衰减系数与厚度求透射强度">Gamma Attenuation</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入初始强度 I₀、衰减系数 μ、厚度 x，求透射强度。">Gamma Attenuation is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">I = I₀e^(−μx)。 I₀=100,μ=0.1,x=5 → 60.65。</div>
      <p class="formula-desc">输入初始强度 I₀、衰减系数 μ、厚度 x，求透射强度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="I0">初始强度 I₀</label>
        <input type="number" id="I0" value="100" step="1">
      </div>
      <div>
        <label for="mu">衰减系数 μ (1/cm)</label>
        <input type="number" id="mu" value="0.1" step="0.01">
      </div>
      <div>
        <label for="x">厚度 x (cm)</label>
        <input type="number" id="x" value="5" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>I = I₀e^(−μx)。</li>
        <li>I₀=100,μ=0.1,x=5 → 60.65。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const I0=num('I0'),mu=num('mu'),x=num('x');
            const I=I0*Math.exp(-mu*x);
            ToolBox.setResult('result', dataGrid([
                [I.toFixed(3),'透射强度 I']
            ]));
        }
function resetForm(){document.getElementById('I0').value = '100';
      document.getElementById('mu').value = '0.1';
      document.getElementById('x').value = '5';
      calcTool();}
calcTool();
</script>
