<div class="container">
  <div class="card">
    <h2 data-zh="由半衰期与原子核数求活度">Activity from Halflife</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入半衰期 t½ 与原子核数 N，求活度。">Activity from Halflife is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A = (ln2/T_{1/2})·N</div>
      <p class="formula-desc">输入半衰期 t½ 与原子核数 N，求活度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="th">半衰期 t½ (s)</label>
        <input type="number" id="th" value="1.808e11" step="1e10">
      </div>
      <div>
        <label for="N">核数 N</label>
        <input type="number" id="N" value="1e20" step="1e19">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A = λN = (ln2/t½)·N。</li>
        <li>示例 → 3.83×10⁸ Bq。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const th=num('th'),N=num('N');
            const A=Math.LN2/th*N;
            ToolBox.setResult('result', dataGrid([
                [A.toExponential(3),'活度 A (Bq)']
            ]));
        }
function resetForm(){document.getElementById('th').value = '1.808e11';
      document.getElementById('N').value = '1e20';
      calcTool();}
calcTool();
</script>
