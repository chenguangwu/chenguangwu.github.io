<div class="container">
  <div class="card">
    <h2>由核数与活度反推半衰期</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入核数 N 与活度 A，求半衰期。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">T_{1/2} = N·ln2/A</div>
      <p class="formula-desc">输入核数 N 与活度 A，求半衰期。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="N">核数 N</label>
        <input type="number" id="N" value="1e20" step="1e19">
      </div>
      <div>
        <label for="A">活度 A (Bq)</label>
        <input type="number" id="A" value="3.833e8" step="1e7">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>t½ = N·ln2/A。</li>
        <li>示例 → 约 5730 年。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const N=num('N'),A=num('A');
            const th=N*Math.LN2/A;
            ToolBox.setResult('result', dataGrid([
                [(th/3.156e7).toFixed(0),'半衰期 t½ (年)']
            ]));
        }
function resetForm(){document.getElementById('N').value = '1e20';
      document.getElementById('A').value = '3.833e8';
      calcTool();}
calcTool();
</script>
