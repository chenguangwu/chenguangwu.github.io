<div class="container">
  <div class="card">
    <h2 data-zh="原子核结合能计算器">Binding Energy</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">BE = Δm·c²</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="将核子束缚成核所释放的能量。">Binding Energy is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="dm">质量亏损 Δm (u)</label>
        <input type="number" id="dm" value="0.528" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>1 u·c² ≈ 931.5 MeV。</li>
        <li>铁-56 总结合能约 492 MeV。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const MP=1.6726219e-27,MN=1.6749275e-27,ME=9.10938356e-31,U=1.66053906660e-27,C=299792458,NA=6.02214076e23,EV=1.602176634e-19,LN2=0.69314718056;
            const dm = num('dm');
            const BE = dm * U * C * C;
            ToolBox.setResult('result', dataGrid([
                [BE.toExponential(3), '结合能 BE (J)'],
                [(BE / EV / 1e6).toFixed(3), 'BE (MeV)']
            ]));
        }
function resetForm(){document.getElementById('dm').value = '0.528';
      calcTool();}
calcTool();
</script>
