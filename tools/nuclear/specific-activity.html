<div class="container">
  <div class="card">
    <h2>a = λ·N_A / M</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">单位质量的放射性活度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">a = λN_A/M。 碳-14 比活度较低。</div>
      <p class="formula-desc">单位质量的放射性活度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="th">半衰期 T½ (年)</label>
        <input type="number" id="th" value="5730" step="100">
      </div>
      <div>
        <label for="M">摩尔质量 M (g/mol)</label>
        <input type="number" id="M" value="14" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>a = λN_A/M。</li>
        <li>碳-14 比活度较低。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const MP=1.6726219e-27,MN=1.6749275e-27,ME=9.10938356e-31,U=1.66053906660e-27,C=299792458,NA=6.02214076e23,EV=1.602176634e-19,LN2=0.69314718056;
            const th = num('th'), M = num('M');
            const lam = LN2 / (th * 365.25 * 24 * 3600); // 转 s⁻¹
            const a = lam * NA / (M / 1000); // 每 kg
            ToolBox.setResult('result', dataGrid([
                [a.toExponential(3), '比活度 (Bq/kg)']
            ]));
        }
function resetForm(){document.getElementById('th').value = '5730';
      document.getElementById('M').value = '14';
      calcTool();}
calcTool();
</script>
