<div class="container">
  <div class="card">
    <h2 data-zh="由中子通量、截面与靶核数求反应率">Reaction Rate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入中子通量 Φ、微观截面 σ、靶核数 N，求反应率。">Reaction Rate is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = ΦσN。 示例 → 1×10⁵ /s。</div>
      <p class="formula-desc">输入中子通量 Φ、微观截面 σ、靶核数 N，求反应率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="F">通量 Φ (1/(m²·s))</label>
        <input type="number" id="F" value="1e13" step="1e12">
      </div>
      <div>
        <label for="s">截面 σ (m²)</label>
        <input type="number" id="s" value="1e-28" step="1e-29">
      </div>
      <div>
        <label for="N">靶核数 N</label>
        <input type="number" id="N" value="1e20" step="1e19">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R = ΦσN。</li>
        <li>示例 → 1×10⁵ /s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F'),s=num('s'),N=num('N');
            const R=F*s*N;
            ToolBox.setResult('result', dataGrid([
                [R.toExponential(3),'反应率 R (1/s)']
            ]));
        }
function resetForm(){document.getElementById('F').value = '1e13';
      document.getElementById('s').value = '1e-28';
      document.getElementById('N').value = '1e20';
      calcTool();}
calcTool();
</script>
