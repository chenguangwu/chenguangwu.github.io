<div class="container">
  <div class="card">
    <h2 data-zh="瑞利判据">Rayleigh Resolution</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由波长与孔径直径，按 θ = 1.22λ/D 计算光学系统最小可分辨角。">Rayleigh Resolution is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">θ = 1.22·λ/D</div>
      <p class="formula-desc">由波长与孔径直径，按 θ = 1.22λ/D 计算光学系统最小可分辨角。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="lam">波长 λ (nm)</label>
        <input type="number" id="lam" value="550" step="1" min="1">
      </div>
      <div>
        <label for="D">孔径直径 D (mm)</label>
        <input type="number" id="D" value="100" step="1" min="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>瑞利判据：两点光源恰可分辨时，一波前极大与另一波前第一极小重合。</li>
        <li>人眼瞳孔约 2–5mm，可见光下分辨极限约 1′（角分）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const lam=num('lam')*1e-9, D=num('D')/1000;
            const theta = 1.22*lam/D;
            const arcsec = theta*206265;
            ToolBox.setResult('result', dataGrid([
                [theta.toExponential(3)+' rad', '最小分辨角 θ = 1.22λ/D'],
                [arcsec.toFixed(2)+' ″', '折合角秒']
            ]));
        }
function resetForm(){document.getElementById('lam').value = 550;
      document.getElementById('D').value = 100;
      calcTool();}
calcTool();
</script>
