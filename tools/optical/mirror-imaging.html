<div class="container">
  <div class="card">
    <h2>球面镜成像</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由物距与曲率半径，按 f=R/2 与 1/f = 1/u + 1/v 计算像距与放大率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f = 1/u + 1/v。</div>
      <p class="formula-desc">由物距与曲率半径，按 f=R/2 与 1/f = 1/u + 1/v 计算像距与放大率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="u">物距 u (mm)</label>
        <input type="number" id="u" value="300" step="1" min="0.1">
      </div>
      <div>
        <label for="R">曲率半径 R (mm)</label>
        <input type="number" id="R" value="200" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>凹面镜 f>0、凸面镜 f<0（此处曲率半径符号决定）。</li>
        <li>公式与薄透镜同构：1/f = 1/u + 1/v。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const u=num('u'), R=num('R');
            const f=R/2;
            const denom = 1/f - 1/u;
            let v = 1/denom, m = -v/u, real = v>0;
            ToolBox.setResult('result', dataGrid([
                [(R/2).toFixed(1)+' mm', '焦距 f = R/2'],
                [v.toFixed(2)+' mm', '像距 v'],
                [m.toFixed(3), '放大率 m（'+(real?'实像':'虚像')+'）']
            ]));
        }
function resetForm(){document.getElementById('u').value = 300;
      document.getElementById('R').value = 200;
      calcTool();}
calcTool();
</script>
