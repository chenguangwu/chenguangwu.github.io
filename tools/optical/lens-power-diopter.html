<div class="container">
  <div class="card">
    <h2>屈光度 P</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由焦距（米）按 P = 1/f 计算透镜屈光度（D）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = 1/f</div>
      <p class="formula-desc">由焦距（米）按 P = 1/f 计算透镜屈光度（D）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f">焦距 f (mm)</label>
        <input type="number" id="f" value="1000" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>屈光度单位 D = m⁻¹；凸透镜 P>0（远视/老花），凹透镜 P<0（近视）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f=num('f');
            const P = 1/(f/1000);
            ToolBox.setResult('result', dataGrid([ [P.toFixed(2)+' D', '屈光度 P = 1/f(米)'] ]));
        }
function resetForm(){document.getElementById('f').value = 1000;
      calcTool();}
calcTool();
</script>
