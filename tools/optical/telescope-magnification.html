<h1 class="sr-only">望远镜放大率计算器</h1>

<div class="nav">

  <span>/ 望远镜放大率计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">望远镜放大率计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>折射望远镜角放大率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由物镜与目镜焦距，按 M = f₀/fₑ 计算望远镜角放大率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">M = f_o/f_e</div>
      <p class="formula-desc">由物镜与目镜焦距，按 M = f₀/fₑ 计算望远镜角放大率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="fo">物镜焦距 f₀ (mm)</label>
        <input type="number" id="fo" value="1000" step="10">
      </div>
      <div>
        <label for="fe">目镜焦距 fₑ (mm)</label>
        <input type="number" id="fe" value="25" step="1" min="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>开普勒望远镜用两凸透镜，放大率为正表示倒像。</li>
        <li>放大率越大视场越小，受衍射极限约束。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const fo=num('fo'), fe=num('fe');
            const M = fo/fe;
            ToolBox.setResult('result', dataGrid([ [M.toFixed(1)+' ×', '角放大率 M = f₀/fₑ'] ]));
        }
function resetForm(){document.getElementById('fo').value = 1000;
      document.getElementById('fe').value = 25;
      calcTool();}
calcTool();
</script>
