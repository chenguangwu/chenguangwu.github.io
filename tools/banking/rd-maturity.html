<div class="container">
  <div class="card">
    <h2>零存整取到期计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">M = P·[(1+i)^n − 1] / [1 − (1+i)^(−1/3)]</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">每月固定存入、按季复利的零存整取到期金额。</p>

    <div class="input-row">
      <div>
        <label for="p">每月存入 P</label>
        <input type="number" id="p" value="1000" step="100">
      </div>
      <div>
        <label for="r">年利率 r (%)</label>
        <input type="number" id="r" value="8" step="0.1">
      </div>
      <div>
        <label for="t">年限 t</label>
        <input type="number" id="t" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>月存 1000、8%、1 年 → 到期约 12531。</li>
        <li>分母含 (1+i)^(−1/3)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P = num('p'), i = num('r') / 4 / 100, n = num('t') * 4;
            const M = P * (Math.pow(1 + i, n) - 1) / (1 - Math.pow(1 + i, -1 / 3));
            ToolBox.setResult('result', dataGrid([
                [M.toFixed(2), '到期金额 M'],
                [(M - P * n * 3).toFixed(2), '利息总额']
            ]));
        }
function resetForm(){document.getElementById('p').value = '1000';
      document.getElementById('r').value = '8';
      document.getElementById('t').value = '1';
      calcTool();}
calcTool();
</script>
