<h1 class="sr-only">按日计息计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>I = P × r × 天数 / 365</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按实际天数、年利率计算的短期利息。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">日利率 ≈ 年化/365。</div>
      <p class="formula-desc">按实际天数、年利率计算的短期利息。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">本金 P</label>
        <input type="number" id="p" value="100000" step="1000">
      </div>
      <div>
        <label for="r">年利率 r (%)</label>
        <input type="number" id="r" value="3.65" step="0.05">
      </div>
      <div>
        <label for="d">天数 d</label>
        <input type="number" id="d" value="100" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>10 万、3.65%、100 天 → 利息约 1000。</li>
        <li>日利率 ≈ 年化/365。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P = num('p'), r = num('r'), d = num('d');
            const I = P * r / 100 * d / 365;
            ToolBox.setResult('result', dataGrid([
                [I.toFixed(2), '按日利息 I'],
                [(P + I).toFixed(2), '本利和']
            ]));
        }
function resetForm(){document.getElementById('p').value = '100000';
      document.getElementById('r').value = '3.65';
      document.getElementById('d').value = '100';
      calcTool();}
calcTool();
</script>
