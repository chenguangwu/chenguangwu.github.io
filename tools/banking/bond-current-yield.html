<h1 class="sr-only">CY = 年息 / 市价</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由年利息与债券价格求当前收益率">Bond Current Yield</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入年利息（票息）与债券市场价格，求当前收益率。">Bond Current Yield is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">当前收益率 = 年息/价格</div>
      <p class="formula-desc">输入年利息（票息）与债券市场价格，求当前收益率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c">年利息 (元)</label>
        <input type="number" id="c" value="50" step="2">
      </div>
      <div>
        <label for="p">债券市价 (元)</label>
        <input type="number" id="p" value="980" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CY = 年息/市价。</li>
        <li>年息 50,市价 980 → 5.10%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c=num('c'),p=num('p');
            const CY=c/p;
            ToolBox.setResult('result', dataGrid([
                [(CY*100).toFixed(3),'当前收益率 CY (%)']
            ]));
        }
function resetForm(){document.getElementById('c').value = '50';
      document.getElementById('p').value = '980';
      calcTool();}
calcTool();
</script>
