<div class="container">
  <div class="card">
    <h2>由每期现金流与贴现率求永续年金现值</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入每期现金流 C 与贴现率 r，求永续年金现值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">PV = C/r</div>
      <p class="formula-desc">输入每期现金流 C 与贴现率 r，求永续年金现值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="C">每期现金流 C (元)</label>
        <input type="number" id="C" value="100" step="5">
      </div>
      <div>
        <label for="r">贴现率 r</label>
        <input type="number" id="r" value="0.05" step="0.005">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>PV = C/r（永续）。</li>
        <li>C=100,r=5% → 2000 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const C=num('C'),r=num('r');
            const PV=C/r;
            ToolBox.setResult('result', dataGrid([
                [PV.toFixed(2),'现值 PV (元)']
            ]));
        }
function resetForm(){document.getElementById('C').value = '100';
      document.getElementById('r').value = '0.05';
      calcTool();}
calcTool();
</script>
