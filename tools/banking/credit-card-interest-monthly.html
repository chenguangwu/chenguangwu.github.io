<h1 class="sr-only">I = 余额 × 日利率 × 天数</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 信用卡循环利息计算器</span>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">信用卡循环利息计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由欠款余额与日利率求月利息</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入欠款余额、日利率、计息天数，求利息。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">I = 余额×日利率×天数。 1000 元,0.05%/天,30 天 → 15 元。</div>
      <p class="formula-desc">输入欠款余额、日利率、计息天数，求利息。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="bal">欠款余额 (元)</label>
        <input type="number" id="bal" value="1000" step="50">
      </div>
      <div>
        <label for="dr">日利率</label>
        <input type="number" id="dr" value="0.0005" step="0.0001">
      </div>
      <div>
        <label for="days">计息天数 (天)</label>
        <input type="number" id="days" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>I = 余额×日利率×天数。</li>
        <li>1000 元,0.05%/天,30 天 → 15 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const bal=num('bal'),dr=num('dr'),days=num('days');
            const I=bal*dr*days;
            ToolBox.setResult('result', dataGrid([
                [I.toFixed(2),'利息 I (元)']
            ]));
        }
function resetForm(){document.getElementById('bal').value = '1000';
      document.getElementById('dr').value = '0.0005';
      document.getElementById('days').value = '30';
      calcTool();}
calcTool();
</script>
