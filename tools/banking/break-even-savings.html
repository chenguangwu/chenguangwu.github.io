<div class="container">
  <div class="card">
    <h2>存 X、贷 (1−X) 时净息为 0</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">在存款利率 r_d、贷款利率 r_l 下，使整体净息差为零的存款占比。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">X = r_l/(r_d+r_l)</div>
      <p class="formula-desc">在存款利率 r_d、贷款利率 r_l 下，使整体净息差为零的存款占比。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rd">存款利率 r_d (%)</label>
        <input type="number" id="rd" value="2" step="0.1">
      </div>
      <div>
        <label for="rl">贷款利率 r_l (%)</label>
        <input type="number" id="rl" value="5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>存 2%、贷 5% → 存款占比 71.43% 时净息为 0。</li>
        <li>假设资产=负债规模相等。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rd = num('rd'), rl = num('rl');
            const x = rl / (rd + rl);
            ToolBox.setResult('result', dataGrid([
                [(x * 100).toFixed(2), '存款占比 X (%)'],
                [((1 - x) * 100).toFixed(2), '贷款占比 (1−X) (%)']
            ]));
        }
function resetForm(){document.getElementById('rd').value = '2';
      document.getElementById('rl').value = '5';
      calcTool();}
calcTool();
</script>
