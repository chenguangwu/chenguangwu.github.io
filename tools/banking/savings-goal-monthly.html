<div class="container">
  <div class="card">
    <h2>储蓄目标月存额计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">PMT = FV·i / [(1+i)^N − 1]</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">为在 N 期后达成目标金额，每期需存入的数额。</p>

    <div class="input-row">
      <div>
        <label for="fv">目标金额 FV</label>
        <input type="number" id="fv" value="200000" step="1000">
      </div>
      <div>
        <label for="r">年利率 r (%)</label>
        <input type="number" id="r" value="4" step="0.1">
      </div>
      <div>
        <label for="y">年限 y</label>
        <input type="number" id="y" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>目标 20 万、4%、10 年 → 月存约 1361.37。</li>
        <li>i 为月利率。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const fv = num('fv'), i = num('r') / 100 / 12, N = num('y') * 12;
            const pmt = fv * i / (Math.pow(1 + i, N) - 1);
            ToolBox.setResult('result', dataGrid([
                [pmt.toFixed(2), '每月应存 PMT'],
                [(pmt * N).toFixed(2), '累计存入']
            ]));
        }
function resetForm(){document.getElementById('fv').value = '200000';
      document.getElementById('r').value = '4';
      document.getElementById('y').value = '10';
      calcTool();}
calcTool();
</script>
