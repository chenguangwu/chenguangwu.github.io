<h1 class="sr-only">贷款月供计算器</h1>

<div class="container">
  <div class="card">
    <h2 data-zh="贷款月供计算器">Emi Loan</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">EMI = P·i·(1+i)^N / [(1+i)^N − 1]</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按月等额本息还款的每月还款额。">Emi Loan is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="p">贷款本金 P</label>
        <input type="number" id="p" value="500000" step="1000">
      </div>
      <div>
        <label for="r">年利率 r (%)</label>
        <input type="number" id="r" value="4.9" step="0.1">
      </div>
      <div>
        <label for="y">年限 y</label>
        <input type="number" id="y" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>50 万、4.9%、30 年 → 月供约 2653.63。</li>
        <li>r 为月利率。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P = num('p'), r = num('r') / 100 / 12, N = num('y') * 12;
            const emi = P * r * Math.pow(1 + r, N) / (Math.pow(1 + r, N) - 1);
            ToolBox.setResult('result', dataGrid([
                [emi.toFixed(2), '月供 EMI'],
                [(emi * N).toFixed(2), '还款总额']
            ]));
        }
function resetForm(){document.getElementById('p').value = '500000';
      document.getElementById('r').value = '4.9';
      document.getElementById('y').value = '30';
      calcTool();}
calcTool();
</script>
