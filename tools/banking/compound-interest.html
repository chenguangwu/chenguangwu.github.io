  <a href="../../guides/compound-interest-guide.html">📖 查看「复利计算器使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>由本金、利率与复利频率求终值</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入本金 P、名义年利率 r、每年复利次数 n、年数 t，求终值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A = P(1+r/n)^{nt}。 1000 元,5%,月复利,10 年 → 约 1647 元。</div>
      <p class="formula-desc">输入本金 P、名义年利率 r、每年复利次数 n、年数 t，求终值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P">本金 P (元)</label>
        <input type="number" id="P" value="1000" step="50">
      </div>
      <div>
        <label for="r">年利率 r</label>
        <input type="number" id="r" value="0.05" step="0.005">
      </div>
      <div>
        <label for="n">年复利次数 n (次/年)</label>
        <input type="number" id="n" value="12" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="t">年数 t (年)</label>
        <input type="number" id="t" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A = P(1+r/n)^{nt}。</li>
        <li>1000 元,5%,月复利,10 年 → 约 1647 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P'),r=num('r'),n=num('n'),t=num('t');
            const A=P*Math.pow(1+r/n,n*t);
            ToolBox.setResult('result', dataGrid([
                [A.toFixed(2),'终值 A (元)']
            ]));
        }
function resetForm(){document.getElementById('P').value = '1000';
      document.getElementById('r').value = '0.05';
      document.getElementById('n').value = '12';
      document.getElementById('t').value = '10';
      calcTool();}
calcTool();
</script>
