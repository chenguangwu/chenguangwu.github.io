<h1 class="sr-only">n = −ln(1 − Pr/PMT) / ln(1+r)</h1>

<div class="container">
  <div class="card">
    <h2>由贷款额、利率与月供反推还款期数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入贷款本金 P、每期利率 r、每期还款 PMT，求还款期数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">n = −ln(1 − Pr/PMT) / ln(1+r)</div>
      <p class="formula-desc">输入贷款本金 P、每期利率 r、每期还款 PMT，求还款期数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P">贷款本金 P (元)</label>
        <input type="number" id="P" value="10000" step="500">
      </div>
      <div>
        <label for="r">每期利率 r</label>
        <input type="number" id="r" value="0.005" step="0.001">
      </div>
      <div>
        <label for="PMT">每期还款 PMT (元)</label>
        <input type="number" id="PMT" value="200" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>由年金现值公式反解 n。</li>
        <li>1万,0.5%/期,200/期 → 约 57.7 期。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P'),r=num('r'),PMT=num('PMT');
            const n=-Math.log(1-P*r/PMT)/Math.log(1+r);
            ToolBox.setResult('result', dataGrid([
                [n.toFixed(1),'还款期数 n (期)']
            ]));
        }
function resetForm(){document.getElementById('P').value = '10000';
      document.getElementById('r').value = '0.005';
      document.getElementById('PMT').value = '200';
      calcTool();}
calcTool();
</script>
