    <h2>🔢 每轮训练步数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由数据集与批次计算每轮训练步数。</p>
    <div class="input-row"><label>数据集大小</label><input type="number" id="data" value="50000" step="any" oninput="calc()"></div>
    <div class="input-row"><label>批次大小</label><input type="number" id="batch" value="64" step="any" oninput="calc()"></div>
    <div class="input-row"><label>GPU 数</label><input type="number" id="gpus" value="4" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

  </div>

    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">步数 = ⌈数据/批次⌉</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">分布式下每卡步数不变，总样本覆盖相同。</p>
  </div>

<script>
function calc(){
  const data = +document.getElementById('data').value || 0;
  const batch = +document.getElementById('batch').value || 0;
  const gpus = +document.getElementById('gpus').value || 0;
  let html = '';
  const __v0 = (Math.ceil(data/batch));
  html += `<p>每卡步数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 步</p>`;
  const __v1 = (batch*gpus);
  html += `<p>每步覆盖样本：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 样本</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
