<div class="container">
  <div class="card">
    <h2>🤖 情感分析</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于 Transformers.js 在浏览器本地判断文本情感倾向。英文走 DistilBERT 模型，中文走本地情感词库，数据不上传。</p>

    <div class="input-row">
      <label>输入文本</label>
      <textarea id="text" rows="5" placeholder="输入要分析的句子，例如：这部电影太精彩了，强烈推荐！" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--color-border);font-size:14px;resize:vertical;"></textarea>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="runBtn" onclick="runAI()">分析情感</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="status" style="color:var(--text-muted);font-size:13px;"></div>
    <div class="result-box" id="result"></div>

    <div class="formula-box" style="margin-top:14px;font-size:13px;line-height:1.7;">
      本工具在浏览器本地对文本做情感分析（中文内置情感词库 / 英文 DistilBERT 模型），输出情感极性，全程不上传。
    </div>
  </div>
</div>

<script type="module">
import { getPipeline, progressText, escapeHtml } from '../../js/ai-core.js';

const POS = ['好','喜欢','优秀','棒','赞','满意','漂亮','开心','爱','惊喜','强大','方便','快','清晰','专业','推荐','值得','完美','高兴','美丽','聪明','可爱','惊艳','舒适','可靠','热情','温暖','感动','震撼','极致','良心'];
const NEG = ['差','讨厌','糟糕','烂','失望','丑','慢','贵','难','坏','问题','错误','失败','垃圾','烦','生气','痛苦','丑陋','无聊','坑','恶心','后悔','气愤','糟糕','难受','粗糙','虚伪','敷衍','愤怒'];

function hasCJK(s) { return /[一-鿿]/.test(s); }

function zhSentiment(text) {
  let p = 0, n = 0;
  for (const w of POS) if (text.includes(w)) p++;
  for (const w of NEG) if (text.includes(w)) n++;
  if (p === 0 && n === 0) return { label: '中性', score: 0, method: '中文情感词库（无明显信号）' };
  const label = p >= n ? '正面' : '负面';
  const score = Math.max(p, n) / (p + n);
  return { label, score, method: '中文情感词库' };
}

window.copyResult = function () {
  const txt = document.querySelector('#result');
  if (txt && txt.textContent.trim()) {
    navigator.clipboard.writeText(txt.textContent.trim());
    document.getElementById('status').textContent = '已复制到剪贴板';
  }
};

window.runAI = async function () {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const btn = document.getElementById('runBtn');
  const text = document.getElementById('text').value.trim();
  if (!text) { status.textContent = '请输入要分析的文本'; return; }
  btn.disabled = true;

  if (hasCJK(text)) {
    status.textContent = '本地词库分析中…';
    const r = zhSentiment(text);
    const pct = (r.score * 100).toFixed(0);
    const emoji = r.label === '正面' ? '😊' : (r.label === '负面' ? '😠' : '😐');
    result.innerHTML = `<p style="font-size:18px;margin-bottom:6px;">${emoji} 情感倾向：<strong>${r.label}</strong></p><p>置信度：${pct}%（${escapeHtml(r.method)}）</p>`;
    status.textContent = '完成';
    btn.disabled = false;
    return;
  }

  status.textContent = '加载模型中…';
  try {
    const pipe = await getPipeline('text-classification', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english', (e) => { status.textContent = progressText(e); });
    status.textContent = '分析中…';
    const out = await pipe(text);
    const top = out[0];
    const label = top.label === 'POSITIVE' ? '正面' : (top.label === 'NEGATIVE' ? '负面' : top.label);
    const emoji = label === '正面' ? '😊' : '😠';
    const pct = (top.score * 100).toFixed(1);
    result.innerHTML = `<p style="font-size:18px;margin-bottom:6px;">${emoji} 情感倾向：<strong>${label}</strong></p><p>置信度：${pct}%（DistilBERT 模型）</p>`;
    status.textContent = '完成';
  } catch (err) {
    status.textContent = '出错：' + (err && err.message ? err.message : err);
  } finally {
    btn.disabled = false;
  }
};
</script>
