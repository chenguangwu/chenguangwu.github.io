<div class="container">
  <div class="card">
    <h2>📐 余弦相似度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算两个向量的余弦相似度。</p>
    <div class="input-row"><label>向量A1</label><input type="number" id="a1" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>A2</label><input type="number" id="a2" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>A3</label><input type="number" id="a3" value="3" step="any" oninput="calc()"></div>
    <div class="input-row"><label>向量B1</label><input type="number" id="b1" value="2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>B2</label><input type="number" id="b2" value="1" step="any" oninput="calc()"></div>
    <div class="input-row"><label>B3</label><input type="number" id="b3" value="0" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">cos = (A·B)/(|A|·|B|)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">取值 −1 到 1，越接近 1 越相似。</p>
  </div>
</div>

<script>
function calc(){
  const a1 = +document.getElementById('a1').value || 0;
  const a2 = +document.getElementById('a2').value || 0;
  const a3 = +document.getElementById('a3').value || 0;
  const b1 = +document.getElementById('b1').value || 0;
  const b2 = +document.getElementById('b2').value || 0;
  const b3 = +document.getElementById('b3').value || 0;
  let html = '';
  const __v = ((()=>{const a=[a1,a2,a3],b=[b1,b2,b3];let d=0,na=0,nb=0;for(let i=0;i<3;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/(Math.sqrt(na)*Math.sqrt(nb));})());
  html += `<p>余弦相似度：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(4)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
