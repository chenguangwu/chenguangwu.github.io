<div class="container">
  <div class="card">
    <h2>🤖 OCR 文字识别</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于 Transformers.js 在浏览器本地运行 TrOCR 模型，从图片中提取印刷体文字，数据不上传。</p>

    <div class="input-row">
      <label>选择图片</label>
      <input type="file" id="img" accept="image/*" onchange="preview()">
    </div>

    <div id="preview" style="margin-bottom:12px;"></div>

    <div class="toolbar">
      <button class="btn primary" id="runBtn" onclick="runAI()">开始识别</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="status" style="color:var(--text-muted);font-size:13px;"></div>
    <div class="result-box" id="result"></div>

    <div class="formula-box" style="margin-top:14px;font-size:13px;line-height:1.7;">
      本工具在浏览器本地加载 OCR 模型，对上传图片执行文字检测与识别，全程不依赖服务器、图片不上传。
    </div>
  </div>
</div>

<script>
function preview() {
  const f = document.getElementById('img').files[0];
  const box = document.getElementById('preview');
  if (!f) { box.innerHTML = ''; return; }
  const url = URL.createObjectURL(f);
  box.innerHTML = `<img src="${url}" alt="图片预览" style="max-width:100%;max-height:240px;border-radius:12px;border:1px solid var(--color-border);">`;
}
</script>

<script type="module">
import { getPipeline, progressText, escapeHtml } from '../../js/ai-core.js';

window.copyResult = function () {
  const r = document.getElementById('result');
  const txt = r.querySelector('textarea');
  if (txt) {
    navigator.clipboard.writeText(txt.value);
    document.getElementById('status').textContent = '已复制到剪贴板';
  }
};

window.runAI = async function () {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const btn = document.getElementById('runBtn');
  const file = document.getElementById('img').files[0];
  if (!file) { status.textContent = '请先选择一张图片'; return; }
  const url = URL.createObjectURL(file);
  btn.disabled = true;
  status.textContent = '加载模型中…';
  try {
    const pipe = await getPipeline('image-to-text', 'Xenova/trocr-base-printed', (e) => { status.textContent = progressText(e); });
    status.textContent = '识别中…';
    const out = await pipe(url);
    const text = (out && out[0] && out[0].generated_text) || '';
    result.innerHTML = `<p style="margin-bottom:8px;">识别结果：</p><textarea readonly style="width:100%;min-height:120px;padding:10px;border-radius:12px;border:1px solid var(--color-border);font-size:14px;">${escapeHtml(text)}</textarea>`;
    status.textContent = '完成';
  } catch (err) {
    status.textContent = '出错：' + (err && err.message ? err.message : err);
  } finally {
    btn.disabled = false;
  }
};
</script>
