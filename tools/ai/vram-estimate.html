<script>
function calc(){
  const params = +document.getElementById('params').value || 0;
  const bytes = +document.getElementById('bytes').value || 0;
  const act = +document.getElementById('act').value || 0;
  let html = '';
  const __v0 = (params*bytes);
  html += `<p>权重显存：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> GB</p>`;
  const __v1 = (params*bytes + act/1000);
  html += `<p>总显存估算：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> GB</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
