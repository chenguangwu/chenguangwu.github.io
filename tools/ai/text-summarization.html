<div class="container">
  <div class="card">
    <h2 data-zh="🤖 文本摘要">🤖 Text Summary</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="基于 Transformers.js 在浏览器本地运行 BART 模型，将长文压缩为简洁摘要，数据不上传。">Text Summary is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <label>原文</label>
      <textarea id="text" rows="7" placeholder="粘贴一段较长的中文或英文文章…" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--color-border);font-size:14px;resize:vertical;"></textarea>
    </div>

    <div class="input-row">
      <label>摘要长度</label>
      <select id="len">
        <option value="60">短（~60 字）</option>
        <option value="120" selected>中（~120 字）</option>
        <option value="200">长（~200 字）</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="runBtn" onclick="runAI()">生成摘要</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="status" style="color:var(--text-muted);font-size:13px;"></div>
    <div class="result-box" id="result"></div>

    <div class="formula-box" style="margin-top:14px;font-size:13px;line-height:1.7;">
      本工具在浏览器本地加载摘要模型，对输入文本生成摘要（英文较长段落效果最佳），全程不上传。
    </div>
  </div>
</div>

<script type="module">
import { getPipeline, progressText, escapeHtml } from '../../js/ai-core.js';

window.copyResult = function () {
  const txt = document.querySelector('#result textarea');
  if (txt) {
    navigator.clipboard.writeText(txt.value);
    document.getElementById('status').textContent = '已复制到剪贴板';
  }
};

window.runAI = async function () {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const btn = document.getElementById('runBtn');
  const text = document.getElementById('text').value.trim();
  if (!text) { status.textContent = '请输入要摘要的文本'; return; }
  const maxLen = parseInt(document.getElementById('len').value, 10);
  btn.disabled = true;
  status.textContent = '加载模型中…';
  try {
    const pipe = await getPipeline('summarization', 'Xenova/distilbart-cnn-6-6', (e) => { status.textContent = progressText(e); });
    status.textContent = '生成中…';
    const out = await pipe(text, { max_new_tokens: maxLen, min_length: Math.max(20, Math.round(maxLen / 3)), do_sample: false });
    const summary = (out && out[0] && out[0].summary_text) || '';
    result.innerHTML = `<p style="margin-bottom:8px;">摘要：</p><textarea readonly style="width:100%;min-height:120px;padding:10px;border-radius:12px;border:1px solid var(--color-border);font-size:14px;">${escapeHtml(summary)}</textarea>`;
    status.textContent = '完成';
  } catch (err) {
    status.textContent = '出错：' + (err && err.message ? err.message : err);
  } finally {
    btn.disabled = false;
  }
};
</script>
