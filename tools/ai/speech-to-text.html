<div class="container">
  <div class="card">
    <h2 data-zh="🤖 语音转文字">🤖 Speech to Text</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="基于 Transformers.js 在浏览器本地运行 Whisper 模型，将音频转换为文字，数据不上传。">Speech to Text is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <label>选择音频</label>
      <input type="file" id="audio" accept="audio/*">
    </div>

    <div class="toolbar">
      <button class="btn primary" id="runBtn" onclick="runAI()">开始转换</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="status" style="color:var(--text-muted);font-size:13px;"></div>
    <div class="result-box" id="result"></div>

    <div class="formula-box" style="margin-top:14px;font-size:13px;line-height:1.7;">
      本工具在浏览器本地解码音频并加载 Whisper 模型转写文字，支持 mp3 / wav / m4a 等格式，全程不上传。
    </div>
  </div>
</div>

<script type="module">
import { getPipeline, progressText, decodeAudioTo16k, escapeHtml } from '../../js/ai-core.js';

window.copyResult = function () {
  const txt = document.querySelector('#result textarea');
  if (txt) {
    navigator.clipboard.writeText(txt.value);
    document.getElementById('status').textContent = '已复制到剪贴板';
  }
};

window.runAI = async function () {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const btn = document.getElementById('runBtn');
  const file = document.getElementById('audio').files[0];
  if (!file) { status.textContent = '请先选择一个音频文件'; return; }
  btn.disabled = true;
  status.textContent = '解码音频中…';
  try {
    const audio = await decodeAudioTo16k(file);
    status.textContent = '加载模型中…';
    const pipe = await getPipeline('automatic-speech-recognition', 'Xenova/whisper-base', (e) => { status.textContent = progressText(e); });
    status.textContent = '识别中…';
    const out = await pipe(audio);
    const text = (out && out.text) || '';
    result.innerHTML = `<p style="margin-bottom:8px;">转换结果：</p><textarea readonly style="width:100%;min-height:120px;padding:10px;border-radius:12px;border:1px solid var(--color-border);font-size:14px;">${escapeHtml(text)}</textarea>`;
    status.textContent = '完成';
  } catch (err) {
    status.textContent = '出错：' + (err && err.message ? err.message : err);
  } finally {
    btn.disabled = false;
  }
};
</script>
