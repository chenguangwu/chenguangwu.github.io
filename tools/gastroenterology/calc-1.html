<body>

<div class="container">
  <div class="card">
    <h2>🫀 Child-Pugh 肝功能分级</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">评估肝硬化患者肝功能储备与手术风险。</p>

    <div class="input-row">
      <div>
        <label for="bili">总胆红素</label>
        <input type="number" id="bili" step="0.1" placeholder="例如 35" oninput="calc()">
      </div>
      <div>
        <label for="biliUnit">单位</label>
        <select id="biliUnit" onchange="calc()">
          <option value="umol">μmol/L</option>
          <option value="mgdl">mg/dL</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="alb">白蛋白</label>
        <input type="number" id="alb" step="0.1" placeholder="例如 32" oninput="calc()">
      </div>
      <div>
        <label for="albUnit">单位</label>
        <select id="albUnit" onchange="calc()">
          <option value="gl">g/L</option>
          <option value="gdl">g/dL</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="inr">INR</label>
        <input type="number" id="inr" step="0.1" placeholder="例如 1.5" oninput="calc()">
      </div>
    </div>

    <div class="score-grid">
      <div class="score-item">
        <label for="ascites">腹水</label>
        <select id="ascites" onchange="calc()">
          <option value="1">无</option>
          <option value="2">轻度 / 药物可控制</option>
          <option value="3">中重度 / 难治性</option>
        </select>
      </div>
      <div class="score-item">
        <label for="enceph">肝性脑病</label>
        <select id="enceph" onchange="calc()">
          <option value="1">无</option>
          <option value="2">I-II 级</option>
          <option value="3">III-IV 级</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算分级</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_child_pugh';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.bili != null) document.getElementById('bili').value = s.bili;
    if(s.biliUnit) document.getElementById('biliUnit').value = s.biliUnit;
    if(s.alb != null) document.getElementById('alb').value = s.alb;
    if(s.albUnit) document.getElementById('albUnit').value = s.albUnit;
    if(s.inr != null) document.getElementById('inr').value = s.inr;
    if(s.ascites != null) document.getElementById('ascites').value = s.ascites;
    if(s.enceph != null) document.getElementById('enceph').value = s.enceph;
  } catch(e){}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      bili: document.getElementById('bili').value,
      biliUnit: document.getElementById('biliUnit').value,
      alb: document.getElementById('alb').value,
      albUnit: document.getElementById('albUnit').value,
      inr: document.getElementById('inr').value,
      ascites: document.getElementById('ascites').value,
      enceph: document.getElementById('enceph').value
    }));
  } catch(e){}
}

function biliScore(val, unit){
  const mg = unit === 'umol' ? val / 17.1 : val;
  if(mg < 2) return 1;
  if(mg <= 3) return 2;
  return 3;
}
function albScore(val, unit){
  const gl = unit === 'gdl' ? val * 10 : val;
  if(gl > 35) return 1;
  if(gl >= 28) return 2;
  return 3;
}
function inrScore(inr){
  if(inr < 1.7) return 1;
  if(inr <= 2.3) return 2;
  return 3;
}

function calc(){
  const bili = parseFloat(document.getElementById('bili').value);
  const alb = parseFloat(document.getElementById('alb').value);
  const inr = parseFloat(document.getElementById('inr').value);
  const ascites = parseInt(document.getElementById('ascites').value, 10);
  const enceph = parseInt(document.getElementById('enceph').value, 10);
  const result = document.getElementById('result');

  if(isNaN(bili) || isNaN(alb) || isNaN(inr)){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入胆红素、白蛋白和 INR。</p>';
    saveState();
    return;
  }

  const score = biliScore(bili, document.getElementById('biliUnit').value)
              + albScore(alb, document.getElementById('albUnit').value)
              + inrScore(inr) + ascites + enceph;

  let cls = 'grade-excellent', grade = 'A级', survival = '1 年存活率约 100%，2 年约 85%';
  if(score >= 10){ cls = 'grade-fail'; grade = 'C级'; survival = '1 年存活率约 45%，2 年约 35%'; }
  else if(score >= 7){ cls = 'grade-pass'; grade = 'B级'; survival = '1 年存活率约 80%，2 年约 60%'; }

  saveState();
  result.innerHTML = `
    <p>Child-Pugh 评分：<strong style="font-size:20px;">${score}</strong> 分（5-15 分）</p>
    <p>分级：<span class="grade-tag ${cls}">${grade}</span></p>
    <p>预后参考：<strong>${survival}</strong></p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：Child-Pugh C 级患者腹部大手术风险显著升高，需多学科评估。
    </div>
  `;
}

function resetForm(){
  document.getElementById('bili').value = '';
  document.getElementById('biliUnit').value = 'umol';
  document.getElementById('alb').value = '';
  document.getElementById('albUnit').value = 'gl';
  document.getElementById('inr').value = '';
  document.getElementById('ascites').value = '1';
  document.getElementById('enceph').value = '1';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
