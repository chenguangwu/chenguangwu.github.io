<div class="container">
  <div class="card">
    <h2>🦷 DMFT 龋齿指数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">记录恒牙中龋坏（D）、因龋缺失（M）、因龋充填（F）的牙数，评估个体龋病经历。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">DMFT = 龋数 + 失数 + 补数</div>
      <p class="formula-desc">记录恒牙中龋坏（D）、因龋缺失（M）、因龋充填（F）的牙数，评估个体龋病经历。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="d">龋坏牙数 D</label>
        <input type="number" id="d" min="0" max="32" placeholder="0" oninput="calc()">
      </div>
      <div>
        <label for="m">因龋缺失牙数 M</label>
        <input type="number" id="m" min="0" max="32" placeholder="0" oninput="calc()">
      </div>
      <div>
        <label for="f">因龋充填牙数 F</label>
        <input type="number" id="f" min="0" max="32" placeholder="0" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算 DMFT</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_dmft';
const ids = ['d','m','f'];

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el && s[id] != null) el.value = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {};
    ids.forEach(id => { s[id] = document.getElementById(id).value; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function classify(dmft){
  if(dmft <= 4) return {level:'龋病风险较低', cls:'grade-excellent'};
  if(dmft <= 10) return {level:'龋病风险中等', cls:'grade-pass'};
  return {level:'龋病风险较高', cls:'grade-fail'};
}

function calc(){
  let total = 0;
  ids.forEach(id => {
    const v = parseInt(document.getElementById(id).value, 10);
    total += isNaN(v) ? 0 : v;
  });
  const c = classify(total);
  saveState();

  document.getElementById('result').innerHTML = `
    <p>DMFT 指数：<strong style="font-size:20px;">${total}</strong></p>
    <p>评估：<span class="grade-tag ${c.cls}">${c.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">D+M+F = ${total}（恒牙龋坏、缺失、充填牙数之和）</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：DMFT 用于群体或个人龋病经历评估，儿童乳牙龋可采用 dmft 指数；诊断与治疗请咨询口腔科医生。
    </div>
  `;
}

function resetForm(){
  ids.forEach(id => document.getElementById(id).value = '');
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
