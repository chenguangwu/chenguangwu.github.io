<div class="container">
  <div class="card">
    <h2>🔌 电流分流器计算（电气）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">I₁ = I_t·R₂/(R₁+R₂)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算两个并联电阻各自分得的电流。</p>

    <div class="input-row">
      <div>
        <label for="It">总电流 I_t (mA)</label>
        <input type="number" id="It" value="100" step="1" min="0">
      </div>
      <div>
        <label for="R1">支路电阻 R₁ (Ω)</label>
        <input type="number" id="R1" value="1000" step="10" min="0">
      </div>
      <div>
        <label for="R2">支路电阻 R₂ (Ω)</label>
        <input type="number" id="R2" value="2000" step="10" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>并联分流：I₁ = I_t·R₂/(R₁+R₂)，I₂ = I_t·R₁/(R₁+R₂)</li>
        <li>电阻越小，分流越大</li>
        <li>合计应等于输入总电流（校验用）</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const It=num('It'), R1=num('R1'), R2=num('R2');
            if(R1<=0||R2<=0){ToolBox.setResult('result','<p class="tip-error">电阻须>0。</p>');return;}
            const I1=It*R2/(R1+R2); // 流经 R1
            const I2=It*R1/(R1+R2); // 流经 R2
            ToolBox.setResult('result', dataGrid([
                [I1.toFixed(2),'支路 R₁ 电流 I₁ (mA)'],
                [I2.toFixed(2),'支路 R₂ 电流 I₂ (mA)'],
                [(I1+I2).toFixed(2),'电流合计 (mA)']
            ]));
        }
function resetForm(){document.getElementById('It').value = '100';
      document.getElementById('R1').value = '1000';
      document.getElementById('R2').value = '2000';
      calcTool();}
calcTool();
</script>
