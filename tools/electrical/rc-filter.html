<div class="container">
  <div class="card">
    <h2>🔌 RC 低通滤波截止频率计算（电气）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由电阻与电容计算一阶 RC 低通滤波器的截止频率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f_c = 1/(2πRC) 高于 f_c 的信号按 -20dB/十倍频衰减 常用于电源去耦、抗混叠前置滤波</div>
      <p class="formula-desc">由电阻与电容计算一阶 RC 低通滤波器的截止频率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="R">电阻 R (kΩ)</label>
        <input type="number" id="R" value="10" step="0.5" min="0">
      </div>
      <div>
        <label for="C">电容 C (µF)</label>
        <input type="number" id="C" value="0.1" step="0.01" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>f_c = 1/(2πRC)</li>
        <li>高于 f_c 的信号按 -20dB/十倍频衰减</li>
        <li>常用于电源去耦、抗混叠前置滤波</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const R=num('R')*1000, C=num('C')*1e-6; // Ω, F
            if(R<=0||C<=0){ToolBox.setResult('result','<p class="tip-error">R、C 须>0。</p>');return;}
            const fc=1/(2*Math.PI*R*C);
            ToolBox.setResult('result', dataGrid([
                [fc.toFixed(1),'截止频率 f_c (Hz)'],
                [(fc/1000).toFixed(3),'截止频率 f_c (kHz)']
            ]));
        }
function resetForm(){document.getElementById('R').value = '10';
      document.getElementById('C').value = '0.1';
      calcTool();}
calcTool();
</script>
