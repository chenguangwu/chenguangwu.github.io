<div class="container">
  <div class="card">
    <h2>🔌 RLC 串联谐振频率计算（电气）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f₀ = 1/(2π√LC)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由电感与电容计算 RLC 串联电路的谐振频率。</p>

    <div class="input-row">
      <div>
        <label for="L">电感 L (mH)</label>
        <input type="number" id="L" value="10" step="0.5" min="0">
      </div>
      <div>
        <label for="C">电容 C (µF)</label>
        <input type="number" id="C" value="0.1" step="0.01" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>f₀ = 1/(2π√LC)</li>
        <li>谐振时感抗与容抗相等，回路阻抗最小</li>
        <li>用于选频、滤波、振荡电路设计</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const L=num('L')/1000, C=num('C')*1e-6; // H, F
            if(L<=0||C<=0){ToolBox.setResult('result','<p class="tip-error">L、C 须>0。</p>');return;}
            const f0=1/(2*Math.PI*Math.sqrt(L*C));
            ToolBox.setResult('result', dataGrid([
                [f0.toFixed(1),'谐振频率 f₀ (Hz)'],
                [(f0/1000).toFixed(3),'谐振频率 f₀ (kHz)']
            ]));
        }
function resetForm(){document.getElementById('L').value = '10';
      document.getElementById('C').value = '0.1';
      calcTool();}
calcTool();
</script>
