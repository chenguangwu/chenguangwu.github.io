<div class="container">
  <div class="card">
    <h2>🔌 运算放大器增益计算（电气）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算反相与同相放大电路的闭环电压增益。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A_v = −R_f/R_in 同相：A_v = 1+R_f/R_in 理想运放、深度负反馈近似；实际受带宽/摆率限制</div>
      <p class="formula-desc">计算反相与同相放大电路的闭环电压增益。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Rin">输入电阻 R_in (Ω)</label>
        <input type="number" id="Rin" value="1000" step="10" min="0">
      </div>
      <div>
        <label for="Rf">反馈电阻 R_f (Ω)</label>
        <input type="number" id="Rf" value="10000" step="100" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>反相：A_v = −R_f/R_in</li>
        <li>同相：A_v = 1+R_f/R_in</li>
        <li>理想运放、深度负反馈近似；实际受带宽/摆率限制</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Rin=num('Rin'), Rf=num('Rf');
            if(Rin<=0||Rf<0){ToolBox.setResult('result','<p class="tip-error">R_in 须>0。</p>');return;}
            const Av_inv=-Rf/Rin;
            const Av_non=1+Rf/Rin;
            ToolBox.setResult('result', dataGrid([
                [Av_inv.toFixed(2),'反相增益 A_v (=−R_f/R_in)'],
                [Av_non.toFixed(2),'同相增益 A_v (=1+R_f/R_in)']
            ]));
        }
function resetForm(){document.getElementById('Rin').value = '1000';
      document.getElementById('Rf').value = '10000';
      calcTool();}
calcTool();
</script>
