<div class="container">
  <div class="card">
    <h2>🔌 LED 限流电阻计算（电气）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由电源电压、LED 正向压降与额定电流计算所需限流电阻及功耗。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R = (V_s−V_f)/I_f</div>
      <p class="formula-desc">由电源电压、LED 正向压降与额定电流计算所需限流电阻及功耗。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Vs">电源电压 V_s (V)</label>
        <input type="number" id="Vs" value="5" step="0.5" min="0">
      </div>
      <div>
        <label for="Vf">LED 正向压降 V_f (V)</label>
        <input type="number" id="Vf" value="2.0" step="0.1" min="0">
      </div>
      <div>
        <label for="If">正向电流 I_f (mA)</label>
        <input type="number" id="If" value="20" step="1" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>R = (V_s−V_f)/I_f</li>
        <li>实际选阻值应 ≥ 计算值并留余量（防过流）</li>
        <li>功耗 P = I_f²·R，据此选电阻功率档</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Vs=num('Vs'), Vf=num('Vf'), If=num('If')/1000; // A
            if(If<=0){ToolBox.setResult('result','<p class="tip-error">电流须>0。</p>');return;}
            if(Vs<=Vf){ToolBox.setResult('result','<p class="tip-error">电源电压须大于 LED 压降。</p>');return;}
            const R=(Vs-Vf)/If;          // Ω
            const P=Math.pow(If,2)*R;     // W
            ToolBox.setResult('result', dataGrid([
                [R.toFixed(0),'限流电阻 R (Ω)'],
                [(R*1.5).toFixed(0),'建议标称值 (~1.5×) (Ω)'],
                [(P*1000).toFixed(1),'电阻功耗 P (mW)']
            ]));
        }
function resetForm(){document.getElementById('Vs').value = '5';
      document.getElementById('Vf').value = '2.0';
      document.getElementById('If').value = '20';
      calcTool();}
calcTool();
</script>
