<div class="container">
  <div class="card">
    <h2 data-zh="由内压求纵向应力">Longitudinal Stress</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入内压 p、半径 r、壁厚 t，求纵向应力。">Longitudinal Stress is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">σ_l = σ_h/2。 同上例 → 50 MPa。</div>
      <p class="formula-desc">输入内压 p、半径 r、壁厚 t，求纵向应力。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">内压 p (Pa)</label>
        <input type="number" id="p" value="2e6" step="1e5">
      </div>
      <div>
        <label for="r">半径 r (m)</label>
        <input type="number" id="r" value="0.5" step="0.1">
      </div>
      <div>
        <label for="t">壁厚 t (m)</label>
        <input type="number" id="t" value="0.01" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>σ_l = σ_h/2。</li>
        <li>同上例 → 50 MPa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p=num('p'),r=num('r'),t=num('t');
            const sl=p*r/(2*t);
            ToolBox.setResult('result', dataGrid([
                [(sl/1e6).toFixed(2),'纵向应力 σ_l (MPa)']
            ]));
        }
function resetForm(){document.getElementById('p').value = '2e6';
      document.getElementById('r').value = '0.5';
      document.getElementById('t').value = '0.01';
      calcTool();}
calcTool();
</script>
