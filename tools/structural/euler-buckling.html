<div class="container">
  <div class="card">
    <h2>欧拉临界（P_cr = π²·E·I / L²）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">两端铰支细长压杆的屈曲临界载荷。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P_cr = π²EI/L²（两端铰支）。 200 GPa 钢、I=1e-6、L=2m → 约 493 kN。</div>
      <p class="formula-desc">两端铰支细长压杆的屈曲临界载荷。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="E">弹性模量 (Pa)</label>
        <input type="number" id="E" value="200e9" step="1e9">
      </div>
      <div>
        <label for="I">截面惯性矩 (m⁴)</label>
        <input type="number" id="I" value="1e-6" step="1e-7">
      </div>
      <div>
        <label for="L">长度 (m)</label>
        <input type="number" id="L" value="2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P_cr = π²EI/L²（两端铰支）。</li>
        <li>200 GPa 钢、I=1e-6、L=2m → 约 493 kN。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const E = num('E'), I = num('I'), L = num('L');
            const Pcr = Math.PI * Math.PI * E * I / (L * L);
            ToolBox.setResult('result', dataGrid([
                [(Pcr).toFixed(1), '临界载荷 P_cr (N)'],
                [(Pcr / 1000).toFixed(2), 'P_cr (kN)']
            ]));
        }
function resetForm(){document.getElementById('E').value = '200e9';
      document.getElementById('I').value = '1e-6';
      document.getElementById('L').value = '2';
      calcTool();}
calcTool();
</script>
