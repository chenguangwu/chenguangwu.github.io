<div class="container">
  <div class="card">
    <h2>许用应力（σ_allow = σ_yield / n）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">以屈服强度和安全系数确定许用应力。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">σ_allow = σ_yield / n</div>
      <p class="formula-desc">以屈服强度和安全系数确定许用应力。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="sy">屈服强度 (MPa)</label>
        <input type="number" id="sy" value="250" step="1">
      </div>
      <div>
        <label for="n">安全系数</label>
        <input type="number" id="n" value="1.5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>σ_allow = σ_yield / n。</li>
        <li>250 MPa、n=1.5 → 约 167 MPa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const sy = num('sy'), n = num('n');
            const sa = sy / n;
            ToolBox.setResult('result', dataGrid([
                [sa.toFixed(2), '许用应力 σ_allow (MPa)'],
                [(sa * n).toFixed(2), '回算屈服 (MPa)']
            ]));
        }
function resetForm(){document.getElementById('sy').value = '250';
      document.getElementById('n').value = '1.5';
      calcTool();}
calcTool();
</script>
