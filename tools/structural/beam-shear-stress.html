<div class="container">
  <div class="card">
    <h2 data-zh="最大剪应力（τ_max = 1.5·V / A）">Beam Shear Stress</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="矩形截面梁中性轴处剪应力最大，为平均剪应力的 1.5 倍。">Beam Shear Stress is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">τ_max = 1.5·V / A</div>
      <p class="formula-desc">矩形截面梁中性轴处剪应力最大，为平均剪应力的 1.5 倍。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="V">剪力 (kN)</label>
        <input type="number" id="V" value="5" step="0.1">
      </div>
      <div>
        <label for="A">截面积 (m²)</label>
        <input type="number" id="A" value="0.1" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ_max = 1.5·V/A（矩形截面）。</li>
        <li>5 kN、0.1 m² → 75 kPa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const V = num('V') * 1000, A = num('A');
            const t = 1.5 * V / A;
            ToolBox.setResult('result', dataGrid([
                [(t / 1e6).toFixed(3), '最大剪应力 τ (MPa)'],
                [(t / 1e3).toFixed(2), 'τ (kPa)']
            ]));
        }
function resetForm(){document.getElementById('V').value = '5';
      document.getElementById('A').value = '0.1';
      calcTool();}
calcTool();
</script>
