</nav>
<div class="container">
  <div class="card">
    <h2>由直径求实心圆截面惯性矩</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入圆截面直径 d，求截面惯性矩。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">I = π·d⁴/64</div>
      <p class="formula-desc">输入圆截面直径 d，求截面惯性矩。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="d">直径 d (m)</label>
        <input type="number" id="d" value="0.1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>I = πd⁴/64（实心圆）。</li>
        <li>d=0.1m → 4.91×10⁶ mm⁴。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const d=num('d');
            const I=Math.PI*Math.pow(d,4)/64;
            ToolBox.setResult('result', dataGrid([
                [(I*1e12).toFixed(2),'惯性矩 I (mm⁴)'],
                [I.toExponential(3),'惯性矩 I (m⁴)']
            ]));
        }
function resetForm(){document.getElementById('d').value = '0.1';
      calcTool();}
calcTool();
</script>
