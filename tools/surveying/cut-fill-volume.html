<div class="container">
  <div class="card">
    <h2>相邻断面体积</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">V = (A₁ + A₂) / 2 × L。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">V = (A₁+A₂)/2 · L（相邻断面）</div>
      <p class="formula-desc">V = (A₁ + A₂) / 2 × L。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a1">断面1面积 (m²)</label>
        <input type="number" id="a1" value="120" step="10">
      </div>
      <div>
        <label for="a2">断面2面积 (m²)</label>
        <input type="number" id="a2" value="180" step="10">
      </div>
      <div>
        <label for="l">间距 L (m)</label>
        <input type="number" id="l" value="20" step="2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>平均断面法为近似。</li>
        <li>断面面积需同基准面。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a1=num('a1'),a2=num('a2'),l=num('l');
            const v=(a1+a2)/2*l;
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(2),'体积 (m³)'],
                [(v/1000).toFixed(3),'体积 (千m³)']
            ]));
        }
function resetForm(){document.getElementById('a1').value = '120';
      document.getElementById('a2').value = '180';
      document.getElementById('l').value = '20';
      calcTool();}
calcTool();
</script>
