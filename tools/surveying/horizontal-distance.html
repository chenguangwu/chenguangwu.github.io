<div class="container">
  <div class="card">
    <h2 data-zh="测距仪斜距 → 水平距离">Horizontal Distance</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="D = L·cos(α)，α 为竖直角。">Horizontal Distance is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">D_h = S·cosα</div>
      <p class="formula-desc">D = L·cos(α)，α 为竖直角。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="l">斜距 L (m)</label>
        <input type="number" id="l" value="150" step="1">
      </div>
      <div>
        <label for="a">竖直角 α (°)</label>
        <input type="number" id="a" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>α 为相对水平面的倾角。</li>
        <li>高差 = L·sin(α)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const l=num('l'),a=num('a')*Math.PI/180;
            const d=l*Math.cos(a);
            ToolBox.setResult('result', dataGrid([
                [d.toFixed(3),'水平距离 (m)'],
                [(l*Math.sin(a)).toFixed(3),'高差 (m)']
            ]));
        }
function resetForm(){document.getElementById('l').value = '150';
      document.getElementById('a').value = '10';
      calcTool();}
calcTool();
</script>
