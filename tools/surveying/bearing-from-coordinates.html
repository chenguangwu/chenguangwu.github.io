</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由两点坐标反算方位角">Bearing from Coordinates</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入北向增量 ΔN 与东向增量 ΔE，求方位角（0–360°）。">Bearing from Coordinates is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">α = atan2(ΔE, ΔN)</div>
      <p class="formula-desc">输入北向增量 ΔN 与东向增量 ΔE，求方位角（0–360°）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dN">北向增量 ΔN (米)</label>
        <input type="number" id="dN" value="100" step="5">
      </div>
      <div>
        <label for="dE">东向增量 ΔE (米)</label>
        <input type="number" id="dE" value="100" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>atan2(东,北) 保证象限正确。</li>
        <li>ΔN=ΔE=100 → 45°。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dN=num('dN'),dE=num('dE');
            let a=Math.atan2(dE,dN)*180/Math.PI;
            if(a<0)a+=360;
            ToolBox.setResult('result', dataGrid([
                [a.toFixed(2),'方位角 α (°)']
            ]));
        }
function resetForm(){document.getElementById('dN').value = '100';
      document.getElementById('dE').value = '100';
      calcTool();}
calcTool();
</script>
