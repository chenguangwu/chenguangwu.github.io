<div class="container">
  <div class="card">
    <h2 data-zh="抛物线形竖曲线">Vertical Curve Elev</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">y = y₀ + g₁x + (g₂−g₁)x²/(2L)。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">抛物线竖曲线 y = ax²+bx+c</div>
      <p class="formula-desc">y = y₀ + g₁x + (g₂−g₁)x²/(2L)。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="y0">变坡点高程 (m)</label>
        <input type="number" id="y0" value="100" step="1">
      </div>
      <div>
        <label for="g1">前坡比 g₁ (%) (%)</label>
        <input type="number" id="g1" value="3" step="0.5">
      </div>
      <div>
        <label for="g2">后坡比 g₂ (%) (%)</label>
        <input type="number" id="g2" value="-2" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="L">曲线长 L (m)</label>
        <input type="number" id="L" value="60" step="5">
      </div>
      <div>
        <label for="x">桩距 x (m)</label>
        <input type="number" id="x" value="20" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>x 自变坡点起算。</li>
        <li>凹/凸曲线由 g₁、g₂ 符号决定。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const y0=num('y0'),g1=num('g1')/100,g2=num('g2')/100,L=num('L'),x=num('x');
            const y=y0+g1*x+(g2-g1)*x*x/(2*L);
            ToolBox.setResult('result', dataGrid([
                [y.toFixed(3),'该桩高程 (m)'],
                [(y-y0).toFixed(3),'相对变坡点高差 (m)']
            ]));
        }
function resetForm(){document.getElementById('y0').value = '100';
      document.getElementById('g1').value = '3';
      document.getElementById('g2').value = '-2';
      document.getElementById('L').value = '60';
      document.getElementById('x').value = '20';
      calcTool();}
calcTool();
</script>
