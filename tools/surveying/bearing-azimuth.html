<div class="container">
  <div class="card">
    <h2>由坐标增量(Δx,Δy)求方位角</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">α = atan2(ΔE, ΔN)，归算至 0–360°。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">α = atan2(Δy, Δx)</div>
      <p class="formula-desc">α = atan2(ΔE, ΔN)，归算至 0–360°。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dn">北向差 ΔN (m)</label>
        <input type="number" id="dn" value="100" step="1">
      </div>
      <div>
        <label for="de">东向差 ΔE (m)</label>
        <input type="number" id="de" value="100" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>方位角自正北顺时针。</li>
        <li>坐标差需同基准。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dn=num('dn'),de=num('de');
            let az=Math.atan2(de,dn)*180/Math.PI;
            if(az<0)az+=360;
            const d=Math.sqrt(dn*dn+de*de);
            ToolBox.setResult('result', dataGrid([
                [az.toFixed(2),'方位角 (°)'],
                [d.toFixed(3),'水平距离 (m)']
            ]));
        }
function resetForm(){document.getElementById('dn').value = '100';
      document.getElementById('de').value = '100';
      calcTool();}
calcTool();
</script>
