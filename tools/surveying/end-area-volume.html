</nav>
<div class="container">
  <div class="card">
    <h2>由两端断面面积与间距求土方量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两端断面面积 A₁、A₂ 与间距 L，求体积。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">V = (A₁+A₂)/2 · L</div>
      <p class="formula-desc">输入两端断面面积 A₁、A₂ 与间距 L，求体积。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="A1">断面面积 A₁ (米²)</label>
        <input type="number" id="A1" value="10" step="1">
      </div>
      <div>
        <label for="A2">断面面积 A₂ (米²)</label>
        <input type="number" id="A2" value="20" step="1">
      </div>
      <div>
        <label for="L">间距 L (米)</label>
        <input type="number" id="L" value="50" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>相邻断面取平均乘间距。</li>
        <li>(10+20)/2×50 → 750 米³。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const A1=num('A1'),A2=num('A2'),L=num('L');
            const V=(A1+A2)/2*L;
            ToolBox.setResult('result', dataGrid([
                [V.toFixed(2),'土方体积 V (米³)']
            ]));
        }
function resetForm(){document.getElementById('A1').value = '10';
      document.getElementById('A2').value = '20';
      document.getElementById('L').value = '50';
      calcTool();}
calcTool();
</script>
