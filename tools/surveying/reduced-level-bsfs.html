<h1 class="sr-only"> RL = BM + ΣBS − ΣFS</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>由后视前视累计求待定点高程</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入已知点高程 BM、后视累计 BS 与前视累计 FS，求高程。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">H_i = H_{i−1} + BS − FS</div>
      <p class="formula-desc">输入已知点高程 BM、后视累计 BS 与前视累计 FS，求高程。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="BM">已知点高程 BM (米)</label>
        <input type="number" id="BM" value="100" step="1">
      </div>
      <div>
        <label for="BS">后视累计 BS (米)</label>
        <input type="number" id="BS" value="1.5" step="0.1">
      </div>
      <div>
        <label for="FS">前视累计 FS (米)</label>
        <input type="number" id="FS" value="0.5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>BS 升、FS 降。</li>
        <li>100+1.5−0.5 → 101.0 米。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const BM=num('BM'),BS=num('BS'),FS=num('FS');
            const RL=BM+BS-FS;
            ToolBox.setResult('result', dataGrid([
                [RL.toFixed(3),'待定点高程 RL (米)']
            ]));
        }
function resetForm(){document.getElementById('BM').value = '100';
      document.getElementById('BS').value = '1.5';
      document.getElementById('FS').value = '0.5';
      calcTool();}
calcTool();
</script>
