<div class="container">
  <div class="card">
    <h2>由半径与转角求曲线弦长</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入圆曲线半径 R 与转角 Δ（度），求弦长。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">c = 2R·sin(Δ/2)</div>
      <p class="formula-desc">输入圆曲线半径 R 与转角 Δ（度），求弦长。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="R">半径 R (米)</label>
        <input type="number" id="R" value="100" step="5">
      </div>
      <div>
        <label for="D">转角 Δ (度)</label>
        <input type="number" id="D" value="60" step="2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>弦长小于弧长。</li>
        <li>200·sin30° → 100 米。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const R=num('R'),D=num('D')*Math.PI/180;
            const C=2*R*Math.sin(D/2);
            ToolBox.setResult('result', dataGrid([
                [C.toFixed(3),'弦长 C (米)']
            ]));
        }
function resetForm(){document.getElementById('R').value = '100';
      document.getElementById('D').value = '60';
      calcTool();}
calcTool();
</script>
