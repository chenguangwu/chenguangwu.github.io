<div class="container">
  <div class="card">
    <h2 data-zh="视距丝间隔法">Stadia Distance</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">D = k·s·cos²θ（k=100）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">D = K·l·cos²α + C·cosα</div>
      <p class="formula-desc">D = k·s·cos²θ（k=100）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="s">视距间隔 s (m)</label>
        <input type="number" id="s" value="1.2" step="0.1">
      </div>
      <div>
        <label for="a">竖直角 θ (°)</label>
        <input type="number" id="a" value="5" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>视距常数 k=100。</li>
        <li>高差 = ½k·s·sin(2θ)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const s=num('s'),a=num('a')*Math.PI/180;
            const D=100*s*Math.cos(a)*Math.cos(a);
            ToolBox.setResult('result', dataGrid([
                [D.toFixed(3),'水平视距 (m)'],
                [(100*s*Math.sin(a)*Math.cos(a)).toFixed(3),'高差 (m)']
            ]));
        }
function resetForm(){document.getElementById('s').value = '1.2';
      document.getElementById('a').value = '5';
      calcTool();}
calcTool();
</script>
