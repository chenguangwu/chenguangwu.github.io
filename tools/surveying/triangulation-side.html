<div class="container">
  <div class="card">
    <h2 data-zh="正弦定理">Triangulation Side Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">a / sin A = b / sin B。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">a/sinA = b/sinB = c/sinC</div>
      <p class="formula-desc">a / sin A = b / sin B。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="a">已知边 a (m)</label>
        <input type="number" id="a" value="100" step="5">
      </div>
      <div>
        <label for="A">已知边对角 A (°)</label>
        <input type="number" id="A" value="45" step="1">
      </div>
      <div>
        <label for="B">待求边对角 B (°)</label>
        <input type="number" id="B" value="60" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>正弦定理适用于三角形。</li>
        <li>角度需为对边对角。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const a=num('a'),A=num('A')*Math.PI/180,B=num('B')*Math.PI/180;
            const b=a*Math.sin(B)/Math.sin(A);
            ToolBox.setResult('result', dataGrid([
                [b.toFixed(3),'待求边长 b (m)']
            ]));
        }
function resetForm(){document.getElementById('a').value = '100';
      document.getElementById('A').value = '45';
      document.getElementById('B').value = '60';
      calcTool();}
calcTool();
</script>
