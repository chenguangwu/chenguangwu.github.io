<div class="container">
  <div class="card">
    <h2>杨氏模量（E = σ / ε）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由应力与应变之比求弹性模量。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E = σ / ε</div>
      <p class="formula-desc">由应力与应变之比求弹性模量。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="s">应力 (Pa)</label>
        <input type="number" id="s" value="200e6" step="1e6">
      </div>
      <div>
        <label for="eps">应变</label>
        <input type="number" id="eps" value="0.001" step="0.0001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>E = σ/ε。</li>
        <li>200 MPa / 0.001 = 200 GPa（钢）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const s = num('s'), eps = num('eps');
            const E = s / eps;
            ToolBox.setResult('result', dataGrid([
                [E.toExponential(3), '弹性模量 E (Pa)'],
                [(E / 1e9).toFixed(1), 'E (GPa)']
            ]));
        }
function resetForm(){document.getElementById('s').value = '200e6';
      document.getElementById('eps').value = '0.001';
      calcTool();}
calcTool();
</script>
