<div class="container">
  <div class="card">
    <h2>工程应变（ε = (L − L₀) / L₀）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">标距长度的相对变化。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ε = (L</div>
      <p class="formula-desc">标距长度的相对变化。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="L">变形后长度 (mm)</label>
        <input type="number" id="L" value="101" step="0.1">
      </div>
      <div>
        <label for="L0">原始长度 (mm)</label>
        <input type="number" id="L0" value="100" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ε = (L−L₀)/L₀。</li>
        <li>101/100 → ε=0.01（1%）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const L = num('L'), L0 = num('L0');
            const eps = (L - L0) / L0;
            ToolBox.setResult('result', dataGrid([
                [eps.toFixed(5), '工程应变 ε'],
                [(eps * 100).toFixed(3), '伸长率 (%)']
            ]));
        }
function resetForm(){document.getElementById('L').value = '101';
      document.getElementById('L0').value = '100';
      calcTool();}
calcTool();
</script>
