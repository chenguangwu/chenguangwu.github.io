<h1 class="sr-only">BHN = 2F / [πD(D−√(D²−d²))]</h1>

<div class="nav">

  <span class="bc-sep">‹</span>
  <span class="bc-current">布氏硬度计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由压痕载荷与直径求布氏硬度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入载荷 F、压头直径 D 与压痕直径 d，求布氏硬度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F=3000N,D=10,d=4.2mm → 约 202 BHN。</div>
      <p class="formula-desc">输入载荷 F、压头直径 D 与压痕直径 d，求布氏硬度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="F">载荷 F (N)</label>
        <input type="number" id="F" value="3000" step="100">
      </div>
      <div>
        <label for="D">压头直径 D (mm)</label>
        <input type="number" id="D" value="10" step="0.5">
      </div>
      <div>
        <label for="d">压痕直径 d (mm)</label>
        <input type="number" id="d" value="4.2" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>单位一致（mm/N）即可。</li>
        <li>F=3000N,D=10,d=4.2mm → 约 202 BHN。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F'),D=num('D'),d=num('d');
            const BHN=2*F/(Math.PI*D*(D-Math.sqrt(D*D-d*d)));
            ToolBox.setResult('result', dataGrid([
                [BHN.toFixed(2),'布氏硬度 BHN']
            ]));
        }
function resetForm(){document.getElementById('F').value = '3000';
      document.getElementById('D').value = '10';
      document.getElementById('d').value = '4.2';
      calcTool();}
calcTool();
</script>
