<div class="container">
  <div class="card">
    <h2 data-zh="横向应变（ε_lat = −ν·ε_long）">Poisson Lateral</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="纵向受拉时横向收缩，比例系数为泊松比。">Poisson Lateral is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ε_lat = −ν·ε_long</div>
      <p class="formula-desc">纵向受拉时横向收缩，比例系数为泊松比。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="nu">泊松比 ν</label>
        <input type="number" id="nu" value="0.3" step="0.01">
      </div>
      <div>
        <label for="el">纵向应变</label>
        <input type="number" id="el" value="0.001" step="0.0001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ε_lat = −ν·ε_long。</li>
        <li>ν=0.3、纵向 0.001 → 横向 −0.0003。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const nu = num('nu'), el = num('el');
            const elat = -nu * el;
            ToolBox.setResult('result', dataGrid([
                [elat.toFixed(6), '横向应变 ε_lat'],
                [(-elat / el).toFixed(3), '回算 ν']
            ]));
        }
function resetForm(){document.getElementById('nu').value = '0.3';
      document.getElementById('el').value = '0.001';
      calcTool();}
calcTool();
</script>
