<div class="container">
  <div class="card">
    <h2>由应力与弹性模量求应变能密度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入应力 σ 与弹性模量 E，求单位体积应变能。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">u = σ²/(2E)。 σ=200MPa,E=200GPa → 100 kJ/m³。</div>
      <p class="formula-desc">输入应力 σ 与弹性模量 E，求单位体积应变能。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="sig">应力 σ (Pa)</label>
        <input type="number" id="sig" value="200e6" step="1e6">
      </div>
      <div>
        <label for="E">弹性模量 E (Pa)</label>
        <input type="number" id="E" value="200e9" step="1e9">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>u = σ²/(2E)。</li>
        <li>σ=200MPa,E=200GPa → 100 kJ/m³。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const sig=num('sig'),E=num('E');
            const u=sig*sig/(2*E);
            ToolBox.setResult('result', dataGrid([
                [(u/1e3).toFixed(1),'应变能密度 u (kJ/m³)']
            ]));
        }
function resetForm(){document.getElementById('sig').value = '200e6';
      document.getElementById('E').value = '200e9';
      calcTool();}
calcTool();
</script>
