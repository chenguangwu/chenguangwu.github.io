<div class="container">
  <div class="card">
    <h2>重度（γ = ρ·g）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">单位体积的重量（重度）。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">γ = ρ·g</div>
      <p class="formula-desc">单位体积的重量（重度）。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="rho">密度 (kg/m³)</label>
        <input type="number" id="rho" value="7850" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>γ = ρ·g。</li>
        <li>钢重度约 77 kN/m³。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho = num('rho');
            const g = 9.81;
            const gamma = rho * g;
            ToolBox.setResult('result', dataGrid([
                [gamma.toFixed(1), '重度 γ (N/m³)'],
                [(gamma / 1000).toFixed(2), 'γ (kN/m³)']
            ]));
        }
function resetForm(){document.getElementById('rho').value = '7850';
      calcTool();}
calcTool();
</script>
