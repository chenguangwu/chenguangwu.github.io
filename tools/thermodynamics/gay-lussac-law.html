<div class="container">
  <div class="card">
    <h2>盖-吕萨克定律计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">等容压强-温度（P₂ = P₁·T₂ / T₁）</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">体积不变时，理想气体压强与热力学温度成正比。</p>

    <div class="input-row">
      <div>
        <label for="P1">初压强 (kPa)</label>
        <input type="number" id="P1" value="100" step="0.1">
      </div>
      <div>
        <label for="T1">初温度 (K)</label>
        <input type="number" id="T1" value="300" step="0.1">
      </div>
      <div>
        <label for="T2">末温度 (K)</label>
        <input type="number" id="T2" value="400" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P₁/T₁ = P₂/T₂，温度须为开尔文。</li>
        <li>300 K→400 K 压强升约 33.3%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P1 = num('P1'), T1 = num('T1'), T2 = num('T2');
            const P2 = P1 * T2 / T1;
            ToolBox.setResult('result', dataGrid([
                [P2.toFixed(3), '末压强 P₂ (kPa)'],
                [((P2 / P1)).toFixed(4), '压强放大倍数']
            ]));
        }
function resetForm(){document.getElementById('P1').value = '100';
      document.getElementById('T1').value = '300';
      document.getElementById('T2').value = '400';
      calcTool();}
calcTool();
</script>
