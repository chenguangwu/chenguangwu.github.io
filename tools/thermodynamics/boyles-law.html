<div class="container">
  <div class="card">
    <h2>玻意耳定律计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">等温压强-体积（P₁V₁ = P₂V₂）</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">温度不变时，理想气体压强与体积成反比。</p>

    <div class="input-row">
      <div>
        <label for="P1">初压强 (kPa)</label>
        <input type="number" id="P1" value="100" step="0.1">
      </div>
      <div>
        <label for="V1">初体积 (L)</label>
        <input type="number" id="V1" value="2" step="0.01">
      </div>
      <div>
        <label for="P2">末压强 (kPa)</label>
        <input type="number" id="P2" value="50" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P₁V₁ = P₂V₂（等温）。</li>
        <li>压强减半，体积加倍。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P1 = num('P1'), V1 = num('V1'), P2 = num('P2');
            const V2 = P1 * V1 / P2;
            ToolBox.setResult('result', dataGrid([
                [V2.toFixed(4), '末体积 V₂ (L)'],
                [((P1 / P2)).toFixed(4), '体积放大倍数']
            ]));
        }
function resetForm(){document.getElementById('P1').value = '100';
      document.getElementById('V1').value = '2';
      document.getElementById('P2').value = '50';
      calcTool();}
calcTool();
</script>
