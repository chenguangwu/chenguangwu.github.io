<div class="container">
  <div class="card">
    <h2>集总参数法的温度衰减</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入初温、环境温、时间常数 k 与时间，求当前温度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">k=0.05/min、30min → 约 40℃。</div>
      <p class="formula-desc">输入初温、环境温、时间常数 k 与时间，求当前温度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T0">初温 T₀ (℃)</label>
        <input type="number" id="T0" value="100" step="1">
      </div>
      <div>
        <label for="Tinf">环境温度 T∞ (℃)</label>
        <input type="number" id="Tinf" value="20" step="1">
      </div>
      <div>
        <label for="k">冷却常数 k (1/min)</label>
        <input type="number" id="k" value="0.05" step="0.005">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="t">时间 t (min)</label>
        <input type="number" id="t" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>T(t)=T∞+(T₀−T∞)e^(−kt)。</li>
        <li>k=0.05/min、30min → 约 40℃。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T0=num('T0'),Ti=num('Tinf'),k=num('k'),t=num('t');
            const T=Ti+(T0-Ti)*Math.exp(-k*t);
            ToolBox.setResult('result', dataGrid([
                [T.toFixed(2),'t 时刻温度 (℃)']
            ]));
        }
function resetForm(){document.getElementById('T0').value = '100';
      document.getElementById('Tinf').value = '20';
      document.getElementById('k').value = '0.05';
      document.getElementById('t').value = '30';
      calcTool();}
calcTool();
</script>
