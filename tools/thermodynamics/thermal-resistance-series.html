</nav>
<div class="container">
  <div class="card">
    <h2>双层复合壁总热阻与热流</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两层的厚度、导热系数与面积，求总热阻、总温差热流。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R=R1+R2，U=1/R_total。 保温层+砖墙示例可得低 U 值。</div>
      <p class="formula-desc">输入两层的厚度、导热系数与面积，求总热阻、总温差热流。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="L1">层1 厚度 L₁ (m)</label>
        <input type="number" id="L1" value="0.1" step="0.01">
      </div>
      <div>
        <label for="k1">层1 导热系数 k₁ (W/(m·K))</label>
        <input type="number" id="k1" value="0.04" step="0.01">
      </div>
      <div>
        <label for="L2">层2 厚度 L₂ (m)</label>
        <input type="number" id="L2" value="0.2" step="0.01">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="k2">层2 导热系数 k₂ (W/(m·K))</label>
        <input type="number" id="k2" value="1.0" step="0.1">
      </div>
      <div>
        <label for="A">面积 A (m²)</label>
        <input type="number" id="A" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>串联 R=R1+R2，U=1/R_total。</li>
        <li>保温层+砖墙示例可得低 U 值。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const L1=num('L1'),k1=num('k1'),L2=num('L2'),k2=num('k2'),A=num('A');
            const R1=L1/(k1*A), R2=L2/(k2*A);
            ToolBox.setResult('result', dataGrid([
                [(R1+R2).toFixed(4),'总热阻 R (K/W)'],
                [(1/(R1+R2)).toFixed(2),'总传热系数 U (W/(m²·K))']
            ]));
        }
function resetForm(){document.getElementById('L1').value = '0.1';
      document.getElementById('k1').value = '0.04';
      document.getElementById('L2').value = '0.2';
      document.getElementById('k2').value = '1.0';
      document.getElementById('A').value = '1';
      calcTool();}
calcTool();
</script>
