<div class="container">
  <div class="card">
    <h2>理想气体压强（P = nRT / V）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由理想气体状态方程求给定体积下的气体压强。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = nRT / V，R = 8.314 kPa·L/(mol·K)</div>
      <p class="formula-desc">由理想气体状态方程求给定体积下的气体压强。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">物质的量 (mol)</label>
        <input type="number" id="n" value="1" step="0.001">
      </div>
      <div>
        <label for="T">温度 (K)</label>
        <input type="number" id="T" value="273.15" step="0.01">
      </div>
      <div>
        <label for="V">体积 (L)</label>
        <input type="number" id="V" value="22.414" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>P = nRT / V，R = 8.314 kPa·L/(mol·K)。</li>
        <li>1 mol 在 STP(22.414 L) 下约 101.3 kPa。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n = num('n'), T = num('T'), V = num('V');
            const R = 8.314;
            const P = n * R * T / V;
            ToolBox.setResult('result', dataGrid([
                [P.toFixed(3), '压强 P (kPa)'],
                [(P * 1000).toFixed(1), '压强 (Pa)']
            ]));
        }
function resetForm(){document.getElementById('n').value = '1';
      document.getElementById('T').value = '273.15';
      document.getElementById('V').value = '22.414';
      calcTool();}
calcTool();
</script>
