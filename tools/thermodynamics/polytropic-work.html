<h1 class="sr-only">W = (P₂V₂ − P₁V₁) / (1 − n)</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 多变过程功计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🌡️ 热力学</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">多变过程功计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>多方指数 n 过程的体积功</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入初末态压力与体积及多方指数 n，求过程功。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">W=(P₂V₂−P₁V₁)/(1−n)（SI 单位）。 n=1 时退化为等温，需另用 ln 式。</div>
      <p class="formula-desc">输入初末态压力与体积及多方指数 n，求过程功。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p1">初压 P₁ (kPa)</label>
        <input type="number" id="p1" value="100" step="1">
      </div>
      <div>
        <label for="v1">初容 V₁ (m³)</label>
        <input type="number" id="v1" value="1" step="0.1">
      </div>
      <div>
        <label for="p2">末压 P₂ (kPa)</label>
        <input type="number" id="p2" value="50" step="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v2">末容 V₂ (m³)</label>
        <input type="number" id="v2" value="2" step="0.1">
      </div>
      <div>
        <label for="n">多方指数 n</label>
        <input type="number" id="n" value="1.3" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>W=(P₂V₂−P₁V₁)/(1−n)（SI 单位）。</li>
        <li>n=1 时退化为等温，需另用 ln 式。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p1=num('p1')*1000, v1=num('v1'), p2=num('p2')*1000, v2=num('v2'), n=num('n');
            const W=(p2*v2 - p1*v1)/(1-n);
            ToolBox.setResult('result', dataGrid([
                [(W/1000).toFixed(2),'过程功 W (kJ)']
            ]));
        }
function resetForm(){document.getElementById('p1').value = '100';
      document.getElementById('v1').value = '1';
      document.getElementById('p2').value = '50';
      document.getElementById('v2').value = '2';
      document.getElementById('n').value = '1.3';
      calcTool();}
calcTool();
</script>
