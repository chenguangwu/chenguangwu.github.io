<div class="container">
  <div class="card">
    <h2 data-zh="潜热（Q = m·L）">Latent Heat</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="相变（熔化/汽化）过程吸收或释放的热量。">Latent Heat is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = m·L</div>
      <p class="formula-desc">相变（熔化/汽化）过程吸收或释放的热量。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="m">质量 (kg)</label>
        <input type="number" id="m" value="1" step="0.01">
      </div>
      <div>
        <label for="L">潜热 (J/kg)</label>
        <input type="number" id="L" value="334000" step="1000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Q = m·L；冰的熔解潜热 3.34×10⁵ J/kg。</li>
        <li>1 kg 冰融化需 334 kJ。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m = num('m'), L = num('L');
            const Q = m * L;
            ToolBox.setResult('result', dataGrid([
                [Q.toFixed(0), '相变热量 Q (J)'],
                [(Q / 1e6).toFixed(3), '热量 (MJ)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '1';
      document.getElementById('L').value = '334000';
      calcTool();}
calcTool();
</script>
