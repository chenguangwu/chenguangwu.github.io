<div class="container">
  <div class="card">
    <h2 data-zh="内能变化（ΔU = Q − W）">First Law</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="系统内能变化等于吸热量减去对外做功。">First Law is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ΔU = Q − W</div>
      <p class="formula-desc">系统内能变化等于吸热量减去对外做功。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="Q">吸热量 (J)</label>
        <input type="number" id="Q" value="1000" step="1">
      </div>
      <div>
        <label for="W">对外做功 (J)</label>
        <input type="number" id="W" value="400" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ΔU = Q − W（系统吸热为正、对外做功为正）。</li>
        <li>吸热 1000 J、做功 400 J → ΔU=600 J。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Q = num('Q'), W = num('W');
            const dU = Q - W;
            ToolBox.setResult('result', dataGrid([
                [dU.toFixed(1), '内能变化 ΔU (J)'],
                [((dU / Q) * 100).toFixed(2), '占吸热比 (%)']
            ]));
        }
function resetForm(){document.getElementById('Q').value = '1000';
      document.getElementById('W').value = '400';
      calcTool();}
calcTool();
</script>
