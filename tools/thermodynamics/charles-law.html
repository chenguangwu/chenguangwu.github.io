<div class="container">
  <div class="card">
    <h2>查尔斯定律计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">等压体积-温度（V₂ = V₁·T₂ / T₁）</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">压强不变时，理想气体体积与热力学温度成正比。</p>

    <div class="input-row">
      <div>
        <label for="V1">初体积 (L)</label>
        <input type="number" id="V1" value="1" step="0.01">
      </div>
      <div>
        <label for="T1">初温度 (K)</label>
        <input type="number" id="T1" value="273.15" step="0.01">
      </div>
      <div>
        <label for="T2">末温度 (K)</label>
        <input type="number" id="T2" value="373.15" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>V₁/T₁ = V₂/T₂，温度须为开尔文。</li>
        <li>0℃→100℃(等压)体积约增 36.6%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const V1 = num('V1'), T1 = num('T1'), T2 = num('T2');
            const V2 = V1 * T2 / T1;
            ToolBox.setResult('result', dataGrid([
                [V2.toFixed(4), '末体积 V₂ (L)'],
                [((T2 / T1)).toFixed(4), '体积放大倍数']
            ]));
        }
function resetForm(){document.getElementById('V1').value = '1';
      document.getElementById('T1').value = '273.15';
      document.getElementById('T2').value = '373.15';
      calcTool();}
calcTool();
</script>
