<div class="container">
  <div class="card">
    <h2>📕 小红书文案计数器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">统计字数、行数、话题数，支持 1000 字上限提醒。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本文本工具基于标准字符编码与文本处理规则，纯前端运行，代码不离开浏览器。 工具名称：小红书文案计数器。</p>
</div>


    <label>输入内容</label>
    <textarea id="text" rows="12" oninput="calc()" placeholder="输入你的文案..."></textarea>

    <label>目标上限</label>
    <input id="limit" type="number" value="1000" min="1" oninput="calc()">

    <div class="result-box" id="stats"></div>
    <div class="toolbar">
      <button class="btn" onclick="copyTextResult()">复制正文</button>
      <button class="btn" onclick="clearAll()">清空</button>
    </div>
  </div>
</div>

<script>
function calc() {
  const text = document.getElementById('text').value || '';
  const lines = text.split(/\n/).filter(Boolean);
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const hashtags = (text.match(/#[^#\s]+/g) || []).length;
  const limit = Number(document.getElementById('limit').value) || 1000;
  const left = limit - chars;

  const state = left >= 0 ? '正常' : '超出 ' + Math.abs(left);
  const color = left >= 0 ? 'var(--success)' : 'var(--danger)';

  document.getElementById('stats').innerHTML = [
    '<p>字符数：<strong>' + chars + '</strong> / ' + limit + '</p>',
    '<p>行数：<strong>' + lines.length + '</strong></p>',
    '<p>词数：<strong>' + words + '</strong></p>',
    '<p>话题标签：<strong>' + hashtags + '</strong></p>',
    '<p>状态：<strong style="color:' + color + '">' + state + '</strong></p>'
  ].join('');
}

function copyTextResult() {
  ToolBox.copyText(document.getElementById('text').value, i18nText('msg270'));
}

function clearAll() {
  document.getElementById('text').value = '';
  calc();
}

calc();
</script>
