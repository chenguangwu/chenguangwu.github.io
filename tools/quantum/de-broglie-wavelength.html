<div class="container">
  <div class="card">
    <h2>λ = h / (m·v)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="物质波的波长与动量关系。">De Broglie Wavelength is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">λ ≈ 0.73 nm。</div>
      <p class="formula-desc">物质波的波长与动量关系。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="9.11e-31" step="1e-31">
      </div>
      <div>
        <label for="v">速度 v (m/s)</label>
        <input type="number" id="v" value="1e6" step="1e5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>λ = h/(mv)。</li>
        <li>电子 1e6 m/s → λ ≈ 0.73 nm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const H=6.62607015e-34,C=299792458,ME=9.10938356e-31,EV=1.602176634e-19,A0=5.291772109e-11,RY=1.0973731568e7,B_WIEN=2.897771955e-3;
            const m = num('m'), v = num('v');
            const lam = H / (m * v);
            ToolBox.setResult('result', dataGrid([
                [lam.toExponential(3), '波长 λ (m)'],
                [(lam * 1e9).toFixed(4), 'λ (nm)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '9.11e-31';
      document.getElementById('v').value = '1e6';
      calcTool();}
calcTool();
</script>
