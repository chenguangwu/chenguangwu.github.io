<div class="container">
  <div class="card">
    <h2 data-zh="由时间不确定度求能量展宽">Energy Time Uncertainty</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入时间不确定度 Δt，求最小能量展宽。">Energy Time Uncertainty is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ΔE·Δt ≥ ħ/2</div>
      <p class="formula-desc">输入时间不确定度 Δt，求最小能量展宽。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dt">时间不确定度 Δt (s)</label>
        <input type="number" id="dt" value="1e-9" step="1e-10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ΔE·Δt ≥ ℏ/2。</li>
        <li>Δt=1ns → ΔE≈3.3×10⁻⁷ eV。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const hbar=1.054571817e-34, e=1.602176634e-19;
            const dt=num('dt');
            const dE=hbar/(2*dt);
            ToolBox.setResult('result', dataGrid([
                [(dE/e).toExponential(3),'能量展宽 ΔE (eV)']
            ]));
        }
function resetForm(){document.getElementById('dt').value = '1e-9';
      calcTool();}
calcTool();
</script>
