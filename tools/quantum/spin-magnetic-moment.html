<div class="container">
  <div class="card">
    <h2>由磁量子数求磁矩</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入磁量子数 m_l，求轨道磁矩（以 μ_B 为单位）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">μ = μ_B·m_l</div>
      <p class="formula-desc">输入磁量子数 m_l，求轨道磁矩（以 μ_B 为单位）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ml">磁量子数 m_l</label>
        <input type="number" id="ml" value="1" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>μ = μ_B·m_l，μ_B≈9.274×10⁻²⁴ J/T。</li>
        <li>m_l=1 → 1 μ_B。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const muB=9.2740100783e-24;
            const ml=num('ml');
            const mu=muB*ml;
            ToolBox.setResult('result', dataGrid([
                [ml.toFixed(0),'磁矩 μ (μ_B)'],
                [mu.toExponential(3),'磁矩 μ (J/T)']
            ]));
        }
function resetForm(){document.getElementById('ml').value = '1';
      calcTool();}
calcTool();
</script>
