<div class="container">

    <h2>Δx·Δp ≥ ħ / 2</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">位置与动量不确定度的乘积下限。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具为纯前端在线工具，数据在浏览器本地处理、不上传服务器，依据对应领域标准与规范进行计算或处理，结果仅供参考。 工具名称：海森堡不确定性 - 不确定性原理：Δx·Δp ≥ ħ/2。</p>
</div>


    <div class="input-row">
      <div>
        <label for="dx">位置不确定度 Δx (m)</label>
        <input type="number" id="dx" value="1e-10" step="1e-11">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Δx·Δp ≥ ħ/2。</li>
        <li>ħ = h/(2π)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const H=6.62607015e-34,C=299792458,ME=9.10938356e-31,EV=1.602176634e-19,A0=5.291772109e-11,RY=1.0973731568e7,B_WIEN=2.897771955e-3;
            const dx = num('dx');
            const hbar = H / (2 * Math.PI);
            const dp = hbar / (2 * dx);
            ToolBox.setResult('result', dataGrid([
                [dp.toExponential(3), '动量不确定度 Δp (kg·m/s)'],
                [(dp / ME).toExponential(3), '等效速度不确定 (m/s)']
            ]));
        }
function resetForm(){document.getElementById('dx').value = '1e-10';
      calcTool();}
calcTool();
</script>
