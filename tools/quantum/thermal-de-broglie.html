<div class="container">
  <div class="card">
    <h2 data-zh="由温度与质量求热德布罗意波长">Thermal De Broglie</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入质量 m、温度 T，求热德布罗意波长。">Thermal De Broglie is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">λ = h/√(2π·m·k_B·T)</div>
      <p class="formula-desc">输入质量 m、温度 T，求热德布罗意波长。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="9.109e-31" step="1e-31">
      </div>
      <div>
        <label for="T">温度 T (K)</label>
        <input type="number" id="T" value="300" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>λ = h/√(2πmkT)。</li>
        <li>电子 300K → 约 4.3 nm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const h=6.62607015e-34, kB=1.380649e-23;
            const m=num('m'),T=num('T');
            const lam=h/Math.sqrt(2*Math.PI*m*kB*T);
            ToolBox.setResult('result', dataGrid([
                [(lam*1e9).toFixed(3),'热德布罗意波长 λ (nm)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '9.109e-31';
      document.getElementById('T').value = '300';
      calcTool();}
calcTool();
</script>
