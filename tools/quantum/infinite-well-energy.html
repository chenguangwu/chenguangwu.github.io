<div class="container">
  <div class="card">
    <h2>E_n = n²·h² / (8·m·L²)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="粒子在一维势阱中的能级。">Infinite Well Energy is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E_n = n²h²/(8mL²)。 电子 1 nm 阱基态 ≈ 0.376 eV。</div>
      <p class="formula-desc">粒子在一维势阱中的能级。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n">量子数 n</label>
        <input type="number" id="n" value="1" step="1">
      </div>
      <div>
        <label for="m">粒子质量 m (kg)</label>
        <input type="number" id="m" value="9.11e-31" step="1e-31">
      </div>
      <div>
        <label for="L">阱宽 L (m)</label>
        <input type="number" id="L" value="1e-9" step="1e-10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>E_n = n²h²/(8mL²)。</li>
        <li>电子 1 nm 阱基态 ≈ 0.376 eV。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const H=6.62607015e-34,C=299792458,ME=9.10938356e-31,EV=1.602176634e-19,A0=5.291772109e-11,RY=1.0973731568e7,B_WIEN=2.897771955e-3;
            const n = Math.round(num('n')), m = num('m'), L = num('L');
            const E = n * n * H * H / (8 * m * L * L);
            ToolBox.setResult('result', dataGrid([
                [E.toExponential(3), '能级 E_n (J)'],
                [(E / EV).toFixed(4), 'E_n (eV)']
            ]));
        }
function resetForm(){document.getElementById('n').value = '1';
      document.getElementById('m').value = '9.11e-31';
      document.getElementById('L').value = '1e-9';
      calcTool();}
calcTool();
</script>
