<div class="container">
  <div class="card">
    <h2>K_max = h·f − φ</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">光电子最大初动能等于光子能量减功函数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">K_max = hf − φ。 f 需 > φ/h 才逸出。</div>
      <p class="formula-desc">光电子最大初动能等于光子能量减功函数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f">频率 f (Hz)</label>
        <input type="number" id="f" value="1.0e15" step="1e14">
      </div>
      <div>
        <label for="phi">功函数 φ (eV)</label>
        <input type="number" id="phi" value="2.0" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>K_max = hf − φ。</li>
        <li>f 需 > φ/h 才逸出。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const H=6.62607015e-34,C=299792458,ME=9.10938356e-31,EV=1.602176634e-19,A0=5.291772109e-11,RY=1.0973731568e7,B_WIEN=2.897771955e-3;
            const f = num('f'), phi = num('phi') * EV;
            const K = H * f - phi;
            ToolBox.setResult('result', dataGrid([
                [K.toExponential(3), '最大动能 K (J)'],
                [(K / EV).toFixed(3), 'K (eV)'],
                [K > 0 ? '能逸出' : '不能逸出（hf<φ）', '判定']
            ]));
        }
function resetForm(){document.getElementById('f').value = '1.0e15';
      document.getElementById('phi').value = '2.0';
      calcTool();}
calcTool();
</script>
