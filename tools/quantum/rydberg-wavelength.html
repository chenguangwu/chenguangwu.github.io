<div class="container">
  <div class="card">
    <h2>1/λ = R·(1/n₁² − 1/n₂²)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">氢原子谱线波长。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">R≈1.097e7 m⁻¹。 n:3→2 为巴耳末 α 线 ≈ 656 nm。</div>
      <p class="formula-desc">氢原子谱线波长。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="n1">低能级 n₁</label>
        <input type="number" id="n1" value="2" step="1">
      </div>
      <div>
        <label for="n2">高能级 n₂</label>
        <input type="number" id="n2" value="3" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>里德伯常量 R≈1.097e7 m⁻¹。</li>
        <li>n:3→2 为巴耳末 α 线 ≈ 656 nm。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const H=6.62607015e-34,C=299792458,ME=9.10938356e-31,EV=1.602176634e-19,A0=5.291772109e-11,RY=1.0973731568e7,B_WIEN=2.897771955e-3;
            let n1 = Math.round(num('n1')), n2 = Math.round(num('n2'));
            if (n1 > n2) { const t = n1; n1 = n2; n2 = t; }
            const inv = RY * (1/(n1*n1) - 1/(n2*n2));
            ToolBox.setResult('result', dataGrid([
                [inv.toExponential(3), '波数 1/λ (m⁻¹)'],
                [((1/inv) * 1e9).toFixed(2), '波长 λ (nm)']
            ]));
        }
function resetForm(){document.getElementById('n1').value = '2';
      document.getElementById('n2').value = '3';
      calcTool();}
calcTool();
</script>
