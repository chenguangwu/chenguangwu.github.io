<div class="container">
  <div class="card">
    <h2>🏗️ 圆轴扭转剪应力计算（工程）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">θ = T·L / (G·J)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算受扭圆轴的最大剪应力与单位扭转角。</p>

    <div class="input-row">
      <div>
        <label for="T">扭矩 T (kN·m)</label>
        <input type="number" id="T" value="2" step="0.1" min="0">
      </div>
      <div>
        <label for="d">轴径 d (mm)</label>
        <input type="number" id="d" value="50" step="1" min="1">
      </div>
      <div>
        <label for="G">剪切模量 G (GPa)</label>
        <input type="number" id="G" value="80" step="2" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="L">轴长 L (m)</label>
        <input type="number" id="L" value="1" step="0.1" min="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>极惯性矩 J = πd⁴/32</li>
        <li>最大剪应力 τ_max = T·r / J（r = d/2）</li>
        <li>扭转角 θ = T·L / (G·J)</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T')*1000, d=num('d')/1000, G=num('G')*1e9, L=num('L');
            if(d<=0||G<=0||L<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效的轴参数。</p>');return;}
            const J=Math.PI*Math.pow(d,4)/32;
            const tau=T*d/2/J/1e6;     // Pa -> MPa
            const theta=T*L/(G*J);     // rad
            const html=dataGrid([
                [(J*1e12).toFixed(3),'极惯性矩 J (mm⁴)'],
                [tau.toFixed(2),'最大剪应力 τ_max (MPa)'],
                [(theta*180/Math.PI).toFixed(3),'扭转角 θ (°)']
            ]);
            ToolBox.setResult('result', html);
        }
function resetForm(){document.getElementById('T').value = '2';
      document.getElementById('d').value = '50';
      document.getElementById('G').value = '80';
      document.getElementById('L').value = '1';
      calcTool();}
calcTool();
</script>
