<div class="container">
  <div class="card">
    <h2>🏗️ 轴向拉压应力与应变计算（工程）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ε = σ / E</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按轴向荷载与截面积计算正应力、线应变与轴向变形。</p>

    <div class="input-row">
      <div>
        <label for="F">轴向力 F (kN)</label>
        <input type="number" id="F" value="50" step="1" min="0">
      </div>
      <div>
        <label for="A">截面积 A (mm²)</label>
        <input type="number" id="A" value="500" step="10" min="1">
      </div>
      <div>
        <label for="E">弹性模量 E (GPa)</label>
        <input type="number" id="E" value="200" step="5" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="L">原长 L (m)</label>
        <input type="number" id="L" value="2" step="0.1" min="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>应力 σ = F / A</li>
        <li>应变 ε = σ / E（胡克定律）</li>
        <li>变形 ΔL = ε · L</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F')*1000, A=num('A'), E=num('E')*1e9, L=num('L');
            if(A<=0||E<=0||L<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效的材料与几何参数。</p>');return;}
            const sigma=F/A;            // N/mm² = MPa (F in N, A in mm²)
            const eps=sigma*1e6/E;      // MPa -> Pa, 除以 E(Pa) 得应变
            const dL=eps*L*1000;        // mm
            const html=dataGrid([
                [sigma.toFixed(2),'正应力 σ (MPa)'],
                [eps.toExponential(3),'线应变 ε'],
                [dL.toFixed(3),'轴向变形 ΔL (mm)']
            ]);
            ToolBox.setResult('result', html);
        }
function resetForm(){document.getElementById('F').value = '50';
      document.getElementById('A').value = '500';
      document.getElementById('E').value = '200';
      document.getElementById('L').value = '2';
      calcTool();}
calcTool();
</script>
