<div class="container">
  <div class="card">
    <h2 data-zh="🏗️ 角焊缝强度计算（工程）">🏗️ Weld Strength</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">A_e = 0.7·h_f·l_w</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由焊缝尺寸与作用力计算角焊缝的平均剪应力。">Weld Strength is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="F">作用力 F (kN)</label>
        <input type="number" id="F" value="50" step="1" min="0">
      </div>
      <div>
        <label for="hf">焊脚尺寸 h_f (mm)</label>
        <input type="number" id="hf" value="6" step="0.5" min="1">
      </div>
      <div>
        <label for="lw">焊缝计算长度 l_w (mm)</label>
        <input type="number" id="lw" value="200" step="10" min="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>A_e = 0.7·h_f·l_w（角焊缝有效截面）</li>
        <li>τ = F / A_e，应 ≤ 角焊缝强度设计值</li>
        <li>l_w 应扣除起灭弧缺陷（通常减 2h_f）</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const F=num('F')*1000, hf=num('hf'), lw=num('lw');
            if(F<=0||hf<=0||lw<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效参数。</p>');return;}
            const A=0.7*hf*lw; // mm² 有效截面
            const tau=F/A; // MPa
            ToolBox.setResult('result', dataGrid([
                [A.toFixed(0),'焊缝有效截面 A_e (mm²)'],
                [tau.toFixed(2),'焊缝剪应力 τ (MPa)']
            ]));
        }
function resetForm(){document.getElementById('F').value = '50';
      document.getElementById('hf').value = '6';
      document.getElementById('lw').value = '200';
      calcTool();}
calcTool();
</script>
