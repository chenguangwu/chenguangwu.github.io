<div class="container">
  <div class="card">
    <h2 data-zh="🏗️ 薄壁圆筒容器壁厚计算（工程）">🏗️ Pressure Vessel</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t = P·D / (2[σ]·φ)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按薄壁圆筒环向应力公式由内压计算所需壁厚。">Pressure Vessel is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="P">设计内压 P (MPa)</label>
        <input type="number" id="P" value="1.6" step="0.1" min="0">
      </div>
      <div>
        <label for="D">容器内径 D (mm)</label>
        <input type="number" id="D" value="1000" step="10" min="10">
      </div>
      <div>
        <label for="sigma">许用应力 [σ] (MPa)</label>
        <input type="number" id="sigma" value="130" step="5" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="phi">焊缝系数 φ</label>
        <input type="number" id="phi" value="0.85" step="0.05" min="0.1" max="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>t = P·D / (2[σ]·φ)（环向应力控制）</li>
        <li>适用于 D/t ≥ 20 的薄壁圆筒</li>
        <li>实际设计还应校核轴向应力与稳定</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P'), D=num('D'), sig=num('sigma'), phi=num('phi');
            if(P<=0||D<=0||sig<=0||phi<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效参数。</p>');return;}
            const t=P*D/(2*sig*phi); // mm (薄壁环向应力公式)
            ToolBox.setResult('result', dataGrid([
                [t.toFixed(2),'所需壁厚 t (mm)'],
                [(t+2).toFixed(2),'计入腐蚀裕量后 (~+2mm)']
            ]));
        }
function resetForm(){document.getElementById('P').value = '1.6';
      document.getElementById('D').value = '1000';
      document.getElementById('sigma').value = '130';
      document.getElementById('phi').value = '0.85';
      calcTool();}
calcTool();
</script>
