<div class="container">
  <div class="card">
    <h2>🏗️ 螺栓预紧力计算（工程）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F = T / (K · d)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按拧紧扭矩与扭矩系数估算螺栓轴向预紧力。</p>

    <div class="input-row">
      <div>
        <label for="T">拧紧扭矩 T (N·m)</label>
        <input type="number" id="T" value="100" step="5" min="0">
      </div>
      <div>
        <label for="d">螺纹公称直径 d (mm)</label>
        <input type="number" id="d" value="12" step="1" min="1">
      </div>
      <div>
        <label for="K">扭矩系数 K</label>
        <input type="number" id="K" value="0.2" step="0.01" min="0.05" max="0.4">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>F = T / (K · d)，d 取公称直径（m）</li>
        <li>扭矩系数 K 通常 0.1~0.25（有润滑取小值）</li>
        <li>实际预紧力受摩擦影响，建议配合拉伸法校核</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'), d=num('d')/1000, K=num('K');
            if(d<=0||K<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效的螺栓参数。</p>');return;}
            const F=T/(K*d);   // N
            const html=dataGrid([
                [(F/1000).toFixed(2),'预紧力 F (kN)'],
                [(F).toFixed(0),'预紧力 F (N)']
            ]);
            ToolBox.setResult('result', html);
        }
function resetForm(){document.getElementById('T').value = '100';
      document.getElementById('d').value = '12';
      document.getElementById('K').value = '0.2';
      calcTool();}
calcTool();
</script>
