<div class="container">
  <div class="card">
    <h2 data-zh="🏗️ 悬臂梁端部集中荷载挠度（工程）">🏗️ Cantilever Deflection</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">δ = P·L³ / (3EI)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="计算自由端受集中力的悬臂梁端部挠度与自由端转角。">Cantilever Deflection is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="P">端部荷载 P (kN)</label>
        <input type="number" id="P" value="5" step="0.5" min="0">
      </div>
      <div>
        <label for="L">梁长 L (m)</label>
        <input type="number" id="L" value="3" step="0.1" min="0.1">
      </div>
      <div>
        <label for="E">弹性模量 E (GPa)</label>
        <input type="number" id="E" value="30" step="1" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="I">惯性矩 I (cm⁴)</label>
        <input type="number" id="I" value="5000" step="100" min="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>端部挠度 δ = P·L³ / (3EI)</li>
        <li>自由端转角 θ = P·L² / (2EI)</li>
        <li>单位需统一为 N、m</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P=num('P')*1000, L=num('L'), E=num('E')*1e9, I=num('I')*1e-8;
            if(L<=0||E<=0||I<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效的梁参数。</p>');return;}
            const delta=P*Math.pow(L,3)/(3*E*I)*1000;  // m->mm
            const theta=P*L*L/(2*E*I)*180/Math.PI;     // rad->deg
            const html=dataGrid([
                [delta.toFixed(2),'端部挠度 δ (mm)'],
                [theta.toFixed(3),'自由端转角 θ (°)']
            ]);
            ToolBox.setResult('result', html);
        }
function resetForm(){document.getElementById('P').value = '5';
      document.getElementById('L').value = '3';
      document.getElementById('E').value = '30';
      document.getElementById('I').value = '5000';
      calcTool();}
calcTool();
</script>
