<div class="container">
  <div class="card">
    <h2>🧘 PHQ-9 抑郁筛查量表</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">过去 2 周内，以下问题困扰您的频率？0=没有，1=几天，2=一半以上天数，3=几乎每天。</p>

    <div id="items"></div>

    <div class="phq-item" style="background:rgba(59,130,246,0.06);border-color:rgba(59,130,246,0.15);">
      <label for="q10">10. 如果存在以上问题，对您工作、社交或家庭生活的影响有多大？（不计分）</label>
      <select id="q10" onchange="calc()">
        <option value="0">没有困难</option>
        <option value="1">有点困难</option>
        <option value="2">非常困难</option>
        <option value="3">极其困难</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算得分</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_phq9';
const questions = [
  '1. 做事时提不起劲或没有兴趣',
  '2. 感到心情低落、沮丧或绝望',
  '3. 入睡困难、睡不安稳或睡眠过多',
  '4. 感觉疲倦或没有活力',
  '5. 食欲不振或吃太多',
  '6. 觉得自己很糟、很失败，或让自己或家人失望',
  '7. 对事物专注有困难，例如阅读报纸或看电视',
  '8. 动作或说话速度缓慢到别人可察觉，或相反地烦躁/坐立不安',
  '9. 有不如死掉或用某种方式伤害自己的念头'
];

function renderItems(){
  const container = document.getElementById('items');
  container.innerHTML = questions.map((q, i) => `
    <div class="phq-item">
      <label for="q${i}">${q}</label>
      <select id="q${i}" onchange="calc()">
        <option value="0">0 没有</option>
        <option value="1">1 几天</option>
        <option value="2">2 一半以上天数</option>
        <option value="3">3 几乎每天</option>
      </select>
    </div>
  `).join('');
}

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    for(let i=0;i<9;i++){
      const el = document.getElementById('q'+i);
      if(el && s['q'+i] != null) el.value = s['q'+i];
    }
    const q10 = document.getElementById('q10');
    if(q10 && s.q10 != null) q10.value = s.q10;
  } catch(e){}
}

function saveState(){
  try {
    const s = {};
    for(let i=0;i<9;i++) s['q'+i] = document.getElementById('q'+i).value;
    s.q10 = document.getElementById('q10').value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function classify(score){
  if(score <= 4) return {level:'无或极轻微抑郁', cls:'grade-excellent'};
  if(score <= 9) return {level:'轻度抑郁', cls:'grade-good'};
  if(score <= 14) return {level:'中度抑郁', cls:'grade-pass'};
  if(score <= 19) return {level:'中重度抑郁', cls:'grade-pass'};
  return {level:'重度抑郁', cls:'grade-fail'};
}

function calc(){
  let score = 0;
  for(let i=0;i<9;i++){
    const v = parseInt(document.getElementById('q'+i).value, 10);
    score += isNaN(v) ? 0 : v;
  }
  const c = classify(score);
  saveState();

  let warning = '';
  const q9 = parseInt(document.getElementById('q8').value, 10);
  if(q9 > 0){
    warning = `<div class="tip-box tip-error" style="margin-top:12px;">您选择了第 9 项“自伤念头”为非零分，建议尽快寻求专业心理或精神科帮助。</div>`;
  }

  document.getElementById('result').innerHTML = `
    <p>PHQ-9 总分：<strong style="font-size:20px;">${score}</strong> 分（0-27 分）</p>
    <p>抑郁程度：<span class="grade-tag ${c.cls}">${c.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">建议：${score >= 10 ? '建议进一步临床评估，必要时启动心理治疗或药物治疗。' : '可继续观察，保持健康生活方式。'}</p>
    ${warning}
  `;
}

function resetForm(){
  for(let i=0;i<9;i++) document.getElementById('q'+i).value = '0';
  document.getElementById('q10').value = '0';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { renderItems(); loadState(); calc(); });
</script>
