  <a href="../../guides/calc-1-guide.html">📖 查看「增值税计算使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>💣 爆破药量计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于体积公式或 Langefors 公式估算单孔装药量、单耗及孔网参数。</p>

    <div class="input-row">
      <div>
        <label for="method">计算方法</label>
        <select id="method" onchange="updateInputs()">
          <option value="volume">体积公式 Q = q·a·b·H</option>
          <option value="langefors">Langefors 公式 Q = k·W³</option>
        </select>
      </div>
      <div>
        <label for="q">炸药单耗 q（kg/m³）</label>
        <input type="number" id="q" value="0.45" step="0.01" min="0">
      </div>
      <div>
        <label for="k">Langefors 系数 k（kg/m³）</label>
        <input type="number" id="k" value="0.4" step="0.01" min="0">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="a">孔距 a（m）</label>
        <input type="number" id="a" value="3.0" step="0.1" min="0">
      </div>
      <div>
        <label for="b">排距 b（m）</label>
        <input type="number" id="b" value="2.5" step="0.1" min="0">
      </div>
      <div>
        <label for="H">台阶高度 H（m）</label>
        <input type="number" id="H" value="10" step="0.1" min="0">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="W">最小抵抗线 W（m）</label>
        <input type="number" id="W" value="2.5" step="0.1" min="0">
      </div>
      <div>
        <label for="holes">炮孔数量</label>
        <input type="number" id="holes" value="20" step="1" min="1">
      </div>
      <div>
        <label for="stem">堵塞长度 Ls（m）</label>
        <input type="number" id="stem" value="2.0" step="0.1" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcBlast()">计算药量</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>体积公式适用于台阶爆破单孔药量估算</li>
        <li>Langefors 公式 Q = k·W³ 适用于岩体爆破初始药量估算</li>
        <li>装药长度 = Q / (π·r²·ρ)，ρ 为装药密度，r 为药卷半径（经验值）</li>
        <li>实际爆破需根据岩石性质、炸药类型及现场试验调整</li>
      </ul>
    </div>
  </div>
</div>

<script>
function updateInputs() {
  const method = document.getElementById('method').value;
  document.getElementById('q').disabled = false;
  document.getElementById('k').disabled = method !== 'langefors';
  document.getElementById('a').disabled = method === 'langefors';
  document.getElementById('b').disabled = method === 'langefors';
  document.getElementById('H').disabled = method === 'langefors';
  document.getElementById('W').disabled = method === 'volume';
}

function calcBlast() {
  const method = document.getElementById('method').value;
  const q = parseFloat(document.getElementById('q').value) || 0;
  const k = parseFloat(document.getElementById('k').value) || 0;
  const a = parseFloat(document.getElementById('a').value) || 0;
  const b = parseFloat(document.getElementById('b').value) || 0;
  const H = parseFloat(document.getElementById('H').value) || 0;
  const W = parseFloat(document.getElementById('W').value) || 0;
  const holes = parseInt(document.getElementById('holes').value) || 1;
  const stem = parseFloat(document.getElementById('stem').value) || 0;

  let Q_per_hole = 0;
  let volume = 0;

  if (method === 'volume') {
    if (a <= 0 || b <= 0 || H <= 0) {
      ToolBox.setResult('result', '<p class="tip-error">请输入有效的孔网参数。</p>');
      return;
    }
    volume = a * b * H;
    Q_per_hole = q * volume;
  } else {
    if (W <= 0) {
      ToolBox.setResult('result', '<p class="tip-error">请输入有效的最小抵抗线。</p>');
      return;
    }
    Q_per_hole = k * Math.pow(W, 3);
    volume = Math.pow(W, 3) / (q > 0 ? q : 1);
  }

  const totalQ = Q_per_hole * holes;
  const chargeLength = Q_per_hole / (Math.PI * 0.05 * 0.05 * 1000);
  const holeDepth = H + 0.3 * W;

  const html = `
    <div class="data-grid">
      <div class="data-card"><div class="num">${Q_per_hole.toFixed(2)}</div><div class="label">单孔药量（kg）</div></div>
      <div class="data-card"><div class="num">${totalQ.toFixed(2)}</div><div class="label">总药量（kg）</div></div>
      <div class="data-card"><div class="num">${volume.toFixed(2)}</div><div class="label">单孔爆破方量（m³）</div></div>
      <div class="data-card"><div class="num">${(volume*holes).toFixed(1)}</div><div class="label">总爆破方量（m³）</div></div>
      <div class="data-card"><div class="num">${chargeLength.toFixed(2)}</div><div class="label">装药长度估算（m）</div></div>
      <div class="data-card"><div class="num">${holeDepth.toFixed(2)}</div><div class="label">炮孔深度估算（m）</div></div>
    </div>
    <p style="margin-top:10px;font-size:13px;color:var(--text-muted);">
      堵塞长度 ${stem.toFixed(1)} m，装药长度估算按药卷直径约 100 mm、密度 1000 kg/m³ 近似
    </p>
  `;
  ToolBox.setResult('result', html);
}

function resetForm() {
  document.getElementById('method').value = 'volume';
  document.getElementById('q').value = 0.45;
  document.getElementById('k').value = 0.4;
  document.getElementById('a').value = 3.0;
  document.getElementById('b').value = 2.5;
  document.getElementById('H').value = 10;
  document.getElementById('W').value = 2.5;
  document.getElementById('holes').value = 20;
  document.getElementById('stem').value = 2.0;
  updateInputs();
  calcBlast();
}

updateInputs();
calcBlast();
</script>
</body>
