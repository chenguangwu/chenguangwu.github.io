<h1 class="sr-only">民间借贷利息计算</h1>

<div class="container">
  <div class="card">
    <h2>🏦 民间借贷利息计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算借贷利息与还款总额，并校验是否超过"LPR四倍"法定利率上限</p>

    <div class="input-row">
      <div>
        <label>借款本金（元）</label>
        <input type="number" id="principal" value="100000" min="0" step="1000" oninput="calc()">
      </div>
      <div>
        <label>年利率（%）</label>
        <input type="number" id="rate" value="12" min="0" step="0.1" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>借款期限</label>
        <input type="number" id="months" value="12" min="1" step="1" oninput="calc()">
      </div>
      <div>
        <label>还款方式</label>
        <select id="method" onchange="calc()">
          <option value="lump">到期还本付息</option>
          <option value="equal_payment">等额本息</option>
          <option value="equal_principal">等额本金</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>一年期LPR（%）</label>
        <input type="number" id="lpr" value="3.1" min="0" step="0.05" oninput="calc()">
      </div>
      <div>
        <label>借款发生日</label>
        <input type="date" id="loanDate" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">📖 《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》：借贷行为发生在2019年8月20日之后的，以合同成立时一年期LPR的4倍为利率司法保护上限。超过部分不受法律保护。</div>
  </div>
</div>

<script>
function money(n){ return '¥' + ToolBox.formatNumber(Math.round(n)); }

function calc(){
  var P = parseFloat(document.getElementById('principal').value) || 0;
  var annualRate = parseFloat(document.getElementById('rate').value) || 0;
  var months = parseInt(document.getElementById('months').value, 10) || 0;
  var method = document.getElementById('method').value;
  var lpr = parseFloat(document.getElementById('lpr').value) || 0;
  var res = document.getElementById('res');

  if(P <= 0 || months <= 0){ res.innerHTML = '<p style="color:var(--text-muted);">请输入有效的本金和期限</p>'; return; }

  var capRate = lpr * 4;
  var overCap = annualRate > capRate;
  var capPct = capRate > 0 ? Math.min(100, (annualRate / capRate) * 100) : 100;

  // 有效受保护利率
  var effRate = overCap ? capRate : annualRate;

  // 利息 & 还款计划
  var totalInterest, totalRepay, schedule = [], monthlyPay;
  var r = annualRate / 100 / 12; // 月利率（按约定利率算实际利息）
  var rEff = effRate / 100 / 12;

  if(method === 'lump'){
    // 到期还本付息：按约定利率计息（实际产生利息），但提示超过上限部分不受保护
    totalInterest = P * (annualRate / 100) * (months / 12);
    totalRepay = P + totalInterest;
    monthlyPay = 0;
  } else if(method === 'equal_payment'){
    // 等额本息
    if(r === 0){
      monthlyPay = P / months;
    } else {
      monthlyPay = P * r * Math.pow(1+r, months) / (Math.pow(1+r, months) - 1);
    }
    var bal = P;
    for(var i = 1; i <= months; i++){
      var interest = bal * r;
      var principalPart = monthlyPay - interest;
      bal -= principalPart;
      if(i === months){ principalPart += bal; bal = 0; } // 修正尾差
      schedule.push({ m: i, pay: monthlyPay, principal: principalPart, interest: interest, balance: Math.max(0, bal) });
    }
    totalInterest = monthlyPay * months - P;
    totalRepay = monthlyPay * months;
  } else {
    // 等额本金
    var mp = P / months;
    var bal2 = P;
    var totalI = 0;
    for(var j = 1; j <= months; j++){
      var interest2 = bal2 * r;
      var pay2 = mp + interest2;
      bal2 -= mp;
      totalI += interest2;
      schedule.push({ m: j, pay: pay2, principal: mp, interest: interest2, balance: Math.max(0, bal2) });
    }
    totalInterest = totalI;
    totalRepay = P + totalInterest;
    monthlyPay = schedule[0].pay;
  }

  // 受保护利息（按 effRate）
  var protectedInterest;
  if(method === 'lump'){
    protectedInterest = P * (effRate / 100) * (months / 12);
  } else {
    // 按有效利率重算总利息近似
    var rE = rEff;
    var totI = 0, balE = P;
    if(method === 'equal_payment'){
      var mE = rE === 0 ? P/months : P * rE * Math.pow(1+rE, months) / (Math.pow(1+rE, months) - 1);
      for(var k = 0; k < months; k++){ var ie = balE * rE; balE -= (mE - ie); totI += ie; }
    } else {
      var mpE = P/months, balP = P;
      for(var l = 0; l < months; l++){ var ip = balP * rE; balP -= mpE; totI += ip; }
    }
    protectedInterest = totI;
  }

  var capWarning = overCap
    ? '<div class="tip-box tip-error">⚠️ <strong>利率超出法定上限！</strong>约定年利率 ' + annualRate + '% 超过 LPR四倍 (' + capRate.toFixed(2) + '%)。超过部分利息不受法律保护，借款人已支付的超过部分可主张抵扣本金或返还。</div>'
    : '<div class="tip-box tip-success">✅ 利率未超过法定上限（LPR四倍 ' + capRate.toFixed(2) + '%），受法律保护。</div>';

  // schedule table (only first 12 + summary for long)
  var schedHtml = '';
  if(schedule.length){
    var showRows = schedule.length <= 12 ? schedule : schedule.slice(0, 12);
    var rows = showRows.map(function(s){
      return [s.m, money(s.pay), money(s.principal), money(s.interest), money(s.balance)];
    });
    if(schedule.length > 12){
      rows.push(['...', '...', '...', '...', '...']);
      var last = schedule[schedule.length - 1];
      rows.push([last.m, money(last.pay), money(last.principal), money(last.interest), money(last.balance)]);
    }
    schedHtml = '<h3 style="margin-top:14px;">还款明细</h3>' + ToolBox.createTable(['期次','本期还款','本金','利息','剩余本金'], rows);
  }

  res.innerHTML =
    '<div class="data-grid">' +
      '<div class="sum-stat"><div class="sub">借款本金</div><div class="big">' + money(P) + '</div></div>' +
      '<div class="sum-stat"><div class="sub">总利息</div><div class="big">' + money(totalInterest) + '</div></div>' +
      '<div class="sum-stat"><div class="sub">还款总额</div><div class="big">' + money(totalRepay) + '</div></div>' +
      (monthlyPay > 0 ? '<div class="sum-stat"><div class="sub">首期/月供</div><div class="big">' + money(monthlyPay) + '</div></div>' : '') +
    '</div>' +
    '<div style="margin-top:14px;">' +
      '<div style="font-size:13px;color:var(--text-secondary);">法定利率上限校验（LPR ' + lpr + '% × 4 = <strong>' + capRate.toFixed(2) + '%</strong>）</div>' +
      '<div class="cap-bar"><div class="cap-fill' + (overCap ? ' over' : '') + '" style="width:' + capPct + '%;"></div></div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">约定利率 ' + annualRate + '% ' + (overCap ? '（超出 ' + (annualRate - capRate).toFixed(2) + '%）' : '（在保护范围内）') + '</div>' +
    '</div>' +
    (overCap ? '<div class="tip-box tip-warn" style="margin-top:12px;">受保护利息上限约：<strong>' + money(protectedInterest) + '</strong>（按 ' + capRate.toFixed(2) + '% 计算）；超出部分利息 <strong>' + money(totalInterest - protectedInterest) + '</strong> 不受法律保护。</div>' : '') +
    capWarning +
    schedHtml;
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText('toast.copy_target_missing'),'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('principal').value = 100000;
  document.getElementById('rate').value = 12;
  document.getElementById('months').value = 12;
  document.getElementById('method').value = 'lump';
  document.getElementById('lpr').value = 3.1;
  document.getElementById('loanDate').value = '';
  calc();
}

var KEY = 'tb_loan_interest';
(function(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || '{}');
    ['principal','rate','months','method','lpr'].forEach(function(id){
      if(s[id] != null) document.getElementById(id).value = s[id];
    });
  }catch(e){}
})();
['principal','rate','months','method','lpr'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){
    try{
      var s = {};
      ['principal','rate','months','method','lpr'].forEach(function(i){ s[i] = document.getElementById(i).value; });
      localStorage.setItem(KEY, JSON.stringify(s));
    }catch(e){}
  });
});

calc();
</script>
</body>
