<body>
<h1 class="sr-only">知识产权保护期计算</h1>

<div class="container">
  <div class="card">
    <h2>©️ 知识产权保护期计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">选择知识产权类型，输入起算日期，计算保护期届满日及剩余年限</p>

    <div class="input-row">
      <div>
        <label>知识产权类型</label>
        <select id="ipType" onchange="onTypeChange();calc();">
          <option value="invention">发明专利（20年）</option>
          <option value="utility">实用新型专利（10年）</option>
          <option value="design">外观设计专利（15年）</option>
          <option value="trademark">注册商标（10年，可续展）</option>
          <option value="copyright_natural">著作权·自然人作品（终生+死后50年）</option>
          <option value="copyright_legal">著作权·法人/视听作品（发表后50年）</option>
        </select>
      </div>
    </div>

    <div id="dateInputBox">
      <div class="input-row">
        <div>
          <label id="dateLabel">申请日 / 起算日</label>
          <input type="date" id="startDate" oninput="calc()">
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info" id="lawTip"></div>
  </div>
</div>

<script>
var IP_INFO = {
  invention: { years: 20, label: '发明专利', from: '申请日', law: '《专利法》第42条：发明专利权的期限为二十年，自申请日起计算。', renew: false },
  utility:   { years: 10, label: '实用新型专利', from: '申请日', law: '《专利法》第42条：实用新型专利权的期限为十年，自申请日起计算。', renew: false },
  design:    { years: 15, label: '外观设计专利', from: '申请日', law: '《专利法》第42条：外观设计专利权的期限为十五年，自申请日起计算（2021年6月1日起申请的适用15年）。', renew: false },
  trademark: { years: 10, label: '注册商标', from: '核准注册日', law: '《商标法》第39条：注册商标的有效期为十年，自核准注册之日起计算。第40条可续展，每次续展十年。', renew: true },
  copyright_natural: { years: 50, label: '著作权（自然人作品）', from: '作者死亡日', law: '《著作权法》第23条：自然人作品财产权利的保护期为作者终生及其死亡后五十年，截止于作者死亡后第五十年的12月31日。', renew: false, postDeath: true },
  copyright_legal:   { years: 50, label: '著作权（法人/视听作品）', from: '发表日', law: '《著作权法》第23条：法人或非法人组织的作品、视听作品，财产权利保护期为发表后五十年，截止于发表后第五十年的12月31日。', renew: false, yearEnd: true }
};

function onTypeChange(){
  var t = document.getElementById('ipType').value;
  var info = IP_INFO[t];
  var lbl = document.getElementById('dateLabel');
  if(t === 'copyright_natural'){
    lbl.textContent = '作者死亡年份（如 2010）';
    document.getElementById('dateInputBox').innerHTML =
      '<div class="input-row"><div><label>作者死亡年份</label><input type="number" id="startDate" placeholder="如 2010" min="1900" max="2200" oninput="calc()"></div></div>';
  } else if(t === 'copyright_legal'){
    lbl.textContent = '首次发表年份';
    document.getElementById('dateInputBox').innerHTML =
      '<div class="input-row"><div><label>首次发表年份</label><input type="number" id="startDate" placeholder="如 2015" min="1900" max="2200" oninput="calc()"></div></div>';
  } else {
    lbl.textContent = info.from;
    document.getElementById('dateInputBox').innerHTML =
      '<div class="input-row"><div><label>' + info.from + '</label><input type="date" id="startDate" oninput="calc()"></div></div>';
  }
  document.getElementById('lawTip').innerHTML = '📖 ' + info.law;
}

function fmtDate(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function calc(){
  var t = document.getElementById('ipType').value;
  var info = IP_INFO[t];
  var inputEl = document.getElementById('startDate');
  var val = inputEl ? inputEl.value : '';
  var res = document.getElementById('res');

  if(!val){
    res.innerHTML = '<p style="color:var(--text-muted);">请输入起算日期/年份</p>';
    return;
  }

  var expiryDate, expiryText, startText;
  var today = new Date();

  if(t === 'copyright_natural'){
    var deathYear = parseInt(val, 10);
    if(isNaN(deathYear)){ res.innerHTML = '<p style="color:var(--danger);">年份无效</p>'; return; }
    // 截止于作者死亡后第50年的12月31日
    expiryDate = new Date(deathYear + 50, 11, 31);
    startText = deathYear + ' 年（作者死亡）';
    expiryText = (deathYear + 50) + '年12月31日';
  } else if(t === 'copyright_legal'){
    var pubYear = parseInt(val, 10);
    if(isNaN(pubYear)){ res.innerHTML = '<p style="color:var(--danger);">年份无效</p>'; return; }
    expiryDate = new Date(pubYear + 50, 11, 31);
    startText = pubYear + ' 年（首次发表）';
    expiryText = (pubYear + 50) + '年12月31日';
  } else {
    var start = new Date(val + 'T00:00:00');
    if(isNaN(start)){ res.innerHTML = '<p style="color:var(--danger);">日期无效</p>'; return; }
    var exp = new Date(start.getTime());
    exp.setFullYear(exp.getFullYear() + info.years);
    // 保护期自申请日/注册日起算，届满日为对应日（前一日24时即对应日前一天结束，实务取对应日）
    expiryDate = exp;
    startText = fmtDate(start);
    expiryText = fmtDate(exp);
  }

  // remaining
  var remainMs = expiryDate.getTime() - today.getTime();
  var remainDays = Math.floor(remainMs / 86400000);
  var remainYears = (remainDays / 365.25).toFixed(2);

  var statusHtml, remainHtml;
  if(remainDays > 0){
    statusHtml = '<span style="color:var(--success);font-weight:700;">● 保护期内</span>';
    remainHtml = '<div style="font-size:26px;font-weight:800;color:var(--success);">' + remainYears + ' 年</div><div class="sub">约 ' + remainDays + ' 天</div>';
  } else if(remainDays > -1){
    statusHtml = '<span style="color:var(--warning);font-weight:700;">● 即将届满</span>';
    remainHtml = '<div style="font-size:26px;font-weight:800;color:var(--warning);">已届满</div>';
  } else {
    statusHtml = '<span style="color:var(--danger);font-weight:700;">● 已过保护期</span>';
    remainHtml = '<div style="font-size:26px;font-weight:800;color:var(--danger);">已过 ' + Math.abs(remainDays) + ' 天</div>';
  }

  var renewHtml = info.renew ? '<span class="renew-tag">可续展（每次10年）</span>' : '';

  res.innerHTML =
    '<div class="data-grid">' +
      '<div class="ip-stat"><div class="sub">知识产权类型</div><div class="big">' + info.label + renewHtml + '</div></div>' +
      '<div class="ip-stat"><div class="sub">起算日</div><div class="big" style="font-size:16px;">' + startText + '</div></div>' +
      '<div class="ip-stat"><div class="sub">保护期届满日</div><div class="big" style="font-size:16px;">' + expiryText + '</div></div>' +
      '<div class="ip-stat"><div class="sub">' + statusHtml + '</div>' + remainHtml + '</div>' +
    '</div>' +
    '<p style="margin-top:14px;">法定保护期：<strong>' + info.years + ' 年</strong>　|　起算依据：<strong>' + info.from + '</strong></p>';
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText('toast.copy_target_missing'),'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('ipType').value = 'invention';
  onTypeChange();
  calc();
}

var KEY = 'tb_ip_term';
(function(){
  try{
    var saved = localStorage.getItem(KEY);
    if(saved){
      var v = JSON.parse(saved);
      if(v.ipType){ document.getElementById('ipType').value = v.ipType; }
    }
  }catch(e){}
})();
document.getElementById('ipType').addEventListener('change', function(){
  try{ localStorage.setItem(KEY, JSON.stringify({ipType: this.value})); }catch(e){}
});

onTypeChange();
calc();
</script>
</body>
</html>
