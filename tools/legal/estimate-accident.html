<body>
<h1 class="sr-only">交通事故赔偿估算</h1>
<div class="nav">

<div class="container">
  <div class="card">
    <h2>🚗 交通事故赔偿估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">依据《民法典》第1179条及人身损害赔偿司法解释估算赔偿金额（2022年起城乡统一标准）</p>

    <div class="input-row">
      <div>
        <label>受诉法院地上年度城镇居民人均可支配收入（元/年）</label>
        <input type="number" id="income" value="51821" min="0" step="100" oninput="calc()">
      </div>
      <div>
        <label>受害人年龄</label>
        <input type="number" id="age" value="35" min="0" max="120" step="1" oninput="calc()">
      </div>
    </div>

    <label>伤残等级（1级最重，10级最轻）</label>
    <div class="level-grid" id="levelGrid">
      <div class="level-btn" data-level="1" onclick="setLevel(1)">1级</div>
      <div class="level-btn" data-level="2" onclick="setLevel(2)">2级</div>
      <div class="level-btn" data-level="3" onclick="setLevel(3)">3级</div>
      <div class="level-btn" data-level="4" onclick="setLevel(4)">4级</div>
      <div class="level-btn" data-level="5" onclick="setLevel(5)">5级</div>
      <div class="level-btn active" data-level="6" onclick="setLevel(6)">6级</div>
      <div class="level-btn" data-level="7" onclick="setLevel(7)">7级</div>
      <div class="level-btn" data-level="8" onclick="setLevel(8)">8级</div>
      <div class="level-btn" data-level="9" onclick="setLevel(9)">9级</div>
      <div class="level-btn" data-level="10" onclick="setLevel(10)">10级</div>
    </div>

    <div class="input-row" style="margin-top:16px;">
      <div>
        <label>医疗费（元）</label>
        <input type="number" id="medical" value="30000" min="0" step="100" oninput="calc()">
      </div>
      <div>
        <label>误工天数（天）</label>
        <input type="number" id="lostDays" value="90" min="0" step="1" oninput="calc()">
      </div>
      <div>
        <label>日均误工收入（元/天）</label>
        <input type="number" id="dailyWage" value="300" min="0" step="10" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>护理天数（天）</label>
        <input type="number" id="nursingDays" value="60" min="0" step="1" oninput="calc()">
      </div>
      <div>
        <label>护理日薪（元/天）</label>
        <input type="number" id="nursingRate" value="200" min="0" step="10" oninput="calc()">
      </div>
      <div>
        <label>营养期天数（天）</label>
        <input type="number" id="nutritionDays" value="60" min="0" step="1" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>营养费标准（元/天）</label>
        <input type="number" id="nutritionRate" value="30" min="0" step="5" oninput="calc()">
      </div>
      <div>
        <label>精神损害抚慰金基准（元，1级）</label>
        <input type="number" id="mentalBase" value="50000" min="0" step="1000" oninput="calc()">
      </div>
      <div>
        <label>住院伙食补助（元/天 × 天数）</label>
        <input type="number" id="foodDays" value="30" min="0" step="1" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 估算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-warn">⚠️ 本估算为参考值，实际赔偿需结合责任划分、当地标准、鉴定意见等。残疾赔偿金按20年计算，60岁以上每增1岁减1年，75岁以上按5年计算。</div>
  </div>
</div>

<script>
function money(n){ return '¥' + ToolBox.formatNumber(Math.round(n)); }

var currentLevel = 6;
function setLevel(l){
  currentLevel = l;
  var btns = document.querySelectorAll('.level-btn');
  btns.forEach(function(b){ b.classList.toggle('active', parseInt(b.dataset.level,10) === l); });
  calc();
}

function calc(){
  var income = parseFloat(document.getElementById('income').value) || 0;
  var age = parseInt(document.getElementById('age').value, 10) || 0;
  var medical = parseFloat(document.getElementById('medical').value) || 0;
  var lostDays = parseFloat(document.getElementById('lostDays').value) || 0;
  var dailyWage = parseFloat(document.getElementById('dailyWage').value) || 0;
  var nursingDays = parseFloat(document.getElementById('nursingDays').value) || 0;
  var nursingRate = parseFloat(document.getElementById('nursingRate').value) || 0;
  var nutritionDays = parseFloat(document.getElementById('nutritionDays').value) || 0;
  var nutritionRate = parseFloat(document.getElementById('nutritionRate').value) || 0;
  var mentalBase = parseFloat(document.getElementById('mentalBase').value) || 0;
  var foodDays = parseFloat(document.getElementById('foodDays').value) || 0;
  var res = document.getElementById('res');

  // 伤残系数：1级100%，2级90%...10级10%
  var coeff = (11 - currentLevel) / 10;

  // 残疾赔偿金年限
  var years = 20;
  if(age >= 60){ years = Math.max(5, 20 - (age - 60)); }
  if(age >= 75){ years = 5; }
  var disability = income * years * coeff;

  // 误工费
  var lostWage = dailyWage * lostDays;

  // 护理费
  var nursing = nursingRate * nursingDays;

  // 营养费
  var nutrition = nutritionRate * nutritionDays;

  // 住院伙食补助（按100元/天参考）
  var food = foodDays * 100;

  // 精神损害抚慰金：按伤残系数 × 基准
  var mental = mentalBase * coeff;

  // 医疗费
  var med = medical;

  var total = disability + lostWage + nursing + nutrition + food + mental + med;

  function row(name, formula, val){
    return '<div class="comp-row"><div class="name">' + name + '<small>' + formula + '</small></div><div class="val">' + money(val) + '</div></div>';
  }

  res.innerHTML =
    '<div class="total-box">' +
      '<div style="font-size:13px;color:var(--text-muted);">预估赔偿总额</div>' +
      '<div class="total-big">' + money(total) + '</div>' +
    '</div>' +
    '<div style="background:var(--result-bg);border:1px solid var(--border);border-radius:12px;padding:6px 14px;margin-top:12px;">' +
      row('医疗费', '实际支出', med) +
      row('残疾赔偿金', income + ' × ' + years + '年 × ' + (coeff*100) + '%（' + currentLevel + '级）', disability) +
      row('误工费', dailyWage + '元/天 × ' + lostDays + '天', lostWage) +
      row('护理费', nursingRate + '元/天 × ' + nursingDays + '天', nursing) +
      row('营养费', nutritionRate + '元/天 × ' + nutritionDays + '天', nutrition) +
      row('住院伙食补助费', '100元/天 × ' + foodDays + '天', food) +
      row('精神损害抚慰金', mentalBase + ' × ' + (coeff*100) + '%（' + currentLevel + '级）', mental) +
    '</div>' +
    '<div class="tip-box tip-info" style="margin-top:12px;">📌 伤残系数：1级=100%、2级=90%…10级=10%。残疾赔偿金年限：≤60岁按20年；60-75岁每增1岁减1年；≥75岁按5年。</div>';
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText('toast.copy_target_missing'),'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('income').value = 51821;
  document.getElementById('age').value = 35;
  document.getElementById('medical').value = 30000;
  document.getElementById('lostDays').value = 90;
  document.getElementById('dailyWage').value = 300;
  document.getElementById('nursingDays').value = 60;
  document.getElementById('nursingRate').value = 200;
  document.getElementById('nutritionDays').value = 60;
  document.getElementById('nutritionRate').value = 30;
  document.getElementById('mentalBase').value = 50000;
  document.getElementById('foodDays').value = 30;
  setLevel(6);
}

var KEY = 'tb_accident';
(function(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || '{}');
    ['income','age','medical','lostDays','dailyWage','nursingDays','nursingRate','nutritionDays','nutritionRate','mentalBase','foodDays'].forEach(function(id){
      if(s[id] != null) document.getElementById(id).value = s[id];
    });
    if(s.level) setLevel(s.level);
  }catch(e){}
})();
function saveState(){
  try{
    var s = {};
    ['income','age','medical','lostDays','dailyWage','nursingDays','nursingRate','nutritionDays','nutritionRate','mentalBase','foodDays'].forEach(function(i){ s[i] = document.getElementById(i).value; });
    s.level = currentLevel;
    localStorage.setItem(KEY, JSON.stringify(s));
  }catch(e){}
}
['income','age','medical','lostDays','dailyWage','nursingDays','nursingRate','nutritionDays','nutritionRate','mentalBase','foodDays'].forEach(function(id){
  document.getElementById(id).addEventListener('change', saveState);
});

calc();
</script>
</body>
