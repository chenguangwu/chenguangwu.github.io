<body>
<h1 class="sr-only">劳动争议赔偿估算</h1>

<div class="container">
  <div class="card">
    <h2>👷 劳动争议赔偿估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">依据《劳动合同法》计算经济补偿金（N）、代通知金、违法解除赔偿金（2N）</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">劳动争议赔偿 = 工资×年限×系数</div>
      <p class="formula-desc">依据《劳动合同法》计算经济补偿金（N）、代通知金、违法解除赔偿金（2N）</p>
    </div>

    <div class="input-row">
      <div>
        <label>离职前12个月平均月工资（元）</label>
        <input type="number" id="salary" value="10000" min="0" step="100" oninput="calc()">
      </div>
      <div>
        <label>工作年限（年，可填小数如3.5）</label>
        <input type="number" id="years" value="3" min="0" step="0.5" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>当地上年度职工月平均工资3倍（元，用于封顶）</label>
        <input type="number" id="capWage" value="35000" min="0" step="500" oninput="calc()">
      </div>
    </div>

    <label>解除/终止劳动合同情形</label>
    <div style="margin-top:8px;" id="dismissList">
      <div class="dismiss-card active" data-type="negotiate" onclick="setDismiss('negotiate')">
        <div class="dc-title">协商解除（用人单位提出）</div>
        <div class="dc-desc">支付经济补偿 N</div>
      </div>
      <div class="dismiss-card" data-type="no_fault" onclick="setDismiss('no_fault')">
        <div class="dc-title">无过失性辞退（医疗期满/不胜任/客观情况变化）</div>
        <div class="dc-desc">经济补偿 N + 代通知金 1个月</div>
      </div>
      <div class="dismiss-card" data-type="layoff" onclick="setDismiss('layoff')">
        <div class="dc-title">经济性裁员</div>
        <div class="dc-desc">支付经济补偿 N</div>
      </div>
      <div class="dismiss-card" data-type="illegal" onclick="setDismiss('illegal')">
        <div class="dc-title">用人单位违法解除</div>
        <div class="dc-desc">支付赔偿金 2N</div>
      </div>
      <div class="dismiss-card" data-type="resign" onclick="setDismiss('resign')">
        <div class="dc-title">劳动者主动辞职 / 用人单位过失性辞退（39条）</div>
        <div class="dc-desc">无经济补偿</div>
      </div>
    </div>

    <div class="toolbar" style="margin-top:16px;">
      <button class="btn primary" type="button" onclick="calc()">🧮 估算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info" id="lawTip"></div>
  </div>
</div>

<script>
function money(n){ return '¥' + ToolBox.formatNumber(Math.round(n)); }

var DISMISS = {
  negotiate: { label: '协商解除（用人单位提出）', comp: true, notice: false, double: false, law: '《劳动合同法》第36条、第46条：用人单位向劳动者提出解除劳动合同并与劳动者协商一致解除的，应当支付经济补偿。' },
  no_fault:  { label: '无过失性辞退', comp: true, notice: true, double: false, law: '《劳动合同法》第40条：有下列情形之一（医疗期满不能从事原工作/不能胜任工作经培训或调岗仍不能胜任/客观情况发生重大变化），用人单位提前30日书面通知或额外支付一个月工资后可解除，并支付经济补偿。' },
  layoff:    { label: '经济性裁员', comp: true, notice: false, double: false, law: '《劳动合同法》第41条：依照企业破产法规定进行重整等情形进行经济性裁员的，应支付经济补偿。' },
  illegal:   { label: '违法解除', comp: false, notice: false, double: true, law: '《劳动合同法》第48条、第87条：用人单位违反本法规定解除劳动合同，劳动者要求继续履行的应当继续履行；不要求继续履行或已不能履行的，应按经济补偿标准的二倍支付赔偿金（2N）。' },
  resign:    { label: '主动辞职/过失性辞退', comp: false, notice: false, double: false, law: '《劳动合同法》第37条、第39条：劳动者提前30日书面通知解除（试用期3日），或劳动者有严重违纪等法定过失情形被辞退的，用人单位无需支付经济补偿。' }
};

var currentDismiss = 'negotiate';
function setDismiss(t){
  currentDismiss = t;
  document.querySelectorAll('.dismiss-card').forEach(function(c){
    c.classList.toggle('active', c.dataset.type === t);
  });
  calc();
}

// 计算经济补偿月数 N：每满1年1个月；满6个月不满1年按1年；不满6个月按0.5个月
function calcN(years){
  var intPart = Math.floor(years);
  var decPart = years - intPart;
  // 0.5年(6个月)及以上按1年；不足6个月按0.5
  if(decPart >= 0.5){
    return intPart + 1;
  } else if(decPart > 0){
    return intPart + 0.5;
  }
  return intPart;
}

function calc(){
  var salary = parseFloat(document.getElementById('salary').value) || 0;
  var years = parseFloat(document.getElementById('years').value) || 0;
  var capWage = parseFloat(document.getElementById('capWage').value) || 0;
  var res = document.getElementById('res');
  var info = DISMISS[currentDismiss];

  // 高薪封顶：月工资超过社平3倍的，按3倍支付，且最长12年
  var capped = salary > capWage && capWage > 0;
  var effWage = capped ? capWage : salary;
  var N = calcN(years);
  var cappedN = capped ? Math.min(N, 12) : N;
  var effN = cappedN;

  var compPay = info.comp ? effWage * effN : 0;        // 经济补偿 N
  var noticePay = info.notice ? effWage : 0;            // 代通知金 1个月
  var doublePay = info.double ? effWage * effN * 2 : 0; // 赔偿金 2N
  var total = compPay + noticePay + doublePay;

  document.getElementById('lawTip').innerHTML = '📖 ' + info.law;

  function row(name, formula, val, highlight){
    return '<div class="comp-row"><div class="name">' + name + (highlight ? ' ⭐' : '') + '<small>' + formula + '</small></div><div class="val">' + money(val) + '</div></div>';
  }

  var rows = [];
  if(info.comp){
    rows.push(row('经济补偿金', effWage + ' × ' + effN + '个月（N=' + effN + (capped ? '，已封顶' : '') + '）', compPay));
  }
  if(info.notice){
    rows.push(row('代通知金', effWage + ' × 1个月', noticePay));
  }
  if(info.double){
    rows.push(row('违法解除赔偿金', effWage + ' × ' + effN + ' × 2（2N=' + (effN*2) + '）', doublePay, true));
  }
  if(!info.comp && !info.notice && !info.double){
    rows.push(row('经济补偿', '该情形无需支付', 0));
  }

  var capNote = capped
    ? '<div class="tip-box tip-warn" style="margin-top:12px;">⚠️ 月工资超过当地社平工资3倍（' + money(capWage) + '），按3倍封顶计算，且补偿年限最长不超过12年。实际工资 ' + money(salary) + ' → 计算工资 ' + money(effWage) + '。</div>'
    : '';

  var nExplain = info.comp || info.double
    ? '<div class="tip-box tip-info" style="margin-top:12px;">📌 N 计算规则：工作年限 ' + years + ' 年 → 每满1年计1个月，满6个月不满1年按1年，不满6个月按半个月 → <strong>N = ' + effN + '</strong>。</div>'
    : '';

  res.innerHTML =
    '<div class="total-box">' +
      '<div style="font-size:13px;color:var(--text-muted);">' + info.label + ' 应付总额</div>' +
      '<div class="total-big">' + money(total) + '</div>' +
    '</div>' +
    '<div style="background:var(--result-bg);border:1px solid var(--border);border-radius:12px;padding:6px 14px;margin-top:12px;">' +
      rows.join('') +
    '</div>' +
    capNote + nExplain;
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText('toast.copy_target_missing'),'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('salary').value = 10000;
  document.getElementById('years').value = 3;
  document.getElementById('capWage').value = 35000;
  setDismiss('negotiate');
}

var KEY = 'tb_labor';
(function(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || '{}');
    ['salary','years','capWage'].forEach(function(id){
      if(s[id] != null) document.getElementById(id).value = s[id];
    });
    if(s.dismiss) setDismiss(s.dismiss);
  }catch(e){}
})();
function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify({salary:document.getElementById('salary').value,years:document.getElementById('years').value,capWage:document.getElementById('capWage').value,dismiss:currentDismiss}));
  }catch(e){}
}
['salary','years','capWage'].forEach(function(id){
  document.getElementById(id).addEventListener('change', saveState);
});

calc();
</script>
</body>
