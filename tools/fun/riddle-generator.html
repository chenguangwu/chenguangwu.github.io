<div class="container">
  <div class="card">
    <h2 data-zh="🎯 谜语生成器">🎯 Riddle Generator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按题型快速生成字谜/物谜，支持答案查看。">Riddle Generator is available directly in your browser, with no data uploaded.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本生成器依据指定格式规范在前端按规则随机或确定性生成内容，结果可直接复制使用，数据不离开浏览器。 工具名称：谜语生成器。</p>
</div>


    <div class="input-row">
      <label>主题词（可选）</label>
      <input type="text" id="topic" value="天气" placeholder="例如：动物/植物">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="generate()">生成一条</button>
      <button class="btn" onclick="showAnswer()">显示答案</button>
      <button class="btn" onclick="copyResult()">复制</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const BANK = {
  动物: ['头黑身白两三只，站在树上看天鹅。', '它白天飞，夜晚飞，飞得高高不敢低。'],
  植物: ['根在地下不见天，叶在枝头常青天。', '圆圆像太极，切开才见心。'],
  物件: ['门不倒就行人出入。', '有脸有身没有心，圆圆扁扁挡风尘。'],
  数字: ['一旦减去一仍是二，你猜我是谁？', '左三右三中间空，围棋残局不算空。'],
  普通: ['没有眼睛会看天，却能看见远方。', '白里透黑，黑里透白。']
};

const ANSWER = {
  '头黑身白两三只，站在树上看天鹅。': '麻雀',
  '它白天飞，夜晚飞，飞得高高不敢低。': '飞虫',
  '根在地下不见天，叶在枝头常青天。': '芦荟',
  '圆圆像太极，切开才见心。': '西瓜',
  '门不倒就行人出入。': '闸门',
  '有脸有身没有心，圆圆扁扁挡风尘。': '口罩',
  '一旦减去一仍是二，你猜我是谁？': '三',
  '左三右三中间空，围棋残局不算空。': '田',
  '没有眼睛会看天，却能看见远方。': '望远镜',
  '白里透黑，黑里透白。': '月亮'
};

let current = '';

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
  const t = (document.getElementById('topic').value || '').trim();
  const pool = BANK[t] || BANK.普通;
  current = pick(pool);
  document.getElementById('result').innerHTML = `<p>谜面：${current}</p><p>答案：<span id=\"a\" style=\"display:none\"></span></p>`;
}

function showAnswer() {
  if (!current) {
    ToolBox.showToast(i18nText('toast.msg063'), 'warning');
    return;
  }
  const ans = ANSWER[current] || '可补充词库';
  const s = document.getElementById('a');
  if (!s) {
    document.getElementById('result').innerHTML += `<p>答案：<strong>${ans}</strong></p>`;
  } else {
    s.style.display = 'inline';
    s.textContent = ans;
  }
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg063'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg353'));
}

generate();
</script>
