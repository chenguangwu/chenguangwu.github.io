    <div class="toolbar">
      <button class="btn primary" onclick="initGame()">开始新局</button>
      <button class="btn" onclick="undo()">悔1手</button>

<script>
const SIZE = 15;
let board = [];
let turn = 1;
let history = [];
const EMPTY = 0;
const BLACK = 1;
const WHITE = -1;

function initGame() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
  history = [];
  turn = BLACK;
  renderBoard();
  setStatus('你执黑，先手落子');
}

function setStatus(txt) {
  document.getElementById('status').textContent = txt;
}

function renderBoard() {
  const root = document.getElementById('board');
  root.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (board[r][c] === BLACK) cell.textContent = '●';
      if (board[r][c] === WHITE) cell.textContent = '○';
      cell.addEventListener('click', () => playerMove(r, c));
      root.appendChild(cell);
    }
  }
}

function playerMove(r, c) {
  if (turn !== BLACK || board[r][c] !== EMPTY) return;
  place(r, c, BLACK);
}

function place(r, c, color) {
  board[r][c] = color;
  history.push([r, c, color]);
  renderBoard();

  if (checkWin(r, c, color)) {
    setStatus(color === BLACK ? '你赢了！' : 'AI 获胜！');
    return;
  }

  if (history.length === SIZE * SIZE) {
    setStatus('平局');
    return;
  }

  turn = -color;
  if (turn === WHITE) {
    setStatus('AI 思考中...');
    setTimeout(() => aiMove(), 100);
  } else {
    setStatus('你的回合');
  }
}

function checkWin(r, c, color) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cnt = 1;
    for (let k = 1; k < 5; k++) {
      const nr = r + dr * k;
      const nc = c + dc * k;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || board[nr][nc] !== color) break;
      cnt += 1;
    }
    for (let k = 1; k < 5; k++) {
      const nr = r - dr * k;
      const nc = c - dc * k;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || board[nr][nc] !== color) break;
      cnt += 1;
    }
    if (cnt >= 5) return true;
  }
  return false;
}

function score(r, c, color) {
  if (board[r][c] !== EMPTY) return -1e9;
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  let s = 0;
  for (const [dr, dc] of dirs) {
    let link = 1;
    for (let k = 1; k <= 4; k++) {
      const nr = r + dr * k;
      const nc = c + dc * k;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
      if (board[nr][nc] === color) link += 1;
    }
    for (let k = 1; k <= 4; k++) {
      const nr = r - dr * k;
      const nc = c - dc * k;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
      if (board[nr][nc] === color) link += 1;
    }
    s += Math.pow(10, link);
  }
  return s;
}

function aiMove() {
  let best = -1e9;
  let pickR = Math.floor(SIZE / 2);
  let pickC = Math.floor(SIZE / 2);

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY) continue;
      const val = score(r, c, WHITE) * 1.6 + score(r, c, BLACK) * 0.8;
      if (val > best) {
        best = val;
        pickR = r;
        pickC = c;
      }
    }
  }

  place(pickR, pickC, WHITE);
}

function undo() {
  const last = history.pop();
  if (!last) return;
  const [r1, c1] = last;
  board[r1][c1] = EMPTY;
  turn = BLACK;
  renderBoard();
  setStatus('已悔1步，当前轮到你');
}

initGame();
</script>
