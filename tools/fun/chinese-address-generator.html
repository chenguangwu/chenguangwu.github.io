<body>
<h1 class="sr-only">中国地址生成器</h1>

<div class="container">
    <div class="card">
      <h2>🏠 中国地址生成器</h2>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">随机生成可读的中国大陆邮寄地址，支持数量与详细程度控制。</p>

      <label for="count">生成数量（1~200）</label>
      <input id="count" type="number" min="1" max="200" value="10">

      <div class="toolbar" style="justify-content: flex-start; gap: 12px; flex-wrap: wrap;">
        <label><input id="needVillage" type="checkbox" checked onchange="generate()"> 包含村落/社区</label>
        <label><input id="needFloor" type="checkbox" checked onchange="generate()"> 包含楼栋门牌</label>
        <label><input id="needRoad" type="checkbox" checked onchange="generate()"> 包含街路名</label>
      </div>

      <div class="toolbar">
        <button class="btn primary" onclick="generate()">生成</button>
        <button class="btn" onclick="copyResult()">复制结果</button>
        <button class="btn" onclick="clearResult()">清空</button>
      </div>

      <label for="result">生成地址</label>
      <textarea id="result" rows="12" readonly placeholder="点击“生成”查看结果"></textarea>
    </div>
  </div>

  <script>
  const provinces = {
    '北京市': { cities: { '北京市': ['东城区', '西城区', '朝阳区', '海淀区', '丰台区', '石景山区'] },
      streets: ['建国路', '中关村大街', '长安街', '西单路', '朝阳路'], communities: ['和平里小区', '幸福苑', '阳光家园', '华严北里', '紫竹院小区']
    },
    '上海市': { cities: { '上海市': ['黄浦区', '徐汇区', '浦东新区', '静安区', '闵行区', '杨浦区'] },
      streets: ['南京东路', '延安东路', '复兴东路', '真南路', '世纪大道'], communities: ['世纪花苑', '绿苑里', '阳光城', '中环名苑', '滨江新城']
    },
    '广东省': { cities: { '广州市': ['天河区', '越秀区', '海珠区', '白云区', '番禺区'], '深圳市': ['南山区', '福田区', '宝安区', '龙岗区', '罗湖区'], '佛山市': ['禅城区', '南海区', '顺德区'] },
      streets: ['中山大道', '体育西路', '东部新城', '滨海大道', '创业路'], communities: ['星河世纪', '金色海岸', '阳光花城', '锦绣城', '兴隆里']
    },
    '浙江省': { cities: { '杭州市': ['西湖区', '下城区', '江干区', '滨江区', '拱墅区'], '宁波市': ['海曙区', '江北区', '鄞州区'], '温州市': ['鹿城区', '瓯海区', '龙湾区'] },
      streets: ['解放大道', '人民路', '南湖大道', '环城路', '湖滨路'], communities: ['桐华苑', '中北花苑', '西溪园', '湖滨家园', '绿城明珠']
    },
    '江苏省': { cities: { '南京市': ['玄武区', '秦淮区', '鼓楼区', '建邺区', '浦口区'], '苏州市': ['姑苏区', '吴中区', '相城区'], '无锡市': ['梁溪区', '北塘区', '南长区'] },
      streets: ['人民中路', '中山南路', '人民路', '环城西路', '创业大道'], communities: ['新城广场', '绿地公寓', '阳光雅苑', '时代花园', '金龙小区']
    },
    '四川省': { cities: { '成都市': ['锦江区', '武侯区', '金牛区', '青羊区', '高新区'], '绵阳市': ['涪城区', '游仙区', '涪西区'], '自贡市': ['自流井区', '贡井区', '大安区'] },
      streets: ['人民南路', '春熙路', '武侯大道', '昭觉寺路', '成高路'], communities: ['锦绣园', '金秋苑', '高新区大厦', '百花苑', '绿野小镇']
    }
  };

  const roads = ['1号', '2号', '3号', '4号', '5号'];
  const zones = ['A区', 'B区', 'C区', 'D区', 'E区'];
  const nums = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'];

  function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function buildAddress(config) {
    const province = pick(Object.keys(provinces));
    const cityGroup = provinces[province];
    const city = pick(Object.keys(cityGroup.cities));
    const district = pick(cityGroup.cities[city]);
    const street = pick(cityGroup.streets);
    const unit = randInt(1, 9999);
    const building = randInt(1, 80);
    const floor = randInt(1, 30);
    const room = randInt(101, 2806);
    const zone = pick(zones);
    const road = pick(roads);
    const community = pick(cityGroup.communities);
    const postcode = randInt(100000, 999999);
    const communityName = config.includeVillage ? `${community}${zone}` : `${street}小区`;

    const parts = [`${province}${city}${district}`];
    if (config.includeRoad) parts.push(pick([street, `${district}${street}`]));

    if (config.includeVillage) {
      parts.push(`${communityName}${road}`);
    }
    if (config.includeFloor) {
      parts.push(`${building}栋${floor}层${room}室`);
    }

    parts.push(`邮编:${postcode}`);
    return parts.join('');
  }

  function generate() {
    const n = Math.max(1, Math.min(200, parseInt(document.getElementById('count').value, 10) || 10));
    const cfg = {
      includeVillage: document.getElementById('needVillage').checked,
      includeFloor: document.getElementById('needFloor').checked,
      includeRoad: document.getElementById('needRoad').checked
    };
    const lines = [];
    for (let i = 0; i < n; i += 1) {
      lines.push(buildAddress(cfg));
    }
    document.getElementById('result').value = lines.join('\n');
  }

  function copyResult() {
    const text = document.getElementById('result').value;
    if (!text.trim()) {
      ToolBox.showToast(i18nText('toast.msg062'), 'warning');
      return;
    }
    ToolBox.copyText(text, i18nText('msg203'));
  }

  function clearResult() {
    document.getElementById('result').value = '';
  }

  generate();
  </script>
</body>
