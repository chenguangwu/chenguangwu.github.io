<h1 class="sr-only">闭管基频计算器</h1>

<div class="container">
  <div class="card">
    <h2 data-zh="一端闭口管基频（f₁ = v / 4L）">Pipe Closed</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="一端闭口、一端开口的管，基频波长为管长 4 倍。">Pipe Closed is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f₁ = v / 4L</div>
      <p class="formula-desc">一端闭口、一端开口的管，基频波长为管长 4 倍。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="v">声速 (m/s)</label>
        <input type="number" id="v" value="343" step="1">
      </div>
      <div>
        <label for="L">管长 (m)</label>
        <input type="number" id="L" value="0.5" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>一端闭口管 f₁ = v/4L，仅含奇次谐波。</li>
        <li>343 m/s、0.5 m 管约 171.5 Hz。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v = num('v'), L = num('L');
            const f1 = v / (4 * L);
            ToolBox.setResult('result', dataGrid([
                [f1.toFixed(2), '基频 f₁ (Hz)'],
                [(f1 * 3).toFixed(2), '三次谐波 (Hz)']
            ]));
        }
function resetForm(){document.getElementById('v').value = '343';
      document.getElementById('L').value = '0.5';
      calcTool();}
calcTool();
</script>
