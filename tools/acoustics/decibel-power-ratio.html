<h1 class="sr-only">L = 10·log₁₀(P₂ / P₁)</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="功率量之比转分贝">Decibel Power Ratio</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入两个功率值，求其比值的分贝数。">Decibel Power Ratio is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">dB = 10log₁₀(P₂/P₁)。 10× → 10 dB。</div>
      <p class="formula-desc">输入两个功率值，求其比值的分贝数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p1">参考功率 P₁ (W)</label>
        <input type="number" id="p1" value="1" step="0.1">
      </div>
      <div>
        <label for="p2">比较功率 P₂ (W)</label>
        <input type="number" id="p2" value="10" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>功率量：dB = 10log₁₀(P₂/P₁)。</li>
        <li>10× → 10 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p1=num('p1'),p2=num('p2');
            ToolBox.setResult('result', dataGrid([
                [(10*Math.log10(p2/p1)).toFixed(2),'功率比 (dB)'],
                [(p2/p1).toFixed(3),'线性比 P₂/P₁']
            ]));
        }
function resetForm(){document.getElementById('p1').value = '1';
      document.getElementById('p2').value = '10';
      calcTool();}
calcTool();
</script>
