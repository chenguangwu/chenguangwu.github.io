<div class="container">
  <div class="card">
    <h2 data-zh="矩形房间轴向共振频率">Room Axial Mode</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入房间尺寸与模式阶数 n，求轴向共振频率。">Room Axial Mode is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f_n = n·c/(2L)。 5 m 房间基模 ≈ 34.3 Hz。</div>
      <p class="formula-desc">输入房间尺寸与模式阶数 n，求轴向共振频率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="L">房间尺寸 L (m)</label>
        <input type="number" id="L" value="5" step="0.1">
      </div>
      <div>
        <label for="n">模式阶数 n</label>
        <input type="number" id="n" value="1" step="1">
      </div>
      <div>
        <label for="c">声速 c (m/s)</label>
        <input type="number" id="c" value="343" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>f_n = n·c/(2L)。</li>
        <li>5 m 房间基模 ≈ 34.3 Hz。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const L=num('L'),n=num('n'),c=num('c');
            ToolBox.setResult('result', dataGrid([
                [(n*c/(2*L)).toFixed(2),'轴向共振频率 (Hz)']
            ]));
        }
function resetForm(){document.getElementById('L').value = '5';
      document.getElementById('n').value = '1';
      document.getElementById('c').value = '343';
      calcTool();}
calcTool();
</script>
