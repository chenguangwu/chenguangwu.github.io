<h1 class="sr-only">波长与频率换算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="波长频率（λ = v / f）">Wavelength Frequency Convert</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="已知波速与频率，求声波波长。">Wavelength Frequency Convert is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">λ = v / f</div>
      <p class="formula-desc">已知波速与频率，求声波波长。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="v">波速 (m/s)</label>
        <input type="number" id="v" value="343" step="1">
      </div>
      <div>
        <label for="f">频率 (Hz)</label>
        <input type="number" id="f" value="440" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>λ = v / f。</li>
        <li>343 m/s、440 Hz 对应波长约 0.78 m（A4 音）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v = num('v'), f = num('f');
            const lam = v / f;
            ToolBox.setResult('result', dataGrid([
                [lam.toFixed(4), '波长 λ (m)'],
                [(lam * 100).toFixed(2), '波长 (cm)']
            ]));
        }
function resetForm(){document.getElementById('v').value = '343';
      document.getElementById('f').value = '440';
      calcTool();}
calcTool();
</script>
