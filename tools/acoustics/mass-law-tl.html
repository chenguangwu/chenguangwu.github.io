<div class="container">
  <div class="card">
    <h2 data-zh="单层均质墙的场隔声量">Mass Law Tl</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入频率与面密度，用质量定律估算隔声量 TL。">Mass Law Tl is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">TL ≈ 20·log₁₀(f·m) − 48</div>
      <p class="formula-desc">输入频率与面密度，用质量定律估算隔声量 TL。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f">频率 f (Hz)</label>
        <input type="number" id="f" value="500" step="10">
      </div>
      <div>
        <label for="m">面密度 m (kg/m²)</label>
        <input type="number" id="m" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>TL ≈ 20log₁₀(f·m) − 48（f Hz，m kg/m²）。</li>
        <li>10 kg/m²、500 Hz → TL≈26 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f=num('f'),m=num('m');
            const TL=20*Math.log10(f*m)-48;
            ToolBox.setResult('result', dataGrid([
                [TL.toFixed(2),'隔声量 TL (dB)']
            ]));
        }
function resetForm(){document.getElementById('f').value = '500';
      document.getElementById('m').value = '10';
      calcTool();}
calcTool();
</script>
