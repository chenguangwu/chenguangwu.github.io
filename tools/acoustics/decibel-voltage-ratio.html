<h1 class="sr-only">L = 20·log₁₀(V₂ / V₁)</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>场量（电压/声压）之比转分贝</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两个电压（或声压）值，求其比值的分贝数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">dB = 20log₁₀(V₂/V₁)。 √10× → 10 dB。</div>
      <p class="formula-desc">输入两个电压（或声压）值，求其比值的分贝数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v1">参考电压 V₁ (V)</label>
        <input type="number" id="v1" value="1" step="0.1">
      </div>
      <div>
        <label for="v2">比较电压 V₂ (V)</label>
        <input type="number" id="v2" value="3.16" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>场量：dB = 20log₁₀(V₂/V₁)。</li>
        <li>√10× → 10 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v1=num('v1'),v2=num('v2');
            ToolBox.setResult('result', dataGrid([
                [(20*Math.log10(v2/v1)).toFixed(2),'电压比 (dB)'],
                [(v2/v1).toFixed(3),'线性比 V₂/V₁']
            ]));
        }
function resetForm(){document.getElementById('v1').value = '1';
      document.getElementById('v2').value = '3.16';
      calcTool();}
calcTool();
</script>
