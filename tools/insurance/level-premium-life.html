<div class="container">
  <div class="card">
    <h2>将趸缴保费分摊为每年缴费</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">均衡年保费 = 净趸缴保费 ÷ 年金现值系数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">年保费 = 趸缴保费/äₙ</div>
      <p class="formula-desc">均衡年保费 = 净趸缴保费 ÷ 年金现值系数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="nsp">净趸缴保费 (元)</label>
        <input type="number" id="nsp" value="85000" step="1000">
      </div>
      <div>
        <label for="i">年利率 i</label>
        <input type="number" id="i" value="0.03" step="0.005">
      </div>
      <div>
        <label for="n">缴费年数 (年)</label>
        <input type="number" id="n" value="20" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>a_n| = (1 − v^n) / i。</li>
        <li>年保费随利率上升而下降。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){function fmt(v){const neg=v<0?'-':'';v=Math.abs(v);let s=v.toFixed(2);let p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return neg+p.join('.');}
            const nsp=num('nsp'),i=num('i'),n=num('n');
            const v=1/(1+i);
            const a=(1-Math.pow(v,n))/i;
            const P=nsp/a;
            ToolBox.setResult('result', dataGrid([
                [fmt(P),'均衡年保费 (元)'],
                [fmt(a),'年金现值系数 a_n|'],
                [fmt(P*n),'总缴费 (元)']
            ]));
        }
function resetForm(){document.getElementById('nsp').value = '85000';
      document.getElementById('i').value = '0.03';
      document.getElementById('n').value = '20';
      calcTool();}
calcTool();
</script>
