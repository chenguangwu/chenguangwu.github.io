</nav>
<div class="container">
  <div class="card">
    <h2>收入替代法估算所需寿险保额</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按收入替代与负债估算家庭所需寿险保额。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">寿险保额 = 年收入缺口 × 折现年金因子</div>
      <p class="formula-desc">按收入替代与负债估算家庭所需寿险保额。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="income">年收入 (元)</label>
        <input type="number" id="income" value="300000" step="10000">
      </div>
      <div>
        <label for="years">保障年数 (年)</label>
        <input type="number" id="years" value="10" step="1">
      </div>
      <div>
        <label for="debt">现有负债 (元)</label>
        <input type="number" id="debt" value="1000000" step="50000">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="asset">可动用资产 (元)</label>
        <input type="number" id="asset" value="500000" step="50000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>保额 = 年收入×保障年数 + 负债 − 资产。</li>
        <li>仅作粗略估算，实际需求应结合具体家庭结构。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){function fmt(v){const neg=v<0?'-':'';v=Math.abs(v);let s=v.toFixed(2);let p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return neg+p.join('.');}
            const inc=num('income'),y=num('years'),d=num('debt'),a=num('asset');
            const cover=inc*y + d - a;
            ToolBox.setResult('result', dataGrid([
                [fmt(cover),'建议保额 (元)'],
                [fmt(inc*y),'收入替代部分 (元)'],
                [fmt(Math.max(cover,0)),'保额下限 (元)']
            ]));
        }
function resetForm(){document.getElementById('income').value = '300000';
      document.getElementById('years').value = '10';
      document.getElementById('debt').value = '1000000';
      document.getElementById('asset').value = '500000';
      calcTool();}
calcTool();
</script>
