</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="每单位风险暴露的理赔次数">Claim Frequency</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="理赔频率 = 理赔件数 ÷ 风险暴露单位。">Claim Frequency is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">理赔频率 = 理赔次数/风险暴露</div>
      <p class="formula-desc">理赔频率 = 理赔件数 ÷ 风险暴露单位。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="claims">理赔件数 (件)</label>
        <input type="number" id="claims" value="120" step="1">
      </div>
      <div>
        <label for="exposure">风险暴露 (车年)</label>
        <input type="number" id="exposure" value="1000" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>频率 = 理赔件数 / 暴露单位。</li>
        <li>常用于车险定价基础。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c=num('claims'),e=num('exposure');
            const f=c/e;
            ToolBox.setResult('result', dataGrid([
                [f.toFixed(4),'理赔频率 (次/暴露单位)'],
                [(f*100).toFixed(2),'出险率 (%)']
            ]));
        }
function resetForm(){document.getElementById('claims').value = '120';
      document.getElementById('exposure').value = '1000';
      calcTool();}
calcTool();
</script>
