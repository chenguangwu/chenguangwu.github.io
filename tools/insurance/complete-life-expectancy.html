<div class="container">
  <div class="card">
    <h2 data-zh="由逐年生存概率序列求完全期望寿命">Complete Life Expectancy</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入逐年生存概率序列（逗号或空格分隔），求期望余命。">Complete Life Expectancy is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">eₓ = Σ t·ₜpₓ</div>
      <p class="formula-desc">输入逐年生存概率序列（逗号或空格分隔），求期望余命。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="tpx">生存概率序列 ₜp_x</label>
        <input type="number" id="tpx" value="0.95, 0.9, 0.85, 0.8, 0.75" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>近似为生存概率累加。</li>
        <li>0.95+0.9+0.85+0.8+0.75 → 4.25。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const raw=document.getElementById('tpx').value.split(/[ ,]+/).filter(Boolean).map(parseFloat);
            let s=0;
            for(const x of raw){ s+=x; }
            ToolBox.setResult('result', dataGrid([
                [s.toFixed(3),'完全期望寿命 e_x']
            ]));
        }
function resetForm(){document.getElementById('tpx').value = '0.95, 0.9, 0.85, 0.8, 0.75';
      calcTool();}
calcTool();
</script>
