<h1 class="sr-only">NSP = 年给付 × 年金现值因子 a_x</h1>

<div class="nav">

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由年给付与年金因子求净单保费">Annuity Nsp</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入年给付额与年金现值因子 a_x，求净单保费。">Annuity Nsp is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">净单保费 = 年给付 × äₙ</div>
      <p class="formula-desc">输入年给付额与年金现值因子 a_x，求净单保费。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="b">年给付额 (元)</label>
        <input type="number" id="b" value="1000" step="50">
      </div>
      <div>
        <label for="ax">年金因子 a_x</label>
        <input type="number" id="ax" value="15" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>a_x 由生命表贴现求得。</li>
        <li>1000×15 → 15000 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const b=num('b'),ax=num('ax');
            const NSP=b*ax;
            ToolBox.setResult('result', dataGrid([
                [NSP.toFixed(2),'净单保费 NSP (元)']
            ]));
        }
function resetForm(){document.getElementById('b').value = '1000';
      document.getElementById('ax').value = '15';
      calcTool();}
calcTool();
</script>
