<div class="container">
  <div class="card">
    <h2 data-zh="保险年金定价基础">Annuity Certain Pv</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="确定年金现值 a_n| = (1 − v^n) / i。">Annuity Certain Pv is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">PV = C·(1−(1+i)^−n)/i</div>
      <p class="formula-desc">确定年金现值 a_n| = (1 − v^n) / i。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P">年金额 (元)</label>
        <input type="number" id="P" value="12000" step="1000">
      </div>
      <div>
        <label for="i">年利率 i</label>
        <input type="number" id="i" value="0.03" step="0.005">
      </div>
      <div>
        <label for="n">年数 (年)</label>
        <input type="number" id="n" value="15" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>期末付 a_n| = (1 − v^n) / i。</li>
        <li>期初付 = 期末付 × (1+i)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){function fmt(v){const neg=v<0?'-':'';v=Math.abs(v);let s=v.toFixed(2);let p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return neg+p.join('.');}
            const P=num('P'),i=num('i'),n=num('n');
            const v=1/(1+i);
            const aEnd=(1-Math.pow(v,n))/i;
            const aBeg=aEnd*(1+i);
            ToolBox.setResult('result', dataGrid([
                [fmt(P*aEnd),'期末付现值 (元)'],
                [fmt(P*aBeg),'期初付现值 (元)'],
                [fmt(aEnd),'年金现值系数 a_n|']
            ]));
        }
function resetForm(){document.getElementById('P').value = '12000';
      document.getElementById('i').value = '0.03';
      document.getElementById('n').value = '15';
      calcTool();}
calcTool();
</script>
