<h1 class="sr-only">承保利润率 = 1 − (赔付率 + 费用率)</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 承保利润率计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 保险计算</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">承保利润率计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由综合成本率反推承保利润">Uw Margin</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入赔付率与费用率，求承保利润率。">Uw Margin is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">承保利润 = 保费 × (1−综合成本率)</div>
      <p class="formula-desc">输入赔付率与费用率，求承保利润率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="LR">赔付率 LR (%)</label>
        <input type="number" id="LR" value="60" step="2">
      </div>
      <div>
        <label for="ER">费用率 ER (%)</label>
        <input type="number" id="ER" value="25" step="2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>综合成本率<100% 才承保盈利。</li>
        <li>1−(60+25)% → 15%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const LR=num('LR'),ER=num('ER');
            const m=100-(LR+ER);
            ToolBox.setResult('result', dataGrid([
                [m.toFixed(1),'承保利润率 (%)']
            ]));
        }
function resetForm(){document.getElementById('LR').value = '60';
      document.getElementById('ER').value = '25';
      calcTool();}
calcTool();
</script>
