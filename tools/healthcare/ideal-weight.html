<div class="container">
  <div class="card">
    <h2 data-zh="🧍 理想体重 Devine">🧍 Ideal Weight Devine</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="用 Devine 公式估算成人理想体重。">Ideal Weight Devine is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>身高 cm</label><input type="number" id="height" value="170" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1男/2女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="30" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Devine：男 50+2.3×(in−60)，女 45.5+2.3×(in−60)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">仅作营养评估参考，非健康标准。</p>
  </div>
</div>

<script>
function calc(){
  const height = +document.getElementById('height').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  const age = +document.getElementById('age').value || 0;
  let html = '';
  const __v = ((()=>{const hIn=height/2.54;return (sex===1?50:45.5)+2.3*(hIn-60);})());
  html += `<p>理想体重：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(1)}</strong> kg</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
