    <h2 data-zh="🩸 eGFR 估算肾小球滤过率">🩸 Egfr</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="用 CKD-EPI 公式估算 eGFR。">Egfr is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>血肌酐 µmol/L</label><input type="number" id="scr" value="80" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="50" step="1" oninput="calc()"></div>
    <div class="input-row"><label>性别 1=男 0=女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>种族系数</label><input type="number" id="race" value="1" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>

  </div>

    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">CKD-EPI 公式（简化版）</div>

<script>
function calc(){
  const scr = +document.getElementById('scr').value || 0;
  const age = +document.getElementById('age').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  const race = +document.getElementById('race').value || 0;
  let html = '';
  const __v0 = (sex?141*Math.pow(Math.min(scr/88.4*0.9,1),-0.411)*Math.pow(Math.max(scr/88.4*0.9,1),-1.209)*Math.pow(0.993,age)*race:141*Math.pow(Math.min(scr/88.4*0.7,1),-0.329)*Math.pow(Math.max(scr/88.4*0.7,1),-1.209)*Math.pow(0.993,age)*1.018*race);
  html += `<p>eGFR：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> mL/min/1.73m²</p>`;
  const __v1 = ((()=>{const g=sex?141*Math.pow(Math.min(scr/88.4*0.9,1),-0.411)*Math.pow(Math.max(scr/88.4*0.9,1),-1.209)*Math.pow(0.993,age)*race:141*Math.pow(Math.min(scr/88.4*0.7,1),-0.329)*Math.pow(Math.max(scr/88.4*0.7,1),-1.209)*Math.pow(0.993,age)*1.018*race;return g>=90?1:(g>=60?2:(g>=30?3:(g>=15?4:5)));})());
  html += `<p>CKD 分期：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 期</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
