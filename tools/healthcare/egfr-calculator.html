<div class="container">
  <div class="card">
    <h2>🫘 eGFR 肾小球滤过率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用 CKD-EPI 简化公式估算 eGFR。</p>
    <div class="input-row"><label>血肌酐 mg/dL</label><input type="number" id="scr" value="1.0" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="50" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1男/2女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">CKD-EPI 简化：175·Scr⁻¹·¹⁵⁴·年龄⁻⁰·²⁰³·(女×0.742)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">eGFR&lt;60 持续三月提示慢性肾病，需就医。</p>
  </div>
</div>

<script>
function calc(){
  const scr = +document.getElementById('scr').value || 0;
  const age = +document.getElementById('age').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  let html = '';
  const __v = (175*Math.pow(scr,-1.154)*Math.pow(age,-0.203)*(sex===2?0.742:1));
  html += `<p>eGFR：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(1)}</strong> mL/min</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
