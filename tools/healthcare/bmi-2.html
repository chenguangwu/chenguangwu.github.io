<div class="container">
  <div class="card">
    <h2>📏  BMI 儿童百分位估算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据年龄性别估算儿童 BMI Z 分数（简化）。</p>
    <div class="input-row"><label>年龄 岁</label><input type="number" id="age" value="10" step="any" oninput="calc()"></div>
    <div class="input-row"><label>BMI</label><input type="number" id="bmi" value="18" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1=男 0=女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="3" data-viz-min="-3"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Z ≈ (BMI − 参考均值) / 标准差<br>参考均值随年龄性别变化</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">本工具为教学简化版，请使用 CDC/WHO 生长曲线。</p>
  </div>
</div>

<script>
function calc(){
  const age = +document.getElementById('age').value || 0;
  const bmi = +document.getElementById('bmi').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  let html = '';
  const __v0 = ((bmi-(sex?16.5:16.2)-age*0.35)/2.2);
  html += `<p>Z 分数近似：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> </p>`;
  const __v1 = ((0.5*(1+Math.erf((bmi-(sex?16.5:16.2)-age*0.35)/(2.2*Math.sqrt(2)))))*100);
  html += `<p>百分位近似：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> %</p>`;
  const __v2 = ((()=>{const z=(bmi-(sex?16.5:16.2)-age*0.35)/2.2;return z<-2?"偏瘦":(z>2?"超重":"正常");})());
  html += `<p>评估：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
