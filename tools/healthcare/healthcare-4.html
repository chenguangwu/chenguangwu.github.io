<div class="container">
  <div class="card">
    <h2>🫀 纽约心功能分级</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据活动受限程度评估心功能分级。</p>
    <div class="input-row"><label>日常活动气短 0-3</label><input type="number" id="dyspnea" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>静息症状 0=无 1=有</label><input type="number" id="rest" value="0" step="1" oninput="calc()"></div>
    <div class="input-row"><label>活动明显受限 0=无 1=有</label><input type="number" id="limits" value="0" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="4" data-viz-min="1"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">NYHA I-IV 级按症状和活动受限程度划分</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">用于心衰严重程度评估。</p>
  </div>
</div>

<script>
function calc(){
  const dyspnea = +document.getElementById('dyspnea').value || 0;
  const rest = +document.getElementById('rest').value || 0;
  const limits = +document.getElementById('limits').value || 0;
  let html = '';
  const __v0 = (rest?4:(dyspnea===0?1:(limits?3:2)));
  html += `<p>NYHA 分级：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 级</p>`;
  const __v1 = ((()=>{const g=rest?4:(dyspnea===0?1:(limits?3:2));return ["I 无症状","II 轻度受限","III 明显受限","IV 静息症状"][g-1];})());
  html += `<p>解释：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
