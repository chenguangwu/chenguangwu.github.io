<div class="container">
  <div class="card">
    <h2 data-zh="👶 阿普加评分 Apgar">👶 Apgar</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="新生儿出生后 1/5 分钟 Apgar 评分。">Apgar is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>皮肤颜色 0-2</label><input type="number" id="appearance" value="2" step="1" oninput="calc()"></div>
    <div class="input-row"><label>心率 0-2</label><input type="number" id="pulse" value="2" step="1" oninput="calc()"></div>
    <div class="input-row"><label>反射 0-2</label><input type="number" id="grimace" value="2" step="1" oninput="calc()"></div>
    <div class="input-row"><label>肌张力 0-2</label><input type="number" id="activity" value="2" step="1" oninput="calc()"></div>
    <div class="input-row"><label>呼吸 0-2</label><input type="number" id="respiration" value="2" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="10" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Apgar = 皮肤颜色 + 心率 + 反射 + 肌张力 + 呼吸<br>每项 0-2 分</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">新生儿窒息快速评估工具。</p>
  </div>
</div>

<script>
function calc(){
  const appearance = +document.getElementById('appearance').value || 0;
  const pulse = +document.getElementById('pulse').value || 0;
  const grimace = +document.getElementById('grimace').value || 0;
  const activity = +document.getElementById('activity').value || 0;
  const respiration = +document.getElementById('respiration').value || 0;
  let html = '';
  const __v0 = (appearance+pulse+grimace+activity+respiration);
  html += `<p>Apgar 总分：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 分</p>`;
  const __v1 = ((()=>{const s=appearance+pulse+grimace+activity+respiration;return s>=7?"正常":(s>=4?"轻度窒息":"重度窒息");})());
  html += `<p>临床意义：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
