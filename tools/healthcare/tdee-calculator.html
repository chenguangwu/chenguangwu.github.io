</nav>
<div class="container">
  <div class="card">
    <h2>🍎 每日热量消耗 TDEE</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由 BMR 与活动因子估算每日总消耗。</p>
    <div class="input-row"><label>基础代谢 BMR</label><input type="number" id="bmr" value="1500" step="any" oninput="calc()"></div>
    <div class="input-row"><label>活动因子</label><input type="number" id="activity" value="1.5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标周减重 kg</label><input type="number" id="targetLoss" value="0.5" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">TDEE = BMR × 活动因子（1.2 久坐–1.9 极高）</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">减脂建议摄入低于 TDEE 约 20%。</p>
  </div>
</div>

<script>
function calc(){
  const bmr = +document.getElementById('bmr').value || 0;
  const activity = +document.getElementById('activity').value || 0;
  const targetLoss = +document.getElementById('targetLoss').value || 0;
  let html = '';
  const __v0 = (bmr*activity);
  html += `<p>TDEE：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> kcal/天</p>`;
  const __v1 = (bmr*activity*0.8);
  html += `<p>减脂摄入：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> kcal/天</p>`;
  const __v2 = (targetLoss*7700);
  html += `<p>周需缺口：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> kcal</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
