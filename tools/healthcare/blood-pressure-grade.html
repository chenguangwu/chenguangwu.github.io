<div class="container">
  <div class="card">
    <h2 data-zh="🩺 血压分级">🩺 Blood Pressure Grade</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="根据收缩压/舒张压判定血压分级。">Blood Pressure Grade is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>收缩压 mmHg</label><input type="number" id="sys" value="120" step="any" oninput="calc()"></div>
    <div class="input-row"><label>舒张压 mmHg</label><input type="number" id="dia" value="80" step="any" oninput="calc()"></div>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="40" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">脉压 = 收缩压 − 舒张压</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">分级：正常&lt;120/80，升高 120–139/80–89，1 级 140–159/90–99，2 级≥160/100。仅供参考，以医生诊断为准。</p>
  </div>
</div>

<script>
function calc(){
  const sys = +document.getElementById('sys').value || 0;
  const dia = +document.getElementById('dia').value || 0;
  const age = +document.getElementById('age').value || 0;
  let html = '';
  const __v0 = (sys-dia);
  html += `<p>脉压：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> mmHg</p>`;
  const __v1 = ((()=>{if(sys>=180||dia>=120)return 5;if(sys>=140||dia>=90)return 4;if(sys>=130||dia>=80)return 3;if(sys>=120)return 2;return 1;})());
  html += `<p>分级：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 等级</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
