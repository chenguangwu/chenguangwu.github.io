<div class="container">
  <div class="card">
    <h2>🚶 跌倒风险 Morse</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Morse 跌倒风险评估量表快速计算。</p>
    <div class="input-row"><label>跌倒史</label><input type="number" id="hist" value="25" step="1" oninput="calc()"></div>
    <div class="input-row"><label>第二诊断</label><input type="number" id="sec_diag" value="15" step="1" oninput="calc()"></div>
    <div class="input-row"><label>助行器 0=无 15=拐杖 30=扶物</label><input type="number" id="aid" value="15" step="1" oninput="calc()"></div>
    <div class="input-row"><label>静脉输液</label><input type="number" id="iv" value="20" step="1" oninput="calc()"></div>
    <div class="input-row"><label>步态 0=正常 10=虚弱 20=损伤</label><input type="number" id="gait" value="10" step="1" oninput="calc()"></div>
    <div class="input-row"><label>精神状态 0=正常 15=高估/遗忘</label><input type="number" id="mental" value="15" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="125" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Morse 量表总分 = 各条目得分之和<br>≤24 低风险，25-50 中风险，>50 高风险</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">用于住院患者跌倒筛查。</p>
  </div>
</div>

<script>
function calc(){
  const hist = +document.getElementById('hist').value || 0;
  const sec_diag = +document.getElementById('sec_diag').value || 0;
  const aid = +document.getElementById('aid').value || 0;
  const iv = +document.getElementById('iv').value || 0;
  const gait = +document.getElementById('gait').value || 0;
  const mental = +document.getElementById('mental').value || 0;
  let html = '';
  const __v0 = (hist+sec_diag+aid+iv+gait+mental);
  html += `<p>总分：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 分</p>`;
  const __v1 = ((()=>{const s=hist+sec_diag+aid+iv+gait+mental;return s<=24?"低风险":(s<=50?"中风险":"高风险");})());
  html += `<p>风险等级：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
