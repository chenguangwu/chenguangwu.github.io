<div class="container">
  <div class="card">
    <h2>🥗 营养风险 NRS2002</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">NRS-2002 营养风险筛查评分。</p>
    <div class="input-row"><label>BMI <20.5</label><input type="number" id="bmi" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>近3月体重下降</label><input type="number" id="weight_loss" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>摄食减少</label><input type="number" id="intake" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>疾病严重程度 0-3</label><input type="number" id="severity" value="2" step="1" oninput="calc()"></div>
    <div class="input-row"><label>年龄≥70</label><input type="number" id="age70" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="7" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">总分 = 营养受损(0-3) + 疾病严重程度(0-3) + 年龄≥70(1)<br>≥3 认为有营养风险</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">需结合临床营养评估。</p>
  </div>
</div>

<script>
function calc(){
  const bmi = +document.getElementById('bmi').value || 0;
  const weight_loss = +document.getElementById('weight_loss').value || 0;
  const intake = +document.getElementById('intake').value || 0;
  const severity = +document.getElementById('severity').value || 0;
  const age70 = +document.getElementById('age70').value || 0;
  let html = '';
  const __v0 = (bmi+weight_loss+intake);
  html += `<p>营养受损评分：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 分</p>`;
  const __v1 = (bmi+weight_loss+intake+severity+age70);
  html += `<p>总分：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 分</p>`;
  const __v2 = (bmi+weight_loss+intake+severity+age70>=3?"是":"否");
  html += `<p>存在营养风险：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
