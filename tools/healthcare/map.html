<div class="container">
  <div class="card">
    <h2>🩺 MAP 平均动脉压</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据收缩压和舒张压计算平均动脉压。</p>
    <div class="input-row"><label>收缩压 mmHg</label><input type="number" id="sbp" value="120" step="any" oninput="calc()"></div>
    <div class="input-row"><label>舒张压 mmHg</label><input type="number" id="dbp" value="80" step="any" oninput="calc()"></div>
    <div class="input-row"><label>心率</label><input type="number" id="hr" value="75" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="130" data-viz-min="50"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">MAP ≈ 舒张压 + (收缩压 − 舒张压) / 3</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">反映器官灌注压力的重要指标。</p>
  </div>
</div>

<script>
function calc(){
  const sbp = +document.getElementById('sbp').value || 0;
  const dbp = +document.getElementById('dbp').value || 0;
  const hr = +document.getElementById('hr').value || 0;
  let html = '';
  const __v0 = (dbp+(sbp-dbp)/3);
  html += `<p>MAP：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> mmHg</p>`;
  const __v1 = (sbp-dbp);
  html += `<p>脉压：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> mmHg</p>`;
  const __v2 = ((()=>{const m=dbp+(sbp-dbp)/3;return m>=70?"正常":(m>=65?"临界":"偏低");})());
  html += `<p>MAP 分级：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
