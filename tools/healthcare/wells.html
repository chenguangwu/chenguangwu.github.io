  <span class="bc-sep">‹</span>
  <span class="bc-current">Wells 肺栓塞评分</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="🫁 Wells 肺栓塞评分">🫁 Wells</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="临床评估肺栓塞可能性的评分工具。">Wells is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>DVT 症状体征</label><input type="number" id="dvt" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>PE 最可能诊断</label><input type="number" id="pe" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>心率 >100</label><input type="number" id="hr" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>制动或近期手术</label><input type="number" id="imm" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>既往 DVT/PE</label><input type="number" id="dvt_hist" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>咯血</label><input type="number" id="hem" value="0" step="1" oninput="calc()"></div>
    <div class="input-row"><label>恶性肿瘤</label><input type="number" id="cancer" value="0" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="12" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">总分 = 各项得分之和 ≤4 低度可能，>4 高度可能</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">需结合 D-二聚体或影像学检查。</p>
  </div>
</div>

<script>
function calc(){
  const dvt = +document.getElementById('dvt').value || 0;
  const pe = +document.getElementById('pe').value || 0;
  const hr = +document.getElementById('hr').value || 0;
  const imm = +document.getElementById('imm').value || 0;
  const dvt_hist = +document.getElementById('dvt_hist').value || 0;
  const hem = +document.getElementById('hem').value || 0;
  const cancer = +document.getElementById('cancer').value || 0;
  let html = '';
  const __v0 = (dvt+pe+hr+imm+dvt_hist+hem+cancer);
  html += `<p>评分：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 分</p>`;
  const __v1 = ((()=>{const sc=dvt+pe+hr+imm+dvt_hist+hem+cancer;return sc<=1?"低度":(sc<=6?"中度":"高度");})());
  html += `<p>临床概率：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
