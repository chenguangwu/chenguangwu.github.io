<div class="container">
  <div class="card">
    <h2>🧪 GFR 肌酐清除率 Cockcroft</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用 Cockcroft-Gault 公式估算肌酐清除率。</p>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="50" step="1" oninput="calc()"></div>
    <div class="input-row"><label>体重 kg</label><input type="number" id="weight" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>血肌酐 µmol/L</label><input type="number" id="scr" value="80" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1=男 0=女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="150" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">CrCl = (140 − 年龄) × 体重 / (血肌酐 µmol/L ÷ 88.4)<br>女性 ×0.85</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">用于药物剂量调整。</p>
  </div>
</div>

<script>
function calc(){
  const age = +document.getElementById('age').value || 0;
  const weight = +document.getElementById('weight').value || 0;
  const scr = +document.getElementById('scr').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  let html = '';
  const __v0 = (((140-age)*weight)/(scr/88.4)*(sex?1:0.85));
  html += `<p>CrCl：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> mL/min</p>`;
  const __v1 = (((140-age)*weight)/(scr/88.4)*(sex?1:0.85)*1.73/(()=>{return 0.007184*Math.pow(weight,0.425)*Math.pow(170,0.725);})());
  html += `<p>调整后体表：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> mL/min/1.73m²</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
