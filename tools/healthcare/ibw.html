<div class="container">
  <div class="card">
    <h2>🧮 理想体重 IBW</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用 Devine 公式计算成人理想体重。</p>
    <div class="input-row"><label>身高 cm</label><input type="number" id="height" value="170" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1=男 0=女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="100" data-viz-min="40"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">男性 IBW = 50 + 0.91×(身高cm − 152.4)<br>女性 IBW = 45.5 + 0.91×(身高cm − 152.4)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">常用于药物剂量调整参考。</p>
  </div>
</div>

<script>
function calc(){
  const height = +document.getElementById('height').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  let html = '';
  const __v0 = (sex?50+0.91*(height-152.4):45.5+0.91*(height-152.4));
  html += `<p>IBW：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> kg</p>`;
  const __v1 = ((sex?50+0.91*(height-152.4):45.5+0.91*(height-152.4))*1.1);
  html += `<p>上限：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> kg</p>`;
  const __v2 = ((sex?50+0.91*(height-152.4):45.5+0.91*(height-152.4))*0.9);
  html += `<p>下限：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(1)}</strong> kg</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
