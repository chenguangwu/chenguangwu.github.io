<div class="container">
  <div class="card">
    <h2>👶 儿童剂量换算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据成人剂量按体重换算儿童剂量。</p>
    <div class="input-row"><label>成人剂量 mg</label><input type="number" id="adult_dose" value="500" step="any" oninput="calc()"></div>
    <div class="input-row"><label>儿童体重 kg</label><input type="number" id="child_weight" value="20" step="any" oninput="calc()"></div>
    <div class="input-row"><label>参考成人体重 kg</label><input type="number" id="adult_weight" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>最大倍数限制</label><input type="number" id="max_factor" value="2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="500" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">儿童剂量 = 成人剂量 × (儿童体重 / 成人体重)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">实际用药需遵医嘱，不可自行决定。</p>
  </div>
</div>

<script>
function calc(){
  const adult_dose = +document.getElementById('adult_dose').value || 0;
  const child_weight = +document.getElementById('child_weight').value || 0;
  const adult_weight = +document.getElementById('adult_weight').value || 0;
  const max_factor = +document.getElementById('max_factor').value || 0;
  let html = '';
  const __v0 = (adult_dose*(child_weight/adult_weight));
  html += `<p>按体重剂量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> mg</p>`;
  const __v1 = (Math.min(adult_dose*(child_weight/adult_weight), adult_dose*max_factor));
  html += `<p>受限剂量：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> mg</p>`;
  const __v2 = ((child_weight/adult_weight)*100);
  html += `<p>剂量比例：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(2)}</strong> %</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
