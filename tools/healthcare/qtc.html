<div class="container">
  <div class="card">
    <h2>📈 QTc 校正心率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用 Bazett 公式校正 QT 间期。</p>
    <div class="input-row"><label>QT 间期 ms</label><input type="number" id="qt" value="400" step="any" oninput="calc()"></div>
    <div class="input-row"><label>心率 bpm</label><input type="number" id="hr" value="75" step="1" oninput="calc()"></div>
    <div class="input-row"><label>公式 1=Bazett 2=Fridericia</label><input type="number" id="formula" value="1" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="550" data-viz-min="300"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Bazett: QTc = QT / √RR<br>Fridericia: QTc = QT / ³√RR<br>RR = 60 / HR</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">QTc 延长与心律失常风险相关。</p>
  </div>
</div>

<script>
function calc(){
  const qt = +document.getElementById('qt').value || 0;
  const hr = +document.getElementById('hr').value || 0;
  const formula = +document.getElementById('formula').value || 0;
  let html = '';
  const __v0 = (qt/Math.sqrt(60/hr));
  html += `<p>QTc Bazett：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> ms</p>`;
  const __v1 = (qt/Math.cbrt(60/hr));
  html += `<p>QTc Fridericia：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> ms</p>`;
  const __v2 = (formula===1?440:450);
  html += `<p>正常上限：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> ms</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
