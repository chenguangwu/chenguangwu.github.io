<div class="container">
  <div class="card">
    <h2 data-zh="📉 减脂热量缺口">📉 Fat Loss Deficit</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按目标减重与天数估算每日热量缺口。">Fat Loss Deficit is available directly in your browser, with no data uploaded.</p>
    <div class="input-row"><label>目标减重 kg</label><input type="number" id="loss" value="5" step="any" oninput="calc()"></div>
    <div class="input-row"><label>计划天数</label><input type="number" id="days" value="60" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标体重 kg</label><input type="number" id="targetWeight" value="60" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">1 kg 脂肪 ≈ 7700 kcal；日缺口 = 总缺口 / 天数</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">安全减脂建议日缺口 500–1000 kcal。</p>
  </div>
</div>

<script>
function calc(){
  const loss = +document.getElementById('loss').value || 0;
  const days = +document.getElementById('days').value || 0;
  const targetWeight = +document.getElementById('targetWeight').value || 0;
  let html = '';
  const __v0 = (loss*7700);
  html += `<p>总缺口：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> kcal</p>`;
  const __v1 = (loss*7700/days);
  html += `<p>日缺口：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> kcal/天</p>`;
  const __v2 = (targetWeight+loss);
  html += `<p>起始体重：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(1)}</strong> kg</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
