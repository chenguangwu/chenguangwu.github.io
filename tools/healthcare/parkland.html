<div class="container">
  <div class="card">
    <h2>🔥 Parkland 烧伤补液</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算成人烧伤后 24 小时 Parkland 补液量。</p>
    <div class="input-row"><label>体重 kg</label><input type="number" id="weight" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>烧伤面积 %</label><input type="number" id="tbsa" value="30" step="any" oninput="calc()"></div>
    <div class="input-row"><label>已输注时间 h</label><input type="number" id="hours" value="0" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="10000" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">24h 乳酸林格 = 4 mL × 体重(kg) × 烧伤面积(%)<br>一半在前 8h，一半在后 16h</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">为估算公式，实际需根据尿量等调整。</p>
  </div>
</div>

<script>
function calc(){
  const weight = +document.getElementById('weight').value || 0;
  const tbsa = +document.getElementById('tbsa').value || 0;
  const hours = +document.getElementById('hours').value || 0;
  let html = '';
  const __v0 = (4*weight*tbsa);
  html += `<p>24h 总量：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> mL</p>`;
  const __v1 = (4*weight*tbsa*0.5);
  html += `<p>前8小时：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> mL</p>`;
  const __v2 = (4*weight*tbsa*0.5);
  html += `<p>后16小时：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> mL</p>`;
  const __v3 = (4*weight*tbsa*hours/24);
  html += `<p>当前应输：<strong style="font-size:18px;color:var(--primary);">${__v3.toFixed(0)}</strong> mL</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
