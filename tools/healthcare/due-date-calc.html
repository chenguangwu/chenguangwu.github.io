<div class="container">
  <div class="card">
    <h2>🤰 孕周与预产期</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据末次月经估算当前孕周与预产期。</p>
    <div class="input-row"><label>末次月经距今天数</label><input type="number" id="lmp" value="100" step="any" oninput="calc()"></div>
    <div class="input-row"><label>周期天数</label><input type="number" id="cycleLen" value="28" step="any" oninput="calc()"></div>
    <div class="input-row"><label>排卵日(周期第几天)</label><input type="number" id="ovulationDay" value="14" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">EDD = LMP + 280 天（40 周）；当前孕周 = 距LMP天数/7</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">仅供估算，实际分娩可前后浮动两周。</p>
  </div>
</div>

<script>
function calc(){
  const lmp = +document.getElementById('lmp').value || 0;
  const cycleLen = +document.getElementById('cycleLen').value || 0;
  const ovulationDay = +document.getElementById('ovulationDay').value || 0;
  let html = '';
  const __v0 = (lmp/7);
  html += `<p>当前孕周：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(1)}</strong> 周</p>`;
  const __v1 = (280-lmp);
  html += `<p>距预产期：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> 天</p>`;
  const __v2 = (lmp-ovulationDay);
  html += `<p>距排卵期：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 天</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
