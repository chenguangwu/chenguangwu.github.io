<div class="container">
  <div class="card">
    <h2>🧂 低钠血症纠正速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算低钠血症治疗中血钠上升速度。</p>
    <div class="input-row"><label>输注液钠浓度 mmol/L</label><input type="number" id="na_inf" value="154" step="any" oninput="calc()"></div>
    <div class="input-row"><label>总体水 L</label><input type="number" id="tbw" value="42" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标血钠 mmol/L</label><input type="number" id="target" value="130" step="any" oninput="calc()"></div>
    <div class="input-row"><label>当前血钠 mmol/L</label><input type="number" id="current" value="118" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="gauge" data-viz-max="20" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">血钠变化 ≈ (输注液钠 − 当前血钠) / (总体水 + 1)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">仅为教学估算，临床必须个体化治疗。</p>
  </div>
</div>

<script>
function calc(){
  const na_inf = +document.getElementById('na_inf').value || 0;
  const tbw = +document.getElementById('tbw').value || 0;
  const target = +document.getElementById('target').value || 0;
  const current = +document.getElementById('current').value || 0;
  let html = '';
  const __v0 = ((na_inf-current)/(tbw+1));
  html += `<p>预期升幅：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> mmol/L</p>`;
  const __v1 = (target-current);
  html += `<p>目标差距：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(1)}</strong> mmol/L</p>`;
  const __v2 = ("24h 不超过 8-10 mmol/L");
  html += `<p>24h 上限提醒：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> </p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
