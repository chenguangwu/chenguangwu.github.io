<div class="tool-guide-link" data-guide-link="1">
  <a href="../../guides/heart-rate-zones-guide.html">📖 查看「心率区间计算器使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>❤️ 心率训练区间</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按最大心率法估算燃脂与有氧区间。</p>
    <div class="input-row"><label>年龄</label><input type="number" id="age" value="30" step="any" oninput="calc()"></div>
    <div class="input-row"><label>静息心率</label><input type="number" id="rest" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>目标强度 %</label><input type="number" id="intensity" value="0.7" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">HRmax = 220 − 年龄；区间 = 储备心率 × % + 静息</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">仅通用公式，个体存在差异。</p>
  </div>
</div>

<script>
function calc(){
  const age = +document.getElementById('age').value || 0;
  const rest = +document.getElementById('rest').value || 0;
  const intensity = +document.getElementById('intensity').value || 0;
  let html = '';
  const __v0 = (220-age);
  html += `<p>最大心率：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> bpm</p>`;
  const __v1 = ((220-age-rest)*0.6+rest);
  html += `<p>燃脂区间：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> bpm</p>`;
  const __v2 = ((220-age-rest)*intensity+rest);
  html += `<p>目标心率：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> bpm</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
