<div class="container">
  <div class="card">
    <h2>🍺 血液酒精浓度 BAC</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用 Widmark 公式估算血液酒精浓度。</p>
    <div class="input-row"><label>饮酒量 mL</label><input type="number" id="volume" value="350" step="any" oninput="calc()"></div>
    <div class="input-row"><label>酒精度 %</label><input type="number" id="abv" value="0.05" step="any" oninput="calc()"></div>
    <div class="input-row"><label>体重 kg</label><input type="number" id="weight" value="70" step="any" oninput="calc()"></div>
    <div class="input-row"><label>性别 1男/2女</label><input type="number" id="sex" value="1" step="1" oninput="calc()"></div>
    <div class="input-row"><label>饮酒后小时</label><input type="number" id="hours" value="2" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">Widmark：BAC = A/(r·W) − β·t；A=体积×酒精度×0.789(g)</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">r 男0.68/女0.55，β≈0.015/h。请勿酒后驾车，本结果仅供参考。</p>
  </div>
</div>

<script>
function calc(){
  const volume = +document.getElementById('volume').value || 0;
  const abv = +document.getElementById('abv').value || 0;
  const weight = +document.getElementById('weight').value || 0;
  const sex = +document.getElementById('sex').value || 0;
  const hours = +document.getElementById('hours').value || 0;
  let html = '';
  const __v = (Math.max(0,(volume*abv*0.789)/( (sex===1?0.68:0.55)*weight ) - 0.015*hours));
  html += `<p>BAC：<strong style="font-size:18px;color:var(--primary);">${__v.toFixed(3)}</strong> g/100mL</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
