<div class="container">
  <div class="card">
    <h2 data-zh="🖼️ 公众号封面生成器">🖼️ WeChat Cover Generator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="纯前端生成 900×383 封面图：标题 + 副标题 + 背景渐变 + 下载。">Create styled cover images for WeChat articles quickly.</p>

    <label>标题</label>
    <input id="title" type="text" value="工具名示例" oninput="render()">
    <label>副标题</label>
    <input id="subtitle" type="text" value="今日学习一款实用在线工具" oninput="render()">

    <div class="input-row">
      <div>
        <label>背景色 1</label>
        <input id="c1" type="color" value="#ff6b35" onchange="render()">
      </div>
      <div>
        <label>背景色 2</label>
        <input id="c2" type="color" value="#7c3aed" onchange="render()">
      </div>
      <div>
        <label>文字颜色</label>
        <input id="textColor" type="color" value="#ffffff" onchange="render()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="render()">生成</button>
      <button class="btn" onclick="download()">下载 PNG</button>
    </div>

    <canvas id="cover" width="900" height="383" style="width:100%;max-width:900px;border-radius:10px;display:block"></canvas>
  </div>
</div>

<script>
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split('');
  let line = '';
  let lines = [];
  for (const ch of words) {
    const test = line + ch;
    const w = ctx.measureText(test).width;
    if (w > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  lines.forEach((ln, i) => {
    ctx.fillText(ln, x, y + i * lineHeight);
  });
}

function render() {
  const c = document.getElementById('cover');
  const ctx = c.getContext('2d');
  const c1 = document.getElementById('c1').value;
  const c2 = document.getElementById('c2').value;
  const txt = document.getElementById('textColor').value;

  const g = ctx.createLinearGradient(0, 0, c.width, c.height);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, c.height - 160, c.width, 170);

  ctx.fillStyle = txt;
  ctx.textAlign = 'left';

  ctx.font = 'bold 44px "Arial"';
  ctx.textBaseline = 'top';
  wrapText(ctx, document.getElementById('title').value || '标题', 40, 90, 820, 54);

  ctx.font = '24px "Arial"';
  wrapText(ctx, document.getElementById('subtitle').value || '', 40, 300, 820, 32);

  ctx.font = '16px "Arial"';
  ctx.fillText('ToolBox · 在线工具集', 40, 350);
}

function download() {
  const c = document.getElementById('cover');
  c.toBlob(function (blob) {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wechat-cover.png';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

render();
</script>
