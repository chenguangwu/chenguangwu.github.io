<body>

<h1 class="sr-only">EPS 计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 每股收益 (EPS)</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">💹 投资理财</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">每股收益 (EPS)</span>
</nav>
<div class="container">
  <div class="card">
    <h2>EPS = (净利润 − 优先股) / 流通股数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">普通股股东每股享有的盈利。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">EPS = (净利−优先股)/流通股数</div>
      <p class="formula-desc">普通股股东每股享有的盈利。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ni">净利润</label>
        <input type="number" id="ni" value="10000000" step="100000">
      </div>
      <div>
        <label for="pref">优先股股利</label>
        <input type="number" id="pref" value="0" step="100000">
      </div>
      <div>
        <label for="shares">流通股数</label>
        <input type="number" id="shares" value="5000000" step="100000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>净利 1000 万、500 万股 → EPS 2.0。</li>
        <li>优先股优先扣除。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ni=num('ni'),pref=num('pref'),s=num('shares');
            ToolBox.setResult('result', dataGrid([
                [((ni-pref)/s).toFixed(2),'每股收益 EPS']
            ]));
        }
function resetForm(){document.getElementById('ni').value = '10000000';
      document.getElementById('pref').value = '0';
      document.getElementById('shares').value = '5000000';
      calcTool();}
calcTool();
</script>
