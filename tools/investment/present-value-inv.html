<h1 class="sr-only">PV = FV / (1+r)^n</h1>

<div class="container">
  <div class="card">
    <h2>由未来值、贴现率与年数求现值</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入未来值 FV、贴现率 r 与年数 n，求现值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">PV = FV/(1+r)^n</div>
      <p class="formula-desc">输入未来值 FV、贴现率 r 与年数 n，求现值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="FV">未来值 FV (元)</label>
        <input type="number" id="FV" value="21589" step="500">
      </div>
      <div>
        <label for="r">贴现率 r</label>
        <input type="number" id="r" value="0.08" step="0.005">
      </div>
      <div>
        <label for="n">年数 n (年)</label>
        <input type="number" id="n" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>现值为未来现金流按利率贴现。</li>
        <li>21589,8%,10 年 → 10000 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const FV=num('FV'),r=num('r'),n=num('n');
            const PV=FV/Math.pow(1+r,n);
            ToolBox.setResult('result', dataGrid([
                [PV.toFixed(2),'现值 PV (元)']
            ]));
        }
function resetForm(){document.getElementById('FV').value = '21589';
      document.getElementById('r').value = '0.08';
      document.getElementById('n').value = '10';
      calcTool();}
calcTool();
</script>
