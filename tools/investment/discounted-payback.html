<div class="container">
  <div class="card">
    <h2 data-zh="累计折现现金流回正年限">Discounted Payback</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="考虑时间价值的回收期。">Discounted Payback is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">折现回收期 = 累计折现现金流回正年限</div>
      <p class="formula-desc">考虑时间价值的回收期。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="cf0">期初现金流 CF₀</label>
        <input type="number" id="cf0" value="-1000" step="100">
      </div>
      <div>
        <label for="cf1">第1年 CF₁</label>
        <input type="number" id="cf1" value="300" step="50">
      </div>
      <div>
        <label for="cf2">第2年 CF₂</label>
        <input type="number" id="cf2" value="400" step="50">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="cf3">第3年 CF₃</label>
        <input type="number" id="cf3" value="500" step="50">
      </div>
      <div>
        <label for="r">贴现率 r (%)</label>
        <input type="number" id="r" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>折现后回收更慢。</li>
        <li>比静态回收期保守。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const cfs=[num('cf0'),num('cf1'),num('cf2'),num('cf3')];
            const r=num('r')/100; let cum=0, yr=-1;
            for(let i=0;i<cfs.length;i++){cum+=cfs[i]/Math.pow(1+r,i); if(cum>=0 && yr<0){ if(i===0)yr=0; else {const prev=cum-cfs[i]/Math.pow(1+r,i); yr=i-1+(-prev/(cfs[i]/Math.pow(1+r,i)));} } }
            ToolBox.setResult('result', dataGrid([
                [yr>=0?yr.toFixed(2)+' 年':'未回收', '折现回收期']
            ]));
        }
function resetForm(){document.getElementById('cf0').value = '-1000';
      document.getElementById('cf1').value = '300';
      document.getElementById('cf2').value = '400';
      document.getElementById('cf3').value = '500';
      document.getElementById('r').value = '10';
      calcTool();}
calcTool();
</script>
