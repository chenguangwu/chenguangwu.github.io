<div class="container">
  <div class="card">
    <h2>使 NPV = 0 的贴现率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">项目自身现金收益率，二分法数值求解。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">NPV = Σ CF_t/(1+r)^t = 0</div>
      <p class="formula-desc">项目自身现金收益率，二分法数值求解。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="cf0">期初现金流 CF₀</label>
        <input type="number" id="cf0" value="-1000" step="100">
      </div>
      <div>
        <label for="cf1">第1年 CF₁</label>
        <input type="number" id="cf1" value="300" step="50">
      </div>
      <div>
        <label for="cf2">第2年 CF₂</label>
        <input type="number" id="cf2" value="400" step="50">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="cf3">第3年 CF₃</label>
        <input type="number" id="cf3" value="500" step="50">
      </div>
      <div>
        <label for="cf4">第4年 CF₄</label>
        <input type="number" id="cf4" value="200" step="50">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>IRR>要求收益率则可行。</li>
        <li>多正根时取常规解。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
function npv(rate, cfs){let s=0; for(let i=0;i<cfs.length;i++) s+=cfs[i]/Math.pow(1+rate,i); return s;}
function irr(cfs){let lo=-0.99, hi=10;
  for(let k=0;k<200;k++){const mid=(lo+hi)/2; if(npv(mid,cfs)>0) lo=mid; else hi=mid;}
  return (lo+hi)/2;}

            const cfs=[num('cf0'),num('cf1'),num('cf2'),num('cf3'),num('cf4')];
            ToolBox.setResult('result', dataGrid([
                [(irr(cfs)*100).toFixed(2),'内部收益率 IRR (%)']
            ]));
        }
function resetForm(){document.getElementById('cf0').value = '-1000';
      document.getElementById('cf1').value = '300';
      document.getElementById('cf2').value = '400';
      document.getElementById('cf3').value = '500';
      document.getElementById('cf4').value = '200';
      calcTool();}
calcTool();
</script>
