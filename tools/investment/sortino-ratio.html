<div class="container">
  <div class="card">
    <h2>Sortino = (Rp − Rf) / σd</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">仅用下行波动衡量风险调整收益。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Sortino = (Rp−Rf)/σd</div>
      <p class="formula-desc">仅用下行波动衡量风险调整收益。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rp">组合收益率 (%)</label>
        <input type="number" id="rp" value="15" step="0.5">
      </div>
      <div>
        <label for="rf">无风险利率 (%)</label>
        <input type="number" id="rf" value="3" step="0.5">
      </div>
      <div>
        <label for="dd">下行标准差 (%)</label>
        <input type="number" id="dd" value="6" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>比夏普更看重下行风险。</li>
        <li>分母用下行标准差。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rp=num('rp'),rf=num('rf'),dd=num('dd');
            ToolBox.setResult('result', dataGrid([
                [((rp-rf)/dd).toFixed(3),'索提诺比率']
            ]));
        }
function resetForm(){document.getElementById('rp').value = '15';
      document.getElementById('rf').value = '3';
      document.getElementById('dd').value = '6';
      calcTool();}
calcTool();
</script>
