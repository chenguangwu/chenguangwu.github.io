<h1 class="sr-only">组合预期收益计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 组合预期收益</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">组合预期收益</span>
</nav>
<div class="container">
  <div class="card">
    <h2>E(Rp) = Σ wᵢ·Rᵢ</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按权重加总的组合期望收益。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E(Rp) = Σ w_i·R_i</div>
      <p class="formula-desc">按权重加总的组合期望收益。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="w1">资产1权重 (%)</label>
        <input type="number" id="w1" value="60" step="5">
      </div>
      <div>
        <label for="r1">资产1收益 (%)</label>
        <input type="number" id="r1" value="12" step="0.5">
      </div>
      <div>
        <label for="w2">资产2权重 (%)</label>
        <input type="number" id="w2" value="40" step="5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="r2">资产2收益 (%)</label>
        <input type="number" id="r2" value="8" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>60%×12%+40%×8% = 10.4%。</li>
        <li>权重应合计 100%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const w1=num('w1')/100,w2=num('w2')/100,r1=num('r1'),r2=num('r2');
            const rp=w1*r1+w2*r2;
            ToolBox.setResult('result', dataGrid([
                [rp.toFixed(2),'组合预期收益 (%)'],
                [(w1+w2).toFixed(2),'权重合计']
            ]));
        }
function resetForm(){document.getElementById('w1').value = '60';
      document.getElementById('r1').value = '12';
      document.getElementById('w2').value = '40';
      document.getElementById('r2').value = '8';
      calcTool();}
calcTool();
</script>
