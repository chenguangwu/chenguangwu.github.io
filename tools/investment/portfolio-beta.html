<div class="container">
  <div class="card">
    <h2>由两资产权重与 β 求组合 β</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两资产权重 w₁、w₂ 与 β₁、β₂（w₁+w₂=1），求组合 β。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">βp = Σ w_i·β_i</div>
      <p class="formula-desc">输入两资产权重 w₁、w₂ 与 β₁、β₂（w₁+w₂=1），求组合 β。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="w1">权重 w₁</label>
        <input type="number" id="w1" value="0.5" step="0.05">
      </div>
      <div>
        <label for="b1">β₁</label>
        <input type="number" id="b1" value="1.0" step="0.1">
      </div>
      <div>
        <label for="w2">权重 w₂</label>
        <input type="number" id="w2" value="0.5" step="0.05">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="b2">β₂</label>
        <input type="number" id="b2" value="1.4" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>组合 β 为加权平均。</li>
        <li>0.5×1.0+0.5×1.4 → 1.2。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const w1=num('w1'),b1=num('b1'),w2=num('w2'),b2=num('b2');
            const bp=w1*b1+w2*b2;
            ToolBox.setResult('result', dataGrid([
                [bp.toFixed(3),'组合 β_p']
            ]));
        }
function resetForm(){document.getElementById('w1').value = '0.5';
      document.getElementById('b1').value = '1.0';
      document.getElementById('w2').value = '0.5';
      document.getElementById('b2').value = '1.4';
      calcTool();}
calcTool();
</script>
