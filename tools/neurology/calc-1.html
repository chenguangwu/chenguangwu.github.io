<body>
<h1 class="sr-only">NIHSS 脑卒中评分</h1>

</div>
<div class="container">
  <div class="card">
    <h2 data-zh="🧠 NIHSS 脑卒中评分">🧠 NIHSS Stroke Scale</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="美国国立卫生研究院卒中量表（NIHSS），用于量化急性脑卒中神经功能缺损程度。">National Institutes of Health Stroke Scale (NIHSS) score.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：NIHSS 脑卒中评分 - 美国国立卫生研究院卒中量表（NIHSS）。</p>
</div>


    <div id="items"></div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算总分</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_nihss';
const items = [
  {id:'loc', label:'1a. 意识水平', opts:[{v:0,t:'0 清醒'},{v:1,t:'1 嗜睡（可唤醒）'},{v:2,t:'2 昏睡/反应迟钝'},{v:3,t:'3 昏迷'}]},
  {id:'locq', label:'1b. 意识水平提问（月份、年龄）', opts:[{v:0,t:'0 两项均正确'},{v:1,t:'1 一项正确'},{v:2,t:'2 两项均不正确'}]},
  {id:'locc', label:'1c. 意识水平指令（睁眼/闭眼、握/松拳）', opts:[{v:0,t:'0 两项均正确'},{v:1,t:'1 一项正确'},{v:2,t:'2 两项均不正确'}]},
  {id:'gaze', label:'2. 最佳凝视', opts:[{v:0,t:'0 正常'},{v:1,t:'1 部分凝视麻痹'},{v:2,t:'2 完全凝视麻痹'}]},
  {id:'visual', label:'3. 视野', opts:[{v:0,t:'0 无缺损'},{v:1,t:'1 部分偏盲'},{v:2,t:'2 完全偏盲'},{v:3,t:'3 双侧偏盲/全盲'}]},
  {id:'facial', label:'4. 面瘫', opts:[{v:0,t:'0 正常'},{v:1,t:'1 轻微'},{v:2,t:'2 部分'},{v:3,t:'3 完全'}]},
  {id:'armL', label:'5a. 左侧上肢运动', opts:[{v:0,t:'0 无下落'},{v:1,t:'1 漂移'},{v:2,t:'2 部分抗重力'},{v:3,t:'3 不能抗重力'},{v:4,t:'4 不能动'}]},
  {id:'armR', label:'5b. 右侧上肢运动', opts:[{v:0,t:'0 无下落'},{v:1,t:'1 漂移'},{v:2,t:'2 部分抗重力'},{v:3,t:'3 不能抗重力'},{v:4,t:'4 不能动'}]},
  {id:'legL', label:'6a. 左侧下肢运动', opts:[{v:0,t:'0 无下落'},{v:1,t:'1 漂移'},{v:2,t:'2 部分抗重力'},{v:3,t:'3 不能抗重力'},{v:4,t:'4 不能动'}]},
  {id:'legR', label:'6b. 右侧下肢运动', opts:[{v:0,t:'0 无下落'},{v:1,t:'1 漂移'},{v:2,t:'2 部分抗重力'},{v:3,t:'3 不能抗重力'},{v:4,t:'4 不能动'}]},
  {id:'ataxia', label:'7. 肢体共济失调', opts:[{v:0,t:'0 无'},{v:1,t:'1 一个肢体'},{v:2,t:'2 两个肢体'}]},
  {id:'sensory', label:'8. 感觉', opts:[{v:0,t:'0 正常'},{v:1,t:'1 轻-中度减退'},{v:2,t:'2 严重-完全减退'}]},
  {id:'language', label:'9. 最佳语言', opts:[{v:0,t:'0 无失语'},{v:1,t:'1 轻-中度失语'},{v:2,t:'2 重度失语'},{v:3,t:'3 哑/完全失语'}]},
  {id:'dysarthria', label:'10. 构音障碍', opts:[{v:0,t:'0 正常'},{v:1,t:'1 轻-中度'},{v:2,t:'2 重度'}]},
  {id:'neglect', label:'11. 忽视/失认', opts:[{v:0,t:'0 无'},{v:1,t:'1 忽视一种感觉模式'},{v:2,t:'2 严重偏侧忽视'}]}
];

function renderItems(){
  const container = document.getElementById('items');
  container.innerHTML = items.map(it => `
    <div class="nihss-item">
      <label for="${it.id}">${it.label}</label>
      <select id="${it.id}" onchange="calc()">
        ${it.opts.map(o => `<option value="${o.v}">${o.t}</option>`).join('')}
      </select>
    </div>
  `).join('');
}

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    items.forEach(it => {
      const el = document.getElementById(it.id);
      if(el && s[it.id] != null) el.value = s[it.id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {};
    items.forEach(it => { s[it.id] = document.getElementById(it.id).value; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function classify(score){
  if(score === 0) return {level:'无卒中症状', cls:'grade-excellent'};
  if(score <= 4) return {level:'轻度卒中', cls:'grade-good'};
  if(score <= 15) return {level:'中度卒中', cls:'grade-pass'};
  if(score <= 20) return {level:'中-重度卒中', cls:'grade-pass'};
  return {level:'重度卒中', cls:'grade-fail'};
}

function calc(){
  let score = 0;
  items.forEach(it => {
    const v = parseInt(document.getElementById(it.id).value, 10);
    score += isNaN(v) ? 0 : v;
  });
  const c = classify(score);
  saveState();
  document.getElementById('result').innerHTML = `
    <p>NIHSS 总分：<strong style="font-size:20px;">${score}</strong> 分（0-42 分）</p>
    <p>严重程度：<span class="grade-tag ${c.cls}">${c.level}</span></p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：NIHSS 需由经过培训的医务人员规范评估；评分越高通常提示神经功能缺损越重。
    </div>
  `;
}

function resetForm(){
  items.forEach(it => { document.getElementById(it.id).value = '0'; });
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { renderItems(); loadState(); calc(); });
</script>
</body>
