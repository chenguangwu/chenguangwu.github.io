  <a href="../../guides/calc-1-guide.html">📖 查看「增值税计算使用指南」</a>
</div>
<div class="container">
  <div class="card">
    <h2>💧 每日饮水量建议</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据体重、运动时长与环境，估算每日建议饮水量。</p>

    <div class="input-row">
      <div>
        <label>体重（kg）</label>
        <input type="number" id="weight" value="65" min="1" max="300" step="0.1">
      </div>
      <div>
        <label>每日运动时长（分钟）</label>
        <input type="number" id="exercise" value="30" min="0" max="600">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>气候/环境</label>
        <select id="climate">
          <option value="normal">温和</option>
          <option value="hot">炎热/多汗</option>
          <option value="dry">干燥/空调房</option>
          <option value="cold">寒冷</option>
        </select>
      </div>
      <div>
        <label>基础系数（ml/kg）</label>
        <input type="number" id="baseFactor" value="30" min="20" max="50" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">计算建议饮水量</button>
      <button class="btn" onclick="saveInputs()">保存数据</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>输入数据后点击计算。</p>
    </div>

    <div class="tip-box tip-info">
      建议少量多次饮水，运动后每流失 1kg 体重可补充约 1.5L 水分。尿液呈淡黄色通常表示水分充足。
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_health_calc1';

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.weight) document.getElementById('weight').value = data.weight;
    if (data.exercise != null) document.getElementById('exercise').value = data.exercise;
    if (data.climate) document.getElementById('climate').value = data.climate;
    if (data.baseFactor) document.getElementById('baseFactor').value = data.baseFactor;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      weight: document.getElementById('weight').value,
      exercise: document.getElementById('exercise').value,
      climate: document.getElementById('climate').value,
      baseFactor: document.getElementById('baseFactor').value
    }));
    ToolBox.showToast(i18nText());
  } catch (e) {
    ToolBox.showToast(i18nText(), 'error');
  }
}

function calculate() {
  const weight = parseFloat(document.getElementById('weight').value) || 0;
  const exercise = parseFloat(document.getElementById('exercise').value) || 0;
  const climate = document.getElementById('climate').value;
  const baseFactor = parseFloat(document.getElementById('baseFactor').value) || 30;

  if (weight <= 0) {
    ToolBox.showToast(i18nText('toast.msg810'), 'error');
    return;
  }

  let water = weight * baseFactor;
  water += Math.floor(exercise / 30) * 250;

  if (climate === 'hot') water += 500;
  if (climate === 'dry') water += 300;
  if (climate === 'cold') water -= 200;

  const cups = water / 250;

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:40px;font-weight:700;color:var(--primary);">${Math.round(water)}</div>
      <div style="font-size:14px;color:var(--text-muted);">ml / 天</div>
    </div>
    <p>约 ${cups.toFixed(1)} 杯（每杯 250ml）</p>
    <p>基础需求：${Math.round(weight * baseFactor)} ml · 运动补充：${Math.floor(exercise / 30) * 250} ml · 环境调整：${climate === 'hot' ? '+500' : climate === 'dry' ? '+300' : climate === 'cold' ? '-200' : '0'} ml</p>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('输入数据后')) {
    ToolBox.showToast(i18nText('toast.msg673'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadInputs();
calculate();
</script>
</body>
