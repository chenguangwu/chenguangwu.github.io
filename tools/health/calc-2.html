<body>
<h1 class="sr-only">睡眠质量评分</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 睡眠质量评分</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">睡眠质量评分</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="😴 睡眠质量评分">😴 Sleep Quality Score</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="根据睡眠时长、入睡时间、夜间觉醒与日间状态，评估睡眠质量。">Assess sleep quality from duration and disruptions.</p>
    <div class="tip-box tip-warn">
      ⚠️ 本工具用于睡眠状况自测与健康管理参考，不是诊断工具，不能替代医师评估。出现持续失眠、强烈日间困倦或明显功能受损请及时就医。
    </div>

    <div class="input-row">
      <div>
        <label>昨晚睡眠时长（小时）</label>
        <input type="number" id="duration" value="7" min="0" max="16" step="0.5">
      </div>
      <div>
        <label>入睡所需时间（分钟）</label>
        <select id="latency">
          <option value="20">小于 10 分钟</option>
          <option value="15">10 - 20 分钟</option>
          <option value="10" selected>20 - 30 分钟</option>
          <option value="5">30 - 60 分钟</option>
          <option value="0">超过 60 分钟</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>夜间醒来次数</label>
        <select id="wakings">
          <option value="20">0 次</option>
          <option value="15">1 次</option>
          <option value="10" selected>2 次</option>
          <option value="5">3 次</option>
          <option value="0">4 次及以上</option>
        </select>
      </div>
      <div>
        <label>睡眠深度感受</label>
        <select id="depth">
          <option value="20">很深，醒来精神饱满</option>
          <option value="15" selected>较深，偶尔浅眠</option>
          <option value="10">一般，有时清醒</option>
          <option value="5">较浅，易醒</option>
          <option value="0">很浅，几乎没睡着</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>日间精神状态</label>
        <select id="alertness">
          <option value="20">非常清醒，精力充沛</option>
          <option value="15" selected>基本清醒，偶有困倦</option>
          <option value="10">有些疲倦</option>
          <option value="5">明显疲劳，影响工作</option>
          <option value="0">极度困倦，难以集中注意力</option>
        </select>
      </div>
      <div>
        <label>是否有打鼾/呼吸暂停</label>
        <select id="breathing">
          <option value="0" selected>否</option>
          <option value="-10">偶尔</option>
          <option value="-20">经常</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">评分</button>
      <button class="btn" onclick="saveInputs()">保存</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>回答上述问题后点击评分。</p>
    </div>

    <div class="ref-card">
      <h4>改善睡眠小贴士</h4>
      <ul>
        <li>保持规律作息，每天同一时间起床。</li>
        <li>睡前 1 小时减少屏幕蓝光刺激。</li>
        <li>避免睡前大量进食、饮酒或咖啡因。</li>
        <li>卧室保持黑暗、凉爽与安静。</li>
      </ul>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_health_calc2';

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.duration) document.getElementById('duration').value = data.duration;
    if (data.latency) document.getElementById('latency').value = data.latency;
    if (data.wakings) document.getElementById('wakings').value = data.wakings;
    if (data.depth) document.getElementById('depth').value = data.depth;
    if (data.alertness) document.getElementById('alertness').value = data.alertness;
    if (data.breathing) document.getElementById('breathing').value = data.breathing;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      duration: document.getElementById('duration').value,
      latency: document.getElementById('latency').value,
      wakings: document.getElementById('wakings').value,
      depth: document.getElementById('depth').value,
      alertness: document.getElementById('alertness').value,
      breathing: document.getElementById('breathing').value
    }));
    ToolBox.showToast(i18nText());
  } catch (e) {
    ToolBox.showToast(i18nText(), 'error');
  }
}

function calculate() {
  const duration = parseFloat(document.getElementById('duration').value) || 0;
  let durationScore;
  if (duration >= 7 && duration <= 9) durationScore = 20;
  else if (duration >= 6) durationScore = 15;
  else if (duration >= 5) durationScore = 8;
  else durationScore = 0;

  const latency = parseInt(document.getElementById('latency').value) || 0;
  const wakings = parseInt(document.getElementById('wakings').value) || 0;
  const depth = parseInt(document.getElementById('depth').value) || 0;
  const alertness = parseInt(document.getElementById('alertness').value) || 0;
  const breathing = parseInt(document.getElementById('breathing').value) || 0;

  const total = durationScore + latency + wakings + depth + alertness + breathing;
  const score = Math.max(0, Math.min(100, total));

  let grade, cls, tip;
  if (score >= 85) { grade = '优秀'; cls = 'grade-excellent'; tip = '睡眠质量很棒，请保持！'; }
  else if (score >= 70) { grade = '良好'; cls = 'grade-good'; tip = '整体不错，可继续优化作息。'; }
  else if (score >= 50) { grade = '一般'; cls = 'grade-pass'; tip = '关注睡眠习惯，减少睡前刺激。'; }
  else { grade = '较差'; cls = 'grade-fail'; tip = '建议调整作息，必要时咨询医生。'; }

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:40px;font-weight:700;color:var(--primary);">${score}</div>
      <span class="grade-tag ${cls}">${grade}</span>
    </div>
    <p>睡眠时长 ${score === 20 ? 20 : durationScore} 分 · 入睡 ${latency} 分 · 夜醒 ${wakings} 分 · 深度 ${depth} 分 · 日间 ${alertness} 分${breathing ? ' · 呼吸问题 ' + breathing + ' 分' : ''}</p>
    <p>${tip}</p>
    <div class="progress-bar"><div class="progress-fill" style="width:${score}%"></div></div>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('回答上述问题')) {
    ToolBox.showToast(i18nText('toast.msg677'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadInputs();
calculate();
</script>
</body>
