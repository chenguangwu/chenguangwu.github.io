<body>
<h1 class="sr-only">屏幕使用时间评估</h1>

  <a href="../../index.html">← ToolBox</a>
  <span>/ 屏幕使用时间评估</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

  <span class="bc-sep">‹</span>
  <span class="bc-current">屏幕使用时间评估</span>
</nav>
<div class="container">
  <div class="card">
    <h2>📱 屏幕使用时间评估</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">估算每日各设备屏幕使用时间，评估是否超标并获取健康建议。</p>
    <div class="tip-box tip-warn">
      ⚠️ 本工具仅用于生活方式管理参考，不替代临床诊疗。长期头晕、视物模糊、颈肩疼痛或焦虑失眠，请咨询眼科/神经科或心理支持。
    </div>

    <div class="input-row">
      <div>
        <label>手机（小时/天）</label>
        <input type="number" id="phone" value="3" min="0" max="24" step="0.5">
      </div>
      <div>
        <label>电脑/笔记本（小时/天）</label>
        <input type="number" id="computer" value="6" min="0" max="24" step="0.5">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>电视（小时/天）</label>
        <input type="number" id="tv" value="1" min="0" max="24" step="0.5">
      </div>
      <div>
        <label>平板/其他（小时/天）</label>
        <input type="number" id="tablet" value="0.5" min="0" max="24" step="0.5">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>使用人群</label>
        <select id="group">
          <option value="adult" selected>成人（18-64岁）</option>
          <option value="teen">青少年（13-17岁）</option>
          <option value="child">儿童（6-12岁）</option>
          <option value="senior">老年人（65岁+）</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calculate()">评估</button>
      <button class="btn" onclick="saveInputs()">保存</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="result-box" id="result">
      <p>输入各设备使用时间后点击评估。</p>
    </div>

    <div class="ref-card">
      <h4>健康建议</h4>
      <ul>
        <li>遵循 20-20-20 法则：每 20 分钟看 20 英尺（约 6 米）外 20 秒。</li>
        <li>睡前 1 小时减少屏幕使用，避免蓝光影响褪黑素分泌。</li>
        <li>保持屏幕与眼睛至少 50-70cm 距离。</li>
      </ul>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_health_calc3';

const LIMITS = {
  adult: { rec: 2, max: 8 },
  teen: { rec: 2, max: 4 },
  child: { rec: 1, max: 2 },
  senior: { rec: 2, max: 6 }
};

function loadInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.phone != null) document.getElementById('phone').value = data.phone;
    if (data.computer != null) document.getElementById('computer').value = data.computer;
    if (data.tv != null) document.getElementById('tv').value = data.tv;
    if (data.tablet != null) document.getElementById('tablet').value = data.tablet;
    if (data.group) document.getElementById('group').value = data.group;
  } catch (e) {}
}

function saveInputs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      phone: document.getElementById('phone').value,
      computer: document.getElementById('computer').value,
      tv: document.getElementById('tv').value,
      tablet: document.getElementById('tablet').value,
      group: document.getElementById('group').value
    }));
    ToolBox.showToast(i18nText());
  } catch (e) {
    ToolBox.showToast(i18nText(), 'error');
  }
}

function calculate() {
  const phone = parseFloat(document.getElementById('phone').value) || 0;
  const computer = parseFloat(document.getElementById('computer').value) || 0;
  const tv = parseFloat(document.getElementById('tv').value) || 0;
  const tablet = parseFloat(document.getElementById('tablet').value) || 0;
  const group = document.getElementById('group').value;
  const total = phone + computer + tv + tablet;

  const limit = LIMITS[group];
  let grade, cls, tip;
  if (total <= limit.rec) {
    grade = '控制良好';
    cls = 'grade-excellent';
    tip = '屏幕使用时间处于推荐范围内，继续保持！';
  } else if (total <= limit.max) {
    grade = '略偏高';
    cls = 'grade-pass';
    tip = '超过娱乐屏幕时间建议，注意适时休息眼睛。';
  } else {
    grade = '明显超标';
    cls = 'grade-fail';
    tip = '屏幕使用时间过长，建议减少非必要使用并增加户外活动。';
  }

  const workScreen = computer;
  const leisureScreen = phone + tv + tablet;

  document.getElementById('result').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div style="font-size:40px;font-weight:700;color:var(--primary);">${total.toFixed(1)}h</div>
      <span class="grade-tag ${cls}">${grade}</span>
    </div>
    <p>工作/学习屏幕：${workScreen.toFixed(1)} h · 娱乐屏幕：${leisureScreen.toFixed(1)} h</p>
    <p>${tip}</p>
    <p>该人群娱乐屏幕建议：≤ ${limit.rec} h / 天，上限：≤ ${limit.max} h / 天</p>
    <div class="bar-row">
      <span class="bar-lbl">手机</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(phone / total * 100, 100)}%">${phone.toFixed(1)}h</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">电脑</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(computer / total * 100, 100)}%">${computer.toFixed(1)}h</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">电视</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(tv / total * 100, 100)}%">${tv.toFixed(1)}h</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">平板</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(tablet / total * 100, 100)}%">${tablet.toFixed(1)}h</div></div>
    </div>
  `;
  saveInputs();
}

function copyResult() {
  const text = document.getElementById('result').innerText.trim();
  if (!text || text.includes('输入各设备')) {
    ToolBox.showToast(i18nText('toast.msg676'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

loadInputs();
calculate();
</script>
</body>
