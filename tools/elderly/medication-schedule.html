<div class="container">
  <div class="card">
    <h2>💊 用药间隔提醒表</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入用药方案后生成日程，可打印/导出，辅助长期提醒（本地生成，不上传）。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：用药间隔提醒表。</p>
</div>


    <div class="input-row">
      <div><label>开始日期</label><input id="startDate" type="date" oninput="render()"></div>
      <div><label>观察天数</label><input id="days" type="number" min="1" max="30" value="3" oninput="render()"></div>
      <div><label>每次剂量说明</label><input id="notes" type="text" value="每次" disabled></div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="addMed()">新增药物</button>
      <button class="btn" onclick="render()">生成日程</button>
      <button class="btn" onclick="exportText()">导出文本</button>
    </div>

    <div id="meds"></div>
    <div id="result" class="result-box" style="margin-top:12px;"></div>
  </div>
</div>

<script>
const list = [
  { name: '降压药', dose: '1片', interval: 8, first: '08:00' },
  { name: '降糖药', dose: '2片', interval: 12, first: '07:30' }
];

function addMed() {
  list.push({ name: '新药', dose: '1片', interval: 24, first: '08:00' });
  renderInputs();
  render();
}

function removeMed(i) { list.splice(i, 1); renderInputs(); render(); }

function renderInputs() {
  const box = document.getElementById('meds');
  box.innerHTML = '';
  list.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'input-row';
    row.style.marginBottom='10px';
    row.innerHTML =
      '<div><label>药名</label><input data-i="' + i + '" data-k="name" value="' + m.name + '" oninput="bind(this)"></div>' +
      '<div><label>剂量</label><input data-i="' + i + '" data-k="dose" value="' + m.dose + '" oninput="bind(this)"></div>' +
      '<div><label>间隔（小时）</label><input data-i="' + i + '" data-k="interval" type="number" min="1" max="24" value="' + m.interval + '" oninput="bind(this)"></div>' +
      '<div><label>首剂时间</label><input data-i="' + i + '" data-k="first" type="time" value="' + m.first + '" oninput="bind(this)"></div>' +
      '<div style="display:flex;align-items:end"><button class="btn" type="button" onclick="removeMed(' + i + ')">删除</button></div>';
    box.appendChild(row);
  });
}

function bind(el) {
  const i = Number(el.dataset.i);
  const k = el.dataset.k;
  if (k === 'interval') list[i][k] = Number(el.value) || 24;
  else if (k === 'first') list[i][k] = el.value;
  else list[i][k] = el.value;
  render();
}

function nextTimes(first, interval, days) {
  const base = new Date(`2000-01-01T${first}:00`);
  const count = Math.max(1, Math.ceil((24 * days) / interval));
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = new Date(base.getTime() + i * interval * 3600 * 1000);
    out.push(t.toTimeString().slice(0,5));
  }
  return out;
}

function render() {
  const days = Number(document.getElementById('days').value) || 1;
  const start = document.getElementById('startDate').value || new Date().toISOString().slice(0,10);
  let html = '<h3>日程预览</h3><div class="result-box">';

  for (let d = 0; d < days; d++) {
    const date = new Date(start);
    date.setDate(date.getDate() + d);
    const label = date.toISOString().slice(0, 10);
    html += '<p><strong>' + label + '</strong></p><ul>';
    list.forEach(m => {
      if (!m.name) return;
      const arr = nextTimes(m.first, m.interval, 1);
      arr.forEach(tm => {
        html += '<li>' + m.name + '（' + m.dose + '）：' + tm + '</li>';
      });
    });
    html += '</ul>';
  }
  html += '</div>';
  document.getElementById('result').innerHTML = html;
}

function exportText() {
  const txt = document.getElementById('result').innerText || '';
  ToolBox.copyText(txt, i18nText('msg369'));
}

renderInputs();
render();
</script>
