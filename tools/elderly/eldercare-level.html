    <h2 data-zh="🏠 养老护理等级速查">🏠 Eldercare Level Reference</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按日常照护能力自评，给出建议照护等级（仅参考）。">Find care level classifications and guidance at a glance.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本速查内容依据权威标准与公开资料整理，供快速查阅参考；具体数值以官方最新发布为准。 工具名称：养老护理等级速查。</p>
</div>


    <div id="areas"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">生成建议</button>
      <button class="btn" onclick="copyResult()">复制建议</button>
    </div>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
const AREA = [
  '进食/饮水协助',
  '进浴/洗漱',
  '行走/转移',
  '如厕照护',
  '穿衣/整理',
  '活动/外出',
  '服药管理'
];

function render() {
  const a = document.getElementById('areas');
  a.innerHTML = '';
  AREA.forEach((t, i) => {
    const row = document.createElement('div');
    row.style.marginBottom='10px';
    row.innerHTML =
      '<label>' + (i + 1) + '. ' + t + '</label>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">' +
      '<label><input type="radio" name="a' + i + '" value="0" checked> 独立</label>' +
      '<label><input type="radio" name="a' + i + '" value="1"> 轻度帮助</label>' +
      '<label><input type="radio" name="a' + i + '" value="2"> 完全依赖</label>' +
      '</div>';
    a.appendChild(row);
  });
}

function calc() {
  let score = 0;
  AREA.forEach((_, i) => {
    const v = document.querySelector('input[name="a' + i + '"]:checked').value;
    score += Number(v);
  });

  let level = '一级（轻度）';
  let care = '日常自理能力基本完整，建议日常巡检。';
  let color = 'var(--success)';

  if (score >= 7 && score <= 9) {
    level = '二级（中度）';
    care = '需日常部分照护，如洗漱/就餐提醒、短时陪护。';
    color = 'var(--primary)';
  } else if (score >= 10) {
    level = '三级（重度）';
    care = '需高频照护，建议专业护理人员介入并评估康复计划。';
    color = 'var(--warning, #f59e0b)';
  }

  document.getElementById('result').innerHTML =
    '<p>总分：<strong>' + score + '</strong></p>' +
    '<p>建议等级：<strong style="color:' + color + ';">' + level + '</strong></p>' +
    '<p>照护建议：' + care + '</p>' +
    '<p>提醒：该结果不替代医生或国家评估标准，仅用于家庭自查。</p>';
}

function copyResult() {
  ToolBox.copyText(document.getElementById('result').innerText, i18nText('msg294'));
}

render();
</script>
