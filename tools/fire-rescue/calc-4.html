<h1 class='sr-only'>灭火器配置计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 灭火器配置计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2 data-zh="🧯 灭火器配置计算（应急救援）">🧯 Fire Extinguisher Layout Calculator</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc" data-zh="本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：灭火器配置计算（应急救援）。">Plan fire extinguisher placement for emergency response.</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据保护面积、火灾类型和危险等级，按常用设计参数估算灭火器的配置数量。</p>
    <div class='input-row'>
      <div>
        <label for='area'>保护面积（m²）</label>
        <input type='number' id='area' value='300' min='0.1' step='1'>
      </div>
      <div>
        <label for='fireClass'>火灾类型</label>
        <select id='fireClass'>
          <option value='A' selected>A 类（固体可燃物）</option>
          <option value='B'>B 类（液体/可熔化固体）</option>
          <option value='C'>C 类（气体/带电设备）</option>
        </select>
      </div>
      <div>
        <label for='level'>危险等级</label>
        <select id='level'>
          <option value='light' selected>轻危险级</option>
          <option value='medium'>中危险级</option>
          <option value='severe'>严重危险级</option>
        </select>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>参考值基于常见设计经验：A 类轻/中/严重危险级分别按 100/75/50 m²/具；B 类分别按 1.5/1.0/0.5 m²/具估算。每个设置点不宜少于 2 具。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_extinguisher';
  const coverage = {
    A: {light:100, medium:75, severe:50},
    B: {light:1.5, medium:1.0, severe:0.5},
    C: {light:100, medium:75, severe:50}
  };
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const area = get('area');
    const fc = ToolBox.$('fireClass').value;
    const lvl = ToolBox.$('level').value;
    const el = ToolBox.$('result');
    if(area <= 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效面积。</p>';
      return;
    }
    const perUnit = coverage[fc][lvl];
    const count = Math.ceil(area / perUnit);
    const points = Math.ceil(count / 2);
    el.innerHTML =
      '<p>单具保护面积：<strong>' + perUnit + '</strong> m²/具</p>' +
      '<p>估算灭火器总数：<strong>' + count + '</strong> 具</p>' +
      '<p>按每处 2 具布置，约需 <strong>' + points + '</strong> 个设置点</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        area: ToolBox.$('area').value,
        fireClass: ToolBox.$('fireClass').value,
        level: ToolBox.$('level').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.area) ToolBox.$('area').value = data.area;
      if(data.fireClass) ToolBox.$('fireClass').value = data.fireClass;
      if(data.level) ToolBox.$('level').value = data.level;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['area','fireClass','level'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 200));
      ToolBox.$(id).addEventListener('change', calculate);
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
