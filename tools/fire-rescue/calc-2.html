<h1 class='sr-only'>火灾荷载计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 火灾荷载计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🔥 火灾荷载计算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：火灾荷载计算 - 消防救援在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据可燃物质量、燃烧热值与房间面积，计算火灾荷载密度并评估火灾严重程度等级。</p>
    <div class='input-row'>
      <div>
        <label for='mass'>可燃物总质量（kg）</label>
        <input type='number' id='mass' value='500' min='0' step='1'>
      </div>
      <div>
        <label for='hv'>燃烧热值（MJ/kg）</label>
        <input type='number' id='hv' value='20' min='0.1' step='0.1'>
      </div>
      <div>
        <label for='area'>房间面积（m²）</label>
        <input type='number' id='area' value='100' min='0.1' step='0.1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>火灾荷载密度分级参考：低 ≤ 300 MJ/m²，中等 300~1200 MJ/m²，高 ＞ 1200 MJ/m²。结果仅供参考。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_fire_load';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const mass = get('mass');
    const hv = get('hv');
    const area = get('area');
    const el = ToolBox.$('result');
    if(mass < 0 || hv <= 0 || area <= 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>';
      return;
    }
    const total = mass * hv;
    const density = total / area;
    const woodEquiv = density / 18; // 木材约 18 MJ/kg
    let level = '';
    if(density <= 300) level = '低';
    else if(density <= 1200) level = '中等';
    else level = '高';
    el.innerHTML =
      '<p>总热值：<strong>' + ToolBox.formatNumber(total, 1) + '</strong> MJ</p>' +
      '<p>火灾荷载密度：<strong>' + ToolBox.formatNumber(density, 1) + '</strong> MJ/m²</p>' +
      '<p>等效木材荷载：<strong>' + ToolBox.formatNumber(woodEquiv, 1) + '</strong> kg/m²</p>' +
      '<p>火灾严重程度等级：<strong>' + level + '</strong></p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        mass: ToolBox.$('mass').value,
        hv: ToolBox.$('hv').value,
        area: ToolBox.$('area').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.mass) ToolBox.$('mass').value = data.mass;
      if(data.hv) ToolBox.$('hv').value = data.hv;
      if(data.area) ToolBox.$('area').value = data.area;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['mass','hv','area'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
