<h1 class='sr-only'>疏散时间计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 疏散时间计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🚨 疏散时间计算</h2>
    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>按人员流动模型，根据疏散人数、出口宽度、通行能力、行走速度和距离，估算行走时间与通过时间。</p>
    <div class='input-row'>
      <div><label for='people'>疏散人数</label><input type='number' id='people' value='200' min='1' step='1'></div>
      <div><label for='width'>出口有效宽度（m）</label><input type='number' id='width' value='1.4' min='0.1' step='0.1'></div>
    </div>
    <div class='input-row'>
      <div><label for='flow'>通行能力（人/(m·s)）</label><input type='number' id='flow' value='1.3' min='0.1' step='0.1'></div>
      <div><label for='speed'>行走速度（m/s）</label><input type='number' id='speed' value='1.2' min='0.1' step='0.1'></div>
      <div><label for='distance'>行走距离（m）</label><input type='number' id='distance' value='50' min='0' step='1'></div>
    </div>
    <div class='input-row'>
      <div><label for='preTime'>预动作时间（s，可选）</label><input type='number' id='preTime' value='60' min='0' step='1' placeholder='探测+反应时间'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>通行能力参考：普通疏散门 1.3~1.5 人/(m·s)；楼梯 0.9~1.1 人/(m·s)。预动作时间包含探测、报警与人员反应。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_evac_time';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const people = get('people');
    const width = get('width');
    const flow = get('flow');
    const speed = get('speed');
    const distance = get('distance');
    const pre = get('preTime');
    const el = ToolBox.$('result');
    if(people <= 0 || width <= 0 || flow <= 0 || speed <= 0 || distance < 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>';
      return;
    }
    const tWalk = distance / speed;
    const tPass = people / (flow * width);
    const tTotal = tWalk + tPass;
    const rset = tTotal + pre;
    el.innerHTML =
      '<p>行走时间：<strong>' + ToolBox.formatNumber(tWalk, 1) + '</strong> s</p>' +
      '<p>出口通过时间：<strong>' + ToolBox.formatNumber(tPass, 1) + '</strong> s</p>' +
      '<p>运动时间：<strong>' + ToolBox.formatNumber(tTotal, 1) + '</strong> s（约 ' + ToolBox.formatNumber(tTotal/60, 2) + ' 分钟）</p>' +
      '<p>所需安全疏散时间 RSET：<strong>' + ToolBox.formatNumber(rset, 1) + '</strong> s</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        people: ToolBox.$('people').value,
        width: ToolBox.$('width').value,
        flow: ToolBox.$('flow').value,
        speed: ToolBox.$('speed').value,
        distance: ToolBox.$('distance').value,
        pre: ToolBox.$('preTime').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      ['people','width','flow','speed','distance','preTime'].forEach(function(id){
        if(data[id] !== undefined) ToolBox.$(id).value = data[id];
      });
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['people','width','flow','speed','distance','preTime'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
