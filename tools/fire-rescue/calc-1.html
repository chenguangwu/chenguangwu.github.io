<h1 class='sr-only'>消防水枪充实水柱计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 消防水枪充实水柱计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🚒 消防水枪充实水柱计算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：消防水枪充实水柱计算。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据喷嘴压力、有效系数与喷射角度，估算充实水柱长度、水平有效射程和喷嘴出口流速。</p>
    <div class='input-row'>
      <div>
        <label for='pressure'>喷嘴压力（MPa）</label>
        <input type='number' id='pressure' value='0.3' min='0.01' step='0.01'>
      </div>
      <div>
        <label for='coeff'>有效系数</label>
        <input type='number' id='coeff' value='0.75' min='0.1' max='1' step='0.01'>
      </div>
      <div>
        <label for='angle'>喷射仰角（°）</label>
        <input type='number' id='angle' value='45' min='0' max='90' step='1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>本工具为工程估算，未考虑空气阻力、水带摩阻及射流分散，实际灭火作战应结合器材性能与现场经验。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_fire_stream';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const p = get('pressure');
    const c = get('coeff');
    const angle = get('angle');
    const el = ToolBox.$('result');
    if(p <= 0 || c <= 0 || c > 1 || angle < 0 || angle > 90){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效参数。</p>';
      return;
    }
    const headM = p * 100; // 1 MPa ≈ 100 m 水柱
    const stream = headM * c;
    const rad = angle * Math.PI / 180;
    const range = stream * Math.cos(rad);
    const velocity = c * Math.sqrt(2000 * p); // v = sqrt(2P/ρ), P in MPa
    el.innerHTML =
      '<p>充实水柱长度：<strong>' + ToolBox.formatNumber(stream, 2) + '</strong> m</p>' +
      '<p>水平有效射程：<strong>' + ToolBox.formatNumber(range, 2) + '</strong> m</p>' +
      '<p>喷嘴出口流速：<strong>' + ToolBox.formatNumber(velocity, 2) + '</strong> m/s</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        p: ToolBox.$('pressure').value,
        c: ToolBox.$('coeff').value,
        a: ToolBox.$('angle').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.p) ToolBox.$('pressure').value = data.p;
      if(data.c) ToolBox.$('coeff').value = data.c;
      if(data.a) ToolBox.$('angle').value = data.a;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['pressure','coeff','angle'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
