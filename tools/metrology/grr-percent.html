</nav>
<div class="container">
  <div class="card">
    <h2>由测量系统误差与公差求 %GRR</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入测量系统误差 GRR 与公差带，求 %GRR。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">%GRR = GRR/Tol × 100%</div>
      <p class="formula-desc">输入测量系统误差 GRR 与公差带，求 %GRR。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="GRR">GRR</label>
        <input type="number" id="GRR" value="2" step="0.1">
      </div>
      <div>
        <label for="Tol">公差带</label>
        <input type="number" id="Tol" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>%GRR<10% 测量系统可接受。</li>
        <li>2/10 → 20%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const GRR=num('GRR'),Tol=num('Tol');
            const p=GRR/Tol*100;
            ToolBox.setResult('result', dataGrid([
                [p.toFixed(1),'%GRR (%)']
            ]));
        }
function resetForm(){document.getElementById('GRR').value = '2';
      document.getElementById('Tol').value = '10';
      calcTool();}
calcTool();
</script>
