<div class="container">
  <div class="card">
    <h2>由灵敏系数与分量标准不确定度求合成不确定度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入灵敏系数 c1、c2 与各分量标准不确定度 u1、u2，求合成不确定度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">c=1,u1=0.3,u2=0.4 → 0.5。</div>
      <p class="formula-desc">输入灵敏系数 c1、c2 与各分量标准不确定度 u1、u2，求合成不确定度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c1">灵敏系数 c₁</label>
        <input type="number" id="c1" value="1" step="0.1">
      </div>
      <div>
        <label for="u1">分量 u₁</label>
        <input type="number" id="u1" value="0.3" step="0.05">
      </div>
      <div>
        <label for="c2">灵敏系数 c₂</label>
        <input type="number" id="c2" value="1" step="0.1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="u2">分量 u₂</label>
        <input type="number" id="u2" value="0.4" step="0.05">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>线性函数不确定度传播公式。</li>
        <li>c=1,u1=0.3,u2=0.4 → 0.5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c1=num('c1'),u1=num('u1'),c2=num('c2'),u2=num('u2');
            const uc=Math.sqrt(Math.pow(c1*u1,2)+Math.pow(c2*u2,2));
            ToolBox.setResult('result', dataGrid([
                [uc.toFixed(4),'合成标准不确定度 u_c']
            ]));
        }
function resetForm(){document.getElementById('c1').value = '1';
      document.getElementById('u1').value = '0.3';
      document.getElementById('c2').value = '1';
      document.getElementById('u2').value = '0.4';
      calcTool();}
calcTool();
</script>
