<h1 class="sr-only">Drift = (x₂ − x₁) / Δt</h1>

<div class="nav">

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">漂移率计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由前后两次测得值与时间差求漂移率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入前后测得值与时间间隔，求漂移率。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Drift = (x₂ − x₁) / Δt</div>
      <p class="formula-desc">输入前后测得值与时间间隔，求漂移率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="x1">初始值 x₁</label>
        <input type="number" id="x1" value="10" step="0.5">
      </div>
      <div>
        <label for="x2">末次值 x₂</label>
        <input type="number" id="x2" value="10.5" step="0.5">
      </div>
      <div>
        <label for="dt">时间间隔 Δt (天)</label>
        <input type="number" id="dt" value="30" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>正漂移表示测得值随时间增大。</li>
        <li>(10.5−10)/30 → 0.0167。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const x1=num('x1'),x2=num('x2'),dt=num('dt');
            const drift=(x2-x1)/dt;
            ToolBox.setResult('result', dataGrid([
                [drift.toFixed(4),'漂移率 (单位/Δt)']
            ]));
        }
function resetForm(){document.getElementById('x1').value = '10';
      document.getElementById('x2').value = '10.5';
      document.getElementById('dt').value = '30';
      calcTool();}
calcTool();
</script>
