<div class="container">
  <div class="card">
    <h2>上偏差 − 下偏差</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">公差 = 上偏差 − 下偏差</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">公差 = 上偏差 − 下偏差，极限尺寸 = 基本尺寸 ± 偏差。</p>

    <div class="input-row">
      <div>
        <label for="nom">基本尺寸 (mm)</label>
        <input type="number" id="nom" value="50" step="1">
      </div>
      <div>
        <label for="es">上偏差 ES (mm)</label>
        <input type="number" id="es" value="0.025" step="0.005">
      </div>
      <div>
        <label for="ei">下偏差 EI (mm)</label>
        <input type="number" id="ei" value="0.0" step="0.005">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>偏差可正可负。</li>
        <li>配合性质由公差带决定。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const n=num('nom'),es=num('es'),ei=num('ei');
            ToolBox.setResult('result', dataGrid([
                [(es-ei).toFixed(3),'公差 (mm)'],
                [(n+es).toFixed(3),'最大极限尺寸 (mm)'],
                [(n+ei).toFixed(3),'最小极限尺寸 (mm)']
            ]));
        }
function resetForm(){document.getElementById('nom').value = '50';
      document.getElementById('es').value = '0.025';
      document.getElementById('ei').value = '0.0';
      calcTool();}
calcTool();
</script>
