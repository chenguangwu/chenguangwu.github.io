<h1 class="sr-only">再现性 σ_o</h1>

<div class="container">
  <div class="card">
    <h2>不同操作者间差异</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">再现性 = 操作者均值极差 / d₂*。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">再现性 = R̄/d₂*</div>
      <p class="formula-desc">再现性 = 操作者均值极差 / d₂*。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="r">操作者均值极差 R₀</label>
        <input type="number" id="r" value="0.05" step="0.005">
      </div>
      <div>
        <label for="o">操作者数 (人)</label>
        <input type="number" id="o" value="3" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>反映人员间系统差。</li>
        <li>需大于重复性方有意义。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const R=num('r'),o=num('o');
            const d2s={2:1.128,3:1.693,4:2.059}[o]||1.693;
            ToolBox.setResult('result', dataGrid([
                [(R/d2s).toFixed(4),'再现性 σ_o']
            ]));
        }
function resetForm(){document.getElementById('r').value = '0.05';
      document.getElementById('o').value = '3';
      calcTool();}
calcTool();
</script>
