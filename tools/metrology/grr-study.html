<h1 class="sr-only">量具重复再现分析</h1>

  <span class="bc-current">GRR 研究 (%GRR)</span>
</nav>
<div class="container">
  <div class="card">
    <h2>量具重复再现分析</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">%GRR = 6σ_R&amp;R / T</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">%GRR = 6√(σ_r²+σ_o²) / 公差 × 100。</p>

    <div class="input-row">
      <div>
        <label for="sr">重复性 σ_r</label>
        <input type="number" id="sr" value="0.02" step="0.002">
      </div>
      <div>
        <label for="so">再现性 σ_o</label>
        <input type="number" id="so" value="0.015" step="0.002">
      </div>
      <div>
        <label for="tol">公差 T</label>
        <input type="number" id="tol" value="1.0" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>%GRR<10% 良好。</li>
        <li>10%–30% 视情况。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const sr=num('sr'),so=num('so'),tol=num('tol');
            const grr=6*Math.sqrt(sr*sr+so*so);
            const pct=grr/tol*100;
            const verdict=pct<10?'可接受':(pct<30?'临界':'不可接受');
            ToolBox.setResult('result', dataGrid([
                [pct.toFixed(1),'%GRR'],
                [grr.toFixed(4),'R&R 带宽 (6σ)'],
                [verdict,'判定']
            ]));
        }
function resetForm(){document.getElementById('sr').value = '0.02';
      document.getElementById('so').value = '0.015';
      document.getElementById('tol').value = '1.0';
      calcTool();}
calcTool();
</script>
