<h1 class="sr-only">u_rel = u / |x|</h1>

<div class="nav">

</nav>
<div class="container">
  <div class="card">
    <h2>由标准不确定度与测得值求相对不确定度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入标准不确定度 u 与测得值 x，求相对不确定度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">u_r = u/|x| × 100%</div>
      <p class="formula-desc">输入标准不确定度 u 与测得值 x，求相对不确定度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="u">标准不确定度 u</label>
        <input type="number" id="u" value="0.5" step="0.05">
      </div>
      <div>
        <label for="x">测得值 x</label>
        <input type="number" id="x" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>相对不确定度便于跨量纲比较。</li>
        <li>u=0.5,x=10 → 5%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const u=num('u'),x=num('x');
            const ur=u/Math.abs(x)*100;
            ToolBox.setResult('result', dataGrid([
                [ur.toFixed(3),'相对不确定度 u_rel (%)']
            ]));
        }
function resetForm(){document.getElementById('u').value = '0.5';
      document.getElementById('x').value = '10';
      calcTool();}
calcTool();
</script>
