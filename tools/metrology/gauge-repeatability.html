<div class="container">
  <div class="card">
    <h2>极差法 R̄/d₂</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">重复性标准偏差 = 平均极差 / d₂。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">重复性 = R̄/d₂</div>
      <p class="formula-desc">重复性标准偏差 = 平均极差 / d₂。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="r">极差 R</label>
        <input type="number" id="r" value="0.04" step="0.005">
      </div>
      <div>
        <label for="m">测量次数 (次)</label>
        <input type="number" id="m" value="3" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>极差法快速估算。</li>
        <li>d₂ 随测量次数变化。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const R=num('r'),m=num('m');
            const d2={2:1.128,3:1.693,4:2.059,5:2.326}[m]||1.693;
            ToolBox.setResult('result', dataGrid([
                [(R/d2).toFixed(4),'重复性 σ_r'],
                [(5.15*R/d2).toFixed(4),'99% 过程带宽 (5.15σ)']
            ]));
        }
function resetForm(){document.getElementById('r').value = '0.04';
      document.getElementById('m').value = '3';
      calcTool();}
calcTool();
</script>
