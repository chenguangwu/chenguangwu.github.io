<div class="container">
  <div class="card">
    <h2>U = k · u_c</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">U = 包含因子 k × 合成不确定度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">k=2 约 95% 置信。 报告形式：测得值 ±U。</div>
      <p class="formula-desc">U = 包含因子 k × 合成不确定度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="uc">合成不确定度 u_c</label>
        <input type="number" id="uc" value="0.04" step="0.005">
      </div>
      <div>
        <label for="k">包含因子 k</label>
        <input type="number" id="k" value="2" step="0.5">
      </div>
      <div>
        <label for="meas">测得值</label>
        <input type="number" id="meas" value="10.00" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>k=2 约 95% 置信。</li>
        <li>报告形式：测得值 ±U。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const uc=num('uc'),k=num('k'),m=num('meas');
            const U=k*uc;
            ToolBox.setResult('result', dataGrid([
                [U.toFixed(4),'扩展不确定度 U'],
                [(m-U).toFixed(4),'下限'],
                [(m+U).toFixed(4),'上限']
            ]));
        }
function resetForm(){document.getElementById('uc').value = '0.04';
      document.getElementById('k').value = '2';
      document.getElementById('meas').value = '10.00';
      calcTool();}
calcTool();
</script>
