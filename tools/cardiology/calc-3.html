<body>
<h1 class="sr-only">心梗 TIMI 危险分层</h1>

<div class="container">
  <div class="card">
    <h2>🫀 心梗 TIMI 危险分层（STEMI 30天死亡风险）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于年龄、生命体征、Killip 分级、体重、梗死部位、就诊时间及合并症评估急性 STEMI 预后。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：心梗 TIMI 危险分层 - （STEMI 30天死亡风险） - 基于年龄、生命体征。</p>
</div>


    <div class="score-grid">
      <label class="score-item">年龄分组
        <select id="age" onchange="calc()" style="margin-left:auto;min-width:120px;">
          <option value="0"><65 岁</option>
          <option value="2">65-74 岁</option>
          <option value="3">≥75 岁</option>
        </select>
      </label>
      <label class="score-item"><input type="checkbox" id="hr" onchange="calc()"> 心率 >100 次/分<span class="score-pts">+2</span></label>
      <label class="score-item"><input type="checkbox" id="sbp" onchange="calc()"> 收缩压 <100 mmHg<span class="score-pts">+3</span></label>
      <label class="score-item">Killip 分级
        <select id="killip" onchange="calc()" style="margin-left:auto;min-width:120px;">
          <option value="0">I 级</option>
          <option value="2">II-IV 级</option>
        </select>
      </label>
      <label class="score-item"><input type="checkbox" id="weight" onchange="calc()"> 体重 <67 kg<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="anterior" onchange="calc()"> 前壁 STEMI 或 LBBB<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="delay" onchange="calc()"> 发病至治疗 >4 小时<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="history" onchange="calc()"> 糖尿病 / 高血压 / 心绞痛病史<span class="score-pts">+1</span></label>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算评分</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_timi_stemi';
const mortality = ['0.8%', '1.6%', '2.2%', '3.1%', '4.4%', '6.0%', '8.0%', '11.4%', '14.2%', '18.2%', '22.6%', '27.7%', '35.3%', '42.9%', '52.7%'];

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.age != null) document.getElementById('age').value = s.age;
    if(s.killip != null) document.getElementById('killip').value = s.killip;
    ['hr','sbp','weight','anterior','delay','history'].forEach(id => {
      const el = document.getElementById(id);
      if(el && s[id] != null) el.checked = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {
      age: document.getElementById('age').value,
      killip: document.getElementById('killip').value
    };
    ['hr','sbp','weight','anterior','delay','history'].forEach(id => { s[id] = document.getElementById(id).checked; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function calc(){
  let score = 0;
  score += parseInt(document.getElementById('age').value, 10) || 0;
  score += parseInt(document.getElementById('killip').value, 10) || 0;
  ['hr','sbp','weight','anterior','delay','history'].forEach(id => {
    if(document.getElementById(id).checked) score += parseInt(document.getElementById(id).dataset.pts || document.querySelector('label[for="'+id+'"] .score-pts')?.textContent.replace('+','') || 1, 10);
  });
  // simplify point lookup via mapping
  const ptsMap = {hr:2, sbp:3, weight:1, anterior:1, delay:1, history:1};
  score = (parseInt(document.getElementById('age').value,10)||0) + (parseInt(document.getElementById('killip').value,10)||0);
  for(const id in ptsMap) if(document.getElementById(id).checked) score += ptsMap[id];

  const risk = mortality[Math.min(score, 14)];
  let grade = '低危';
  let cls = 'grade-excellent';
  if(score >= 5 && score <= 8){ grade = '中危'; cls = 'grade-pass'; }
  else if(score >= 9){ grade = '高危'; cls = 'grade-fail'; }

  saveState();
  document.getElementById('result').innerHTML = `
    <p>TIMI 评分：<strong style="font-size:20px;">${score}</strong> 分（满分 14 分）</p>
    <p>30 天死亡风险：<strong>${risk}</strong></p>
    <p>危险分层：<span class="grade-tag ${cls}">${grade}</span></p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：TIMI 评分仅作预后参考，临床决策需结合心电图、心肌标志物、血流动力学及再灌注策略综合判断。
    </div>
  `;
}

function resetForm(){
  document.getElementById('age').value = '0';
  document.getElementById('killip').value = '0';
  ['hr','sbp','weight','anterior','delay','history'].forEach(id => document.getElementById(id).checked = false);
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
