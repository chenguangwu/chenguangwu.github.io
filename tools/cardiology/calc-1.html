<body>

<div class="container">
  <div class="card">
    <h2>🫀 高血压 JNC 分级与风险分层</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">依据 JNC 7 血压水平分级，并结合危险因素、靶器官损害与合并症进行心血管风险分层。</p>

    <h3>血压值</h3>
    <div class="input-row">
      <div>
        <label for="sbp">收缩压 (mmHg)</label>
        <input type="number" id="sbp" min="50" max="300" placeholder="例如 142" oninput="calc()">
      </div>
      <div>
        <label for="dbp">舒张压 (mmHg)</label>
        <input type="number" id="dbp" min="30" max="200" placeholder="例如 92" oninput="calc()">
      </div>
    </div>

    <h3>心血管危险因素与合并症</h3>
    <div class="risk-group">
      <label class="risk-item"><input type="checkbox" id="ageRisk" onchange="calc()"> 年龄：男性 ≥55 岁 / 女性 ≥65 岁</label>
      <label class="risk-item"><input type="checkbox" id="smoke" onchange="calc()"> 吸烟</label>
      <label class="risk-item"><input type="checkbox" id="dyslipidemia" onchange="calc()"> 血脂异常</label>
      <label class="risk-item"><input type="checkbox" id="obesity" onchange="calc()"> 肥胖（BMI ≥28 kg/m²）</label>
      <label class="risk-item"><input type="checkbox" id="family" onchange="calc()"> 早发心血管病家族史</label>
      <label class="risk-item"><input type="checkbox" id="diabetes" onchange="calc()"> 糖尿病 / 慢性肾病</label>
      <label class="risk-item"><input type="checkbox" id="tod" onchange="calc()"> 靶器官损害（心、脑、肾、眼底）</label>
      <label class="risk-item"><input type="checkbox" id="cvd" onchange="calc()"> 已确诊脑血管或心血管疾病</label>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">评估分级</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_jnc_bp';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.sbp != null) document.getElementById('sbp').value = s.sbp;
    if(s.dbp != null) document.getElementById('dbp').value = s.dbp;
    ['ageRisk','smoke','dyslipidemia','obesity','family','diabetes','tod','cvd'].forEach(id => {
      const el = document.getElementById(id);
      if(el && s[id] != null) el.checked = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {
      sbp: document.getElementById('sbp').value,
      dbp: document.getElementById('dbp').value
    };
    ['ageRisk','smoke','dyslipidemia','obesity','family','diabetes','tod','cvd'].forEach(id => {
      s[id] = document.getElementById(id).checked;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function classifyBP(sbp, dbp){
  if(sbp >= 180 || dbp >= 110) return {level:'3级高血压（重度）', color:'grade-fail', desc:'收缩压 ≥180 或 舒张压 ≥110 mmHg'};
  if(sbp >= 160 || dbp >= 100) return {level:'2级高血压（中度）', color:'grade-pass', desc:'收缩压 160-179 或 舒张压 100-109 mmHg'};
  if(sbp >= 140 || dbp >= 90) return {level:'1级高血压（轻度）', color:'grade-pass', desc:'收缩压 140-159 或 舒张压 90-99 mmHg'};
  if(sbp >= 120 || dbp >= 80) return {level:'高血压前期', color:'grade-good', desc:'收缩压 120-139 或 舒张压 80-89 mmHg'};
  return {level:'正常血压', color:'grade-excellent', desc:'收缩压 <120 且 舒张压 <80 mmHg'};
}

function riskLayer(){
  const diabetes = document.getElementById('diabetes').checked;
  const tod = document.getElementById('tod').checked;
  const cvd = document.getElementById('cvd').checked;
  if(diabetes || tod || cvd) return {layer:'高危 / 很高危', color:'grade-fail', desc:'存在糖尿病、靶器官损害或已确诊心脑血管疾病'};

  let rf = 0;
  ['ageRisk','smoke','dyslipidemia','obesity','family'].forEach(id => {
    if(document.getElementById(id).checked) rf++;
  });
  if(rf >= 3) return {layer:'高危', color:'grade-fail', desc:'具备 ≥3 个危险因素'};
  if(rf >= 1) return {layer:'中危', color:'grade-pass', desc:'具备 1-2 个危险因素'};
  return {layer:'低危', color:'grade-excellent', desc:'无其他危险因素'};
}

function calc(){
  const sbp = parseFloat(document.getElementById('sbp').value);
  const dbp = parseFloat(document.getElementById('dbp').value);
  const result = document.getElementById('result');

  if(isNaN(sbp) || isNaN(dbp) || sbp < 30 || dbp < 20){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入有效的收缩压和舒张压。</p>';
    saveState();
    return;
  }

  const bp = classifyBP(sbp, dbp);
  const risk = riskLayer();
  saveState();

  result.innerHTML = `
    <p>血压分级：<span class="grade-tag ${bp.color}">${bp.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${bp.desc}</p>
    <p style="margin-top:12px;">心血管风险分层：<span class="grade-tag ${risk.color}">${risk.layer}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${risk.desc}</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：本工具仅作临床参考，不能替代专业医疗诊断与治疗决策。
    </div>
  `;
}

function resetForm(){
  document.getElementById('sbp').value = '';
  document.getElementById('dbp').value = '';
  ['ageRisk','smoke','dyslipidemia','obesity','family','diabetes','tod','cvd'].forEach(id => {
    document.getElementById(id).checked = false;
  });
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
