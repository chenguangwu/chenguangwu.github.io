<body>
<h1 class="sr-only">房颤 CHA₂DS₂-VASc 栓塞风险评估</h1>
<div class="nav">

<div class="container">
  <div class="card">
    <h2>🫀 房颤 CHA₂DS₂-VASc 栓塞风险评估</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用于非瓣膜性房颤患者卒中/血栓栓塞风险的临床评分。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：房颤 CHA₂DS₂-VASc 栓塞风险评估 - 非瓣膜性房颤患者卒中/血栓栓塞风险的临床评分。</p>
</div>


    <div class="input-row">
      <div>
        <label for="sex">性别</label>
        <select id="sex" onchange="calc()">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div>
        <label for="age">年龄分组</label>
        <select id="age" onchange="calc()">
          <option value="0"><65 岁</option>
          <option value="1">65-74 岁</option>
          <option value="2">≥75 岁</option>
        </select>
      </div>
    </div>

    <div class="score-grid">
      <label class="score-item"><input type="checkbox" id="chf" onchange="calc()"> 充血性心力衰竭 / 左室功能不全<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="htn" onchange="calc()"> 高血压<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="dm" onchange="calc()"> 糖尿病<span class="score-pts">+1</span></label>
      <label class="score-item"><input type="checkbox" id="stroke" onchange="calc()"> 既往卒中 / TIA / 血栓栓塞<span class="score-pts">+2</span></label>
      <label class="score-item"><input type="checkbox" id="vasc" onchange="calc()"> 血管疾病（心梗、外周动脉病等）<span class="score-pts">+1</span></label>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算评分</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_chads_vasc';

const riskTable = {
  male: ['0.0%', '1.3%', '2.2%', '3.2%', '4.8%', '7.2%', '9.7%', '11.2%', '11.2%', '11.2%', '11.2%'],
  female: ['0.0%', '1.3%', '2.2%', '3.2%', '4.8%', '7.2%', '9.7%', '11.2%', '11.2%', '11.2%', '11.2%']
};

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.sex) document.getElementById('sex').value = s.sex;
    if(s.age != null) document.getElementById('age').value = s.age;
    ['chf','htn','dm','stroke','vasc'].forEach(id => {
      const el = document.getElementById(id);
      if(el && s[id] != null) el.checked = s[id];
    });
  } catch(e){}
}

function saveState(){
  try {
    const s = {
      sex: document.getElementById('sex').value,
      age: document.getElementById('age').value
    };
    ['chf','htn','dm','stroke','vasc'].forEach(id => { s[id] = document.getElementById(id).checked; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch(e){}
}

function calc(){
  let score = parseInt(document.getElementById('age').value, 10) || 0;
  if(document.getElementById('sex').value === 'female') score += 1;
  ['chf','htn','dm','vasc'].forEach(id => { if(document.getElementById(id).checked) score += 1; });
  if(document.getElementById('stroke').checked) score += 2;

  const sex = document.getElementById('sex').value;
  const idx = Math.min(score, 10);
  const annualRisk = sex === 'female' && score === 1 ? '1.3%' : riskTable[sex][idx];

  let recommend = '';
  if(score === 0){
    recommend = '男性：卒中风险极低，一般无需口服抗凝治疗；女性需结合年龄与其他危险因素综合判断。';
  } else if(score === 1){
    recommend = '可考虑口服抗凝治疗（个体化评估出血风险与患者意愿）。';
  } else {
    recommend = '推荐口服抗凝治疗（如 NOAC 或华法林），除非存在禁忌证。';
  }

  saveState();

  document.getElementById('result').innerHTML = `
    <p>CHA₂DS₂-VASc 评分：<strong style="font-size:20px;">${score}</strong> 分</p>
    <p>预估年化卒中/血栓栓塞风险：<strong>${annualRisk}</strong></p>
    <p>治疗建议：<strong>${recommend}</strong></p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：评分与风险分层需结合出血风险评分（如 HAS-BLED）及临床实际情况综合判断。
    </div>
  `;
}

function resetForm(){
  document.getElementById('sex').value = 'male';
  document.getElementById('age').value = '0';
  ['chf','htn','dm','stroke','vasc'].forEach(id => document.getElementById(id).checked = false);
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
