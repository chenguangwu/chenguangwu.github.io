<div class="container">
  <div class="card">
    <h2 data-zh="税额 = 利息 × 税率">Interest Income Tax</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由利息所得与适用税率计算代扣税。">Interest Income Tax is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">= 利息</div>
      <p class="formula-desc">由利息所得与适用税率计算代扣税。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="interest">利息金额</label>
        <input type="number" id="interest" value="5000" step="100">
      </div>
      <div>
        <label for="r">税率 (%)</label>
        <input type="number" id="r" value="20" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>利息 5000、20% → 税 1000。</li>
        <li>部分国债利息免税。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const i = num('interest'), r = num('r') / 100;
            ToolBox.setResult('result', dataGrid([
                [(i * r).toFixed(2), '利息所得税'],
                [(i * (1 - r)).toFixed(2), '税后利息']
            ]));
        }
function resetForm(){document.getElementById('interest').value = '5000';
      document.getElementById('r').value = '20';
      calcTool();}
calcTool();
</script>
