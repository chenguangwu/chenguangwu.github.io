<div class="container">
  <div class="card">
    <h2>实际税率 = 总税额 ÷ 税前所得</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">综合衡量实际承担的税负水平。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">= 总税额</div>
      <p class="formula-desc">综合衡量实际承担的税负水平。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="tax">总税额</label>
        <input type="number" id="tax" value="250000" step="1000">
      </div>
      <div>
        <label for="pretax">税前所得</label>
        <input type="number" id="pretax" value="1000000" step="10000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>25 万 / 100 万 = 25%。</li>
        <li>低于名义税率说明有减免。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const t = num('tax'), p = num('pretax');
            ToolBox.setResult('result', dataGrid([
                [(t / p * 100).toFixed(2), '实际税率 (%)'],
                [(p - t).toFixed(2), '税后所得']
            ]));
        }
function resetForm(){document.getElementById('tax').value = '250000';
      document.getElementById('pretax').value = '1000000';
      calcTool();}
calcTool();
</script>
