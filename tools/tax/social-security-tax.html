<h1 class="sr-only">T = 缴费基数 × 费率</h1>

<div class="nav">

</nav>
<div class="container">
  <div class="card">
    <h2>由缴费基数与社保费率求社保费</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入缴费基数与社保综合费率，求社保费。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">社保费 = 基数×费率</div>
      <p class="formula-desc">输入缴费基数与社保综合费率，求社保费。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="b">缴费基数 (元)</label>
        <input type="number" id="b" value="10000" step="500">
      </div>
      <div>
        <label for="r">费率</label>
        <input type="number" id="r" value="0.18" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>含养老/医疗/失业等综合费率。</li>
        <li>1 万×18% → 1800 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const b=num('b'),r=num('r');
            const T=b*r;
            ToolBox.setResult('result', dataGrid([
                [T.toFixed(2),'社保费 T (元)']
            ]));
        }
function resetForm(){document.getElementById('b').value = '10000';
      document.getElementById('r').value = '0.18';
      calcTool();}
calcTool();
</script>
