<div class="container">
  <div class="card">
    <h2 data-zh="由总税额与总收入求平均税率">Average Tax Rate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入总税额与总收入，求平均税率。">Average Tax Rate is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">平均税率 = 总税/总收入</div>
      <p class="formula-desc">输入总税额与总收入，求平均税率。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="T">总税额 T (元)</label>
        <input type="number" id="T" value="30000" step="1000">
      </div>
      <div>
        <label for="Y">总收入 Y (元)</label>
        <input type="number" id="Y" value="100000" step="1000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ATR = 总税额/总收入。</li>
        <li>3 万/10 万 → 30%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const T=num('T'),Y=num('Y');
            const ATR=T/Y;
            ToolBox.setResult('result', dataGrid([
                [(ATR*100).toFixed(2),'平均税率 ATR (%)']
            ]));
        }
function resetForm(){document.getElementById('T').value = '30000';
      document.getElementById('Y').value = '100000';
      calcTool();}
calcTool();
</script>
