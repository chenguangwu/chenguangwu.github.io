<div class="container">
  <div class="card">
    <h2 data-zh="由计税价格与从价税率求从价税">Ad Valorem Duty</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入计税价格与从价税率，求从价税。">Ad Valorem Duty is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">从价税 = 计税价×税率</div>
      <p class="formula-desc">输入计税价格与从价税率，求从价税。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">计税价格 (元)</label>
        <input type="number" id="p" value="1000" step="50">
      </div>
      <div>
        <label for="r">税率</label>
        <input type="number" id="r" value="0.1" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>从价税按价格比例征收。</li>
        <li>1000 元×10% → 100 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p=num('p'),r=num('r');
            const T=p*r;
            ToolBox.setResult('result', dataGrid([
                [T.toFixed(2),'从价税 T (元)']
            ]));
        }
function resetForm(){document.getElementById('p').value = '1000';
      document.getElementById('r').value = '0.1';
      calcTool();}
calcTool();
</script>
