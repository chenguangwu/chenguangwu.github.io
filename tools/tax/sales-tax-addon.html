<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>含税 = 价格 × (1 + 税率)</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">在价格之外按比例附加的消费税。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">= 价格</div>
      <p class="formula-desc">在价格之外按比例附加的消费税。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="price">不含税价格</label>
        <input type="number" id="price" value="100" step="1">
      </div>
      <div>
        <label for="r">税率 (%)</label>
        <input type="number" id="r" value="5" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>100、5% → 税额 5、含税 105。</li>
        <li>与增值税同为价外税。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p = num('price'), r = num('r') / 100;
            ToolBox.setResult('result', dataGrid([
                [(p * r).toFixed(2), '消费税额'],
                [(p * (1 + r)).toFixed(2), '含税价']
            ]));
        }
function resetForm(){document.getElementById('price').value = '100';
      document.getElementById('r').value = '5';
      calcTool();}
calcTool();
</script>
