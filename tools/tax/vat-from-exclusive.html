<h1 class="sr-only">不含税算增值税计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 不含税价算增值税</span>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">不含税价算增值税</span>
</nav>
<div class="container">
  <div class="card">
    <h2>税额 = 不含税 × 税率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由不含税销售额直接计算增值税额与含税价。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">= 不含税</div>
      <p class="formula-desc">由不含税销售额直接计算增值税额与含税价。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="ex">不含税金额</label>
        <input type="number" id="ex" value="100" step="1">
      </div>
      <div>
        <label for="r">增值税率 (%)</label>
        <input type="number" id="r" value="13" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>不含税 100、13% → 税额 13、含税 113。</li>
        <li>含税 = 不含税 ×(1+税率)。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ex = num('ex'), r = num('r') / 100;
            const tax = ex * r;
            ToolBox.setResult('result', dataGrid([
                [tax.toFixed(2), '增值税额'],
                [(ex + tax).toFixed(2), '含税金额']
            ]));
        }
function resetForm(){document.getElementById('ex').value = '100';
      document.getElementById('r').value = '13';
      calcTool();}
calcTool();
</script>
