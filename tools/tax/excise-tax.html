<h1 class="sr-only">T = 出厂价 × 数量 × 税率</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 消费税(从价)计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">消费税(从价)计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由出厂单价、数量与消费税率求消费税</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入出厂单价、数量与消费税率，求消费税。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">从价消费税 = 计税价×数量×税率。 10×100×20% → 200 元。</div>
      <p class="formula-desc">输入出厂单价、数量与消费税率，求消费税。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p">出厂单价 (元)</label>
        <input type="number" id="p" value="10" step="1">
      </div>
      <div>
        <label for="q">数量 (件)</label>
        <input type="number" id="q" value="100" step="10">
      </div>
      <div>
        <label for="r">消费税率</label>
        <input type="number" id="r" value="0.2" step="0.02">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>从价消费税 = 计税价×数量×税率。</li>
        <li>10×100×20% → 200 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p=num('p'),q=num('q'),r=num('r');
            const T=p*q*r;
            ToolBox.setResult('result', dataGrid([
                [T.toFixed(2),'消费税 T (元)']
            ]));
        }
function resetForm(){document.getElementById('p').value = '10';
      document.getElementById('q').value = '100';
      document.getElementById('r').value = '0.2';
      calcTool();}
calcTool();
</script>
