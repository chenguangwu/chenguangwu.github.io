<h1 class="sr-only">v₁′=(m₁−m₂)v₁/(m₁+m₂)+2m₂v₂/(m₁+m₂)</h1>

<div class="container">
  <div class="card">
    <h2>由质量与碰前速度求碰后速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入两质量与碰前速度，求碰后速度。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本动力学计算基于标准力学公式，结果仅供参考。 工具名称：一维弹性碰撞计算器 - 一维弹性碰撞：输入 m₁、m₂、v₁、v₂，输出。</p>
</div>


    <div class="input-row">
      <div>
        <label for="m1">质量 m₁ (kg)</label>
        <input type="number" id="m1" value="2" step="0.1">
      </div>
      <div>
        <label for="m2">质量 m₂ (kg)</label>
        <input type="number" id="m2" value="1" step="0.1">
      </div>
      <div>
        <label for="v1">碰前 v₁ (m/s)</label>
        <input type="number" id="v1" value="4" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v2">碰前 v₂ (m/s)</label>
        <input type="number" id="v2" value="0" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>动量、动能均守恒。</li>
        <li>2kg,4m/s 撞 1kg 静止 → v₁′=1.33, v₂′=5.33 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m1=num('m1'),m2=num('m2'),v1=num('v1'),v2=num('v2');
            const s=m1+m2;
            const v1p=(m1-m2)*v1/s+2*m2*v2/s;
            const v2p=2*m1*v1/s-(m1-m2)*v2/s;
            ToolBox.setResult('result', dataGrid([
                [v1p.toFixed(3),'碰后速度 v₁′ (m/s)'],
                [v2p.toFixed(3),'碰后速度 v₂′ (m/s)']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '2';
      document.getElementById('m2').value = '1';
      document.getElementById('v1').value = '4';
      document.getElementById('v2').value = '0';
      calcTool();}
calcTool();
</script>
