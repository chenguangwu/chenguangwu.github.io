<div class="container">
  <div class="card">
    <h2 data-zh="完全非弹性碰撞计算器">Momentum Conservation</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">m₁v₁ + m₂v₂ = (m₁+m₂)·v′</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="碰撞后粘在一起的末速度。">Momentum Conservation is available directly in your browser, with no data uploaded.</p>

    <div class="input-row">
      <div>
        <label for="m1">质量 m₁ (kg)</label>
        <input type="number" id="m1" value="1000" step="50">
      </div>
      <div>
        <label for="v1">速度 v₁ (m/s)</label>
        <input type="number" id="v1" value="20" step="1">
      </div>
      <div>
        <label for="m2">质量 m₂ (kg)</label>
        <input type="number" id="m2" value="1500" step="50">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v2">速度 v₂ (m/s)</label>
        <input type="number" id="v2" value="0" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>完全非弹性碰撞末速。</li>
        <li>动量守恒、动能不守恒。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m1 = num('m1'), v1 = num('v1'), m2 = num('m2'), v2 = num('v2');
            const vp = (m1 * v1 + m2 * v2) / (m1 + m2);
            ToolBox.setResult('result', dataGrid([
                [vp.toFixed(3), '末速度 v′ (m/s)']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '1000';
      document.getElementById('v1').value = '20';
      document.getElementById('m2').value = '1500';
      document.getElementById('v2').value = '0';
      calcTool();}
calcTool();
</script>
