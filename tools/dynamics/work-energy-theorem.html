<h1 class="sr-only">W = ½m(v₂² − v₁²)</h1>

<div class="nav">

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>

  <span class="bc-sep">‹</span>
  <span class="bc-current">动能定理计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由速度变化求合外力做功</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入质量与初末速度，求动能变化（合外力功）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">W = ΔK = ½m(v₂²−v₁²)。 2kg,0→10 → 100 J。</div>
      <p class="formula-desc">输入质量与初末速度，求动能变化（合外力功）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="2" step="0.1">
      </div>
      <div>
        <label for="v1">初速度 v₁ (m/s)</label>
        <input type="number" id="v1" value="0" step="0.5">
      </div>
      <div>
        <label for="v2">末速度 v₂ (m/s)</label>
        <input type="number" id="v2" value="10" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>W = ΔK = ½m(v₂²−v₁²)。</li>
        <li>2kg,0→10 → 100 J。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m=num('m'),v1=num('v1'),v2=num('v2');
            const W=0.5*m*(v2*v2-v1*v1);
            ToolBox.setResult('result', dataGrid([
                [W.toFixed(2),'合外力功 W (J)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '2';
      document.getElementById('v1').value = '0';
      document.getElementById('v2').value = '10';
      calcTool();}
calcTool();
</script>
