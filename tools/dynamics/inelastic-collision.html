<div class="container">
  <div class="card">
    <h2 data-zh="由质量与碰前速度求共同速度">Inelastic Collision</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入两质量与碰前速度，求粘连共同速度。">Inelastic Collision is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = (m₁v₁ + m₂v₂) / (m₁ + m₂)</div>
      <p class="formula-desc">输入两质量与碰前速度，求粘连共同速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="m1">质量 m₁ (kg)</label>
        <input type="number" id="m1" value="2" step="0.1">
      </div>
      <div>
        <label for="m2">质量 m₂ (kg)</label>
        <input type="number" id="m2" value="1" step="0.1">
      </div>
      <div>
        <label for="v1">碰前 v₁ (m/s)</label>
        <input type="number" id="v1" value="4" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v2">碰前 v₂ (m/s)</label>
        <input type="number" id="v2" value="0" step="0.5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>动量守恒、动能不守恒。</li>
        <li>2kg·4 + 1kg·0 → 2.67 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m1=num('m1'),m2=num('m2'),v1=num('v1'),v2=num('v2');
            const v=(m1*v1+m2*v2)/(m1+m2);
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(3),'共同速度 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('m1').value = '2';
      document.getElementById('m2').value = '1';
      document.getElementById('v1').value = '4';
      document.getElementById('v2').value = '0';
      calcTool();}
calcTool();
</script>
