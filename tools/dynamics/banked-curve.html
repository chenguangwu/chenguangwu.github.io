<h1 class="sr-only">v = √(r·g·tanθ)</h1>

<div class="container">
  <div class="card">
    <h2>由弯道半径与倾角求无摩擦设计速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入弯道半径 r、倾角 θ、g，求设计速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = √(rg·tanθ)（无侧滑）。 r=50,θ=30° → 约 16.8 m/s。</div>
      <p class="formula-desc">输入弯道半径 r、倾角 θ、g，求设计速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="r">半径 r (m)</label>
        <input type="number" id="r" value="50" step="1">
      </div>
      <div>
        <label for="th">倾角 θ (°)</label>
        <input type="number" id="th" value="30" step="1">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = √(rg·tanθ)（无侧滑）。</li>
        <li>r=50,θ=30° → 约 16.8 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const r=num('r'),th=num('th'),g=num('g');
            const v=Math.sqrt(r*g*Math.tan(th*Math.PI/180));
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(2),'设计速度 v (m/s)']
            ]));
        }
function resetForm(){document.getElementById('r').value = '50';
      document.getElementById('th').value = '30';
      document.getElementById('g').value = '9.81';
      calcTool();}
calcTool();
</script>
