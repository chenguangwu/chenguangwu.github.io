<div class="container">
  <div class="card">
    <h2 data-zh="🍽️ 菜品定价计算器">🍽️ Menu Pricing Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按食材成本和目标毛利率估算建议售价。">Set menu prices from costs, waste rate, and expected profit margin.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：菜品定价计算器。</p>
</div>


    <div class="input-row">
      <label>食材成本（元）</label>
      <input type="number" id="material" value="12" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>人工成本占比（%）</label>
      <input type="number" id="labor" value="20" min="0" step="1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>租赁/能耗等固定成本（元）</label>
      <input type="number" id="fixed" value="3" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>目标毛利率（%）</label>
      <input type="number" id="margin" value="60" min="1" max="95" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">估算售价</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const material = parseFloat(document.getElementById('material').value) || 0;
  const laborRate = (parseFloat(document.getElementById('labor').value) || 0) / 100;
  const fixed = parseFloat(document.getElementById('fixed').value) || 0;
  const margin = parseFloat(document.getElementById('margin').value) || 60;

  const totalCost = material * (1 + laborRate) + fixed;
  const price = margin >= 99 ? 0 : totalCost / (1 - margin / 100);
  const profit = price - totalCost;

  if (margin >= 99) {
    document.getElementById('result').innerHTML = '<p>目标毛利率过高（必须小于99%）</p>';
    return;
  }

  document.getElementById('result').innerHTML =
    `<p>成本合计：<strong>${totalCost.toFixed(2)} 元</strong></p>` +
    `<p>建议售价：<strong style="color:var(--primary)">${price.toFixed(2)} 元</strong></p>` +
    `<p>建议毛利：<strong>${profit.toFixed(2)} 元</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText(), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

calc();
</script>
