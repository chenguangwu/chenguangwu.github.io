<div class="container">
  <div class="card">
    <h2>🫘 肾小球滤过率 eGFR 计算（CKD-EPI）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">采用 CKD-EPI 肌酐方程（无种族校正系数）估算成人 eGFR，并给出 CKD 分期。</p>

    <div class="input-row">
      <div>
        <label for="scrValue">血肌酐（Scr）</label>
        <input type="number" id="scrValue" min="1" step="0.01" placeholder="例如 88.4" oninput="calc()">
      </div>
      <div>
        <label for="scrUnit">单位</label>
        <select id="scrUnit" onchange="calc()">
          <option value="umol">μmol/L</option>
          <option value="mgdl">mg/dL</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <div>
        <label for="age">年龄（岁）</label>
        <input type="number" id="age" min="18" max="120" placeholder="例如 58" oninput="calc()">
      </div>
      <div>
        <label for="sex">性别</label>
        <select id="sex" onchange="calc()">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算 eGFR</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_egfr_ckd_epi';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.scrValue != null) document.getElementById('scrValue').value = s.scrValue;
    if(s.scrUnit) document.getElementById('scrUnit').value = s.scrUnit;
    if(s.age != null) document.getElementById('age').value = s.age;
    if(s.sex) document.getElementById('sex').value = s.sex;
  } catch(e){}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      scrValue: document.getElementById('scrValue').value,
      scrUnit: document.getElementById('scrUnit').value,
      age: document.getElementById('age').value,
      sex: document.getElementById('sex').value
    }));
  } catch(e){}
}

function stageGFR(egfr){
  if(egfr >= 90) return {stage:'G1（正常或高）', cls:'grade-excellent', desc:'eGFR ≥90 mL/min/1.73m²，若存在肾损伤标志仍属 CKD。'};
  if(egfr >= 60) return {stage:'G2（轻度下降）', cls:'grade-good', desc:'eGFR 60-89 mL/min/1.73m²。'};
  if(egfr >= 45) return {stage:'G3a（轻-中度下降）', cls:'grade-pass', desc:'eGFR 45-59 mL/min/1.73m²。'};
  if(egfr >= 30) return {stage:'G3b（中-重度下降）', cls:'grade-pass', desc:'eGFR 30-44 mL/min/1.73m²。'};
  if(egfr >= 15) return {stage:'G4（重度下降）', cls:'grade-fail', desc:'eGFR 15-29 mL/min/1.73m²。'};
  return {stage:'G5（肾衰竭）', cls:'grade-fail', desc:'eGFR <15 mL/min/1.73m²。'};
}

function calcEGFR(scrMgdl, age, female){
  let egfr;
  if(female){
    const k = 0.7, alpha = scrMgdl <= 0.7 ? -0.329 : -1.209;
    egfr = 141 * Math.min(scrMgdl / k, 1) ** alpha * Math.max(scrMgdl / k, 1) ** (-1.209) * 0.993 ** age * 1.018;
  } else {
    const k = 0.9, alpha = scrMgdl <= 0.9 ? -0.411 : -1.209;
    egfr = 141 * Math.min(scrMgdl / k, 1) ** alpha * Math.max(scrMgdl / k, 1) ** (-1.209) * 0.993 ** age;
  }
  return egfr;
}

function calc(){
  const scrVal = parseFloat(document.getElementById('scrValue').value);
  const scrUnit = document.getElementById('scrUnit').value;
  const age = parseFloat(document.getElementById('age').value);
  const female = document.getElementById('sex').value === 'female';
  const result = document.getElementById('result');

  if(isNaN(scrVal) || isNaN(age) || scrVal <= 0 || age < 18){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入有效的血肌酐、年龄和性别。</p>';
    saveState();
    return;
  }

  const scrMgdl = scrUnit === 'umol' ? scrVal / 88.4 : scrVal;
  const egfr = calcEGFR(scrMgdl, age, female);
  const st = stageGFR(egfr);

  saveState();
  result.innerHTML = `
    <p>eGFR：<strong style="font-size:20px;">${egfr.toFixed(1)}</strong> mL/min/1.73m²</p>
    <p>CKD 分期：<span class="grade-tag ${st.cls}">${st.stage}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${st.desc}</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：CKD-EPI 公式适用于 18 岁以上成年人；急性肾损伤、妊娠、肌肉量异常等情况下估算值可能偏差较大。
    </div>
  `;
}

function resetForm(){
  document.getElementById('scrValue').value = '';
  document.getElementById('scrUnit').value = 'umol';
  document.getElementById('age').value = '';
  document.getElementById('sex').value = 'male';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
</body>
