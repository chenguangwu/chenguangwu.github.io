<body>
<h1 class="sr-only">油耗成本计算器</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 油耗成本计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 交通运输</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">油耗成本计算器</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2>⛽ 油耗成本计算器</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">所需油量 = 里程 ÷ 100 × 百公里油耗</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入行驶里程、百公里油耗与油价，计算所需油量、总油费与每公里成本。</p>

    <div class="input-row">
      <div>
        <label>行驶里程 (km)</label>
        <input type="number" id="distance" value="500" min="0" step="any" oninput="calc()" aria-label="行驶里程">
      </div>
      <div>
        <label>百公里油耗 (L/100km)</label>
        <input type="number" id="consumption" value="7.5" min="0" step="0.1" oninput="calc()" aria-label="百公里油耗">
      </div>
      <div>
        <label>油价 (元/L)</label>
        <input type="number" id="price" value="8.00" min="0" step="0.01" oninput="calc()" aria-label="油价">
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <label>快捷选择油品预设价格（仅供参考，可手动修改）</label>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn" type="button" onclick="setFuel(7.85)">92#汽油 ≈7.85</button>
        <button class="btn" type="button" onclick="setFuel(8.35)">95#汽油 ≈8.35</button>
        <button class="btn" type="button" onclick="setFuel(9.05)">98#汽油 ≈9.05</button>
        <button class="btn" type="button" onclick="setFuel(7.55)">0#柴油 ≈7.55</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算成本</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 公式：所需油量 = 里程 ÷ 100 × 百公里油耗；总油费 = 所需油量 × 油价；每公里成本 = 总油费 ÷ 里程。</div>
  </div>

  <div class="card">
    <h3>📊 单程 / 往返对比</h3>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">快速查看单程与往返（×2）的费用差异。</p>
    <div id="compareBox"></div>
  </div>
</div>

<script>
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function setFuel(p){
  document.getElementById('price').value=p;
  calc();
  ToolBox.showToast(i18nText('toast.saved', '已填入油价 '+p+' 元/L'),'info');
}
function calc(){
  var d=num('distance'),c=num('consumption'),p=num('price');
  if(d<=0||c<=0||p<=0){
    document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效的里程、油耗和油价（均需大于0）。</p>';
    document.getElementById('compareBox').innerHTML='';
    return;
  }
  var fuel=d/100*c;            // L
  var cost=fuel*p;             // 元
  var perKm=cost/d;            // 元/km
  var perKmFuel=c/100;         // L/km

  document.getElementById('res').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+fuel.toFixed(2)+'</div><div class="label">所需油量 (L)</div></div>'+
      '<div class="data-card"><div class="num">¥'+cost.toFixed(2)+'</div><div class="label">总油费 (元)</div></div>'+
      '<div class="data-card"><div class="num">¥'+perKm.toFixed(3)+'</div><div class="label">每公里成本 (元)</div></div>'+
      '<div class="data-card"><div class="num">'+perKmFuel.toFixed(3)+'</div><div class="label">每公里油耗 (L)</div></div>'+
    '</div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(100,Math.round(fuel/60*100))+'%"></div></div>'+
    '<p style="font-size:12px;color:var(--text-muted);margin-top:6px;">参考：按 60L 油箱容积，约需加满 <strong>'+Math.round(fuel/60*100)+'%</strong>。</p>';

  // 单程/往返
  var roundCost=cost*2, roundFuel=fuel*2;
  document.getElementById('compareBox').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">¥'+cost.toFixed(2)+'</div><div class="label">单程油费</div></div>'+
      '<div class="data-card"><div class="num">¥'+roundCost.toFixed(2)+'</div><div class="label">往返油费</div></div>'+
      '<div class="data-card"><div class="num">'+roundFuel.toFixed(2)+' L</div><div class="label">往返所需油量</div></div>'+
    '</div>';
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function resetAll(){
  document.getElementById('distance').value=500;
  document.getElementById('consumption').value=7.5;
  document.getElementById('price').value=8.00;
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
calc();
</script>
</body>
