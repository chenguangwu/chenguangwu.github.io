<body>

<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2 data-zh="🚓 违章罚款金额计算（交通）">🚓 Traffic Violation Fine Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="内置常见交通违法行为库，勾选违法行为后累计罚款与扣分，并提示记分风险（参考标准，以当地法规为准）。">Estimate traffic violation fines.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：违章罚款金额计算（交通）。</p>
</div>


    <div style="margin-bottom:12px;">
      <label>搜索违法行为</label>
      <input type="search" id="search" placeholder="输入关键词，如 闯红灯、超速、酒驾" oninput="renderList()" aria-label="搜索违法行为">
    </div>

    <div class="tabs" id="catTabs"></div>
    <div id="violationList" style="margin-bottom:12px;"></div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算累计罚款</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="clearAll()">🗑️ 清空选择</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 记分周期内累计 12 分需参加满分学习并重考科目一；累计 24 分及以上需重考科目一+科目三；酒驾/醉驾将并处吊销驾驶证。</div>
  </div>

  <div class="card">
    <h3>🧾 已选违法行为</h3>
    <div id="selectedBox"></div>
  </div>
</div>

<script>
// 违法行为数据库（参考《道路交通安全法》及记分规定，罚款区间以常见标准）
var VIOLATIONS=[
  {cat:'记1分',name:'不按规定会车',fine:100,points:1},
  {cat:'记1分',name:'不按规定使用灯光',fine:100,points:1},
  {cat:'记3分',name:'违反禁止标线指示(压实线)',fine:200,points:3},
  {cat:'记3分',name:'不按规定礼让行人',fine:200,points:3},
  {cat:'记3分',name:'违反禁令标志',fine:200,points:3},
  {cat:'记3分',name:'占用应急车道',fine:200,points:3},
  {cat:'记3分',name:'拨打接听手持电话',fine:200,points:3},
  {cat:'记3分',name:'超速10%-20%(高速以外)',fine:200,points:3},
  {cat:'记6分',name:'闯红灯',fine:200,points:6},
  {cat:'记6分',name:'超速20%-50%(高速以外)',fine:200,points:6},
  {cat:'记6分',name:'高速公路违法停车',fine:200,points:6},
  {cat:'记6分',name:'不按规定避让校车',fine:200,points:6},
  {cat:'记6分',name:'驾驶证暂扣期间驾驶机动车',fine:500,points:6},
  {cat:'记9分',name:'高速公路违法占用快车道',fine:200,points:9},
  {cat:'记12分',name:'超速50%以上',fine:1000,points:12},
  {cat:'记12分',name:'驾驶与准驾车型不符的机动车',fine:500,points:12},
  {cat:'记12分',name:'使用伪造变造号牌',fine:5000,points:12},
  {cat:'记12分',name:'未悬挂或不按规定安装号牌',fine:200,points:12},
  {cat:'记12分',name:'饮酒后驾驶机动车(酒驾)',fine:2000,points:12,suspend:true},
  {cat:'特殊',name:'醉酒驾驶机动车(醉驾)',fine:0,points:0,suspend:true,note:'吊销驾驶证，5年内不得重新取得，追究刑事责任'},
  {cat:'特殊',name:'再次饮酒后驾驶机动车',fine:2000,points:0,suspend:true,note:'处10日以下拘留，吊销驾驶证'},
  {cat:'特殊',name:'饮酒后驾驶营运机动车',fine:5000,points:0,suspend:true,note:'处15日拘留，吊销驾驶证，5年内不得重考'},
  {cat:'其他',name:'未取得驾驶证驾驶机动车',fine:1000,points:0,note:'可并处15日以下拘留'},
  {cat:'其他',name:'将车交由未取得驾驶证人驾驶',fine:1000,points:0,suspend:true},
  {cat:'其他',name:'机动车违反规定停放',fine:100,points:0},
  {cat:'其他',name:'违反规定使用喇叭',fine:50,points:0},
  {cat:'其他',name:'乘车人不系安全带',fine:50,points:0}
];
var selected={};
var currentCat='全部';

function getCategories(){
  var cats=['全部'];
  VIOLATIONS.forEach(function(v){if(cats.indexOf(v.cat)<0)cats.push(v.cat);});
  return cats;
}
function renderTabs(){
  var cats=getCategories();
  var html='';
  cats.forEach(function(c){
    html+='<button class="tab-btn'+(c===currentCat?' active':'')+'" type="button" onclick="setCat(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>';
  });
  document.getElementById('catTabs').innerHTML=html;
}
function setCat(c){currentCat=c;renderTabs();renderList();}
function renderList(){
  var kw=document.getElementById('search').value.trim().toLowerCase();
  var html='';
  VIOLATIONS.forEach(function(v,idx){
    if(currentCat!=='全部'&&v.cat!==currentCat)return;
    if(kw&&v.name.toLowerCase().indexOf(kw)<0&&v.cat.toLowerCase().indexOf(kw)<0)return;
    var checked=selected[idx]?'checked':'';
    html+='<label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:'+(selected[idx]?'var(--bg-hover)':'var(--card-bg)')+';">'+
      '<input type="checkbox" '+checked+' onchange="toggle('+idx+',this.checked)" style="width:auto;accent-color:var(--primary);">'+
      '<span style="flex:1;font-size:14px;color:var(--text);">'+v.name+'</span>'+
      '<span style="font-size:12px;color:var(--text-muted);">罚款 '+(v.fine>0?'¥'+v.fine:'-')+'</span>'+
      (v.points>0?'<span class="grade-tag grade-pass" style="margin-left:4px;">扣'+v.points+'分</span>':'')+
      '</label>';
  });
  document.getElementById('violationList').innerHTML=html||'<p style="color:var(--text-muted);font-size:13px;">未找到匹配的违法行为。</p>';
}
function toggle(idx,on){
  if(on)selected[idx]=true;else delete selected[idx];
  renderList();
}
function calc(){
  var ids=Object.keys(selected);
  var res=document.getElementById('res');
  if(ids.length===0){res.innerHTML='<p style="color:var(--text-muted);">请勾选违法行为后再计算。</p>';document.getElementById('selectedBox').innerHTML='';return;}
  var totalFine=0,totalPoints=0,suspend=false,items=[];
  ids.forEach(function(id){
    var v=VIOLATIONS[id];
    totalFine+=v.fine;
    totalPoints+=v.points;
    if(v.suspend)suspend=true;
    items.push(v);
  });
  var risk=totalPoints>=12||suspend;
  var cls=risk?'tip-error':totalPoints>=6?'tip-warn':'tip-success';
  var riskText;
  if(suspend){
    riskText='⚠️ 含吊销驾驶证违法行为，将被吊销驾驶证并可能追究法律责任！';
  }else if(totalPoints>=24){
    riskText='⚠️ 累计记分达24分及以上，需重考科目一+科目三！';
  }else if(totalPoints>=12){
    riskText='⚠️ 累计记分达12分，驾驶证将被扣留，需参加满分学习并重考科目一！';
  }else if(totalPoints>=6){
    riskText='⚠️ 累计记分较高，请注意安全驾驶。';
  }else{
    riskText='✅ 记分未达12分，请继续保持安全驾驶。';
  }

  res.innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">¥'+totalFine.toLocaleString('zh-CN')+'</div><div class="label">累计罚款</div></div>'+
      '<div class="data-card"><div class="num">'+totalPoints+'</div><div class="label">累计记分</div></div>'+
      '<div class="data-card"><div class="num">'+items.length+'</div><div class="label">违法行为数</div></div>'+
      '<div class="data-card"><div class="num">'+(12-totalPoints>0?12-totalPoints:'已超')+'</div><div class="label">距12分剩余</div></div>'+
    '</div>'+
    '<div class="tip-box '+cls+'">'+riskText+'</div>';

  var html='<table><thead><tr><th>违法行为</th><th>类别</th><th>罚款</th><th>记分</th><th>备注</th></tr></thead><tbody>';
  items.forEach(function(v){
    html+='<tr><td>'+v.name+'</td><td>'+v.cat+'</td><td>'+(v.fine>0?'¥'+v.fine:'-')+'</td><td>'+(v.points>0?v.points:'-')+'</td><td>'+(v.suspend?'吊销':(v.note||''))+'</td></tr>';
  });
  html+='<tr style="font-weight:600;"><td colspan="2">合计</td><td>¥'+totalFine.toLocaleString('zh-CN')+'</td><td>'+totalPoints+'</td><td></td></tr></tbody></table>';
  document.getElementById('selectedBox').innerHTML=html;
}
function copyRes(){
  var t=document.getElementById('res').innerText+'\n'+document.getElementById('selectedBox').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function clearAll(){
  selected={};
  renderList();
  document.getElementById('res').innerHTML='';
  document.getElementById('selectedBox').innerHTML='';
  ToolBox.showToast(i18nText() ,'info');
}
renderTabs();
renderList();
</script>
</body>
</html>
