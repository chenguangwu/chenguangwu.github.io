<body>
<h1 class="sr-only">车辆折旧计算器（年限法）</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 车辆折旧计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>

  <span class="bc-current">车辆折旧计算器（年限法）</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2>📉 车辆折旧计算器（年限法）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入购车价、使用年限与残值率，选择折旧方法，生成逐年折旧明细与账面净值。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：车辆折旧计算器（年限法）。</p>
</div>


    <div class="input-row">
      <div>
        <label>购车价格 (元)</label>
        <input type="number" id="cost" value="200000" min="0" step="1000" oninput="calc()" aria-label="购车价格">
      </div>
      <div>
        <label>使用年限 (年)</label>
        <input type="number" id="life" value="5" min="1" step="1" oninput="calc()" aria-label="使用年限">
      </div>
      <div>
        <label>残值率 (%)</label>
        <input type="number" id="salvageRate" value="5" min="0" max="100" step="1" oninput="calc()" aria-label="残值率">
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <label>折旧方法</label>
      <select id="method" onchange="calc()">
        <option value="straight">直线法（平均年限法）</option>
        <option value="ddb">双倍余额递减法</option>
        <option value="syd">年数总和法</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算折旧</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制明细</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 直线法每年折旧相同；双倍余额递减法前期折旧多、最后两年转直线法并不低于残值；年数总和法按剩余年限占比递减。</div>
  </div>

  <div class="card">
    <h3>📋 折旧明细表</h3>
    <table>
      <thead><tr><th>年份</th><th>年初净值</th><th>年折旧额</th><th>累计折旧</th><th>年末净值</th></tr></thead>
      <tbody id="schedule"></tbody>
    </table>
  </div>
</div>

<script>
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function money(n){return '¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:2});}
function calc(){
  var cost=num('cost'),life=num('life'),sr=num('salvageRate');
  var method=document.getElementById('method').value;
  if(cost<=0||life<=0||life!==Math.floor(life)){
    document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效的购车价格（>0）和整数年限。</p>';
    document.getElementById('schedule').innerHTML='';
    return;
  }
  var salvage=cost*Math.min(100,Math.max(0,sr))/100;
  var rows=[];
  if(method==='straight'){
    var dep=(cost-salvage)/life;
    var acc=0,bv=cost;
    for(var y=1;y<=life;y++){var d=Math.min(dep,bv-salvage);acc+=d;bv-=d;rows.push({y:y,start:bv+d,dep:d,acc:acc,end:bv});}
  }else if(method==='ddb'){
    var rate=2/life,acc=0,bv=cost;
    for(var y=1;y<=life;y++){
      var d;
      if(y>life-2){d=(bv-salvage)/Math.max(1,(life-y+1));}
      else{d=bv*rate;}
      d=Math.min(d,bv-salvage);
      if(d<0)d=0;
      acc+=d;bv-=d;
      rows.push({y:y,start:bv+d,dep:d,acc:acc,end:bv});
    }
  }else{ // syd
    var sum=life*(life+1)/2,acc=0,bv=cost;
    for(var y=1;y<=life;y++){
      var d=(cost-salvage)*(life-y+1)/sum;
      acc+=d;bv-=d;
      rows.push({y:y,start:bv+d,dep:d,acc:acc,end:bv});
    }
  }
  var totalDep=cost-rows[rows.length-1].end;
  var finalBV=rows[rows.length-1].end;
  document.getElementById('res').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+money(cost)+'</div><div class="label">购车原值</div></div>'+
      '<div class="data-card"><div class="num">'+money(salvage)+'</div><div class="label">预计残值</div></div>'+
      '<div class="data-card"><div class="num">'+money(totalDep)+'</div><div class="label">累计折旧</div></div>'+
      '<div class="data-card"><div class="num">'+money(finalBV)+'</div><div class="label">第'+life+'年账面净值</div></div>'+
    '</div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(totalDep/cost*100)+'%"></div></div>'+
    '<p style="font-size:12px;color:var(--text-muted);margin-top:6px;">折旧进度：原值已折旧 <strong>'+Math.round(totalDep/cost*100)+'%</strong>，剩余净值 '+(100-Math.round(totalDep/cost*100))+'%。</p>';

  var html='';
  rows.forEach(function(r){
    html+='<tr><td>第 '+r.y+' 年</td><td>'+money(r.start)+'</td><td>'+money(r.dep)+'</td><td>'+money(r.acc)+'</td><td>'+money(r.end)+'</td></tr>';
  });
  document.getElementById('schedule').innerHTML=html;
}
function copyRes(){
  var t='车辆折旧明细\n'+document.getElementById('res').innerText+'\n\n'+(document.getElementById('schedule').innerText);
  ToolBox.copyText(t);
}
function resetAll(){
  document.getElementById('cost').value=200000;
  document.getElementById('life').value=5;
  document.getElementById('salvageRate').value=5;
  document.getElementById('method').value='straight';
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
calc();
</script>
</body>
