<body>
<h1 class="sr-only">集装箱装箱数量估算</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 集装箱装箱数量估算</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">集装箱装箱数量估算（交通）</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2>📦 集装箱装箱数量估算（交通）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">选择集装箱类型与纸箱尺寸/重量，按体积与重量分别计算最大装箱数，并尝试6种摆放方向取最优。</p>

    <div class="input-row">
      <div>
        <label>集装箱类型</label>
        <select id="container" onchange="calc()">
          <option value="20GP">20GP（20尺普箱）</option>
          <option value="40GP">40GP（40尺普箱）</option>
          <option value="40HQ">40HQ（40尺高箱）</option>
        </select>
      </div>
      <div>
        <label>纸箱长 (cm)</label>
        <input type="number" id="boxL" value="40" min="1" step="0.1" oninput="calc()" aria-label="纸箱长">
      </div>
      <div>
        <label>纸箱宽 (cm)</label>
        <input type="number" id="boxW" value="30" min="1" step="0.1" oninput="calc()" aria-label="纸箱宽">
      </div>
      <div>
        <label>纸箱高 (cm)</label>
        <input type="number" id="boxH" value="25" min="1" step="0.1" oninput="calc()" aria-label="纸箱高">
      </div>
      <div>
        <label>单箱毛重 (kg)</label>
        <input type="number" id="boxWt" value="8" min="0" step="0.1" oninput="calc()" aria-label="单箱毛重">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算装箱数</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 实际装箱还需考虑间隙、堆码强度与装卸损耗，结果为理论最大值。建议预留 5%-10% 余量。</div>
  </div>

  <div class="card">
    <h3>📋 集装箱内部规格参考</h3>
    <table>
      <thead><tr><th>类型</th><th>内部长(m)</th><th>内部宽(m)</th><th>内部高(m)</th><th>容积(m³)</th><th>最大载重(kg)</th></tr></thead>
      <tbody id="specTable"></tbody>
    </table>
  </div>
</div>

<script>
// 集装箱内部尺寸（近似值，米）与最大载重
var CONTAINERS={
  '20GP':{L:5.898,W:2.352,H:2.393,maxWt:28200,name:'20GP'},
  '40GP':{L:12.032,W:2.352,H:2.393,maxWt:28800,name:'40GP'},
  '40HQ':{L:12.032,W:2.352,H:2.698,maxWt:30000,name:'40HQ'}
};
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function calc(){
  var key=document.getElementById('container').value;
  var c=CONTAINERS[key];
  var bL=num('boxL'),bW=num('boxW'),bH=num('boxH'),bWt=num('boxWt');
  var res=document.getElementById('res');
  if(bL<=0||bW<=0||bH<=0){res.innerHTML='<p style="color:var(--danger);">请输入有效的纸箱长宽高（>0）。</p>';return;}
  // 尝试6种摆放方向，取装箱数最大
  var dims=[[bL,bW,bH],[bL,bH,bW],[bW,bL,bH],[bW,bH,bL],[bH,bL,bW],[bH,bW,bL]];
  var best={count:0,orient:null};
  dims.forEach(function(d){
    var nx=Math.floor(c.L*100/d[0]);
    var ny=Math.floor(c.W*100/d[1]);
    var nz=Math.floor(c.H*100/d[2]);
    var n=nx*ny*nz;
    if(n>best.count)best={count:n,orient:[nx,ny,nz],dims:d};
  });
  // 按体积
  var boxVol=bL*bW*bH/1e6;            // m³
  var contVol=c.L*c.W*c.H;            // m³
  var byVol=Math.floor(contVol/boxVol);
  // 按重量
  var byWt=bWt>0?Math.floor(c.maxWt/bWt):Infinity;
  var actual=Math.min(best.count,byWt);
  var volUsed=actual*boxVol;
  var wtUsed=actual*bWt;
  var volPct=volUsed/contVol*100;
  var wtPct=c.maxWt>0?wtUsed/c.maxWt*100:0;

  res.innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+best.count.toLocaleString('zh-CN')+'</div><div class="label">按体积最大装箱数</div></div>'+
      '<div class="data-card"><div class="num">'+(bWt>0?byWt.toLocaleString('zh-CN'):'不限')+'</div><div class="label">按重量最大装箱数</div></div>'+
      '<div class="data-card"><div class="num">'+actual.toLocaleString('zh-CN')+'</div><div class="label">实际建议装箱数</div></div>'+
      '<div class="data-card"><div class="num">'+volPct.toFixed(1)+'%</div><div class="label">容积利用率</div></div>'+
    '</div>'+
    '<p style="margin-top:10px;">最佳摆放方向：长边 '+best.dims[0]+'cm × 宽边 '+best.dims[1]+'cm × 高边 '+best.dims[2]+'cm，每层 '+best.orient[0]+'×'+best.orient[1]+'='+ (best.orient[0]*best.orient[1]) +' 箱，共 '+best.orient[2]+' 层。</p>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(volPct)+'%"></div></div>'+
    '<p style="font-size:12px;color:var(--text-muted);margin-top:6px;">总重量 '+wtUsed.toLocaleString('zh-CN')+' kg / '+c.maxWt.toLocaleString('zh-CN')+' kg（'+wtPct.toFixed(1)+'%）。'+(actual===byWt&&bWt>0?'<span style="color:var(--warning);">⚠️ 受重量限制</span>':'')+'</p>'+
    '<div class="tip-box '+(bWt>0&&actual===byWt?'tip-warn':'tip-success')+'">'+(bWt>0&&actual===byWt?'⚠️ 装箱数受最大载重限制，建议减轻单箱重量或换用更大载重箱型。':'✅ 装箱数受体积限制，空间利用率较优。')+'</div>';
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function resetAll(){
  document.getElementById('container').value='20GP';
  document.getElementById('boxL').value=40;
  document.getElementById('boxW').value=30;
  document.getElementById('boxH').value=25;
  document.getElementById('boxWt').value=8;
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
function renderSpecs(){
  var html='';
  Object.keys(CONTAINERS).forEach(function(k){
    var c=CONTAINERS[k];
    var vol=(c.L*c.W*c.H).toFixed(1);
    html+='<tr><td>'+c.name+'</td><td>'+c.L+'</td><td>'+c.W+'</td><td>'+c.H+'</td><td>'+vol+'</td><td>'+c.maxWt.toLocaleString('zh-CN')+'</td></tr>';
  });
  document.getElementById('specTable').innerHTML=html;
}
renderSpecs();
calc();
</script>
</body>
