<body>
<h1 class="sr-only">刹车距离计算器</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 刹车距离计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 交通运输</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">刹车距离计算器</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2>🛑 刹车距离计算器</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">制动距离 = v² / [2·g·(μ+坡度)]</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于车速、反应时间、路面附着系数与坡度，计算反应距离、制动距离和总停车距离。</p>

    <div class="input-row">
      <div>
        <label>车速 (km/h)</label>
        <input type="number" id="speed" value="120" min="0" step="1" oninput="calc()" aria-label="车速">
      </div>
      <div>
        <label>反应时间 (秒)</label>
        <input type="number" id="reaction" value="0.75" min="0" step="0.05" oninput="calc()" aria-label="反应时间">
      </div>
      <div>
        <label>坡度 (%) 正为上坡</label>
        <input type="number" id="slope" value="0" step="0.5" oninput="calc()" aria-label="坡度百分比，正为上坡">
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <label>路面状况（附着系数）</label>
      <select id="road" onchange="calc()">
        <option value="0.75">干燥沥青/混凝土（μ≈0.75）</option>
        <option value="0.60">潮湿沥青（μ≈0.60）</option>
        <option value="0.45">积水路面（μ≈0.45）</option>
        <option value="0.20">积雪路面（μ≈0.20）</option>
        <option value="0.10">结冰路面（μ≈0.10）</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算停车距离</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 制动距离 = v² / [2·g·(μ+坡度)]（v 单位 m/s，g=9.81）；反应距离 = v × 反应时间。下坡（负坡度）会显著延长制动距离。</div>
  </div>

  <div class="card">
    <h3>📉 不同速度下的制动距离对比</h3>
    <div id="chartBox"></div>
  </div>
</div>

<script>
var G=9.81;
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function calc(){
  var v_kmh=num('speed'),t=num('reaction'),mu=parseFloat(document.getElementById('road').value),grade=num('slope')/100;
  if(v_kmh<=0||t<0){
    document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效车速（>0）和反应时间。</p>';
    document.getElementById('chartBox').innerHTML='';
    return;
  }
  var v=v_kmh/3.6;                 // m/s
  var rd=v*t;                      // 反应距离
  var denom=2*G*(mu+grade);
  var bd=denom>0?v*v/denom:Infinity; // 制动距离
  var total=rd+bd;
  var cls=total<40?'grade-excellent':total<80?'grade-good':total<150?'grade-pass':'grade-fail';

  document.getElementById('res').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+rd.toFixed(1)+'</div><div class="label">反应距离 (m)</div></div>'+
      '<div class="data-card"><div class="num">'+bd.toFixed(1)+'</div><div class="label">制动距离 (m)</div></div>'+
      '<div class="data-card"><div class="num">'+total.toFixed(1)+'</div><div class="label">总停车距离 (m)</div></div>'+
      '<div class="data-card"><div class="num">'+(total/1000*v_kmh).toFixed(2)+'</div><div class="label">距离/车速比</div></div>'+
    '</div>'+
    '<p style="margin-top:10px;">风险等级：<span class="grade-tag '+cls+'">'+riskLabel(total)+'</span></p>';

  drawChart(mu,grade,t);
}
function riskLabel(d){
  return d<40?'安全 (<40m)':d<80?'正常 (40-80m)':d<150?'偏长 (80-150m)':'危险 (>150m)';
}
function drawChart(mu,grade,t){
  var speeds=[30,50,60,80,100,120];
  var max=0,data=[];
  speeds.forEach(function(s){
    var v=s/3.6;
    var d=v*t+v*v/(2*G*(mu+grade));
    data.push({s:s,d:d});
    if(d>max)max=d;
  });
  var html='<div style="margin-top:8px;">';
  data.forEach(function(it){
    var w=Math.round(it.d/max*100);
    var cls=it.d<40?'#10B981':it.d<80?'#3B82F6':it.d<150?'#F59E0B':'#EF4444';
    html+='<div class="bar-row"><div class="bar-lbl">'+it.s+' km/h</div>'+
      '<div class="bar-bg"><div class="bar-fill" style="width:'+w+'%;background:'+cls+';">'+it.d.toFixed(1)+'m</div></div></div>';
  });
  html+='</div>';
  document.getElementById('chartBox').innerHTML=html;
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function resetAll(){
  document.getElementById('speed').value=120;
  document.getElementById('reaction').value=0.75;
  document.getElementById('slope').value=0;
  document.getElementById('road').value='0.75';
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
calc();
</script>
</body>
