<body>
<h1 class="sr-only">行驶时间估算</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 行驶时间估算</span>

</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">行驶时间估算</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2 data-zh="🚗 行驶时间估算">🚗 Estimate Speed Time</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入距离、平均速度与中途休息，计算驾驶时长、休息时长、总耗时及预计到达时间。">Estimate Speed Time is a free online tool.</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具用于单位与格式换算，换算因子依据国际单位制(SI)及相关标准定义，结果保留输入精度；纯前端本地处理。 工具名称：行驶时间估算 - 交通运输在线工具。</p>
</div>


    <div class="input-row">
      <div>
        <label>行驶距离 (km)</label>
        <input type="number" id="distance" value="400" min="0" step="any" oninput="calc()" aria-label="行驶距离">
      </div>
      <div>
        <label>平均速度 (km/h)</label>
        <input type="number" id="speed" value="100" min="1" step="any" oninput="calc()" aria-label="平均速度">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>休息次数</label>
        <input type="number" id="restCount" value="2" min="0" step="1" oninput="calc()" aria-label="休息次数">
      </div>
      <div>
        <label>每次休息 (分钟)</label>
        <input type="number" id="restMin" value="20" min="0" step="5" oninput="calc()" aria-label="每次休息分钟">
      </div>
      <div>
        <label>出发时间</label>
        <input type="time" id="depart" value="08:00" onchange="calc()" aria-label="出发时间">
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <label>道路类型（参考限速，可调整平均速度）</label>
      <select id="roadType" onchange="applyRoad()">
        <option value="0">自定义</option>
        <option value="120">高速公路（限速 120 km/h，建议均速 ~100）</option>
        <option value="100">国道/快速路（限速 100 km/h，建议均速 ~70）</option>
        <option value="80">省道（限速 80 km/h，建议均速 ~55）</option>
        <option value="60">城市主干道（限速 60 km/h，建议均速 ~35）</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 估算时间</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 建议：连续驾驶 4 小时应休息不少于 20 分钟。本工具按距离÷平均速度估算纯驾驶时间，实际受路况、天气影响。</div>
  </div>
</div>

<script>
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function applyRoad(){
  var v=parseFloat(document.getElementById('roadType').value);
  if(v>0){
    var sug=v>=120?100:v>=100?70:v>=80?55:35;
    document.getElementById('speed').value=sug;
    calc();
    ToolBox.showToast(i18nText('toast.saved', '已设置建议平均速度 '+sug+' km/h'),'info');
  }
}
function fmtHM(mins){
  mins=Math.round(mins);
  var h=Math.floor(mins/60),m=mins%60;
  return h+'小时'+(m>0?m+'分钟':'');
}
function addMinutes(timeStr,mins){
  var p=timeStr.split(':');var d=new Date();d.setHours(+p[0],+p[1],0,0);
  d=new Date(d.getTime()+mins*60000);
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function calc(){
  var d=num('distance'),s=num('speed');
  var rc=num('restCount'),rm=num('restMin');
  var depart=document.getElementById('depart').value||'08:00';
  if(d<=0||s<=0){document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效的距离（>0）和平均速度（>0）。</p>';return;}
  var driveMin=d/s*60;
  var restMin=rc*rm;
  var totalMin=driveMin+restMin;
  var eta=addMinutes(depart,totalMin);
  var cls=totalMin<240?'grade-excellent':totalMin<480?'grade-good':'grade-pass';

  document.getElementById('res').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+fmtHM(driveMin)+'</div><div class="label">纯驾驶时间</div></div>'+
      '<div class="data-card"><div class="num">'+fmtHM(restMin)+'</div><div class="label">休息时间</div></div>'+
      '<div class="data-card"><div class="num">'+fmtHM(totalMin)+'</div><div class="label">总耗时</div></div>'+
      '<div class="data-card"><div class="num">'+eta+'</div><div class="label">预计到达</div></div>'+
    '</div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(100,Math.round(driveMin/totalMin*100))+'%"></div></div>'+
    '<p style="font-size:12px;color:var(--text-muted);margin-top:6px;">驾驶占总时长 <strong>'+Math.round(driveMin/totalMin*100)+'%</strong>，休息占 '+Math.round(restMin/totalMin*100)+'%。</p>'+
    '<p style="margin-top:8px;">行程强度：<span class="grade-tag '+cls+'">'+(totalMin<240?'轻松 (<4h)':totalMin<480?'适中 (4-8h)':'较长 (>8h)')+'</span>'+
    (driveMin>=240?' &nbsp;<span class="grade-tag grade-fail">⚠️ 连续驾驶偏长，建议增加休息</span>':'')+'</p>';
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function resetAll(){
  document.getElementById('distance').value=400;
  document.getElementById('speed').value=100;
  document.getElementById('restCount').value=2;
  document.getElementById('restMin').value=20;
  document.getElementById('depart').value='08:00';
  document.getElementById('roadType').value='0';
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
calc();
</script>
</body>
