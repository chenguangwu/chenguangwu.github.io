<body>
<h1 class="sr-only">交通量（高峰小时系数）计算</h1>
<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 交通量高峰小时系数计算</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>



<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-sep">‹</span>
  <span class="bc-current">交通量（高峰小时系数）计算</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2 data-zh="📊 交通量（高峰小时系数）计算">📊 Traffic Volume (Peak Hour Factor) Calculator</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入24小时交通量或高峰小时4个15分钟流量，计算 PHF、日交通量与 AADT 估计，并生成流量分布图。">Compute traffic volume and peak hour factor (PHF).</p>

    <div class="tabs">
      <button class="tab-btn active" type="button" onclick="switchTab('hourly',this)">24小时流量</button>
      <button class="tab-btn" type="button" onclick="switchTab('peak',this)">高峰15分钟</button>
    </div>

    <!-- Tab 1: 24h -->
    <div class="tab-content active" id="tab-hourly">
      <label>24小时交通量（每行一个数，按0-23时顺序，用逗号/空格/换行分隔）</label>
      <textarea id="hourly" rows="5" placeholder="如：120,80,50,40,60,180,450,780,820,700,650,720,760,690,640,720,820,950,1050,880,620,400,260,160">120,80,50,40,60,180,450,780,820,700,650,720,760,690,640,720,820,950,1050,880,620,400,260,160</textarea>
      <div class="toolbar" style="margin-top:12px;">
        <button class="btn primary" type="button" onclick="calcHourly()">🧮 计算并绘图</button>
        <button class="btn" type="button" onclick="loadSample()">📌 填入示例</button>
        <button class="btn" type="button" onclick="document.getElementById('hourly').value='';calcHourly()">🗑️ 清空</button>
      </div>
    </div>

    <!-- Tab 2: peak 15min -->
    <div class="tab-content" id="tab-peak">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">输入高峰小时内4个15分钟流量，计算 PHF = 高峰小时总量 / (4 × 最大15分钟流量)。</p>
      <div class="input-row">
        <div><label>第1个15分钟</label><input type="number" id="q1" value="320" min="0" step="1" oninput="calcPeak()"></div>
        <div><label>第2个15分钟</label><input type="number" id="q2" value="380" min="0" step="1" oninput="calcPeak()"></div>
        <div><label>第3个15分钟</label><input type="number" id="q3" value="410" min="0" step="1" oninput="calcPeak()"></div>
        <div><label>第4个15分钟</label><input type="number" id="q4" value="350" min="0" step="1" oninput="calcPeak()"></div>
      </div>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 PHF 取值 0.25~1.0，越接近1表示流量越均匀；AADT（年均日交通量）≈ 观测日交通量，需长期多日观测才能精确估算。</div>
  </div>

  <div class="card">
    <h3>📈 24小时流量分布图</h3>
    <div id="chartBox"></div>
  </div>
</div>

<script>
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='peak')calcPeak();else calcHourly();
}
function parseNums(str){
  return String(str).split(/[\s,，;；\n]+/).map(function(x){return parseFloat(x);}).filter(function(x){return !isNaN(x)&&x>=0;});
}
function calcHourly(){
  var arr=parseNums(document.getElementById('hourly').value);
  var res=document.getElementById('res');
  var chart=document.getElementById('chartBox');
  if(arr.length===0){
    res.innerHTML='<p style="color:var(--text-muted);">请输入24小时交通量数据。</p>';
    chart.innerHTML='';
    return;
  }
  var total=arr.reduce(function(a,b){return a+b;},0);
  var peak=Math.max.apply(null,arr);
  var peakHour=arr.indexOf(peak);
  var avg=total/arr.length;
  var peakPct=total>0?peak/total*100:0;
  // 估计AADT（按单日观测，乘以月/周修正省略，直接取日总量）
  var aadt=total;
  var phfEst=peak>0?(avg>0?peak/(4*(peak/4)):0):0; // 仅作示意，精确PHF需15分钟数据

  res.innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+total.toLocaleString('zh-CN')+'</div><div class="label">日交通量 (veh)</div></div>'+
      '<div class="data-card"><div class="num">'+peak.toLocaleString('zh-CN')+'</div><div class="label">高峰小时流量</div></div>'+
      '<div class="data-card"><div class="num">'+Math.round(avg).toLocaleString('zh-CN')+'</div><div class="label">小时平均流量</div></div>'+
      '<div class="data-card"><div class="num">'+aadt.toLocaleString('zh-CN')+'</div><div class="label">AADT估计 (veh/日)</div></div>'+
    '</div>'+
    '<p style="margin-top:10px;">高峰时段：<strong>'+(peakHour<10?'0':'')+peakHour+':00 - '+(peakHour+1<10?'0':'')+(peakHour+1)+':00</strong>，占全日 <strong>'+peakPct.toFixed(1)+'%</strong></p>';

  drawChart(arr,peak);
}
function drawChart(arr,peak){
  var W=720,H=240,pad=30,bw=(W-pad*2)/arr.length;
  var max=Math.max.apply(null,arr)*1.1||1;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;">';
  // grid lines
  for(var g=0;g<=4;g++){
    var y=H-pad-(H-pad*2)*g/4;
    svg+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    svg+='<text x="4" y="'+(y+3)+'" font-size="10" fill="var(--text-muted)">'+Math.round(max*g/4)+'</text>';
  }
  arr.forEach(function(v,i){
    var h=(H-pad*2)*v/max;
    var x=pad+i*bw;
    var y=H-pad-h;
    var color=v===peak?'#EF4444':'#FF6B35';
    svg+='<rect x="'+(x+1)+'" y="'+y+'" width="'+(bw-2)+'" height="'+h+'" fill="'+color+'" rx="2"/>';
    if(i%3===0||v===peak){
      svg+='<text x="'+(x+bw/2)+'" y="'+(H-pad+12)+'" font-size="9" fill="var(--text-muted)" text-anchor="middle">'+i+'</text>';
    }
  });
  svg+='<text x="'+(W/2)+'" y="'+(H-2)+'" font-size="10" fill="var(--text-muted)" text-anchor="middle">小时 (0-23)</text>';
  svg+='</svg>';
  svg+='<p style="font-size:12px;color:var(--text-muted);">红色柱为高峰小时。注：精确PHF需高峰小时内15分钟流量数据（见上方"高峰15分钟"页签）。</p>';
  document.getElementById('chartBox').innerHTML=svg;
}
function calcPeak(){
  var qs=[num('q1'),num('q2'),num('q3'),num('q4')];
  var sum=qs.reduce(function(a,b){return a+b;},0);
  var max=Math.max.apply(null,qs);
  var phf=max>0?sum/(4*max):0;
  var res=document.getElementById('res');
  if(sum<=0){res.innerHTML='<p style="color:var(--text-muted);">请输入15分钟流量数据。</p>';document.getElementById('chartBox').innerHTML='';return;}
  var cls=phf>=0.9?'grade-excellent':phf>=0.8?'grade-good':phf>=0.7?'grade-pass':'grade-fail';
  res.innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+sum.toLocaleString('zh-CN')+'</div><div class="label">高峰小时总量</div></div>'+
      '<div class="data-card"><div class="num">'+max.toLocaleString('zh-CN')+'</div><div class="label">最大15分钟流量</div></div>'+
      '<div class="data-card"><div class="num">'+phf.toFixed(3)+'</div><div class="label">PHF 高峰小时系数</div></div>'+
      '<div class="data-card"><div class="num">'+(max*4).toLocaleString('zh-CN')+'</div><div class="label">等效小时流率</div></div>'+
    '</div>'+
    '<p style="margin-top:10px;">流量均匀性：<span class="grade-tag '+cls+'">'+(phf>=0.9?'均匀':phf>=0.8?'较均匀':phf>=0.7?'波动明显':'波动剧烈')+'</span></p>';
  // 绘制4个柱
  var arr=qs;
  var peak=max;
  var W=480,H=180,pad=30,bw=(W-pad*2)/4;
  var mx=peak*1.1||1;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;">';
  arr.forEach(function(v,i){
    var h=(H-pad*2)*v/mx;
    var x=pad+i*bw;
    var y=H-pad-h;
    svg+='<rect x="'+(x+4)+'" y="'+y+'" width="'+(bw-8)+'" height="'+h+'" fill="'+(v===peak?'#EF4444':'#FF6B35')+'" rx="3"/>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" fill="var(--text)" text-anchor="middle">'+v+'</text>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(H-pad+12)+'" font-size="10" fill="var(--text-muted)" text-anchor="middle">Q'+(i+1)+'</text>';
  });
  svg+='</svg>';
  document.getElementById('chartBox').innerHTML=svg;
}
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function loadSample(){
  document.getElementById('hourly').value='120,80,50,40,60,180,450,780,820,700,650,720,760,690,640,720,820,950,1050,880,620,400,260,160';
  calcHourly();
  ToolBox.showToast(i18nText() ,'info');
}
calcHourly();
</script>
</body>
