<body>
<h1 class="sr-only">停车费用计算器</h1>
<div class="nav">

  <span class="bc-current">停车费用计算器（交通）</span>
</nav>
<div class="container">
  <div class="card tool-card-accent" style="--tool-accent:#FF6B35;--tool-accent-dark:#E55A25;">
    <h2 data-zh="🅿️ 停车费用计算器（交通）">🅿️ Parking Fee Calculator - ( Traffic )</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="按首小时价、后续每小时价与每日封顶价，计算任意时长的停车总费用。">Parking Fee Calculator - ( Traffic ) - calculate online, free and accurate.</p>

    <div class="input-row">
      <div>
        <label>停车时长 (小时)</label>
        <input type="number" id="hours" value="0" min="0" step="0.5" oninput="calc()" aria-label="停车小时数">
      </div>
      <div>
        <label>额外分钟</label>
        <input type="number" id="minutes" value="30" min="0" max="59" step="1" oninput="calc()" aria-label="额外分钟">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>首小时费用 (元)</label>
        <input type="number" id="firstHour" value="10" min="0" step="0.5" oninput="calc()" aria-label="首小时费用">
      </div>
      <div>
        <label>后续每小时 (元)</label>
        <input type="number" id="afterHour" value="5" min="0" step="0.5" oninput="calc()" aria-label="后续每小时">
      </div>
      <div>
        <label>每日封顶 (元, 0=不封顶)</label>
        <input type="number" id="dailyCap" value="60" min="0" step="1" oninput="calc()" aria-label="每日封顶">
      </div>
    </div>

    <div class="checkbox-row">
      <label><input type="checkbox" id="ceilMode" checked onchange="calc()"> 不足1小时按1小时计费</label>
      <label><input type="checkbox" id="firstHourCount" checked onchange="calc()"> 首小时按1小时计入时长</label>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算费用</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>
    <div class="tip-box tip-info">💡 计费规则：首小时按首小时价；超出部分按后续每小时价，不足1小时按1小时计（可关闭）；超过24小时则按天拆分并应用每日封顶。</div>
  </div>

  <div class="card">
    <h3>🧾 计费明细</h3>
    <div id="detailBox"></div>
  </div>
</div>

<script>
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function money(n){return '¥'+n.toFixed(2);}
function calc(){
  var h=num('hours'),min=num('minutes');
  var firstHour=num('firstHour'),afterHour=num('afterHour'),cap=num('dailyCap');
  var ceilMode=document.getElementById('ceilMode').checked;
  var firstCount=document.getElementById('firstHourCount').checked;
  if(h<0||min<0){document.getElementById('res').innerHTML='<p style="color:var(--danger);">请输入有效的停车时长。</p>';document.getElementById('detailBox').innerHTML='';return;}
  // 总小时（按需向上取整处理分钟）
  var totalHours=h+min/60;
  if(totalHours<=0){document.getElementById('res').innerHTML='<p style="color:var(--text-muted);">请输入停车时长（大于0）。</p>';document.getElementById('detailBox').innerHTML='';return;}

  var details=[];
  var remaining=totalHours;
  var fullDays=Math.floor(remaining/24);
  remaining=remaining-fullDays*24;
  var totalFee=0;
  var capEnabled=cap>0;

  function dayFee(hours,label){
    if(hours<=0)return 0;
    var billHours=ceilMode?Math.ceil(hours):hours;
    var fee;
    var usedHours=firstCount?1:Math.min(1,hours);
    var fhHours=firstCount?(hours<1?hours:1):Math.min(1,hours);
    // 简化：首小时（不足1小时仍按首小时价且计1小时当首小时计开启）
    if(firstCount){
      // 首小时价覆盖第1小时
      var after=Math.max(0,billHours-1);
      fee=firstHour+after*afterHour;
    }else{
      // 第1小时按比例计首小时价
      var firstPart=Math.min(1,billHours);
      var after=Math.max(0,billHours-1);
      fee=firstHour*firstPart+after*afterHour;
    }
    if(capEnabled&&fee>cap)fee=cap;
    details.push({label:label,hours:hours,billHours:billHours,fee:fee});
    return fee;
  }
  for(var d=0;d<fullDays;d++){totalFee+=dayFee(24,'第 '+(d+1)+' 天（完整24h）');}
  if(remaining>0){totalFee+=dayFee(remaining,(fullDays>0?'第 '+(fullDays+1)+' 天（剩余 '+remaining.toFixed(2)+'h）':'当日 '+remaining.toFixed(2)+'h'));}

  var avgPerHour=totalHours>0?totalFee/totalHours:0;
  var capNote=capEnabled?'每日封顶 ¥'+cap.toFixed(2):'未设每日封顶';

  document.getElementById('res').innerHTML=
    '<div class="data-grid">'+
      '<div class="data-card"><div class="num">'+money(totalFee)+'</div><div class="label">总停车费</div></div>'+
      '<div class="data-card"><div class="num">'+totalHours.toFixed(2)+'</div><div class="label">总时长 (h)</div></div>'+
      '<div class="data-card"><div class="num">'+money(avgPerHour)+'</div><div class="label">平均每小时</div></div>'+
      '<div class="data-card"><div class="num">'+(fullDays+(remaining>0?1:0))+'</div><div class="label">计费天数</div></div>'+
    '</div>'+
    '<div class="tip-box tip-success">✅ '+capNote+'；总费用 '+money(totalFee)+'。</div>';

  var html='<table><thead><tr><th>时段</th><th>实际时长(h)</th><th>计费时长(h)</th><th>费用</th></tr></thead><tbody>';
  details.forEach(function(it){
    html+='<tr><td>'+it.label+'</td><td>'+it.hours.toFixed(2)+'</td><td>'+it.billHours.toFixed(2)+'</td><td>'+money(it.fee)+'</td></tr>';
  });
  html+='<tr style="font-weight:600;"><td colspan="3">合计</td><td>'+money(totalFee)+'</td></tr></tbody></table>';
  document.getElementById('detailBox').innerHTML=html;
}
function copyRes(){
  var t=document.getElementById('res').innerText;
  if(!t.trim()){ToolBox.showToast(i18nText() ,'warning');return;}
  ToolBox.copyText(t, i18nText());
}
function resetAll(){
  document.getElementById('hours').value=0;
  document.getElementById('minutes').value=30;
  document.getElementById('firstHour').value=10;
  document.getElementById('afterHour').value=5;
  document.getElementById('dailyCap').value=60;
  document.getElementById('ceilMode').checked=true;
  document.getElementById('firstHourCount').checked=true;
  calc();
  ToolBox.showToast(i18nText() ,'info');
}
calc();
</script>
</body>
