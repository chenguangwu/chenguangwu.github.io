<h1 class='sr-only'>纸箱外箱尺寸计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 纸箱外箱尺寸计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>📦 纸箱外箱尺寸计算</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">外箱尺寸 = 产品内尺寸 + 2×(缓冲厚度 + 纸板厚度)</div>
    </div>
    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据产品内尺寸、缓冲材料厚度和纸板厚度，计算纸箱外箱尺寸、体积与空间利用率。</p>
    <div class='input-row'>
      <div><label for='inL'>产品内长（mm）</label><input type='number' id='inL' value='300' min='0' step='1'></div>
      <div><label for='inW'>产品内宽（mm）</label><input type='number' id='inW' value='200' min='0' step='1'></div>
      <div><label for='inH'>产品内高（mm）</label><input type='number' id='inH' value='150' min='0' step='1'></div>
    </div>
    <div class='input-row'>
      <div><label for='pad'>每边缓冲厚度（mm）</label><input type='number' id='pad' value='10' min='0' step='1'></div>
      <div><label for='board'>纸板厚度（mm）</label><input type='number' id='board' value='5' min='0' step='0.5'></div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>外箱尺寸 = 产品内尺寸 + 2×(缓冲厚度 + 纸板厚度)。结果向上取整到毫米，便于实际选材。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_carton_size';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const inL = get('inL'), inW = get('inW'), inH = get('inH');
    const pad = get('pad'), board = get('board');
    const el = ToolBox.$('result');
    if(inL < 0 || inW < 0 || inH < 0 || pad < 0 || board < 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效非负数。</p>';
      return;
    }
    const add = 2 * (pad + board);
    const outL = Math.ceil(inL + add);
    const outW = Math.ceil(inW + add);
    const outH = Math.ceil(inH + add);
    const innerVol = inL * inW * inH / 1000000000;
    const outerVol = outL * outW * outH / 1000000000;
    const util = outerVol > 0 ? (innerVol / outerVol * 100) : 0;
    el.innerHTML =
      '<p>外箱尺寸（长×宽×高）：<strong>' + outL + ' × ' + outW + ' × ' + outH + '</strong> mm</p>' +
      '<p>外箱体积：<strong>' + ToolBox.formatNumber(outerVol, 4) + '</strong> m³</p>' +
      '<p>产品净体积：<strong>' + ToolBox.formatNumber(innerVol, 4) + '</strong> m³</p>' +
      '<p>空间利用率：<strong>' + ToolBox.formatNumber(util, 1) + '</strong> %</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        inL: ToolBox.$('inL').value,
        inW: ToolBox.$('inW').value,
        inH: ToolBox.$('inH').value,
        pad: ToolBox.$('pad').value,
        board: ToolBox.$('board').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      ['inL','inW','inH','pad','board'].forEach(function(id){
        if(data[id] !== undefined) ToolBox.$(id).value = data[id];
      });
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['inL','inW','inH','pad','board'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
