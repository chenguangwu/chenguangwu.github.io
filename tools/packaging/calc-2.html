<h1 class='sr-only'>缓冲材料厚度计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 缓冲材料厚度计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2 data-zh="🛡️ 缓冲材料厚度计算">🛡️ Cushioning Material Thickness Calculator</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t = (H/G)·C</div>
    </div>
    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;' data-zh="根据跌落高度、产品脆值（G 因子）和缓冲材料系数，估算包装缓冲垫所需厚度。">Compute cushioning thickness for packaging.</p>
    <div class='input-row'>
      <div>
        <label for='dropH'>跌落高度（cm）</label>
        <input type='number' id='dropH' value='60' min='0' step='1'>
      </div>
      <div>
        <label for='gValue'>产品脆值 G</label>
        <input type='number' id='gValue' value='50' min='1' step='1'>
      </div>
      <div>
        <label for='cValue'>缓冲材料系数 C</label>
        <input type='number' id='cValue' value='2.5' min='0.1' step='0.1'>
      </div>
    </div>
    <div class='input-row'>
      <div>
        <label for='weight'>产品重量（kg，可选）</label>
        <input type='number' id='weight' value='' min='0' step='0.1' placeholder='用于计算动载荷'>
      </div>
      <div>
        <label for='area'>接触面积（cm²，可选）</label>
        <input type='number' id='area' value='' min='0' step='1' placeholder='用于计算动载荷'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>材料系数 C 参考：EPE 珍珠棉 2.0~2.8，EPS 泡沫 3.0~4.0，气泡膜/气垫 4.0~5.0。公式 t = (H/G)·C。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_cushion';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const H = get('dropH');
    const G = get('gValue');
    const C = get('cValue');
    const weight = get('weight');
    const area = get('area');
    const el = ToolBox.$('result');
    if(H < 0 || G <= 0 || C <= 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>';
      return;
    }
    const tCm = (H / G) * C;
    const tMm = tCm * 10;
    let stressHtml = '';
    if(weight > 0 && area > 0){
      const stressKPa = (weight * 9.80665 * G) / (area / 10000) / 1000;
      stressHtml = '<p>缓冲面动应力：<strong>' + ToolBox.formatNumber(stressKPa, 2) + '</strong> kPa</p>';
    }
    el.innerHTML =
      '<p>建议缓冲厚度：<strong>' + ToolBox.formatNumber(tMm, 1) + '</strong> mm（<strong>' + ToolBox.formatNumber(tCm, 2) + '</strong> cm）</p>' +
      stressHtml;
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        H: ToolBox.$('dropH').value,
        G: ToolBox.$('gValue').value,
        C: ToolBox.$('cValue').value,
        w: ToolBox.$('weight').value,
        a: ToolBox.$('area').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.H) ToolBox.$('dropH').value = data.H;
      if(data.G) ToolBox.$('gValue').value = data.G;
      if(data.C) ToolBox.$('cValue').value = data.C;
      if(data.w !== undefined) ToolBox.$('weight').value = data.w;
      if(data.a !== undefined) ToolBox.$('area').value = data.a;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['dropH','gValue','cValue','weight','area'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
