<div class="container">
  <div class="card">
    <h2>🚗 二手车估价器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按新车价、车龄与里程估算二手车参考价格。</p>

    <div class="input-row">
      <label>新车厂商指导价（元）</label>
      <input type="number" id="newPrice" value="120000" min="0" step="100" oninput="calc()">
    </div>
    <div class="input-row">
      <label>车龄（年）</label>
      <input type="number" id="age" value="3" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>累计里程（万公里）</label>
      <input type="number" id="mileage" value="3" min="0" step="0.1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">估算金额</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function calc() {
  const newPrice = parseFloat(document.getElementById('newPrice').value) || 0;
  const age = parseFloat(document.getElementById('age').value) || 0;
  const mileage = parseFloat(document.getElementById('mileage').value) || 0;

  const ageRate = 1 - age * 0.05;
  const mileRate = 1 - mileage * 0.03;
  const usedRate = clamp(Math.min(ageRate, mileRate), 0.45, 1);
  const value = newPrice * usedRate;

  document.getElementById('result').innerHTML =
    `<p>成新率：<strong>${(usedRate * 100).toFixed(1)}%</strong></p>` +
    `<p>估算二手价：<strong style="color:var(--primary)">${value.toFixed(2)} 元</strong></p>` +
    `<p>说明：车龄折旧按 5%/年，里程折旧按 3%/万公里，仅作参考。</p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText() , 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

calc();
</script>
