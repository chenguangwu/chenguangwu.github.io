</nav>
<div class="container">
  <div class="card">
    <h2>💳 购车费用计算器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算车价落地总花费（含购置税、保险、上牌）。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算依据通用财务与货币规则，具体以最新法规与当地政策为准，结果仅供参考。 工具名称：购车费用计算器。</p>
</div>


    <div class="input-row">
      <label>裸车价（元）</label>
      <input type="number" id="price" value="150000" min="0" step="100" oninput="calc()">
    </div>
    <div class="input-row">
      <label>购置税率（%）</label>
      <input type="number" id="taxRate" value="10" min="0" step="0.1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>保险费（元）</label>
      <input type="number" id="insurance" value="8000" min="0" step="1" oninput="calc()">
    </div>
    <div class="input-row">
      <label>上牌费（元）</label>
      <input type="number" id="plate" value="800" min="0" step="1" oninput="calc()">
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算落地价</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function calc() {
  const price = parseFloat(document.getElementById('price').value) || 0;
  const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
  const insurance = parseFloat(document.getElementById('insurance').value) || 0;
  const plate = parseFloat(document.getElementById('plate').value) || 0;

  const tax = price * taxRate / 100;
  const total = price + tax + insurance + plate;

  document.getElementById('result').innerHTML =
    `<p>购置税：<strong>${tax.toFixed(2)} 元</strong></p>` +
    `<p>保险费：<strong>${insurance.toFixed(2)} 元</strong></p>` +
    `<p>上牌费：<strong>${plate.toFixed(2)} 元</strong></p>` +
    `<p>落地总价：<strong style="color:var(--primary)">${total.toFixed(2)} 元</strong></p>`;
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText() , 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText());
}

calc();
</script>
