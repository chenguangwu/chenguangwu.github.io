<div class="container">
  <div class="card">
    <h2>📦 经济订货批量(EOQ)计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">基于经典EOQ模型计算最优订货批量，最小化订货成本与持有成本之和</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">EOQ = √(2DS/H)</div>
      <p class="formula-desc">基于经典EOQ模型计算最优订货批量，最小化订货成本与持有成本之和</p>
    </div>

    <div class="input-row">
      <div>
        <label>年需求量 D（件/年）</label>
        <input type="number" id="demand" value="12000" min="0" step="100" oninput="calc()">
      </div>
      <div>
        <label>每次订货成本 S（元/次）</label>
        <input type="number" id="orderCost" value="100" min="0" step="10" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>单位年持有成本 H（元/件·年）</label>
        <input type="number" id="holdCost" value="12" min="0" step="0.5" oninput="calc()">
      </div>
      <div>
        <label>订货提前期（天）</label>
        <input type="number" id="leadTime" value="7" min="0" step="1" oninput="calc()">
      </div>
    </div>

    <div class="input-row">
      <div>
        <label>单价（元/件，可选）</label>
        <input type="number" id="unitPrice" value="0" min="0" step="1" oninput="calc()">
      </div>
      <div>
        <label>全年工作日（天，用于日需求）</label>
        <input type="number" id="workDays" value="365" min="1" step="1" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" type="button" onclick="calc()">🧮 计算</button>
      <button class="btn" type="button" onclick="copyRes()">📋 复制结果</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 重置</button>
    </div>

    <div class="result-box" id="res"></div>

    <div class="tip-box tip-info">📖 公式：EOQ = √(2·D·S / H)；最优总成本（订货+持有）= √(2·D·S·H)；订货次数 = D / EOQ；再订货点 R = 日需求 × 提前期。在EOQ点，订货成本 = 持有成本。</div>
  </div>
</div>

<script>
function fmt(n, d){ return ToolBox.formatNumber(n, d != null ? d : 2); }

function calc(){
  var D = parseFloat(document.getElementById('demand').value) || 0;
  var S = parseFloat(document.getElementById('orderCost').value) || 0;
  var H = parseFloat(document.getElementById('holdCost').value) || 0;
  var leadTime = parseFloat(document.getElementById('leadTime').value) || 0;
  var unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
  var workDays = parseFloat(document.getElementById('workDays').value) || 1;
  var res = document.getElementById('res');

  if(D <= 0 || S <= 0 || H <= 0){ res.innerHTML = '<p style="color:var(--danger);">年需求量、订货成本、持有成本须大于0</p>'; return; }

  var eoq = Math.sqrt(2 * D * S / H);
  var orderTimes = D / eoq;
  var cycleDays = workDays / orderTimes;
  var dailyDemand = D / workDays;
  var reorderPoint = dailyDemand * leadTime;

  var setupCost = (D / eoq) * S;       // 年订货成本
  var holdingCost = (eoq / 2) * H;     // 年持有成本
  var totalInvCost = setupCost + holdingCost; // 库存相关总成本
  var purchaseCost = D * unitPrice;
  var grandTotal = totalInvCost + purchaseCost;

  // 成本曲线 SVG
  var svg = buildChart(D, S, H, eoq, setupCost, holdingCost, totalInvCost);

  res.innerHTML =
    '<div class="data-grid">' +
      '<div class="eoq-stat"><div class="sub">经济订货批量 EOQ</div><div class="big">' + fmt(eoq, 1) + ' 件</div></div>' +
      '<div class="eoq-stat"><div class="sub">年订货次数</div><div class="big">' + fmt(orderTimes, 1) + ' 次</div></div>' +
      '<div class="eoq-stat"><div class="sub">订货周期</div><div class="big">' + fmt(cycleDays, 1) + ' 天</div></div>' +
      '<div class="eoq-stat"><div class="sub">再订货点 R</div><div class="big">' + fmt(reorderPoint, 1) + ' 件</div></div>' +
    '</div>' +
    '<h3 style="margin-top:16px;">成本分析</h3>' +
    ToolBox.createTable(['成本项','计算','金额(元)'], [
      ['年订货成本', '(D/EOQ)×S = ' + fmt(D/eoq,2) + '×' + S, fmt(setupCost, 2)],
      ['年持有成本', '(EOQ/2)×H = ' + fmt(eoq/2,2) + '×' + H, fmt(holdingCost, 2)],
      ['库存相关总成本', '√(2·D·S·H)', fmt(totalInvCost, 2)],
      (unitPrice > 0 ? ['年采购成本', 'D×单价 = ' + D + '×' + unitPrice, fmt(purchaseCost, 2)] : ['—','—','—']),
      (unitPrice > 0 ? ['总成本合计', '库存成本+采购成本', fmt(grandTotal, 2)] : ['—','—','—'])
    ]) +
    '<div class="chart-wrap">' +
      '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">订货量-成本曲线（虚线为EOQ最优解）</div>' +
      svg +
      '<div class="legend">' +
        '<span><i style="background:#3B82F6;"></i>订货成本</span>' +
        '<span><i style="background:#F59E0B;"></i>持有成本</span>' +
        '<span><i style="background:#FF6B35;"></i>总成本</span>' +
        '<span><i style="background:var(--text-muted);"></i>EOQ</span>' +
      '</div>' +
    '</div>';
}

function buildChart(D, S, H, eoq, setupCost, holdingCost, totalInvCost){
  var W = 600, Hh = 260, padL = 50, padR = 20, padT = 16, padB = 36;
  var plotW = W - padL - padR, plotH = Hh - padT - padB;

  // x range: 0.2*eoq .. 3*eoq
  var xMin = 0.2 * eoq, xMax = 3 * eoq;
  var steps = 60;
  var points = [];
  var yMax = 0;
  for(var i = 0; i <= steps; i++){
    var Q = xMin + (xMax - xMin) * i / steps;
    var sc = (D / Q) * S;
    var hc = (Q / 2) * H;
    var tc = sc + hc;
    yMax = Math.max(yMax, tc);
    points.push({ Q: Q, sc: sc, hc: hc, tc: tc });
  }
  yMax = yMax * 1.1;

  function xpx(Q){ return padL + (Q - xMin) / (xMax - xMin) * plotW; }
  function ypx(v){ return padT + plotH - (v / yMax) * plotH; }

  function path(getter){
    var d = '';
    points.forEach(function(p, i){
      d += (i === 0 ? 'M' : 'L') + xpx(p.Q).toFixed(1) + ' ' + ypx(getter(p)).toFixed(1) + ' ';
    });
    return d;
  }

  var eoqX = xpx(eoq);
  var totalY = ypx(totalInvCost);

  // grid lines
  var grid = '';
  for(var g = 0; g <= 4; g++){
    var yv = yMax * g / 4;
    var yy = ypx(yv);
    grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>';
    grid += '<text x="' + (padL - 6) + '" y="' + (yy + 3) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">' + Math.round(yv) + '</text>';
  }

  return '<svg viewBox="0 0 ' + W + ' ' + Hh + '" preserveAspectRatio="xMidYMid meet">' +
    grid +
    '<path d="' + path(function(p){ return p.sc; }) + '" fill="none" stroke="#3B82F6" stroke-width="2"/>' +
    '<path d="' + path(function(p){ return p.hc; }) + '" fill="none" stroke="#F59E0B" stroke-width="2"/>' +
    '<path d="' + path(function(p){ return p.tc; }) + '" fill="none" stroke="#FF6B35" stroke-width="2.5"/>' +
    '<line x1="' + eoqX + '" y1="' + padT + '" x2="' + eoqX + '" y2="' + (padT + plotH) + '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4"/>' +
    '<circle cx="' + eoqX + '" cy="' + totalY + '" r="4" fill="#FF6B35"/>' +
    '<text x="' + eoqX + '" y="' + (padT - 4) + '" text-anchor="middle" font-size="10" fill="var(--text-secondary)">EOQ=' + Math.round(eoq) + '</text>' +
    '<text x="' + (W / 2) + '" y="' + (Hh - 6) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">订货量 Q</text>' +
  '</svg>';
}

function copyRes(){
  var res = document.getElementById('res');
  if(!res.innerText.trim()){ ToolBox.showToast(i18nText(), 'error'); return; }
  ToolBox.copyText(res.innerText, i18nText());
}

function resetAll(){
  document.getElementById('demand').value = 12000;
  document.getElementById('orderCost').value = 100;
  document.getElementById('holdCost').value = 12;
  document.getElementById('leadTime').value = 7;
  document.getElementById('unitPrice').value = 0;
  document.getElementById('workDays').value = 365;
  calc();
}

var KEY = 'tb_eoq';
(function(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || '{}');
    ['demand','orderCost','holdCost','leadTime','unitPrice','workDays'].forEach(function(id){
      if(s[id] != null) document.getElementById(id).value = s[id];
    });
  }catch(e){}
})();
['demand','orderCost','holdCost','leadTime','unitPrice','workDays'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){
    try{
      var s = {};
      ['demand','orderCost','holdCost','leadTime','unitPrice','workDays'].forEach(function(i){ s[i] = document.getElementById(i).value; });
      localStorage.setItem(KEY, JSON.stringify(s));
    }catch(e){}
  });
});

calc();
</script>
</body>
