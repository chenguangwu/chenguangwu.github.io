<h1 class="sr-only">BE = 行权价 − 权利金</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由行权价与权利金求看跌期权盈亏平衡价">Option Breakeven Put</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入行权价与权利金，求看跌期权盈亏平衡价。">Option Breakeven Put is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">看跌盈亏平衡 = K − P</div>
      <p class="formula-desc">输入行权价与权利金，求看跌期权盈亏平衡价。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="K">行权价 K (元)</label>
        <input type="number" id="K" value="50" step="1">
      </div>
      <div>
        <label for="P">权利金 P (元)</label>
        <input type="number" id="P" value="3" step="0.2">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>标的跌破此价开始盈利。</li>
        <li>50−3 → 47 元。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const K=num('K'),P=num('P');
            const BE=K-P;
            ToolBox.setResult('result', dataGrid([
                [BE.toFixed(2),'盈亏平衡价 BE (元)']
            ]));
        }
function resetForm(){document.getElementById('K').value = '50';
      document.getElementById('P').value = '3';
      calcTool();}
calcTool();
</script>
