<div class="container">
  <div class="card">
    <h2>资本资产定价模型</h2>

        <div class="formula-box">
          <div class="formula-title">📐 计算公式（CAPM 资本资产定价模型）</div>
          <div class="formula-eq">E(r) = r_f + β·(r_m − r_f)</div>
          <div class="formula-desc">r_f 无风险利率，β 个股相对市场波动，r_m 市场预期收益率，(r_m − r_f) 市场风险溢价。</div>
        </div>

    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">E(r) = r_f + β·(r_m − r_f)。</p>

    <div class="input-row">
      <div>
        <label for="rf">无风险利率 r_f</label>
        <input type="number" id="rf" value="0.025" step="0.005">
      </div>
      <div>
        <label for="beta">β 系数</label>
        <input type="number" id="beta" value="1.2" step="0.1">
      </div>
      <div>
        <label for="rm">市场收益率 r_m</label>
        <input type="number" id="rm" value="0.08" step="0.005">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>CAPM: E(r) = r_f + β(r_m − r_f)。</li>
        <li>β>1 波动大于市场，β<1 小于市场。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rf=num('rf'),b=num('beta'),rm=num('rm');
            const er=rf+b*(rm-rf);
            ToolBox.setResult('result', dataGrid([
                [(er*100).toFixed(2),'期望收益率 (%)'],
                [((rm-rf)*100).toFixed(2),'市场风险溢价 (%)']
            ]));
        }
function resetForm(){document.getElementById('rf').value = '0.025';
      document.getElementById('beta').value = '1.2';
      document.getElementById('rm').value = '0.08';
      calcTool();}
calcTool();
</script>
