  <span class="bc-current">债券到期收益率 (近似)</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="债券收益率估算">Ytm Approx</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">YTM ≈ [C + (F−P)/n] / [(F+P)/2]。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">YTM ≈ [C + (F−P)/n] / [(F+P)/2]</div>
      <p class="formula-desc">YTM ≈ [C + (F−P)/n] / [(F+P)/2]。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c">年利息 C (元)</label>
        <input type="number" id="c" value="50" step="5">
      </div>
      <div>
        <label for="f">面值 F (元)</label>
        <input type="number" id="f" value="1000" step="100">
      </div>
      <div>
        <label for="p">现价 P (元)</label>
        <input type="number" id="p" value="950" step="10">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="n">剩余年限 (年)</label>
        <input type="number" id="n" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>近似公式适用于平价附近债券。</li>
        <li>精确 YTM 需迭代求解。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c=num('c'),f=num('f'),p=num('p'),n=num('n');
            const ytm=(c+(f-p)/n)/((f+p)/2);
            ToolBox.setResult('result', dataGrid([
                [(ytm*100).toFixed(2),'到期收益率 (%)'],
                [((c/p)*100).toFixed(2),'当前收益率 (%)']
            ]));
        }
function resetForm(){document.getElementById('c').value = '50';
      document.getElementById('f').value = '1000';
      document.getElementById('p').value = '950';
      document.getElementById('n').value = '10';
      calcTool();}
calcTool();
</script>
