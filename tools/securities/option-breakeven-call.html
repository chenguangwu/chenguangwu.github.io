<div class="container">
  <div class="card">
    <h2 data-zh="行权价 + 权利金">Option Breakeven Call</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="盈亏平衡 = 行权价 + 权利金。">Option Breakeven Call is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">看涨盈亏平衡 = K + 权利金</div>
      <p class="formula-desc">盈亏平衡 = 行权价 + 权利金。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="k">行权价 K (元)</label>
        <input type="number" id="k" value="100" step="5">
      </div>

        <label for="prem">权利金 (元)</label>
        <input type="number" id="prem" value="8" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>股价高于此点买方盈利。</li>
        <li>卖方盈亏平衡相同但方向相反。</li>
      </ul>
    </div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const k=num('k'),pr=num('prem');
            ToolBox.setResult('result', dataGrid([
                [(k+pr).toFixed(2),'盈亏平衡股价 (元)']
            ]));
        }
function resetForm(){document.getElementById('k').value = '100';
      document.getElementById('prem').value = '8';
      calcTool();}
calcTool();
</script>
