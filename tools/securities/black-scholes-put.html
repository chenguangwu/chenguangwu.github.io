<div class="container">
  <div class="card">
    <h2 data-zh="欧式看跌期权定价">Black Scholes Put</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">P = K·e^(−rT)·N(−d₂) − S·N(−d₁)。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = K·e^(−rT)·N(−d₂) − S·N(−d₁)</div>
      <p class="formula-desc">P = K·e^(−rT)·N(−d₂) − S·N(−d₁)。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="s">标的价格 S (元)</label>
        <input type="number" id="s" value="100" step="5">
      </div>
      <div>
        <label for="k">行权价 K (元)</label>
        <input type="number" id="k" value="100" step="5">
      </div>
      <div>
        <label for="r">无风险利率 r</label>
        <input type="number" id="r" value="0.05" step="0.005">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="v">波动率 σ</label>
        <input type="number" id="v" value="0.2" step="0.01">
      </div>
      <div>
        <label for="t">期限 T (年)</label>
        <input type="number" id="t" value="1" step="0.25">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>与看涨满足看跌-看涨平价。</li>
        <li>无股息假设。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
                const y=1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x);
                return s*y;}
            function N(x){return 0.5*(1+erf(x/Math.SQRT2));}
            const S=num('s'),K=num('k'),r=num('r'),sig=num('v'),T=num('t');
            const d1=(Math.log(S/K)+(r+sig*sig/2)*T)/(sig*Math.sqrt(T));
            const d2=d1-sig*Math.sqrt(T);
            const p=K*Math.exp(-r*T)*N(-d2)-S*N(-d1);
            ToolBox.setResult('result', dataGrid([
                [p.toFixed(4),'看跌期权价格 P'],
                [d1.toFixed(4),'d1'],
                [d2.toFixed(4),'d2']
            ]));
        }
function resetForm(){document.getElementById('s').value = '100';
      document.getElementById('k').value = '100';
      document.getElementById('r').value = '0.05';
      document.getElementById('v').value = '0.2';
      document.getElementById('t').value = '1';
      calcTool();}
calcTool();
</script>
