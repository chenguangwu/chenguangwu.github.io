<h1 class="sr-only">保证金比例 = 权益 / 持仓市值</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 保证金比例计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-sep">‹</span>
  <span class="bc-current">保证金比例计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由账户权益与持仓市值求保证金比例</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入账户权益与持仓市值，求保证金比例。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">保证金比例 = 权益/持仓市值 × 100%</div>
      <p class="formula-desc">输入账户权益与持仓市值，求保证金比例。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="eq">账户权益 (元)</label>
        <input type="number" id="eq" value="25000" step="1000">
      </div>
      <div>
        <label for="pos">持仓市值 (元)</label>
        <input type="number" id="pos" value="100000" step="5000">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>比例越低杠杆越高、强平风险越大。</li>
        <li>25000/100000 → 25%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const eq=num('eq'),pos=num('pos');
            const mr=eq/pos*100;
            ToolBox.setResult('result', dataGrid([
                [mr.toFixed(1),'保证金比例 (%)']
            ]));
        }
function resetForm(){document.getElementById('eq').value = '25000';
      document.getElementById('pos').value = '100000';
      calcTool();}
calcTool();
</script>
