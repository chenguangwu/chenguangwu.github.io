<div class="container">
  <div class="card">
    <h2 data-zh="日波动率 × √252">Annualized Volatility</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="年化波动率 = 日波动率 × √交易日数。">Annualized Volatility is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">σ_年 = σ_日×√252</div>
      <p class="formula-desc">年化波动率 = 日波动率 × √交易日数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dv">日波动率</label>
        <input type="number" id="dv" value="0.015" step="0.001">
      </div>
      <div>
        <label for="d">年交易日数 (日)</label>
        <input type="number" id="d" value="252" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>常用 √252 年化。</li>
        <li>波动率随时间聚合。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dv=num('dv'),d=num('d');
            const av=dv*Math.sqrt(d);
            ToolBox.setResult('result', dataGrid([
                [(av*100).toFixed(2),'年化波动率 (%)'],
                [(av/Math.sqrt(d)*100).toFixed(3),'日波动率 (%)']
            ]));
        }
function resetForm(){document.getElementById('dv').value = '0.015';
      document.getElementById('d').value = '252';
      calcTool();}
calcTool();
</script>
