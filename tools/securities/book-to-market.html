<h1 class="sr-only">B/M = BVPS / P</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由每股净资产与股价求账面市值比">Book to Market</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入每股净资产 BVPS 与股价 P，求账面市值比。">Book to Market is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">B/M = BVPS/P</div>
      <p class="formula-desc">输入每股净资产 BVPS 与股价 P，求账面市值比。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="BVPS">每股净资产 BVPS (元)</label>
        <input type="number" id="BVPS" value="30" step="1">
      </div>
      <div>
        <label for="P">股价 P (元)</label>
        <input type="number" id="P" value="100" step="5">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>市净率的倒数，价值股常偏高。</li>
        <li>30/100 → 0.3。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const BVPS=num('BVPS'),P=num('P');
            const BM=BVPS/P;
            ToolBox.setResult('result', dataGrid([
                [BM.toFixed(3),'账面市值比 B/M']
            ]));
        }
function resetForm(){document.getElementById('BVPS').value = '30';
      document.getElementById('P').value = '100';
      calcTool();}
calcTool();
</script>
