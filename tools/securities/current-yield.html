</nav>
<div class="container">
  <div class="card">
    <h2>年息 / 现价</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">当前收益率 = 年利息 / 债券现价。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">CY = 年息/现价</div>
      <p class="formula-desc">当前收益率 = 年利息 / 债券现价。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="c">年利息 (元)</label>
        <input type="number" id="c" value="50" step="5">
      </div>
      <div>
        <label for="p">债券现价 (元)</label>
        <input type="number" id="p" value="950" step="10">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>当前收益率忽略资本利得与期限。</li>
        <li>与 YTM 不同，不含价格回归面值。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const c=num('c'),p=num('p');
            ToolBox.setResult('result', dataGrid([
                [(c/p*100).toFixed(2),'当前收益率 (%)']
            ]));
        }
function resetForm(){document.getElementById('c').value = '50';
      document.getElementById('p').value = '950';
      calcTool();}
calcTool();
</script>
