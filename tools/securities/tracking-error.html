<div class="container">
  <div class="card">
    <h2 data-zh="由主动收益序列求跟踪误差">Tracking Error</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入组合与基准的超额收益序列（逗号或空格分隔），求跟踪误差。">Tracking Error is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">TE = std(r_p − r_b)</div>
      <p class="formula-desc">输入组合与基准的超额收益序列（逗号或空格分隔），求跟踪误差。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ex">超额收益序列</label>
        <input type="number" id="ex" value="0.01, -0.005, 0.008, 0.002, -0.003" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>TE 越小越贴近基准。</li>
        <li>示例序列 → 约 0.589%。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const raw=document.getElementById('ex').value.split(/[ ,]+/).filter(Boolean).map(parseFloat);
            const mean=raw.reduce((a,b)=>a+b,0)/raw.length;
            let v=0; for(const x of raw){ v+=Math.pow(x-mean,2); }
            const te=Math.sqrt(v/raw.length);
            ToolBox.setResult('result', dataGrid([
                [(te*100).toFixed(3),'跟踪误差 TE (%)']
            ]));
        }
function resetForm(){document.getElementById('ex').value = '0.01, -0.005, 0.008, 0.002, -0.003';
      calcTool();}
calcTool();
</script>
