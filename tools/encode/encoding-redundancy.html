<div class="container">
  <div class="card">
    <h2>📉 编码冗余度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">比较平均码长与信息熵，评估编码冗余。</p>
    <div class="input-row"><label>平均码长</label><input type="number" id="avgLen" value="2.2" step="any" oninput="calc()"></div>
    <div class="input-row"><label>信息熵</label><input type="number" id="entropy" value="1.8" step="any" oninput="calc()"></div>
    <div class="input-row"><label>符号数</label><input type="number" id="symbols" value="1000" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">冗余 = (平均码长 − 熵) / 平均码长</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">冗余越低编码越优，理想情况趋近 0。</p>
  </div>
</div>

<script>
function calc(){
  const avgLen = +document.getElementById('avgLen').value || 0;
  const entropy = +document.getElementById('entropy').value || 0;
  const symbols = +document.getElementById('symbols').value || 0;
  let html = '';
  const __v0 = ((avgLen-entropy)/avgLen*100);
  html += `<p>冗余度：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> %</p>`;
  const __v1 = ((entropy/avgLen)*100);
  html += `<p>编码效率：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> %</p>`;
  const __v2 = (symbols*(avgLen-entropy));
  html += `<p>节省位数：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 位</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
