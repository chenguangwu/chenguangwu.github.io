    <h2>🔁 进制转换位数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算不同进制表示同一个整数所需的位数。</p>
    <div class="input-row"><label>十进制整数</label><input type="number" id="value" value="255" step="1" oninput="calc()"></div>
    <div class="input-row"><label>目标进制 2-36</label><input type="number" id="base" value="16" step="1" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>

  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">位数 = ⌈log_base(value+1)⌉</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">支持 2-36 进制。</p>
  </div>
</div>

<script>
function calc(){
  const value = +document.getElementById('value').value || 0;
  const base = +document.getElementById('base').value || 0;
  let html = '';
  const __v0 = (Math.ceil(Math.log(value+1)/Math.log(base)));
  html += `<p>目标进制位数：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(0)}</strong> 位</p>`;
  const __v1 = (Math.ceil(Math.log(value+1)/Math.log(2)));
  html += `<p>二进制位数：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(0)}</strong> bit</p>`;
  const __v2 = (Math.ceil(Math.log(value+1)/Math.log(16)));
  html += `<p>十六进制位数：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 位</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
