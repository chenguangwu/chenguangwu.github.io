<div class="container">
  <div class="card">
    <h2>🗜️ 数据压缩率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算压缩率与压缩比，评估压缩效果。</p>
    <div class="input-row"><label>原始字节</label><input type="number" id="original" value="1000" step="any" oninput="calc()"></div>
    <div class="input-row"><label>压缩后字节</label><input type="number" id="compressed" value="400" step="any" oninput="calc()"></div>
    <div class="input-row"><label>文件数</label><input type="number" id="files" value="1" step="any" oninput="calc()"></div>
    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result" data-viz="bar" data-viz-max="100" data-viz-min="0"></div>
  </div>
  <div class="card formula-box">
    <h3>📐 计算公式与说明</h3>
    <div class="formula-eq">压缩率 = (1 − 压缩后/原始) × 100%</div>
    <p style="font-size:13px;color:var(--text-muted);margin-top:12px;">压缩率越接近 100% 压缩越强。</p>
  </div>

<script>
function calc(){
  const original = +document.getElementById('original').value || 0;
  const compressed = +document.getElementById('compressed').value || 0;
  const files = +document.getElementById('files').value || 0;
  let html = '';
  const __v0 = ((1-compressed/original)*100);
  html += `<p>压缩率：<strong style="font-size:18px;color:var(--primary);">${__v0.toFixed(2)}</strong> %</p>`;
  const __v1 = (original/compressed);
  html += `<p>压缩比：<strong style="font-size:18px;color:var(--primary);">${__v1.toFixed(2)}</strong> ×</p>`;
  const __v2 = ((original-compressed)*files);
  html += `<p>总节省：<strong style="font-size:18px;color:var(--primary);">${__v2.toFixed(0)}</strong> 字节</p>`;
  document.getElementById('result').innerHTML = html;
}
function copyResult() {
  const txt = document.getElementById('result').innerText;
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => ToolBox.toast && ToolBox.toast('已复制结果')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
calc();
</script>
