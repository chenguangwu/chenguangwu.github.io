<h1 class="sr-only">Pp 过程性能计算器</h1>

<div class="container">
  <div class="card">
    <h2>Pp 过程性能计算器</h2>
    
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Pp = (USL − LSL) / (6σ_lt)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">用长期（总）标准差衡量的性能指数。</p>

    <div class="input-row">
      <div>
        <label for="usl">上规格限 USL</label>
        <input type="number" id="usl" value="10.05" step="0.01">
      </div>
      <div>
        <label for="lsl">下规格限 LSL</label>
        <input type="number" id="lsl" value="9.95" step="0.01">
      </div>
      <div>
        <label for="slt">长期标准差 σ_lt</label>
        <input type="number" id="slt" value="0.015" step="0.001">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Pp 用整体标准差，含特殊原因。</li>
        <li>Pp 常低于 Cp。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const usl=num('usl'),lsl=num('lsl'),s=num('slt');
            ToolBox.setResult('result', dataGrid([
                [((usl-lsl)/(6*s)).toFixed(3),'Pp']
            ]));
        }
function resetForm(){document.getElementById('usl').value = '10.05';
      document.getElementById('lsl').value = '9.95';
      document.getElementById('slt').value = '0.015';
      calcTool();}
calcTool();
</script>
