<div class="container">
  <div class="card">
    <h2>T_total = Σ |tᵢ|</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="线性尺寸链在最差情况下的总公差。">Tolerance Worst Case is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">0.2 = 0.45。 最差情况偏保守。</div>
      <p class="formula-desc">线性尺寸链在最差情况下的总公差。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="t1">公差1 t₁</label>
        <input type="number" id="t1" value="0.1" step="0.01">
      </div>
      <div>
        <label for="t2">公差2 t₂</label>
        <input type="number" id="t2" value="0.15" step="0.01">
      </div>
      <div>
        <label for="t3">公差3 t₃</label>
        <input type="number" id="t3" value="0.2" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>0.1+0.15+0.2 = 0.45。</li>
        <li>最差情况偏保守。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const t1=num('t1'),t2=num('t2'),t3=num('t3');
            ToolBox.setResult('result', dataGrid([
                [(t1+t2+t3).toFixed(3),'总公差 (最差)']
            ]));
        }
function resetForm(){document.getElementById('t1').value = '0.1';
      document.getElementById('t2').value = '0.15';
      document.getElementById('t3').value = '0.2';
      calcTool();}
calcTool();
</script>
