<h1 class="sr-only">DPMO 计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="DPMO = 缺陷数 / (单位数 × 机会数) × 10⁶">DPMO Calculate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="每百万机会缺陷数，过程质量通用度量。">DPMO Calculate - calculate online, free and accurate.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">20000×1e6 = 6200 DPMO。 机会数指可缺陷的特征数。</div>
      <p class="formula-desc">每百万机会缺陷数，过程质量通用度量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="def">缺陷数</label>
        <input type="number" id="def" value="124" step="1">
      </div>
      <div>
        <label for="units">单位数</label>
        <input type="number" id="units" value="2000" step="10">
      </div>
      <div>
        <label for="opp">每单位机会数</label>
        <input type="number" id="opp" value="10" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>124/20000×1e6 = 6200 DPMO。</li>
        <li>机会数指可缺陷的特征数。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const d=num('def'),u=num('units'),o=num('opp');
            ToolBox.setResult('result', dataGrid([
                [(d/(u*o)*1e6).toFixed(1),'DPMO']
            ]));
        }
function resetForm(){document.getElementById('def').value = '124';
      document.getElementById('units').value = '2000';
      document.getElementById('opp').value = '10';
      calcTool();}
calcTool();
</script>
