<h1 class="sr-only">PLL 锁定范围计算器</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

<div class="container">
  <div class="card">
    <h2>锁定范围（Δf = K_v · V_max）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">锁相环中压控振荡器的频率牵引范围由增益与控制电压决定。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Δf = K_v · V_max</div>
      <p class="formula-desc">锁相环中压控振荡器的频率牵引范围由增益与控制电压决定。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="Kv">VCO 增益 (Hz/V)</label>
        <input type="number" id="Kv" value="1e6" step="1e4">
      </div>
      <div>
        <label for="Vmax">最大控制电压 (V)</label>
        <input type="number" id="Vmax" value="5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Δf = K_v·V_max；VCO 增益 K_v 单位 Hz/V。</li>
        <li>K_v=1 MHz/V、V_max=5V 时范围 ±5 MHz。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Kv = num('Kv'), Vmax = num('Vmax');
            const df = Kv * Vmax;
            ToolBox.setResult('result', dataGrid([
                [df.toLocaleString(), '锁定范围 Δf (Hz)'],
                [(df / 1e6).toFixed(3), 'Δf (MHz)']
            ]));
        }
function resetForm(){document.getElementById('Kv').value = '1e6';
      document.getElementById('Vmax').value = '5';
      calcTool();}
calcTool();
</script>
