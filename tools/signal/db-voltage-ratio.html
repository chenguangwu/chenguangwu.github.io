<h1 class="sr-only">L = 20·log₁₀(V₁/V₂)</h1>

  <span class="bc-current">电压比转分贝计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由两电压求分贝值">DB Voltage Ratio</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入电压 V1、V2，求分贝比值。">DB Voltage Ratio is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">dB = 20·log₁₀(V₁ / V₂)</div>
      <p class="formula-desc">输入电压 V1、V2，求分贝比值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v1">电压 V₁ (V)</label>
        <input type="number" id="v1" value="10" step="0.1">
      </div>
      <div>
        <label for="v2">电压 V₂ (V)</label>
        <input type="number" id="v2" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>电压比 dB = 20·log10(V1/V2)。</li>
        <li>10/1 → 20 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v1=num('v1'),v2=num('v2');
            const L=20*Math.log10(v1/v2);
            ToolBox.setResult('result', dataGrid([
                [L.toFixed(3),'分贝值 L (dB)']
            ]));
        }
function resetForm(){document.getElementById('v1').value = '10';
      document.getElementById('v2').value = '1';
      calcTool();}
calcTool();
</script>
