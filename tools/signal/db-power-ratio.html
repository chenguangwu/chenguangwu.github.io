<h1 class="sr-only">L = 10·log₁₀(P₁/P₂)</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>由两功率求分贝值</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入功率 P1、P2，求分贝比值。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">dB = 10·log₁₀(P₁ / P₂)</div>
      <p class="formula-desc">输入功率 P1、P2，求分贝比值。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="p1">功率 P₁ (W)</label>
        <input type="number" id="p1" value="100" step="0.1">
      </div>
      <div>
        <label for="p2">功率 P₂ (W)</label>
        <input type="number" id="p2" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>功率比 dB = 10·log10(P1/P2)。</li>
        <li>100/1 → 20 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const p1=num('p1'),p2=num('p2');
            const L=10*Math.log10(p1/p2);
            ToolBox.setResult('result', dataGrid([
                [L.toFixed(3),'分贝值 L (dB)']
            ]));
        }
function resetForm(){document.getElementById('p1').value = '100';
      document.getElementById('p2').value = '1';
      calcTool();}
calcTool();
</script>
