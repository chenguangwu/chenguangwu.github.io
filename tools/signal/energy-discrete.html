<div class="container">
  <div class="card">
    <h2>由采样序列求信号能量</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入离散采样序列（空格或逗号分隔），求信号总能量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">E = Σ|x[n]|²</div>
      <p class="formula-desc">输入离散采样序列（空格或逗号分隔），求信号总能量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="s">采样序列 x[n]</label>
        <input type="number" id="s" value="1 2 3 -1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>E = Σ x[n]²。</li>
        <li>1,2,3,-1 → 1+4+9+1=15。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const s=document.getElementById('s').value.split(/[ ,]+/).filter(Boolean).map(Number);
            const E=s.reduce(function(a,b){return a+b*b;},0);
            ToolBox.setResult('result', dataGrid([
                [E.toFixed(3),'信号能量 E'],
                [s.length,'采样点数 N']
            ]));
        }
function resetForm(){document.getElementById('s').value = '1 2 3 -1';
      calcTool();}
calcTool();
</script>
