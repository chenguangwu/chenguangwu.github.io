<div class="container">
  <div class="card">
    <h2 data-zh="奈奎斯特采样（f_s ≥ 2·f_max）">Nyquist Rate</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="无失真重建连续信号所需最小采样率为信号最高频率的两倍。">Nyquist Rate is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">f_s ≥ 2·f_max</div>
      <p class="formula-desc">无失真重建连续信号所需最小采样率为信号最高频率的两倍。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="fmax">最高频率 (Hz)</label>
        <input type="number" id="fmax" value="20000" step="100">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>f_s_min = 2·f_max（奈奎斯特率）。</li>
        <li>20 kHz 音频需 ≥40 kHz 采样（CD 为 44.1 kHz）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const fmax = num('fmax');
            const fs = 2 * fmax;
            ToolBox.setResult('result', dataGrid([
                [fs.toLocaleString(), '最小采样率 f_s (Hz)'],
                [(fs / 1000).toFixed(1), '采样率 (kHz)']
            ]));
        }
function resetForm(){document.getElementById('fmax').value = '20000';
      calcTool();}
calcTool();
</script>
