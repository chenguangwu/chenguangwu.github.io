<div class="container">
  <div class="card">
    <h2>由各级增益(dB)求总增益</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入三级增益（dB），求总增益与线性总增益。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">20=27 dB → 线性≈501。</div>
      <p class="formula-desc">输入三级增益（dB），求总增益与线性总增益。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="g1">第1级增益 G₁ (dB)</label>
        <input type="number" id="g1" value="10" step="0.1">
      </div>
      <div>
        <label for="g2">第2级增益 G₂ (dB)</label>
        <input type="number" id="g2" value="-3" step="0.1">
      </div>
      <div>
        <label for="g3">第3级增益 G₃ (dB)</label>
        <input type="number" id="g3" value="20" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>级联总增益为各 dB 之和。</li>
        <li>10-3+20=27 dB → 线性≈501。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const g1=num('g1'),g2=num('g2'),g3=num('g3');
            const total=g1+g2+g3;
            const lin=Math.pow(10,total/10);
            ToolBox.setResult('result', dataGrid([
                [total.toFixed(3),'总增益 (dB)'],
                [lin.toFixed(3),'线性总增益']
            ]));
        }
function resetForm(){document.getElementById('g1').value = '10';
      document.getElementById('g2').value = '-3';
      document.getElementById('g3').value = '20';
      calcTool();}
calcTool();
</script>
