<h1 class="sr-only">电压增益分贝计算器</h1>

</nav>
<div class="container">
  <div class="card">
    <h2>增益（G = 20·log₁₀(V_out / V_in)）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">放大器或网络的电压增益用分贝表示。</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">G = 20</div>
      <p class="formula-desc">放大器或网络的电压增益用分贝表示。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="vout">输出幅度 (V)</label>
        <input type="number" id="vout" value="10" step="0.1">
      </div>
      <div>
        <label for="vin">输入幅度 (V)</label>
        <input type="number" id="vin" value="1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>G = 20·log₁₀(V_out/V_in)。</li>
        <li>10 倍电压增益 = 20 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const vout = num('vout'), vin = num('vin');
            const G = 20 * Math.log10(vout / vin);
            ToolBox.setResult('result', dataGrid([
                [G.toFixed(2), '增益 G (dB)'],
                [Math.pow(10, G / 20).toFixed(3), '电压比 V_out/V_in']
            ]));
        }
function resetForm(){document.getElementById('vout').value = '10';
      document.getElementById('vin').value = '1';
      calcTool();}
calcTool();
</script>
