<div class="container">
  <div class="card">
    <h2>由频偏与调制频率求调频指数</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入最大频偏 Δf 与调制频率 fm，求调频指数。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">β = Δf / f_m</div>
      <p class="formula-desc">输入最大频偏 Δf 与调制频率 fm，求调频指数。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="df">最大频偏 Δf (kHz)</label>
        <input type="number" id="df" value="75" step="0.1">
      </div>
      <div>
        <label for="fm">调制频率 f_m (kHz)</label>
        <input type="number" id="fm" value="15" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>β = Δf/f_m。</li>
        <li>75/15 → β=5。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const df=num('df'),fm=num('fm');
            const beta=df/fm;
            ToolBox.setResult('result', dataGrid([
                [beta.toFixed(3),'调频指数 β']
            ]));
        }
function resetForm(){document.getElementById('df').value = '75';
      document.getElementById('fm').value = '15';
      calcTool();}
calcTool();
</script>
