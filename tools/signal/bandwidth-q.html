<div class="container">
  <div class="card">
    <h2 data-zh="由中心频率与品质因数求带宽">Bandwidth Q</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入中心频率 f0 与品质因数 Q，求 -3dB 带宽。">Bandwidth Q is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">BW = f₀ / Q</div>
      <p class="formula-desc">输入中心频率 f0 与品质因数 Q，求 -3dB 带宽。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f0">中心频率 f₀ (Hz)</label>
        <input type="number" id="f0" value="1000" step="1">
      </div>
      <div>
        <label for="Q">品质因数 Q</label>
        <input type="number" id="Q" value="10" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Δf = f₀/Q。</li>
        <li>f0=1000,Q=10 → Δf=100 Hz。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f0=num('f0'),Q=num('Q');
            const bw=f0/Q;
            ToolBox.setResult('result', dataGrid([
                [bw.toFixed(3),'带宽 Δf (Hz)']
            ]));
        }
function resetForm(){document.getElementById('f0').value = '1000';
      document.getElementById('Q').value = '10';
      calcTool();}
calcTool();
</script>
