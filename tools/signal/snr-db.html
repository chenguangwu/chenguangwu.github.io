<h1 class="sr-only">SNR = 10·log₁₀(Ps/Pn)</h1>

<div class="nav">

  <span class="bc-current">信噪比(SNR)计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由信号功率与噪声功率求信噪比</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入信号功率 Ps 与噪声功率 Pn，求信噪比（dB）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">SNR = 10·log₁₀(P_s / P_n)</div>
      <p class="formula-desc">输入信号功率 Ps 与噪声功率 Pn，求信噪比（dB）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="ps">信号功率 Ps (W)</label>
        <input type="number" id="ps" value="10" step="0.1">
      </div>
      <div>
        <label for="pn">噪声功率 Pn (W)</label>
        <input type="number" id="pn" value="0.1" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>SNR_dB = 10·log10(Ps/Pn)。</li>
        <li>Ps=10,Pn=0.1 → 20 dB。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const ps=num('ps'),pn=num('pn');
            const snr=10*Math.log10(ps/pn);
            ToolBox.setResult('result', dataGrid([
                [snr.toFixed(3),'信噪比 SNR (dB)']
            ]));
        }
function resetForm(){document.getElementById('ps').value = '10';
      document.getElementById('pn').value = '0.1';
      calcTool();}
calcTool();
</script>
