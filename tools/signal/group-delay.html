<h1 class="sr-only">τ_g = −dφ/dω</h1>

</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="由相位差与角频率差求群时延">Group Delay</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="输入相位差 Δφ（度）与角频率差 Δω（rad/s），求群时延。">Group Delay is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">τ_g = Δφ / Δω</div>
      <p class="formula-desc">输入相位差 Δφ（度）与角频率差 Δω（rad/s），求群时延。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="dp">相位差 Δφ (°)</label>
        <input type="number" id="dp" value="90" step="1">
      </div>
      <div>
        <label for="dw">角频率差 Δω (rad/s)</label>
        <input type="number" id="dw" value="1000" step="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>τ_g = −dφ/dω，相位以弧度计。</li>
        <li>Δφ=90°,Δω=1000 → τ_g≈−1.57 ms。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const dp=num('dp'),dw=num('dw');
            const tg=-(dp*Math.PI/180)/dw;
            ToolBox.setResult('result', dataGrid([
                [tg.toFixed(6),'群时延 τ_g (s)']
            ]));
        }
function resetForm(){document.getElementById('dp').value = '90';
      document.getElementById('dw').value = '1000';
      calcTool();}
calcTool();
</script>
