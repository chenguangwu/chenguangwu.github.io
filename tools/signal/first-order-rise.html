<div class="container">
  <div class="card">
    <h2 data-zh="上升时间（t_r ≈ 2.2·τ）">First Order Rise</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="一阶系统从 10% 升到 90% 约需 2.2 个时间常数。">First Order Rise is available directly in your browser, with no data uploaded.</p>

    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">t_r ≈ 2.2·τ</div>
      <p class="formula-desc">一阶系统从 10% 升到 90% 约需 2.2 个时间常数。</p>
    </div>


    <div class="input-row">
      <div>
        <label for="tau">时间常数 (s)</label>
        <input type="number" id="tau" value="0.001" step="1e-4">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>t_r ≈ 2.2·τ（10%–90%）。</li>
        <li>τ=1 ms 时上升约 2.2 ms。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const tau = num('tau');
            const tr = 2.2 * tau;
            ToolBox.setResult('result', dataGrid([
                [tr.toExponential(3), '上升时间 t_r (s)'],
                [(tr * 1000).toExponential(3), 't_r (ms)']
            ]));
        }
function resetForm(){document.getElementById('tau').value = '0.001';
      calcTool();}
calcTool();
</script>
