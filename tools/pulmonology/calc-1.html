  <a href="../../guides/calc-1-guide.html">📖 查看「增值税计算使用指南」</a>

<div class="container">
  <div class="card">
    <h2>🫁 氧合指数计算</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">计算 P/F 比值（PaO₂/FiO₂）与氧合指数（OI），辅助判断低氧血症及 ARDS 严重程度。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本健康工具基于通用生理常数与经验公式估算，结果仅供参考，不替代专业医疗诊断与建议。 工具名称：氧合指数计算 - 计算 P/F。</p>
</div>


    <div class="input-row">
      <div>
        <label for="pao2">PaO₂（动脉血氧分压，mmHg）</label>
        <input type="number" id="pao2" min="0" max="800" placeholder="例如 85" oninput="calc()">
      </div>
      <div>
        <label for="fio2">吸入氧浓度 FiO₂（%）</label>
        <input type="number" id="fio2" min="21" max="100" placeholder="例如 40" oninput="calc()">
      </div>
    </div>

    <h3>氧合指数 OI（可选）</h3>
    <div class="input-row">
      <div>
        <label for="map">平均气道压 MAP（cmH₂O）</label>
        <input type="number" id="map" min="0" max="50" placeholder="例如 10" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_p_f_ratio';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.pao2 != null) document.getElementById('pao2').value = s.pao2;
    if(s.fio2 != null) document.getElementById('fio2').value = s.fio2;
    if(s.map != null) document.getElementById('map').value = s.map;
  } catch(e){}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pao2: document.getElementById('pao2').value,
      fio2: document.getElementById('fio2').value,
      map: document.getElementById('map').value
    }));
  } catch(e){}
}

function classifyPF(pf){
  if(pf >= 300) return {level:'正常', cls:'grade-excellent', desc:'PaO₂/FiO₂ ≥300 mmHg'};
  if(pf >= 200) return {level:'轻度 ARDS', cls:'grade-good', desc:'200 ≤ PaO₂/FiO₂ <300 mmHg'};
  if(pf >= 100) return {level:'中度 ARDS', cls:'grade-pass', desc:'100 ≤ PaO₂/FiO₂ <200 mmHg'};
  return {level:'重度 ARDS', cls:'grade-fail', desc:'PaO₂/FiO₂ <100 mmHg'};
}

function classifyOI(oi){
  if(oi <= 5) return {level:'正常', cls:'grade-excellent'};
  if(oi <= 15) return {level:'轻度', cls:'grade-good'};
  if(oi <= 25) return {level:'中度', cls:'grade-pass'};
  return {level:'重度', cls:'grade-fail'};
}

function calc(){
  const pao2 = parseFloat(document.getElementById('pao2').value);
  const fio2 = parseFloat(document.getElementById('fio2').value);
  const map = parseFloat(document.getElementById('map').value);
  const result = document.getElementById('result');

  if(isNaN(pao2) || isNaN(fio2) || pao2 < 0 || fio2 < 21 || fio2 > 100){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入有效的 PaO₂ 与 FiO₂。</p>';
    saveState();
    return;
  }

  const pf = pao2 / (fio2 / 100);
  const pfc = classifyPF(pf);

  let html = `
    <p>P/F 比值：<strong style="font-size:20px;">${pf.toFixed(1)}</strong> mmHg</p>
    <p>分度：<span class="grade-tag ${pfc.cls}">${pfc.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${pfc.desc}</p>
  `;

  if(!isNaN(map) && map > 0){
    const oi = (fio2 * map * 100) / pao2;
    const oic = classifyOI(oi);
    html += `
      <p style="margin-top:12px;">氧合指数 OI：<strong style="font-size:20px;">${oi.toFixed(1)}</strong></p>
      <p>OI 分度：<span class="grade-tag ${oic.cls}">${oic.level}</span></p>
    `;
  }

  html += `<div class="tip-box tip-info" style="margin-top:12px;">提示：计算结果需结合血气分析、影像学及临床表现综合判读。</div>`;

  saveState();
  result.innerHTML = html;
}

function resetForm(){
  document.getElementById('pao2').value = '';
  document.getElementById('fio2').value = '';
  document.getElementById('map').value = '';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
</body>
