<div class="container">
  <div class="card">
    <h2>⚙️ 圆柱螺旋弹簧刚度计算（机械）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">k = G·d⁴ / (8·D³·n)</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">按材料力学公式由线径、中径、有效圈数计算圆柱螺旋压缩弹簧的轴向刚度。</p>

    <div class="input-row">
      <div>
        <label for="d">弹簧线径 d (mm)</label>
        <input type="number" id="d" value="5" step="0.5" min="0.1">
      </div>
      <div>
        <label for="D">弹簧中径 D (mm)</label>
        <input type="number" id="D" value="30" step="1" min="1">
      </div>
      <div>
        <label for="n">有效圈数 n</label>
        <input type="number" id="n" value="6" step="0.5" min="1">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="G">剪切模量 G (GPa)</label>
        <input type="number" id="G" value="79" step="1" min="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>k = G·d⁴ / (8·D³·n)（圆柱螺旋弹簧轴向刚度）</li>
        <li>G 取材料剪切模量：钢 ≈79 GPa，不锈钢 ≈73 GPa</li>
        <li>d 为线径、D 为中径、n 为有效圈数</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const d=num('d'), D=num('D'), n=num('n'), G=num('G')*1000; // G: GPa->N/mm²
            if(d<=0||D<=0||n<=0||G<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效的弹簧参数。</p>');return;}
            const k=G*Math.pow(d,4)/(8*Math.pow(D,3)*n); // N/mm
            ToolBox.setResult('result', dataGrid([
                [k.toFixed(2),'弹簧刚度 k (N/mm)'],
                [(k*1000).toFixed(0),'弹簧刚度 k (N/m)']
            ]));
        }
function resetForm(){document.getElementById('d').value = '5';
      document.getElementById('D').value = '30';
      document.getElementById('n').value = '6';
      document.getElementById('G').value = '79';
      calcTool();}
calcTool();
</script>
