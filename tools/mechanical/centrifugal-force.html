<div class="container">
  <div class="card">
    <h2>⚙️ 离心力计算（机械）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">F = m·ω²·r</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由质量、旋转半径与转速计算旋转体的离心力（惯性力）。</p>

    <div class="input-row">
      <div>
        <label for="m">质量 m (kg)</label>
        <input type="number" id="m" value="10" step="0.5" min="0">
      </div>
      <div>
        <label for="r">旋转半径 r (m)</label>
        <input type="number" id="r" value="0.5" step="0.05" min="0">
      </div>
      <div>
        <label for="rpm">转速 n (rpm)</label>
        <input type="number" id="rpm" value="600" step="10" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>F = m·ω²·r，ω = 2πn/60（n 为 rpm）</li>
        <li>离心力与转速平方成正比，高速旋转时迅速增大</li>
        <li>常用于转子动平衡、离心机设计</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const m=num('m'), r=num('r'), rpm=num('rpm');
            if(m<0||r<=0){ToolBox.setResult('result','<p class="tip-error">请输入有效参数（半径须>0）。</p>');return;}
            const w=2*Math.PI*rpm/60; // rad/s
            const F=m*w*w*r; // N
            ToolBox.setResult('result', dataGrid([
                [F.toFixed(1),'离心力 F (N)'],
                [(F/1000).toFixed(2),'离心力 F (kN)'],
                [w.toFixed(2),'角速度 ω (rad/s)']
            ]));
        }
function resetForm(){document.getElementById('m').value = '10';
      document.getElementById('r').value = '0.5';
      document.getElementById('rpm').value = '600';
      calcTool();}
calcTool();
</script>
