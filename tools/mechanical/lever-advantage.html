<div class="container">
  <div class="card">
    <h2>⚙️ 杠杆机械增益计算（机械）</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">MA = L₁/L₂</div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由动力臂与阻力臂长度计算杠杆的机械增益（省力倍数）。</p>

    <div class="input-row">
      <div>
        <label for="Lin">动力臂 L₁ (m)</label>
        <input type="number" id="Lin" value="1.0" step="0.05" min="0">
      </div>
      <div>
        <label for="Lout">阻力臂 L₂ (m)</label>
        <input type="number" id="Lout" value="0.2" step="0.05" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>MA = L₁/L₂（动力臂/阻力臂）</li>
        <li>MA>1 省力，代价是动力端位移更大</li>
        <li>滑轮组机械增益约等于承重绳段数 n</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Lin=num('Lin'), Lout=num('Lout');
            if(Lin<=0||Lout<=0){ToolBox.setResult('result','<p class="tip-error">臂长须>0。</p>');return;}
            const MA=Lin/Lout;
            ToolBox.setResult('result', dataGrid([
                [MA.toFixed(2),'机械增益 MA (=L₁/L₂)'],
                [(1/MA).toFixed(2),'所需动力 / 阻力']
            ]));
        }
function resetForm(){document.getElementById('Lin').value = '1.0';
      document.getElementById('Lout').value = '0.2';
      calcTool();}
calcTool();
</script>
