<div class="container">
  <div class="card">
    <h2>👁️ 眼压校正（角膜厚度校正）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">根据中央角膜厚度（CCT）对实测眼压进行估算校正，辅助青光眼风险评估。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：眼压校正 - （角膜厚度校正） -。</p>
</div>


    <div class="input-row">
      <div>
        <label for="iop">实测眼压（mmHg）</label>
        <input type="number" id="iop" step="0.1" placeholder="例如 18" oninput="calc()">
      </div>
      <div>
        <label for="cct">中央角膜厚度 CCT（μm）</label>
        <input type="number" id="cct" step="1" placeholder="例如 540" oninput="calc()">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calc()">计算校正眼压</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tb_iop_correction';

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(s.iop != null) document.getElementById('iop').value = s.iop;
    if(s.cct != null) document.getElementById('cct').value = s.cct;
  } catch(e){}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      iop: document.getElementById('iop').value,
      cct: document.getElementById('cct').value
    }));
  } catch(e){}
}

function classify(iop){
  if(iop < 21) return {level:'正常范围', cls:'grade-excellent', desc:'校正眼压 <21 mmHg'};
  if(iop <= 25) return {level:'偏高', cls:'grade-pass', desc:'校正眼压 21-25 mmHg'};
  if(iop <= 30) return {level:'显著升高', cls:'grade-pass', desc:'校正眼压 26-30 mmHg'};
  return {level:'高度升高', cls:'grade-fail', desc:'校正眼压 >30 mmHg'};
}

function calc(){
  const iop = parseFloat(document.getElementById('iop').value);
  const cct = parseFloat(document.getElementById('cct').value);
  const result = document.getElementById('result');

  if(isNaN(iop) || isNaN(cct) || iop <= 0 || cct <= 0){
    result.innerHTML = '<p style="color:var(--text-muted)">请输入有效的眼压和角膜厚度。</p>';
    saveState();
    return;
  }

  // Doughty linear correction: each 10 μm deviation from 544 changes IOP by 0.7 mmHg
  const corrected = iop + ((cct - 544) / 10) * 0.7;
  const c = classify(corrected);

  saveState();
  result.innerHTML = `
    <p>校正眼压：<strong style="font-size:20px;">${corrected.toFixed(1)}</strong> mmHg</p>
    <p>评估：<span class="grade-tag ${c.cls}">${c.level}</span></p>
    <p style="font-size:13px;color:var(--text-light)">${c.desc}</p>
    <div class="tip-box tip-info" style="margin-top:12px;">
      提示：CCT 越厚，实测眼压往往被高估；CCT 越薄则被低估。本估算仅供参考，青光眼诊断需结合视神经、视野与角膜地形图等综合判断。
    </div>
  `;
}

function resetForm(){
  document.getElementById('iop').value = '';
  document.getElementById('cct').value = '';
  document.getElementById('result').innerHTML = '';
  saveState();
}

document.addEventListener('DOMContentLoaded', () => { loadState(); calc(); });
</script>
