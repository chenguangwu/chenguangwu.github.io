<h1 class='sr-only'>孔口出流计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 孔口出流计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🕳️ 孔口出流计算</h2>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = Cd·A·√(2gH)</div>
    </div>
    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据孔口直径、作用水头和流量系数，计算薄壁孔口的出流量、孔口面积与收缩流速。</p>
    <div class='input-row'>
      <div>
        <label for='diameter'>孔口直径（mm）</label>
        <input type='number' id='diameter' value='20' min='0.1' step='0.1'>
      </div>
      <div>
        <label for='head'>作用水头 H（m）</label>
        <input type='number' id='head' value='5' min='0.1' step='0.1'>
      </div>
      <div>
        <label for='cd'>流量系数 Cd</label>
        <input type='number' id='cd' value='0.62' min='0.1' max='1' step='0.01'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>流量系数参考：薄壁圆孔 0.60~0.64，管嘴 0.82，闸孔 0.60~0.70。公式 Q = Cd·A·√(2gH)。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_orifice';
  const G = 9.80665;
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const dMm = get('diameter');
    const H = get('head');
    const Cd = get('cd');
    const el = ToolBox.$('result');
    if(dMm <= 0 || H <= 0 || Cd <= 0 || Cd > 1){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>';
      return;
    }
    const d = dMm / 1000;
    const A = Math.PI * Math.pow(d / 2, 2);
    const Acm2 = A * 10000;
    const Q = Cd * A * Math.sqrt(2 * G * H); // m³/s
    const Qls = Q * 1000;
    const v = Cd * Math.sqrt(2 * G * H);
    el.innerHTML =
      '<p>孔口面积：<strong>' + ToolBox.formatNumber(Acm2, 2) + '</strong> cm²</p>' +
      '<p>出流量 Q：<strong>' + ToolBox.formatNumber(Qls, 3) + '</strong> L/s</p>' +
      '<p>收缩断面流速：<strong>' + ToolBox.formatNumber(v, 2) + '</strong> m/s</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        d: ToolBox.$('diameter').value,
        h: ToolBox.$('head').value,
        cd: ToolBox.$('cd').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.d) ToolBox.$('diameter').value = data.d;
      if(data.h) ToolBox.$('head').value = data.h;
      if(data.cd) ToolBox.$('cd').value = data.cd;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['diameter','head','cd'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
