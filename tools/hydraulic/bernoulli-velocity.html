<h1 class="sr-only">伯努利方程（求下游流速）计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 伯努利方程流速计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>

  <span class="bc-current">伯努利方程流速计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>伯努利方程</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由上下游压强、流速、高程，按能量守恒求下游流速 v₂。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P + ½ρv² + ρgh = 常数</div>
      <p class="formula-desc">由上下游压强、流速、高程，按能量守恒求下游流速 v₂。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="P1">上游压强 P₁ (Pa)</label>
        <input type="number" id="P1" value="200000" step="1000">
      </div>
      <div>
        <label for="v1">上游流速 v₁ (m/s)</label>
        <input type="number" id="v1" value="1" step="0.1" min="0">
      </div>
      <div>
        <label for="z1">上游高程 z₁ (m)</label>
        <input type="number" id="z1" value="0" step="0.5">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="P2">下游压强 P₂ (Pa)</label>
        <input type="number" id="P2" value="100000" step="1000">
      </div>
      <div>
        <label for="z2">下游高程 z₂ (m)</label>
        <input type="number" id="z2" value="5" step="0.5">
      </div>
      <div>
        <label for="rho">流体密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="1" min="0">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>伯努利：P + ½ρv² + ρgz = 常数（忽略损失，理想不可压定常流）。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const P1=num('P1'), v1=num('v1'), z1=num('z1'), P2=num('P2'), z2=num('z2'), rho=num('rho'), g=num('g');
            const v2sq = v1*v1 + 2*(P1-P2)/rho + 2*g*(z1-z2);
            if (v2sq < 0) {
                ToolBox.setResult('result', dataGrid([['给定条件下无解（能量不足）','提示']]));
            } else {
                ToolBox.setResult('result', dataGrid([ [Math.sqrt(v2sq).toFixed(2)+' m/s', '下游流速 v₂'] ]));
            }
        }
function resetForm(){document.getElementById('P1').value = 200000;
      document.getElementById('v1').value = 1;
      document.getElementById('z1').value = 0;
      document.getElementById('P2').value = 100000;
      document.getElementById('z2').value = 5;
      document.getElementById('rho').value = 1000;
      document.getElementById('g').value = 9.81;
      calcTool();}
calcTool();
</script>
