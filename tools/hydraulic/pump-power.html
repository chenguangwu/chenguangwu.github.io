<h1 class="sr-only">水泵功率计算器</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>泵功率</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由流量、扬程与效率，按 P = ρgQH/η 计算水泵轴功率（输入功率）。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">P = ρ·g·Q·H/η</div>
      <p class="formula-desc">由流量、扬程与效率，按 P = ρgQH/η 计算水泵轴功率（输入功率）。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="rho">流体密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="1" min="0">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
      <div>
        <label for="Q">流量 Q (m³/s)</label>
        <input type="number" id="Q" value="0.05" step="0.005" min="0">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="H">扬程 H (m)</label>
        <input type="number" id="H" value="20" step="0.5" min="0">
      </div>
      <div>
        <label for="eta">效率 η</label>
        <input type="number" id="eta" value="0.75" step="0.01" min="0" max="1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>轴功率=水力功率/效率；η 越低成本越高。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const rho=num('rho'), g=num('g'), Q=num('Q'), H=num('H'), eta=num('eta');
            const P = rho*g*Q*H/eta;
            ToolBox.setResult('result', dataGrid([
                [(P/1000).toFixed(2)+' kW', '轴功率 P = ρgQH/η'],
                [(rho*g*Q*H/1000).toFixed(2)+' kW', '有效功率（水力功率）']
            ]));
        }
function resetForm(){document.getElementById('rho').value = 1000;
      document.getElementById('g').value = 9.81;
      document.getElementById('Q').value = 0.05;
      document.getElementById('H').value = 20;
      document.getElementById('eta').value = 0.75;
      calcTool();}
calcTool();
</script>
