<h1 class='sr-only'>管道沿程水头损失</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 管道沿程水头损失</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2 data-zh="💧 管道沿程水头损失">💧 Pipe Friction Head Loss Calculator</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc" data-zh="本工程计算基于标准物理与材料公式，输入为标准工程单位，结果仅供参考。 工具名称：管道沿程水头损失 - 水利工程在线工具。">Compute friction head loss along a pipe.</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>采用 Hazen-Williams 公式计算圆管沿程水头损失、压降与管内流速。</p>
    <div class='input-row'>
      <div>
        <label for='flow'>流量</label>
        <input type='number' id='flow' value='10' min='0' step='0.1'>
      </div>
      <div>
        <label for='flowUnit'>流量单位</label>
        <select id='flowUnit'>
          <option value='lps' selected>L/s</option>
          <option value='m3h'>m³/h</option>
        </select>
      </div>
      <div>
        <label for='diameter'>管径（mm）</label>
        <input type='number' id='diameter' value='100' min='1' step='1'>
      </div>
    </div>
    <div class='input-row'>
      <div>
        <label for='length'>管长（m）</label>
        <input type='number' id='length' value='100' min='0' step='1'>
      </div>
      <div>
        <label for='c'>Hazen-Williams 系数 C</label>
        <input type='number' id='c' value='100' min='1' step='1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>C 值参考：PVC/PE 新管 140，新钢管 120，旧钢管/铸铁管 90~100，混凝土管 120。结果未含局部水头损失。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_pipe_headloss';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  function calculate(){
    const flow = get('flow');
    const unit = ToolBox.$('flowUnit').value;
    const dMm = get('diameter');
    const L = get('length');
    const C = get('c');
    const el = ToolBox.$('result');
    if(flow < 0 || dMm <= 0 || L < 0 || C <= 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效正数。</p>';
      return;
    }
    const Q = unit === 'lps' ? flow / 1000 : flow / 3600;
    const D = dMm / 1000;
    const hf = 10.67 * L * Math.pow(Q, 1.852) / (Math.pow(C, 1.852) * Math.pow(D, 4.87));
    const dP = hf * 9.80665; // kPa for water
    const v = Q / (Math.PI * Math.pow(D / 2, 2));
    el.innerHTML =
      '<p>沿程水头损失 hf：<strong>' + ToolBox.formatNumber(hf, 3) + '</strong> m</p>' +
      '<p>压降 ΔP：<strong>' + ToolBox.formatNumber(dP, 2) + '</strong> kPa</p>' +
      '<p>管内流速：<strong>' + ToolBox.formatNumber(v, 2) + '</strong> m/s</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        flow: ToolBox.$('flow').value,
        unit: ToolBox.$('flowUnit').value,
        d: ToolBox.$('diameter').value,
        L: ToolBox.$('length').value,
        c: ToolBox.$('c').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.flow) ToolBox.$('flow').value = data.flow;
      if(data.unit) ToolBox.$('flowUnit').value = data.unit;
      if(data.d) ToolBox.$('diameter').value = data.d;
      if(data.L) ToolBox.$('length').value = data.L;
      if(data.c) ToolBox.$('c').value = data.c;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['flow','flowUnit','diameter','length','c'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
      ToolBox.$(id).addEventListener('change', calculate);
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
