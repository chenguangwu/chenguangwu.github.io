<h1 class="sr-only">孔口出流流量计算器</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>

<div class="container">
  <div class="card">
    <h2>孔口自由出流</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由流量系数、孔径与水头，按 Q = Cd·A·√(2gh) 计算孔口出流流量。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">Q = C_d·A·√(2gh)</div>
      <p class="formula-desc">由流量系数、孔径与水头，按 Q = Cd·A·√(2gh) 计算孔口出流流量。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Cd">流量系数 Cd</label>
        <input type="number" id="Cd" value="0.62" step="0.01" min="0">
      </div>
      <div>
        <label for="d">孔径 d (m)</label>
        <input type="number" id="d" value="0.05" step="0.005" min="0">
      </div>
      <div>
        <label for="h">作用水头 h (m)</label>
        <input type="number" id="h" value="2" step="0.1" min="0">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>薄壁小孔口 Cd≈0.61–0.62；大孔口或管嘴取值不同。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Cd=num('Cd'), d=num('d'), h=num('h'), g=num('g');
            const A = Math.PI*d*d/4;
            const Q = Cd*A*Math.sqrt(2*g*h);
            ToolBox.setResult('result', dataGrid([ [Q.toFixed(5)+' m³/s', '出流流量 Q = Cd·A·√(2gh)'] ]));
        }
function resetForm(){document.getElementById('Cd').value = 0.62;
      document.getElementById('d').value = 0.05;
      document.getElementById('h').value = 2;
      document.getElementById('g').value = 9.81;
      calcTool();}
calcTool();
</script>
