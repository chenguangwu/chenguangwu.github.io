<div class="container">
  <div class="card">
    <h2>局部损失 h_L</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由局部阻力系数与流速，按 h_L = K·v²/(2g) 计算阀门、弯头等局部水头损失。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">h_L = ξ·v²/(2g)</div>
      <p class="formula-desc">由局部阻力系数与流速，按 h_L = K·v²/(2g) 计算阀门、弯头等局部水头损失。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="K">局部阻力系数 K</label>
        <input type="number" id="K" value="0.5" step="0.05" min="0">
      </div>
      <div>
        <label for="v">流速 v (m/s)</label>
        <input type="number" id="v" value="3" step="0.1" min="0">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>K 典型值：90°弯头≈0.3–0.9，全开闸阀≈0.2，突然扩大按公式单独算。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const K=num('K'), v=num('v'), g=num('g');
            const hL = K*v*v/(2*g);
            ToolBox.setResult('result', dataGrid([ [hL.toFixed(3)+' m', '局部水头损失 h_L = K·v²/(2g)'] ]));
        }
function resetForm(){document.getElementById('K').value = 0.5;
      document.getElementById('v').value = 3;
      document.getElementById('g').value = 9.81;
      calcTool();}
calcTool();
</script>
