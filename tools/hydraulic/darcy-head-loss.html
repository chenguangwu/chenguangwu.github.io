<h1 class="sr-only">达西-魏斯巴赫沿程损失计算器</h1>

<div class="nav">
  <a href="../../index.html">← ToolBox</a>
  <span>/ 达西沿程水头损失计算器</span>
  <button class="theme-btn" onclick="ToolBox.toggleToolTheme()">🌙</button>
</div>




<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">
  <a href="../../index.html">首页</a>
  <span class="bc-sep">‹</span>
  <a href="index.html">🔧 水利工程</a>
  <span class="bc-sep">‹</span>
  <span class="bc-current">达西沿程水头损失计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2 data-zh="达西-魏斯巴赫公式">Darcy Head Loss</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" data-zh="由摩擦系数、管长、管径、密度与流速，按 ΔP = f(L/D)(ρv²/2) 计算管道沿程压降。">Darcy Head Loss is available directly in your browser, with no data uploaded.</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">h_f = f·(L/D)·v²/(2g)</div>
      <p class="formula-desc">由摩擦系数、管长、管径、密度与流速，按 ΔP = f(L/D)(ρv²/2) 计算管道沿程压降。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="f">达西摩擦系数 f</label>
        <input type="number" id="f" value="0.02" step="0.001" min="0">
      </div>
      <div>
        <label for="L">管长 L (m)</label>
        <input type="number" id="L" value="100" step="1" min="0">
      </div>
      <div>
        <label for="D">管径 D (m)</label>
        <input type="number" id="D" value="0.1" step="0.01" min="0">
      </div>
    </div>
    <div class="input-row">
      <div>
        <label for="rho">流体密度 ρ (kg/m³)</label>
        <input type="number" id="rho" value="1000" step="1" min="0">
      </div>
      <div>
        <label for="v">流速 v (m/s)</label>
        <input type="number" id="v" value="1" step="0.1" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>f 可用 Moody 图或 Colebrook 公式由 Re 与相对粗糙度求得。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const f=num('f'), L=num('L'), D=num('D'), rho=num('rho'), v=num('v');
            const dP = f*(L/D)*(rho*v*v/2);
            const h = dP/(rho*9.81);
            ToolBox.setResult('result', dataGrid([
                [dP.toFixed(0)+' Pa', '沿程压降 ΔP = f(L/D)(ρv²/2)'],
                [h.toFixed(3)+' m', '折合水头损失 h = ΔP/(ρg)']
            ]));
        }
function resetForm(){document.getElementById('f').value = 0.02;
      document.getElementById('L').value = 100;
      document.getElementById('D').value = 0.1;
      document.getElementById('rho').value = 1000;
      document.getElementById('v').value = 1;
      calcTool();}
calcTool();
</script>
