<div class="container">
  <div class="card">
    <h2>流速 v = Q/A</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">由体积流量与过流断面面积，按 v = Q/A 计算平均流速。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = Q/A</div>
      <p class="formula-desc">由体积流量与过流断面面积，按 v = Q/A 计算平均流速。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="Q">流量 Q (m³/s)</label>
        <input type="number" id="Q" value="0.1" step="0.01" min="0">
      </div>
      <div>
        <label for="A">断面面积 A (m²)</label>
        <input type="number" id="A" value="0.05" step="0.005" min="0">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>Q=A·v 的逆向运算，常用于管道与明渠设计校核。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const Q=num('Q'), A=num('A');
            const v = Q/A;
            ToolBox.setResult('result', dataGrid([ [v.toFixed(2)+' m/s', '平均流速 v = Q/A'] ]));
        }
function resetForm(){document.getElementById('Q').value = 0.1;
      document.getElementById('A').value = 0.05;
      calcTool();}
calcTool();
</script>
