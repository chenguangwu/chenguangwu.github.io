<h1 class='sr-only'>虹吸高度计算</h1>
<div class='nav'>
  <a href='../../index.html'>← ToolBox</a>
  <span>/ 虹吸高度计算</span>
  <button class='theme-btn' onclick='ToolBox.toggleToolTheme()' aria-label='切换主题'>🌙</button>
</div>
<div class='container'>
  <div class='card'>
    <h2>🌊 虹吸高度计算</h2>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本计算器基于标准数学运算与单位换算约定，输入按数字格式解析，结果实时输出；纯前端本地计算，数据不上传服务器。 工具名称：虹吸高度计算 - 水利工程在线工具。</p>
</div>

    <p style='font-size:13px;color:var(--text-muted);margin-bottom:16px;'>根据当地大气压、水温和管路损失，估算不发生汽化的最大允许虹吸高度。</p>
    <div class='input-row'>
      <div>
        <label for='atm'>当地大气压（kPa）</label>
        <input type='number' id='atm' value='101.325' min='1' step='0.1'>
      </div>
      <div>
        <label for='temp'>水温（°C）</label>
        <input type='number' id='temp' value='20' min='0' max='100' step='1'>
      </div>
    </div>
    <div class='input-row'>
      <div>
        <label for='safety'>安全余量（m）</label>
        <input type='number' id='safety' value='0.5' min='0' step='0.1'>
      </div>
      <div>
        <label for='loss'>水头损失（m）</label>
        <input type='number' id='loss' value='0.5' min='0' step='0.1'>
      </div>
    </div>
    <div class='toolbar'>
      <button class='btn primary' onclick='calculate()'>计算</button>
      <button class='btn' onclick='copyResult()'>复制结果</button>
    </div>
    <div class='result-box' id='result'><p>请输入参数后计算。</p></div>
    <div class='info-box' style='margin-top:12px;'>水温越高，饱和蒸汽压越大，允许虹吸高度越低。计算已扣除安全余量与管路损失，结果应保留足够安全裕度。</div>
  </div>
</div>

</div>
<script>
(function(){
  const KEY = 'tb_siphon';
  function get(id){ return parseFloat(ToolBox.$(id).value) || 0; }
  // Tetens formula for saturation vapor pressure of water (kPa)
  function vaporPressure(tempC){
    return 0.61078 * Math.exp(17.27 * tempC / (tempC + 237.3));
  }
  function calculate(){
    const atm = get('atm');
    const temp = get('temp');
    const safety = get('safety');
    const loss = get('loss');
    const el = ToolBox.$('result');
    if(atm <= 0 || temp < 0 || temp > 100 || safety < 0 || loss < 0){
      el.innerHTML = '<p style="color:var(--danger)">请输入有效参数。</p>';
      return;
    }
    const pv = vaporPressure(temp);
    const hMax = (atm - pv) / 9.80665 - safety - loss;
    el.innerHTML =
      '<p>当前水温饱和蒸汽压：<strong>' + ToolBox.formatNumber(pv, 2) + '</strong> kPa</p>' +
      '<p>理论最大吸上高度：<strong>' + ToolBox.formatNumber((atm - pv) / 9.80665, 2) + '</strong> m</p>' +
      '<p>建议最大虹吸高度：<strong>' + ToolBox.formatNumber(hMax, 2) + '</strong> m</p>' +
      '<p style="font-size:12px;color:var(--text-muted)">已扣除安全余量 ' + safety + ' m 与水头损失 ' + loss + ' m</p>';
    save();
  }
  function copyResult(){
    const text = ToolBox.$('result').innerText.replace(/\s+/g, ' ').trim();
    if(text && text.indexOf('请输入') === -1) ToolBox.copyText(text, i18nText('tool.copy_ok'));
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        atm: ToolBox.$('atm').value,
        temp: ToolBox.$('temp').value,
        safety: ToolBox.$('safety').value,
        loss: ToolBox.$('loss').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(data.atm) ToolBox.$('atm').value = data.atm;
      if(data.temp) ToolBox.$('temp').value = data.temp;
      if(data.safety) ToolBox.$('safety').value = data.safety;
      if(data.loss) ToolBox.$('loss').value = data.loss;
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    load();
    calculate();
    ['atm','temp','safety','loss'].forEach(function(id){
      ToolBox.$(id).addEventListener('input', ToolBox.debounce(calculate, 300));
    });
  });
  window.calculate = calculate;
  window.copyResult = copyResult;
})();
</script>
