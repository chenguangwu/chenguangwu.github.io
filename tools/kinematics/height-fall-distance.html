<div class="container">
  <div class="card">
    <h2>由下落时间求下落距离</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入下落时间 t 与重力加速度 g，求下落距离。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">h = ½·g·t²</div>
      <p class="formula-desc">输入下落时间 t 与重力加速度 g，求下落距离。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="t">时间 t (s)</label>
        <input type="number" id="t" value="2" step="0.1">
      </div>
      <div>
        <label for="g">重力加速度 g (m/s²)</label>
        <input type="number" id="g" value="9.81" step="0.01">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>h = ½gt²（无初速）。</li>
        <li>t=2,g=9.81 → 19.62 m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const t=num('t'),g=num('g');
            const h=0.5*g*t*t;
            ToolBox.setResult('result', dataGrid([
                [h.toFixed(3),'下落距离 h (m)']
            ]));
        }
function resetForm(){document.getElementById('t').value = '2';
      document.getElementById('g').value = '9.81';
      calcTool();}
calcTool();
</script>
