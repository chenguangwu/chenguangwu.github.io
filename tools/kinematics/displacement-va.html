<h1 class="sr-only">s = (v² − v₀²) / (2a)</h1>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

  <span class="bc-current">匀变速位移(已知v,v₀,a)计算器</span>
</nav>
<div class="container">
  <div class="card">
    <h2>由速度变化与加速度求位移</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入末速度 v、初速度 v₀、加速度 a，求位移。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">s = (v²−v₀²)/(2a)。 20,10,5 → 30 m。</div>
      <p class="formula-desc">输入末速度 v、初速度 v₀、加速度 a，求位移。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v">末速度 v (m/s)</label>
        <input type="number" id="v" value="20" step="0.5">
      </div>
      <div>
        <label for="v0">初速度 v₀ (m/s)</label>
        <input type="number" id="v0" value="10" step="0.5">
      </div>
      <div>
        <label for="a">加速度 a (m/s²)</label>
        <input type="number" id="a" value="5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>s = (v²−v₀²)/(2a)。</li>
        <li>20,10,5 → 30 m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v=num('v'),v0=num('v0'),a=num('a');
            const s=(v*v-v0*v0)/(2*a);
            ToolBox.setResult('result', dataGrid([
                [s.toFixed(3),'位移 s (m)']
            ]));
        }
function resetForm(){document.getElementById('v').value = '20';
      document.getElementById('v0').value = '10';
      document.getElementById('a').value = '5';
      calcTool();}
calcTool();
</script>
