<h1 class="sr-only">匀加速位移计算器</h1>

<div class="container">
  <div class="card">
    <h2>位移公式（x = v₀·t + ½·a·t²）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">初速度位移与匀加速位移之和。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">x = v₀t + ½at²。 10×5 + 0.5×2×25 = 75 m。</div>
      <p class="formula-desc">初速度位移与匀加速位移之和。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v0">初速度 v₀ (m/s)</label>
        <input type="number" id="v0" value="10" step="1">
      </div>
      <div>
        <label for="a">加速度 a (m/s²)</label>
        <input type="number" id="a" value="2" step="0.1">
      </div>
      <div>
        <label for="t">时间 t (s)</label>
        <input type="number" id="t" value="5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>x = v₀t + ½at²。</li>
        <li>10×5 + 0.5×2×25 = 75 m。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v0 = num('v0'), a = num('a'), t = num('t');
            const x = v0 * t + 0.5 * a * t * t;
            ToolBox.setResult('result', dataGrid([
                [x.toFixed(3), '位移 x (m)']
            ]));
        }
function resetForm(){document.getElementById('v0').value = '10';
      document.getElementById('a').value = '2';
      document.getElementById('t').value = '5';
      calcTool();}
calcTool();
</script>
