<div class="container">
  <div class="card">
    <h2>由初角速度、角加速度与时间求末角速度</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入初角速度 ω₀、角加速度 α、时间 t，求末角速度。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">ω = ω₀ + αt。 ω₀=2,α=1,t=3 → 5 rad/s。</div>
      <p class="formula-desc">输入初角速度 ω₀、角加速度 α、时间 t，求末角速度。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="w0">初角速度 ω₀ (rad/s)</label>
        <input type="number" id="w0" value="2" step="0.1">
      </div>
      <div>
        <label for="a">角加速度 α (rad/s²)</label>
        <input type="number" id="a" value="1" step="0.1">
      </div>
      <div>
        <label for="t">时间 t (s)</label>
        <input type="number" id="t" value="3" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>ω = ω₀ + αt。</li>
        <li>ω₀=2,α=1,t=3 → 5 rad/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const w0=num('w0'),a=num('a'),t=num('t');
            const w=w0+a*t;
            ToolBox.setResult('result', dataGrid([
                [w.toFixed(3),'末角速度 ω (rad/s)']
            ]));
        }
function resetForm(){document.getElementById('w0').value = '2';
      document.getElementById('a').value = '1';
      document.getElementById('t').value = '3';
      calcTool();}
calcTool();
</script>
