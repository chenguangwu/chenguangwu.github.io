<h1 class="sr-only">匀加速末速度计算器</h1>

  <a href="../../index.html">← ToolBox</a>
  <span>/ 匀加速末速度</span>

<nav class="breadcrumb" aria-label="面包屑导航" data-breadcrumb="1">

</nav>
<div class="container">
  <div class="card">
    <h2>速度公式（v = v₀ + a·t）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">初速度叠加加速度在时间上的累积。</p>
    <div class="formula-box">
      <div class="formula-title">📐 计算公式</div>
      <div class="formula-eq">v = v₀ + a·t。 自由落体 5 s：v = 9.8×5 = 49 m/s。</div>
      <p class="formula-desc">初速度叠加加速度在时间上的累积。</p>
    </div>

    <div class="input-row">
      <div>
        <label for="v0">初速度 v₀ (m/s)</label>
        <input type="number" id="v0" value="0" step="1">
      </div>
      <div>
        <label for="a">加速度 a (m/s²)</label>
        <input type="number" id="a" value="9.8" step="0.1">
      </div>
      <div>
        <label for="t">时间 t (s)</label>
        <input type="number" id="t" value="5" step="0.1">
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="calcTool()">计算</button>
      <button class="btn" onclick="resetForm()">重置</button>
    </div>

    <div class="result-box" id="result"></div>

    <div class="tool-notes">
      <div class="tool-notes-title">📌 计算说明</div>
      <ul>
        <li>v = v₀ + a·t。</li>
        <li>自由落体 5 s：v = 9.8×5 = 49 m/s。</li>
      </ul>
    </div>
  </div>
</div>

<script>
function num(id){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function dataGrid(rows){let h='<div class="data-grid">';for(const r of rows){h+='<div class="data-card"><div class="num">'+r[0]+'</div><div class="label">'+r[1]+'</div></div>';}return h+'</div>';}
function calcTool(){
            const v0 = num('v0'), a = num('a'), t = num('t');
            const v = v0 + a * t;
            ToolBox.setResult('result', dataGrid([
                [v.toFixed(3), '末速度 v (m/s)'],
                [(v * 3.6).toFixed(3), 'v (km/h)']
            ]));
        }
function resetForm(){document.getElementById('v0').value = '0';
      document.getElementById('a').value = '9.8';
      document.getElementById('t').value = '5';
      calcTool();}
calcTool();
</script>
