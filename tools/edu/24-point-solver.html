  <div class="card">
    <h2>🧮 24 点求解器</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">输入 4 个数字（1-13）探索凑成24的表达式。</p>
<div class="formula-box">
  <div class="formula-title">📐 工作原理与说明</div>
  <p class="formula-desc">本工具为纯前端在线工具，数据在浏览器本地处理、不上传服务器，依据对应领域标准与规范进行计算或处理，结果仅供参考。 工具名称：24 点求解器。</p>
</div>

    <div class="input-row">
      <label>四张牌（逗号或空格分隔）</label>
      <input type="text" id="nums" value="5,5,5,1" oninput="solve()">
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="solve()">求解</button>
      <button class="btn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>

<script>
function parseNums() {
  return (document.getElementById('nums').value || '')
    .split(/[,\s]+/)
    .map(v => parseFloat(v))
    .filter(v => !Number.isNaN(v));
}

function solve() {
  const nums = parseNums();
  if (nums.length !== 4) {
    document.getElementById('result').innerHTML = '<p>请输入 4 个数字</p>';
    return;
  }

  const EPS = 1e-9;
  let ans = [];

  const ops = ['+','-','*','/'];

  function calc(a, b, op) {
    if (op === '+') return {v: a + b, s: `(${a} + ${b})`};
    if (op === '-') return {v: a - b, s: `(${a} - ${b})`};
    if (op === '*') return {v: a * b, s: `(${a} * ${b})`};
    if (op === '/') return b === 0 ? null : {v: a / b, s: `(${a} / ${b})`};
  }

  function dfs(vals, exprs) {
    if (vals.length === 1) {
      if (Math.abs(vals[0] - 24) < EPS) {
        ans.push(exprs[0]);
      }
      return;
    }
    const n = vals.length;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const restV = [];
        const restE = [];
        for (let k = 0; k < n; k++) {
          if (k !== i && k !== j) {
            restV.push(vals[k]);
            restE.push(exprs[k]);
          }
        }

        for (const op of ops) {
          const r = calc(vals[i], vals[j], op);
          if (!r) continue;
          restV.push(r.v);
          restE.push(r.s);
          if (ans.length < 8) {
            dfs(restV, restE);
          }
          restV.pop();
          restE.pop();
          if (ans.length >= 8) return;
        }
      }
    }
  }

  ans = [];
  dfs(nums.slice(), nums.map(v => String(v)));

  if (!ans.length) {
    document.getElementById('result').innerHTML = '<p>未找到标准算式（四则运算）</p>';
    return;
  }
  const uniq = Array.from(new Set(ans.slice(0, 6)));
  document.getElementById('result').innerHTML =
    `<p>命中 ${uniq.length} 个示例：</p>` +
    uniq.map(s => `<p>${s} = 24</p>`).join('');
}

function copyResult() {
  const text = document.getElementById('result').innerText || '';
  if (!text.trim()) {
    ToolBox.showToast(i18nText('toast.msg639'), 'warning');
    return;
  }
  ToolBox.copyText(text, i18nText('msg251'));
}

solve();
</script>
