  if(!target){
    var cleanPath = path.replace(/^\/tools\//, '');
    target = PATH_MAP[cleanPath];
  }
  if(target){
    renderSuggest([{ n:_t('err.moved','原工具已迁移'), d:_t('err.moved_hint','点击前往正确页面'), u:target, ic:'🧭', b:'rgba(255,107,53,0.1)' }]);
    return;
  }

  // 2. 关键词映射
  var kws = extractKeywords(path);
  var matched = [];
  kws.forEach(function(k){
    if(KEYWORD_MAP[k]){
      matched.push({ n:k.toUpperCase() + _t('err.related',' 相关工具'), d:_t('err.view','点击查看'), u:KEYWORD_MAP[k], ic:'🔍', b:'rgba(124,58,237,0.08)' });
    }
  });

  // 3. 基于已加载的全量索引做全文匹配（ALL_TOOLS 由 loadAllTools 填充）
  var results = [];
  kws.forEach(function(k){
    if(k.length < 2) return;
    ALL_TOOLS.forEach(function(t){
      var text = ' ' + (t.n||'') + ' ' + (t.d||'') + ' ' + (t.i||'');
      if(text.toLowerCase().indexOf(k) !== -1){
        results.push({ n:t.n, d:(t.d||'').slice(0,24), u:'/'+t.u, ic:t.ic||'🔧', b:t.b||'#f5f5f5' });
      }
    });
  });
  // 去重 + 限制
  var seen = {}, uniq = [];
  results.forEach(function(t){
    if(!seen[t.u]){ seen[t.u] = 1; uniq.push(t); }
  });
  var all = matched.concat(uniq);
  if(all.length){
    renderSuggest(all.slice(0, 8));
  } else if(matched.length){
    renderSuggest(matched.slice(0, 4));
  }
}

// （已移除自动跳转：用户可手动点击「立即返回首页」/「查看站点地图」）

// 绝对路径归一：hot-tools.json / tools.json 中的 u 是相对路径，统一补前导 /
function absUrl(u){ if(!u) return '#'; u = String(u); if(u.charAt(0) === '/') return u; return '/' + u.replace(/^\.?\//, ''); }

// 主题切换
function toggleTheme(){
  var dark = document.body.classList.toggle('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}

function initTheme(){
  var t = localStorage.getItem('theme') || 'light';
  if(t === 'dark'){
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }
}

initTheme();
// i18n.js 为 defer 加载，执行晚于本内联脚本；因此把依赖 i18n 的渲染推迟到
// DOMContentLoaded 之后（此时 I18n 已就绪），避免英文态工具名/分类名回退中文。
// 热门工具：与首页同源 json/hot-tools.json（构建期编辑精选，自动随首页同步）
function loadHotTools(){
  fetch('/json/hot-tools.json')
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(d){ HOT_TOOLS = Array.isArray(d) ? d : []; renderHot(); })
    .catch(function(){ renderHot(); });
}

// 全量索引：供「你可能在找」与实时搜索
function loadAllTools(){
  fetch('/json/tools.json')
    .then(function(r){ return r.json(); })
    .then(function(raw){
      ALL_TOOLS = (raw || []).map(_toolToShort);
      findSuggestions();
      initLiveSearch();
    })
    .catch(function(){});
}

// 实时搜索：输入即出下拉结果；回车/点击「搜索」交给 search.html 做全量检索
function initLiveSearch(){
  var input = document.getElementById('searchInput');
  var panel = document.getElementById('searchResults');
  if(!input || !panel) return;
  function close(){ panel.hidden = true; panel.innerHTML = ''; }
  function render(q){
    q = (q || '').trim();
    if(q.length < 1){ close(); return; }
    var ql = q.toLowerCase();
    var hits = [];
    for(var i = 0; i < ALL_TOOLS.length && hits.length < 8; i++){
      var t = ALL_TOOLS[i];
      var hay = ' ' + (t.n || '') + ' ' + (t.d || '') + ' ' + (t.i || '') + ' ' + (t.al || []).join(' ');
      if(hay.toLowerCase().indexOf(ql) !== -1){ hits.push(t); }
    }
    if(!hits.length){ close(); return; }
    panel.innerHTML = hits.map(function(t){
      var u = absUrl(t.u);
      var ic = t.ic || '🔧';
      var b = t.b || '#f5f5f5';
      var nm = (_en() && t.en) ? t.en : (t.n || '');
      var ds = (_en() && t.ed) ? t.ed : (t.d || '');
      return '<a class="sr-item" href="' + u + '"><span class="sr-ic" style="background:' + b + '">' + ic + '</span><span class="sr-info"><span class="sr-name">' + nm + '</span><span class="sr-desc">' + String(ds).slice(0, 30) + '</span></span></a>';
    }).join('');
    panel.hidden = false;
  }
  input.addEventListener('input', function(){ render(this.value); });
  input.addEventListener('focus', function(){ if(this.value.trim()) render(this.value); });
  input.addEventListener('blur', function(){ setTimeout(close, 150); });
  panel.addEventListener('click', function(e){ if(e.target.closest('a')) close(); });
}

function bootI18nViews(){
  renderCats();
  loadHotTools();
  loadAllTools();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootI18nViews);
} else {
  bootI18nViews();
}
// 语言切换后需重渲染（工具名/分类名为 JS 渲染，无 data-i18n 属性）
window.addEventListener('toolbox:langchange', function(){ renderHot(); renderCats(); if(ALL_TOOLS.length){ findSuggestions(); initLiveSearch(); } });
})();
</script>
