name: ToolBox Build and Deploy

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Run ToolBox quality gates
        run: python3 scripts/run_gates.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Exclude build dependencies from Pages artifact
        if: github.event_name != 'pull_request'
        run: mv node_modules "$RUNNER_TEMP/toolbox-node_modules"

      - name: Check GitHub Pages artifact size
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_pages_artifact.py

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 该 action 内部默认只等 10 分钟（600000 ms）就自行取消部署。
          # 站点约 5600 个 HTML 页，Pages 服务端在高并发推送后常出现
          # deployment_queued 排队超过 10 分钟 ⇒ 部署被误判失败。
          # 放宽到 30 分钟，仍受 job 级 timeout-minutes: 40 约束。
          timeout: 1800000
