<body>
<h1 class="sr-only">搜尋工具</h1>

<div class="container">
  <div class="card search-header">
    <h2>🔍 搜尋工具</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">輸入關鍵詞，搜尋全部 <strong id="totalCount">...</strong> 個免費線上工具</p>
    <div class="input-row">

  <div id="resultsContainer">
    <div class="empty-state"><span class="icon">🔍</span>輸入關鍵詞開始搜尋</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  let allTools = [];
  let timer = null;

  var INDUSTRY_NAMES = {
    it:'IT开发', design:'设计创意', biz:'商业办公', life:'日常生活', finance:'金融财务',
    health:'健康医疗', edu:'教育学习', science:'科学研究', fun:'娱乐游戏', marketing:'营销推广',
    travel:'旅行出行', legal:'法律合规', ai:'AI人工智能', data:'数据分析', engineering:'工程计算',
    electronics:'电子电路', sales:'销售管理', startup:'创业孵化', image:'图像处理', video:'视频处理',
    music:'音乐艺术', writing:'写作创作', food:'美食烹饪', home:'家居装修', language:'语言翻译',
    exam:'考试备考', history:'历史人文', literature:'文学阅读', math:'数学计算', stats:'统计分析',
    medical:'医疗专业', entertainment:'影视娱乐', sports:'体育竞技', chinese:'中华文化', yi:'周易八卦',
    fengshui:'风水命理', fortune:'运势占卜', agriculture:'农业种植', construction:'建筑地产', manufacturing:'制造业',
    logistics:'物流运输', energy:'能源电力', environment:'环保生态', automotive:'汽车交通', beauty:'美容护肤',
    pet:'宠物养护', parenting:'育儿亲子', gardening:'园艺种植', mining:'矿业冶金', textile:'纺织服装',
    chemical:'化工材料', fishery:'渔业水产', forestry:'林业资源', livestock:'畜牧养殖'
  };

  function init() {
    fetch('json/search-index.json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        allTools = data || [];
        var totalEl = document.getElementById('totalCount');
        if (totalEl) totalEl.textContent = allTools.length;
        var params = new URLSearchParams(location.search);
        var q = params.get('q') || '';
        if (q) {
          var input = document.getElementById('searchInput');
          if (input) input.value = q;
          doSearch(q);
        }
      })
      .catch(function(e){
        console.error('加载搜索索引失败', e);
        document.getElementById('resultsContainer').innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
      });
  }

  function onSearch(q) {
    clearTimeout(timer);
    timer = setTimeout(function(){ doSearch(q); }, 150);
  }
  window.onSearch = onSearch;

  // Split a query into AND-term sets. A single token mixing CJK + latin/digit
  // (e.g. "格式化json") is also segmented into ["格式化","json"] so multi-concept
  // queries without spaces still match (P1-02 验收).
  function segmentQuery(raw) {
    var spaceTerms = raw.split(/\s+/).filter(Boolean);
    if (spaceTerms.length > 1) return [spaceTerms];
    var token = spaceTerms[0] || '';
    var seg = (token.match(/[一-鿿]+|[a-z0-9]+/gi) || []).filter(Boolean);
    if (seg.length > 1) return [[token], seg];
    return [[token]];
  }

  // 与首页 app.js toolboxScore 对齐的匹配判定：无效词防护 + 拉丁短词分层
  function shMatch(t, q) {
    var qn = q.replace(/\s+/g, '');
    if (/(.)\1\1/.test(qn) || new Set(qn.split('')).size < 2) return false;
    var name = (t.n || '').toLowerCase();
    var slug = (t.s || '').toLowerCase();
    var aliasArr = (t.al || []).map(function(a){ return String(a).toLowerCase(); });
    var py = (t.py || '').toLowerCase();
    var pyi = (t.pyi || '').toLowerCase();
    var latinShort = /^[a-z0-9]+$/.test(q) && q.length <= 3;
    if (name === q) return true;
    if (name.indexOf(q) === 0) return true;
    if (!latinShort && name.indexOf(q) >= 0) return true;
    if (pyi === q) return true;
    if (pyi.indexOf(q) === 0 && q.length >= 2) return true;
    if (!latinShort && py.indexOf(q) >= 0) return true;
    if (!latinShort && pyi.indexOf(q) >= 0) return true;
    if (!latinShort && slug.indexOf(q) >= 0) return true;
    if (aliasArr.indexOf(q) >= 0) return true;
    if (latinShort) {
      var toks = function(s){ return (s || '').split(/[^a-z0-9]+/i).filter(Boolean); };
      if (aliasArr.some(function(a){ return a.indexOf(q) === 0; })) return true;
      if (toks(pyi).some(function(tok){ return tok === q || tok.indexOf(q) === 0; })) return true;
      if (toks(py).some(function(tok){ return tok === q || tok.indexOf(q) === 0; })) return true;
    }
    return false;
  }

  function doSearch(q) {
    q = (q || '').trim().toLowerCase();
    var qNoSpace = q.replace(/\s+/g, '');
    var container = document.getElementById('resultsContainer');
    if (!container) return;
    if (!q) {
      container.innerHTML = '<div class="empty-state"><span class="icon">🔍</span>输入关键词开始搜索</div>';
      updateUrl('');
      return;
    }
    var qn = q.replace(/\s+/g, '');
    // 无效查询（连续重复字符/单一种类字符）直接返回空结果，不返回噪声
    if (/(.)\1\1/.test(qn) || new Set(qn.split('')).size < 2) {
      renderResults([], q);
      updateUrl(q);
      return;
    }
    var termSets = segmentQuery(q);
    var results = allTools.filter(function(t) {
      return termSets.some(function(set) {
        if (set.length === 1) return shMatch(t, set[0]);
        return set.every(function(term) { return shMatch(t, term); });
      });
    }).sort(function(a, b) { return score(b, q, qNoSpace) - score(a, q, qNoSpace); });
    // Typo correction (P3-3): when direct hits are scarce and the query is
    // latin-only, match pinyin fields with sliding-window edit distance (<=2).
    // py/pyi include the description, so window search (not whole-string)
    // finds the best local match, e.g. "jisqanqi" -> "jisuanqi".
    if (results.length < 3 && /^[a-z]+$/.test(qNoSpace) && qNoSpace.length >= 4 && !/(.)\1\1/.test(qNoSpace) && new Set(qNoSpace.split('')).size >= 3) {
      var corrected = allTools.map(function(t) {
        var py = t.py || '';
        var pyi = t.pyi || '';
        var best = -1;
        if (py) {
          var d = windowEditDistance(py, qNoSpace, 1);
          if (d >= 0) best = Math.max(best, d);
        }
        if (pyi) {
          var d = windowEditDistance(pyi, qNoSpace, 1);
          if (d >= 0) best = Math.max(best, d);
        }
        return best >= 0 ? { t: t, d: best } : null;
      }).filter(function(x) {
        return x && results.indexOf(x.t) === -1;
      }).sort(function(a, b) { return a.d - b.d; }).slice(0, 8).map(function(x) { return x.t; });
      results = results.concat(corrected);
    }
    updateUrl(q);
    renderResults(results, q);
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j, cost;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      var tmp = prev; prev = cur; cur = tmp;
    }
    return prev[n];
  }

  // Sliding-window edit distance: best substring window of `text` within
  // maxD of `q`. Returns distance (>=0) or -1.
  function windowEditDistance(text, q, maxD) {
    var tl = text.length, ql = q.length;
    if (tl < ql - 1) return -1;
    var best = maxD + 1;
    for (var wl = ql - 1; wl <= ql + 1; wl++) {
      if (wl < 1) continue;
      for (var s = 0; s + wl <= tl; s++) {
        var d = levenshtein(text.slice(s, s + wl), q);
        if (d < best) best = d;
        if (best === 0) return 0;
      }
    }
    return best <= maxD ? best : -1;
  }

  function score(t, q, qNoSpace) {
    var qn = (q || '').replace(/\s+/g, '');
    if (/(.)\1\1/.test(qn) || new Set(qn.split('')).size < 2) return -1;
    var s = 0;
    var latinShort = /^[a-z0-9]+$/.test(q) && q.length <= 3;
    qNoSpace = qNoSpace || q;
    if ((t.n || '').toLowerCase().indexOf(q) !== -1) s += 100;
    if ((t.al || []).some(function(a){ return String(a).toLowerCase().indexOf(q) === 0; })) s += 95;
    if ((t.pyi || '').indexOf(qNoSpace) === 0 && qNoSpace.length >= 2) s += 90;
    if ((t.py || '').indexOf(qNoSpace) === 0) s += 80;
    if (!latinShort) {
      if ((t.pyi || '').indexOf(qNoSpace) !== -1) s += 60;
      if ((t.py || '').indexOf(qNoSpace) !== -1) s += 50;
    }
    if ((t.d || '').toLowerCase().indexOf(q) !== -1) s += 10;
    return s;
  }

  function highlight(text, q) {
    if (!q) return ToolBox.escHtml(text);
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return ToolBox.escHtml(text).replace(re, '<mark>$1</mark>');
  }

  function renderResults(tools, q) {
    var container = document.getElementById('resultsContainer');
    if (!container) return;
    if (tools.length === 0) {
      var sug = ['JSON', '换算', '二维码', '二维码生成', '时间戳'].map(function(k) {
        return '<a href="javascript:void(0)" onclick="doSearch(\'' + k + '\')" style="color:var(--color-primary);margin:0 6px;cursor:pointer;text-decoration:none">' + k + '</a>';
      }).join('');
      container.innerHTML = '<div class="empty-state"><span class="icon">🔍</span>未找到与 “' + ToolBox.escHtml(q) + '” 相关的工具' +
        '<p style="margin:10px 0;font-size:13px;color:var(--text-muted)">试试：' + sug + '</p>' +
        '<button onclick="document.getElementById(\'searchInput\').value=\'\';doSearch(\'\')" style="margin-top:6px;padding:6px 16px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-card);color:var(--text-primary);cursor:pointer">清空搜索</button></div>';
      return;
    }
    var html = '<div class="tools-header"><h2 class="tools-title">搜索结果 <span class="tools-count">' + tools.length + ' 个工具</span></h2></div>';
    html += '<div class="results-grid">';
    html += tools.map(function(t) {
      var url = t.u || t.url || '#';
      var indName = INDUSTRY_NAMES[t.i || t.industry] || '';
      return '<a class="result-card" href="/' + url + '" target="_blank" rel="noopener">' +
        '<div class="result-head">' +
          '<span class="result-icon" style="background:' + (t.b || t.bg || '#f5f5f5') + '">' + (t.ic || t.icon || '🔧') + '</span>' +
          (indName ? '<span class="result-cat">' + ToolBox.escHtml(indName) + '</span>' : '') +
        '</div>' +
        '<div class="result-name">' + highlight(t.n || t.name || '', q) + '</div>' +
        '<div class="result-desc">' + highlight(t.d || t.desc || '', q) + '</div>' +
      '</a>';
    }).join('');
    html += '</div>';
    container.innerHTML = html;
  }

  function updateUrl(q) {
    var url = q ? 'search.html?q=' + encodeURIComponent(q) : 'search.html';
    if (history.replaceState) history.replaceState({}, '', url);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
