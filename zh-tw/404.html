a{color:inherit;text-decoration:none}

.nav-logo-text{display:flex;flex-direction:column;line-height:1.2}
.nav-logo-name{font-size:16px;font-weight:800;color:var(--dark)}
.nav-logo-sub{font-size:11px;color:var(--muted)}
.nav-actions{display:flex;align-items:center;gap:4px}
.nav-btn{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .2s;font-size:17px}

.hero h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}
.hero p{font-size:14px;color:rgba(255,255,255,0.85);margin-bottom:0}

.search-box{display:flex;align-items:center;background:#fff;border-radius:16px;box-shadow:0 12px 32px -8px rgba(0,0,0,0.12);border:2px solid transparent;transition:border-color .2s;padding:4px 6px 4px 18px}
.search-box:focus-within{border-color:var(--primary)}
.search-box svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.search-box input{flex:1;height:46px;border:none;outline:none;background:transparent;font-size:15px;color:var(--text);min-width:0}
.search-box .go-btn{flex-shrink:0;height:40px;padding:0 22px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:14px;font-weight:600;transition:opacity .2s;white-space:nowrap}

.search-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

body.dark .redirect-notice{background:rgba(255,107,53,0.1);border-color:rgba(255,107,53,0.28);color:#ff9a6c}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 26px;border-radius:12px;font-size:14px;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 6px 18px rgba(255,107,53,0.25)}

// 从 URL 提取关键词
function extractKeywords(path){
  var name = path.substring(path.lastIndexOf('/') + 1);
  name = name.replace(/\.html?$/, '').replace(/\.htm$/, '');
  return name.toLowerCase().split(/[^a-z0-9\u4e00-\u9fa5]+/).filter(function(k){ return k.length > 0; });
}

function findSuggestions(){
  var path = window.location.pathname;
  var filename = path.substring(path.lastIndexOf('/') + 1);

  // 1. 精确映射
  var target = PATH_MAP[filename];
  if(!target){
    var cleanPath = path.replace(/^\/tools\//, '');
    target = PATH_MAP[cleanPath];
  }
  if(target){
    renderSuggest([{ n:'原工具已迁移', d:'点击前往正确页面', u:target, ic:'🧭', b:'rgba(255,107,53,0.1)' }]);
    startRedirect(target, '正在前往正确页面...');
    return;
  }

  // 2. 关键词映射
  var kws = extractKeywords(path);
  var matched = [];
  kws.forEach(function(k){
    if(KEYWORD_MAP[k]){
      matched.push({ n:k.toUpperCase() + ' 相关工具', d:'点击查看', u:KEYWORD_MAP[k], ic:'🔍', b:'rgba(124,58,237,0.08)' });
    }
  });

  // 3. 异步加载搜索索引做全文匹配
  fetch('/json/search-index.json')
    .then(function(r){ return r.json(); })
    .then(function(idx){
      var results = [];
      kws.forEach(function(k){
        if(k.length < 2) return;
        idx.forEach(function(t){
          var text = ' ' + (t.n||'') + ' ' + (t.d||'') + ' ' + (t.i||'');
          if(text.toLowerCase().indexOf(k) !== -1){
            results.push({ n:t.n, d:(t.d||'').slice(0,24), u:'/'+t.u, ic:t.ic||'🔧', b:t.b||'#f5f5f5' });
          }
        });
      });
      // 去重 + 限制
      var seen = {}, uniq = [];
      results.forEach(function(t){
        if(!seen[t.u]){ seen[t.u] = 1; uniq.push(t); }
      });
      var all = matched.concat(uniq);
      if(all.length){
        renderSuggest(all.slice(0, 8));
      } else if(matched.length){
        renderSuggest(matched.slice(0, 4));
      }
    })
    .catch(function(){});

  // 无精确映射时:3 秒后自动返回首页
  startRedirect('/', '3 秒后自动返回首页...');
}

// 3 秒倒计时自动跳转
function startRedirect(url, text){
  var txt = document.getElementById('redirectText');
  var seconds = 3;
  function render(n){
    txt.textContent = (text || '') + n + ' 秒后自动' + (url === '/' ? '返回首页' : '跳转') + '...';
  }
  render(seconds);
  var timer = setInterval(function(){
    seconds--;
    if(seconds > 0) render(seconds);
  }, 1000);
  setTimeout(function(){
    clearInterval(timer);
    window.location.href = url;
  }, 3000);
}

// 主题切换
function toggleTheme(){
  var dark = document.body.classList.toggle('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}

function initTheme(){
  var t = localStorage.getItem('theme') || 'light';
  if(t === 'dark'){
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }
}

initTheme();
renderHot();
renderCats();
findSuggestions();
})();
