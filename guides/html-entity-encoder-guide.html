<h1 data-i18n="guide.html-entity-encoder.title" data-i18n-fb="HTML 实体编码与 XSS 转义">HTML 实体编码与 XSS 转义</h1>
<p class="lead" data-i18n="guide.html-entity-encoder.intro" data-i18n-fb="为什么要把 &lt; &gt; &amp; 转成实体，如何用 ToolBox 做 HTML 实体编解码与基础 XSS 防护。">为什么要把 < > & 转成实体，如何用 ToolBox 做 HTML 实体编解码与基础 XSS 防护。</p>
<div class="toc"><strong>目录</strong><ul><li><a href="#s0" data-i18n="guide.html-entity-encoder.sec0" data-i18n-fb="为什么需要实体编码">为什么需要实体编码</a></li><li><a href="#s1" data-i18n="guide.html-entity-encoder.sec1" data-i18n-fb="实体 vs 字符引用">实体 vs 字符引用</a></li><li><a href="#s2" data-i18n="guide.html-entity-encoder.sec2" data-i18n-fb="在 ToolBox 中使用">在 ToolBox 中使用</a></li><li><a href="#s3" data-i18n="guide.html-entity-encoder.sec3" data-i18n-fb="XSS 防护的边界">XSS 防护的边界</a></li></ul></div>
<h2 id="s0" data-i18n="guide.html-entity-encoder.sec0" data-i18n-fb="为什么需要实体编码">为什么需要实体编码</h2>
<p data-i18n="guide.html-entity-encoder.p0.0" data-i18n-fb="在 HTML 中直接输出  会被浏览器当作标签/脚本执行，造成 XSS。把  转成 &amp;lt;、&gt; 转成 &amp;gt;、&amp; 转成 &amp;amp;，可让特殊字符「只显示不执行」。">在 HTML 中直接输出 <code><script></code> 会被浏览器当作标签/脚本执行，造成 XSS。把 <code><</code> 转成 <code>&lt;</code>、<code>></code> 转成 <code>&gt;</code>、<code>&</code> 转成 <code>&amp;</code>，可让特殊字符「只显示不执行」。</p>
<h2 id="s1" data-i18n="guide.html-entity-encoder.sec1" data-i18n-fb="实体 vs 字符引用">实体 vs 字符引用</h2>
<p data-i18n="guide.html-entity-encoder.p1.0" data-i18n-fb="&amp;lt; 是命名实体，&amp;#60; 是十进制数字引用，&amp;#x3C; 是十六进制；三者等价，命名实体更易读。"><code>&lt;</code> 是命名实体，<code>&#60;</code> 是十进制数字引用，<code>&#x3C;</code> 是十六进制；三者等价，命名实体更易读。</p>
<h2 id="s2" data-i18n="guide.html-entity-encoder.sec2" data-i18n-fb="在 ToolBox 中使用">在 ToolBox 中使用</h2>
<p data-i18n="guide.html-entity-encoder.p2.0" data-i18n-fb="粘贴文本点击编码即可获得实体化结果，适合回填到模板/富文本前做转义；解码则把实体还原为原字符。">粘贴文本点击编码即可获得实体化结果，适合回填到模板/富文本前做转义；解码则把实体还原为原字符。</p>
<h2 id="s3" data-i18n="guide.html-entity-encoder.sec3" data-i18n-fb="XSS 防护的边界">XSS 防护的边界</h2>
<p data-i18n="guide.html-entity-encoder.p3.0" data-i18n-fb="实体编码只是输出层手段之一，不能替代参数化查询、CSP、输入校验等综合防护；对 URL、属性、JS 上下文要分别处理。">实体编码只是输出层手段之一，不能替代参数化查询、CSP、输入校验等综合防护；对 URL、属性、JS 上下文要分别处理。</p>

<div class="faq"><h2 data-i18n="guide.html-entity-encoder.sec4" data-i18n-fb="常见问题">常见问题</h2><dl><dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="属性值里也要转义引号吗？">属性值里也要转义引号吗？</dt><dd data-i18n="guide.html-entity-encoder.faqs.0.a" data-i18n-fb="要。放在双引号属性中的 &quot; 应转成 &amp;quot;，单引号属性同理转 &amp;apos;，避免提前闭合属性。">要。放在双引号属性中的 " 应转成 &quot;，单引号属性同理转 &apos;，避免提前闭合属性。</dd>
<dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="转义后还能正常显示吗？">转义后还能正常显示吗？</dt><dd data-i18n="guide.html-entity-encoder.faqs.1.a" data-i18n-fb="能。浏览器渲染时会把实体还原为对应字符显示，仅源码层面是转义形态。">能。浏览器渲染时会把实体还原为对应字符显示，仅源码层面是转义形态。</dd>
<dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="仅做 HTML 转义够防 XSS 吗？">仅做 HTML 转义够防 XSS 吗？</dt><dd data-i18n="guide.html-entity-encoder.faqs.2.a" data-i18n-fb="对 HTML 正文足够；但若内容进入 URL、on* 事件或 JS 字符串，需要对应场景的编码，单一手段并不万能。">对 HTML 正文足够；但若内容进入 URL、on* 事件或 JS 字符串，需要对应场景的编码，单一手段并不万能。</dd></dl></div>
